# NEW TG 前端运行配置：控制台 SPA 与官网静态导出共用一个域名、两个文档根。
# 路径白名单逐条对应 deploy/edge/Caddyfile 里原来由 edge 承担的那部分路由。

server {
    listen 8080;
    server_name _;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # 官网首页（精确匹配，避免吞掉控制台的 /）。
    location = / {
        root /srv/marketing;
        try_files /index.html =404;
    }

    # 官网语言首页：/en、/en/、/zh-TW …（不含其子路径）。
    location ~ "^/(pricing|en|fr|ja|ru|vi|zh-TW)/?$" {
        root /srv/marketing;
        try_files $uri $uri/index.html =404;
    }

    # 官网各语言的价格页：/pricing 之外还有 /en/pricing 等。
    location ~ "^/(en|fr|ja|ru|vi|zh-TW)/pricing/?$" {
        root /srv/marketing;
        try_files $uri $uri/index.html =404;
    }

    # 官网静态资源。^~ 让前缀匹配优先于上面的正则，避免 /_next 被 SPA 兜底截走。
    location ^~ /_next/ {
        root /srv/marketing;
        try_files $uri =404;
    }
    location = /icon.svg { root /srv/marketing; }
    location = /og.png { root /srv/marketing; }
    location = /robots.txt { root /srv/marketing; }
    location = /sitemap.xml { root /srv/marketing; }

    # 其余一律是控制台 SPA：客户端路由（/sign-in、/admin/*）回落到 index.html。
    location / {
        root /srv/web;
        try_files $uri /index.html;
    }
}
