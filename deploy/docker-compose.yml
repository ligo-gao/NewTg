# NewTG compose 骨架（M0）——拓扑依据 platform-03 §2，按计划总册 §5 裁决修订：
#   · 单二进制 newtg，三角色由 RUN_MODE 切换（无 NEWTG_ROLE）；
#   · M0 只暴露 edge :80（宿主 8080），TLS / :443 形态推迟到 M7（platform-07）；
#   · 一次性 migrate 服务先于 gateway/worker 完成（service_completed_successfully）。
#
# 净室声明：本文件全新编写，不复制、不翻译任何既有网关仓库的配置或文案。
# 密钥一律 ${VAR:?...}：deploy/.env 缺项时 docker compose 直接报错退出，绝不落默认口令。
# 应用镜像统一由 NEWTG_IMAGE 指定（默认与 Makefile 的 IMAGE ?= newtg/gateway:dev 对齐）。

name: newtg

# 应用侧公共环境。DSN 由 compose 从 deploy/.env 的插值变量拼装，
# 应用二进制只消费拼好的 DATABASE_URL / DB_LOGS_DSN / REDIS_URL。
x-app-env: &app-env
  DATABASE_URL: "postgres://newtg_app:${POSTGRES_APP_PASSWORD:?set POSTGRES_APP_PASSWORD in deploy/.env}@postgres:5432/${POSTGRES_DB:-newtg}?sslmode=${DATABASE_TLS:-disable}"
  DB_LOGS_DSN: "postgres://newtg_app:${POSTGRES_APP_PASSWORD:?set POSTGRES_APP_PASSWORD in deploy/.env}@postgres:5432/${POSTGRES_LOGS_DB:-newtg_logs}?sslmode=${DATABASE_TLS:-disable}"
  REDIS_URL: "redis${REDIS_TLS:+s}://:${REDIS_PASSWORD:?set REDIS_PASSWORD in deploy/.env}@redis:6379/0"
  SESSION_SECRET: "${SESSION_SECRET:?set SESSION_SECRET in deploy/.env}"
  CREDENTIAL_ENCRYPTION_KEY: "${CREDENTIAL_ENCRYPTION_KEY:?set CREDENTIAL_ENCRYPTION_KEY in deploy/.env}"
  APP_ENV: "${APP_ENV:-production}"
  LOG_LEVEL: "${LOG_LEVEL:-info}"
  LOG_FORMAT: "${LOG_FORMAT:-json}"
  TZ: "${TZ:-UTC}"
  # 空 = 不信任 X-Forwarded-*；生产须显式填 edge 所在网段（禁止 0.0.0.0/0）。
  TRUSTED_PROXIES: "${TRUSTED_PROXIES:-}"
  # 公开基址（可逗号分隔多个 origin）。空时回退到 setup 向导写入的
  # site.server_address；两者都空表示邮件相关功能禁用（不是启动失败）。
  # 同时作为 Origin/Referer 白名单来源；生产建议显式填写。
  PUBLIC_BASE_URL: "${PUBLIC_BASE_URL:-}"
  PERF_METRICS_ENABLED: "${PERF_METRICS_ENABLED:-true}"
  PERF_METRICS_FLUSH_INTERVAL: "${PERF_METRICS_FLUSH_INTERVAL:-5m}"
  PERF_METRICS_RETENTION_DAYS: "${PERF_METRICS_RETENTION_DAYS:-400}"
  # 独立指标库（与主库/日志库分离；未配置时 /api/model-perf 会 fail-closed）
  PERF_METRICS_DSN: "postgres://newtg_app:${POSTGRES_APP_PASSWORD:?set POSTGRES_APP_PASSWORD in deploy/.env}@postgres:5432/${POSTGRES_METRICS_DB:-newtg_metrics}?sslmode=${DATABASE_TLS:-disable}"
  # 模型性能定时实测（spec 2026-10-27）：worker 按此时刻表跑测速；gateway 不调度，
  # 但 /api/performance/config 会用**同一份** env 作为生效值回退（perfsettings.Reader：
  # system_settings.perf.schedule.* 优先，env 仅作基线），两组进程因此必须同值，
  # 否则页面报的时间/时区与实际调度不一致。管理面改保存后以 DB 值为准。
  PERF_SCHEDULE_ENABLED: "${PERF_SCHEDULE_ENABLED:-true}"
  PERF_SCHEDULE_TIMES: "${PERF_SCHEDULE_TIMES:-00:00,12:00}"
  PERF_SCHEDULE_TIMEZONE: "${PERF_SCHEDULE_TIMEZONE:-Asia/Shanghai}"
  PERF_SCHEDULE_RUNS: "${PERF_SCHEDULE_RUNS:-3}"
  PERF_SCHEDULE_CONCURRENCY: "${PERF_SCHEDULE_CONCURRENCY:-2}"
  # 性能页 Prometheus 数据源。三项都放进共享 env：不带监控 override 的部署也
  # 可以指向外部 Prometheus；override 只在 PROMETHEUS_URL 未设时补部署内默认值。
  # TIMEOUT/CACHE_TTL 由 config.Load 在启动期校验（(0s,60s] / (0s,5m]）——写成
  # 0 或负值不是「关掉」，是**进程起不来**。
  PROMETHEUS_URL: "${PROMETHEUS_URL:-}"
  PROMETHEUS_TIMEOUT: "${PROMETHEUS_TIMEOUT:-5s}"
  PROMETHEUS_CACHE_TTL: "${PROMETHEUS_CACHE_TTL:-15s}"
  # 演示模式部署侧覆盖（控制端 W13 裁决 I2）：true/1 强制开启，false/0 强制
  # 关闭，空 = 跟随站点设置 site.demo.enabled。必须放在共享 env 里：gateway
  # 的守卫/额度/计费与 worker 的兜底结算要读到**同一个**有效值；只给一个角色
  # 注入会造成「gateway 免单、worker 补扣」的跨进程分裂。空值不构成覆盖
  # （config.parseDemoEnabled 把空串视为未设置）。
  NEWTG_DEMO_ENABLED: "${NEWTG_DEMO_ENABLED:-}"

services:
  # 唯一对外入口：反向代理 + 轮询负载均衡 + 对副本做 /readyz 主动健康检查。
  # M0 不挂 443/TLS（cert_source=off 等价物），仅 :80。
  edge:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
      - "8443:8443"
    environment:
      TLS_MIN_VERSION: "${TLS_MIN_VERSION:-1.2}"
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
    volumes:
      - "./edge/Caddyfile:/etc/caddy/Caddyfile:ro"
      - "./edge/certs:/etc/caddy/certs:ro"
      - "../frontend/dist:/srv/web:ro"
      - "../website/out:/srv/marketing:ro"
      - "caddy_data:/data"
      - "caddy_config:/config"
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      - frontend

  # 管理 API + 中继；2 副本用于验证无状态（不设 container_name，避免与副本数冲突）。
  gateway:
    image: ${NEWTG_IMAGE:-newtg/gateway:dev}
    restart: unless-stopped
    # Docker 默认只等 10s 就 SIGKILL，短于应用 SHUTDOWN_GRACE_SECONDS（默认 30）：
    # 优雅停机窗口未走完进程即被强杀，在途请求会被硬断。35s 为 30s 窗口留 5s 余量。
    stop_grace_period: 35s
    deploy:
      replicas: 2
    environment:
      <<: *app-env
      RUN_MODE: gateway
      # 迁移由一次性 migrate 服务以 newtg_migrate 执行；运行时账号无 DDL。
      DB_MIGRATE_ON_START: "false"
      METRICS_ADDR: ":8006"
      METRICS_TOKEN: "${METRICS_TOKEN:-}"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # GC-6：健康 = 真正可服务（/readyz 五项）；运行镜像无 wget，走内置子命令。
      test: ["CMD", "/newtg", "healthcheck", "--url", "http://127.0.0.1:3000/readyz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    networks:
      - frontend
      - backend

  # 一次性迁移：唯一 DDL 账号 newtg_migrate；跑完即退出（成功退出码 0）。
  migrate:
    image: ${NEWTG_IMAGE:-newtg/gateway:dev}
    restart: "no"
    # 一次性迁移若在事务中途被 SIGKILL，schema_migrations 会留下 dirty=true；
    # 与其他应用角色同取 35s，覆盖应用侧 SHUTDOWN_GRACE_SECONDS（默认 30）。
    stop_grace_period: 35s
    environment:
      <<: *app-env
      RUN_MODE: migrate
      DATABASE_URL: "postgres://newtg_migrate:${POSTGRES_MIGRATE_PASSWORD:?set POSTGRES_MIGRATE_PASSWORD in deploy/.env}@postgres:5432/${POSTGRES_DB:-newtg}?sslmode=${DATABASE_TLS:-disable}"
      DB_LOGS_DSN: "postgres://newtg_migrate:${POSTGRES_MIGRATE_PASSWORD:?set POSTGRES_MIGRATE_PASSWORD in deploy/.env}@postgres:5432/${POSTGRES_LOGS_DB:-newtg_logs}?sslmode=${DATABASE_TLS:-disable}"
      # 迁移用 DDL 角色；运行时 gateway/worker 用 x-app-env 里的 newtg_app。
      PERF_METRICS_DSN: "postgres://newtg_migrate:${POSTGRES_MIGRATE_PASSWORD:?set POSTGRES_MIGRATE_PASSWORD in deploy/.env}@postgres:5432/${POSTGRES_METRICS_DB:-newtg_metrics}?sslmode=${DATABASE_TLS:-disable}"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  # 后台任务；单副本，允许固定名。M0 无对外 HTTP，探活为进程存活（R-07）。
  worker:
    image: ${NEWTG_IMAGE:-newtg/gateway:dev}
    restart: unless-stopped
    container_name: newtg-worker
    # 与 gateway 同理：worker 同样消费 SHUTDOWN_GRACE_SECONDS，必须留足优雅退出窗口。
    stop_grace_period: 35s
    deploy:
      replicas: 1
    environment:
      <<: *app-env
      RUN_MODE: worker
      DB_MIGRATE_ON_START: "false"
      NODE_NAME: "${NODE_NAME:-newtg}-worker"
      # W10-N10/N11：保留/维护主体的日志库 DSN。只授 worker（gateway 不执行
      # DROP/DELETE）；与 app DSN 角色/口令独立，缺失时保留任务 fail-closed。
      DB_RETENTION_DSN: "postgres://newtg_retention:${POSTGRES_RETENTION_PASSWORD:?set POSTGRES_RETENTION_PASSWORD in deploy/.env}@postgres:5432/${POSTGRES_LOGS_DB:-newtg_logs}?sslmode=${DATABASE_TLS:-disable}"
      # holiday_sync（spec §5.2.1）：只在 worker 执行。默认开启，经 egress
      # 网络拉取 holiday-cn 年度 JSON；离线部署置 false 即可零出站。
      HOLIDAY_SYNC_ENABLED: "${HOLIDAY_SYNC_ENABLED:-true}"
      HOLIDAY_SYNC_URL_TEMPLATE: "${HOLIDAY_SYNC_URL_TEMPLATE:-https://cdn.jsdelivr.net/gh/NateScarlet/holiday-cn@master/%d.json}"
      METRICS_ADDR: ":8006"
      METRICS_TOKEN: "${METRICS_TOKEN:-}"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # W10-METRICS：worker 的 /readyz（五项判定）与 /metrics 同暴露在
      # METRICS_ADDR；用二进制自带 healthcheck 子命令，2xx 即健康。
      test: ["CMD", "/newtg", "healthcheck", "--url", "http://127.0.0.1:8006/readyz"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 20s
    networks:
      - backend
      # R-23：worker 不是纯内网进程——渠道测试（A1）、余额刷新（B8）、凭据刷新（B11）、
      # GeoIP 下载（B14）、Webhook 投递（N8）都要求出站（security-08 §2.11
      # 「worker 出站的归属」）。backend 是 internal，专供 DB/Redis；出站单独走 egress。
      - egress

  # 可选：静态前端。M0 默认不开 profile，"/" 由 gateway 托管静态产物。
  web:
    image: nginx:alpine
    restart: unless-stopped
    profiles: ["web"]
    volumes:
      - "../frontend/dist:/usr/share/nginx/html:ro"
    networks:
      - frontend

  # 唯一持久化：主库 newtg + 日志库 newtg_logs（G7-R36）。不发布宿主端口。
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-newtg}"      # 引导超级用户：仅 initdb 建库/建角色
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}"
      POSTGRES_DB: "${POSTGRES_DB:-newtg}"
      # 以下四项只被 postgres-init/10-roles.sql 读取（psql \getenv），与引导口令无派生关系。
      POSTGRES_APP_PASSWORD: "${POSTGRES_APP_PASSWORD:?set POSTGRES_APP_PASSWORD in deploy/.env}"
      POSTGRES_MIGRATE_PASSWORD: "${POSTGRES_MIGRATE_PASSWORD:?set POSTGRES_MIGRATE_PASSWORD in deploy/.env}"
      POSTGRES_BACKUP_PASSWORD: "${POSTGRES_BACKUP_PASSWORD:?set POSTGRES_BACKUP_PASSWORD in deploy/.env}"
      POSTGRES_RETENTION_PASSWORD: "${POSTGRES_RETENTION_PASSWORD:?set POSTGRES_RETENTION_PASSWORD in deploy/.env}"
      # 日志库名由 20-databases.sql 读取，与 DB_LOGS_DSN 保持同一插值变量。
      POSTGRES_LOGS_DB: "${POSTGRES_LOGS_DB:-newtg_logs}"
    volumes:
      - "pg_data:/var/lib/postgresql/data"
      # initdb 只跑一次（空数据卷时）：建三角色 + 日志库 + 默认权限。
      - "./postgres-init:/docker-entrypoint-initdb.d:ro"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - backend

  # 会话 / 限流 / 缓存 / 分布式锁 / pub-sub。AOF 保证重启不丢会话。
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      # 供 healthcheck 的 redis-cli 取用（command 里的口令由 compose 插值注入）。
      REDIS_PASSWORD: "${REDIS_PASSWORD:?set REDIS_PASSWORD in deploy/.env}"
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in deploy/.env}", "--appendonly", "yes"]
    volumes:
      - "redis_data:/data"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - backend

  # 按需备份（只读角色 newtg_backup）：
  #   docker compose --profile ops run --rm pg-backup
  pg-backup:
    image: postgres:16-alpine
    profiles: ["ops"]
    environment:
      PGPASSWORD: "${POSTGRES_BACKUP_PASSWORD:?set POSTGRES_BACKUP_PASSWORD in deploy/.env}"
    volumes:
      - "./backups:/backups"
    command:
      - "sh"
      - "-c"
      - "pg_dump -h postgres -U newtg_backup -d ${POSTGRES_DB:-newtg} -Fc -f /backups/newtg-$$(date +%Y%m%d%H%M%S).dump"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

volumes:
  pg_data:
    name: newtg_pg_data
  redis_data:
    name: newtg_redis_data
  caddy_data:
    name: newtg_caddy_data
  caddy_config:
    name: newtg_caddy_config

networks:
  # 对外入口面：edge ↔ gateway / web。
  frontend:
    driver: bridge
  # 数据面：gateway / worker / migrate ↔ postgres / redis；internal 禁外网出站。
  backend:
    driver: bridge
    internal: true
  # 出站面（R-23）：只挂 worker。非 internal，用于渠道测试/Webhook/GeoIP 等对外调用
  # （security-08 §2.11 覆盖 13.2.4/13.2.5）。把出站与数据面拆成两张网，backend
  # 继续 internal: true，postgres/redis 不接此网，DB/缓存仍无外网可达路径。
  egress:
    driver: bridge
