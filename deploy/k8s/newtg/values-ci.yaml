# 仅供 `helm lint` / `helm template` 与 verify.sh 使用；真实部署不要用这份。
image:
  registry: registry.example.com
publicBaseURL: https://app.example.com
trustedProxies: 10.244.3.0/27
ingress:
  host: app.example.com
storageClass:
  data: local-path
backup:
  image: registry.example.com/newtg/backup:ci
  ageRecipient: age1exampleexampleexampleexampleexampleexample
  s3:
    endpoint: https://minio.example.com
    bucket: newtg-backup
    region: us-east-1
networkPolicy:
  nodeCIDR: 10.0.20.0/24
  # 让监控放行规则真的渲染出来，verify.sh 才能断言它存在。
  monitoringNamespace: monitoring
redis:
  # 数据节点污点独占是真实部署的常态；这里一并渲染，断言钉住。
  nodeSelector:
    newtg.io/pool: data-redis
  tolerations:
    - key: newtg.io/data
      operator: Exists
      effect: NoSchedule
