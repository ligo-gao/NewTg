# NEW TG chart values。
# 密钥一律不在 chart 内生成：所有 Secret 由集群外预创建，chart 只引用名字。
# 必填项留空串，模板里用 required 强制填，缺项直接渲染失败而不是带默认值上线。

namespace: newtg

image:
  registry: "" # 必填：镜像仓库地址，如 registry.example.com
  gateway: newtg/gateway
  frontend: newtg/frontend
  tag: dev
  pullPolicy: IfNotPresent
  pullSecrets: []

gateway:
  replicas: 2
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      # 内存上限是 OOM 保护而非预留；连接数上限由 DB_MAX_OPEN_CONNS 控制。
      memory: 1Gi
  autoscaling:
    # maxReplicas 与 DB_MAX_OPEN_CONNS=25 绑定：8×25=200，再加上 worker 与
    # migrate 仍低于 PG 的 max_connections 基线 256。改这里必须同时改那边。
    enabled: true
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilizationPercentage: 70

worker:
  # 单副本 + Recreate：后台调度（性能探测、节假日同步、保留任务）不是幂等
  # 多实例安全的，两个 worker 会重复跑同一时刻的任务。扩容前先让它幂等。
  replicas: 1
  # 写进 NODE_NAME：日志/指标里要能区分角色。
  nodeName: worker
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi

frontend:
  replicas: 2
  # 只做静态文件与 SPA 回落，CPU/内存都很低；请求压力落在 gateway 上。
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 256Mi

publicBaseURL: "" # 必填：唯一 origin，如 https://app.example.com
trustedProxies: "" # 必填：ingress-nginx 控制器所在 Pod 网段，禁止 0.0.0.0/0

secrets:
  # 预创建，键清单见 README。chart 绝不渲染 Secret。
  existingSecret: newtg-secrets

ingress:
  className: nginx
  host: "" # 必填：与 publicBaseURL 的 host 一致
  tlsSecretName: newtg-tls

certificate:
  enabled: true
  issuerRef:
    name: letsencrypt-dns
    kind: ClusterIssuer

redis:
  image: redis:7-alpine
  storage:
    size: 10Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      # 会话/限流/缓存/锁全在这里，占用随在线用户增长。
      memory: 1Gi
  tls:
    # 预创建，键：ca.crt（私有 CA）、tls.crt / tls.key（服务端证书）。
    existingSecret: newtg-redis-tls

postgres:
  image: postgres:16-alpine
  storage:
    size: 50Gi
  # 连接上限是集群级预算：gateway 8 副本 × DB_MAX_OPEN_CONNS 25 = 200，
  # 再加 worker/migrate 与运维会话。低于 200 就要先降 HPA 上限。
  maxConnections: 256
  # 库名与用户名不是密钥，但必须与 Secret 里的四个 DSN 对得上：
  # 改这里就要同步改 DATABASE_URL / DB_LOGS_DSN / PERF_METRICS_DSN。
  user: newtg
  database: newtg
  logsDatabase: newtg_logs
  metricsDatabase: newtg_metrics
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      # PG 的内存里 shared_buffers 只占一部分，上限给到 2Gi 留出排序/哈希空间。
      memory: 2Gi
  # 数据节点通常打污点独占：让 PG 落在专用机器上，不被应用 Pod 抢 CPU/IO。
  nodeSelector: {}
  tolerations: []

storageClass:
  data: "" # 必填：PG/Redis 的本地盘 StorageClass

backup:
  enabled: true
  s3:
    endpoint: ""
    bucket: ""
    region: ""
    credentialsSecret: newtg-backup-s3

monitoring:
  enabled: false

networkPolicy:
  enabled: true
  ingressNamespace: ingress-nginx
  nodeCIDR: "" # 必填：kubelet 探针来源网段，缺项会让探针被 CNI 拦掉
