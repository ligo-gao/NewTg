apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: {{ include "newtg.namespace" . }}
  labels:
    {{- include "newtg.labels" (dict "root" . "role" "gateway") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 3000
      targetPort: http
    # 指标端口不经过 Ingress：ServiceMonitor 直接抓 Pod 网段。
    - name: metrics
      port: 8006
      targetPort: metrics
