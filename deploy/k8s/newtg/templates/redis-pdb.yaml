apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: redis
  namespace: {{ include "newtg.namespace" . }}
  labels:
    {{- include "newtg.labels" (dict "root" . "role" "redis") | nindent 4 }}
spec:
  # 单副本：驱逐即停机（会话/限流状态都在内存 + AOF），只能由人决定。
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
      app.kubernetes.io/instance: {{ .Release.Name }}
