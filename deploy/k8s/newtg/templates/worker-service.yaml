# worker 不接业务流量，但 /metrics 要被 Prometheus 发现（与 gateway 共用
# METRICS_TOKEN）。没有这个 Service，ServiceMonitor 就没有可选的端点对象，
# worker 的计费/保留任务指标永远抓不到——而这类任务「没数据也看不出来」。
apiVersion: v1
kind: Service
metadata:
  name: worker
  namespace: {{ include "newtg.namespace" . }}
  labels:
    {{- include "newtg.labels" (dict "root" . "role" "worker") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: worker
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: metrics
      port: 8006
      targetPort: metrics
