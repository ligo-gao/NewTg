apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: {{ include "newtg.namespace" . }}
  labels:
    {{- include "newtg.labels" (dict "root" . "role" "redis") | nindent 4 }}
spec:
  # headless：单实例，不需要负载均衡；REDIS_URL 里的 host 就是 redis。
  clusterIP: None
  selector:
    app.kubernetes.io/name: redis
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: redis
      port: 6379
      targetPort: redis
