# 前端：控制台 SPA + 官网静态文件，镜像来自 frontend/Dockerfile（nginx，监听 8080）。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: {{ include "newtg.namespace" . }}
  labels:
    {{- include "newtg.labels" (dict "root" . "role" "frontend") | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicas }}
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "newtg.labels" (dict "root" . "role" "frontend") | nindent 8 }}
    spec:
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # nginx 没有需要排空的长连接，30s 足够它收尾。
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        # nginx-unprivileged 镜像里的 nginx 用户 uid。
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: frontend
              app.kubernetes.io/instance: {{ .Release.Name }}
      containers:
        - name: frontend
          image: {{ include "newtg.image" (dict "root" . "repo" .Values.image.frontend) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8080
          # 就绪 = 能返回首页；存活只看 /robots.txt，它是静态文件，不碰后端。
          # 让前端存活探针依赖 gateway 会在网关滚动时把前端一起重启。
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 3
            failureThreshold: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /robots.txt
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          volumeMounts:
            # 只读根文件系统：nginx 的临时文件与 pid 都落在 /tmp。
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
