apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: {{ include "newtg.namespace" . }}
  labels:
    {{- include "newtg.labels" (dict "root" . "role" "frontend") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    # 对外 80、容器内 8080：非 root 进程绑不了 80，映射在这一层做。
    - name: http
      port: 80
      targetPort: http
