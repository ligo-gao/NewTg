apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: gateway
  namespace: {{ include "newtg.namespace" . }}
  labels:
    {{- include "newtg.labels" (dict "root" . "role" "gateway") | nindent 4 }}
spec:
  # 节点排空/升级时最多同时掉 1 个副本（2 副本下即保底 1 个可用）。
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway
      app.kubernetes.io/instance: {{ .Release.Name }}
