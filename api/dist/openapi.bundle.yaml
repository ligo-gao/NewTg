    ClaudeError429:
      description: |
        触发中继准入限流（Claude 形 `rate_limit_error`）。`Retry-After` 为建议
        重试的整数秒数；message 文案中的秒数与之一致。
      headers:
        Retry-After:
          description: 建议重试等待秒数（向上取整）
          schema:
            type: integer
            minimum: 0
        X-Request-ID:
          description: '请求 ID；响应体 `message` 末尾也附带 `(requestId: <id>)`'
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ClaudeError'
    ClaudeError500:
