        额度、不退款（billing-08 §3.5 P1）。仅本人 active 实例可取消；他人实例
        与不存在统一 404（不泄露存在性）；expired/cancelled 终态 → 409。已置位
        的重复调用仍返回 200（条件 UPDATE 幂等）。

        请求无 body；携带任何字段返回 403 field_not_writable。响应为用户侧订阅
        投影，不含 user_id/order_id/价格。
