          items:
            type: string
    HomeStats:
      type: object
      additionalProperties: false
      required:
        - upstreams
        - models
        - endpoints
        - routing_dims
      properties:
        upstreams:
          type: integer
          format: int64
          minimum: 0
          description: 已启用渠道去重到上游服务商类型后的数量。
        models:
          type: integer
          format: int64
          minimum: 0
          description: 与 /api/pricing 同一可见集合的计数。
        endpoints:
          type: integer
          format: int64
          description: 冻结协议端点目录大小（3）。
        routing_dims:
          type: integer
          format: int64
          description: 冻结调度控制维度大小（6）。
    RankingsPeriod:
      type: string
      enum:
        - today
        - week
        - month
        - year
      x-enum-varnames:
        - RankingsPeriodToday
        - RankingsPeriodWeek
        - RankingsPeriodMonth
        - RankingsPeriodYear
      description: 排行榜统计周期（缺省 week）。
    RankingsWindow:
      type: object
      additionalProperties: false
      required:
        - start
        - end
      properties:
        start:
          type: string
          format: date-time
          description: 窗口起点（站点时区 RFC3339，含偏移）。
        end:
          type: string
          format: date-time
          description: 窗口终点（≥ start）。
    RankingsStatus:
      type: string
      enum:
        - ok
        - partial
        - empty
      x-enum-varnames:
        - RankingsStatusOk
        - RankingsStatusPartial
        - RankingsStatusEmpty
      description: empty=全窗口无模型达阈值（冷启动）；partial 当前不会产生。
    RankingsModel:
      type: object
      additionalProperties: false
      required:
        - rank
        - model
        - display_name
        - author
        - total_tokens
        - requests
        - delta_tokens
        - delta_pct
        - prev_rank
      description: |
        模型榜一行。delta_tokens/delta_pct/prev_rank 可为 null：
        `prev_rank=null` 表示上一窗口样本不足或模型新增；`delta_pct=null`
        表示上一窗口该模型 token 为 0（前端显示「新增」）。D6a 聚合在
        「无上一窗口」时把 prev 视为 0，因此 `delta_tokens` 此时等于当前
        total_tokens；只有数据库确为 NULL 时才下发 null。
      properties:
        rank:
          type: integer
          minimum: 1
          description: 竞赛排名（并列同名次、下一名跳号）。
        model:
          type: string
          maxLength: 128
        display_name:
          type: string
          maxLength: 128
          description: 展示名快照；缺失时等于 model。
        author:
          type: string
          maxLength: 64
          description: 模型作者/供应商；缺失时为 Unknown。
        total_tokens:
          type: integer
          format: int64
          minimum: 0
        requests:
          type: integer
          format: int64
          minimum: 0
        delta_tokens:
          anyOf:
            - type: integer
              format: int64
            - enum:
                - null
        delta_pct:
          anyOf:
            - type: number
              format: double
            - enum:
                - null
          description: 环比百分比（保留 2 位）；上一窗口 token 为 0 时为 null。
        prev_rank:
          anyOf:
            - type: integer
              minimum: 1
            - enum:
                - null
    RankingsMover:
      type: object
      additionalProperties: false
      required:
        - model
        - author
        - delta_pct
        - cur_tokens
        - prev_tokens
      properties:
        model:
          type: string
          maxLength: 128
        author:
          type: string
          maxLength: 64
        delta_pct:
          type: number
          format: double
          description: 上升项 >0（降序）、下降项 <0（升序）。
        cur_tokens:
          type: integer
          format: int64
          minimum: 0
        prev_tokens:
          type: integer
          format: int64
          minimum: 0
    RankingsMovers:
      type: object
      additionalProperties: false
      required:
        - up
        - down
      properties:
        up:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/RankingsMover'
        down:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/RankingsMover'
    RankingsProvider:
      type: object
      additionalProperties: false
      required:
        - rank
        - author
        - total_tokens
        - share_pct
        - slot
      description: |
        作者/供应商排名一行。`series` 是可选字段：作者榜 Top 5 下发该周期的
        token 时间桶（与 `trend.buckets` 一一对齐），其余作者省略；Other 由
        前端按 100% 份额余量表达。
      properties:
        rank:
          type: integer
          minimum: 1
        author:
          type: string
          maxLength: 64
        total_tokens:
          type: integer
          format: int64
          minimum: 0
        share_pct:
          type: number
          format: double
          minimum: 0
          maximum: 100
          description: 占本窗口全部入榜 token 的比例；全表合计 100.00。
        slot:
          anyOf:
            - type: integer
              minimum: 1
              maximum: 8
            - enum:
                - null
          description: 实体稳定色板槽位；色板耗尽时为 null（不回绕/不重排）。
        series:
          type: array
          items:
            type: integer
            format: int64
            minimum: 0
          description: |
            该作者当前周期的 token 桶，长度与 `trend.buckets` 相同、按下标对齐
            （缺失桶补 0）。只有作者榜 Top 5 返回；其余作者无此字段。
    RankingsGranularity:
      type: string
      enum:
        - hour
        - day
        - week
      x-enum-varnames:
        - RankingsGranularityHour
        - RankingsGranularityDay
        - RankingsGranularityWeek
      description: 趋势桶粒度（today→hour、week/month→day、year→week）。
    RankingsTrendSeries:
      type: object
      additionalProperties: false
      required:
        - model
        - slot
        - tokens
      properties:
        model:
          type: string
          maxLength: 128
          description: 模型名；归并系列固定为 Other。
        slot:
          anyOf:
            - type: integer
              minimum: 1
              maximum: 8
            - enum:
                - null
          description: 实体稳定槽位；Other 无槽位（null）。
        tokens:
          type: array
          items:
            type: integer
            format: int64
            minimum: 0
          description: 长度等于 trend.buckets；缺失点为 0。
    RankingsTrend:
      type: object
      additionalProperties: false
      required:
        - granularity
        - buckets
        - series
      description: |
        历史趋势：today→hour、week/month→day、year→week（R-D6-04）。
        series 最多 6 个实体 + Other（§C1.9）。
      properties:
        granularity:
          $ref: '#/components/schemas/RankingsGranularity'
        buckets:
          type: array
          items:
            type: string
            format: date-time
          description: 时间桶起点（站点时区 RFC3339），升序。
        series:
          type: array
          maxItems: 7
          items:
            $ref: '#/components/schemas/RankingsTrendSeries'
    RankingsResponse:
      type: object
      additionalProperties: false
      required:
        - period
        - timezone
        - window
        - computed_at
        - freshness_seconds
        - sample_threshold
        - status
        - models
        - movers
        - providers
        - trend
      description: |
        GET /api/rankings 的完整快照投影。字段白名单：不含任何用户、令牌、
        渠道或上游名称维度。冷启动（从未生成过快照）时 status=empty 且
        computed_at/freshness_seconds 为 null；有快照时两者必有值。
      properties:
        period:
          $ref: '#/components/schemas/RankingsPeriod'
        timezone:
          type: string
          description: 统计窗口使用的站点时区（`site.timezone`，IANA 名）。
        window:
          $ref: '#/components/schemas/RankingsWindow'
        computed_at:
          anyOf:
            - type: string
              format: date-time
            - enum:
                - null
          description: 快照聚合完成时刻（站点时区 RFC3339）；冷启动为 null。
        freshness_seconds:
          anyOf:
            - type: integer
              format: int64
              minimum: 0
            - enum:
                - null
          description: 请求时刻与 computed_at 的差值；冷启动为 null。
        sample_threshold:
          type: integer
          minimum: 50
          maximum: 100000
          description: 本次快照采用的模型最小样本阈值 N（`site.rankings_min_samples`）。
        status:
          $ref: '#/components/schemas/RankingsStatus'
        models:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/RankingsModel'
        movers:
          $ref: '#/components/schemas/RankingsMovers'
        providers:
          type: array
          items:
            $ref: '#/components/schemas/RankingsProvider'
        trend:
          $ref: '#/components/schemas/RankingsTrend'
    LiveFeedUpstream:
      type: string
      enum:
        - openai
        - anthropic
        - gemini
        - unknown
      x-enum-varnames:
        - LiveFeedUpstreamOpenai
        - LiveFeedUpstreamAnthropic
        - LiveFeedUpstreamGemini
        - LiveFeedUpstreamUnknown
      description: 渠道类型映射的协议族；无来源为 unknown。
    LiveFeedStatus:
      type: string
      enum:
        - ok
        - error
      x-enum-varnames:
        - LiveFeedStatusOk
        - LiveFeedStatusError
      description: 调用结果（不暴露错误码细节）。
    LiveFeedEvent:
      type: object
      additionalProperties: false
      required:
        - id
        - ts
        - model
        - upstream
        - tokens_in
        - tokens_out
        - latency_ms
        - status
      description: |
        单条脱敏调用事件。绝不包含 user_id/username/email/IP/UA/令牌/
        channel_id/channel 名/base_url/prompt/response/request_id 原文，
        也不含费用（裁决 A-1：费用只在聚合条，且逐行受部署粒度影响）。
      properties:
        id:
          type: string
          pattern: ^[0-9a-f]{8}$
          description: request_id 的不可逆 8 位十六进制短哈希，仅作列表 key。
        ts:
          type: string
          format: date-time
        model:
          type: string
          maxLength: 128
        upstream:
          $ref: '#/components/schemas/LiveFeedUpstream'
        tokens_in:
          type: integer
          minimum: 0
        tokens_out:
          type: integer
          minimum: 0
        latency_ms:
          type: integer
          format: int64
          minimum: 0
        status:
          $ref: '#/components/schemas/LiveFeedStatus'
    LiveFeedWindow:
      type: object
      additionalProperties: false
      required:
        - calls
        - cost_credits
      description: |
        聚合条读数。窗口冻结为**近 60 秒**（F-09-02）：服务端按分钟桶累加
        当前分钟桶，属于 0–60s 近似（跨分钟时读数从整分钟重置到新桶）。
        calls 计所有已发布事件；cost_credits 只计成功事件的整数积分
        （失败/退款不计费用）。这是平台级聚合，不含任何单条调用费用，也不含
        用户/渠道维度。
      properties:
        calls:
          type: integer
          format: int64
          minimum: 0
          description: 近 60 秒调用次数（成功与失败都计入）。
        cost_credits:
          type: integer
          format: int64
          minimum: 0
          description: 近 60 秒成功调用的消耗积分（整数，取结算事实）。
    LiveFeedList:
      type: object
      additionalProperties: false
      required:
        - events
        - window
      description: |
        轮询降级响应。事件按时间倒序（最新在前）。window 为 F-09-02 聚合条；
        逐行事件不含费用（裁决 A-1）。
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/LiveFeedEvent'
        window:
          $ref: '#/components/schemas/LiveFeedWindow'
    PublicGroupPrice:
      type: object
      additionalProperties: false
      required:
        - group
        - ratio
        - prompt
        - completion
        - cache_read
        - cache_write
        - source
      properties:
        group:
          type: string
        ratio:
          anyOf:
            - type: integer
            - enum:
                - null
          description: 分组倍率（整数百分比，120 = 1.20x）。
        prompt:
          anyOf:
            - type: string
              pattern: ^[0-9]+$
            - enum:
                - null
        completion:
          anyOf:
            - type: string
              pattern: ^[0-9]+$
            - enum:
                - null
        cache_read:
          anyOf:
            - type: string
              pattern: ^[0-9]+$
            - enum:
                - null
        cache_write:
          anyOf:
            - type: string
              pattern: ^[0-9]+$
            - enum:
                - null
        source:
          type: string
          description: override=覆盖价；ratio=基准价 × 倍率 ÷ 100（服务端整数运算）。
    PublicPricingWindow:
      type: object
      additionalProperties: false
      required:
        - name
        - days
        - start
        - end
        - multiplier
      properties:
        name:
          type: string
          maxLength: 64
        days:
          type: array
          minItems: 1
          items:
            type: integer
            minimum: 1
            maximum: 7
          description: 1=周一 … 7=周日；跨夜窗口指窗口开始的那一天。
        start:
          type: string
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
        end:
          type: string
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
          description: end <= start 表示跨夜。
        multiplier:
          type: number
          format: double
    PublicPricingSchedule:
      type: object
      additionalProperties: false
      required:
        - kind
        - timezone
        - default_multiplier
        - holiday_policy
        - windows
      properties:
        kind:
          type: string
          enum:
            - flat
            - peak_offpeak
          description: 结构化枚举，前端按七种语言本地化。
        timezone:
          type: string
          description: 策略自己的 IANA 时区（不随站点时区变更）。
        default_multiplier:
          type: number
          format: double
          description: 未命中窗口（以及 cn_offpeak 的法定假日）使用的倍率。
        holiday_policy:
          type: string
          enum:
            - none
            - cn_offpeak
        windows:
          type: array
          items:
            $ref: '#/components/schemas/PublicPricingWindow'
          description: 同一时刻命中多个窗口时数组顺序最后一条生效。
    PublicModelCard:
      type: object
      additionalProperties: false
      required:
        - model_id
        - display_name
        - vendor
        - capabilities
        - context_length
        - max_output
        - mode
        - prompt_price
        - completion_price
        - cache_read_price
        - cache_write_price
        - is_free
        - group_price
        - pricing_schedule
        - endpoints
        - tags
        - description
      properties:
        model_id:
          type: string
          maxLength: 128
        display_name:
          type: string
          description: 有档案时取档案 display_name；无档案（或空串）回退 model_id（D1-15/D1-16）。
        vendor:
          type: string
          description: |
            三级回退（D1-16）：档案关联的 vendors.name → model_pricing.vendor →
            model_id 首个 `/` 前缀；都不可得时为空串。
        capabilities:
          type: array
          items:
            type: string
          description: 档案 capabilities 枚举；无档案时为空数组。
        context_length:
          anyOf:
            - type: integer
              format: int64
              minimum: 0
            - enum:
                - null
          description: 档案 context_length；无档案或未设置时为 null。
        max_output:
          anyOf:
            - type: integer
              format: int64
              minimum: 0
            - enum:
                - null
          description: 档案 max_output；无档案或未设置时为 null。
        mode:
          type: string
          description: per_token 或 per_request（MVP 仅两种）。
        prompt_price:
          anyOf:
            - type: string
              pattern: ^[0-9]+$
            - enum:
                - null
          description: int64 的 JSON 字符串；DB NULL 时为 null（R-PUB-03）。
        completion_price:
          anyOf:
            - type: string
              pattern: ^[0-9]+$
            - enum:
                - null
        cache_read_price:
          anyOf:
            - type: string
              pattern: ^[0-9]+$
            - enum:
                - null
        cache_write_price:
          anyOf:
            - type: string
              pattern: ^[0-9]+$
            - enum:
                - null
        is_free:
          type: boolean
          description: 四项有效价全部显式 0；NULL 不算 0（R-PUB-03）。
        group_price:
          anyOf:
            - $ref: '#/components/schemas/PublicGroupPrice'
            - enum:
                - null
          description: 仅登录或显式 group（且 expose=true）时出现（R-PUB-05）。
        pricing_schedule:
          anyOf:
            - $ref: '#/components/schemas/PublicPricingSchedule'
            - enum:
                - null
          description: |
            时段计价表：strategy.time.enabled=true 时非 null，否则为 null
            （未启用时段时响应与旧版逐字段一致）。非法策略同样降级为 null
            并记录告警，不阻断公开目录。
        endpoints:
          type: array
          items:
            type: string
          description: |
            档案 endpoints 派生的协议端点枚举（D1-19）；未知路径忽略，无档案时
            为空数组。
        tags:
          type: array
          items:
            type: string
          description: 档案 tags；无档案时为空数组。
        description:
          type: string
          description: 档案 description；无档案时为空串。
    PublicFacetOption:
      type: object
      additionalProperties: false
      required:
        - value
        - label
        - count
      properties:
        value:
          type: string
        label:
          type: string
        count:
          type: integer
          format: int64
          minimum: 0
    PublicGroupFacet:
      type: object
      additionalProperties: false
      required:
        - value
        - label
        - ratio
        - count
      properties:
        value:
          type: string
        label:
          type: string
        ratio:
          anyOf:
            - type: integer
            - enum:
                - null
          description: 匿名且 expose_group_ratios=false 时为 null（R-PUB-05）。
        count:
          type: integer
          format: int64
          minimum: 0
    PublicPricingTypeFacet:
      type: object
      additionalProperties: false
      required:
        - value
        - count
      properties:
        value:
          type: string
          enum:
            - token
            - request
        count:
          type: integer
          format: int64
          minimum: 0
    PublicFacets:
      type: object
      additionalProperties: false
      required:
        - vendors
        - capabilities
        - context
        - groups
        - endpoints
        - pricing_types
      properties:
        vendors:
          type: array
          items:
            $ref: '#/components/schemas/PublicFacetOption'
        capabilities:
          type: array
          description: |
            档案 capabilities 计数（D1-18）；忽略本组自身筛选，未知值丢弃，
            无档案模型不计入。无任何档案能力时为空数组。
          items:
            $ref: '#/components/schemas/PublicFacetOption'
        context:
          type: array
          description: |
            档案 context_length 分档计数（D1-20）：8K（≤8,192）、32K
            （8,193–32,768）、128K（32,769–131,072）、200K+（>131,072），
            null 不计数。无档案时为空数组。
          items:
            $ref: '#/components/schemas/PublicFacetOption'
        groups:
          type: array
          items:
            $ref: '#/components/schemas/PublicGroupFacet'
        endpoints:
          type: array
          description: |
            档案 endpoints 派生枚举计数（D1-19）；未知路径忽略，无档案模型
            不计入。无任何档案端点时为空数组。
          items:
            $ref: '#/components/schemas/PublicFacetOption'
        pricing_types:
          type: array
          items:
            $ref: '#/components/schemas/PublicPricingTypeFacet'
    PublicPricingMeta:
      type: object
      additionalProperties: false
      required:
        - credit_symbol
        - quota_per_unit
        - usd_exchange_rate
        - version
        - generated_at
      properties:
        credit_symbol:
          type: string
        quota_per_unit:
          type: integer
          format: int64
        usd_exchange_rate:
          type: number
          format: double
        version:
          type: string
        generated_at:
          type: string
          format: date-time
    PublicPricingList:
      type: object
      additionalProperties: false
      required:
        - items
        - total
        - page
        - page_size
        - facets
        - meta
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PublicModelCard'
        total:
          type: string
          pattern: ^[0-9]+$
          description: 命中总数（int64 的 JSON 字符串，防前端精度丢失）。
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
          maximum: 100
        facets:
          $ref: '#/components/schemas/PublicFacets'
        meta:
          $ref: '#/components/schemas/PublicPricingMeta'
    PublicModelParameter:
      type: object
      additionalProperties: false
      required:
        - name
        - required
        - type
        - default
        - description
      properties:
        name:
          type: string
        required:
          type: boolean
        type:
          type: string
        default: {}
        description:
          type: string
    PublicRateLimit:
      type: object
      additionalProperties: false
      required:
        - group
        - user_model_rpm
      properties:
        group:
          type: string
        user_model_rpm:
          type: integer
          format: int64
          minimum: 0
          description: 每用户每模型 RPM；0=不限。
    PublicModelDetail:
      allOf:
        - $ref: '#/components/schemas/PublicModelCard'
        - type: object
          additionalProperties: false
          required:
            - modalities
            - knowledge_cutoff
            - released_at
            - group_prices
            - parameters
            - rate_limits
            - auth_style
          properties:
            modalities:
              type: array
              items:
                type: string
              description: 档案 modalities；无档案时为空数组。
            knowledge_cutoff:
              anyOf:
                - type: string
                - enum:
                    - null
              description: 档案 knowledge_cutoff（YYYY-MM）；无档案或未设置时为 null。
            released_at:
              anyOf:
                - type: string
                - enum:
                    - null
              description: 档案 released_at（YYYY-MM-DD）；无档案或未设置时为 null。
            group_prices:
              type: array
              items:
                $ref: '#/components/schemas/PublicGroupPrice'
            parameters:
              type: array
              items:
                $ref: '#/components/schemas/PublicModelParameter'
              description: 档案 parameters；无档案时为空数组。
            rate_limits:
              type: array
              items:
                $ref: '#/components/schemas/PublicRateLimit'
            auth_style:
              type: string
              description: 认证头风格；当前实现恒为 bearer。
    PublicGroupMetric:
      type: object
      additionalProperties: false
      required:
        - group
      properties:
        group:
          type: string
        avg_ttft_ms:
          type: number
          nullable: true
          minimum: 0
        avg_latency_ms:
          type: number
          nullable: true
          minimum: 0
        success_rate:
          type: number
          nullable: true
          minimum: 0
          maximum: 1
    PublicModelLatestTest:
      type: object
      additionalProperties: false
      required:
        - ttft_ms_p50
        - ttft_ms_p95
        - latency_ms_p50
        - latency_ms_p95
        - tps
        - success_rate
        - sample_size
        - tested_at
      properties:
        ttft_ms_p50:
          type: integer
          nullable: true
          minimum: 0
          description: 首字延迟 P50（毫秒）；无有效样本时为 null。
        ttft_ms_p95:
          type: integer
          nullable: true
          minimum: 0
        latency_ms_p50:
          type: integer
          nullable: true
          minimum: 0
          description: 端到端延迟 P50（毫秒）；无有效样本时为 null。
        latency_ms_p95:
          type: integer
          nullable: true
          minimum: 0
        tps:
          type: number
          nullable: true
          minimum: 0
          description: 主动测试的平均输出速度（tokens/s）；无有效样本时为 null。
        success_rate:
          type: number
          minimum: 0
          maximum: 1
          description: 成功次数 / 总运行次数。
        sample_size:
          type: integer
          minimum: 0
          description: 本次测试的运行次数（runs）。
        tested_at:
          type: string
          format: date-time
          description: 测试完成时刻（RFC3339，UTC）。
    PublicModelMetrics:
      type: object
      additionalProperties: false
      required:
        - range
        - window
        - summary
        - per_group
      properties:
        range:
          type: string
          enum:
            - 24h
            - 7d
        window:
          type: object
          additionalProperties: false
          required:
            - start
            - end
          properties:
            start:
              type: string
              format: date-time
            end:
              type: string
              format: date-time
        summary:
          type: object
          additionalProperties: false
          required:
            - sample_size
          properties:
            avg_latency_ms:
              type: number
              nullable: true
              minimum: 0
            avg_ttft_ms:
              type: number
              nullable: true
              minimum: 0
            success_rate:
              type: number
              nullable: true
              minimum: 0
              maximum: 1
            tps:
              type: number
              nullable: true
              minimum: 0
            failed_24h:
              type: integer
              nullable: true
              minimum: 0
            sample_size:
              type: integer
              minimum: 0
        per_group:
          type: array
          items:
            $ref: '#/components/schemas/PublicGroupMetric'
        latest_test:
          anyOf:
            - $ref: '#/components/schemas/PublicModelLatestTest'
            - enum:
                - null
          description: |
            最近一次管理员主动测速（`model_performance_tests` 汇总行）的公开
            投影。没有主动测试记录、测速库未装配或读取失败时为 null；这是一条
            独立于 `usage_logs` 的兜底来源，前端在真实调用样本缺失/不足时回退
            到它，并用「主动测试」标注来源。
    LoginEncryptionKeyResponse:
      type: object
      additionalProperties: false
      description: |
        关闭态固定 {enabled:false}；开启态 {kid, public_key}，enabled 字段缺席。
        前端必须以 enabled === false 判定明文路径——字段缺失不得当作"关闭"
        （模块-01 §3.14 DisableCache；该端点是加密登录的唯一引导）。
      properties:
        enabled:
          type: boolean
        kid:
          type: string
          description: sha256(SPKI DER) 的前 16 个 hex 字符；用于选择解密私钥槽（active/previous）。
        public_key:
          type: string
          description: RSA ≥ 2048 公钥（PKCS#8 SPKI PEM）。仅公开材料；私钥永不出库外。
    EmailCodeRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - purpose
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        purpose:
          type: string
          enum:
            - register
            - reset
            - verify
            - bind
          description: |
            register/reset 面向匿名请求；verify/bind 要求有效会话——本端点虽挂在
            公开路由（不经过 SessionAuth），实现会显式校验会话，缺失即 401。
        turnstile_token:
          type: string
          description: |
            Cloudflare Turnstile 一次性令牌。Turnstile 开启时必填（缺失或校验失败
            403），关闭时忽略；也接受 ?turnstile_token= 查询形态（两者同时出现时
            请求体优先）。
      description: |
        发送 6 位一次性邮箱验证码（TTL 10 分钟）。同邮箱 60 秒冷却、同 IP 每小时
        10 次；超限返回 429 + Retry-After。成功恒 204 且不回显验证码。
    RegisterRequest:
      type: object
      additionalProperties: false
      required:
        - username
        - email
        - password
        - confirmPassword
        - agree_terms
      properties:
        username:
          type: string
          pattern: ^[a-zA-Z0-9_-]{3,32}$
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 128
          description: 长度合格后仍会做泄露口令筛查；命中返回 400（不区分"弱"与"已泄露"）。
        confirmPassword:
          type: string
          description: 必须与 password 逐字一致，否则 400。
        email_code:
          type: string
          pattern: ^[0-9]{6}$
          description: 条件字段：仅当 auth.email_verification_required=true 时必填并校验。
        agree_terms:
          type: boolean
          description: 必须为 true；false 返回 400。
        aff:
          type: string
          maxLength: 64
          description: 可选推广码（非必填）；超长 400。
        turnstile_token:
          type: string
          description: |
            Cloudflare Turnstile 一次性令牌。Turnstile 开启时必填（缺失或校验失败
            403），关闭时忽略；也接受 ?turnstile_token= 查询形态（两者同时出现时
            请求体优先）。
      description: |
        注册成功 201 + 会话 Cookie（自动登录）。重复 username/email 统一 409，
        文案不区分字段级差异以防账号枚举。邮箱域名白名单开启时域外地址 422。
    UserRole:
      type: string
      enum:
        - user
        - admin
    AuthUser:
      type: object
      additionalProperties: false
      required:
        - id
        - username
        - role
        - email_verified
        - must_change_password
      description: 会话建立响应中的用户投影；绝不含口令/TOTP/备用码/权限列。
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        email:
          type: string
          description: 未绑定邮箱时字段缺席（omitempty）。
        role:
          $ref: '#/components/schemas/UserRole'
        email_verified:
          type: boolean
        must_change_password:
          type: boolean
          description: 管理员重置口令后为 true；前端应强制跳转改密页。
    AuthSessionResponse:
      type: object
      additionalProperties: false
      required:
        - user
      properties:
        user:
          $ref: '#/components/schemas/AuthUser'
      description: 口令（+ 可选 2FA）通过后建立会话的响应；同时下发会话 Cookie 与 CSRF Cookie。
    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - identifier
      description: |
        identifier 可为用户名或邮箱。开启登录加密时请求体只接受密文：
        password_encrypted（v2 信封 `v2.<wrappedKey>.<nonce>.<ct>` 或旧版裸
        RSA-OAEP）+ encryption_key_id；出现明文 password 会被拒绝且响应与
        口令错误完全一致（反 oracle）。
      properties:
        identifier:
          type: string
          maxLength: 254
        password:
          type: string
          description: 明文口令；仅在登录加密关闭时接受。
        password_encrypted:
          type: string
          description: 前端加密载荷；开启加密时必填。
        encryption_key_id:
          type: string
          description: GET /api/auth/login/encryption-key 返回的 kid；与服务端槽位不匹配时按口令错误处理。
        turnstile_token:
          type: string
          description: |
            Cloudflare Turnstile 一次性令牌。Turnstile 开启时必填（缺失或校验失败
            403），关闭时忽略。支持两种提交形态：请求体字段，或
            `?turnstile_token=` 查询参数；两者同时出现时请求体优先（查询形态是
            中间件/handler 分支兼容，不是独立契约面）。
    Pending2FAResponse:
      type: object
      additionalProperties: false
      required:
        - status
        - ticket
      properties:
        status:
          type: string
          enum:
            - pending_2fa
          description: 判别字段；客户端据此跳转 2FA challenge 页。
        ticket:
          type: string
          description: 一次性 ticket（5 分钟），只能兑换一次正式会话；不包含用户身份。
    LoginResponse:
      oneOf:
        - $ref: '#/components/schemas/AuthSessionResponse'
        - $ref: '#/components/schemas/Pending2FAResponse'
      description: |
        口令通过后二选一：未启用 2FA 直接建会话（AuthSessionResponse）；已启用
        返回 pending_2fa + ticket，客户端再调用 POST /api/auth/2fa/challenge。
        用 oneOf 而非可空分支，是为了让生成的类型系统强制前端处理两条路径。
    TwoFAChallengeRequest:
      type: object
      additionalProperties: false
      required:
        - ticket
        - code
      properties:
        ticket:
          type: string
          description: 登录响应中的一次性 ticket。
        code:
          type: string
          description: type=totp 时为 6 位 TOTP；type=backup 时为 XXXX-XXXX 备用码。
        type:
          type: string
          enum:
            - totp
            - backup
          description: 缺省按 totp（兼容早期 {ticket,code} 契约）。
      description: |
        用 ticket 换正式会话。TOTP 连续 5 次错误作废 ticket；备用码原子核销，
        同一码并发提交只有一次成功。
    PasswordResetRequest:
      type: object
      additionalProperties: false
      required:
        - email
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        turnstile_token:
          type: string
          description: |
            Cloudflare Turnstile 一次性令牌。Turnstile 开启时必填（缺失或校验失败
            403），关闭时忽略；也接受 ?turnstile_token= 查询形态（两者同时出现时
            请求体优先）。
      description: |
        恒返回 204——邮箱存在与否响应完全一致（防枚举）；存在时投递一次性
        token（30 分钟）。限流与格式错误是仅有的差异化响应。
    PasswordResetValidateRequest:
      type: object
      additionalProperties: false
      required:
        - token
      properties:
        token:
          type: string
          description: 重置链接中的一次性 token；本端点只校验不消费。
    PasswordResetValidateResponse:
      type: object
      additionalProperties: false
      required:
        - valid
      properties:
        valid:
          type: boolean
          enum:
            - true
          description: 有效时为 true；无效/过期不以 200 返回，而是 400 invalid_reset_token。
    PasswordResetConfirmRequest:
      type: object
      additionalProperties: false
      required:
        - token
        - new_password
        - confirm
      properties:
        token:
          type: string
        new_password:
          type: string
          minLength: 8
          maxLength: 128
        confirm:
          type: string
          description: 必须与 new_password 一致。
      description: |
        原子消费 token → 改密 → 吊销该用户全部会话。成功 204；token 复用/过期
        400（并发提交只有一个能成功）。
    SetupRequest:
      type: object
      additionalProperties: false
      required:
        - site_title
        - server_address
        - username
        - email
        - password
      properties:
        site_title:
          type: string
          minLength: 1
          maxLength: 64
        server_address:
          type: string
          format: uri
          description: 站点公开地址（用于生成邮件链接等）；必须是 http(s) URL。
        username:
          type: string
          pattern: ^[a-zA-Z0-9_-]{3,32}$
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 128
        confirmPassword:
          type: string
          x-accepted-alias: confirm_password
          description: |
            必须与 password 一致。服务端为兼容历史客户端也接受下划线别名
            confirm_password（前者优先）；契约只登记 camelCase。
      description: |
        仅未初始化时可调用；三步字段建 admin 并写 system.install.completed_at
        （同事务）。幂等锚是 system_settings 该键，重复调用 409 + initialized=true。
    SetupResponse:
      type: object
      additionalProperties: false
      required:
        - user
      properties:
        user:
          type: object
          additionalProperties: false
          required:
            - id
            - username
            - email
            - role
            - status
            - email_verified
          properties:
            id:
              type: integer
              format: int64
            username:
              type: string
            email:
              type: string
            role:
              $ref: '#/components/schemas/UserRole'
            status:
              type: string
              enum:
                - enabled
                - disabled
            email_verified:
              type: boolean
      description: 201 公开投影；绝不包含口令、哈希或任何密钥材料。
    SetupCompletedProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            initialized:
              type: boolean
      description: |
        409 的 Problem 扩展：已初始化时带 initialized=true，让前端把重复提交
        直接导流到登录页（modules-01 F-01-20「已初始化标记」）；用户名/邮箱
        冲突的 409 不带该字段。该字段是 RFC 7807 允许的扩展成员。
    UserStatus:
      type: string
      enum:
        - enabled
        - disabled
      description: 账号状态；disabled 时除登录/找回流程外的认证端点一律拒绝。
    MeView:
      type: object
      additionalProperties: false
      required:
        - username
        - email_verified
        - role
        - status
        - created_at
        - permissions
      description: |
        GET /api/me 的冻结投影：用户名/邮箱/角色/状态/头像/显示名/生效权限。
        email/avatar_url/display_name 未设置时字段缺席（响应中为 null 或省略由
        Go omitempty 决定，客户端按可空处理）。permissions 是调用者的生效权限键：
        管理员 SQL NULL 或 ["*"] 归一为 ["*"]，role=user 恒为空数组（绝不泄露
        无权限的 admin_permissions 原始列）。该字段按 M6 R-17 扩展，用于前端
        能力闸门（服务端仍是最终权威）。
      properties:
        username:
          type: string
        email:
          type: string
          format: email
          nullable: true
        email_verified:
          type: boolean
          description: 邮箱是否已验证（email_verified_at 非空）。
        role:
          $ref: '#/components/schemas/UserRole'
        status:
          $ref: '#/components/schemas/UserStatus'
        avatar_url:
          type: string
          format: uri
          nullable: true
        display_name:
          type: string
          maxLength: 32
          nullable: true
        created_at:
          type: string
          format: date-time
          description: 账户创建时间；异常数据下为空串。
        permissions:
          type: array
          description: |
            生效权限键。FULL/NULL 管理员为 ["*"]；role=user 或显式空集合为 []。
          items:
            type: string
    PatchMeRequest:
      type: object
      additionalProperties: false
      required:
        - display_name
      description: |
        仅 display_name 可写。提交任何未知字段（含 role/email/password）返回
        403 field_not_writable，绝不静默丢弃（BOPLA，security-02 §2.6.1）。
      properties:
        display_name:
          type: string
          maxLength: 32
          nullable: true
          description: null 或空白字符串清除显示名。
    SelfSettings:
      type: object
      additionalProperties: false
      required:
        - language
        - sidebar_modules
        - record_ip_log
        - default_model
        - updated_at
      description: |
        GET /api/self 与 PUT /api/self/setting 的响应。updated_at 是下一次写入
        必须携带的乐观锁令牌——同一行的资料变更也会推进它。
      properties:
        language:
          $ref: '#/components/schemas/Language'
        sidebar_modules:
          type: object
          additionalProperties: true
          nullable: true
          description: 侧栏模块的稀疏覆盖；null 表示无覆盖（使用站点默认）。
        record_ip_log:
          type: boolean
          description: 是否记录登录/操作 IP。
        default_model:
          type: string
          nullable: true
          maxLength: 128
          description: |
            用户默认模型（modules-02 F-02-18）。null = 未设置（Playground 回落到
            首个可用模型）。写入值必须属于用户可用分组的模型清单（见
            GET /api/status 的 usable_groups），否则 422 user.default_model_invalid。
        updated_at:
          type: string
          format: date-time
    UpdateSelfSettingsRequest:
      type: object
      additionalProperties: false
      required:
        - updated_at
      description: |
        PUT /api/self/setting 的部分更新：未出现的键保持原值。updated_at 必须
        等于 GET /api/self 返回的值，否则 409（乐观锁）。语言不在 canonical
        7 语内返回 400。
      properties:
        language:
          $ref: '#/components/schemas/Language'
        sidebar_modules:
          type: object
          additionalProperties: true
          nullable: true
        record_ip_log:
          type: boolean
        default_model:
          type: string
          maxLength: 128
          description: |
            设置默认模型。空串表示清除（落库 NULL）；非空值必须属于该用户可用
            分组的模型清单，否则 422 user.default_model_invalid。
        updated_at:
          type: string
          format: date-time
    SessionView:
      type: object
      additionalProperties: false
      required:
        - id
        - user_agent
        - ip
        - created_at
        - last_seen_at
        - current
      properties:
        id:
          type: string
          description: 会话 id（不透明）；DELETE /api/sessions/{sid} 的原值。
        user_agent:
          type: string
        ip:
          type: string
          description: 建立会话时的客户端 IP。
        created_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
        current:
          type: boolean
    SessionList:
      type: object
      additionalProperties: false
      required:
        - sessions
      description: |
        不是 Page 信封：列表固定 ≤50 条、无翻页语义（按 last_seen 倒序）。
        过期会话不列出；current=true 的条目是当前请求所用会话。
      properties:
        sessions:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/SessionView'
    VerifyEmailRequest:
      type: object
      additionalProperties: false
      required:
        - email_code
      properties:
        email_code:
          type: string
          pattern: ^[0-9]{6}$
          description: 由 POST /api/auth/email-code（purpose=verify）下发的一次性验证码。
    VerifyEmailResponse:
      type: object
      additionalProperties: false
      required:
        - email_verified
      properties:
        email_verified:
          type: boolean
          enum:
            - true
        email_verified_at:
          type: string
          format: date-time
          description: 首次验证时间；重复验证保留首次时间。
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required:
        - current_password
        - new_password
      properties:
        current_password:
          type: string
        new_password:
          type: string
          minLength: 8
          maxLength: 128
      description: |
        成功 204：更新哈希、吊销除当前外全部会话并轮换当前会话 CSRF 令牌。
        限流 5 次/10 分钟/IP+用户；失败返回 400/409/429/503。
    DeleteAccountRequest:
      type: object
      additionalProperties: false
      required:
        - confirm_username
        - password
      properties:
        confirm_username:
          type: string
          description: 必须与当前用户名逐字一致。
        password:
          type: string
          description: 当前口令；即使再认证窗口仍有效也必须现场提供。
        totp_code:
          type: string
          description: 已启用 2FA 时必填。
      description: |
        DELETE /api/account 是硬删除 + PII 匿名化（R-04 无宽限），成功 204。
        再认证失败 403 reauth_required；账号行已不存在时 404（重复删除不产生
        额外副作用，但不是 204 成功态）。
    ChangeEmailRequest:
      type: object
      additionalProperties: false
      required:
        - new_email
        - code
        - current_password
      properties:
        new_email:
          type: string
          format: email
        code:
          type: string
          pattern: ^[0-9]{6}$
          description: 发往 new_email、purpose=bind 的一次性验证码。
        current_password:
          type: string
        totp_code:
          type: string
      description: |
        全量再认证门：未过再认证返回 403 reauth_required，且不消费验证码、
        不写库。新邮箱被占用 409；域名白名单外 422。
    ChangeEmailResponse:
      type: object
      additionalProperties: false
      required:
        - email
        - email_verified
        - email_verified_at
      properties:
        email:
          type: string
          format: email
        email_verified:
          type: boolean
          enum:
            - true
        email_verified_at:
          type: string
          format: date-time
    NotificationChannel:
      type: string
      enum:
        - email
        - webhook
        - bark
        - gotify
    NotificationPreferences:
      type: object
      additionalProperties: false
      description: |
        稀疏偏好对象：只持久化用户显式设置过的键；GET 对 NULL 归一为 {}。
        站点级默认值由客户端合并。security_alert.enabled 不允许为 false
        （安全通知不可关闭，400）。
      properties:
        balance_warning:
          type: object
          additionalProperties: false
          properties:
            enabled:
              type: boolean
            threshold:
              type: integer
              minimum: 0
              description: 余额告警阈值（credits，非负整数）。
            channels:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/NotificationChannel'
            custom_email:
              type: string
              nullable: true
              description: 自定义收件邮箱；null 或空串清除（空串是服务端兼容的清除写法）。
        usage_digest:
          type: object
          additionalProperties: false
          properties:
            enabled:
              type: boolean
            channels:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/NotificationChannel'
        security_alert:
          type: object
          additionalProperties: false
          properties:
            enabled:
              type: boolean
              enum:
                - true
        webhook_url:
          type: string
          format: uri
          nullable: true
          description: 清除时传 null 或空串（稀疏合并下唯一的删除方式）。
        bark_url:
          type: string
          format: uri
          nullable: true
        gotify_url:
          type: string
          format: uri
          nullable: true
        gotify_token:
          type: string
          nullable: true
          description: 清除时传 null 或空串。
        gotify_priority:
          type: integer
          nullable: true
          description: 清除时传 null。
    NotificationTestRequest:
      type: object
      additionalProperties: false
      required:
        - channel
      properties:
        channel:
          $ref: '#/components/schemas/NotificationChannel'
        target:
          type: string
          description: 测试目标地址；与 target_address 同义，target 优先。
        target_address:
          type: string
          description: 兼容字段；两者都缺时按渠道默认目标。
      description: |
        M1 未配置真实通知通道时返回 503；偏好读写端点不受影响。
        发送成功 200 {channel,sent:true}。
    NotificationTestResponse:
      type: object
      additionalProperties: false
      required:
        - channel
        - sent
      properties:
        channel:
          $ref: '#/components/schemas/NotificationChannel'
        sent:
          type: boolean
          enum:
            - true
    TwoFASetupResponse:
      type: object
      additionalProperties: false
      required:
        - secret
        - otpauth_url
      properties:
        secret:
          type: string
          description: base32 TOTP 种子，仅本次响应出现；已启用时再调用返回 409。
        otpauth_url:
          type: string
          format: uri
          description: otpauth:// URI，供前端渲染二维码。
    TwoFAEnableRequest:
      type: object
      additionalProperties: false
      required:
        - secret
        - code
      properties:
        secret:
          type: string
          description: 上一步 setup 返回的 secret（服务端校验 32 位 base32 / 20 字节）。
        code:
          type: string
          pattern: ^[0-9]{6}$
    TwoFABackupCodesResponse:
      type: object
      additionalProperties: false
      required:
        - totp_enabled
        - backup_codes
      properties:
        totp_enabled:
          type: boolean
          enum:
            - true
        backup_codes:
          type: array
          minItems: 8
          maxItems: 8
          items:
            type: string
            pattern: ^[A-Z0-9]{4}-[A-Z0-9]{4}$
          description: 明文备用码，仅本次响应出现；重生成后旧码立即失效。
    TwoFAPasswordRequest:
      type: object
      additionalProperties: false
      required:
        - password
      properties:
        password:
          type: string
          description: 当前口令确认；与登录共用失败锁定桶。
    TwoFADisableResponse:
      type: object
      additionalProperties: false
      required:
        - totp_enabled
      properties:
        totp_enabled:
          type: boolean
          enum:
            - false
    BillingPreference:
      type: object
      additionalProperties: false
      required:
        - preference
      properties:
        preference:
          type: string
          enum:
            - subscription_first
            - wallet_first
            - subscription_only
            - wallet_only
    BillingPreferenceUpdateRequest:
      type: object
      additionalProperties: false
      required:
        - preference
      properties:
        preference:
          type: string
          description: 未知/空值归一为 subscription_first（不返回 422）
    AvailableSubscriptionPlan:
      type: object
      additionalProperties: false
      required:
        - id
        - plan_key
        - title
        - period_days
        - price_amount
        - currency
        - grant_credits
        - reset_on_renew
        - grace_days
        - sort_order
      description: |
        用户侧套餐卡片投影。刻意不含 allow_wallet_overflow（内部回退开关）与
        审计时间戳；model_scope 为 null 表示全部模型。
      properties:
        id:
          type: integer
          format: int64
        plan_key:
          type: string
        title:
          type: string
        description:
          type: string
          nullable: true
        period_days:
          type: integer
          minimum: 1
        price_amount:
          type: integer
          format: int64
          minimum: 0
        currency:
          type: string
          enum:
            - CNY
        grant_credits:
          type: integer
          format: int64
          minimum: 0
        reset_on_renew:
          type: boolean
        model_scope:
          type: array
          nullable: true
          items:
            type: string
        concurrency_limit:
          type: integer
          minimum: 1
          nullable: true
        grace_days:
          type: integer
          minimum: 0
        sort_order:
          type: integer
    AvailableSubscriptionPlanList:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AvailableSubscriptionPlan'
    UserSubscription:
      type: object
      additionalProperties: false
      required:
        - id
        - plan_title_snapshot
        - status
        - start_at
        - end_at
        - amount_total
        - amount_used
        - auto_renew
        - auto_renew_failures
        - cancel_at_period_end
        - period_days
        - grace_days
        - created_at
        - updated_at
      description: |
        我的订阅投影；不含 user_id/order_id/价格/allow_wallet_overflow。
        amount_total=0 表示无限额度，此时省略 amount_remain。
      properties:
        id:
          type: integer
          format: int64
        plan_title_snapshot:
          type: string
        status:
          type: string
          enum:
            - active
            - expired
            - cancelled
        start_at:
          type: string
          format: date-time
        end_at:
          type: string
          format: date-time
        next_reset_at:
          type: string
          format: date-time
          nullable: true
        amount_total:
          type: integer
          format: int64
          minimum: 0
        amount_used:
          type: integer
          format: int64
          minimum: 0
        amount_remain:
          type: integer
          format: int64
          minimum: 0
        auto_renew:
          type: boolean
        auto_renew_payment_method_id:
          type: string
          format: uuid
          nullable: true
        auto_renew_failures:
          type: integer
          minimum: 0
        cancel_at_period_end:
          type: boolean
        period_days:
          type: integer
          minimum: 1
        grace_days:
          type: integer
          minimum: 0
        model_scope:
          type: array
          nullable: true
          items:
            type: string
        concurrency_limit:
          type: integer
          minimum: 1
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    UserSubscriptionList:
      type: object
      additionalProperties: false
      required:
        - items
        - total
        - page
        - page_size
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UserSubscription'
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
          maximum: 100
    SubscriptionEvent:
      type: object
      additionalProperties: false
      required:
        - seq
        - kind
        - detail
        - created_at
      description: |
        一条订阅状态迁移事件（S1/R-18）。detail 只含 id 与金额等非敏感字段。
      properties:
        seq:
          type: integer
          format: int64
          minimum: 1
        kind:
          type: string
          enum:
            - created
            - renewed
            - upgraded
            - downgraded
            - refunded
            - cancelled
            - expired
            - reset
        detail:
          type: object
          additionalProperties: true
          description: 只含 id 与金额（R-18）；禁止密钥、支付凭据、完整邮箱。
        created_at:
          type: string
          format: date-time
    SubscriptionEventList:
      type: object
      additionalProperties: false
      required:
        - events
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/SubscriptionEvent'
    SubscriptionRenewRequest:
      type: object
      additionalProperties: false
      required:
        - provider
      properties:
        provider:
          type: string
          enum:
            - stripe
            - alipay
            - epay
          description: |
            支付渠道；目标实例来自路径，金额/周期由服务端按套餐行读取。
            `epay` 返回 `pay_url` + `form_fields`（与充值同构）。
    TopupOrderView:
      type: object
      additionalProperties: false
      required:
        - id
        - provider
        - amount
        - currency
        - status
        - credited_credits
        - created_at
      properties:
        id:
          type: integer
          format: int64
        provider:
          type: string
          enum:
            - stripe
            - alipay
            - epay
            - wallet
          description: |
            响应侧取值域。`wallet` 只出现在余额购买的订阅订单上
            （P2b：下单即在同一事务内扣款并履约，没有渠道回调与支付凭据）；
            充值请求（CreateOrderRequest）与续费请求接受 stripe/alipay/epay。
        amount:
          type: integer
          format: int64
          description: 订单金额（分），服务端定价的唯一真源
        currency:
          type: string
          minLength: 3
          maxLength: 3
        status:
          type: string
          enum:
            - pending
            - succeeded
            - failed
            - expired
            - cancelled
            - refund_required
            - refunded
            - refund_failed
          description: |
            八态：`refund_required`（S2/R-29②）表示**钱已收、履约失败**（例如
            升降级支付成功后订阅已被并发取消），等待退款流程处理；它不是
            `failed`（那表示没收到钱）。`refunded`（S3）表示退款已完成；
            `refund_failed`（S3）表示渠道退款失败、可重试（不是终态）。
        credited_credits:
          type: integer
          format: int64
          description: 成功时到账积分快照；pending/failed 为 0
        failure_code:
          type: string
          nullable: true
          enum:
            - provider_unavailable
            - provider_rejected
            - signature_invalid
            - amount_mismatch
            - currency_mismatch
            - order_not_found
            - order_state_conflict
            - manual_required
            - refund_in_progress
            - null
        paid_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
    CreateOrderResponse:
      type: object
      additionalProperties: false
      required:
        - order
      properties:
        order:
          $ref: '#/components/schemas/TopupOrderView'
        client_secret:
          type: string
          description: 仅 stripe 首次创建返回（等同支付凭据，不落库、不回放）
        qr_code:
          type: string
          description: 仅 alipay 首次创建返回
        pay_url:
          type: string
          description: 仅 epay 首次创建返回；表单 POST 的目标收银台地址
        form_fields:
          type: object
          additionalProperties:
            type: string
          description: |
            仅 epay 首次创建返回；submit.php 表单字段（含 `sign`，小写 MD5）。
            客户端以 application/x-www-form-urlencoded POST 到 `pay_url`。
    SubscriptionChangeRequest:
      type: object
      additionalProperties: false
      required:
        - plan_id
        - provider
      properties:
        plan_id:
          type: integer
          format: int64
          minimum: 1
          description: |
            目标套餐 id。必须与当前套餐同币种、同 `period_days`（P-10），
            且不能是当前套餐。应补差价由服务端按剩余价值折算，客户端不得传入。
        provider:
          type: string
          enum:
            - stripe
            - alipay
            - epay
          description: |
            支付渠道；应补差价 > 0 时返回支付载荷，= 0（降级/免费）时渠道不参与
            履约、订单在同一事务内直接 succeeded。
    SubscriptionChangeResponse:
      type: object
      additionalProperties: false
      required:
        - order
        - from_plan_id
        - to_plan_id
        - event_kind
        - price_delta
        - credits_delta
      properties:
        order:
          $ref: '#/components/schemas/TopupOrderView'
        client_secret:
          type: string
          description: 仅 stripe 首次创建返回（等同支付凭据，不落库、不回放）
        qr_code:
          type: string
          description: 仅 alipay 首次创建返回
        pay_url:
          type: string
          description: 仅 epay 首次创建返回；表单 POST 的目标收银台地址
        form_fields:
          type: object
          additionalProperties:
            type: string
          description: 仅 epay 首次创建返回（与充值同构）
        from_plan_id:
          type: integer
          format: int64
          description: 升降级前的套餐 id（事件 detail 的 from_plan_id）
        to_plan_id:
          type: integer
          format: int64
          description: 目标套餐 id（事件 detail 的 to_plan_id）
        event_kind:
          type: string
          enum:
            - upgraded
            - downgraded
          description: |
            按套餐方向判定：新套餐价 > 旧套餐价 ⇒ upgraded，否则 downgraded
            （周期末的降级即使需要补差价也仍是 downgraded）。
        price_delta:
          type: integer
          format: int64
          minimum: 0
          description: 本次实付差价（单位：分）；降级为 0（不退款）
        credits_delta:
          type: integer
          format: int64
          description: |
            周期总额度变化量（新 grant_credits − 旧 amount_total），可为负。
            注意它不是「可用额度」的变化量：已用量超过新总额度时会被钳到
            新总额度（remain 置 0，P-12），此时可用额度的变化与该字段不一致。
        new_end_at:
          type: string
          format: date-time
          description: |
            折算后的到期时刻。0 元路径（即时生效）是实际写入值；付费路径是下单
            瞬间的折算结果，真实写入时刻在支付成功时以「支付成功时刻 + 冻结时长」
            重新求值。
    SubscriptionRefundRequest:
      type: object
      additionalProperties: false
      required:
        - reason
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 200
          description: 申请退款的原因（只写订单标记，不直接退款）
    SubscriptionRefundRequestView:
      type: object
      additionalProperties: false
      required:
        - order_id
        - requested_at
        - reason
      properties:
        order_id:
          type: integer
          format: int64
          description: 该订阅的购买订单 id（实际退款的目标）
        requested_at:
          type: string
          format: date-time
          description: 首次申请时刻（重复申请保持不变）
        reason:
          type: string
          description: 首次申请的理由
    SubscriptionAutoRenewRequest:
      type: object
      additionalProperties: false
      required:
        - enabled
      properties:
        enabled:
          type: boolean
        payment_method_id:
          type: string
          format: uuid
          description: |
            启用时使用的令牌；缺省沿用实例已绑定的令牌。客户端提交金额/时刻
            等其它字段会被 RBAC 字段层 403。
    SubscriptionAutoRenewView:
      type: object
      additionalProperties: false
      required:
        - subscription_id
        - auto_renew
        - auto_renew_failures
      properties:
        subscription_id:
          type: integer
          format: int64
        auto_renew:
          type: boolean
        auto_renew_payment_method_id:
          type: string
          format: uuid
          nullable: true
        auto_renew_failures:
          type: integer
          minimum: 0
          description: 连续失败次数；成功续费或人工切换后归零。
    PaymentMethod:
      type: object
      additionalProperties: false
      required:
        - id
        - provider
        - brand
        - last4
        - exp_month
        - exp_year
        - status
        - created_at
      description: |
        支付令牌的**公开投影**：只有 brand/last4/exp 与句柄 id，
        token_cipher（AES-GCM 密文）永不出现在任何响应中（P-14 零回显）。
      properties:
        id:
          type: string
          format: uuid
        provider:
          type: string
          enum:
            - stripe
        brand:
          type: string
          maxLength: 32
        last4:
          type: string
          pattern: ^[0-9]{4}$
        exp_month:
          type: integer
          minimum: 1
          maximum: 12
        exp_year:
          type: integer
          minimum: 2000
          maximum: 9999
        status:
          type: string
          enum:
            - active
            - invalid
        created_at:
          type: string
          format: date-time
    PaymentMethodList:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PaymentMethod'
    PaymentMethodCreateRequest:
      type: object
      additionalProperties: false
      required:
        - provider
        - token
      properties:
        provider:
          type: string
          enum:
            - stripe
        token:
          type: string
          pattern: ^pm_[A-Za-z0-9_-]{4,255}$
          description: Stripe PaymentMethod id（`pm_...`），不是卡号。
    SubscriptionPurchaseRequest:
      type: object
      additionalProperties: false
      required:
        - plan_id
        - provider
      properties:
        plan_id:
          type: integer
          format: int64
          minimum: 1
        provider:
          type: string
          enum:
            - stripe
            - alipay
            - epay
            - wallet
          description: |
            支付渠道；金额/币种由服务端按套餐行读取，不接受客户端传入。
            `wallet` 为余额购买：服务端在同一事务内扣减钱包、写
            `subscription_purchase` 流水、将订单置 succeeded 并创建订阅实例；
            余额不足返回 402，且不留下订单/实例/流水。`epay` 返回
            `pay_url` + `form_fields`（与充值同构）。
    TokenStatus:
      type: string
      enum:
        - enabled
        - disabled
        - expired
        - exhausted
      description: |
        读时派生，优先级 disabled > expired > exhausted > enabled。
        disabled 是唯一可写的人工位；其余为时间/额度派生态。
    TokenList:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Token'
      description: GET /api/tokens 的 offset 分页信封；items 为 Token 投影。
    CreateTokenRequest:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        group:
          type: string
          description: 缺省使用用户当前分组；auto 时 auto_groups 必须非空（I-20）。
        expires_at:
          oneOf:
            - type: integer
              format: int64
              description: epoch 秒（modules-02 线格式）。
            - type: string
              format: date-time
          nullable: true
          description: null 表示永不过期。
        quantity:
          type: integer
          minimum: 1
          maximum: 100
          description: 一次创建的令牌数量（缺省 1）；上限 100（与批量操作同额）。
        unlimited_quota:
          type: boolean
          description: 缺省 true（不限额度）。
        remain_quota:
          type: integer
          format: int64
          minimum: 0
          maximum: 1000000000000000
          description: |
            可选。缺省时取 DB 默认档 100000（modules-02:369，创建 handler 的
            remain := 100000 与之一致）；0 表示立即耗尽；unlimited_quota=true
            时忽略本字段。
        model_limits:
          type: array
          items:
            type: string
        allow_ips:
          type: array
          items:
            type: string
        auto_groups:
          type: array
          maxItems: 20
          items:
            type: string
          description: group=auto 时必填且非空；21 项拒绝（TC-F-02-13-08）。
        cross_group_retry:
          type: boolean
          description: 缺省 false。
      description: |
        POST /api/tokens 应携带 Idempotency-Key：同键重放返回首次结果，
        不同请求体复用同键返回 422。创建成功返回 200 + {created:[...]}。
    CreatedToken:
      allOf:
        - $ref: '#/components/schemas/Token'
        - type: object
          required:
            - key
          properties:
            key:
              type: string
              description: 完整明文 key（sk- 前缀；历史令牌可能为 nkt-），仅此响应出现一次；服务端只存 SHA-256 哈希。
      description: 创建响应中的条目 = Token + 一次性明文 key。
    CreateTokenResponse:
      type: object
      additionalProperties: false
      required:
        - created
      properties:
        created:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/CreatedToken'
    UpdateTokenRequest:
      type: object
      additionalProperties: false
      required:
        - updated_at
      description: |
        部分更新：未出现的字段不变。updated_at 必须等于当前行的版本，
        否则 409（乐观锁）。expires_at 显式 null 表示改为永不过期。
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        group:
          type: string
        expires_at:
          oneOf:
            - type: integer
              format: int64
            - type: string
              format: date-time
          nullable: true
        unlimited_quota:
          type: boolean
        remain_quota:
          type: integer
          format: int64
          minimum: 0
          maximum: 1000000000000000
        model_limits:
          type: array
          items:
            type: string
        allow_ips:
          type: array
          items:
            type: string
        auto_groups:
          type: array
          maxItems: 20
          items:
            type: string
        cross_group_retry:
          type: boolean
        updated_at:
          type: string
          format: date-time
    BatchTokenRequest:
      type: object
      additionalProperties: false
      required:
        - ids
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items:
            type: integer
            format: int64
    TokenBatchFailure:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - detail
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          description: 仅当令牌属于当前用户且仍存在时填写；他人/不存在留空（不泄露存在性）。
        detail:
          type: string
    TokenBatchResponse:
      type: object
      additionalProperties: false
      required:
        - succeeded
        - failed
      description: |
        逐条结果：succeeded 为成功条数，failed 为明细。批量端点上限 100，
        部分失败仍返回 200（不是整体回滚）。
      properties:
        succeeded:
          type: integer
          minimum: 0
        failed:
          type: array
          items:
            $ref: '#/components/schemas/TokenBatchFailure'
    ResetTokenKeyResponse:
      type: object
      additionalProperties: false
      required:
        - key
        - key_masked
      description: |
        新 key 只在本响应出现一次；旧 key 立即失效。响应带
        Cache-Control: no-store。
      properties:
        key:
          type: string
        key_masked:
          type: string
    TokenAutoGroupsResponse:
      type: object
      additionalProperties: false
      required:
        - groups
        - max_count
      properties:
        groups:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - name
            properties:
              name:
                type: string
              ratio:
                type: number
                description: 分组倍率（DB 150 → 1.5）；缺省字段表示无显式倍率。
        max_count:
          type: integer
          minimum: 1
          description: 单令牌 auto_groups 条目上限（站点配置，默认 20）。
    TokenUsage:
      type: object
      additionalProperties: false
      required:
        - object
        - name
        - total_used
        - unlimited_quota
        - model_limits_enabled
      description: |
        GET /api/usage/token 的 Bearer 自读投影。额度耗尽（remain_quota=0 且
        unlimited_quota=false）时仍返回 200 且 total_available=0——前端要能显示
        耗尽状态而不是被 401 吞掉（modules-02 §2.13）。与耗尽相反，过期令牌在
        鉴权层就被拒绝：401 + problem type `token_expired`（禁用令牌
        `token_disabled`，非法 key `invalid_token`）。
      properties:
        object:
          type: string
          enum:
            - token_usage
        name:
          type: string
        total_granted:
          type: integer
          format: int64
          nullable: true
          description: M3 接入 usage_logs 前无法可靠计算，固定 null（不伪造"授予=剩余"）。
        total_used:
          type: integer
          format: int64
          description: |
            M1 尚未计量（usage_logs 未接入，令牌行也没有 used 列），恒为 0；
            与 total_granted 的 null 同属 M3 前的占位口径，不得据此刻画真实用量。
        total_available:
          type: integer
          format: int64
          nullable: true
          description: 剩余额度；不限额度时为 null。
        unlimited_quota:
          type: boolean
        model_limits:
          type: array
          items:
            type: string
          nullable: true
        model_limits_enabled:
          type: boolean
        expires_at:
          type: string
          format: date-time
          nullable: true
    PermissionKey:
      type: string
      enum:
        - users:read
        - users:create
        - users:update
        - users:disable
        - users:delete
        - users:adjust-quota
        - users:manage-roles
        - users:reset-security
        - groups:manage
        - channels:read
        - channels:manage
        - channels:manage_sensitive
        - pricing:read
        - pricing:manage
        - redemption:manage
        - orders:read
        - orders:manage
        - logs:read
        - log.prompt.view
        - settings:manage
      description: |
        modules-07 F-07-08 的 20 键冻结目录（order 与文档表格一致）。
        通配符 "*" 单独建模为 PermissionGrant，不放宽本枚举。
    PermissionGrant:
      oneOf:
        - $ref: '#/components/schemas/PermissionKey'
        - type: string
          enum:
            - '*'
      description: 权限矩阵成员：20 键之一或全权通配符 "*"。
    AdminUser:
      type: object
      additionalProperties: false
      required:
        - id
        - username
        - role
        - status
        - balance
        - group
        - admin_permissions
        - totp_enabled
        - must_change_password
        - token_count
        - created_at
        - updated_at
      description: |
        管理面用户投影。永不含口令哈希、TOTP 种子或备用码。admin_permissions
        为 null 表示 FULL（数据库 NULL）；空数组表示明确无任何权限——两者语义
        不同，客户端不得把 [] 当 null。
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        display_name:
          type: string
          maxLength: 32
          nullable: true
        email:
          type: string
          format: email
          nullable: true
          description: 管理员创建的用户可为 null（不绑定邮箱）。
        role:
          $ref: '#/components/schemas/UserRole'
        status:
          $ref: '#/components/schemas/UserStatus'
        balance:
          type: integer
          format: int64
          description: 当前余额（credits 最小单位）。
        group:
          type: string
        admin_permissions:
          type: array
          items:
            $ref: '#/components/schemas/PermissionGrant'
          nullable: true
          description: |
            权限矩阵。null = FULL（数据库 NULL）；["*"] 是 FULL 的显式形态；
            空数组 = 明确无任何权限。两者语义不同，客户端不得混用。
        totp_enabled:
          type: boolean
        must_change_password:
          type: boolean
        remark:
          type: string
          maxLength: 255
          nullable: true
        token_count:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
          description: 乐观锁版本；PATCH 必须原样回传。
    AdminUserList:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/AdminUser'
      description: GET /api/users 的 offset 分页信封。
    AdminCreateUserRequest:
      type: object
      additionalProperties: false
      required:
        - username
        - password
      properties:
        username:
          type: string
          pattern: ^[a-zA-Z0-9_-]{3,32}$
        display_name:
          type: string
          maxLength: 32
          nullable: true
        role:
          $ref: '#/components/schemas/UserRole'
          description: 缺省 user。创建 admin 需要执行者同时持有 users:manage-roles 与默认权限集的超集。
        group:
          type: string
          description: 缺省 default。
        password:
          type: string
          minLength: 8
          maxLength: 128
        remark:
          type: string
          maxLength: 255
          nullable: true
      description: |
        必须携带 Idempotency-Key；同键重放只创建一条。请求体没有 email 字段：
        管理员创建的用户 email 为 NULL。用户名冲突 409。
    AdminUpdateUserRequest:
      type: object
      additionalProperties: false
      required:
        - updated_at
      description: |
        部分更新。不含口令字段：提交 password 返回 400（用
        POST /api/users/{id}/reset-password）。未知字段 403 field_not_writable。
        role 变更会吊销该用户全部会话；不能修改自己的角色/状态/权限（400）。
      properties:
        display_name:
          type: string
          maxLength: 32
          nullable: true
        group:
          type: string
        remark:
          type: string
          maxLength: 255
          nullable: true
        role:
          $ref: '#/components/schemas/UserRole'
        updated_at:
          type: string
          format: date-time
    AdminUserStatusRequest:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          $ref: '#/components/schemas/UserStatus'
      description: |
        封禁在同一事务内吊销全部会话并把令牌置 disabled；解禁不自动恢复令牌。
        不能封禁自己（400）。
    AdminUserStatusResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - status
      properties:
        id:
          type: integer
          format: int64
        status:
          $ref: '#/components/schemas/UserStatus'
    QuotaAdjustmentRequest:
      type: object
      additionalProperties: false
      required:
        - mode
        - amount
        - idempotency_key
      properties:
        mode:
          type: string
          enum:
            - add
            - subtract
            - override
        amount:
          type: integer
          format: int64
          description: |
            add/subtract 为增量，必须 ≥1（handler 对 0 返回 400：零增量没有业务
            意义，且会污染流水）；override 为目标余额，允许 0。三种 mode 共用本
            schema，条件下限写在 schema 级 not/anyOf 中，而不是给 amount 加
            无条件 minimum（否则合法的 override=0 会被误判非法）。
        idempotency_key:
          type: string
          minLength: 1
          description: 必填业务幂等键；与 HTTP Idempotency-Key 不同，写入交易流水。
      not:
        anyOf:
          - properties:
              mode:
                enum:
                  - add
                  - subtract
              amount:
                maximum: 0
            required:
              - mode
              - amount
          - properties:
              mode:
                enum:
                  - override
              amount:
                maximum: -1
            required:
              - mode
              - amount
      description: |
        原子 UPDATE（GC-5）：subtract 超过余额返回 400，绝不产生负余额；
        override 与当前余额相同返回 400（无变化）。成功后写
        type=admin_adjustment 流水。
    QuotaAdjustmentResponse:
      type: object
      additionalProperties: false
      required:
        - user_id
        - new_balance
        - transaction_id
      properties:
        user_id:
          type: integer
          format: int64
        new_balance:
          type: integer
          format: int64
        transaction_id:
          type: integer
          format: int64
    ResetPasswordResponse:
      type: object
      additionalProperties: false
      required:
        - temp_password
      properties:
        temp_password:
          type: string
          description: |
            16 位一次性临时口令，仅本次响应出现（Cache-Control: no-store）。
            TEMP_PWD_TTL=24h 且 must_change_password=true；24 小时内不改密
            则临时口令失效。
      description: 管理员重置口令的响应；审计只记录"发生了重置"，绝不含口令材料。
    SetPermissionsRequest:
      type: object
      additionalProperties: false
      required:
        - admin_permissions
      properties:
        admin_permissions:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/PermissionGrant'
          description: |
            授予集合必须是调用者自身权限的子集，否则 403 且不写库。
            显式 null 被拒绝——NULL 在 RBAC 语义里是 FULL，匿名 null→FULL
            会绕过超集校验；授予全权必须显式提交 ["*"]。
      description: |
        PATCH /api/users/{id}/permissions 只对 admin 目标有效；不能修改自己
        （400）。成功 200 返回更新后的 AdminUser。
    SubscriptionPlan:
      type: object
      additionalProperties: false
      required:
        - id
        - plan_key
        - title
        - period_days
        - price_amount
        - currency
        - grant_credits
        - reset_on_renew
        - allow_wallet_overflow
        - grace_days
        - status
        - sort_order
        - created_at
        - updated_at
      properties:
        id:
