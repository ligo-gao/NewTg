    post:
      tags:
        - relay
      operationId: createResponse
      x-openai-compatible: true
      x-relay-format: openai_responses
      summary: OpenAI Responses 创建（仅插件任务渠道）
      description: |
        分发顺序（冻结）：`protocols.openai_responses.supports` 含 `create` 的
        插件派生绑定 `POST /v1/responses`（历史 `routes[]` 显式声明同样可达）。
        命中即转任务插件提交（鉴权/限流/预扣/落库/结算只有一份实现），并按
        Responses 协议渲染响应：

        - 非流式：`200 application/json` + `ResponsesObject`（不再是 202 task 形状）；
        - `stream: true`：`200 text/event-stream`，最少
          `response.created → response.output_text.delta* → response.completed`
          （失败为 `response.failed`）；`response.created` 恒为首帧、终止事件恒为
          末帧，未知事件原样透传。任务非终态时以 `response.in_progress` 收尾并
          正常 EOF（宿主不在 HTTP 连接内长等待后台轮询），客户端改用
          `GET /v1/responses/{id}` 回读终态。

        未命中插件绑定一律 `501` OpenAI 信封（`code=endpoint_not_supported`）：
        通用中继是 Chat 管线，无法表达 Responses 的 input/instructions 与响应
        形态，放行会返回与输入无关的 200 并按错误 usage 结算。该分支零计费、
        零上游调用。
      security:
        - bearerToken: []
      externalDocs:
        description: OpenAI Responses API reference
        url: https://platform.openai.com/docs/api-reference/responses
      responses:
        '200':
          $ref: '#/components/responses/ResponsesCreateOK'
        '400':
          $ref: '#/components/responses/RelayError400'
        '401':
          $ref: '#/components/responses/RelayError401'
        '402':
          $ref: '#/components/responses/RelayError402'
        '404':
          description: 无匹配的插件任务渠道（插件未注册 / 无可用渠道）
        '409':
          description: 插件不可用（disabled / compile_failed）
        '413':
          description: 请求体超过任务提交上限 4 MiB（`maxTaskSubmitBytes`）
        '429':
          $ref: '#/components/responses/RelayError429'
        '500':
          $ref: '#/components/responses/RelayError500'
          description: |
            服务端内部错误。限流器故障时按 fail-closed 返回
            `code=rate_limit_check_failed`（500，不设 `Retry-After`）：无法判断
            是否超限就不放行，客户端不应把它当作可重试的限流。
        '501':
          $ref: '#/components/responses/RelayError501'
        '502':
          description: 上游提交失败（任务插件路径）
