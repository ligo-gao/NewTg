        allow_wallet_overflow:
          type: boolean
          description: 订阅额度用尽后是否允许回落钱包（内部开关，用户侧不返回）
        model_scope:
          type: array
          nullable: true
          description: 模型白名单；null = 全部模型；[] = 无任何模型可用
          items:
            type: string
            minLength: 1
            maxLength: 128
          uniqueItems: true
        concurrency_limit:
          type: integer
          minimum: 1
          nullable: true
        grace_days:
          type: integer
          minimum: 0
        status:
          type: string
          enum:
            - enabled
            - disabled
        sort_order:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    SubscriptionPlanList:
      type: object
      additionalProperties: false
      required:
        - items
        - total
        - page
        - page_size
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SubscriptionPlan'
        total:
          type: integer
