          type: string
          minLength: 1
          maxLength: 80
        category:
          allOf:
            - $ref: '#/components/schemas/AnnouncementCategory'
          description: 省略时默认 notice。
        content:
          type: string
          minLength: 1
          maxLength: 16384
          description: Markdown 原文（≤16384，按 UTF-8 字节计）；渲染期净化（R-D7-04）。
        publish_at:
          type: string
          format: date-time
          description: 省略时创建取 now()、编辑保留原值；编辑已发布公告时忽略。
        expire_at:
          type: string
          format: date-time
          nullable: true
          description: null/省略 = 永久有效；必须晚于生效时间。
        publish_now:
          type: boolean
          default: false
          description: |
            true = 在同一事务内写入并发布（draft/offline → published）；
            校验或发布失败整体回滚并返回 422（R-D7-06 组合路径）。
