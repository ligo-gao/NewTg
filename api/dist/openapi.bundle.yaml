    TopupProviderConfig:
      type: object
      additionalProperties: false
      required:
        - min_topup
      description: 公开的渠道配置；secret 永不出现。
      properties:
        publishable_key:
          type: string
          description: Stripe 公开密钥（P-17 冻结键名 `pay.stripe.publishable_key`）
        min_topup:
          type: integer
          format: int64
          minimum: 0
          description: |
            该渠道自己的最低充值（分，`pay.<provider>.min_topup_cny`）；
            有效下限 = max(全局 `min_topup`, 渠道 `min_topup`)（F-04-01）
    TopupConfig:
      type: object
      additionalProperties: false
      required:
        - amount_options
        - min_topup
        - max_topup
        - quota_per_unit
        - credits_ratio
        - enabled_providers
        - providers
      properties:
        amount_options:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: integer
            format: int64
            minimum: 1
          description: 档位，最小货币单位（分）；来源 `pay.amount_presets_cny`
        min_topup:
          type: integer
          format: int64
          minimum: 0
          description: 全局最低充值（分），来源 `pay.min_topup_cny`
        max_topup:
          type: integer
          format: int64
          minimum: 1
          description: 单笔硬上限（分），冻结 10000000
        quota_per_unit:
          type: integer
          format: int64
          minimum: 1
          description: 1 元 = N 积分（`billing.quota_per_unit`，默认 100）
        credits_ratio:
          type: number
          format: double
          exclusiveMinimum: 0
          description: |
            当前用户分组的有效兑换倍率（`pay.topup_group_ratio[users.group]`，
            未配置回退 1.0）。仅用于前端预览；实际到账以服务端入账为准。
        enabled_providers:
          type: array
          items:
            type: string
            enum:
              - stripe
              - alipay
          description: 已启用且配置完整的渠道（P-13）
        providers:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/TopupProviderConfig'
          description: 只包含 enabled_providers 中的渠道
