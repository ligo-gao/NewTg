              minimum: 0
            - enum:
                - null
          description: 档案 context_length；无档案或未设置时为 null。
        max_output:
          anyOf:
            - type: integer
              format: int64
              minimum: 0
            - enum:
                - null
          description: 档案 max_output；无档案或未设置时为 null。
        mode:
          type: string
          description: per_token 或 per_request（MVP 仅两种）。
        prompt_price:
          anyOf:
            - type: string
              pattern: ^[0-9]+$
            - enum:
                - null
