        '200':
          description: 更新后的账号
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpstreamAccount'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '500':
          $ref: '#/components/responses/Error500'
    delete:
      tags:
        - admin
      operationId: deleteUpstreamAccount
      x-required-permission: settings:manage
      summary: 删除上游账号
      description: |
        仍被渠道或快照引用的账号由数据库 FK RESTRICT 拒绝，映射为 409：
        历史对账必须以当时的归属为准，不能级联删除。成功 204。
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          description: 上游账号 id（正整数）；非法/不存在同形 404。
          schema:
            type: integer
            format: int64
            minimum: 1
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '204':
          description: 已删除
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '500':
          $ref: '#/components/responses/Error500'
  /api/upstream-snapshots:
    get:
      tags:
        - admin
      operationId: listUpstreamSnapshots
      x-required-permission: settings:manage
      summary: 按账号与日期区间读取上游用量快照
      description: |
        account_id 必填；from/to 为闭区间 ISO date（缺省由服务端按配置的
        回看窗口补齐）。不分页：区间本身约束结果规模，按 (usage_date,
        upstream_model) 升序返回。
      security:
        - sessionCookie: []
      parameters:
        - name: account_id
          in: query
          required: true
          description: 上游账号 id。
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: from
          in: query
          required: false
          description: 起始自然日（含），YYYY-MM-DD。
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          description: 结束自然日（含），YYYY-MM-DD。
          schema:
            type: string
            format: date
      responses:
        '200':
          description: OK（不分页的 items 信封）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpstreamSnapshotList'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '500':
          $ref: '#/components/responses/Error500'
    put:
      tags:
        - admin
      operationId: upsertUpstreamSnapshots
      x-required-permission: settings:manage
      summary: 批量写入（upsert）上游用量快照
      description: |
        同一 (account_id, usage_date, upstream_model) 重复键按「后写覆盖」；
        最多 500 条，全量在一个事务内写入（全成或全回滚）。entered_by 取当前
        管理员，source 缺省 manual。成功返回 {updated: n}。
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpstreamSnapshotUpsert'
      responses:
        '200':
          description: 写入结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpstreamSnapshotUpsertResult'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '422':
          $ref: '#/components/responses/Error422'
        '500':
          $ref: '#/components/responses/Error500'
  /api/upstream-reconciliations/runs:
    get:
      tags:
        - admin
      operationId: listReconcileRuns
      x-required-permission: settings:manage
      summary: 对账运行历史（分页）
      description: |
        offset 分页，按 started_at 降序（最新优先）。account_id 缺省 = 全部账号。
      security:
        - sessionCookie: []
      parameters:
        - name: account_id
          in: query
          required: false
          description: 只返回该账号的 run。
          schema:
            type: integer
            format: int64
            minimum: 1
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: OK（offset 分页信封）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReconcileRunList'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '500':
          $ref: '#/components/responses/Error500'
  /api/upstream-reconciliations/runs/{id}/items:
    get:
      tags:
        - admin
      operationId: listReconcileItems
      x-required-permission: settings:manage
      summary: 某次运行的差异明细（分页 + 筛选）
      description: |
        offset 分页，按 usage_date 降序、模型升序。severity/status 为空表示
        不筛选；非法枚举 400。run 不存在 404。
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          description: 对账 run id（正整数）；不存在 404。
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: severity
          in: query
          required: false
          description: 差异等级（迁移 CHECK 闭集）。
          schema:
            type: string
            enum:
              - ok
              - warn
              - alert
              - partial_snapshot
              - missing_snapshot
              - missing_local
              - local_expired
        - name: status
          in: query
          required: false
          description: 运营处置状态。
          schema:
            type: string
            enum:
              - open
              - acknowledged
              - resolved
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: OK（offset 分页信封）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReconcileItemList'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '500':
          $ref: '#/components/responses/Error500'
  /api/upstream-reconciliations/summary:
    get:
      tags:
        - admin
      operationId: getReconcileSummary
      x-required-permission: settings:manage
      summary: 某次运行的按天汇总（概览）
      description: |
        run_id 必填（缺失 400；run 不存在 404）。返回收入/成本/毛利/差异率的
        按天聚合；无法计算的维度为 null（UI 显示 —，不是 0）。
      security:
        - sessionCookie: []
      parameters:
        - name: run_id
          in: query
          required: true
          description: 对账 run id。
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReconcileSummary'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '500':
          $ref: '#/components/responses/Error500'
  /api/upstream-reconciliations/run:
    post:
      tags:
        - admin
      operationId: triggerReconcileRun
      x-required-permission: settings:manage
      summary: 手动触发一次对账
      description: |
        同步执行（60 秒超时；超时 504，detail 在已创建 run 时附 run id）。
        account_id 缺省 = 全部启用账号。返回本次生成的 run 与聚合计数。
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReconcileRunRequest'
      responses:
        '200':
          description: 触发结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReconcileRunResult'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '500':
          $ref: '#/components/responses/Error500'
        '504':
          description: 对账在 60 秒内未完成（problem+json；已创建 run 时 detail 附其 id）
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/upstream-reconciliations/items/{id}/ack:
    post:
      tags:
        - admin
      operationId: ackReconcileItem
      x-required-permission: settings:manage
      summary: 标记差异明细已确认 / 已解决
      description: |
        status 缺省 acknowledged；非法枚举 422。明细不存在 404。
        处置写审计事件 reconcile.item_ack（含 before/after）。
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          description: 差异明细 id（正整数）；不存在 404。
          schema:
            type: integer
            format: int64
            minimum: 1
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReconcileAckRequest'
      responses:
        '200':
          description: 处置后的明细摘要
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReconcileAckResult'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '422':
          $ref: '#/components/responses/Error422'
        '500':
          $ref: '#/components/responses/Error500'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-nkt_sess
      description: |
        控制台会话 Cookie（HttpOnly; Secure; SameSite=Lax; Path=/）。
        Cookie 会话路径上的非安全方法（POST/PUT/PATCH/DELETE）必须同时发送 X-CSRF-Token；Bearer 路径豁免（security-01 §2.2）。
    bearerToken:
      type: http
      scheme: bearer
      bearerFormat: sk-<token>
      description: |
        API 令牌（明文仅创建时展示一次）。请求头：Authorization: Bearer sk-…（历史令牌可能为 nkt-）
  parameters:
    Page:
      x-go-name: PageQuery
      name: p
      in: query
      required: false
      description: 页码，1 基（默认 1）
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      required: false
      description: 每页条数（默认 20，上限 100）
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: 写操作幂等键（UUID）。同键重放在有效窗口内返回首次结果。
      schema:
        type: string
        format: uuid
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: false
      description: |
        条件必带：Cookie 会话路径的非安全方法（POST/PUT/PATCH/DELETE）必须发送；
        Authorization: Bearer 路径豁免（无 CSRF 风险）。
      schema:
        type: string
        minLength: 1
    PathUserID:
      name: id
      in: path
      required: true
      description: 用户 ID（正整数）；解析失败与不存在统一 404。
      schema:
        type: integer
        format: int64
        minimum: 1
    PathTokenID:
      name: id
      in: path
      required: true
      description: 令牌 ID（正整数）；他人令牌与不存在统一 404。
      schema:
        type: integer
        format: int64
        minimum: 1
    PathSessionID:
      name: sid
      in: path
      required: true
      description: 会话 id（不透明字符串，取自 GET /api/sessions）。
      schema:
        type: string
        minLength: 1
    PathGroupName:
      name: name
      in: path
      required: true
      description: 分组名（^[a-z0-9_-]{2,32}$）。
      schema:
        type: string
        pattern: ^[a-z0-9_-]{2,32}$
    PathPricingModel:
      name: model
      in: path
      required: true
      description: 计费模型名（1–128 字符，允许 A-Za-z0-9._:/-，含公开模型名的厂商前缀 /）；不存在 404。
      schema:
        type: string
        pattern: ^[A-Za-z0-9._:/-]{1,128}$
    PathGroupTag:
      name: group
      in: path
      required: true
      description: 分组名（user_groups.name）。
      schema:
        type: string
        pattern: ^[a-z0-9_-]{2,32}$
    UpdatedAtQuery:
      name: updated_at
      in: query
      required: true
      description: |
        乐观锁版本（GET 列表返回的 updated_at 原样回传）。DELETE 无 body，
        故通过查询参数传递；不匹配返回 409。
      schema:
        type: string
        format: date-time
    ConfirmAction:
      name: X-Confirm-Action
      in: header
      required: true
      description: |
        服务端强制确认（modules-08 §3.19 Q3）。取值 "true"（大小写不敏感）；
        缺失或其他值一律 422 confirm_required，且在任何副作用之前拒绝。
        前端 DangerConfirm 只是体验层，本请求头才是授权门。
      schema:
        type: string
    PathRedemptionCodeID:
      name: id
      in: path
      required: true
      description: redemption_codes.id
      schema:
        type: integer
        format: int64
        minimum: 1
    ResponseID:
      name: response_id
      in: path
      required: true
      description: Responses 对象 ID（`resp_<x>`；映射到 task_<x> 的任务产物）
      schema:
        type: string
    TaskPluginKey:
      name: key
      in: path
      required: true
      description: 插件 key（1–30，^[a-z0-9][a-z0-9-]*$）
      schema:
        type: string
        maxLength: 30
    TaskIDQuery:
      name: task_id
      in: query
      required: true
      description: 对外任务 ID（task_<32 hex>）
      schema:
        type: string
    TaskArtifactKey:
      name: artifact_key
      in: path
      required: true
      description: 任务内产物 key（由 task.data.artifacts[].key 投影；T6b 冻结字符集）
      schema:
        type: string
        pattern: ^[A-Za-z0-9._-]{1,128}$
        maxLength: 128
    TaskArtifactAccess:
      name: access
      in: query
      required: true
      description: 宿主签发的 HMAC 能力票据（长期有效；无效/过期 403）
      schema:
        type: string
    VideoID:
      name: video_id
      in: path
      required: true
      description: 视频对象 ID（`video_<x>`；映射到 task_<x> 的任务）
      schema:
        type: string
    BatchID:
      name: batch_id
      in: path
      required: true
      description: 批次 ID（`batch_<uuid>`）
      schema:
        type: string
    MJTaskID:
      name: id
      in: path
      required: true
      description: MjId（`^[A-Za-z0-9_-]{1,128}$`）
      schema:
        type: string
        minLength: 1
        maxLength: 128
    MJImageSig:
      name: sig
      in: query
      required: true
      description: 图片票据签名（base64url，无填充；HMAC-SHA256）
      schema:
        type: string
        minLength: 1
    MJImageExp:
      name: exp
      in: query
      required: true
      description: 票据过期时间（Unix 秒；TTL 300s）
      schema:
        type: integer
        format: int64
        minimum: 1
  schemas:
    Problem:
      type: object
      description: RFC 7807 Problem Details；允许扩展成员（如 request_id）。
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          format: uri
          default: about:blank
          description: 问题类型 URI（稳定机器可读标识）
        title:
          type: string
          description: 简短的人类可读摘要
        status:
          type: integer
          minimum: 100
          maximum: 599
          description: HTTP 状态码（与响应状态行一致）
        detail:
          type: string
          description: 针对本次问题的说明
        instance:
          type: string
          description: 问题实例 URI（通常为请求路径）
      additionalProperties: true
    Problem402:
      description: 额度/余额不足（Problem 的 402 扩展；计费 §6.2、relay §4.4）
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            balance:
              type: integer
              description: 当前可用余额（credits 最小单位）
            required:
              type: integer
              description: 本次请求所需额度
            currency:
              type: string
              enum:
                - credits
            topup_url:
              type: string
              format: uri
              description: 充值页地址
    Page:
      type: object
      description: offset 分页信封；各域 items 的 DTO 随里程碑细化。
      required:
        - items
        - total
        - page
        - page_size
      properties:
        items:
          type: array
          items: {}
        total:
          type: integer
          minimum: 0
          description: 满足条件的总条数
        page:
          type: integer
          minimum: 1
          description: 当前页码（1 基）
        page_size:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
          description: 每页条数（默认 20，上限 100）
    PublicStatus:
      type: object
      additionalProperties: false
      required:
        - system_initialized
        - auth
        - password_login_encryption_enabled
        - checkin_enabled
        - languages
        - default_language
        - site
        - nav
        - billing
        - pay
        - usd_exchange_rate
        - credit_display_symbol
        - usable_groups
      description: |
        公开站点状态（GET /api/status）。响应 Cache-Control: no-store——站点开关
        变更必须立即反映到登录/注册页，禁止任何中间层缓存。
      properties:
        system_initialized:
          type: boolean
          description: |
            站点是否已完成首次初始化（system.install.completed_at 已写入）。前端据此
            实现 /setup 闸门：false 时控制台路由一律重定向到安装向导；已初始化后
            向导页反向导流到登录页（重复 POST /api/setup 返回 409 + initialized=true）。
        auth:
          type: object
          additionalProperties: false
          required:
            - signup_enabled
            - password_login_enabled
            - email_verification_required
            - turnstile
          properties:
            signup_enabled:
              type: boolean
              description: false 时 POST /api/auth/register 返回 403（关闭注册）。
            password_login_enabled:
              type: boolean
              description: false 时 POST /api/auth/login 返回 403（仅保留 OAuth 等其它入口）。
            email_verification_required:
              type: boolean
              description: 注册后是否必须先验证邮箱才能使用完整功能。
            turnstile:
              type: object
              additionalProperties: false
              required:
                - enabled
                - site_key
              properties:
                enabled:
                  type: boolean
                site_key:
                  type: string
                  description: Turnstile 公开 site key；未启用时为空串。站点 secret 永不下发。
        password_login_encryption_enabled:
          type: boolean
          description: |
            与 GET /api/auth/login/encryption-key 的 enabled 字段同一开关。
            true 时登录只接受 password_encrypted，出现明文 password 一律拒绝
            （reason=encryption_required，对外响应与口令错误不可区分）。
        checkin_enabled:
          type: boolean
          description: |
            每日签到总开关的**派生**布尔（来源设置键 `checkin.enabled`，但
            `checkin.*` 本身不进公开下发全集）。false 时控制台不渲染签到卡，
            POST /api/checkin 与 GET /api/checkin/calendar 返回 403
            `checkin_disabled`。奖励区间永不下发。
        languages:
          type: array
          minItems: 7
          maxItems: 7
          uniqueItems: true
          description: canonical 7 语（modules-01 F-01-19）；顺序即下拉框顺序。
          items:
            $ref: '#/components/schemas/Language'
        default_language:
          $ref: '#/components/schemas/Language'
        site:
          $ref: '#/components/schemas/PublicSite'
        nav:
          $ref: '#/components/schemas/PublicNav'
        billing:
          $ref: '#/components/schemas/PublicBilling'
        pay:
          $ref: '#/components/schemas/PublicPay'
        usd_exchange_rate:
          type: number
          format: double
          description: |
            USD→CNY 展示汇率常量（billing-02 §4.1 唯一真源，7.1 = 71/10）。
            只用于展示层换算，不是设置键。
        credit_display_symbol:
          type: string
          description: 等于 billing.currency_symbol（展示用积分符号）。
        usable_groups:
          type: array
          description: |
            当前会话用户的可用分组与分组模型清单（modules-02 §2.14 / F-02-18）。
            仅当请求携带有效会话时非空；匿名、会话失效或 Redis/DB 查询失败时
            一律为空数组（公开面不返回 401/5xx）。可用分组 =
            user_groups.status=1 且（user_selectable=true 或 name = 用户当前分组）；
            models = 该分组下启用渠道的 supported_models 之并集，且仅保留
            model_pricing.status=1 的模型，去重排序。
          items:
            $ref: '#/components/schemas/UsableGroup'
    GeoIPResponse:
      type: object
      additionalProperties: false
      required:
        - country
        - region
        - source
      description: |
        客户端粗粒度地理区域。不返回坐标、城市级精度、IP 原文、ASN 或代理链。
        响应缓存策略：Cache-Control: private, max-age=300。
      properties:
        country:
          anyOf:
            - type: string
              pattern: ^[A-Z]{2}$
            - enum:
                - null
          description: ISO 3166-1 alpha-2（大写）；无法判定为 null
        region:
          anyOf:
            - type: string
              maxLength: 64
            - enum:
                - null
          description: ISO 3166-2 子分区码；无法判定为 null
        source:
          type: string
          enum:
            - local_db
            - unknown
          description: local_db=命中本地 GeoIP 库；unknown=库缺失或无匹配
    Token:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - status
        - key_masked
        - unlimited_quota
        - group
        - cross_group_retry
        - created_at
        - updated_at
      description: |
        管理面令牌响应。永不包含 key 明文或 key_hash；完整 key 只在创建
        （POST /api/tokens）与重置（POST /api/tokens/{id}:reset-key）响应中出现一次。
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          maxLength: 64
        status:
          $ref: '#/components/schemas/TokenStatus'
        key_masked:
          type: string
          description: 形如 sk-••••••••••••••••••••••••，用于列表展示。
        remain_quota:
          type: integer
          format: int64
          nullable: true
          description: null 表示不限额度（等价 unlimited_quota=true）。
        unlimited_quota:
          type: boolean
        quota_percent:
          type: integer
          nullable: true
          description: M1 由 remain_quota 派生（0 或 100）；后续接入用量日志后细化。
        group:
          type: string
          description: 令牌绑定分组；auto 表示按 auto_groups 顺序自动选择。
        model_limits:
          type: array
          items:
            type: string
          nullable: true
          description: null/空表示不限制模型。
        allow_ips:
          type: array
          items:
            type: string
          nullable: true
          description: null/空表示不限制来源 IP。
        auto_groups:
          type: array
          items:
            type: string
          description: 有序自动分组候选；仅 group=auto 时非空，最多 20 项（可配置）。
        cross_group_retry:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
          description: 乐观锁版本；PATCH 必须原样回传，否则 409。
        last_used_at:
          type: string
          format: date-time
          nullable: true
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: null 表示永不过期。
    Channel:
      type: object
      additionalProperties: false
      description: |
        上游渠道管理投影。`auto_disabled_reason` 是系统写入的稳定 reason code
        （R-M4-05），非秘密；空值序列化为 null。自动禁用的展示时间复用
        `updated_at`（不新增 auto_disabled_at 列），UI 文案为「最近更新」。
      required:
        - id
        - name
        - type
        - status
        - priority
        - weight
        - supported_models
        - auto_ban
        - fail_count
        - task_extend_plugin_keys
        - created_at
        - updated_at
        - version
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          maxLength: 64
        type:
          type: string
        status:
          type: integer
          enum:
            - 1
            - 2
            - 3
          description: 1 enabled、2 manual_disabled、3 auto_disabled（无 deleted 状态）。
        priority:
          type: integer
          minimum: -1000
          maximum: 1000
        weight:
          type: integer
          minimum: 0
          maximum: 1000
        supported_models:
          type: array
          items:
            type: string
        group_tags:
          type: array
          items:
            type: string
          nullable: true
          description: null = 全部分组（与空数组语义不同）。
        rate_limit:
          type: integer
          minimum: 1
          maximum: 100000
          nullable: true
        auto_ban:
          type: boolean
        test_model:
          type: string
          nullable: true
        remark:
          type: string
          maxLength: 255
          nullable: true
        tag:
          type: string
          maxLength: 32
          nullable: true
        fail_count:
          type: integer
          description: 保留诊断列；M4 不维护逐请求失败计数（R-M4-04）。
        auto_disabled_reason:
          type: string
          nullable: true
          description: |
            自动禁用原因的稳定 code（R-M4-05）：
            channel_upstream_error / channel_auth_error / channel_keyword /
            channel_timeout。非自动禁用时为 null。
        last_test_at:
          type: string
          format: date-time
          nullable: true
        last_test_result:
          type: boolean
          nullable: true
        task_plugin_key:
          type: string
          nullable: true
        task_extend_plugin_keys:
          type: array
          items:
            type: string
        upstream_account_id:
          type: integer
          format: int64
          nullable: true
          description: 归属的上游账号（upstream_accounts.id）；null = 未归属。
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
          description: 乐观锁版本；PATCH 必须原样回传。也用于展示「最近更新」。
        version:
          type: string
          description: R-P8：derived updated_at（RFC3339Nano UTC）。
        credentials_masked:
          $ref: '#/components/schemas/ChannelCredentialsMasked'
        credentials_set:
          type: boolean
          description: 仅详情/POST/PATCH 响应返回（GC-6 详情例外）。
        metrics:
          $ref: '#/components/schemas/ChannelListMetrics'
    RelayError:
      type: object
      description: |
        中继错误信封（OpenAI 兼容）。`message` 末尾会追加
        ` (requestId: <id>)`，同一个 id 同时出现在 `X-Request-ID` 头中。
      required:
        - error
      properties:
        error:
          type: object
          required:
            - message
            - type
            - code
          properties:
            message:
              type: string
              description: 固定文案（不包含上游 URL/凭据/SQL 等内部信息）；限流为 `rate limit exceeded; retry in {n}s`
            type:
              type: string
              enum:
                - new_api_error
              description: 固定为 `new_api_error`（relay-01 §3.6 冻结字面量）
            code:
              type: string
              description: |
                机器可读 code。限流为 `rate_limit_exceeded`，限流器故障为
                `rate_limit_check_failed`；令牌/会话类错误为空串（不提供存在性信息）。
    ClaudeError:
      type: object
      description: |
        Anthropic Claude 形错误信封。`message` 末尾会追加
        ` (requestId: <id>)`，同一个 id 同时出现在 `X-Request-ID` 头中。
      required:
        - type
        - error
      properties:
        type:
          type: string
          enum:
            - error
          description: 顶层判别字段，固定为 `error`
        error:
          type: object
          required:
            - type
            - message
          properties:
            type:
              type: string
              enum:
                - invalid_request_error
                - authentication_error
                - permission_error
                - not_found_error
                - request_too_large
                - rate_limit_error
                - api_error
              description: |
                错误类型映射（R-W18-04）：400/422/402 → `invalid_request_error`；
                401 → `authentication_error`；403 → `permission_error`；
                404 → `not_found_error`；413 → `request_too_large`；
                429 → `rate_limit_error`；5xx → `api_error`。
            message:
              type: string
              description: 固定文案（不包含上游 URL/凭据/SQL 等内部信息）
    UpstreamAccount:
      type: object
      additionalProperties: false
      description: |
        upstream_accounts 的一行。console_url 为空时序列化为 null（不是空串）。
        updated_at 同时是 PATCH 的乐观锁版本，必须原样回传。
      required:
        - id
        - name
        - provider
        - currency
        - timezone
        - status
        - note
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          minLength: 1
          maxLength: 64
        provider:
          type: string
          minLength: 1
          maxLength: 64
        currency:
          type: string
          minLength: 3
          maxLength: 3
          description: ISO 4217 三字母币种；缺省 CNY（char(3)）。
        timezone:
          type: string
          maxLength: 64
          description: IANA 时区名；缺省 Asia/Shanghai。「一天」按该时区切分。
        console_url:
          type: string
          maxLength: 512
          nullable: true
          description: 供应商控制台地址（绝对 http(s)）；null = 未填写。
        status:
          type: integer
          enum:
            - 1
            - 2
          description: 1 = active、2 = disabled（迁移 CHECK status IN (1,2)）。
        note:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
          description: 乐观锁版本；PATCH 必须回传为 expected_updated_at。
    UpstreamAccountList:
      type: object
      additionalProperties: false
      description: GET /api/upstream-accounts 的 offset 分页信封（Page 形状，items 为账号投影）。
      required:
        - items
        - total
        - page
        - page_size
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UpstreamAccount'
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
          maximum: 100
    UpstreamAccountCreate:
      type: object
      additionalProperties: false
      description: |
        创建载荷。currency 缺省 CNY，timezone 缺省 Asia/Shanghai（服务端补齐，
        不依赖 DDL 默认）；status 由服务端置为 active（1），创建后经 PATCH 停用。
      required:
        - name
        - provider
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          description: 账号名，全局唯一（冲突 409）；首尾空白由服务端裁剪。
        provider:
          type: string
          minLength: 1
          maxLength: 64
        currency:
          type: string
          minLength: 3
          maxLength: 3
          description: 缺省 CNY。
        timezone:
          type: string
          maxLength: 64
          description: 必须能被 time.LoadLocation 解析（否则 422）；缺省 Asia/Shanghai。
        console_url:
          type: string
          maxLength: 512
          nullable: true
          description: 绝对 http(s) 地址；null/缺省 = 未填写。
        note:
          type: string
    UpstreamAccountUpdate:
      type: object
      additionalProperties: false
      description: |
        部分更新。字段缺省 = 不修改；console_url 显式 null = 清空。
        expected_updated_at 必带：不匹配 409（镜像 users 端点的 updated_at 乐观锁）。
      required:
        - expected_updated_at
      properties:
        expected_updated_at:
          type: string
          format: date-time
          description: 客户端读取到的 updated_at 原值。
        name:
          type: string
          minLength: 1
          maxLength: 64
        provider:
          type: string
          minLength: 1
          maxLength: 64
        currency:
          type: string
          minLength: 3
          maxLength: 3
        timezone:
          type: string
          maxLength: 64
        console_url:
          type: string
          maxLength: 512
          nullable: true
        status:
          type: integer
          enum:
            - 1
            - 2
        note:
          type: string
    UpstreamSnapshot:
      type: object
      additionalProperties: false
      description: |
        upstream_usage_snapshots 的一行。五个计数与 amount_minor 可空：
        null = 上游未报告该维度（不参与差异判定），0 = 真实的零。
        source 为 manual（人工录入）| csv（批量导入）。
      required:
        - account_id
        - usage_date
        - upstream_model
        - currency
        - source
        - entered_at
      properties:
        id:
          type: integer
          format: int64
        account_id:
          type: integer
          format: int64
        usage_date:
          type: string
          format: date
          description: 按账号时区切分的自然日（ISO date，不做 24h 运算）。
        upstream_model:
          type: string
          minLength: 1
          maxLength: 128
          description: 上游供应商侧的模型名（与本地 model_name 不是同一口径）。
        input_cache_hit_tokens:
          type: integer
          format: int64
          nullable: true
        input_cache_miss_tokens:
          type: integer
          format: int64
          nullable: true
        cache_write_tokens:
          type: integer
          format: int64
          nullable: true
        output_tokens:
          type: integer
          format: int64
          nullable: true
        requests:
          type: integer
          format: int64
          nullable: true
        amount_minor:
          type: integer
          format: int64
          nullable: true
          description: 上游账单金额，整数最小单位（分）；null = 未报告。
        currency:
          type: string
          minLength: 3
          maxLength: 3
          description: 缺省 CNY。
        source:
          type: string
          enum:
            - manual
            - csv
        entered_by:
          type: integer
          format: int64
          nullable: true
          description: 录入管理员 id；null = 系统/批量导入未绑定执行者。
        entered_at:
          type: string
          format: date-time
        note:
          type: string
    UpstreamSnapshotWrite:
      type: object
      additionalProperties: false
      description: |
        upsert 的写入投影（items 元素），不是读取形状。幂等键 (usage_date,
        upstream_model) 必填；账期归属由外层 account_id 决定，故不含 account_id。
        溯源字段由服务端盖章，客户端不得提交：source 恒为 manual、entered_by 取
        当前管理员、entered_at 取写入时刻，currency 缺省取所属账号的币种。
      required:
        - usage_date
        - upstream_model
      properties:
        usage_date:
          type: string
          format: date
          description: 按账号时区切分的自然日（ISO date，不做 24h 运算）。
        upstream_model:
          type: string
          minLength: 1
          maxLength: 128
          description: 上游供应商侧的模型名（与本地 model_name 不是同一口径）。
        input_cache_hit_tokens:
          type: integer
          format: int64
          nullable: true
        input_cache_miss_tokens:
          type: integer
          format: int64
          nullable: true
        cache_write_tokens:
          type: integer
          format: int64
          nullable: true
        output_tokens:
          type: integer
          format: int64
          nullable: true
        requests:
          type: integer
          format: int64
          nullable: true
        amount_minor:
          type: integer
          format: int64
          nullable: true
          description: 上游账单金额，整数最小单位（分）；null = 未报告。
        currency:
          type: string
          minLength: 3
          maxLength: 3
          description: 可选；缺省 CNY。v1 全库统一 CNY，不按账号货币换算。
        note:
          type: string
    UpstreamSnapshotList:
      type: object
      additionalProperties: false
      description: |
        按账号 + 日期区间读取的快照集合。不分页：区间由 from/to 约束，
        结果按 (usage_date, upstream_model) 升序。
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UpstreamSnapshot'
    UpstreamSnapshotUpsert:
      type: object
      additionalProperties: false
      description: |
        批量写入（upsert）载荷：同一 (account_id, usage_date, upstream_model) 重复
        出现时后写覆盖；最多 500 条。所有行在一个事务内写入（全成或全回滚）。
      required:
        - account_id
        - items
      properties:
        account_id:
          type: integer
          format: int64
          description: 所属账号；所有 item 归属于该账号（items 内不再重复携带）。
        items:
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/UpstreamSnapshotWrite'
    UpstreamSnapshotUpsertResult:
      type: object
      additionalProperties: false
      description: 实际写入行数（同批重复键先折叠，故可能小于提交条数）。
      required:
        - updated
      properties:
        updated:
          type: integer
          minimum: 0
    ReconcileRun:
      type: object
      additionalProperties: false
      description: |
        upstream_reconciliation_runs 的一行。容差、quota_per_unit 与 timezone 在
        开跑时快照进来；修改设置不会改写历史判定。
      required:
        - id
        - account_id
        - window_start
        - window_end
        - triggered_by
        - status
        - token_tolerance_bp
        - amount_tolerance_minor
        - quota_per_unit
        - timezone
        - started_at
        - error
      properties:
        id:
          type: integer
          format: int64
        account_id:
          type: integer
          format: int64
        window_start:
          type: string
          format: date
        window_end:
          type: string
          format: date
          description: 闭区间右端（含当日，即本次对账覆盖的最后一天）；迁移 CHECK 要求 window_end > window_start。
        triggered_by:
          type: string
          enum:
            - worker
            - manual
        status:
          type: string
          enum:
            - running
            - succeeded
            - partial
            - failed
        token_tolerance_bp:
          type: integer
          description: token 差异容忍度（万分比，快照值）。
        amount_tolerance_minor:
          type: integer
          format: int64
          description: 金额差异容忍度（分，快照值）。
        quota_per_unit:
