    delete:
      tags:
        - admin
      operationId: cleanupPerformanceLogs
      x-required-permission: settings:manage
      summary: 按天数或文件数清理应用日志文件
      description: |
        只处理 LOG_DIR 下匹配 LOG_FILE_PATTERN 的普通文件；当前活动日志文件
        （最新 mtime）永不删除。by_count 保留最新 N 个；by_days 删除 mtime 早于
        now-N*24h 的文件。非法 mode → 422 invalid_mode；value 不在 1–36500
        （by_days 上限 100 年，更大的 value 会让 time.Duration 溢出）→ 422
        invalid_value；LOG_DIR 未配置 → 422 log_dir_not_configured。
        不触碰 usage_logs 行。
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ConfirmAction'
        - name: mode
