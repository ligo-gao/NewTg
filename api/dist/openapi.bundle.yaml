openapi: 3.1.0
info:
  title: NewTG API
  version: 0.2.0-m1
  description: |
    NewTG 网关 API 契约（M1：账户/认证/令牌/用户/分组）。
    管理 API 统一使用 RFC 7807 `application/problem+json` 错误体与 offset 分页信封
    `Page{items,total,page,page_size}`（`p` 1 基，`page_size` 默认 20、上限 100）。
    中继 `/v1/*` 仅登记路径与公共面，不重定义上游协议 schema（真源见 externalDocs）。
    M1 的会话性端点同时声明 `sessionCookie` 与 `bearerToken`；管理端点只接受
    会话 Cookie（Bearer 没有角色/权限语义）。
servers:
  - url: /
    description: 同源部署（边缘反代 → 网关）
security: []
tags:
  - name: ops
    description: 运维探针（/healthz、/readyz）
  - name: public
    description: 公开接口（无需认证）
  - name: user
    description: 用户自助接口（会话 Cookie 或 API 令牌）
  - name: admin
    description: 管理接口（仅管理员会话）
  - name: relay
    description: 中继协议面（API 令牌；schema 遵循上游公开规范）
paths:
  /healthz:
    get:
      tags:
        - ops
      operationId: getHealthz
      summary: 进程存活探针
      description: 不触碰 PostgreSQL/Redis，恒返回 200。
      security: []
      responses:
        '200':
          description: 进程存活
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - status
                properties:
                  status:
                    type: string
                    enum:
                      - ok
  /readyz:
    get:
      tags:
        - ops
      operationId: getReadyz
      summary: 就绪探针（五项实时判定）
      description: |
        R1 PostgreSQL SELECT 1；R2 Redis PING；R3 schema_migrations 版本与 dirty；
        R4 配置装配完成；R5 startup 完成。任一失败返回 503 + status=degraded。
      security: []
      responses:
        '200':
          description: 五项判定全部通过
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - status
                  - checks
                  - version
                  - node
                properties:
                  status:
                    type: string
                    enum:
                      - ok
                      - degraded
                    description: 全部通过为 ok；任一失败为 degraded
                  checks:
                    type: object
                    additionalProperties: false
                    required:
                      - postgres
                      - redis
                      - migration
                      - config
                      - startup
                    properties:
                      postgres:
                        type: string
                        enum:
                          - ok
                          - fail
                      redis:
                        type: string
                        enum:
                          - ok
                          - fail
                      migration:
                        type: string
                        enum:
                          - ok
                          - fail
                      config:
                        type: string
                        enum:
                          - ok
                          - fail
                      startup:
                        type: string
                        enum:
                          - ok
                          - fail
                  version:
                    type: string
                    description: 构建版本（VERSION 注入）
                  node:
                    type: string
                    description: 节点标识
        '503':
          description: 任一判定失败（status=degraded，失败项值为 fail）
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - status
                  - checks
                  - version
                  - node
                properties:
                  status:
                    type: string
                    enum:
                      - ok
                      - degraded
                    description: 全部通过为 ok；任一失败为 degraded
                  checks:
                    type: object
                    additionalProperties: false
                    required:
                      - postgres
                      - redis
                      - migration
                      - config
                      - startup
                    properties:
                      postgres:
                        type: string
                        enum:
                          - ok
                          - fail
                      redis:
                        type: string
                        enum:
                          - ok
                          - fail
                      migration:
                        type: string
                        enum:
                          - ok
                          - fail
                      config:
                        type: string
                        enum:
                          - ok
                          - fail
                      startup:
                        type: string
                        enum:
                          - ok
                          - fail
                  version:
                    type: string
                    description: 构建版本（VERSION 注入）
                  node:
                    type: string
                    description: 节点标识
  /api/status:
    get:
      tags:
        - public
      operationId: getPublicStatus
      summary: 公共站点状态
      description: |
        登录/注册页的引导数据：注册与口令登录开关、邮箱验证要求、Turnstile
        site key、登录加密开关与 canonical 7 语清单。响应 Cache-Control:
        no-store——开关变更必须立即生效。
      security: []
      responses:
        '200':
          description: OK
          headers:
            Cache-Control:
              description: no-store（站点开关变更必须即时可见）
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicStatus'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          description: |
            初始化状态存储不可用（IsInitialized 查询失败）。实现禁止猜测
            system_initialized（猜 false 会把已初始化站点导回安装向导，猜 true
            会把新站锁死在登录页），因此 fail-closed 返回 503。
          headers:
            Retry-After:
              description: 建议重试等待秒数（实现冻结为 5）
              schema:
                type: integer
                minimum: 0
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/geoip:
    get:
      tags:
        - public
      operationId: getClientGeo
      x-codegen: true
      summary: 客户端粗粒度地理区域（只读；不返回坐标与 IP）
      description: |
        客户端 IP 只从连接或经 TRUSTED_PROXIES 校验的代理头取得；响应仅 country/region/source。
        本地 GeoIP 库缺失或损坏时仍返回 200 且 source=unknown（不返回 5xx）。
      security: []
      responses:
        '200':
          description: OK
          headers:
            Cache-Control:
              description: private, max-age=300（按客户端缓存）
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeoIPResponse'
        '429':
          $ref: '#/components/responses/Error429'
  /api/home/stats:
    get:
      tags:
        - public
      operationId: getHomeStats
      summary: 首页统计数据条（公开，5 分钟服务端缓存）
      description: |
        4 个计数指标：upstreams=COUNT(DISTINCT channels.type) WHERE status=1；
        models=与 `/api/pricing` 同一可见集合的计数；endpoints=冻结协议端点目录
        （openai chat/completions、anthropic messages、gemini generateContent）
        大小 3；routing_dims=冻结调度维度清单（priority/weight/group/
        model-allowlist/affinity/retry）大小 6。0 如实返回（前端在 0 时隐藏区块）。
        数据库故障返回 500 problem，绝不返回 200 空对象。Cache-Control:
        public, max-age=300。B8 公开只读限流（60 次/分钟/IP+path，fail-open）。
      security: []
      responses:
        '200':
          description: OK
          headers:
            Cache-Control:
              description: public, max-age=300（服务端缓存窗口同值）
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HomeStats'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
  /api/rankings:
    get:
      tags:
        - public
      operationId: getPublicRankings
      summary: 公开排行榜快照（周期 today/week/month/year）
      description: |
        只读 worker 预聚合的 `rankings_*` 快照（modules-09 F-09-29～F-09-33 /
        §C1.7），不在请求时聚合 `usage_logs`。口径：仅 `usage_logs.status=success`
        的 `prompt_tokens + completion_tokens`，窗口内 `requests < N` 的模型不
        进入任何榜单（N=`site.rankings_min_samples`，隐私地板 50）。
        响应字段按白名单构造，**不含** user_id/token_id/channel_id/upstream
        名称/cost 等内部维度。`display_name` 缺失回退 `model`，`author` 缺失
        回退 `Unknown`；`delta_pct` 在上一窗口 token 为 0 时为 null，
        `prev_rank` 在上一窗口样本不足时为 null（`delta_tokens` 的 D6a 口径见
        schema 说明）。`providers[].series` 仅作者榜 Top 5 下发，是该周期的
        token 桶数组，与 `trend.buckets` 一一对齐（B5a）。
        Redis 缓存 `rankings:public:<period>`（TTL=刷新间隔）；快照表不可用
        返回 503，快照从未生成返回 200 + `status=empty`（冷启动）。
        B8 公开只读限流 60 次/分钟/IP+path（fail-open）。
      security: []
      parameters:
        - name: period
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/RankingsPeriod'
            default: week
          description: 统计周期（缺省 week）；非法值 400。
      responses:
        '200':
          description: OK
          headers:
            ETag:
              description: 有快照时 `"{period}:{computed_at_epoch}"`；冷启动（无快照）不下发 ETag
              schema:
                type: string
            Cache-Control:
              description: public, max-age=30, stale-while-revalidate=30
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RankingsResponse'
        '304':
          description: If-None-Match 命中（无 body）
        '400':
          $ref: '#/components/responses/Error400'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          description: 快照表不可用（依赖故障）
          headers:
            Retry-After:
              description: 建议重试等待秒数（实现冻结为 5）
              schema:
                type: integer
                minimum: 0
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/home/live-feed:
    get:
      tags:
        - public
      operationId: getHomeLiveFeed
      summary: 首页实时调用动态（轮询降级，最近 N 条脱敏事件）
      description: |
        读取 Redis list `newtg:feed:calls` 的最近 limit 条事件（LPUSH，新在上）。
        事件字段是白名单脱敏投影：不含账号、邮箱、IP、令牌、渠道 ID/名称、
        base_url、prompt/response、request_id 原文（id 为 8 位十六进制短哈希）。
        `site.home_blocks.live_feed=false` 时返回 404。响应 `Cache-Control:
        no-store`。B8 公开只读限流 60 次/分钟/IP+path（fail-open）。

        响应顶层 `window` 是聚合条：**近 60 秒**（按当前分钟桶汇总，0–60s
        近似），calls 计所有事件，cost_credits 只计成功事件的整数积分。
        逐行事件按裁决 A-1 不含任何费用字段。Redis 聚合桶读取失败时
        `window` 降级为 `{calls:0,cost_credits:0}` 且事件照常返回；list
        本身不可用时仍按下方 503 口径处理。
      security: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: 返回条数（缺省 20；非整数或 <1 返回 400；>100 截到 100）。
      responses:
        '200':
          description: OK
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveFeedList'
        '400':
          $ref: '#/components/responses/Error400'
        '404':
          description: live_feed 区块已关闭（`site.home_blocks.live_feed=false`）
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          description: Redis 不可用（事件源故障）
          headers:
            Retry-After:
              description: 建议重试等待秒数（实现冻结为 5）
              schema:
                type: integer
                minimum: 0
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/home/live-feed/stream:
    get:
      tags:
        - public
      operationId: getHomeLiveFeedStream
      summary: 首页实时调用动态（SSE）
      description: |
        `Content-Type: text/event-stream`；事件类型 `call`，`data:` 为单条
        LiveFeedEvent JSON；每 15s 发送 `: heartbeat` 注释保活。单 IP 并发
        连接上限 5（modules-08 F-08-16 冻结值 / security-07 B9）：超限返回
        429，客户端应降级为 `/api/home/live-feed` 轮询。租约存于 Redis ZSET，
        随心跳续期，进程崩溃后最多 60s 自动回收。`site.home_blocks.live_feed
        =false` 时返回 404。

        实现先完成租约占用与 Redis `SUBSCRIBE` 确认（ack）后才写 `200`
        响应头：任一步失败都返回 `503`（带 `Retry-After`），而不是先建立
        一条永远收不到事件的空流。所有连接共享进程级订阅，连接只做本地
        注册/注销，不单独订阅 Redis。
      security: []
      responses:
        '200':
          description: SSE 流
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
            X-Accel-Buffering:
              description: no（禁用代理层缓冲）
              schema:
                type: string
          content:
            text/event-stream:
              schema:
                type: string
                description: '`event: call` + `data: <LiveFeedEvent JSON>`；保活为 `: heartbeat`。'
        '404':
          description: live_feed 区块已关闭
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: 单 IP 并发连接超过 5
          headers:
            Retry-After:
              description: 建议重试等待秒数（实现冻结为 5）
              schema:
                type: integer
                minimum: 0
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: |
            Redis 不可用，或租约占用/`SUBSCRIBE` 确认失败；此时尚未写出
            200 响应头，客户端应按 `Retry-After` 重试或降级为轮询。
          headers:
            Retry-After:
              description: 建议重试等待秒数（实现冻结为 5）
              schema:
                type: integer
                minimum: 0
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/pricing:
    get:
      tags:
        - public
      operationId: getPublicPricing
      summary: 公开定价目录（offset 分页；宽容参数）
      description: |
        只读 `model_pricing` / `group_pricing` / `user_groups`，并挂载
        `model_meta` / `vendors` 的展示元数据（同一快照）。可见集合为
        `model_pricing.status=1 AND billing_expr IS NULL`；命中的
        `model_meta.status=2` 档案使该模型从 items/facets 剔除（详情 404）。
        金额一律 int64 的 JSON 字符串；NULL 价列下发 null（不伪造兜底价）。
        非法参数逐项降级并返回 200（不存在的 facet 值丢弃、非法分页回退默认、
        `p` 越界回退最后一页）；空集是 200 + `items:[]`。facet 计数忽略本组
        自身筛选；capability/context/endpointType 的未知值丢弃。无档案模型的
        元数据字段按空数组/null 降级，`display_name` 回退 `model_id`、`vendor`
        按 `vendors.name` → `model_pricing.vendor` → `model_id` 前缀三级回退。
        `group_price` 仅在登录或显式 `group` 时出现；匿名且
        `billing.expose_group_ratios=false` 时分组 facet 的 ratio 为 null。响应带
        `ETag: "pricing-v<hash>"`，命中 `If-None-Match` 返回 304 无 body；版本
        hash 覆盖 model_pricing/group_pricing/user_groups/model_meta/vendors。
        缓存 `public, max-age=30, stale-while-revalidate=30`（带会话的个性化
        响应降级为 private）。
      security: []
      parameters:
        - name: p
          in: query
          schema:
            type: integer
            minimum: 1
          description: 页码（1 基）；非法或越界回退首屏/最后一页。
        - name: page_size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 24
          description: 每页条数；默认 24，上限 100（超出按 100 截断）。
        - name: search
          in: query
          schema:
            type: string
            maxLength: 128
          description: model_id 大小写不敏感子串；超长截断。
        - name: sort
          in: query
          schema:
            type: string
            enum:
              - name
              - price_asc
              - price_desc
            default: name
          description: |
            价格按输入价；同模式内 per_token 在 per_request 前，tie-breaker 为
            model_id。非法值回退 name。
        - name: vendor
          in: query
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
          description: 供应商多选（重复键或逗号分隔；大小写不敏感）；不存在的值丢弃。
        - name: capability
          in: query
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
          description: |
            能力多选（D1-21；重复键或逗号分隔，也接受 `capability[]`）；取
            `model_meta.capabilities`，无档案的模型不命中；未知值丢弃。
        - name: context
          in: query
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
          description: |
            上下文分档多选（也接受 `context[]`）：`8k`（≤8,192）、`32k`
            （8,193–32,768）、`128k`（32,769–131,072）、`200k+`（>131,072）；
            大小写不敏感，未知值丢弃。context_length 为 null 的模型不命中。
        - name: endpointType
          in: query
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
          description: |
            端点类型多选（D1-21；也接受 `endpointType[]` / `endpoint_type`）。
            取值来自档案 endpoints 的映射：chat.completions、messages、
            embeddings、images.generations、audio.speech、audio.transcriptions、
            rerank、generateContent；未知路径不产生取值，未知筛选值丢弃。
        - name: group
          in: query
          schema:
            type: string
          description: 分组预览；不存在则忽略。
        - name: quotaType
          in: query
          schema:
            type: string
            enum:
              - all
              - token
              - request
            default: all
          description: 计费类型；非法值回退 all。
        - name: include_group_price
          in: query
          schema:
            type: string
            enum:
              - '0'
              - '1'
            default: '1'
          description: 是否返回分组实付价（仍受会话/expose 规则约束）。
      responses:
        '200':
          description: OK（空集也是 200 + items:[]）
          headers:
            ETag:
              description: '"pricing-v<hash>"；hash 由 model_pricing/group_pricing/user_groups/model_meta/vendors 五张表的 max(updated_at)+count+max(id) 派生'
              schema:
                type: string
            Cache-Control:
              description: public, max-age=30, stale-while-revalidate=30（个性化响应 private）
              schema:
                type: string
            Vary:
              description: Accept-Encoding；个性化响应额外含 Cookie
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicPricingList'
        '304':
          description: If-None-Match 命中（无 body）
          headers:
            ETag:
              schema:
                type: string
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
  /api/pricing/{model_id}:
    get:
      tags:
        - public
      operationId: getPublicPricingDetail
      summary: 公开模型详情（URL 编码的 `/`）
      description: |
        `model_id` 以 URL 编码承载（如 `openai%2Fgpt-5`）。不存在、停用、无定价
        或表达式计价的模型统一返回 404 `model-not-found`。未编码的多段路径
        （`/api/pricing/openai/gpt-5`）、尾斜杠与其它无法匹配的定价子路径由
        公开兜底返回同一个 404（不会落入受保护 `/api/` 子树得到 401）。
        缓存与 ETag 策略同 `/api/pricing`；详情 ETag 由域版本 + 模型名哈希派生。
      security: []
      parameters:
        - name: model_id
          in: path
          required: true
          schema:
            type: string
            maxLength: 512
          description: URL 编码的模型名（可含 `/`）。
      responses:
        '200':
          description: OK
          headers:
            ETag:
              description: '"pricing-v<hash>-<modelHash>"'
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicModelDetail'
        '304':
          description: If-None-Match 命中（无 body）
        '404':
          description: 模型不存在或不可公示（type=model-not-found）
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
  /api/pricing/{model_id}/metrics:
    get:
      tags:
        - public
      operationId: getPublicPricingMetrics
      summary: 模型性能指标（真实调用平均值）
      description: |
        从日志库 `usage_logs` 聚合该模型在窗口内的真实调用数据（modules-09
        F-09-25）：`avg_latency_ms = AVG(latency_ms)`、`avg_ttft_ms =
        AVG(first_token_ms)`（仅流式调用有值）、`tps =
        SUM(completion_tokens) / (SUM(latency_ms)/1000)`（近似值）。
        无样本时对应字段为 null，前端显示「—」，不得回退成 0。
        样本少于 20 次由前端标注「样本不足」。
        `latest_test` 是独立的兜底来源：最近一次管理员主动测速（主库
        `model_performance_tests`）的 P50/P95、TPS 与成功率；没有记录、
        测速库未装配或读取失败时为 null（fail-open，端点仍为 200）。前端
        优先展示真实调用汇总，样本缺失时回退到 `latest_test` 并标注来源。
      security: []
      parameters:
        - name: model_id
          in: path
          required: true
          schema:
            type: string
            maxLength: 512
        - name: range
          in: query
          required: false
          schema:
            type: string
            enum:
              - 24h
              - 7d
            default: 24h
          description: 统计窗口；缺省 24h。
      responses:
        '200':
          description: OK
          headers:
            ETag:
              description: 模型 + 窗口 + 分钟桶派生；60 秒陈旧容忍。
              schema:
                type: string
            Cache-Control:
              description: public, max-age=60
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicModelMetrics'
        '304':
          description: If-None-Match 命中（无 body）
        '400':
          $ref: '#/components/responses/Error400'
        '404':
          description: 模型不存在或不可公示（type=model-not-found）
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          description: 性能数据源未装配（type=metrics-unavailable）
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/auth/login/encryption-key:
