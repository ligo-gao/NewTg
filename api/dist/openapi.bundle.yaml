        - bearerToken: []
      parameters:
        - $ref: '#/components/parameters/PathTokenID'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTokenRequest'
      responses:
        '200':
          description: 更新后的令牌
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '500':
          $ref: '#/components/responses/Error500'
    delete:
      tags:
        - user
      operationId: deleteToken
      summary: 删除令牌（可选乐观锁）
      description: |
        可选 query updated_at（RFC 3339）：提供时必须匹配当前版本，否则 409。
        未提供时直接删除。成功 204。
      security:
        - sessionCookie: []
        - bearerToken: []
      parameters:
        - $ref: '#/components/parameters/PathTokenID'
        - name: updated_at
          in: query
          required: false
          description: 乐观锁版本（RFC 3339）；缺省跳过版本校验。
          schema:
            type: string
            format: date-time
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '204':
          description: 已删除
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '500':
