          type: string
          maxLength: 128
          nullable: true
        ratio:
          type: integer
          format: int32
          description: 分组倍率（DB 150 表示 1.5）。
        user_selectable:
          type: boolean
        is_system:
          type: boolean
          description: 系统分组（如 default）不可删除。
        status:
          type: integer
          format: int16
        users_count:
          type: integer
          format: int64
        pricing_overrides_count:
          type: integer
          format: int64
        channels_count:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    AdminGroupList:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/AdminGroup'
      description: GET /api/groups 的 offset 分页信封。
    AdminCreateGroupRequest:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          type: string
          pattern: ^[a-z0-9_-]{2,32}$
        description:
          type: string
          maxLength: 128
          nullable: true
      description: 名称唯一；冲突 409（不区分大小写归一后比较）。
    AdminUpdateGroupRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          pattern: ^[a-z0-9_-]{2,32}$
        description:
          type: string
          maxLength: 128
          nullable: true
      description: |
        至少提供一个字段，否则 400。改名会同步更新引用该分组的用户/令牌
        （仓储事务）；系统组（default/auto 等）删除返回 400（handlers_groups.go:
        ErrGroupSystem → 400），被引用的分组删除返回 409。
    PricingMode:
      type: string
      enum:
        - per_token
        - per_request
        - tiered_expr
      description: |
        per_token=积分/1M tokens；per_request=积分/次（只使用 prompt_price）；
        tiered_expr=表达式模式（billing_expr 是唯一价格配置）。
    PricingStatus:
      type: integer
      enum:
        - 1
        - 2
      description: 1=启用，2=停用（软状态，不删行）。
    PricingTimeWindow:
      type: object
      additionalProperties: false
      required:
        - name
        - days
        - start
        - end
        - multiplier
      properties:
        name:
          type: string
          maxLength: 64
        days:
          type: array
          minItems: 1
          items:
            type: integer
            minimum: 1
            maximum: 7
          description: 1=周一 … 7=周日；跨夜窗口指**开始**的那一天。
        start:
          type: string
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
          description: HH:MM，左闭。
        end:
          type: string
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
          description: HH:MM，右开；end <= start 表示跨夜。
        multiplier:
          type: number
          format: double
          description: 十进制倍数（0.5 = 半价），0.01–100。
    PricingTimeConfig:
      type: object
      additionalProperties: false
      properties:
        enabled:
          type: boolean
          description: 未启用时公开面 pricing_schedule 为 null，结算行为不变。
        timezone:
          type: string
          description: IANA 时区名（启用时必填，例如 Asia/Shanghai）。
        holiday_policy:
          type: string
          enum:
            - none
            - cn_offpeak
          description: |
            none=不处理节假日；cn_offpeak=中国法定节假日全天按
            default_multiplier，调休上班日按工作日窗口计价。
        default_multiplier:
          type: number
          format: double
          description: 未命中窗口（以及 cn_offpeak 的法定假日）使用的倍率，0.01–100。
        windows:
          type: array
          items:
            $ref: '#/components/schemas/PricingTimeWindow'
          description: 同一时刻命中多个窗口时，数组顺序最后一条生效（前端提示重叠）。
    PricingStrategy:
      type: object
      additionalProperties: false
      required:
        - version
      properties:
        version:
          type: integer
          enum:
            - 1
          description: 第一阶段只接受 version=1。
        time:
          $ref: '#/components/schemas/PricingTimeConfig'
    ModelPricing:
      type: object
      additionalProperties: false
      required:
        - id
        - model
        - mode
        - author
        - status
        - free
        - has_strategy
        - strategy_kind
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          format: int64
        model:
          type: string
          pattern: ^[A-Za-z0-9._:/-]{1,128}$
        mode:
          $ref: '#/components/schemas/PricingMode'
        billing_expr:
          type: string
          nullable: true
          description: 非 null 即表达式模式；与四个价列互斥。
        prompt_price:
          type: integer
          nullable: true
          format: int64
          minimum: 0
          maximum: 9007199254740991
          description: 输入价（积分/1M tokens）；per_request 模式下是每次请求价。
        completion_price:
          type: integer
          nullable: true
          format: int64
          minimum: 0
          maximum: 9007199254740991
        cache_read_price:
          type: integer
          nullable: true
          format: int64
          minimum: 0
          maximum: 9007199254740991
        cache_write_price:
          type: integer
          nullable: true
          format: int64
          minimum: 0
          maximum: 9007199254740991
        author:
          type: string
          minLength: 1
          maxLength: 64
        vendor:
          type: string
          nullable: true
          maxLength: 64
        status:
          $ref: '#/components/schemas/PricingStatus'
        free:
          type: boolean
          description: 四项有效价全为 0 才为 true；单项 0 不得显示「免费」。
        has_strategy:
          type: boolean
          description: 是否存在结构化时段策略（strategy 非 NULL）。
        strategy_kind:
          type: string
          enum:
            - flat
            - peak_offpeak
          description: |
            结构化枚举：time.enabled=false / 无策略为 flat，启用时段为
            peak_offpeak。前端按七种语言本地化，响应里不出现中文字符串。
        strategy:
          anyOf:
            - $ref: '#/components/schemas/PricingStrategy'
            - enum:
                - null
          description: |
            完整策略。列表响应省略该字段（只给 has_strategy/strategy_kind）；
            单条读取、创建与更新响应返回规范化后的策略（无策略为 null）。
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
          description: 乐观锁版本；PATCH/启停必须原样回传。
    ModelPricingList:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/ModelPricing'
            quota_per_unit:
              type: integer
              format: int64
              description: 展示换算的每货币单位积分（默认 100）。
      description: GET /api/model-pricing 的 offset 分页信封。
    ModelPricingCreateRequest:
      type: object
      additionalProperties: false
      required:
        - model
      properties:
        model:
          type: string
          pattern: ^[A-Za-z0-9._:/-]{1,128}$
        mode:
          $ref: '#/components/schemas/PricingMode'
        billing_expr:
          type: string
          nullable: true
          description: 非空即表达式模式；与数值价列互斥（混用 400）。
        prompt_price:
          type: integer
          nullable: true
          format: int64
          minimum: 0
          maximum: 9007199254740991
        completion_price:
          type: integer
          nullable: true
          format: int64
          minimum: 0
          maximum: 9007199254740991
        cache_read_price:
          type: integer
          nullable: true
          format: int64
          minimum: 0
          maximum: 9007199254740991
        cache_write_price:
          type: integer
          nullable: true
          format: int64
          minimum: 0
          maximum: 9007199254740991
        author:
          type: string
          minLength: 1
          maxLength: 64
          description: 缺省 Unknown；null 与空串 422。
        vendor:
          type: string
          nullable: true
          maxLength: 64
        status:
          $ref: '#/components/schemas/PricingStatus'
        strategy:
          anyOf:
            - $ref: '#/components/schemas/PricingStrategy'
            - enum:
                - null
          description: |
            结构化时段策略；与 billing_expr 互斥（同时出现 400）。tiers/service
            等第二阶段字段会被 422 拒绝（problem.fields=[strategy.<field>]）。
            null/缺省表示不配置策略。
      description: |
        价格单位是整数积分；展示层按 quota_per_unit 换算为元。
        表达式非法/空白 400（problem.fields=[billing_expr]）；负数或超 2^53−1
        422；模型重复 409。
    PricingModelOption:
      type: object
      additionalProperties: false
      required:
        - model
        - mode
        - status
      properties:
        model:
          type: string
        mode:
          $ref: '#/components/schemas/PricingMode'
        status:
          $ref: '#/components/schemas/PricingStatus'
    PricingModelList:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PricingModelOption'
    PricingCandidate:
      type: object
      additionalProperties: false
      required:
        - model
        - display_name
        - vendor
        - context_length
        - sources
        - priced
        - mode
      properties:
        model:
          type: string
          pattern: ^[A-Za-z0-9._:/-]{1,128}$
        display_name:
          anyOf:
            - type: string
            - enum:
                - null
          description: 来自 model_meta；无档案时为 null。
        vendor:
          anyOf:
            - type: string
            - enum:
                - null
          description: 目录供应商名或 model_pricing.vendor；都没有时为 null。
        context_length:
          anyOf:
            - type: integer
              format: int64
            - enum:
                - null
        sources:
          type: array
          items:
            type: string
            enum:
              - catalog
              - channel
              - pricing
          description: 固定顺序 catalog → channel → pricing。
        priced:
          type: boolean
          description: 已存在 model_pricing 行（含停用行）。
        mode:
          $ref: '#/components/schemas/PricingMode'
    PricingCandidateList:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PricingCandidate'
    PricingPreviewParams:
      type: object
      additionalProperties: false
      properties:
        p:
          type: integer
          format: int64
          minimum: 0
          description: 输入 token（未单独定价的部分）。
        c:
          type: integer
          format: int64
          minimum: 0
        len:
          type: integer
          format: int64
          minimum: 0
        cr:
          type: integer
          format: int64
          minimum: 0
        cc5m:
          type: integer
          format: int64
          minimum: 0
        cc1h:
          type: integer
          format: int64
          minimum: 0
        img:
          type: integer
          format: int64
          minimum: 0
        img_cr:
          type: integer
          format: int64
          minimum: 0
        img_o:
          type: integer
          format: int64
          minimum: 0
        ai:
          type: integer
          format: int64
          minimum: 0
        ao:
          type: integer
          format: int64
          minimum: 0
        image_count:
          type: integer
          minimum: -1
          description: -1=未设置（按请求域缺省 1）；>=0=精确张数（0 合法且计 0）。缺省 -1。
    ModelPricingPreviewRequest:
      type: object
      additionalProperties: false
      required:
        - spec
      properties:
        spec:
          oneOf:
            - type: object
              additionalProperties: true
            - type: string
          description: |
            pricing.ParsePricing 接受的 spec：JSON 对象（mode/expr 或
            prompt_price/completion_price/cache_read_price/cache_write_price，
            也接受旧倍率风格 model_ratio 等）或等价的 JSON 字符串。
            求值与保存使用同一解析器。按次预览可只给 model_price（自动按
            per_request 解释），或显式 mode=per_request 且必须提供 model_price；
            后者缺失返回 400。
        model:
          type: string
          pattern: ^[A-Za-z0-9._:/-]{1,128}$
          description: 用于模型族默认值（补全倍率/Claude 缓存 1h）；可省略。
        group_ratio:
          type: number
          format: double
