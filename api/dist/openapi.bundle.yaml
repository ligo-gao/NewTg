      type: object
      additionalProperties: false
      required:
        - id
        - title
        - category
        - status
        - display_status
        - publish_at
        - created_by
        - updated_by
        - created_at
        - updated_at
        - content_markdown
        - content_html
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 80
        category:
          $ref: '#/components/schemas/AnnouncementCategory'
        status:
          $ref: '#/components/schemas/AnnouncementStatus'
        display_status:
          $ref: '#/components/schemas/AnnouncementDisplayStatus'
        publish_at:
          type: string
          format: date-time
        expire_at:
          type: string
          format: date-time
          nullable: true
        published_at:
          type: string
          format: date-time
          nullable: true
        offline_at:
          type: string
          format: date-time
          nullable: true
        created_by:
          type: integer
          format: int64
        updated_by:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        content_markdown:
          type: string
          maxLength: 16384
          description: Markdown 原文（≤16KB）。
        content_html:
          type: string
          description: |
            服务端净化后的 HTML 片段：原始 HTML 不解析（`<script>`/`<img
            onerror>` 只会以文本出现），链接仅 http(s) 且强制
            rel="noopener noreferrer"（R-D7-04）。
