      summary: 取消 pending 订单（本人；管理员 orders:manage）
      description: |
        仅 `pending → cancelled`；条件 UPDATE 抢不到（订单已终态/并发迁移）
        返回 409 `order_state_conflict`。数据库迁移成功后尽力关闭渠道支付单
        （支付宝 `alipay.trade.close` / Stripe PaymentIntent cancel），渠道
        失败只记日志，不阻断取消。
      security:
        - sessionCookie: []
        - bearerToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
