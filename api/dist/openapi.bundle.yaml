        - sessionCookie: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
        - name: keyword
          in: query
          required: false
          schema:
            type: string
        - name: p
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
