              schema:
                $ref: '#/components/schemas/Token'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '500':
          $ref: '#/components/responses/Error500'
  /api/tokens/{id}:reset-key:
    post:
      tags:
        - user
      operationId: resetTokenKey
      summary: 重置令牌密钥（新 key 仅此一次）
      description: |
        每次调用都会生成新 key（非幂等语义），但端点用 Idempotency-Key 包裹：
        同键重放返回首次的新 key，避免网络重试导致"key 已换但客户端没拿到"。
        旧 key 立即失效。成功 200 + {key,key_masked}，响应 Cache-Control:
        no-store。
      security:
        - sessionCookie: []
        - bearerToken: []
      parameters:
        - $ref: '#/components/parameters/PathTokenID'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '200':
          description: 新 key（一次性）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResetTokenKeyResponse'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '500':
          $ref: '#/components/responses/Error500'
  /api/token/auto-groups:
    get:
      tags:
        - user
      operationId: listTokenAutoGroups
      summary: 自动分组候选与单令牌上限
      description: 供令牌创建表单展示有序候选；max_count 默认 20。
      security:
        - sessionCookie: []
        - bearerToken: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenAutoGroupsResponse'
        '401':
          $ref: '#/components/responses/Error401'
        '500':
          $ref: '#/components/responses/Error500'
  /api/usage/token:
    get:
      tags:
        - user
      operationId: getTokenUsage
      summary: 令牌自读用量（Bearer 自身 key）
      description: |
        只接受 Bearer（不接受 Cookie）：凭据就是被查询的令牌本身。额度耗尽的
        令牌仍返回 200 且 total_available=0（前端要能显示耗尽状态，
        modules-02 §2.13）；已过期令牌 401 + problem type token_expired；
        禁用令牌 401 token_disabled；非法 key 401 invalid_token。
      security:
        - bearerToken: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenUsage'
        '401':
          description: |
            令牌不可用。problem type 区分原因：`token_expired`（已过期）、
            `token_disabled`（已禁用）、`invalid_token`（key 非法/不存在）；
            detail 不泄露令牌存在性与归属。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          $ref: '#/components/responses/Error503'
  /api/users:
    get:
      tags:
        - admin
      operationId: listUsers
      x-required-permission: users:read
      summary: 用户列表（分页 + 筛选 + 排序）
      description: |
        keyword 匹配用户名/显示名/邮箱（最多 64 字符）；status/role/group
        为精确筛选；sort 白名单 id|username|balance|created_at|updated_at，
        前缀 - 表示降序，默认 -created_at。非法枚举/排序列 400（不静默忽略）。
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: keyword
          in: query
          required: false
          schema:
            type: string
            maxLength: 64
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/UserStatus'
        - name: role
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/UserRole'
        - name: group
          in: query
          required: false
          schema:
            type: string
            maxLength: 32
        - name: sort
          in: query
          required: false
          schema:
            type: string
            pattern: ^-?(id|username|balance|created_at|updated_at)$
            default: -created_at
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserList'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '500':
          $ref: '#/components/responses/Error500'
    post:
      tags:
        - admin
      operationId: createUser
      x-required-permission: users:create
      summary: 创建用户（管理员创建无邮箱）
      description: |
        应携带 Idempotency-Key：同键重放只创建一条；同键不同请求体 422；
        缺失时直接执行（无重放保护）。
        请求体没有 email 字段——管理员创建的用户 email 为 NULL。role 缺省
        user；创建 admin 需要 users:manage-roles 且默认权限集是执行者权限的
        子集（防提权）。用户名冲突 409。成功 201。
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminCreateUserRequest'
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '500':
          $ref: '#/components/responses/Error500'
  /api/users/{id}:
