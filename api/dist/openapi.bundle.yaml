  /api/orders:
    post:
      tags:
        - user
      operationId: createOrder
      summary: 幂等创建充值订单并初始化渠道支付
      description: |
        `Idempotency-Key` 必填（UUID v4）。同一 key 重复提交返回首次订单
        （HTTP 200，不新建、不重新创建渠道支付单；即使渠道被关闭或下限
        被调整也照样返回首次订单）；key 属于其他用户时 409
        `order_state_conflict`。首次创建返回 201。
        **M5 无汇率：`currency` 只接受 CNY**（大小写不敏感），其它币种
        400。`provider=stripe` 返回 `client_secret`；`provider=alipay`
        返回 `qr_code`。渠道未启用/配置不完整（含支付宝沙箱模式）返回
        403；渠道 5xx 返回 502 且订单置 failed。
      security:
        - sessionCookie: []
        - bearerToken: []
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
        - name: Idempotency-Key
          in: header
          required: true
          description: 客户端生成的 UUID v4；全表唯一（P-2）
          schema:
            type: string
            minLength: 1
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '200':
          description: 幂等重放（返回首次订单，不含渠道支付载荷）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateOrderResponse'
        '201':
          description: 首次创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateOrderResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          description: 在线支付关闭或该渠道未启用/配置不完整
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Idempotency-Key 已被其他用户占用（order_state_conflict）
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/Error500'
        '502':
          description: 渠道初始化失败（订单已置 failed，provider_unavailable）
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    get:
      tags:
        - user
      operationId: listOrders
      summary: 订单列表与订单号搜索
      description: |
        本人订单（管理员 `orders:read` 可跨用户）。offset 分页（`p` 从 1
        开始，`page_size` 默认 20 / 最大 100），按 `created_at DESC, id DESC`
        倒序。`q` 是订单号子串；`user_id` 仅管理员可指定，普通用户指定他人
        返回 403。列表永不返回 `raw_callback`。
      security:
        - sessionCookie: []
        - bearerToken: []
      parameters:
        - name: p
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000000
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: status
          in: query
          schema:
            type: string
            enum:
              - pending
              - succeeded
              - failed
              - expired
              - cancelled
        - name: q
          in: query
          description: 订单号子串（最长 128 字符）
          schema:
            type: string
            maxLength: 128
        - name: user_id
          in: query
          description: 仅 `orders:read` 管理员可用
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderList'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '500':
          $ref: '#/components/responses/Error500'
