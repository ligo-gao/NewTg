            - zh-CN
            - zh-TW
            - fr
            - ru
            - ja
            - vi
        read_at:
          type: string
          format: date-time
          nullable: true
          description: null = 未读。
        created_at:
          type: string
          format: date-time
    UserNotificationList:
      type: object
      additionalProperties: false
      required:
        - items
