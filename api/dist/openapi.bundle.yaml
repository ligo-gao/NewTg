      description: |
        验证 {secret,code} 通过后一次性写入密文种子、8 组备用码哈希与
        totp_enabled=true，并把明文备用码返回给客户端（唯一一次）。验证
        失败不产生任何写入。已启用 409；无口令的 OAuth 用户 403。
