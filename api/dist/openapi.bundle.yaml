        - name: id
          in: path
          required: true
          description: 上游账号 id（正整数）；非法/不存在同形 404。
          schema:
            type: integer
            format: int64
            minimum: 1
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
