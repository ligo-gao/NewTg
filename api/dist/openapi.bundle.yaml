          in: query
          schema:
            type: string
            maxLength: 32
        - name: token_id
          in: query
          schema:
            type: integer
            format: int64
        - name: request_id
          in: query
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            type: string
            enum:
              - success
              - error
              - refunded
              - refused
        - name: username
          in: query
          schema:
            type: string
          description: 仅 admin+logs:read；精确匹配
      responses:
