          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '422':
          $ref: '#/components/responses/Error422'
        '500':
          $ref: '#/components/responses/Error500'
  /api/usage-stats/rates:
    get:
      tags:
        - user
      operationId: getUsageStatsRates
      summary: RPM/TPM/消费统计条
      description: |
        rpm_avg = 请求数/窗口分钟数；rpm_peak = 任一分钟最大请求数；
        tpm_avg = (输入+输出) tokens/窗口分钟数。admin 可用 scope=all。
      security:
        - sessionCookie: []
        - bearerToken: []
      parameters:
        - name: range
          in: query
          schema:
            type: string
            enum:
              - 24h
              - 7d
              - 14d
              - 30d
            default: 24h
        - name: start
          in: query
          schema:
            type: string
            format: date-time
        - name: end
          in: query
          schema:
            type: string
            format: date-time
        - name: username
          in: query
          schema:
            type: string
          description: 仅 admin+logs:read；精确匹配
        - name: scope
          in: query
          schema:
            type: string
            enum:
              - all
          description: 仅 admin+logs:read；非管理员传参返回 403
      responses:
        '200':
          description: 统计条
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageStatsRates'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '422':
          $ref: '#/components/responses/Error422'
        '500':
          $ref: '#/components/responses/Error500'
  /api/audit-logs:
    get:
      tags:
        - user
      operationId: listAuditLogs
      summary: 审计日志列表
      description: |
        user 仅见本人事件且响应隐藏 username 列；admin+logs:read 可见全部
        并可用 username 精确过滤。默认时间范围 30 天。
      security:
        - sessionCookie: []
        - bearerToken: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: category
          in: query
          schema:
            type: string
            enum:
              - login
              - security
              - operation
              - access_token
        - name: result
          in: query
          schema:
            type: string
            enum:
              - success
              - failed
        - name: range
          in: query
          schema:
            type: string
            enum:
              - 24h
              - 7d
              - 14d
              - 30d
            default: 30d
        - name: start
          in: query
          schema:
            type: string
            format: date-time
        - name: end
          in: query
          schema:
            type: string
            format: date-time
        - name: username
          in: query
          schema:
            type: string
          description: 仅 admin+logs:read
      responses:
        '200':
          description: 分页信封
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogPage'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '422':
          $ref: '#/components/responses/Error422'
        '500':
          $ref: '#/components/responses/Error500'
  /v1/tasks/{key}:
    post:
      tags:
        - relay
      operationId: submitTask
      summary: 提交任务插件任务
      description: |
        `{key}` 是插件 key（即平台名）。提交成功后 202：
        `{public_task_id, state, upstream_task_id?}`。
        插件未注册 404；已禁用/编译失败 409；无可用渠道 404 model_not_found；
        预扣失败 402（不落任务行、不调用上游）。
      security:
        - bearerToken: []
      parameters:
        - $ref: '#/components/parameters/TaskPluginKey'
      responses:
        '202':
          description: 已接受；任务已持久化（终态或待轮询）
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '402':
          $ref: '#/components/responses/Error402'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          description: 插件不可用（disabled / compile_failed）
        '413':
          description: 请求体超过 4 MiB
        '500':
          $ref: '#/components/responses/Error500'
        '502':
          description: 上游提交失败（含白名单拒绝、重定向、超时、非 2xx、解析失败）
    get:
      tags:
        - relay
      operationId: getTask
      summary: 查询任务状态
      description: |
        归属过滤：不存在或不属于当前用户一律 404（不区分原因）。
        `usage` 只包含插件声明字段的数量，绝不返回额度/价格。
      security:
        - bearerToken: []
      parameters:
        - $ref: '#/components/parameters/TaskPluginKey'
        - $ref: '#/components/parameters/TaskIDQuery'
      responses:
        '200':
          description: '{task_id,state,raw_state,progress_percent,usage?,artifacts?,fail_reason?}'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '404':
          $ref: '#/components/responses/Error404'
        '500':
          $ref: '#/components/responses/Error500'
  /v1/tasks/{key}/artifacts:
    get:
      tags:
        - relay
      operationId: listTaskArtifacts
      summary: 列出任务产物
      description: |
        产物从持久化 task.data 投影，不建第二份真相。每项包含宿主签发的
        `content_url`（能力 URL，长期有效；`access` 参数在日志中脱敏）。
      security:
        - bearerToken: []
      parameters:
        - $ref: '#/components/parameters/TaskPluginKey'
        - $ref: '#/components/parameters/TaskIDQuery'
      responses:
        '200':
          description: '{items:[{key,type,mime_type?,content_url}]}'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '404':
          $ref: '#/components/responses/Error404'
        '500':
          $ref: '#/components/responses/Error500'
  /v1/tasks/{key}/artifacts/{artifact_key}/content:
    get:
      tags:
        - relay
      operationId: getTaskArtifactContent
      summary: 取任务产物内容（能力 URL）
      description: |
        `access` 是宿主签发的 HMAC 票据，绑定插件 key、task_id 与
        artifact_key；设计上长期有效（无过期），轮换服务端密钥即可整体撤销。
        签名无效/过期 403；任务或产物不存在 404；上游失败 502。
        响应为流式（上限 64 MiB），HEAD 只返回头部。
      security: []
      parameters:
        - $ref: '#/components/parameters/TaskPluginKey'
        - $ref: '#/components/parameters/TaskArtifactKey'
        - $ref: '#/components/parameters/TaskIDQuery'
        - $ref: '#/components/parameters/TaskArtifactAccess'
      responses:
        '200':
          description: 产物二进制流（Content-Type 取上游或产物声明；响应体真源不在本文件内联）
        '400':
          $ref: '#/components/responses/Error400'
        '403':
          description: access 票据无效或已过期
        '404':
          $ref: '#/components/responses/Error404'
        '502':
          description: 上游拒绝或取产物失败
        '503':
          description: 插件当前不可用
    head:
      tags:
        - relay
      operationId: headTaskArtifactContent
      summary: 取任务产物内容（HEAD）
      description: |
        与 GET 使用同一能力票据与校验，只返回状态码与头部，不写响应体。
        签名无效/过期 403；任务或产物不存在 404；上游失败 502。
      security: []
      parameters:
        - $ref: '#/components/parameters/TaskPluginKey'
        - $ref: '#/components/parameters/TaskArtifactKey'
        - $ref: '#/components/parameters/TaskIDQuery'
        - $ref: '#/components/parameters/TaskArtifactAccess'
      responses:
        '200':
          description: 头部可用（响应体为空）
        '400':
          $ref: '#/components/responses/Error400'
        '403':
          description: access 票据无效或已过期
        '404':
          $ref: '#/components/responses/Error404'
        '502':
          description: 上游拒绝或取产物失败
        '503':
          description: 插件当前不可用
  /api/task/self:
    get:
      tags:
        - user
      operationId: listSelfTasks
      summary: 本人任务台账（分页）
      description: |
        按 created_at 倒序；`state` 可逗号分隔筛选 7 态之一或多值。
        台账不返回 data / private_data（设计 §7.1 Omit）。
      security:
        - sessionCookie: []
        - bearerToken: []
      parameters:
        - name: p
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
        - name: page_size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: state
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: 任务分页
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskListResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '500':
          $ref: '#/components/responses/Error500'
  /api/task:
    get:
      tags:
        - admin
      operationId: listTasks
      x-required-permission: logs:read
      summary: 全站任务台账（分页 + 用户/状态筛选）
      description: |
        `user_id` 可选（正整数）；`state` 可逗号分隔筛选。台账不返回
        data / private_data（设计 §7.1 Omit）。
      security:
        - sessionCookie: []
      parameters:
        - name: user_id
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: p
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
        - name: page_size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: 任务分页（含 user_id）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskListResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '500':
          $ref: '#/components/responses/Error500'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-nkt_sess
      description: |
        控制台会话 Cookie（HttpOnly; Secure; SameSite=Lax; Path=/）。
        Cookie 会话路径上的非安全方法（POST/PUT/PATCH/DELETE）必须同时发送 X-CSRF-Token；Bearer 路径豁免（security-01 §2.2）。
    bearerToken:
      type: http
      scheme: bearer
      bearerFormat: nkt-<token>
      description: |
        API 令牌（明文仅创建时展示一次）。请求头：Authorization: Bearer nkt-…
  parameters:
    Page:
      x-go-name: PageQuery
      name: p
      in: query
      required: false
      description: 页码，1 基（默认 1）
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      required: false
      description: 每页条数（默认 20，上限 100）
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: 写操作幂等键（UUID）。同键重放在有效窗口内返回首次结果。
      schema:
        type: string
        format: uuid
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: false
      description: |
        条件必带：Cookie 会话路径的非安全方法（POST/PUT/PATCH/DELETE）必须发送；
        Authorization: Bearer 路径豁免（无 CSRF 风险）。
      schema:
        type: string
        minLength: 1
    PathUserID:
      name: id
      in: path
      required: true
      description: 用户 ID（正整数）；解析失败与不存在统一 404。
      schema:
        type: integer
        format: int64
        minimum: 1
    PathTokenID:
      name: id
      in: path
      required: true
      description: 令牌 ID（正整数）；他人令牌与不存在统一 404。
      schema:
        type: integer
        format: int64
        minimum: 1
    PathSessionID:
      name: sid
      in: path
      required: true
      description: 会话 id（不透明字符串，取自 GET /api/sessions）。
      schema:
        type: string
        minLength: 1
    PathGroupName:
      name: name
      in: path
      required: true
      description: 分组名（^[a-z0-9_-]{2,32}$）。
      schema:
        type: string
        pattern: ^[a-z0-9_-]{2,32}$
    PathPricingModel:
      name: model
      in: path
      required: true
      description: 计费模型名（1–128 字符，允许 A-Za-z0-9._:-）；不存在 404。
      schema:
        type: string
        pattern: ^[A-Za-z0-9._:-]{1,128}$
    PathGroupTag:
      name: group
      in: path
      required: true
      description: 分组名（user_groups.name）。
      schema:
        type: string
        pattern: ^[a-z0-9_-]{2,32}$
    UpdatedAtQuery:
      name: updated_at
      in: query
      required: true
      description: |
        乐观锁版本（GET 列表返回的 updated_at 原样回传）。DELETE 无 body，
        故通过查询参数传递；不匹配返回 409。
      schema:
        type: string
        format: date-time
    ConfirmAction:
      name: X-Confirm-Action
      in: header
      required: true
      description: |
        服务端强制确认（modules-08 §3.19 Q3）。取值 "true"（大小写不敏感）；
        缺失或其他值一律 422 confirm_required，且在任何副作用之前拒绝。
        前端 DangerConfirm 只是体验层，本请求头才是授权门。
      schema:
        type: string
    PathRedemptionCodeID:
      name: id
      in: path
      required: true
      description: redemption_codes.id
      schema:
        type: integer
        format: int64
        minimum: 1
    TaskPluginKey:
      name: key
      in: path
      required: true
      description: 插件 key（1–30，^[a-z0-9][a-z0-9-]*$）
      schema:
        type: string
        maxLength: 30
    TaskIDQuery:
      name: task_id
      in: query
      required: true
      description: 对外任务 ID（task_<32 hex>）
      schema:
        type: string
    TaskArtifactKey:
      name: artifact_key
      in: path
      required: true
      description: 任务内产物 key（由 task.data.artifacts[].key 投影；T6b 冻结字符集）
      schema:
        type: string
        pattern: ^[A-Za-z0-9._-]{1,128}$
        maxLength: 128
    TaskArtifactAccess:
      name: access
      in: query
      required: true
      description: 宿主签发的 HMAC 能力票据（长期有效；无效/过期 403）
      schema:
        type: string
  schemas:
    Problem:
      type: object
      description: RFC 7807 Problem Details；允许扩展成员（如 request_id）。
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          format: uri
          default: about:blank
          description: 问题类型 URI（稳定机器可读标识）
        title:
          type: string
          description: 简短的人类可读摘要
        status:
          type: integer
          minimum: 100
          maximum: 599
          description: HTTP 状态码（与响应状态行一致）
        detail:
          type: string
          description: 针对本次问题的说明
        instance:
          type: string
          description: 问题实例 URI（通常为请求路径）
      additionalProperties: true
    Problem402:
      description: 额度/余额不足（Problem 的 402 扩展；计费 §6.2、relay §4.4）
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            balance:
              type: integer
              description: 当前可用余额（credits 最小单位）
            required:
              type: integer
              description: 本次请求所需额度
            currency:
              type: string
              enum:
                - credits
            topup_url:
              type: string
              format: uri
              description: 充值页地址
    Page:
      type: object
      description: offset 分页信封；各域 items 的 DTO 随里程碑细化。
      required:
        - items
        - total
        - page
        - page_size
      properties:
        items:
          type: array
          items: {}
        total:
          type: integer
          minimum: 0
          description: 满足条件的总条数
        page:
          type: integer
          minimum: 1
          description: 当前页码（1 基）
        page_size:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
          description: 每页条数（默认 20，上限 100）
    PublicStatus:
      type: object
      additionalProperties: false
      required:
        - system_initialized
        - auth
        - password_login_encryption_enabled
        - languages
        - default_language
        - site
        - nav
        - billing
        - pay
        - usd_exchange_rate
        - credit_display_symbol
        - usable_groups
      description: |
        公开站点状态（GET /api/status）。响应 Cache-Control: no-store——站点开关
        变更必须立即反映到登录/注册页，禁止任何中间层缓存。
      properties:
        system_initialized:
          type: boolean
          description: |
            站点是否已完成首次初始化（system.install.completed_at 已写入）。前端据此
            实现 /setup 闸门：false 时控制台路由一律重定向到安装向导；已初始化后
            向导页反向导流到登录页（重复 POST /api/setup 返回 409 + initialized=true）。
        auth:
          type: object
          additionalProperties: false
          required:
            - signup_enabled
            - password_login_enabled
            - email_verification_required
            - turnstile
          properties:
            signup_enabled:
              type: boolean
              description: false 时 POST /api/auth/register 返回 403（关闭注册）。
            password_login_enabled:
              type: boolean
              description: false 时 POST /api/auth/login 返回 403（仅保留 OAuth 等其它入口）。
            email_verification_required:
              type: boolean
              description: 注册后是否必须先验证邮箱才能使用完整功能。
            turnstile:
              type: object
              additionalProperties: false
              required:
                - enabled
                - site_key
              properties:
                enabled:
                  type: boolean
                site_key:
                  type: string
                  description: Turnstile 公开 site key；未启用时为空串。站点 secret 永不下发。
        password_login_encryption_enabled:
          type: boolean
          description: |
            与 GET /api/auth/login/encryption-key 的 enabled 字段同一开关。
            true 时登录只接受 password_encrypted，出现明文 password 一律拒绝
            （reason=encryption_required，对外响应与口令错误不可区分）。
        languages:
          type: array
          minItems: 7
          maxItems: 7
          uniqueItems: true
          description: canonical 7 语（modules-01 F-01-19）；顺序即下拉框顺序。
          items:
            $ref: '#/components/schemas/Language'
        default_language:
          $ref: '#/components/schemas/Language'
        site:
          $ref: '#/components/schemas/PublicSite'
        nav:
          $ref: '#/components/schemas/PublicNav'
        billing:
          $ref: '#/components/schemas/PublicBilling'
        pay:
          $ref: '#/components/schemas/PublicPay'
        usd_exchange_rate:
          type: number
          format: double
          description: |
            USD→CNY 展示汇率常量（billing-02 §4.1 唯一真源，7.1 = 71/10）。
            只用于展示层换算，不是设置键。
        credit_display_symbol:
          type: string
          description: 等于 billing.currency_symbol（展示用积分符号）。
        usable_groups:
          type: array
          description: |
            当前会话用户的可用分组与分组模型清单（modules-02 §2.14 / F-02-18）。
            仅当请求携带有效会话时非空；匿名、会话失效或 Redis/DB 查询失败时
            一律为空数组（公开面不返回 401/5xx）。可用分组 =
            user_groups.status=1 且（user_selectable=true 或 name = 用户当前分组）；
            models = 该分组下启用渠道的 supported_models 之并集，且仅保留
            model_pricing.status=1 的模型，去重排序。
          items:
            $ref: '#/components/schemas/UsableGroup'
    GeoIPResponse:
      type: object
      additionalProperties: false
      required:
        - country
        - region
        - source
      description: |
        客户端粗粒度地理区域。不返回坐标、城市级精度、IP 原文、ASN 或代理链。
        响应缓存策略：Cache-Control: private, max-age=300。
      properties:
        country:
          anyOf:
            - type: string
              pattern: ^[A-Z]{2}$
            - enum:
                - null
          description: ISO 3166-1 alpha-2（大写）；无法判定为 null
        region:
          anyOf:
            - type: string
              maxLength: 64
            - enum:
                - null
          description: ISO 3166-2 子分区码；无法判定为 null
        source:
          type: string
          enum:
            - local_db
            - unknown
          description: local_db=命中本地 GeoIP 库；unknown=库缺失或无匹配
    Token:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - status
        - key_masked
        - unlimited_quota
        - group
        - cross_group_retry
        - created_at
        - updated_at
      description: |
        管理面令牌响应。永不包含 key 明文或 key_hash；完整 key 只在创建
