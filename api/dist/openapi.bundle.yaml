      operationId: confirmPaymentCompliance
      x-required-permission: settings:manage
      summary: 确认支付设置合规责任
      description: |
        必须提交**逐字符精确**的 `confirmation` 文本
        「我已了解支付合规责任」；前后空白、标点或其它语言均返回 400，
        且零写入、零审计。文本校验在服务端完成，前端禁用态不是授权证据。
        首次成功确认写入 `users.payment_compliance_confirmed_at=now()` 并写
        一条 `settings.payment_compliance_confirmed` 审计（who/when）；
        重复调用是幂等重放：返回首次时刻、不再写审计、不改写时间。
        响应与审计均不包含任何支付密钥或输入原文之外的敏感信息。
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentComplianceConfirmRequest'
      responses:
        '200':
          description: 已确认（首次或幂等重放）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentComplianceStatus'
        '400':
          description: 文本不匹配或请求体非法；响应 Problem 带 `fields=["confirmation"]`
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          description: 当前会话对应的用户已不存在（并发删除/脏会话）
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/Error500'
  /api/settings/test/webhook:
    post:
      tags:
        - admin
      operationId: testWebhookSettings
      x-required-permission: settings:manage
      summary: 向已保存的 Webhook 端点发送一条固定样例事件
      description: |
        配置取自**已保存**的 `notify.webhook.*` 快照；请求体为空。
        URL/secret 未配置 → 422 `type=https://newtg.dev/problems/webhook_not_configured`；
        目标被最小 SSRF 守卫拒绝 → 422 `type=https://newtg.dev/problems/webhook_target_blocked`
        （两者都是 422，但 type 不同：前者补齐配置后可重试，后者必须更换目标或调整白名单）；
        连接失败/超时 → 504 固定文案；**已收到 HTTP 响应即返回 200**，
        `ok` 表示目标是否 2xx，`status_code` 原样回传（含 3xx/4xx/5xx，3xx 不跟随）。
        不受 `enabled=false` 与事件订阅影响（测试目的就是验证未启用的配置）。
        限流 3 次/分钟/管理员。**不写 `notification_deliveries`**；审计动作
        `settings.test_webhook`，detail 仅 event/status_code/ok/host。
        样例 payload 不是事件契约（业务 payload 归模块 01/03/04）。
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '200':
          description: 已收到目标 HTTP 响应（2xx 或非 2xx）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookTestResult'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '422':
          description: |
            保存的 Webhook 配置不可用于测试，响应的 `type` 区分两种可操作原因：
            - `https://newtg.dev/problems/webhook_not_configured`：URL 或签名密钥未配置；
            - `https://newtg.dev/problems/webhook_target_blocked`：URL 被出站守卫拒绝
              （非 https、含 userinfo/fragment、私网/loopback/link-local 或主机不可解析）。
            两者 `detail` 均为固定文案，不包含目标地址或上游错误原文。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                not_configured:
                  value:
                    type: https://newtg.dev/problems/webhook_not_configured
                    title: Webhook is not configured
                    status: 422
                    detail: configure notify.webhook.url and notify.webhook.secret before testing
                target_blocked:
                  value:
                    type: https://newtg.dev/problems/webhook_target_blocked
                    title: Webhook target is not allowed
                    status: 422
                    detail: the configured URL is not an allowed outbound target
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          description: 服务端内部错误（如密钥解封失败）；响应为固定文案，不泄露内部细节
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: 测试发送器未装配；响应为固定文案
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '504':
          description: 连接失败或超时（未收到 HTTP 响应，固定文案）
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/settings/notify-webhook:resume:
    post:
      tags:
        - admin
      operationId: resumeWebhookNotifications
      x-required-permission: settings:manage
      summary: 恢复因连续失败而自动暂停的 Webhook 推送
      description: |
        清除 `notify:webhook:paused` 与 `notify:webhook:fail_streak`。
        队列中的 queued 投递保持原 attempt/next_retry_at，由 N8 worker 在下一轮
        （≤1 分钟）继续发送；测试端点从不经过暂停状态，因此不受影响。
        该操作幂等：未暂停时调用同样返回 `paused=false`。
        Redis 不可用 → 503（恢复未生效，不得谎报成功）。
        审计动作 `settings.webhook_resume`，detail 仅 `paused`。
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '200':
          description: 暂停状态已清除（或原本未暂停）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookResumeResult'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '503':
          description: Redis 不可用，暂停状态未能清除；响应为固定文案
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/deployments:
    get:
      tags:
        - admin
      operationId: listDeployments
      x-required-permission: settings:manage
      summary: 部署列表与全量检索
      description: |
        keyword 在**全结果集**上过滤（provider 无 keyword 参数时按页扫描，
        上限 10 页 / 1000 条；达到上限时 search_truncated=true）。
        status_counts 按扫描到的全量口径统计，不受当前页影响；扫描被截断或
        provider 未返回 total 时，status_counts 与 total 只代表已扫描窗口。
        p 默认 1；page_size 默认 20、上限 100（超出截断并回显实际值）。
