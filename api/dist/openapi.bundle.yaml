          format: int64
          description: 入账后的钱包余额快照
    DeploySettings:
      type: object
      additionalProperties: false
      required:
        - enabled
        - has_secret
        - can_connect
        - updated_at
      description: |
        作用域化设置投影。永不含 api_key；has_secret 是密钥是否已配置的唯一
        外部可见事实。updated_at 为 null 表示该 section 尚无任何落库行。
      properties:
        enabled:
          type: boolean
        has_secret:
          type: boolean
        can_connect:
          type: boolean
          description: enabled && has_secret
        updated_at:
          type: string
          format: date-time
          nullable: true
    UpdateDeploySettingsRequest:
      type: object
      additionalProperties: false
      required:
        - enabled
      properties:
        enabled:
          type: boolean
        api_key:
          type: string
          description: 留空或 "******" = 不更新已存密钥。
        clear_api_key:
          type: boolean
          description: true 时删除已存密钥；与 api_key 同时出现返回 400。
        updated_at:
          type: string
          format: date-time
          nullable: true
          description: 读取时的乐观锁版本；陈旧值返回 409。
    DeployConnectionTestRequest:
      type: object
      additionalProperties: false
      properties:
        api_key:
          type: string
          description: 可选的候选密钥；只在本次请求内存中使用。
    DeployConnectionTestResult:
      type: object
      additionalProperties: false
      required:
        - ok
        - hardware_count
        - total_available
        - latency_ms
      properties:
        ok:
          type: boolean
        hardware_count:
          type: integer
        total_available:
          type: integer
        latency_ms:
          type: integer
          format: int64
    SettingsItem:
      type: object
      additionalProperties: false
      required:
        - key
        - value
        - type
        - default
        - public
        - secret
        - dangerous
      description: |
        注册表中的一项。`value` 为 null 表示该键尚未落库（使用 `default`）。
        秘密项（`secret=true`）的 `value` 恒为掩码（配置后）或 null，明文永不回传。
      properties:
        key:
          type: string
        value:
          description: 当前生效值；secret 项为掩码；未落库时为 null。
        type:
          type: string
          enum:
            - bool
            - string
            - int
            - number
            - enum
            - list
            - object
        default:
          description: 注册表默认值（不因用户修改而变化）。
        public:
          type: boolean
          description: 是否可经公开接口下发。
        secret:
          type: boolean
        dangerous:
          type: boolean
        danger_direction:
          type: string
          enum:
            - ''
            - 'on'
            - 'off'
            - any
          description: |
            危险项的风险方向；非危险项为空串。`any` 表示任意变更（含密钥替换）
            都需要二次确认。
        locked:
          type: boolean
          description: 服务端只读项（管理面不可修改）。
    SettingsSection:
      type: object
      additionalProperties: false
      required:
        - section
        - updated_at
        - items
      properties:
        section:
          type: string
        updated_at:
          type: string
          format: date-time
          nullable: true
          description: section 内各键 `updated_at` 的最大值；从未写入时为 null。
        items:
          type: array
          items:
            $ref: '#/components/schemas/SettingsItem'
    SettingsUpdateRequest:
      type: object
      additionalProperties: false
      required:
        - values
      description: |
        只提交**变更**的键（部分更新）。秘密项：缺省 = 不修改；null = 显式清除；
        字符串 = 替换为新值。`values` 必填（`{}` 表示空更新）。
        `expect_updated_at` 是乐观锁：与当前值不一致返回 409。
        命中危险方向时需要 `dangerous_confirmed=true`，否则返回 400。
      properties:
        section:
          type: string
          description: 可选；若提供必须与 query 的 section 一致，否则 400。
        values:
          type: object
          additionalProperties: true
        expect_updated_at:
          type: string
          format: date-time
          nullable: true
        dangerous_confirmed:
          type: boolean
    SettingsUpdateResponse:
      type: object
      additionalProperties: false
      required:
        - section
        - updated_at
        - values
      properties:
        section:
          type: string
        updated_at:
          type: string
          format: date-time
          nullable: true
        values:
          type: object
          additionalProperties: true
          description: 本次实际写入的键与归一化后的值。
    PaymentComplianceStatus:
      type: object
      additionalProperties: false
      required:
        - confirmed
        - confirmed_at
      properties:
        confirmed:
          type: boolean
          description: 该管理员是否已确认支付设置合规责任。
        confirmed_at:
          type: string
          format: date-time
          nullable: true
          description: 首次确认时刻；`confirmed=false` 时为 null。
    PaymentComplianceConfirmRequest:
      type: object
      additionalProperties: false
      required:
        - confirmation
      properties:
        confirmation:
          type: string
          description: |
            精确确认文本，必须逐字符等于「我已了解支付合规责任」。
            前后空白、标点或其它语言均返回 400（服务端校验，零写入）。
    WebhookTestResult:
      type: object
      additionalProperties: false
      required:
        - ok
        - status_code
      properties:
        ok:
          type: boolean
          description: 目标是否返回 2xx；3xx/4xx/5xx 均为 false。
        status_code:
          type: integer
          minimum: 0
          description: 目标 HTTP 状态码原样回传（3xx 不跟随）。
      description: POST /api/settings/test/webhook 的响应；测试样例非事件契约。
    WebhookResumeResult:
      type: object
      additionalProperties: false
      required:
        - paused
      properties:
        paused:
          type: boolean
          description: 恢复后恒为 false（字段保留以便前端直接消费）。
      description: |
        POST /api/settings/notify-webhook:resume 的响应。恢复只清除运行时状态
        （`notify:webhook:paused` 与 `notify:webhook:fail_streak`），不修改任何
        settings 键，也不重排队列中的 queued 投递。
