        account_id:
          type: integer
          format: int64
        generated_at:
          type: string
          format: date-time
          description: 本次汇总的生成时刻（UTC）。
        days:
          type: array
          items:
            $ref: '#/components/schemas/ReconcileSummaryDay'
    ReconcileSummaryDay:
      type: object
