      operationId: getLoginEncryptionKey
      summary: 登录口令加密公钥（关闭时 {enabled:false}）
      description: |
        前端缓存 5 分钟（DisableCache 语义是响应头禁止中间层缓存，不是禁止
        客户端短缓存）。开启时返回 {kid, public_key}；关闭时固定
        {enabled:false}。取公钥失败返回 503，绝不回落到明文登录。
      security: []
      responses:
        '200':
          description: OK
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginEncryptionKeyResponse'
        '503':
          $ref: '#/components/responses/Error503'
  /api/auth/email-code:
    post:
      tags:
        - public
      operationId: requestEmailCode
      summary: 发送 6 位一次性邮箱验证码
      description: |
        TTL 10 分钟、一次性。同邮箱 1 次/60 秒、同 IP 10 次/小时；超限 429
        + Retry-After。成功恒 204，响应不回显验证码。purpose=verify|bind
        要求有效会话（本端点不经过 SessionAuth，实现内显式校验），缺失 401。
        SMTP 未配置时返回 503 `email_unavailable`（fail-closed：不生成验证码，
        不会出现「204 但用户永远收不到」）。SMTP 发送失败返回 502
        `email_send_failed`（验证码同时作废，避免留下收不到的有效码）。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailCodeRequest'
      responses:
        '204':
          description: 验证码已生成并投递（SMTP 未配置时返回 503 而非本响应）
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '429':
          $ref: '#/components/responses/Error429'
        '502':
          $ref: '#/components/responses/Error502'
        '503':
          $ref: '#/components/responses/Error503'
