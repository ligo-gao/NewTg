          format: int64
        alert_count:
          type: integer
          format: int64
        warn_count:
          type: integer
          format: int64
        delta_token_bp:
          type: integer
          format: int64
          nullable: true
          description: 当日加权 token 差异率；null = 当天没有可比对的快照维度。
        revenue_minor:
          type: integer
          format: int64
          nullable: true
        upstream_cost_minor:
          type: integer
          format: int64
          nullable: true
        margin_minor:
          type: integer
          format: int64
          nullable: true
    ReconcileRunRequest:
      type: object
      additionalProperties: false
      description: |
        手动触发对账。body 必填；account_id 缺省（传 {}）表示遍历全部启用账号。
        运行同步执行（60s 超时，超时 504）。
      properties:
        account_id:
          type: integer
          format: int64
          minimum: 1
          description: 只对账该账号；缺省 = 全部 active 账号。
    ReconcileRunResult:
      type: object
      additionalProperties: false
      description: 手动触发的聚合结果；run_ids 为本次生成的 run（重跑会新增 run）。
      required:
