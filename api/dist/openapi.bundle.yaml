        request_count:
          type: integer
          format: int64
        success_rate:
          type: number
          minimum: 0
          maximum: 1
          description: success / total；0 行时为 0（绝不 NaN）
        prompt_tokens_total:
          type: integer
          format: int64
        completion_tokens_total:
          type: integer
          format: int64
        pre_deducted_total:
          type: integer
          format: int64
        refunded_total:
          type: integer
          format: int64
    UsageStatsByModelItem:
      type: object
      additionalProperties: false
      required:
        - model
        - cost
        - tokens
        - percent
      properties:
        model:
          type: string
          description: 第 9 名起聚合为 other
        cost:
          type: integer
          format: int64
        tokens:
          type: integer
          format: int64
        percent:
          type: number
          description: 十进制基点分配，各扇区合计恰为 100
    UsageStatsTimeseriesItem:
      type: object
      additionalProperties: false
      required:
        - bucket
        - cost
        - requests
      properties:
        bucket:
          type: string
          description: UTC ISO 时间桶（YYYY-MM-DDTHH:MM:SSZ）
        cost:
          type: integer
          format: int64
        requests:
          type: integer
          format: int64
    UsageStatsRates:
      type: object
      additionalProperties: false
      required:
        - rpm_avg
        - rpm_peak
        - tpm_avg
        - cost_total
        - pre_deducted_total
        - refunded_total
      properties:
        rpm_avg:
          type: number
          description: 请求数 / 窗口分钟数
        rpm_peak:
          type: integer
          format: int64
          description: 任一分钟最大请求数
        tpm_avg:
          type: number
          description: (输入+输出) tokens / 窗口分钟数
        cost_total:
          type: integer
          format: int64
        pre_deducted_total:
          type: integer
          format: int64
        refunded_total:
          type: integer
          format: int64
    AuditLogItem:
      type: object
      additionalProperties: false
      required:
        - id
        - user_id
        - category
        - result
        - created_at
      properties:
        id:
          type: integer
          format: int64
        user_id:
          type: integer
          format: int64
        username:
          type: string
          description: 仅 admin+logs:read 视图返回（user 视图隐藏）
        category:
          type: string
          enum:
            - login
            - security
            - operation
            - access_token
        ip:
          type: string
          nullable: true
        user_agent:
          type: string
          nullable: true
        method:
          type: string
          nullable: true
        route:
          type: string
          nullable: true
        status_code:
          type: integer
          nullable: true
        result:
          type: string
          enum:
            - success
            - failed
        detail:
          nullable: true
          description: 事件描述（已脱敏）
        before:
          nullable: true
          description: 变更前快照（已脱敏）
        after:
          nullable: true
          description: 变更后快照（已脱敏）
        created_at:
          type: string
          format: date-time
    AuditLogPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/AuditLogItem'
    TaskListItem:
      type: object
      additionalProperties: false
      required:
        - task_id
        - family
        - action
        - plugin_key
        - state
        - raw_state
        - progress_percent
      properties:
        id:
          type: integer
          format: int64
        task_id:
          type: string
          description: 对外任务 ID（task_<32 hex>）
        upstream_task_id:
          type: string
        family:
          type: string
          enum:
            - plugin
        action:
          type: string
        plugin_key:
          type: string
          maxLength: 30
        plugin_generation:
          type: integer
          format: int64
        fetch_mode:
          type: string
          enum:
            - poll
            - callback
            - inline
        locked_channel_id:
          type: integer
          format: int64
        origin_task_ids:
          type: array
          items:
            type: string
        state:
          type: string
          enum:
            - not_start
            - submitted
            - queued
            - in_progress
            - success
            - failure
            - unknown
        raw_state:
          type: string
        progress_percent:
          type: integer
          minimum: 0
          maximum: 100
        retention_deadline:
          type: string
          format: date-time
          nullable: true
        user_id:
          type: integer
          format: int64
          description: 仅管理员台账返回；self 台账省略
        group:
          type: string
        channel_id:
          type: integer
          format: int64
        quota:
          type: integer
          format: int64
        fail_reason:
          type: string
        submit_time:
          type: string
          format: date-time
          nullable: true
        start_time:
          type: string
          format: date-time
          nullable: true
        finish_time:
          type: string
          format: date-time
          nullable: true
        properties:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    TaskListResponse:
      type: object
      additionalProperties: false
      required:
        - items
        - total
        - page
        - page_size
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TaskListItem'
        total:
          type: integer
        page:
          type: integer
        page_size:
          type: integer
  responses:
    Error400:
      description: 请求不符合契约（参数/请求体校验失败）
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Error401:
      description: 未认证或凭据失效
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Error402:
      description: 额度/余额不足
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem402'
    Error403:
      description: 已认证但无权访问
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Error404:
      description: 资源不存在
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Error409:
      description: 冲突（含乐观并发 updated_at 不匹配）
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Error422:
      description: 语义不可处理（邮箱域名白名单拒绝；幂等键被不同请求体复用）
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Error429:
      description: 触发限流
      headers:
        Retry-After:
          description: 建议重试等待秒数
          schema:
            type: integer
            minimum: 0
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Error500:
      description: 服务端内部错误
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Error502:
      description: 上游依赖失败（如验证码邮件投递失败）
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Error503:
      description: 服务不可用（依赖未就绪或过载）
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Error410:
      description: 资源已过期（兑换码虚拟过期态）
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
