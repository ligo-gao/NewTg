        - admin
      operationId: previewModelSync
      x-required-permission: channels:manage_sensitive
      summary: 上游元数据同步预览（只读）
      description: |
        拉取 model_sync.source_url 的清单，与本地目录对账并返回六类候选：
        create / update / unchanged / blocked（本地 sync_official=false）/
        missing_upstream（本地有、上游无）/ missing_vendor（本地 vendor_id
        指向不存在的供应商）。source_version 是清单原文的 sha256，apply 必须
        原样回传；服务端把清单缓存 1h（不落同步历史表）。
        源未配置 ⇒ 503；清单不可达/非法 ⇒ 502（固定文案，不含上游细节）。
      security:
        - sessionCookie: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelSyncPreview'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '500':
          $ref: '#/components/responses/Error500'
        '502':
          $ref: '#/components/responses/Error502'
        '503':
          $ref: '#/components/responses/Error503'
  /api/models/sync:
    post:
      tags:
        - admin
      operationId: applyModelSync
      x-required-permission: channels:manage_sensitive
      summary: 应用上游同步（只写勾选项）
      description: |
        source_version 必须是 preview 的返回值；缺失/过期/条目在清单中消失
        ⇒ 409（整体拒绝，不产生任何写入）。勾选 sync_official=false 的模型
        ⇒ 400（前端不应允许勾选，后端仍校验）。写入值取自服务端缓存的清单，
        请求条目只用于选择。选择集按匹配键去重：内容一致的重复项幂等合并，
        同名但内容不一致 ⇒ 422。
        写入在**单个数据库事务**内完成（供应商 + 模型），事务开始即获取
        advisory lock 串行化并发同步，并在锁内重新判断 create/update 与
        sync_official；任一条失败（唯一约束/乐观锁 → 409，字段校验 → 422）
        整体回滚，不会部分生效。
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelSyncApplyRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelSyncApplyResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '500':
          $ref: '#/components/responses/Error500'
