        completion_price:
          anyOf:
            - type: string
              pattern: ^[0-9]+$
            - enum:
                - null
        cache_read_price:
          anyOf:
            - type: string
              pattern: ^[0-9]+$
            - enum:
                - null
        cache_write_price:
          anyOf:
            - type: string
              pattern: ^[0-9]+$
            - enum:
                - null
        is_free:
          type: boolean
          description: 四项有效价全部显式 0；NULL 不算 0（R-PUB-03）。
        group_price:
          anyOf:
            - $ref: '#/components/schemas/PublicGroupPrice'
