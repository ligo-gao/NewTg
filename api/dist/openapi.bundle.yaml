          schema:
            type: string
            enum:
              - by_count
              - by_days
        - name: value
          in: query
          required: true
          description: |
            by_count 为保留的最新文件数；by_days 为保留天数。上限 36500（100 年），
            超出 → 422 invalid_value。
          schema:
            type: integer
            minimum: 1
            maximum: 36500
        - name: instance_id
          in: query
          required: false
          description: 目标实例标识；与当前实例不一致 → 409 instance_mismatch。
