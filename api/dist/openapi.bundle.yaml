        - publish_at
        - content_markdown
        - content_html
        - read
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          maxLength: 80
        category:
          type: string
          enum:
            - notice
            - maintenance
            - release
        publish_at:
          type: string
          format: date-time
        expire_at:
          type: string
          format: date-time
          nullable: true
          description: null = 永久有效。
        content_markdown:
          type: string
