    PerformanceCacheStats:
      type: object
      additionalProperties: false
      required:
        - enabled
        - file_count
        - total_bytes
        - last_cleared_at
      properties:
        enabled:
          type: boolean
          description: 生效态（DISK_CACHE_ENABLED 且目录可读）；目录缺失/不可读为 false。
        file_count:
          type: integer
          minimum: 0
        total_bytes:
          type: integer
          format: int64
          minimum: 0
        last_cleared_at:
          type: string
          format: date-time
          nullable: true
          description: 本进程最近一次清理完成时间；从未清理或进程重启后为 null。
    PerformanceMemoryStats:
      type: object
      additionalProperties: false
      required:
        - alloc_bytes
        - sys_bytes
        - num_gc
        - num_goroutine
      properties:
        alloc_bytes:
          type: integer
          format: int64
          minimum: 0
        sys_bytes:
          type: integer
          format: int64
          minimum: 0
        num_gc:
          type: integer
          format: int64
          minimum: 0
        num_goroutine:
          type: integer
          minimum: 0
    PerformanceDiskCacheInfo:
      type: object
      additionalProperties: false
      required:
        - path
        - file_count
        - total_bytes
        - last_modified
      properties:
        path:
          type: string
          description: 目录缺失/不可读时为空串（零值）。
        file_count:
          type: integer
          minimum: 0
        total_bytes:
          type: integer
          format: int64
          minimum: 0
        last_modified:
          type: string
          format: date-time
          nullable: true
          description: 目录内最新 mtime；无文件时为 null。
    PerformanceDiskSpaceInfo:
      type: object
      additionalProperties: false
      required:
        - total_bytes
        - free_bytes
        - used_bytes
      properties:
        total_bytes:
          type: integer
          format: int64
          minimum: 0
        free_bytes:
          type: integer
          format: int64
          minimum: 0
          description: 非特权进程可用空间（statfs Bavail）。
        used_bytes:
          type: integer
          format: int64
          minimum: 0
    PerformanceConfig:
      type: object
      additionalProperties: false
      required:
        - enabled
        - path
        - max_mb
        - threshold_mb
      properties:
        enabled:
          type: boolean
          description: 回显 DISK_CACHE_ENABLED 原值（不因目录缺失而改变）。
        path:
          type: string
        max_mb:
          type: integer
          format: int64
          minimum: 0
        threshold_mb:
          type: integer
          format: int64
          minimum: 0
    PerformanceStats:
      type: object
      additionalProperties: false
