    delete:
      tags:
        - user
      operationId: deleteToken
      summary: 删除令牌（可选乐观锁）
      description: |
        可选 query updated_at（RFC 3339）：提供时必须匹配当前版本，否则 409。
        未提供时直接删除。成功 204。
      security:
        - sessionCookie: []
        - bearerToken: []
      parameters:
        - $ref: '#/components/parameters/PathTokenID'
        - name: updated_at
          in: query
          required: false
          description: 乐观锁版本（RFC 3339）；缺省跳过版本校验。
          schema:
            type: string
            format: date-time
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '204':
          description: 已删除
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
