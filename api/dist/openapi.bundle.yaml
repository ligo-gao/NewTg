  /api/orders:
    post:
      tags:
        - user
      operationId: createOrder
      summary: 幂等创建充值订单并初始化渠道支付
      description: |
        `Idempotency-Key` 必填（UUID v4）。同一 key 重复提交返回首次订单
        （HTTP 200，不新建、不重新创建渠道支付单；即使渠道被关闭或下限
        被调整也照样返回首次订单）；key 属于其他用户时 409
        `order_state_conflict`。首次创建返回 201。
        **M5 无汇率：`currency` 只接受 CNY**（大小写不敏感），其它币种
        400。`provider=stripe` 返回 `client_secret`；`provider=alipay`
        返回 `qr_code`；`provider=epay` 返回 `pay_url` + `form_fields`
        （表单 POST 到收银台）。渠道未启用/配置不完整（含支付宝沙箱模式）返回
        403；渠道 5xx 返回 502 且订单置 failed。
      security:
        - sessionCookie: []
        - bearerToken: []
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
        - name: Idempotency-Key
          in: header
          required: true
          description: 客户端生成的 UUID v4；全表唯一（P-2）
          schema:
            type: string
            minLength: 1
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '200':
          description: 幂等重放（返回首次订单，不含渠道支付载荷）
          content:
