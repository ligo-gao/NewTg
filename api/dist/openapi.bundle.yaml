        - name: vendor_id
          in: query
          required: false
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - '1'
              - '2'
              - enabled
              - disabled
        - name: square_state
          in: query
          required: false
