        '500':
          $ref: '#/components/responses/Error500'
  /api/tokens/{id}:disable:
    post:
      tags:
        - user
      operationId: disableToken
      summary: 禁用单个令牌
      description: 幂等（已禁用仍 200）。禁用后 Redis 缓存经 token:changed 失效。
      security:
        - sessionCookie: []
        - bearerToken: []
      parameters:
        - $ref: '#/components/parameters/PathTokenID'
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '200':
          description: 更新后的令牌
          content:
