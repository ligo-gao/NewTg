  responses:
    Error400:
      description: 请求不符合契约（参数/请求体校验失败）
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Error401:
      description: 未认证或凭据失效
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Error402:
      description: 额度/余额不足
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem402'
    Error403:
      description: 已认证但无权访问
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Error404:
      description: 资源不存在
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Error409:
      description: 冲突（含乐观并发 updated_at 不匹配）
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Error422:
      description: 语义不可处理（邮箱域名白名单拒绝；幂等键被不同请求体复用）
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Error429:
      description: 触发限流（管理面/公开面；RFC 7807 problem+json）
      headers:
        Retry-After:
          description: 建议重试等待秒数
          schema:
            type: integer
            minimum: 0
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RelayError429:
      description: |
        触发中继准入限流（`rate_limit_exceeded`）。`Retry-After` 为建议重试的
        整数秒数；响应体是 OpenAI 兼容错误信封（`{error:{message,type,code}}`）。
      headers:
        Retry-After:
          description: 建议重试等待秒数（向上取整）
          schema:
            type: integer
            minimum: 0
        X-Request-ID:
          description: '请求 ID；响应体 `message` 末尾也附带 `(requestId: <id>)`'
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RelayError'
    Error500:
      description: 服务端内部错误
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Error502:
      description: 上游依赖失败（如验证码邮件投递失败）
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Error503:
      description: 服务不可用（依赖未就绪或过载）
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ClaudeError400:
      description: 请求不符合 Anthropic Messages 契约（Claude 形错误信封）
      headers:
        X-Request-ID:
          description: '请求 ID；响应体 `message` 末尾也附带 `(requestId: <id>)`'
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ClaudeError'
    ClaudeError401:
      description: 未认证或令牌失效（Claude 形 `authentication_error`）
      headers:
        X-Request-ID:
          description: '请求 ID；响应体 `message` 末尾也附带 `(requestId: <id>)`'
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ClaudeError'
    ClaudeError402:
      description: 额度/余额不足（Claude 形 `invalid_request_error`，状态码保持 402）
      headers:
        X-Request-ID:
          description: '请求 ID；响应体 `message` 末尾也附带 `(requestId: <id>)`'
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ClaudeError'
    ClaudeError403:
      description: 已认证但无权使用该模型/渠道（Claude 形 `permission_error`）
      headers:
        X-Request-ID:
          description: '请求 ID；响应体 `message` 末尾也附带 `(requestId: <id>)`'
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ClaudeError'
    ClaudeError404:
      description: 模型/渠道不存在或已停用（Claude 形 `not_found_error`）
      headers:
        X-Request-ID:
          description: '请求 ID；响应体 `message` 末尾也附带 `(requestId: <id>)`'
          schema:
            type: string
      content:
        application/json:
