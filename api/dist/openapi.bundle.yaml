  /api/wallet/transactions:
    get:
      tags:
        - user
      operationId: listWalletTransactions
      summary: 当前用户钱包流水列表
      description: |
        仅返回当前会话用户的流水（无 user_id 参数，传入也忽略）。排序固定为
        `created_at DESC, id DESC`（同刻多行按 id 稳定排序），`p` 越界回落
        最后一页。默认时间窗为近 30 天、`[from, to)` 左闭右开，跨度上限
        90 天。`min`/`max` 作用于 `ABS(amount)` 的闭区间，与 `dir` 正交。
        `ref` 原样精确匹配 `reference_id`；若值形如 UUID（32 hex 或
        8-4-4-4-12）则双方去连字符/大小写归一比较。任何参数非法统一 422。
        `items` 恒为数组（空结果 `[]`）；响应不返回 `note`/`user_id`。
      security:
        - sessionCookie: []
        - bearerToken: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: type
          in: query
          description: 流水类型（DB CHECK 的 11 个值，含 subscription_purchase）
          schema:
            type: string
            enum:
              - topup
              - redemption
              - consume_pre
              - consume
              - release
              - reversal
              - admin_adjustment
              - bonus
              - affiliate_transfer
              - checkin_bonus
              - subscription_purchase
        - name: status
          in: query
          description: 状态筛选（consume_pre 行持有 hold/settled/released/expired）
          schema:
            type: string
            enum:
              - hold
              - settled
              - released
              - expired
              - confirmed
        - name: dir
          in: query
          description: 方向；in ⇔ amount>0，out ⇔ amount<0
          schema:
            type: string
            enum:
              - in
              - out
        - name: from
          in: query
          description: 起始时刻（含），RFC3339；默认 to−30 天
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: 结束时刻（不含），RFC3339；默认当前时刻
          schema:
            type: string
            format: date-time
        - name: min
          in: query
          description: ABS(amount) 下界（含）
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: max
          in: query
          description: ABS(amount) 上界（含）
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: ref
          in: query
          description: 关联号；UUID 形状做去连字符归一，其它精确匹配
          schema:
            type: string
            maxLength: 64
      responses:
        '200':
          description: offset 分页信封
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletTransactionPage'
        '401':
          $ref: '#/components/responses/Error401'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
  /api/wallet/transactions/{id}:
    get:
      tags:
        - user
      operationId: getWalletTransaction
      summary: 当前用户钱包流水详情（服务端组装上下文）
      description: |
        同时按 `id` 与 `user_id` 查询：不存在、属于他人、id 非法一律 404，
        不给出存在性探测入口。`usage` 按 `request_id + user_id` 查日志库，
        日志库不可用或缺行时为 null（资金行仍 200）；`order`/`redemption`/
        `segments` 在主库组装。`admin_adjustment` 的机器 note
        （`admin adjustment: <mode> idem:<hex>`）只解析 `mode`，指纹段
        绝不回显；`redemption` 不返回 code hash。`segments` 仅
        `reference_type=usage_log` 时返回，公式：
        held=−Σ(consume_pre)、refunded=Σ(release)、
        charged=held+(−Σ(consume))−refunded。`corrects_transaction_id` 仅
        reversal 行，反查同订单的 subscription_purchase 行。
      security:
        - sessionCookie: []
        - bearerToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: 详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletTransactionDetail'
        '401':
          $ref: '#/components/responses/Error401'
        '404':
          $ref: '#/components/responses/Error404'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
  /api/checkin:
    post:
      tags:
        - user
      operationId: checkIn
      summary: 每日签到并领取随机积分
      description: |
        每个自然日只能签到一次（站点时区）。签到记录、余额变更与
        `checkin_bonus` 流水在同一事务内完成；并发双击由
        `checkins (user_id, checkin_date)` 唯一约束收敛为恰好一次成功。
        已签到返回 409 `already_checked_in`（零写入）。
        `checkin.min_quota = 0` 时只记签到、不发额度、不写账本行。
        钱包余额会越过安全整数上界时整体回滚并返回 409
        `wallet_limit_exceeded`，不做部分入账。
        人机校验接入点 `checkin`（第 5 点），位于限流之后；独立限流桶
        10 次/分钟/用户。
      security:
        - sessionCookie: []
        - bearerToken: []
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckinRequest'
      responses:
        '200':
          description: 签到成功（awarded 落在 [min_quota, max_quota] 闭区间）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckinResult'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          description: 签到未启用（`checkin_disabled`）或人机校验失败
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: 当日已签到（`already_checked_in`）或钱包上界（`wallet_limit_exceeded`）
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
