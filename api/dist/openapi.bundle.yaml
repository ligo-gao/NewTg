      enum:
        - order
        - redemption
        - usage_log
        - admin_op
        - reversal
        - signup_grant
        - promo
        - checkin
        - affiliate_transfer
    WalletTransaction:
      type: object
      additionalProperties: false
      required:
        - id
        - type
        - amount
        - balance_after
        - status
        - reference_type
        - reference_id
        - created_at
      description: |
        流水列表行。金额是**有符号整数积分**（收入正、支出负），按 JSON number
        序列化（R-M3-03；与 WalletSummary/OrderView 同口径，额度 ≤2^53−1）。
        列表刻意不返回 note / user_id。
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        type:
          $ref: '#/components/schemas/WalletTransactionType'
        amount:
          type: integer
          format: int64
          description: 有符号积分；收入正、支出负、不可为 0
        balance_after:
          type: integer
          format: int64
          minimum: 0
          description: 变动后余额
        status:
          $ref: '#/components/schemas/WalletTransactionStatus'
        reference_type:
          allOf:
            - $ref: '#/components/schemas/WalletTransactionReferenceType'
          nullable: true
        reference_id:
          type: string
          maxLength: 64
          nullable: true
          description: usage_log=requestID；order/redemption=对应 ID；admin_op=幂等键
        created_at:
          type: string
          format: date-time
