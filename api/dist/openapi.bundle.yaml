openapi: 3.1.0
info:
  title: NewTG API
  version: 0.2.0-m1
  description: |
    NewTG 网关 API 契约（M1：账户/认证/令牌/用户/分组）。
    管理 API 统一使用 RFC 7807 `application/problem+json` 错误体与 offset 分页信封
    `Page{items,total,page,page_size}`（`p` 1 基，`page_size` 默认 20、上限 100）。
    中继 `/v1/*` 仅登记路径与公共面，不重定义上游协议 schema（真源见 externalDocs）。
    M1 的会话性端点同时声明 `sessionCookie` 与 `bearerToken`；管理端点只接受
    会话 Cookie（Bearer 没有角色/权限语义）。
servers:
  - url: /
    description: 同源部署（边缘反代 → 网关）
security: []
tags:
  - name: ops
    description: 运维探针（/healthz、/readyz）
  - name: public
    description: 公开接口（无需认证）
  - name: user
    description: 用户自助接口（会话 Cookie 或 API 令牌）
  - name: admin
    description: 管理接口（仅管理员会话）
  - name: relay
    description: 中继协议面（API 令牌；schema 遵循上游公开规范）
paths:
  /healthz:
    get:
      tags:
        - ops
      operationId: getHealthz
      summary: 进程存活探针
      description: 不触碰 PostgreSQL/Redis，恒返回 200。
      security: []
      responses:
        '200':
          description: 进程存活
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - status
                properties:
                  status:
                    type: string
                    enum:
                      - ok
  /readyz:
    get:
      tags:
        - ops
      operationId: getReadyz
      summary: 就绪探针（五项实时判定）
      description: |
        R1 PostgreSQL SELECT 1；R2 Redis PING；R3 schema_migrations 版本与 dirty；
        R4 配置装配完成；R5 startup 完成。任一失败返回 503 + status=degraded。
      security: []
      responses:
        '200':
          description: 五项判定全部通过
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - status
                  - checks
                  - version
                  - node
                properties:
                  status:
                    type: string
                    enum:
                      - ok
                      - degraded
                    description: 全部通过为 ok；任一失败为 degraded
                  checks:
                    type: object
                    additionalProperties: false
                    required:
                      - postgres
                      - redis
                      - migration
                      - config
                      - startup
                    properties:
                      postgres:
                        type: string
                        enum:
                          - ok
                          - fail
                      redis:
                        type: string
                        enum:
                          - ok
                          - fail
                      migration:
                        type: string
                        enum:
                          - ok
                          - fail
                      config:
                        type: string
                        enum:
                          - ok
                          - fail
                      startup:
                        type: string
                        enum:
                          - ok
                          - fail
                  version:
                    type: string
                    description: 构建版本（VERSION 注入）
                  node:
                    type: string
                    description: 节点标识
        '503':
          description: 任一判定失败（status=degraded，失败项值为 fail）
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - status
                  - checks
                  - version
                  - node
                properties:
                  status:
                    type: string
                    enum:
                      - ok
                      - degraded
                    description: 全部通过为 ok；任一失败为 degraded
                  checks:
                    type: object
                    additionalProperties: false
                    required:
                      - postgres
                      - redis
                      - migration
                      - config
                      - startup
                    properties:
                      postgres:
                        type: string
                        enum:
                          - ok
                          - fail
                      redis:
                        type: string
                        enum:
                          - ok
                          - fail
                      migration:
                        type: string
                        enum:
                          - ok
                          - fail
                      config:
                        type: string
                        enum:
                          - ok
                          - fail
                      startup:
                        type: string
                        enum:
                          - ok
                          - fail
                  version:
                    type: string
                    description: 构建版本（VERSION 注入）
                  node:
                    type: string
                    description: 节点标识
  /api/status:
    get:
      tags:
        - public
      operationId: getPublicStatus
      summary: 公共站点状态
      description: |
        登录/注册页的引导数据：注册与口令登录开关、邮箱验证要求、Turnstile
        site key、登录加密开关与 canonical 7 语清单。响应 Cache-Control:
        no-store——开关变更必须立即生效。
      security: []
      responses:
        '200':
          description: OK
          headers:
            Cache-Control:
              description: no-store（站点开关变更必须即时可见）
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicStatus'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          description: |
            初始化状态存储不可用（IsInitialized 查询失败）。实现禁止猜测
            system_initialized（猜 false 会把已初始化站点导回安装向导，猜 true
            会把新站锁死在登录页），因此 fail-closed 返回 503。
          headers:
            Retry-After:
              description: 建议重试等待秒数（实现冻结为 5）
              schema:
                type: integer
                minimum: 0
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/geoip:
    get:
      tags:
        - public
      operationId: getClientGeo
      x-codegen: true
      summary: 客户端粗粒度地理区域（只读；不返回坐标与 IP）
      description: |
        客户端 IP 只从连接或经 TRUSTED_PROXIES 校验的代理头取得；响应仅 country/region/source。
        本地 GeoIP 库缺失或损坏时仍返回 200 且 source=unknown（不返回 5xx）。
      security: []
      responses:
        '200':
          description: OK
          headers:
            Cache-Control:
              description: private, max-age=300（按客户端缓存）
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeoIPResponse'
        '429':
          $ref: '#/components/responses/Error429'
  /api/home/stats:
    get:
      tags:
        - public
      operationId: getHomeStats
      summary: 首页统计数据条（公开，5 分钟服务端缓存）
      description: |
        4 个计数指标：upstreams=COUNT(DISTINCT channels.type) WHERE status=1；
        models=与 `/api/pricing` 同一可见集合的计数；endpoints=冻结协议端点目录
        （openai chat/completions、anthropic messages、gemini generateContent）
        大小 3；routing_dims=冻结调度维度清单（priority/weight/group/
        model-allowlist/affinity/retry）大小 6。0 如实返回（前端在 0 时隐藏区块）。
        数据库故障返回 500 problem，绝不返回 200 空对象。Cache-Control:
        public, max-age=300。B8 公开只读限流（60 次/分钟/IP+path，fail-open）。
      security: []
      responses:
        '200':
          description: OK
          headers:
            Cache-Control:
              description: public, max-age=300（服务端缓存窗口同值）
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HomeStats'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
  /api/pricing:
    get:
      tags:
        - public
      operationId: getPublicPricing
      summary: 公开定价目录（offset 分页；宽容参数）
      description: |
        只读 `model_pricing` / `group_pricing` / `user_groups`，并挂载
        `model_meta` / `vendors` 的展示元数据（同一快照）。可见集合为
        `model_pricing.status=1 AND billing_expr IS NULL`；命中的
        `model_meta.status=2` 档案使该模型从 items/facets 剔除（详情 404）。
        金额一律 int64 的 JSON 字符串；NULL 价列下发 null（不伪造兜底价）。
        非法参数逐项降级并返回 200（不存在的 facet 值丢弃、非法分页回退默认、
        `p` 越界回退最后一页）；空集是 200 + `items:[]`。facet 计数忽略本组
        自身筛选；capability/context/endpointType 的未知值丢弃。无档案模型的
        元数据字段按空数组/null 降级，`display_name` 回退 `model_id`、`vendor`
        按 `vendors.name` → `model_pricing.vendor` → `model_id` 前缀三级回退。
        `group_price` 仅在登录或显式 `group` 时出现；匿名且
        `billing.expose_group_ratios=false` 时分组 facet 的 ratio 为 null。响应带
        `ETag: "pricing-v<hash>"`，命中 `If-None-Match` 返回 304 无 body；版本
        hash 覆盖 model_pricing/group_pricing/user_groups/model_meta/vendors。
        缓存 `public, max-age=30, stale-while-revalidate=30`（带会话的个性化
        响应降级为 private）。
      security: []
      parameters:
        - name: p
          in: query
          schema:
            type: integer
            minimum: 1
          description: 页码（1 基）；非法或越界回退首屏/最后一页。
        - name: page_size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 24
          description: 每页条数；默认 24，上限 100（超出按 100 截断）。
        - name: search
          in: query
          schema:
            type: string
            maxLength: 128
          description: model_id 大小写不敏感子串；超长截断。
        - name: sort
          in: query
          schema:
            type: string
            enum:
              - name
              - price_asc
              - price_desc
            default: name
          description: |
            价格按输入价；同模式内 per_token 在 per_request 前，tie-breaker 为
            model_id。非法值回退 name。
        - name: vendor
          in: query
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
          description: 供应商多选（重复键或逗号分隔；大小写不敏感）；不存在的值丢弃。
        - name: capability
          in: query
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
          description: |
            能力多选（D1-21；重复键或逗号分隔，也接受 `capability[]`）；取
            `model_meta.capabilities`，无档案的模型不命中；未知值丢弃。
        - name: context
          in: query
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
          description: |
            上下文分档多选（也接受 `context[]`）：`8k`（≤8,192）、`32k`
            （8,193–32,768）、`128k`（32,769–131,072）、`200k+`（>131,072）；
            大小写不敏感，未知值丢弃。context_length 为 null 的模型不命中。
        - name: endpointType
          in: query
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
          description: |
            端点类型多选（D1-21；也接受 `endpointType[]` / `endpoint_type`）。
            取值来自档案 endpoints 的映射：chat.completions、messages、
            embeddings、images.generations、audio.speech、audio.transcriptions、
            rerank、generateContent；未知路径不产生取值，未知筛选值丢弃。
        - name: group
          in: query
          schema:
            type: string
          description: 分组预览；不存在则忽略。
        - name: quotaType
          in: query
          schema:
            type: string
            enum:
              - all
              - token
              - request
            default: all
          description: 计费类型；非法值回退 all。
        - name: include_group_price
          in: query
          schema:
            type: string
            enum:
              - '0'
              - '1'
            default: '1'
          description: 是否返回分组实付价（仍受会话/expose 规则约束）。
      responses:
        '200':
          description: OK（空集也是 200 + items:[]）
          headers:
            ETag:
              description: '"pricing-v<hash>"；hash 由 model_pricing/group_pricing/user_groups/model_meta/vendors 五张表的 max(updated_at)+count+max(id) 派生'
              schema:
                type: string
            Cache-Control:
              description: public, max-age=30, stale-while-revalidate=30（个性化响应 private）
              schema:
                type: string
            Vary:
              description: Accept-Encoding；个性化响应额外含 Cookie
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicPricingList'
        '304':
          description: If-None-Match 命中（无 body）
          headers:
            ETag:
              schema:
                type: string
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
  /api/pricing/{model_id}:
    get:
      tags:
        - public
      operationId: getPublicPricingDetail
      summary: 公开模型详情（URL 编码的 `/`）
      description: |
        `model_id` 以 URL 编码承载（如 `openai%2Fgpt-5`）。不存在、停用、无定价
        或表达式计价的模型统一返回 404 `model-not-found`。未编码的多段路径
        （`/api/pricing/openai/gpt-5`）、尾斜杠与其它无法匹配的定价子路径由
        公开兜底返回同一个 404（不会落入受保护 `/api/` 子树得到 401）。
        缓存与 ETag 策略同 `/api/pricing`；详情 ETag 由域版本 + 模型名哈希派生。
      security: []
      parameters:
        - name: model_id
          in: path
          required: true
          schema:
            type: string
            maxLength: 512
          description: URL 编码的模型名（可含 `/`）。
      responses:
        '200':
          description: OK
          headers:
            ETag:
              description: '"pricing-v<hash>-<modelHash>"'
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicModelDetail'
        '304':
          description: If-None-Match 命中（无 body）
        '404':
          description: 模型不存在或不可公示（type=model-not-found）
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
  /api/pricing/{model_id}/metrics:
    get:
      tags:
        - public
      operationId: getPublicPricingMetrics
      summary: 模型性能指标（P1 占位，未实现）
      description: |
        本波（M6c）只注册 404：不返回伪造数据。type=not-implemented 以区别于
        「模型不存在」。
      security: []
      parameters:
        - name: model_id
          in: path
          required: true
          schema:
            type: string
            maxLength: 512
      responses:
        '404':
          description: 未实现（type=not-implemented）
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/auth/login/encryption-key:
    get:
      tags:
        - public
      operationId: getLoginEncryptionKey
      summary: 登录口令加密公钥（关闭时 {enabled:false}）
      description: |
        前端缓存 5 分钟（DisableCache 语义是响应头禁止中间层缓存，不是禁止
        客户端短缓存）。开启时返回 {kid, public_key}；关闭时固定
        {enabled:false}。取公钥失败返回 503，绝不回落到明文登录。
      security: []
      responses:
        '200':
          description: OK
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginEncryptionKeyResponse'
        '503':
          $ref: '#/components/responses/Error503'
  /api/auth/email-code:
    post:
      tags:
        - public
      operationId: requestEmailCode
      summary: 发送 6 位一次性邮箱验证码
      description: |
        TTL 10 分钟、一次性。同邮箱 1 次/60 秒、同 IP 10 次/小时；超限 429
        + Retry-After。成功恒 204，响应不回显验证码。purpose=verify|bind
        要求有效会话（本端点不经过 SessionAuth，实现内显式校验），缺失 401。
        SMTP 发送失败返回 502（验证码同时作废，避免留下收不到的有效码）。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailCodeRequest'
      responses:
        '204':
          description: 已受理（验证码已生成；配置 SMTP 时已投递）
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '429':
          $ref: '#/components/responses/Error429'
        '502':
          $ref: '#/components/responses/Error502'
        '503':
          $ref: '#/components/responses/Error503'
  /api/auth/register:
    post:
      tags:
        - public
      operationId: register
      summary: 注册并自动登录
      description: |
        成功 201 + 会话 Cookie。重复 username/email 统一 409（文案不区分字段
        级差异，防账号枚举）。注册关闭 403；邮箱域名白名单外 422。成功后可
        按配置发放注册赠送流水。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: 注册成功并已建立会话
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '403':
          $ref: '#/components/responses/Error403'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
  /api/auth/login:
    post:
      tags:
        - public
      operationId: login
      summary: 口令登录（可选前端加密与 2FA 挑战）
      description: |
        口令通过后：未启用 2FA 直接建立会话（200 AuthSessionResponse）；
        已启用返回 200 Pending2FAResponse（ticket 5 分钟），需再调用
        POST /api/auth/2fa/challenge。连续 5 次失败锁定 15 分钟（双桶
        Redis 计数）；封禁账号 401。所有失败（含解密失败）响应一致，防 oracle。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 已建立会话，或返回 pending_2fa ticket
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
  /api/auth/2fa/challenge:
    post:
      tags:
        - public
      operationId: submitTwoFAChallenge
      summary: 用一次性 ticket + TOTP/备用码换取正式会话
      description: |
        只信任 ticket（Redis pending_2fa:{ticket} → user_id），不接受客户端
        声明的用户身份。TOTP 连续 5 次错误作废 ticket；备用码原子核销（同一
        码并发提交只有一次成功）。成功 200 + 会话 Cookie。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TwoFAChallengeRequest'
      responses:
        '200':
          description: 挑战通过并已建立会话
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
        '400':
          description: |
            两种语义由 problem type 区分：
            · type = `https://newtg.dev/problems/two_factor_ticket_invalid`：
              ticket 格式非法、已过期或已被消费——必须重新走登录拿新 ticket，
              重试本端点不会成功。
            · 其它 `bad_request`（不含该 type）：ticket 有效但 TOTP/备用码错误，
              或请求体校验失败；码错误时 ticket 仍可继续使用（TOTP 连续 5 次
              错误才作废，备用码核销即失效）。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/Error401'
        '429':
          description: |
            连续第 5 次 TOTP/备用码错误：ticket 已被作废（必须重新登录获取
            新 ticket，不能在本页重试）；账号已处于锁定窗口时也会直接返回
            429。Retry-After 指示建议重试秒数。
          headers:
            Retry-After:
              description: 建议重试等待秒数（第 5 次失败场景实现冻结为 5）
              schema:
                type: integer
                minimum: 0
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          $ref: '#/components/responses/Error503'
  /api/auth/password-reset/request:
    post:
      tags:
        - public
      operationId: requestPasswordReset
      summary: 请求口令重置邮件（统一成功态）
      description: |
        邮箱存在与否响应完全一致（恒 204，防枚举）；存在时投递 256-bit
        token（30 分钟）。同邮箱 60 秒冷却、同 IP 5 次/分钟，超限 429。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '204':
          description: 已受理（不透露邮箱是否注册）
        '400':
          $ref: '#/components/responses/Error400'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
  /api/auth/password-reset/validate:
    post:
      tags:
        - public
      operationId: validatePasswordResetToken
      summary: 校验重置链接（不消费 token）
      description: 有效返回 200 {"valid":true}；无效/过期一律 400 invalid_reset_token。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetValidateRequest'
      responses:
        '200':
          description: token 有效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetValidateResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '503':
          $ref: '#/components/responses/Error503'
  /api/auth/password-reset/confirm:
    post:
      tags:
        - public
      operationId: confirmPasswordReset
      summary: 消费重置 token 并设置新口令
      description: |
        原子消费 token → 改密 → 吊销该用户全部会话，成功 204。token 复用/
        过期 400；并发提交同一 token 只有一个成功。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
      responses:
        '204':
          description: 口令已重置，全部旧会话已失效
        '400':
          $ref: '#/components/responses/Error400'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
  /api/logout:
    post:
      tags:
        - public
      operationId: logout
      summary: 登出当前会话
      description: |
        public-safe：无会话或重复登出也恒 204。不挂 CSRF 校验（登出不构成
        状态提升，且清 Cookie 必须在会话已失效后仍可用）。Redis 故障时 503。
      security: []
      responses:
        '204':
          description: 已登出（幂等）
        '503':
          $ref: '#/components/responses/Error503'
  /api/setup:
    post:
      tags:
        - public
      operationId: completeSetup
      summary: 首次安装向导（建管理员 + 写初始化锚）
      description: |
        仅未初始化时可调用：三步字段建 admin 并写 system.install.completed_at
        （同事务），成功 201 + 自动登录会话。幂等锚是 system_settings 该键：
        重复/并发提交返回 409 + initialized=true，前端据此导流到登录页。
        已初始化后调用同样 409；用户名/邮箱冲突 409。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetupRequest'
      responses:
        '201':
          description: 初始化完成并已建立管理员会话
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '409':
          description: 已初始化（initialized=true）或用户名/邮箱冲突
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/SetupCompletedProblem'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
