        - page_size
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UserNotification'
        total:
          type: integer
          format: int64
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
          maximum: 100
    UserNotificationUnreadCount:
      type: object
