        expire_at:
          type: string
          format: date-time
          nullable: true
          description: null = 永久有效；必须晚于 publish_at。
        published_at:
          type: string
          format: date-time
          nullable: true
          description: 实际点击发布的时刻；编辑已发布公告不重写（N-35）。
        offline_at:
          type: string
          format: date-time
          nullable: true
        created_by:
          type: integer
          format: int64
        updated_by:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
