  /api/orders/{id}/refund:
    post:
      tags:
        - admin
      operationId: refundSubscriptionOrder
      x-required-permission: settings:manage
      summary: 管理员退款一个订阅订单（全额，原路或回补钱包）
      description: |
        需要 `settings:manage`（比 `orders:read/manage` 更严的运营权限）。
        只处理订阅订单（`biz_kind` = subscribe/renew/change），且必须处于
        `succeeded`、`refund_required`（S2/R-29② 的「钱已收、履约失败」）
        或 `refund_failed`（可重试）。其中 `succeeded` 仅 subscribe 订单可
        自动退款，renew/change 见下方 R-38。

        P-13 / R-35：`succeeded` 订单的订阅必须**未消耗、仍 active 且未过期**
        （`amount_used == 0`、`status='active'`、`end_at > now`），否则 422
        `subscription_in_use`。不再要求 `start_at > now`：订阅只在结算时以
        当前时刻创建，预约生效实例在生产不可达，按字面条件会让所有已付款
        订单永远退不了。`refund_required` 订单不适用该判定——履约根本没有
        发生，必须可退（R-30）。

        R-38：自动退款（全额退款 + 取消整条订阅）只对 `biz_kind='subscribe'`
        的 `succeeded` 订单开放。续费（renew）与升降级（change）的 succeeded
        订单分别需要回退 `end_at` / plan，不能复用这条路径；请求返回 422
        `refund_requires_manual_review`，由运营人工处理，且不会取消用户
        仍在使用的订阅。`refund_required`（S2 的 change 履约失败）仍可退，
        按 R-36 不取消订阅。

        出账路径按 `orders.provider`：
        - `wallet`：本地回补钱包，回补额取原始 `subscription_purchase` 流水的
          实际扣减额；订单 `refunded_amount` 与钱包 `reversal` 流水在同一事务
          （R-31）。
        - `stripe` / `alipay`：调用渠道退款（Stripe Idempotency-Key /
          支付宝 out_request_no 固定为订单级键），成功后写订单与 `refunded`
          事件。调渠道前先写 `failure_code='refund_in_progress'`（R-37），
          成功清除、失败改写为 `provider_*`，运维可据此区分卡在渠道还是
          本地；注意它只是失败码，订单状态仍是 succeeded/refund_failed。
        - `epay`：协议没有退款 API → 409 `provider_action_unsupported`，订单
          状态不变，需运营在渠道后台原路退款。

        幂等（R-31）：同一订单重复调用返回既有结果（200），不会二次出账。
        渠道退款失败 → 订单置 `refund_failed` 并返回 502，可用同一端点重试
        （R-32）；重试不会二次扣减。成功时取消订阅（若仍 active）并追加
        `subscription_events.kind='refunded'`，detail 只含
        `order_id`/`amount`/`reason`。
      security:
        - sessionCookie: []
        - bearerToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefundOrderRequest'
      responses:
        '200':
          description: 退款完成（或幂等重放返回既有结果）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderView'
        '400':
          description: reason 非法（1–200 字符）
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          description: 订单状态不可退、该渠道不支持退款，或回补会超过钱包上界
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: |
            订阅已消耗/已过期/非 active（subscription_in_use），或为续费/升降级
            订单需要人工退款（R-38）
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/Error500'
        '502':
          description: 渠道退款失败（订单已置 refund_failed，可重试）
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/webhooks/stripe:
    post:
      tags:
        - public
      operationId: stripeWebhook
      summary: Stripe 异步通知
      description: |
        验签使用**原始请求体**：`Stripe-Signature` 的 `t=...,v1=...` 为
        HMAC-SHA256(`t + "." + body`)，时间戳偏差 > 300s 拒绝。仅处理
        `payment_intent.succeeded`；金额/币种与订单不一致 → 订单 failed +
        告警且不入账。重复投递幂等（provider_txn_id 唯一 + 条件 UPDATE）。
        每端点独立 60 次/分钟限流（429）。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Stripe Event 原文（验签前不反序列化）
      responses:
        '200':
          description: 已处理或按状态机忽略
        '400':
          description: 验签或载荷非法（不改订单、不入账）
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: 超过 60 次/分钟
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: 限流器不可用（fail closed）
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/webhooks/alipay:
    post:
      tags:
        - public
      operationId: alipayNotify
      summary: 支付宝异步通知
      description: |
        表单编码回调；RSA2（SHA256withRSA）验签。仅 `TRADE_SUCCESS` 入账，
        其余状态回 `success` 并忽略。`total_amount`（元）换算为分后与订单
        比对，不一致 → 订单 failed + 告警并回 `failure`。重复通知幂等。
        每端点独立 60 次/分钟限流（429）。
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties:
                type: string
      responses:
        '200':
          description: 处理完成（纯文本 `success`）
          content:
            text/plain:
              schema:
                type: string
                enum:
                  - success
                  - failure
        '400':
          description: 验签失败或金额不符（纯文本 `failure`，不入账）
          content:
            text/plain:
              schema:
                type: string
                enum:
                  - success
                  - failure
        '429':
          description: 超过 60 次/分钟
        '500':
          description: 内部错误（纯文本 `failure`，渠道会重投）
        '503':
          description: 限流器不可用（fail closed）
  /api/webhooks/epay:
    get:
      tags:
        - public
      operationId: epayNotifyGet
      summary: 易支付异步通知（query 编码）
      description: |
        与 POST 同一条验签/入账路径；部分易支付网关用 GET query 回调。
        签名 = md5(参数按键名升序 `a=b&...` + key)（key 前无分隔符）（小写，空值不参与，
        `sign`/`sign_type` 不参与），以常量时间比较。仅 `trade_status=TRADE_SUCCESS`
        入账；金额（元字符串）小数位 >2 或与订单不符 → 400 + `fail` 且不入账。
        重复通知幂等。每端点独立 60 次/分钟限流（429）。
      security: []
      parameters:
        - name: pid
          in: query
          required: false
          schema:
            type: string
        - name: out_trade_no
          in: query
          required: false
          schema:
            type: string
        - name: money
          in: query
          required: false
          schema:
            type: string
        - name: trade_status
          in: query
          required: false
          schema:
            type: string
        - name: sign
          in: query
          required: false
          schema:
            type: string
        - name: sign_type
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: 处理完成（纯文本 `success`）
          content:
            text/plain:
              schema:
                type: string
                enum:
                  - success
                  - fail
        '400':
          description: 验签/载荷/金额不符或订单不存在（纯文本 `fail`，不入账）
          content:
            text/plain:
              schema:
                type: string
                enum:
                  - success
                  - fail
        '429':
          description: 超过 60 次/分钟
        '500':
          description: 内部错误（纯文本 `fail`，渠道会重投）
        '503':
          description: 渠道未启用/配置不完整或限流器不可用（纯文本 `fail`）
    post:
      tags:
        - public
      operationId: epayNotify
      summary: 易支付异步通知（表单编码）
      description: |
        表单编码回调；验签、状态、金额与幂等语义与 GET 变体完全相同。
        返回纯文本 `success` / `fail`。
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties:
                type: string
      responses:
        '200':
          description: 处理完成（纯文本 `success`）
          content:
            text/plain:
              schema:
                type: string
                enum:
                  - success
                  - fail
        '400':
          description: 验签/载荷/金额不符或订单不存在（纯文本 `fail`，不入账）
          content:
            text/plain:
              schema:
                type: string
                enum:
                  - success
                  - fail
        '429':
          description: 超过 60 次/分钟
        '500':
          description: 内部错误（纯文本 `fail`，渠道会重投）
        '503':
          description: 渠道未启用/配置不完整或限流器不可用（纯文本 `fail`）
