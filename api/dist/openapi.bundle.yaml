        - category
        - status
        - display_status
        - publish_at
        - created_by
        - updated_by
        - created_at
        - updated_at
        - content_markdown
        - content_html
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 80
        category:
          $ref: '#/components/schemas/AnnouncementCategory'
        status:
          $ref: '#/components/schemas/AnnouncementStatus'
        display_status:
          $ref: '#/components/schemas/AnnouncementDisplayStatus'
        publish_at:
          type: string
          format: date-time
        expire_at:
          type: string
          format: date-time
          nullable: true
        published_at:
          type: string
          format: date-time
          nullable: true
        offline_at:
          type: string
          format: date-time
          nullable: true
        created_by:
          type: integer
          format: int64
        updated_by:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        content_markdown:
          type: string
          maxLength: 16384
          description: Markdown 原文（≤16384，按 UTF-8 字节计，不是字符数）。
        content_html:
          type: string
          description: |
            服务端净化后的 HTML 片段：原始 HTML 不解析（`<script>`/`<img
            onerror>` 只会以文本出现），链接仅 http(s) 且强制
            rel="noopener noreferrer"（R-D7-04）。
    ActiveAnnouncement:
      type: object
      additionalProperties: false
      required:
        - id
        - title
        - category
        - publish_at
        - content_markdown
        - content_html
        - read
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          maxLength: 80
        category:
          type: string
          enum:
            - notice
            - maintenance
            - release
        publish_at:
          type: string
          format: date-time
        expire_at:
          type: string
          format: date-time
          nullable: true
          description: null = 永久有效。
        content_markdown:
          type: string
        content_html:
          type: string
          description: 净化后的 HTML（原始 HTML 不解析，危险链接丢弃 href）。
        read:
          type: boolean
          description: 当前用户是否已读；未登录不可访问本端点。
    ActiveAnnouncementList:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ActiveAnnouncement'
    PublicAnnouncement:
      type: object
      additionalProperties: false
      required:
        - id
        - title
        - category
        - content_html
        - published_at
        - expire_at
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        category:
          type: string
          enum:
            - notice
            - maintenance
            - release
        content_html:
          type: string
          description: 服务端由 Markdown 渲染并净化的 HTML（原始 HTML 不解析、危险链接丢弃 href）。
        published_at:
          type: string
          format: date-time
