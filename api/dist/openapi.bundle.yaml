      summary: 读取当前管理员的支付设置合规确认状态
      description: |
        `confirmed=false` 时管理端必须展示合规确认遮罩并禁止渲染支付设置；
        `confirmed=true` 时返回首次确认时刻 `confirmed_at`，后续进入不再提示。
        该端点只读，不写审计。
      security:
        - sessionCookie: []
