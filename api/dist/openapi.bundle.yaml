      type: object
      additionalProperties: false
      required:
        - items
        - total
        - page
        - page_size
      properties:
        items:
          type: array
          description: 空结果恒为 []（不是 null）
          items:
            $ref: '#/components/schemas/WalletTransaction'
        total:
          type: integer
          format: int64
          minimum: 0
        page:
          type: integer
          minimum: 1
          description: 1 基；越界请求回落到最后一页
        page_size:
          type: integer
          minimum: 1
          maximum: 100
    WalletUsageContext:
      type: object
      additionalProperties: false
      required:
        - log_id
        - request_id
        - model
        - prompt_tokens
        - completion_tokens
        - cost
        - pre_deducted
        - refunded
      description: |
        usage_logs 的调用摘要（日志库）。按 `request_id + user_id` 查询；
        日志库不可用/缺行时整个对象为 null。
      properties:
        log_id:
          type: integer
          format: int64
          minimum: 1
        request_id:
          type: string
          format: uuid
        model:
          type: string
        prompt_tokens:
          type: integer
          minimum: 0
        completion_tokens:
          type: integer
          minimum: 0
        cost:
          type: integer
          format: int64
          minimum: 0
        pre_deducted:
          type: integer
          format: int64
          minimum: 0
          nullable: true
          description: NULL 表示该请求没有预扣（跨组补扣等）
        refunded:
          type: integer
          format: int64
          minimum: 0
          nullable: true
    WalletOrderContext:
      type: object
      additionalProperties: false
      required:
        - id
        - status
        - amount
        - currency
        - provider
        - biz_kind
      description: 关联订单摘要（reference_type='order'；按 id+user_id 查询）。
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        status:
          type: string
          enum:
            - pending
            - succeeded
            - failed
            - expired
            - cancelled
            - refund_required
            - refunded
            - refund_failed
        amount:
          type: integer
          format: int64
          minimum: 0
        currency:
          type: string
          maxLength: 3
        provider:
          type: string
          enum:
            - stripe
            - alipay
            - creem
            - waffo
            - waffo_pancake
            - epay
            - wallet
        biz_kind:
          type: string
          enum:
            - topup
            - subscribe
            - renew
            - change
    WalletRedemptionContext:
      type: object
      additionalProperties: false
      required:
        - id
        - batch_name
        - credits
      description: 兑换码上下文；刻意不含 code_hash。
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        batch_name:
          type: string
          maxLength: 32
          nullable: true
        credits:
          type: integer
          format: int64
          minimum: 1
    WalletAdjustmentContext:
      type: object
      additionalProperties: false
      required:
        - mode
      description: |
        admin_adjustment 的调整方式（从机器 note 前缀解析，R-M3-05）。
        理由/操作人当前未落库（module 07 写路径缺口），故不在此出现。
      properties:
        mode:
          type: string
          enum:
            - add
            - subtract
            - override
    WalletTransactionSegments:
      type: object
      additionalProperties: false
      required:
        - held
        - charged
        - refunded
      description: |
        同一 usage_log（user_id+reference_id）的三段金额：
        held=−Σ(consume_pre)、refunded=Σ(release)、
        charged=held+(−Σ(consume))−refunded；均为非负整数。
      properties:
        held:
          type: integer
          format: int64
          minimum: 0
        charged:
          type: integer
          format: int64
          minimum: 0
        refunded:
          type: integer
          format: int64
          minimum: 0
    WalletTransactionDetail:
      type: object
      additionalProperties: false
      required:
        - id
        - type
        - amount
        - balance_after
        - status
        - reference_type
        - reference_id
        - created_at
        - note
        - usage
        - order
        - redemption
        - adjustment
        - segments
        - corrects_transaction_id
      description: |
        流水详情。服务端一次组装全部上下文（R-M3-04），前端不串多个端点。
        刻意独立定义完整字段而非 allOf 引用 WalletTransaction：父 schema 的
        additionalProperties:false 会拒绝这里追加的上下文键。
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        type:
          $ref: '#/components/schemas/WalletTransactionType'
        amount:
          type: integer
          format: int64
        balance_after:
          type: integer
          format: int64
          minimum: 0
        status:
          $ref: '#/components/schemas/WalletTransactionStatus'
        reference_type:
          allOf:
            - $ref: '#/components/schemas/WalletTransactionReferenceType'
          nullable: true
        reference_id:
          type: string
          maxLength: 64
          nullable: true
        created_at:
          type: string
          format: date-time
        note:
          type: string
          maxLength: 200
          nullable: true
          description: |
            仅 admin_adjustment 且非机器格式时返回；机器 note 的
            `idem:<64hex>` 指纹段在服务端剥离，绝不回显（R-M3-05）。
        usage:
          allOf:
            - $ref: '#/components/schemas/WalletUsageContext'
          nullable: true
        order:
          allOf:
            - $ref: '#/components/schemas/WalletOrderContext'
          nullable: true
        redemption:
          allOf:
            - $ref: '#/components/schemas/WalletRedemptionContext'
          nullable: true
        adjustment:
          allOf:
            - $ref: '#/components/schemas/WalletAdjustmentContext'
          nullable: true
        segments:
          allOf:
            - $ref: '#/components/schemas/WalletTransactionSegments'
          nullable: true
        corrects_transaction_id:
          type: integer
          format: int64
          nullable: true
          description: |
            仅 reversal 且 reference_type='order'：同订单最新一条
            subscription_purchase 流水的 id；没有则 null（R-M3-06）。
    CheckinRequest:
      type: object
      additionalProperties: false
      description: |
        可选请求体：Turnstile 令牌也可通过 `?turnstile_token=` 查询参数提交
        （两者同时出现时以查询参数为准，与其它认证端点同口径）。签到本身
        不接受任何用户标识或金额参数。
      properties:
        turnstile_token:
          type: string
          maxLength: 2048
    CheckinResult:
      type: object
      additionalProperties: false
      required:
        - date
        - awarded
        - streak
        - month_total
        - total_earned
        - balance_after
        - checked_in_today
      properties:
        date:
          type: string
          format: date
          description: 本次签到对应的自然日（站点时区，YYYY-MM-DD）
        awarded:
          type: integer
          format: int64
          minimum: 0
          description: 本次发放积分；同日重放不会重新抽取
        streak:
          type: integer
          format: int32
          minimum: 0
          description: 截至今天的连续签到天数（不断签）
        month_total:
          type: integer
          format: int64
          minimum: 0
          description: 本月累计获得积分
        total_earned:
          type: integer
          format: int64
          minimum: 0
          description: 累计获得积分
        balance_after:
          type: integer
          format: int64
          minimum: 0
          description: 入账后的钱包余额快照
        checked_in_today:
          type: boolean
          description: 成功响应恒为 true
    CheckinCalendar:
      type: object
      additionalProperties: false
      required:
        - month
        - today
        - days
        - streak
        - month_total
        - total_earned
        - checked_in_today
      properties:
        month:
          type: string
          pattern: ^\d{4}-(0[1-9]|1[0-2])$
        today:
          type: string
          format: date
          description: 站点时区下的今天
        days:
          type: array
          description: 本月已签到的日期（未签到的日期不出现，前端按网格补齐）
          items:
            type: object
            additionalProperties: false
            required:
              - date
              - awarded
            properties:
              date:
                type: string
                format: date
              awarded:
                type: integer
                format: int64
                minimum: 0
        streak:
          type: integer
          format: int32
          minimum: 0
        month_total:
          type: integer
          format: int64
          minimum: 0
        total_earned:
          type: integer
          format: int64
          minimum: 0
        checked_in_today:
          type: boolean
    TopupProviderConfig:
      type: object
      additionalProperties: false
      required:
        - min_topup
      description: 公开的渠道配置；secret 永不出现。
      properties:
        publishable_key:
          type: string
          description: Stripe 公开密钥（P-17 冻结键名 `pay.stripe.publishable_key`）
        min_topup:
          type: integer
          format: int64
          minimum: 0
          description: |
            该渠道自己的最低充值（分，`pay.<provider>.min_topup_cny`）；
            有效下限 = max(全局 `min_topup`, 渠道 `min_topup`)（F-04-01）
    TopupConfig:
      type: object
      additionalProperties: false
      required:
        - amount_options
        - min_topup
        - max_topup
        - quota_per_unit
        - credits_ratio
        - enabled_providers
        - providers
      properties:
        amount_options:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: integer
            format: int64
            minimum: 1
          description: 档位，最小货币单位（分）；来源 `pay.amount_presets_cny`
        min_topup:
          type: integer
          format: int64
          minimum: 0
          description: 全局最低充值（分），来源 `pay.min_topup_cny`
        max_topup:
          type: integer
          format: int64
          minimum: 1
          description: 单笔硬上限（分），冻结 10000000
        quota_per_unit:
          type: integer
          format: int64
          minimum: 1
          description: 1 元 = N 积分（`billing.quota_per_unit`，默认 100）
        credits_ratio:
          type: number
          format: double
          exclusiveMinimum: 0
          description: |
            当前用户分组的有效兑换倍率（`pay.topup_group_ratio[users.group]`，
            未配置回退 1.0）。仅用于前端预览；实际到账以服务端入账为准。
        enabled_providers:
          type: array
          items:
            type: string
            enum:
              - stripe
              - alipay
              - epay
          description: 已启用且配置完整的渠道（P-13）
        providers:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/TopupProviderConfig'
          description: 只包含 enabled_providers 中的渠道
    OrderView:
      type: object
      additionalProperties: false
      required:
        - id
        - user_id
        - provider
        - amount
        - currency
        - status
        - credited_credits
        - manual_completed
        - created_at
        - updated_at
        - expires_at
        - refunded_amount
        - refunded_at
        - refund_reason
        - refund_requested_at
      properties:
        id:
          type: integer
          format: int64
        user_id:
          type: integer
          format: int64
        provider:
          type: string
          enum:
            - stripe
            - alipay
            - epay
            - wallet
          description: |
            响应侧取值域。`wallet` 仅用于订阅余额购买订单；订单列表/详情的
            消费方不能假设非 stripe 即 alipay（epay 也已存在）。请求侧枚举
            （充值/续费）为 stripe/alipay/epay。
        amount:
          type: integer
          format: int64
          description: 订单金额（分），服务端定价唯一真源
        currency:
          type: string
          minLength: 3
          maxLength: 3
        status:
          type: string
          enum:
            - pending
            - succeeded
            - failed
            - expired
            - cancelled
            - refund_required
            - refunded
            - refund_failed
          description: |
            八态状态机（P-1 + S2/R-29② + S3）：
            - pending → succeeded/failed/expired/cancelled；
            - succeeded 的订阅订单在履约失败（订阅已被并发取消/换套餐）时转
              `refund_required`（钱已收、待退款）；
            - `refund_required` / `succeeded` → `refunded`（退款完成，终态）；
            - 渠道退款失败 → `refund_failed`（可重试，不是终态）。
        credited_credits:
          type: integer
          format: int64
        failure_code:
          type: string
          nullable: true
          enum:
            - provider_unavailable
            - provider_rejected
            - signature_invalid
            - amount_mismatch
            - currency_mismatch
            - order_not_found
            - order_state_conflict
            - manual_required
            - refund_in_progress
            - null
        paid_at:
          type: string
          format: date-time
          nullable: true
        manual_completed:
          type: boolean
        manual_reason:
          type: string
          nullable: true
          minLength: 10
          maxLength: 200
        refunded_amount:
          type: integer
          format: int64
          description: 已退金额（分）；只有 `refunded` 状态非零且等于 `amount`
        refunded_at:
          type: string
          format: date-time
          nullable: true
          description: 退款完成时刻；非 `refunded` 状态为 null
        refund_reason:
          type: string
          nullable: true
          description: 退款/退款申请理由（首次申请或管理员批准时写入）
        refund_requested_at:
          type: string
          format: date-time
          nullable: true
          description: 用户侧申请退款的时刻；未申请为 null
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          description: 派生值 `created_at + 30min`（P-1；不是数据库列）
        raw_callback:
          type: object
          nullable: true
          description: 仅管理员（role=admin）详情可见；用户响应不包含该字段
    OrderList:
      type: object
      additionalProperties: false
      required:
        - items
        - total
        - page
        - page_size
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderView'
        total:
          type: integer
          format: int64
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
          maximum: 100
    CreateOrderRequest:
      type: object
      additionalProperties: false
      required:
        - amount
        - provider
      properties:
        amount:
          type: integer
          format: int64
          minimum: 1
          maximum: 10000000
          description: 最小货币单位（分）；下限由全局/渠道最低值取 max 后校验
        currency:
          type: string
          enum:
            - CNY
          default: CNY
          description: |
            站点计价币种。M5 **无汇率**，只接受 CNY（大小写不敏感，服务端
            统一大写）；USD/JPY/TRY 等一律 400，避免「分」口径被非人民币
            金额放大到账积分。
        provider:
          type: string
          enum:
            - stripe
            - alipay
            - epay
          description: |
            支付渠道。`epay`（微信易支付）不调用渠道 API，服务端返回
            `pay_url` + `form_fields` 供前端以表单 POST 打开收银台。
    OrderVerifyResponse:
      type: object
      additionalProperties: false
      required:
        - paid
        - order
      properties:
        paid:
          type: boolean
          description: 渠道是否已确认收款；false 时订单状态不变
        order:
          $ref: '#/components/schemas/OrderView'
    CompleteOrderRequest:
      type: object
      additionalProperties: false
      required:
        - manual_reason
      properties:
        manual_reason:
          type: string
          minLength: 10
          maxLength: 200
          description: 人工完成原因（按 Unicode 字符计数）
    RefundOrderRequest:
      type: object
      additionalProperties: false
      required:
        - reason
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 200
          description: 退款原因（进入 refunded 事件 detail，按 Unicode 字符计数）
    ChannelCredentialsMasked:
      type: object
      additionalProperties: false
      required:
        - api_key
      description: 掩码后的凭据（仅详情例外；永远不含明文密钥）。
      properties:
        api_key:
          type: string
          description: 形如 sk-…abcd 的掩码，绝不回显明文。
        deployment:
          type: string
        api_version:
          type: string
    ChannelListMetrics:
      type: object
      additionalProperties: false
      required:
        - request_count
      properties:
        request_count:
          type: integer
          format: int64
          description: 近 24h 请求数。
        success_rate:
          type: number
          minimum: 0
          maximum: 1
          nullable: true
          description: success / (success + error + refused)；无样本为 null（显示 —）。
        avg_latency_ms:
          type: number
          nullable: true
          description: 近 24h 平均总耗时（毫秒）；无样本为 null。
    ChannelList:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Channel'
      description: GET /api/channels 的 offset 分页信封。
    ChannelFetchModelsCredentials:
      type: object
      additionalProperties: false
      description: |
        上游凭据。api_key 可省略的前提是 channel_id 指向已保存凭据的渠道；
        否则 422（credentials.api_key is required）。凭据只发往上游，永不回显。
      properties:
        api_key:
          type: string
          description: 上游 API key。
        deployment:
          type: string
          description: Azure 等渠道的部署名（可选）。
        api_version:
          type: string
          description: Azure 等渠道的 API 版本（可选）。
    ChannelFetchModelsRequest:
      type: object
      additionalProperties: false
      required:
        - type
      properties:
        channel_id:
          type: integer
          format: int64
          minimum: 1
          description: 编辑模式：从该渠道读取已保存的 base_url 与机密凭据；不存在 404。
        type:
          type: string
          description: |
            渠道类型 slug（如 openai、anthropic、gemini）。未知类型 422；类型已
            定义但上游模型目录不支持时 400。
        base_url:
          type: string
          format: uri
          maxLength: 512
          description: 可选 http/https URL；缺省时使用 channel_id 已保存的 base_url。
        credentials:
          $ref: '#/components/schemas/ChannelFetchModelsCredentials'
    ChannelFetchModelsResponse:
      type: object
      additionalProperties: false
      required:
        - models
      properties:
        models:
          type: array
          items:
            type: string
    ChannelCredentialsRevealRequest:
      type: object
      additionalProperties: false
      required:
        - reason
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 200
          description: 揭示目的；纯空白视为缺失（422）。不得包含凭据值或片段。
        password:
          type: string
          description: 未启用 TOTP 时的唯一因子。
        totp_code:
          type: string
          pattern: ^[0-9]{6}$
          description: 已启用 TOTP 时的唯一因子。
    ChannelCredentialsRevealed:
      type: object
      additionalProperties: false
      required:
        - api_key
      description: |
        一次性返回的完整凭据对象（与 details 的 credentials_masked 同一字段
        形状，但值为明文）；不得被缓存或持久化。
      properties:
        api_key:
          type: string
        deployment:
          type: string
        api_version:
          type: string
    ChannelMetricsPoint:
      type: object
      additionalProperties: false
      required:
        - bucket_start
        - request_count
        - success_count
        - failure_count
      properties:
        bucket_start:
          type: string
          format: date-time
          description: 整点桶起点（UTC）。
        request_count:
          type: integer
          format: int64
          description: 桶内全部状态请求数（含 refunded）。
        success_count:
          type: integer
          format: int64
        failure_count:
          type: integer
          format: int64
          description: status ∈ {error, refused}；refunded 不算失败。
        success_rate:
          type: number
          minimum: 0
          maximum: 1
          nullable: true
          description: success / (success + error + refused)；无样本为 null。
        avg_latency_ms:
          type: number
          nullable: true
          description: 非空 latency_ms 的平均值；无样本为 null。
        avg_first_token_ms:
          type: number
          nullable: true
          description: 非空 first_token_ms 的平均值（非流式请求为 null 样本）；无样本为 null。
        avg_cost:
          type: number
          nullable: true
          description: 桶内平均结算积分（cost 求和 / 请求数）；无请求为 null。
    ChannelMetricsSummary:
      type: object
      additionalProperties: false
      required:
        - request_count
        - success_count
        - failure_count
        - cost_total
        - used_credits
        - used_credits_24h
        - request_count_24h
      properties:
        request_count:
          type: integer
          format: int64
        success_count:
          type: integer
          format: int64
        failure_count:
          type: integer
          format: int64
        success_rate:
          type: number
          minimum: 0
          maximum: 1
          nullable: true
        avg_latency_ms:
          type: number
          nullable: true
        avg_first_token_ms:
          type: number
          nullable: true
        avg_cost:
          type: number
          nullable: true
        cost_total:
          type: integer
          format: int64
          description: 窗口内结算积分合计。
        used_credits:
          type: integer
          format: int64
          description: 渠道**累计**结算积分（全量历史）。
        used_credits_24h:
          type: integer
          format: int64
          description: 近 24h 结算积分（与所选 window 无关）。
        request_count_24h:
          type: integer
          format: int64
          description: 近 24h 请求数（与所选 window 无关）。
    ChannelMetrics:
      type: object
      additionalProperties: false
      required:
        - channel_id
        - window
        - bucket_seconds
        - points
        - summary
      properties:
        channel_id:
          type: integer
          format: int64
        window:
          type: string
          enum:
            - 24h
            - 7d
        bucket_seconds:
          type: integer
          description: 桶宽，固定 3600（整点小时桶）。
        points:
          type: array
          items:
            $ref: '#/components/schemas/ChannelMetricsPoint'
        summary:
          $ref: '#/components/schemas/ChannelMetricsSummary'
        last_test_at:
          type: string
          format: date-time
          nullable: true
          description: 来自主库渠道行（不缓存在指标缓存里）。
        last_test_result:
          type: boolean
          nullable: true
    ChannelTestRequest:
      type: object
      additionalProperties: false
      properties:
        model:
          type: string
          description: 必须属于该渠道 supported_models；缺省用 test_model 或首模型。
        stream:
          type: boolean
          description: 设计字段；当前实现固定最小非流式请求，值被接受但不改变行为。
      description: 请求体必填（`{}` 也可）；model 缺省时用 test_model 或首个模型。
    ChannelTestResult:
      type: object
      additionalProperties: false
      required:
        - success
        - latency_ms
        - model
      properties:
        success:
          type: boolean
        latency_ms:
          type: integer
        model:
          type: string
        error_class:
          type: string
          description: 失败时是 F-06-06 五值枚举；成功时省略。
    ModelPerformanceTest:
      type: object
      additionalProperties: false
      description: |
        一次测速的汇总事实（已持久化）。success_rate = success_count / runs；
        TTFT/延迟分位数只取成功且非空样本（nearest-rank）。无样本的聚合字段
        显式输出 null（UI 显示 —，不是 0）。
      required:
        - id
        - channel_id
        - model
        - provider
        - runs
        - success_count
        - success_rate
        - created_at
      properties:
        id:
          type: integer
          format: int64
        channel_id:
          type: integer
          format: int64
        model:
          type: string
        provider:
          type: string
          description: 渠道类型 slug（store.Channel.Type）。
        runs:
          type: integer
          description: 本批探测次数（成功率分母）。
        success_count:
          type: integer
        success_rate:
          type: number
          minimum: 0
          maximum: 1
        ttft_ms_p50:
          type: integer
          nullable: true
        ttft_ms_p95:
          type: integer
          nullable: true
        latency_ms_p50:
          type: integer
          nullable: true
        latency_ms_p95:
          type: integer
          nullable: true
        tps_avg:
          type: number
          nullable: true
        output_tokens_avg:
          type: number
          nullable: true
        created_at:
          type: string
          format: date-time
    ModelPerformanceTestList:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          description: 按 created_at 倒序（新→旧）。
          items:
            $ref: '#/components/schemas/ModelPerformanceTest'
    ModelPerformanceTestRequest:
      type: object
      additionalProperties: false
      required:
        - model
      properties:
        model:
          type: string
          minLength: 1
          description: 必须属于该渠道 supported_models；否则 422。
        runs:
          type: integer
          minimum: 1
          maximum: 5
          default: 3
          description: 探测次数；缺省 3，超出 1..5 返回 422。
      description: 请求体必填；model 缺失/不属于 supported_models → 422。
    ResponsesObject:
      type: object
      description: |
        Responses 对象。`output` 元素本波不做 IR 建模（插件渲染项或产物投影项），
        因此按开放对象声明；`usage` 仅在终态（completed/failed/incomplete）出现。
      required:
        - id
        - object
        - created_at
        - status
        - output
      properties:
