                $ref: '#/components/schemas/Problem'
        '409':
          description: Idempotency-Key 已被其他用户占用（order_state_conflict）
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/Error500'
        '502':
          description: 渠道初始化失败（订单已置 failed，provider_unavailable）
          content:
            application/problem+json:
