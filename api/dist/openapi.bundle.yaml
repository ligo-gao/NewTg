  /api/plugin/task:
    get:
      tags:
        - admin
      operationId: listTaskPlugins
      x-required-permission: settings:manage
      summary: 插件列表（运行状态徽章 + 筛选 + 分页）
      description: |
        默认排序「运行状态异常优先，其次名称」。search 匹配 key/名称；
        source=builtin|upload；enabled=true|false；runtime_status 取五态之一。
        响应不含源文本与密钥（S5）。
      security:
        - sessionCookie: []
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: source
          in: query
          required: false
          schema:
            type: string
            enum:
              - builtin
              - upload
        - name: enabled
          in: query
          required: false
          schema:
            type: boolean
        - name: runtime_status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/TaskPluginRuntimeStatus'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 插件分页
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskPluginPage'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '500':
          $ref: '#/components/responses/Error500'
    post:
      tags:
        - admin
      operationId: uploadTaskPlugin
      x-required-permission: settings:manage
      summary: 上传插件源（JSON 或 multipart，默认不激活）
      description: |
        服务端计算 sha256 并编译/校验（S1）：失败 422 plugin_compile_failed
        且零写入。同 (key, version) 同 hash 幂等返回 200；异 hash 422/409
        plugin_version_conflict。入库 enabled=true、active=false（R-M6D-07）。
        必须携带 Idempotency-Key。multipart 文件必须为 .js，正文 ≤
        plugin.upload.max_bytes（默认 2 MiB）。
      security:
        - sessionCookie: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadTaskPluginRequest'
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: 幂等命中已有版本
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadTaskPluginResponse'
        '201':
          description: 新版本已入库（不自动激活）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadTaskPluginResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
