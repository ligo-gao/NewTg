      summary: 应用上游同步（只写勾选项）
      description: |
        source_version 必须是 preview 的返回值；缺失/过期/条目在清单中消失
        ⇒ 409（整体拒绝，不产生任何写入）。勾选 sync_official=false 的模型
        ⇒ 400（前端不应允许勾选，后端仍校验）。写入值取自服务端缓存的清单，
        请求条目只用于选择。选择集按匹配键去重：内容一致的重复项幂等合并，
        同名但内容不一致 ⇒ 422。
        写入在**单个数据库事务**内完成（供应商 + 模型），事务开始即获取
        advisory lock 串行化并发同步，并在锁内重新判断 create/update 与
        sync_official；任一条失败（唯一约束/乐观锁 → 409，字段校验 → 422）
        整体回滚，不会部分生效。
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelSyncApplyRequest'
      responses:
