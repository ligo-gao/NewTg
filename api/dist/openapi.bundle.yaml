      responses:
        '200':
          description: 已取消
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderView'
        '401':
          $ref: '#/components/responses/Error401'
        '404':
          description: 订单不存在或不属于调用者
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: 订单已不是 pending（order_state_conflict）
