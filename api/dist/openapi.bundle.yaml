  /api/subscriptions/{id}/renew:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
    post:
      tags:
        - user
      operationId: renewSubscription
      summary: 手动续费本人订阅（复用同一实例推进 end_at）
      description: |
        创建续费订单（`orders.biz_kind='renew'`、`biz_ref_id=subscriptions.id`）。
        金额/币种/周期/额度由服务端按实例当前套餐行读取，不接受客户端传入；
        provider ∈ {stripe, alipay, epay}，支付载荷与购买同构。

        支付成功后**复用同一实例**：`end_at = GREATEST(end_at, now) + period_days`、
        `amount_used=0`、`next_reset_at` 为新 end_at（reset_on_renew=true）或 NULL、
        状态恢复/保持 active、清 `cancel_at_period_end`，快照列按本次订单更新
        （billing-08 §3.3 方案甲）。

        `Idempotency-Key` 必带；同 key 重放返回首次订单（200，不回放支付凭据）。
        同一实例的**同一周期只允许一笔续费成功**（R-43）：下单时用 `FOR UPDATE`
        冻结周期末并占用 `subscriptions:renew:<id>` 锁；已有在途续费时返回 409，
        晚到的同周期支付回调会转 `refund_required`，`end_at` 绝不会加两个周期。
        `price_amount=0` 的套餐在同一事务内直接创建 succeeded 订单并扩展实例。

        仅本人实例；他人实例与不存在统一 404；`cancelled` 终态 → 409，
        `active`/`expired` 允许（expired 续费后恢复 active）。套餐停用/删除、
        幂等键复用到另一订单 → 409；币种/金额/套餐字段非法 → 422；
        渠道未配置 → 503；渠道出站失败 → 502。任何失败都不会留下 succeeded
        订单，也不会扩展实例。
      security:
        - sessionCookie: []
        - bearerToken: []
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionRenewRequest'
      responses:
        '200':
          description: 幂等重放（返回首次订单，不含支付凭据）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateOrderResponse'
        '201':
          description: 续费订单已创建（首次）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateOrderResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '500':
          $ref: '#/components/responses/Error500'
        '502':
          description: 渠道支付单创建失败
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: 支付渠道未配置或已停用
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/subscriptions/{id}/change:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
    post:
      tags:
        - user
      operationId: changeSubscriptionPlan
      summary: 升级/降级本人订阅（按剩余价值折算）
      description: |
        把**同一实例**迁移到目标套餐（`orders.biz_kind='change'`、
        `biz_ref_id=subscriptions.id`，订单金额是应补差价而不是套餐全价）。
        实例 id 与 `start_at` 不变；额度按新套餐 `grant_credits` 重算全周期并
        保留已用量（超过新总额度时钳到总额度）。改动与 `upgraded`/`downgraded`
        事件在同一事务内提交。

        折算口径（服务端唯一真源，客户端不得传入金额）：
        - 剩余价值 = round(`price_paid_amount` × 剩余秒 / 周期总秒)，剩余秒
          向下取整到秒、已过期按 0；
        - 应补 = max(0, 新套餐价 − 剩余价值)；
        - 应补 > 0：走支付渠道，支付成功后换成一个完整新周期；
        - 应补 = 0（降级）：不退款，差额按新套餐单价折算为**延长时长**写入
          `end_at`，同一事务内即时生效，响应无支付凭据。

        仅允许同币种、同周期天数（`period_days`）的套餐；跨币种/跨周期 →
        422 `subscription_cycle_mismatch`。目标套餐即当前套餐 → 422。

        周期口径（R-27）：付费与 0 元路径一律 `end_at = now + 折算时长`，
        **不再保留**提前续费/降级延长留下的更长 end_at——那段时间已经以
        「剩余价值」的形式折成了折扣。唯一例外是免费套餐（新套餐价 0，没有
        单价可折算），保留更长的剩余时间。

        小额差价（R-28）：应补低于渠道最低支付额时**免收并即时生效**，
        事件记 `price_delta=0`，免收额留在订单快照的 `waived_delta`。

        并发（R-29）：同一实例已有一张 pending 的 change 订单时再提交（不同
        Idempotency-Key）→ 409；若支付成功后订阅已被并发取消/到期/换套餐导致
        迁移无法应用，订单转 `refund_required` 终态（已收款、待退款），支付方
        收到 2xx，不会被无限重投。同 key 的并发请求一律返回首次结果（200）。

        `Idempotency-Key` 必带；同 key 重放返回首次结果（200，不回放支付凭据），
        同 key 改口到另一套餐 → 409。仅本人实例，他人实例与不存在统一 404；
        仅 `active` 实例可升降级，`cancelled`/`expired` → 409。
        套餐停用/删除、实例不可升降级、幂等键复用 → 409；套餐字段非法 → 422；
        渠道未配置 → 503；渠道出站失败 → 502。任何失败都不会留下 succeeded
        订单，也不会改写实例。
      security:
        - sessionCookie: []
        - bearerToken: []
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionChangeRequest'
      responses:
        '200':
          description: 幂等重放（返回首次结果，不含支付凭据）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionChangeResponse'
        '201':
          description: 升降级已生效或订单已创建（首次）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionChangeResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '500':
          $ref: '#/components/responses/Error500'
        '502':
          description: 渠道支付单创建失败
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: 支付渠道未配置或已停用
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/subscriptions/{id}/refund-request:
    post:
      tags:
        - user
      operationId: requestSubscriptionRefund
      summary: 申请退还一笔未消耗、未过期的订阅
      description: |
        仅本人实例；他人实例与不存在统一 404。只对购买该实例的订单写入
        `refund_requested_at` / `refund_reason`，**不调用渠道也不变动钱包**
        ——实际退款由管理员通过 `POST /api/orders/{id}/refund` 审批。

        P-13 / R-35：订阅必须**未消耗、active 且未过期**（`amount_used == 0`、
        `status='active'`、`end_at > now`），否则 422 `subscription_in_use`。
        重复申请幂等：返回首次的申请时刻与理由。订单已退款 → 409；订单不是
        succeeded → 409。
      security:
        - sessionCookie: []
        - bearerToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionRefundRequest'
      responses:
        '200':
          description: 已记录（幂等返回首次标记）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionRefundRequestView'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          description: 订阅已消耗/已过期/非 active（subscription_in_use，R-35）
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          description: 退款服务未装配（fail closed）
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/subscriptions/{id}/auto-renew:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
    put:
      tags:
        - user
      operationId: putSubscriptionAutoRenew
      summary: 开启/关闭本人订阅的自动续费
      description: |
        只写订阅的自动续费偏好，不扣费、不改变本周期状态。

        `enabled=true` 时必须给出可用的支付令牌：请求体可带
        `payment_method_id`，缺省则沿用实例已绑定的令牌；两者都没有 →
        422。令牌必须属于当前用户且 `status='active'`，否则 422。
        `enabled=false` 不需要令牌，连续失败计数清零。

        自动续费由 worker 在 `end_at - billing.auto_renew_lead_hours`
        （默认 24h，范围 1–168）进入窗口后扣费；`cancel_at_period_end=true`
        的实例一律不续费（R-40）。扣费失败写 `renewal_failed` 事件并发站内
        通知；连续 3 次失败自动关闭开关（P-16）。

        仅本人实例；他人实例与不存在统一 404；`cancelled` 终态 → 409。
        **合同期已结束（`end_at <= now`，含立即取消后的宽限期）→ 422**：
        此时开启自动续费会让 worker 立刻扣款并重置额度/延长周期，恢复服务
        请重新购买（R-54）。关闭自动续费不受此限制。
        支付服务未配置 → 503。
      security:
        - sessionCookie: []
        - bearerToken: []
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionAutoRenewRequest'
      responses:
        '200':
          description: 自动续费偏好已更新
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionAutoRenewView'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          description: 支付服务未配置
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/payment-methods:
    get:
      tags:
        - user
      operationId: listPaymentMethods
      summary: 列出本人已保存的支付令牌（零回显）
      description: |
        只返回 brand/last4/exp 与令牌 id；**绝不**返回令牌（密文或明文）。
        用户侧读取面没有分页信封（令牌数量以个位数计）。
      security:
        - sessionCookie: []
        - bearerToken: []
      responses:
        '200':
          description: 本人令牌列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentMethodList'
        '401':
          $ref: '#/components/responses/Error401'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          description: 支付服务未配置
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    post:
      tags:
        - user
      operationId: createPaymentMethod
      summary: 保存一个 Stripe 支付令牌
      description: |
        `token` 是前端用 Stripe.js 创建并提交给 Stripe 的 PaymentMethod id
        （`pm_...`），网关不接触卡号。服务端回查 Stripe 取
        brand/last4/exp（客户端提交的展示字段一律 403），并用
        AES-256-GCM（credential SecretSealer）加密后落库。
        渠道不支持/令牌不存在 → 422；非 stripe 渠道 → 400；
        支付服务未配置 → 503。
      security:
        - sessionCookie: []
        - bearerToken: []
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentMethodCreateRequest'
      responses:
        '201':
          description: 令牌已保存
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentMethod'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '422':
          $ref: '#/components/responses/Error422'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          description: 支付服务未配置
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/payment-methods/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      tags:
        - user
      operationId: deletePaymentMethod
      summary: 删除本人支付令牌（fail-closed 关闭关联自动续费）
      description: |
        删除令牌与「引用它的订阅 auto_renew=false + renewal_failed 事件」
        在同一事务内完成（R-42），避免拿着已删除的令牌反复扣费。
        不存在与不属于当前用户统一 404（uuid 形态非法同样 404）。
      security:
        - sessionCookie: []
        - bearerToken: []
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '204':
          description: 已删除（幂等语义：重复删除返回 404）
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          description: 支付服务未配置
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/subscription/purchase:
    post:
      tags:
        - user
      operationId: purchaseSubscription
      summary: 购买订阅（创建支付订单）
      description: |
        创建订阅购买订单（`orders.biz_kind='subscribe'`、`biz_ref_id=plan_id`），
        金额/币种/周期/额度一律由服务端按套餐行读取。provider ∈ {stripe, alipay, epay, wallet}：
        前三者创建支付订单并返回支付载荷（stripe 返回 client_secret，alipay 返回 qr_code，
        epay 返回 pay_url + form_fields）；
        `wallet` 为余额购买，服务端在同一事务内扣减钱包、写一条
        `wallet_transactions(type=subscription_purchase)` 流水、将订单置 succeeded
        并创建订阅实例，响应无支付凭据。任一步失败整体回滚（含余额、流水、订单、实例）。

        `Idempotency-Key` 必带；同 key 重放返回首次订单（200，不回放支付凭据）。
        `price_amount=0` 的套餐在同一事务内直接创建 succeeded 订单与订阅实例，
        不调用渠道、不写钱包流水，响应无 client_secret/qr_code。

        失败口径：套餐不存在/停用或幂等键复用到另一订单 → 409；币种/金额/
        套餐字段非法（含套餐价低于渠道最低金额）→ 422；钱包余额不足 → 402；
        渠道未配置 → 503；渠道出站失败 → 502。任何失败都不会留下 succeeded
        订单或 subscriptions 行。

        限流：按「用户 × 套餐」固定窗口 5 次/分钟（键
        `rl:subpurchase:<userID>:<planID>`），超限 429 + Retry-After；
        限流存储不可用时 fail-closed 503，不创建订单。
      security:
        - sessionCookie: []
        - bearerToken: []
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionPurchaseRequest'
      responses:
        '200':
          description: 幂等重放（返回首次订单，不含支付凭据）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateOrderResponse'
        '201':
          description: 订单已创建（首次购买）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateOrderResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '402':
          description: 钱包余额不足（仅 provider=wallet）；事务整体回滚，不留下订单/实例/流水
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          $ref: '#/components/responses/Error403'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          description: 购买请求超过限流（5 次/分钟/用户×套餐）
          headers:
            Retry-After:
              description: 当前限流窗口剩余秒数
              schema:
                type: integer
                minimum: 1
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/Error500'
        '502':
          description: 渠道支付单创建失败
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: 支付渠道未配置、已停用或限流存储不可用
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/tokens:
    get:
      tags:
        - user
      operationId: listTokens
      summary: 列出当前用户的 API 令牌（分页）
      description: |
        仅按 name 关键字搜索（R-08：key 后缀搜索不命中）。status 为读时
        派生值；quota 过滤 normal|low|exhausted|unlimited。
      security:
        - sessionCookie: []
        - bearerToken: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: keyword
          in: query
          required: false
          description: 按令牌名称模糊搜索（不搜索 key/key_hash）。
          schema:
            type: string
            maxLength: 64
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/TokenStatus'
        - name: group
          in: query
          required: false
          schema:
            type: string
        - name: quota
          in: query
          required: false
          schema:
            type: string
            enum:
              - normal
              - low
              - exhausted
              - unlimited
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenList'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '500':
          $ref: '#/components/responses/Error500'
    post:
      tags:
        - user
      operationId: createTokens
      summary: 创建 API 令牌（可批量，key 仅此一次）
      description: |
        应携带 Idempotency-Key（UUID）：同键重放返回首次结果；同键不同
        请求体返回 422。缺省时服务端直接执行，不提供重放保护。quantity 一次最多 100 枚。group=auto 时 auto_groups
        必须非空且不超过站点上限（默认 20）。响应 200 + {created:[...]}，
        每项的 key 是完整明文、仅此一次出现（服务端只存 SHA-256）。
      security:
        - sessionCookie: []
        - bearerToken: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTokenRequest'
      responses:
        '200':
          description: 已创建（含一次性明文 key）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateTokenResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '409':
          description: 相同 Idempotency-Key 的并发请求仍在处理中（含等待期间请求被取消）
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/Error422'
        '500':
          $ref: '#/components/responses/Error500'
  /api/tokens/{id}:
    get:
      tags:
        - user
      operationId: getToken
      summary: 读取单个令牌
      description: 他人令牌与不存在令牌统一 404（不泄露存在性）。
      security:
        - sessionCookie: []
        - bearerToken: []
      parameters:
        - $ref: '#/components/parameters/PathTokenID'
