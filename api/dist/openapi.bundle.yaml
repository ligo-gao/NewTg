      summary: 令牌自读用量（Bearer 自身 key）
      description: |
        只接受 Bearer（不接受 Cookie）：凭据就是被查询的令牌本身。额度耗尽的
        令牌仍返回 200 且 total_available=0（前端要能显示耗尽状态，
