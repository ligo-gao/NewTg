      x-required-permission: settings:manage
      summary: 部分更新上游账号（乐观锁）
      description: |
        必须原样回传 expected_updated_at（缺失 400、不匹配 409）。
        字段缺省 = 不修改；console_url 显式 null = 清空。
        timezone 非法 422；name 冲突 409；账号不存在 404。
