        - heap_alloc_before
        - heap_alloc_after
        - num_gc_before
        - num_gc_after
      properties:
        instance_id:
          type: string
        duration_ms:
          type: integer
          format: int64
          minimum: 0
        heap_alloc_before:
          type: integer
          format: int64
          minimum: 0
        heap_alloc_after:
          type: integer
          format: int64
          minimum: 0
        num_gc_before:
          type: integer
          format: int64
          minimum: 0
        num_gc_after:
          type: integer
          format: int64
          minimum: 0
    PerformanceLogFile:
      type: object
      additionalProperties: false
      required:
        - name
