        读取）。`balance` 来自 `users.balance`；`held_credits` 为进行中
        预扣（status='hold'）的绝对值之和；`total_consumed` 为
        `type='consume'` 流水之和；`total_requests` 为 `usage_logs` 行数；
        `health` 由服务端按余额与阈值计算（0=depleted，低于阈值=low）。
      security:
        - sessionCookie: []
