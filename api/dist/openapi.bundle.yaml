          format: int64
        run_id:
          type: integer
          format: int64
        account_id:
          type: integer
          format: int64
        usage_date:
          type: string
          format: date
        upstream_model:
          type: string
          minLength: 1
          maxLength: 128
        local_requests:
          type: integer
          format: int64
        local_estimated_requests:
          type: integer
          format: int64
        local_refunded_requests:
          type: integer
          format: int64
        local_cache_hit_tokens:
          type: integer
          format: int64
        local_cache_miss_tokens:
          type: integer
          format: int64
        local_output_tokens:
          type: integer
          format: int64
        local_wallet_credits:
          type: integer
          format: int64
        local_subscription_credits:
          type: integer
          format: int64
        local_cost_credits:
          type: integer
          format: int64
        local_unknown_requests:
          type: integer
          format: int64
        local_multi_attempt_requests:
          type: integer
          format: int64
        snapshot_cache_hit_tokens:
          type: integer
          format: int64
          nullable: true
        snapshot_cache_miss_tokens:
          type: integer
          format: int64
          nullable: true
        snapshot_cache_write_tokens:
          type: integer
          format: int64
          nullable: true
        snapshot_output_tokens:
          type: integer
          format: int64
          nullable: true
        snapshot_requests:
          type: integer
          format: int64
          nullable: true
        snapshot_amount_minor:
          type: integer
          format: int64
          nullable: true
          description: 上游账单金额（分）；null = 未报告。
        delta_cache_hit_tokens:
          type: integer
          format: int64
          nullable: true
        delta_cache_miss_tokens:
          type: integer
          format: int64
          nullable: true
        delta_output_tokens:
          type: integer
          format: int64
          nullable: true
        delta_token_bp:
          type: integer
          format: int64
          nullable: true
          description: token 差异率（万分比）；null = 无可用分母。
        snapshot_partial:
          type: boolean
          description: true = 上游快照缺维度，比较只是部分口径。
        revenue_minor:
          type: integer
          format: int64
          nullable: true
          description: 本地收入（分）；null = 无法计算。
        upstream_cost_minor:
          type: integer
          format: int64
          nullable: true
          description: 上游成本（分）；null = 无法计算。
        margin_minor:
          type: integer
          format: int64
          nullable: true
          description: 毛利 = revenue_minor - upstream_cost_minor（分）；null = 无法计算。
        margin_bp:
          type: integer
          format: int64
          nullable: true
          description: 毛利率（万分比）；null = 收入为 0 或无收入。
        severity:
          type: string
          enum:
            - ok
            - warn
            - alert
            - partial_snapshot
            - missing_snapshot
            - missing_local
            - local_expired
          description: 差异等级与快照缺失类判定（迁移 CHECK 闭集）。
        status:
          type: string
          enum:
            - open
            - acknowledged
            - resolved
          description: 运营处置状态。
        note:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ReconcileItemList:
      type: object
