  /api/tokens:
    get:
      tags:
        - user
      operationId: listTokens
      summary: 列出当前用户的 API 令牌（分页）
      description: |
        仅按 name 关键字搜索（R-08：key 后缀搜索不命中）。status 为读时
        派生值；quota 过滤 normal|low|exhausted|unlimited。
      security:
        - sessionCookie: []
        - bearerToken: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: keyword
          in: query
          required: false
          description: 按令牌名称模糊搜索（不搜索 key/key_hash）。
          schema:
            type: string
            maxLength: 64
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/TokenStatus'
        - name: group
          in: query
          required: false
          schema:
            type: string
        - name: quota
          in: query
          required: false
          schema:
            type: string
            enum:
              - normal
              - low
              - exhausted
              - unlimited
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenList'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '500':
          $ref: '#/components/responses/Error500'
    post:
      tags:
        - user
      operationId: createTokens
      summary: 创建 API 令牌（可批量，key 仅此一次）
      description: |
        应携带 Idempotency-Key（UUID）：同键重放返回首次结果；同键不同
        请求体返回 422。缺省时服务端直接执行，不提供重放保护。quantity 一次最多 100 枚。group=auto 时 auto_groups
        必须非空且不超过站点上限（默认 20）。响应 200 + {created:[...]}，
        每项的 key 是完整明文、仅此一次出现（服务端只存 SHA-256）。
      security:
        - sessionCookie: []
        - bearerToken: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTokenRequest'
      responses:
        '200':
          description: 已创建（含一次性明文 key）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateTokenResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '409':
          description: 相同 Idempotency-Key 的并发请求仍在处理中（含等待期间请求被取消）
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/Error422'
        '500':
          $ref: '#/components/responses/Error500'
  /api/tokens/{id}:
    get:
      tags:
        - user
