        log_dir:
          type: string
        file_count:
          type: integer
          minimum: 0
        total_size:
          type: integer
          format: int64
          minimum: 0
        oldest_time:
          type: string
          format: date-time
          nullable: true
        newest_time:
          type: string
          format: date-time
          nullable: true
        files:
          type: array
          items:
            $ref: '#/components/schemas/PerformanceLogFile'
    PerformanceLogCleanupResult:
      type: object
      additionalProperties: false
      required:
        - instance_id
        - mode
        - value
        - deleted_count
        - freed_bytes
        - skipped_active
        - failed_files
      properties:
        instance_id:
          type: string
        mode:
          type: string
          enum:
            - by_count
            - by_days
        value:
          type: integer
          minimum: 1
          maximum: 36500
        deleted_count:
          type: integer
          minimum: 0
        freed_bytes:
          type: integer
          format: int64
          minimum: 0
        skipped_active:
          type: boolean
          description: 活动日志文件（最新 mtime）命中删除集并被跳过时为 true。
        failed_files:
          type: array
          items:
            type: string
    PerformanceRecentOperation:
      type: object
      additionalProperties: false
      required:
        - time
        - actor
        - action
        - route
        - result
        - instance_id
        - deleted_count
        - freed_bytes
        - failed_count
        - duration_ms
        - skipped_active
      properties:
        time:
          type: string
          format: date-time
        actor:
          type: string
          description: 审计既有 username 快照（未解析时为 user#<id>）。
        action:
          type: string
          enum:
            - system.disk_cache.clear
            - system.gc.run
            - system.log_cleanup.run
        route:
          type: string
        result:
          type: string
          enum:
            - success
            - failed
        instance_id:
          type: string
        mode:
          type: string
          enum:
            - by_count
            - by_days
          description: 仅 system.log_cleanup.run 行返回；其余操作省略该字段。
        value:
          type: integer
          minimum: 1
          maximum: 36500
          description: 仅 system.log_cleanup.run 行返回清理参数；其余操作省略该字段。
        deleted_count:
          type: integer
          format: int64
          minimum: 0
        freed_bytes:
          type: integer
          format: int64
          minimum: 0
        failed_count:
          type: integer
          format: int64
          minimum: 0
        duration_ms:
          type: integer
          format: int64
          minimum: 0
        skipped_active:
          type: boolean
    PerformanceRecentOperations:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PerformanceRecentOperation'
    AnnouncementCategory:
      type: string
      enum:
        - notice
        - maintenance
        - release
    AnnouncementStatus:
      type: string
      description: DB 状态只有三值；expired 是虚拟态，不落库（R-D7-10）。
      enum:
        - draft
        - published
        - offline
    AnnouncementDisplayStatus:
      type: string
      description: UI 徽章状态；expired = status=published 且 expire_at<=now。
      enum:
        - draft
        - published
        - expired
        - offline
    AnnouncementSummary:
      type: object
      additionalProperties: false
      required:
        - id
        - title
        - category
        - status
        - display_status
        - publish_at
        - created_by
        - updated_by
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 80
        category:
          $ref: '#/components/schemas/AnnouncementCategory'
        status:
          $ref: '#/components/schemas/AnnouncementStatus'
        display_status:
          $ref: '#/components/schemas/AnnouncementDisplayStatus'
        publish_at:
          type: string
          format: date-time
          description: 生效时间（可预排未来）。
        expire_at:
          type: string
          format: date-time
          nullable: true
          description: null = 永久有效；必须晚于 publish_at。
        published_at:
          type: string
          format: date-time
          nullable: true
          description: 实际点击发布的时刻；编辑已发布公告不重写（N-35）。
        offline_at:
          type: string
          format: date-time
          nullable: true
        created_by:
          type: integer
          format: int64
        updated_by:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    AnnouncementList:
      type: object
      additionalProperties: false
      required:
        - items
        - total
        - page
        - page_size
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AnnouncementSummary'
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
          maximum: 100
    AnnouncementWriteInput:
      type: object
      additionalProperties: false
      required:
        - title
        - content
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 80
        category:
          allOf:
            - $ref: '#/components/schemas/AnnouncementCategory'
          description: 省略时默认 notice。
        content:
          type: string
          minLength: 1
          maxLength: 16384
          description: Markdown 原文；渲染期净化（R-D7-04）。
        publish_at:
          type: string
          format: date-time
          description: 省略时创建取 now()、编辑保留原值；编辑已发布公告时忽略。
        expire_at:
          type: string
          format: date-time
          nullable: true
          description: null/省略 = 永久有效；必须晚于生效时间。
        publish_now:
          type: boolean
          default: false
          description: |
            true = 在同一事务内写入并发布（draft/offline → published）；
            校验或发布失败整体回滚并返回 422（R-D7-06 组合路径）。
