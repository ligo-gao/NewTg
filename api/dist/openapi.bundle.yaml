        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
          nullable: true
          description: null = 仍在运行。
        error:
          type: string
          description: 失败原因摘要；空串 = 无错误（列 NOT NULL DEFAULT ''）。
    ReconcileRunList:
      type: object
      additionalProperties: false
      description: GET /api/upstream-reconciliations/runs 的 offset 分页信封（started_at 降序）。
      required:
        - items
        - total
        - page
        - page_size
      properties:
