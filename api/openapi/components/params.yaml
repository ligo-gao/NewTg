# 公共请求头参数（platform-03 §9.4）
parameters:
  IdempotencyKey:
    name: Idempotency-Key
    in: header
    required: false
    description: 写操作幂等键（UUID）。同键重放在有效窗口内返回首次结果。
    schema:
      type: string
      format: uuid
  CSRFToken:
    name: X-CSRF-Token
    in: header
    required: false
    description: |
      条件必带：Cookie 会话路径的非安全方法（POST/PUT/PATCH/DELETE）必须发送；
      Authorization: Bearer 路径豁免（无 CSRF 风险）。
    schema:
      type: string
      minLength: 1
