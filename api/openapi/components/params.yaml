# 公共请求头参数（platform-03 §9.4）与路径参数。
parameters:
  IdempotencyKey:
    name: Idempotency-Key
    in: header
    required: false
    description: 写操作幂等键（UUID）。同键重放在有效窗口内返回首次结果。
    schema:
      type: string
      format: uuid
  CSRFToken:
    name: X-CSRF-Token
    in: header
    required: false
    description: |
      条件必带：Cookie 会话路径的非安全方法（POST/PUT/PATCH/DELETE）必须发送；
      Authorization: Bearer 路径豁免（无 CSRF 风险）。
    schema:
      type: string
      minLength: 1

  # 路径参数集中定义，避免各域重复、漂移。
  PathUserID:
    name: id
    in: path
    required: true
    description: 用户 ID（正整数）；解析失败与不存在统一 404。
    schema:
      type: integer
      format: int64
      minimum: 1
  PathTokenID:
    name: id
    in: path
    required: true
    description: 令牌 ID（正整数）；他人令牌与不存在统一 404。
    schema:
      type: integer
      format: int64
      minimum: 1
  PathSessionID:
    name: sid
    in: path
    required: true
    description: 会话 id（不透明字符串，取自 GET /api/sessions）。
    schema:
      type: string
      minLength: 1
  PathGroupName:
    name: name
    in: path
    required: true
    description: 分组名（^[a-z0-9_-]{2,32}$）。
    schema:
      type: string
      pattern: '^[a-z0-9_-]{2,32}$'
  PathPricingModel:
    name: model
    in: path
    required: true
    description: 计费模型名（1–128 字符，允许 A-Za-z0-9._:-）；不存在 404。
    schema:
      type: string
      pattern: '^[A-Za-z0-9._:-]{1,128}$'
  PathGroupTag:
    name: group
    in: path
    required: true
    description: 分组名（user_groups.name）。
    schema:
      type: string
      pattern: '^[a-z0-9_-]{2,32}$'
  UpdatedAtQuery:
    name: updated_at
    in: query
    required: true
    description: |
      乐观锁版本（GET 列表返回的 updated_at 原样回传）。DELETE 无 body，
      故通过查询参数传递；不匹配返回 409。
    schema:
      type: string
      format: date-time

  PathRedemptionCodeID:
    name: id
    in: path
    required: true
    description: redemption_codes.id
    schema:
      type: integer
      format: int64
      minimum: 1

  # 任务数据面（M6d Task 6a）：路径 key 与查询 task_id 集中定义，
  # relay 片段不得内联 schema（scripts/check_openapi_layout.sh 断言）。
  TaskPluginKey:
    name: key
    in: path
    required: true
    description: 插件 key（1–30，^[a-z0-9][a-z0-9-]*$）
    schema:
      type: string
      maxLength: 30
  TaskIDQuery:
    name: task_id
    in: query
    required: true
    description: 对外任务 ID（task_<32 hex>）
    schema:
      type: string
