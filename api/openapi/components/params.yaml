# 公共请求头参数（platform-03 §9.4）与路径参数。
parameters:
  IdempotencyKey:
    name: Idempotency-Key
    in: header
    required: false
    description: 写操作幂等键（UUID）。同键重放在有效窗口内返回首次结果。
    schema:
      type: string
      format: uuid
  CSRFToken:
    name: X-CSRF-Token
    in: header
    required: false
    description: |
      条件必带：Cookie 会话路径的非安全方法（POST/PUT/PATCH/DELETE）必须发送；
      Authorization: Bearer 路径豁免（无 CSRF 风险）。
    schema:
      type: string
      minLength: 1

  # 路径参数集中定义，避免各域重复、漂移。
  PathUserID:
    name: id
    in: path
    required: true
    description: 用户 ID（正整数）；解析失败与不存在统一 404。
    schema:
      type: integer
      format: int64
      minimum: 1
  PathTokenID:
    name: id
    in: path
    required: true
    description: 令牌 ID（正整数）；他人令牌与不存在统一 404。
    schema:
      type: integer
      format: int64
      minimum: 1
  PathSessionID:
    name: sid
    in: path
    required: true
    description: 会话 id（不透明字符串，取自 GET /api/sessions）。
    schema:
      type: string
      minLength: 1
  PathGroupName:
    name: name
    in: path
    required: true
    description: 分组名（^[a-z0-9_-]{2,32}$）。
    schema:
      type: string
      pattern: '^[a-z0-9_-]{2,32}$'
  PathPricingModel:
    name: model
    in: path
    required: true
    description: 计费模型名（1–128 字符，允许 A-Za-z0-9._:/-，含公开模型名的厂商前缀 /）；不存在 404。
    schema:
      type: string
      pattern: '^[A-Za-z0-9._:/-]{1,128}$'
  PathGroupTag:
    name: group
    in: path
    required: true
    description: 分组名（user_groups.name）。
    schema:
      type: string
      pattern: '^[a-z0-9_-]{2,32}$'
  UpdatedAtQuery:
    name: updated_at
    in: query
    required: true
    description: |
      乐观锁版本（GET 列表返回的 updated_at 原样回传）。DELETE 无 body，
      故通过查询参数传递；不匹配返回 409。
    schema:
      type: string
      format: date-time

  PathRedemptionCodeID:
    name: id
    in: path
    required: true
    description: redemption_codes.id
    schema:
      type: integer
      format: int64
      minimum: 1

  # 任务数据面（M6d Task 6a）：路径 key 与查询 task_id 集中定义，
  # relay 片段不得内联 schema（scripts/check_openapi_layout.sh 断言）。
  TaskPluginKey:
    name: key
    in: path
    required: true
    description: 插件 key（1–30，^[a-z0-9][a-z0-9-]*$）
    schema:
      type: string
      maxLength: 30
  TaskIDQuery:
    name: task_id
    in: query
    required: true
    description: 对外任务 ID（task_<32 hex>）
    schema:
      type: string
  TaskArtifactKey:
    name: artifact_key
    in: path
    required: true
    description: 任务内产物 key（由 task.data.artifacts[].key 投影；T6b 冻结字符集）
    schema:
      type: string
      pattern: '^[A-Za-z0-9._-]{1,128}$'
      maxLength: 128
  TaskArtifactAccess:
    name: access
    in: query
    required: true
    description: 宿主签发的 HMAC 能力票据（长期有效；无效/过期 403）
    schema:
      type: string
  VideoID:
    name: video_id
    in: path
    required: true
    description: 视频对象 ID（`video_<x>`；映射到 task_<x> 的任务）
    schema:
      type: string
  BatchID:
    name: batch_id
    in: path
    required: true
    description: 批次 ID（`batch_<uuid>`）
    schema:
      type: string
  ResponseID:
    name: response_id
    in: path
    required: true
    description: Responses 对象 ID（`resp_<x>`；映射到 task_<x> 的任务产物）
    schema:
      type: string
  ConfirmAction:
    name: X-Confirm-Action
    in: header
    required: true
    description: |
      服务端强制确认（modules-08 §3.19 Q3）。取值 "true"（大小写不敏感）；
      缺失或其他值一律 422 confirm_required，且在任何副作用之前拒绝。
      前端 DangerConfirm 只是体验层，本请求头才是授权门。
    schema:
      type: string

  # MJ 任务 id 路径参数（W8/MJ-b）。字符集与 R-MJ-16 的 MjId 规则一致；
  # 放在公共组件里是因为 relay 域 paths 不允许内联 schema。
  MJTaskID:
    name: id
    in: path
    required: true
    description: MjId（`^[A-Za-z0-9_-]{1,128}$`）
    schema: {type: string, minLength: 1, maxLength: 128}

  # 图片签名 URL 的查询参数（W8/MJ-c，R-MJ-09）。放在公共组件里是因为
  # relay 域 paths 不允许内联 schema（真源在组件里）。
  MJImageSig:
    name: sig
    in: query
    required: true
    description: 图片票据签名（base64url，无填充；HMAC-SHA256）
    schema: {type: string, minLength: 1}
  MJImageExp:
    name: exp
    in: query
    required: true
    description: 票据过期时间（Unix 秒；TTL 300s）
    schema: {type: integer, format: int64, minimum: 1}

requestBodies:
  # list-by-condition 的请求体（W8/MJ-b）；schema 真源在 schemas/relay.yaml。
  MJTaskList:
    required: true
    content:
      application/json:
        schema:
          $ref: '../schemas/relay.yaml#/schemas/MJTaskListRequest'
