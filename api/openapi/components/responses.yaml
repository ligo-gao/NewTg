# 公共错误响应目录（platform-03 §10.1-6）：一律 application/problem+json（RFC 7807）
responses:
  Error400:
    description: 请求不符合契约（参数/请求体校验失败）
    content:
      application/problem+json:
        schema:
          $ref: './problem.yaml#/schemas/Problem'
  Error401:
    description: 未认证或凭据失效
    content:
      application/problem+json:
        schema:
          $ref: './problem.yaml#/schemas/Problem'
  Error402:
    description: 额度/余额不足
    content:
      application/problem+json:
        schema:
          $ref: './problem.yaml#/schemas/Problem402'
  Error403:
    description: 已认证但无权访问
    content:
      application/problem+json:
        schema:
          $ref: './problem.yaml#/schemas/Problem'
  Error404:
    description: 资源不存在
    content:
      application/problem+json:
        schema:
          $ref: './problem.yaml#/schemas/Problem'
  Error409:
    description: 冲突（含乐观并发 updated_at 不匹配）
    content:
      application/problem+json:
        schema:
          $ref: './problem.yaml#/schemas/Problem'
  Error410:
    description: 资源已过期（兑换码虚拟过期态）
    content:
      application/problem+json:
        schema:
          $ref: './problem.yaml#/schemas/Problem'
  Error422:
    description: 语义不可处理（邮箱域名白名单拒绝；幂等键被不同请求体复用）
    content:
      application/problem+json:
        schema:
          $ref: './problem.yaml#/schemas/Problem'
  Error429:
    description: 触发限流（管理面/公开面；RFC 7807 problem+json）
    headers:
      Retry-After:
        description: 建议重试等待秒数
        schema:
          type: integer
          minimum: 0
    content:
      application/problem+json:
        schema:
          $ref: './problem.yaml#/schemas/Problem'
  # RelayError429 是 /v1 与 /pg 中继协议面的限流响应（W7/M5-c，R-M5-15）。
  #
  # 为什么单独一个组件而不是复用 Error429：中继面的错误形状是 OpenAI 兼容
  # 信封（application/json），不是 RFC 7807（relay-01 §3.6）。M5 限流的 429
  # 由网关在准入阶段产生（B11→B10→B12，R-M5-05 短路），形状由
  # writeRelayRateLimitError 冻结：x-request-id 与 message 的 requestId 同一值，
  # Retry-After 是向上取整的整数秒（只在 429 出现；500 限流器故障不设该头）。
  RelayError429:
    description: |
      触发中继准入限流（`rate_limit_exceeded`）。`Retry-After` 为建议重试的
      整数秒数；响应体是 OpenAI 兼容错误信封（`{error:{message,type,code}}`）。
    headers:
      Retry-After:
        description: 建议重试等待秒数（向上取整）
        schema:
          type: integer
          minimum: 0
      X-Request-ID:
        description: "请求 ID；响应体 `message` 末尾也附带 `(requestId: <id>)`"
        schema:
          type: string
    content:
      application/json:
        schema:
          $ref: '../schemas/relay.yaml#/schemas/RelayError'

  # R-W18-13：/v1（与 /pg）中继面的 4xx/5xx 一律是 OpenAI 兼容错误信封
  # （relay-01 §3.6、relay_auth.go 的 writeRelayError）。
  #
  # 为什么不能复用上面的 Error400/401/402/500：那些组件声明的是 RFC 7807
  # （只属于 /api/*）的形状，与 /v1 实现返回的 `{error:{...}}` 不一致，会让
  # 文档与实现长期漂移（G-DOM-86）。RFC 7807 在 /v1 只保留给「端点形态
  # 不支持」的 fail-closed 501（Error501）；/v1/messages 的 Claude 形信封
  # 由 W18-A 单独登记，本任务不动它的 schema。
  RelayError400:
    description: 请求不符合契约（参数/请求体校验失败，OpenAI 错误信封）
    headers:
      X-Request-ID:
        description: "请求 ID；响应体 `message` 末尾也附带 `(requestId: <id>)`"
        schema:
          type: string
    content:
      application/json:
        schema:
          $ref: '../schemas/relay.yaml#/schemas/RelayError'
  RelayError401:
    description: 未认证或令牌失效（OpenAI 错误信封；code 为空串）
    headers:
      X-Request-ID:
        description: "请求 ID；响应体 `message` 末尾也附带 `(requestId: <id>)`"
        schema:
          type: string
    content:
      application/json:
        schema:
          $ref: '../schemas/relay.yaml#/schemas/RelayError'
  RelayError402:
    description: 额度/余额不足（OpenAI 错误信封）
    headers:
      X-Request-ID:
        description: "请求 ID；响应体 `message` 末尾也附带 `(requestId: <id>)`"
        schema:
          type: string
    content:
      application/json:
        schema:
          $ref: '../schemas/relay.yaml#/schemas/RelayError'
  RelayError403:
    description: 已认证但无权访问（OpenAI 错误信封）
    headers:
      X-Request-ID:
        description: "请求 ID；响应体 `message` 末尾也附带 `(requestId: <id>)`"
        schema:
          type: string
    content:
      application/json:
        schema:
          $ref: '../schemas/relay.yaml#/schemas/RelayError'
  RelayError404:
    description: 资源/模型不存在（OpenAI 错误信封）
    headers:
      X-Request-ID:
        description: "请求 ID；响应体 `message` 末尾也附带 `(requestId: <id>)`"
        schema:
          type: string
    content:
      application/json:
        schema:
          $ref: '../schemas/relay.yaml#/schemas/RelayError'
  RelayError500:
    description: 服务端内部错误（OpenAI 错误信封）
    headers:
      X-Request-ID:
        description: "请求 ID；响应体 `message` 末尾也附带 `(requestId: <id>)`"
        schema:
          type: string
    content:
      application/json:
        schema:
          $ref: '../schemas/relay.yaml#/schemas/RelayError'
  RelayError503:
    description: 服务暂不可用（部署未就绪/依赖不可用；OpenAI 错误信封）
    headers:
      X-Request-ID:
        description: "请求 ID；响应体 `message` 末尾也附带 `(requestId: <id>)`"
        schema:
          type: string
    content:
      application/json:
        schema:
          $ref: '../schemas/relay.yaml#/schemas/RelayError'
  Error500:
    description: 服务端内部错误
    content:
      application/problem+json:
        schema:
          $ref: './problem.yaml#/schemas/Problem'
  Error501:
    description: 中继无法表达该端点形态（fail-closed：不产生计费、不调用上游）
    content:
      application/problem+json:
        schema:
          $ref: './problem.yaml#/schemas/Problem'
  Error502:
    description: 上游依赖失败（如验证码邮件投递失败）
    content:
      application/problem+json:
        schema:
          $ref: './problem.yaml#/schemas/Problem'
  Error503:
    description: 服务不可用（依赖未就绪或过载）
    content:
      application/problem+json:
        schema:
          $ref: './problem.yaml#/schemas/Problem'
