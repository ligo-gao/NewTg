# 公共错误响应目录（platform-03 §10.1-6）：一律 application/problem+json（RFC 7807）
responses:
  Error400:
    description: 请求不符合契约（参数/请求体校验失败）
    content:
      application/problem+json:
        schema:
          $ref: './problem.yaml#/schemas/Problem'
  Error401:
    description: 未认证或凭据失效
    content:
      application/problem+json:
        schema:
          $ref: './problem.yaml#/schemas/Problem'
  Error402:
    description: 额度/余额不足
    content:
      application/problem+json:
        schema:
          $ref: './problem.yaml#/schemas/Problem402'
  Error403:
    description: 已认证但无权访问
    content:
      application/problem+json:
        schema:
          $ref: './problem.yaml#/schemas/Problem'
  Error404:
    description: 资源不存在
    content:
      application/problem+json:
        schema:
          $ref: './problem.yaml#/schemas/Problem'
  Error409:
    description: 冲突（含乐观并发 updated_at 不匹配）
    content:
      application/problem+json:
        schema:
          $ref: './problem.yaml#/schemas/Problem'
  Error410:
    description: 资源已过期（兑换码虚拟过期态）
    content:
      application/problem+json:
        schema:
          $ref: './problem.yaml#/schemas/Problem'
  Error422:
    description: 语义不可处理（邮箱域名白名单拒绝；幂等键被不同请求体复用）
    content:
      application/problem+json:
        schema:
          $ref: './problem.yaml#/schemas/Problem'
  Error429:
    description: 触发限流（管理面/公开面；RFC 7807 problem+json）
    headers:
      Retry-After:
        description: 建议重试等待秒数
        schema:
          type: integer
          minimum: 0
    content:
      application/problem+json:
        schema:
          $ref: './problem.yaml#/schemas/Problem'
  # RelayError429 是 /v1 与 /pg 中继协议面的限流响应（W7/M5-c，R-M5-15）。
  #
  # 为什么单独一个组件而不是复用 Error429：中继面的错误形状是 OpenAI 兼容
  # 信封（application/json），不是 RFC 7807（relay-01 §3.6）。M5 限流的 429
  # 由网关在准入阶段产生（B11→B10→B12，R-M5-05 短路），形状由
  # writeRelayRateLimitError 冻结：x-request-id 与 message 的 requestId 同一值，
  # Retry-After 是向上取整的整数秒（只在 429 出现；500 限流器故障不设该头）。
  RelayError429:
    description: |
      触发中继准入限流（`rate_limit_exceeded`）。`Retry-After` 为建议重试的
      整数秒数；响应体是 OpenAI 兼容错误信封（`{error:{message,type,code}}`）。
    headers:
      Retry-After:
        description: 建议重试等待秒数（向上取整）
        schema:
          type: integer
          minimum: 0
      X-Request-ID:
        description: "请求 ID；响应体 `message` 末尾也附带 `(requestId: <id>)`"
        schema:
          type: string
    content:
      application/json:
        schema:
          $ref: '../schemas/relay.yaml#/schemas/RelayError'
  Error500:
    description: 服务端内部错误
    content:
      application/problem+json:
        schema:
          $ref: './problem.yaml#/schemas/Problem'
  Error501:
    description: 中继无法表达该端点形态（fail-closed：不产生计费、不调用上游）
    content:
      application/problem+json:
        schema:
          $ref: './problem.yaml#/schemas/Problem'
  Error502:
    description: 上游依赖失败（如验证码邮件投递失败）
    content:
      application/problem+json:
        schema:
          $ref: './problem.yaml#/schemas/Problem'
  Error503:
    description: 服务不可用（依赖未就绪或过载）
    content:
      application/problem+json:
        schema:
          $ref: './problem.yaml#/schemas/Problem'

  # ---------------------------------------------------------------------------
  # Claude 形错误目录（R-W18-04，真源 writeClaudeError）。
  #
  # /v1/messages 族（含 count_tokens）是 Anthropic 原生协议面：Claude 客户端按
  # `{"type":"error","error":{"type","message"}}` 解析错误。普通 400/401/402/
  # 403/404/413/429/5xx 一律使用这些组件，**不得**复用上面的 problem+json
  # Error400/401/...；problem+json 仅保留给「端点形态不支持」的 501（如
  # /v1/messages 方向不支持、count_tokens 方向不支持），而 /v1/responses 的
  # 501 是 RelayError501（OpenAI 信封）。
  #
  # 每个响应都带 X-Request-ID；message 末尾也追加 `(requestId: <id>)`。
  # ---------------------------------------------------------------------------
  ClaudeError400:
    description: 请求不符合 Anthropic Messages 契约（Claude 形错误信封）
    headers:
      X-Request-ID:
        description: "请求 ID；响应体 `message` 末尾也附带 `(requestId: <id>)`"
        schema: {type: string}
    content:
      application/json:
        schema:
          $ref: '../schemas/relay.yaml#/schemas/ClaudeError'
  ClaudeError401:
    description: 未认证或令牌失效（Claude 形 `authentication_error`）
    headers:
      X-Request-ID:
        description: "请求 ID；响应体 `message` 末尾也附带 `(requestId: <id>)`"
        schema: {type: string}
    content:
      application/json:
        schema:
          $ref: '../schemas/relay.yaml#/schemas/ClaudeError'
  ClaudeError402:
    description: 额度/余额不足（Claude 形 `invalid_request_error`，状态码保持 402）
    headers:
      X-Request-ID:
        description: "请求 ID；响应体 `message` 末尾也附带 `(requestId: <id>)`"
        schema: {type: string}
    content:
      application/json:
        schema:
          $ref: '../schemas/relay.yaml#/schemas/ClaudeError'
  ClaudeError403:
    description: 已认证但无权使用该模型/渠道（Claude 形 `permission_error`）
    headers:
      X-Request-ID:
        description: "请求 ID；响应体 `message` 末尾也附带 `(requestId: <id>)`"
        schema: {type: string}
    content:
      application/json:
        schema:
          $ref: '../schemas/relay.yaml#/schemas/ClaudeError'
  ClaudeError404:
    description: 模型/渠道不存在或已停用（Claude 形 `not_found_error`）
    headers:
      X-Request-ID:
        description: "请求 ID；响应体 `message` 末尾也附带 `(requestId: <id>)`"
        schema: {type: string}
    content:
      application/json:
        schema:
          $ref: '../schemas/relay.yaml#/schemas/ClaudeError'
  ClaudeError413:
    description: 请求体超过上限（Claude 形 `request_too_large`）
    headers:
      X-Request-ID:
        description: "请求 ID；响应体 `message` 末尾也附带 `(requestId: <id>)`"
        schema: {type: string}
    content:
      application/json:
        schema:
          $ref: '../schemas/relay.yaml#/schemas/ClaudeError'
  ClaudeError429:
    description: |
      触发中继准入限流（Claude 形 `rate_limit_error`）。`Retry-After` 为建议
      重试的整数秒数；message 文案中的秒数与之一致。
    headers:
      Retry-After:
        description: 建议重试等待秒数（向上取整）
        schema:
          type: integer
          minimum: 0
      X-Request-ID:
        description: "请求 ID；响应体 `message` 末尾也附带 `(requestId: <id>)`"
        schema: {type: string}
    content:
      application/json:
        schema:
          $ref: '../schemas/relay.yaml#/schemas/ClaudeError'
  ClaudeError500:
    description: 服务端内部错误（Claude 形 `api_error`）
    headers:
      X-Request-ID:
        description: "请求 ID；响应体 `message` 末尾也附带 `(requestId: <id>)`"
        schema: {type: string}
    content:
      application/json:
        schema:
          $ref: '../schemas/relay.yaml#/schemas/ClaudeError'
  ClaudeError502:
    description: 上游请求失败或响应不可用（Claude 形 `api_error`）
    headers:
      X-Request-ID:
        description: "请求 ID；响应体 `message` 末尾也附带 `(requestId: <id>)`"
        schema: {type: string}
    content:
      application/json:
        schema:
          $ref: '../schemas/relay.yaml#/schemas/ClaudeError'
  ClaudeError503:
    description: 服务不可用（Claude 形 `api_error`）
    headers:
      X-Request-ID:
        description: "请求 ID；响应体 `message` 末尾也附带 `(requestId: <id>)`"
        schema: {type: string}
    content:
      application/json:
        schema:
          $ref: '../schemas/relay.yaml#/schemas/ClaudeError'
  # —— W18-C（Responses 原生协议面）——
  #
  # 真源是 backend/internal/tasks/responses.go 的 BuildResponsesObject。
  # relay paths 不得内联协议 schema（layout 规则 §9.3），所以成功/错误形状
  # 统一登记在这里，路径侧只放 $ref。
  ResponsesCreateOK:
    description: |
      Responses 对象（非流式）或 SSE 事件流（`stream: true`）。
      SSE 最小事件集：response.created / response.output_text.delta /
      response.completed / response.failed；created 恒为首帧、终止事件恒为末帧，
      终止事件携带 response.usage。任务非终态时以 response.in_progress 收尾。
    content:
      application/json:
        schema:
          $ref: '../schemas/relay.yaml#/schemas/ResponsesObject'
      text/event-stream:
        schema:
          type: string
        description: |
          每帧 `event: <type>` + `data: <json>`。未知事件类型按 raw 透传。
  ResponsesGetOK:
    description: |
      Responses 对象。非终态 status=queued/in_progress/incomplete 且 output=[]；
      终态含产物投影 output[] 与 usage。身份字段与 create 使用同一套投影。
    content:
      application/json:
        schema:
          $ref: '../schemas/relay.yaml#/schemas/ResponsesObject'
  RelayError501:
    description: |
      /v1 中继面 501（端点形态不支持）。错误体是 OpenAI 兼容信封
      （`{error:{message,type,code}}`），不是 RFC 7807 problem+json。
    content:
      application/json:
        schema:
          $ref: '../schemas/relay.yaml#/schemas/RelayError'
