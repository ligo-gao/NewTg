  /api/deployments:
    $ref: './paths/admin.yaml#/paths/~1api~1deployments'
  /api/deployments/hardware-types:
    $ref: './paths/admin.yaml#/paths/~1api~1deployments~1hardware-types'
  /api/deployments/locations:
    $ref: './paths/admin.yaml#/paths/~1api~1deployments~1locations'
  /api/deployments/available-replicas:
