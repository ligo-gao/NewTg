      $ref: './components/security.yaml#/securitySchemes/bearerToken'

  parameters:
    Page:
      $ref: './components/pagination.yaml#/parameters/Page'
    PageSize:
      $ref: './components/pagination.yaml#/parameters/PageSize'
    IdempotencyKey:
      $ref: './components/params.yaml#/parameters/IdempotencyKey'
    CSRFToken:
      $ref: './components/params.yaml#/parameters/CSRFToken'
    PathUserID:
      $ref: './components/params.yaml#/parameters/PathUserID'
    PathTokenID:
      $ref: './components/params.yaml#/parameters/PathTokenID'
    PathSessionID:
      $ref: './components/params.yaml#/parameters/PathSessionID'
    PathGroupName:
      $ref: './components/params.yaml#/parameters/PathGroupName'
    PathPricingModel:
      $ref: './components/params.yaml#/parameters/PathPricingModel'
    PathGroupTag:
      $ref: './components/params.yaml#/parameters/PathGroupTag'
    UpdatedAtQuery:
      $ref: './components/params.yaml#/parameters/UpdatedAtQuery'

  schemas:
    Problem:
      $ref: './components/problem.yaml#/schemas/Problem'
    Problem402:
      $ref: './components/problem.yaml#/schemas/Problem402'
    Page:
      $ref: './components/pagination.yaml#/schemas/Page'
    PublicStatus:
      $ref: './schemas/public.yaml#/schemas/PublicStatus'
    GeoIPResponse:
      $ref: './schemas/public.yaml#/schemas/GeoIPResponse'
    Token:
      $ref: './schemas/user.yaml#/schemas/Token'
    Channel:
      $ref: './schemas/admin.yaml#/schemas/Channel'
    # 中继协议面的错误信封（真源 writeRelayError）；只被 RelayError429 使用。
    RelayError:
      $ref: './schemas/relay.yaml#/schemas/RelayError'
    # Claude 形错误信封（真源 writeClaudeError）；被 ClaudeError4xx/5xx 使用。
    ClaudeError:
      $ref: './schemas/relay.yaml#/schemas/ClaudeError'

  responses:
    Error400:
      $ref: './components/responses.yaml#/responses/Error400'
    Error401:
      $ref: './components/responses.yaml#/responses/Error401'
    Error402:
      $ref: './components/responses.yaml#/responses/Error402'
    Error403:
      $ref: './components/responses.yaml#/responses/Error403'
    Error404:
      $ref: './components/responses.yaml#/responses/Error404'
    Error409:
      $ref: './components/responses.yaml#/responses/Error409'
    Error422:
      $ref: './components/responses.yaml#/responses/Error422'
    Error429:
      $ref: './components/responses.yaml#/responses/Error429'
    # 中继面 429（W7/M5-c）：OpenAI 兼容信封 + Retry-After/X-Request-ID，
    # 与 /api/* 的 problem+json Error429 刻意分开。
    RelayError429:
      $ref: './components/responses.yaml#/responses/RelayError429'
    Error500:
      $ref: './components/responses.yaml#/responses/Error500'
    Error502:
      $ref: './components/responses.yaml#/responses/Error502'
    Error503:
      $ref: './components/responses.yaml#/responses/Error503'
    # Claude 形错误（R-W18-04）：/v1/messages 族专用；普通 4xx/5xx 不得
    # 复用上面的 problem+json 组件。
    ClaudeError400:
      $ref: './components/responses.yaml#/responses/ClaudeError400'
    ClaudeError401:
      $ref: './components/responses.yaml#/responses/ClaudeError401'
    ClaudeError402:
      $ref: './components/responses.yaml#/responses/ClaudeError402'
    ClaudeError403:
      $ref: './components/responses.yaml#/responses/ClaudeError403'
    ClaudeError404:
      $ref: './components/responses.yaml#/responses/ClaudeError404'
    ClaudeError413:
      $ref: './components/responses.yaml#/responses/ClaudeError413'
    ClaudeError429:
      $ref: './components/responses.yaml#/responses/ClaudeError429'
    ClaudeError500:
      $ref: './components/responses.yaml#/responses/ClaudeError500'
    ClaudeError502:
      $ref: './components/responses.yaml#/responses/ClaudeError502'
    ClaudeError503:
      $ref: './components/responses.yaml#/responses/ClaudeError503'
