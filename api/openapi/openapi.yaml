openapi: 3.1.0
info:
  title: NewTG API
  version: 0.2.0-m1
  description: |
    NewTG 网关 API 契约（M1：账户/认证/令牌/用户/分组）。
    管理 API 统一使用 RFC 7807 `application/problem+json` 错误体与 offset 分页信封
    `Page{items,total,page,page_size}`（`p` 1 基，`page_size` 默认 20、上限 100）。
    中继 `/v1/*` 仅登记路径与公共面，不重定义上游协议 schema（真源见 externalDocs）。
    M1 的会话性端点同时声明 `sessionCookie` 与 `bearerToken`；管理端点只接受
    会话 Cookie（Bearer 没有角色/权限语义）。
servers:
  - url: /
    description: 同源部署（边缘反代 → 网关）
security: []
tags:
  - name: ops
    description: 运维探针（/healthz、/readyz）
  - name: public
    description: 公开接口（无需认证）
  - name: user
    description: 用户自助接口（会话 Cookie 或 API 令牌）
  - name: admin
    description: 管理接口（仅管理员会话）
  - name: relay
    description: 中继协议面（API 令牌；schema 遵循上游公开规范）

paths:
  /healthz:
    $ref: './paths/ops.yaml#/paths/~1healthz'
  /readyz:
    $ref: './paths/ops.yaml#/paths/~1readyz'

  # 公开域（security: []）。
  /api/status:
    $ref: './paths/public.yaml#/paths/~1api~1status'
  /api/geoip:
    $ref: './paths/public.yaml#/paths/~1api~1geoip'
  # 公开读面（modules-09；M6c Task 7）：首页统计与定价目录。
  /api/home/stats:
    $ref: './paths/public.yaml#/paths/~1api~1home~1stats'
  /api/pricing:
    $ref: './paths/public.yaml#/paths/~1api~1pricing'
  /api/pricing/{model_id}:
    $ref: './paths/public.yaml#/paths/~1api~1pricing~1{model_id}'
  /api/pricing/{model_id}/metrics:
    $ref: './paths/public.yaml#/paths/~1api~1pricing~1{model_id}~1metrics'
  /api/auth/login/encryption-key:
    $ref: './paths/public.yaml#/paths/~1api~1auth~1login~1encryption-key'
  /api/auth/email-code:
    $ref: './paths/public.yaml#/paths/~1api~1auth~1email-code'
  /api/auth/register:
    $ref: './paths/public.yaml#/paths/~1api~1auth~1register'
  /api/auth/login:
    $ref: './paths/public.yaml#/paths/~1api~1auth~1login'
  /api/auth/2fa/challenge:
    $ref: './paths/public.yaml#/paths/~1api~1auth~12fa~1challenge'
  /api/auth/password-reset/request:
    $ref: './paths/public.yaml#/paths/~1api~1auth~1password-reset~1request'
  /api/auth/password-reset/validate:
    $ref: './paths/public.yaml#/paths/~1api~1auth~1password-reset~1validate'
  /api/auth/password-reset/confirm:
    $ref: './paths/public.yaml#/paths/~1api~1auth~1password-reset~1confirm'
  /api/logout:
    $ref: './paths/public.yaml#/paths/~1api~1logout'
  /api/setup:
    $ref: './paths/public.yaml#/paths/~1api~1setup'

  # 用户自助域。
  /api/me:
    $ref: './paths/user.yaml#/paths/~1api~1me'
  /api/self:
    $ref: './paths/user.yaml#/paths/~1api~1self'
  /api/self/setting:
    $ref: './paths/user.yaml#/paths/~1api~1self~1setting'
  /api/sessions:
    $ref: './paths/user.yaml#/paths/~1api~1sessions'
  /api/sessions/{sid}:
    $ref: './paths/user.yaml#/paths/~1api~1sessions~1{sid}'
  /api/sessions/revoke-others:
    $ref: './paths/user.yaml#/paths/~1api~1sessions~1revoke-others'
  /api/verify-email:
    $ref: './paths/user.yaml#/paths/~1api~1verify-email'
  /api/password:
    $ref: './paths/user.yaml#/paths/~1api~1password'
  /api/account:
    $ref: './paths/user.yaml#/paths/~1api~1account'
  /api/email:
    $ref: './paths/user.yaml#/paths/~1api~1email'
  /api/notification-preferences:
    $ref: './paths/user.yaml#/paths/~1api~1notification-preferences'
  /api/notification-preferences/test:
    $ref: './paths/user.yaml#/paths/~1api~1notification-preferences~1test'
  /api/2fa/setup:
    $ref: './paths/user.yaml#/paths/~1api~12fa~1setup'
  /api/2fa/enable:
    $ref: './paths/user.yaml#/paths/~1api~12fa~1enable'
  /api/2fa/disable:
    $ref: './paths/user.yaml#/paths/~1api~12fa~1disable'
  /api/2fa/backup-codes/regenerate:
    $ref: './paths/user.yaml#/paths/~1api~12fa~1backup-codes~1regenerate'

  # API 令牌。
  /api/tokens:
    $ref: './paths/user.yaml#/paths/~1api~1tokens'
  /api/tokens/{id}:
    $ref: './paths/user.yaml#/paths/~1api~1tokens~1{id}'
  /api/tokens:batch-enable:
    $ref: './paths/user.yaml#/paths/~1api~1tokens:batch-enable'
  /api/tokens:batch-disable:
    $ref: './paths/user.yaml#/paths/~1api~1tokens:batch-disable'
  /api/tokens:batch-delete:
    $ref: './paths/user.yaml#/paths/~1api~1tokens:batch-delete'
  /api/tokens/{id}:enable:
    $ref: './paths/user.yaml#/paths/~1api~1tokens~1{id}:enable'
  /api/tokens/{id}:disable:
    $ref: './paths/user.yaml#/paths/~1api~1tokens~1{id}:disable'
  /api/tokens/{id}:reset-key:
    $ref: './paths/user.yaml#/paths/~1api~1tokens~1{id}:reset-key'
  /api/token/auto-groups:
    $ref: './paths/user.yaml#/paths/~1api~1token~1auto-groups'
  /api/usage/token:
    $ref: './paths/user.yaml#/paths/~1api~1usage~1token'

  # 管理域（仅会话 Cookie）。
  /api/users:
    $ref: './paths/admin.yaml#/paths/~1api~1users'
  /api/users/{id}:
    $ref: './paths/admin.yaml#/paths/~1api~1users~1{id}'
  /api/users/{id}/status:
    $ref: './paths/admin.yaml#/paths/~1api~1users~1{id}~1status'
  /api/users/{id}/quota-adjustment:
    $ref: './paths/admin.yaml#/paths/~1api~1users~1{id}~1quota-adjustment'
  /api/users/{id}/reset-2fa:
    $ref: './paths/admin.yaml#/paths/~1api~1users~1{id}~1reset-2fa'
  /api/users/{id}/reset-password:
    $ref: './paths/admin.yaml#/paths/~1api~1users~1{id}~1reset-password'
  /api/users/{id}/permissions:
    $ref: './paths/admin.yaml#/paths/~1api~1users~1{id}~1permissions'
  /api/groups:
    $ref: './paths/admin.yaml#/paths/~1api~1groups'
  /api/groups/{name}:
    $ref: './paths/admin.yaml#/paths/~1api~1groups~1{name}'

  # 定价管理（M3 Task 7；管理面族与公开 /api/pricing 分离）。
  /api/model-pricing:
    $ref: './paths/admin.yaml#/paths/~1api~1model-pricing'
  /api/model-pricing/models:
    $ref: './paths/admin.yaml#/paths/~1api~1model-pricing~1models'
  /api/model-pricing:preview:
    $ref: './paths/admin.yaml#/paths/~1api~1model-pricing:preview'
  /api/model-pricing/{model}:
    $ref: './paths/admin.yaml#/paths/~1api~1model-pricing~1{model}'
  /api/model-pricing/{model}:enable:
    $ref: './paths/admin.yaml#/paths/~1api~1model-pricing~1{model}:enable'
  /api/model-pricing/{model}:disable:
    $ref: './paths/admin.yaml#/paths/~1api~1model-pricing~1{model}:disable'
  /api/group-pricing:
    $ref: './paths/admin.yaml#/paths/~1api~1group-pricing'
  /api/group-pricing/{group}/{model}:
    $ref: './paths/admin.yaml#/paths/~1api~1group-pricing~1{group}~1{model}'
  /api/group-pricing/{group}/{model}:enable:
    $ref: './paths/admin.yaml#/paths/~1api~1group-pricing~1{group}~1{model}:enable'
  /api/group-pricing/{group}/{model}:disable:
    $ref: './paths/admin.yaml#/paths/~1api~1group-pricing~1{group}~1{model}:disable'

  # 兑换码（M5 Task 2；管理面 + 用户核销）。
  /api/redemption-codes:
    $ref: './paths/admin.yaml#/paths/~1api~1redemption-codes'
  /api/redemption-codes/{id}:
    $ref: './paths/admin.yaml#/paths/~1api~1redemption-codes~1{id}'
  /api/redemption-codes/batch-delete:
    $ref: './paths/admin.yaml#/paths/~1api~1redemption-codes~1batch-delete'
  /api/redemption-codes/redeem:
    $ref: './paths/user.yaml#/paths/~1api~1redemption-codes~1redeem'

  # 模型部署控制面 · 设置（M6d Task 2 / modules-08 §3.20 F-08-51）。
  # 静态子路径必须先于 /api/deployments/{id} 注册（T4 的参数路由）。
  /api/deployments/settings:
    $ref: './paths/admin.yaml#/paths/~1api~1deployments~1settings'
  /api/deployments/settings/test-connection:
    $ref: './paths/admin.yaml#/paths/~1api~1deployments~1settings~1test-connection'
  # 通知渠道 · 测试 Webhook 事件（modules-08 F-08-20）。
  /api/settings/test/webhook:
    $ref: './paths/admin.yaml#/paths/~1api~1settings~1test~1webhook'

  # 模型部署控制面 · 部署管理（M6d Task 4 / modules-08 §3.20 F-08-52～F-08-58）。
  # 静态子路径全部先于 /api/deployments/{id} 声明。
  /api/deployments:
    $ref: './paths/admin.yaml#/paths/~1api~1deployments'
  /api/deployments/hardware-types:
    $ref: './paths/admin.yaml#/paths/~1api~1deployments~1hardware-types'
  /api/deployments/locations:
    $ref: './paths/admin.yaml#/paths/~1api~1deployments~1locations'
  /api/deployments/available-replicas:
    $ref: './paths/admin.yaml#/paths/~1api~1deployments~1available-replicas'
  /api/deployments/price-estimation:
    $ref: './paths/admin.yaml#/paths/~1api~1deployments~1price-estimation'
  /api/deployments/check-name:
    $ref: './paths/admin.yaml#/paths/~1api~1deployments~1check-name'
  /api/deployments/{id}:
    $ref: './paths/admin.yaml#/paths/~1api~1deployments~1{id}'
  /api/deployments/{id}/containers:
    $ref: './paths/admin.yaml#/paths/~1api~1deployments~1{id}~1containers'
  /api/deployments/{id}/containers/{container_id}:
    $ref: './paths/admin.yaml#/paths/~1api~1deployments~1{id}~1containers~1{container_id}'
  /api/deployments/{id}/logs:
    $ref: './paths/admin.yaml#/paths/~1api~1deployments~1{id}~1logs'
  /api/deployments/{id}/name:
    $ref: './paths/admin.yaml#/paths/~1api~1deployments~1{id}~1name'
  /api/deployments/{id}/extend:
    $ref: './paths/admin.yaml#/paths/~1api~1deployments~1{id}~1extend'

  # 钱包摘要（modules-03 §F-03-01；M5 Task 6 余额卡）。
  # 任务插件管理（M6d Task 5）：静态子路径先于 /api/plugin/task/{key} 声明。
  # 渠道表单的插件绑定选项（M6d Task 7a）：权限 channels:read。
  /api/task_plugin_options:
    $ref: './paths/admin.yaml#/paths/~1api~1task_plugin_options'
  /api/plugin/task:
    $ref: './paths/admin.yaml#/paths/~1api~1plugin~1task'
  /api/plugin/task/runtime/status:
    $ref: './paths/admin.yaml#/paths/~1api~1plugin~1task~1runtime~1status'
  /api/plugin/task/marketplace:
    $ref: './paths/admin.yaml#/paths/~1api~1plugin~1task~1marketplace'
  /api/plugin/task/marketplace/sources:
    $ref: './paths/admin.yaml#/paths/~1api~1plugin~1task~1marketplace~1sources'
  /api/plugin/task/marketplace/sources/{id}/check:
    $ref: './paths/admin.yaml#/paths/~1api~1plugin~1task~1marketplace~1sources~1{id}~1check'
  /api/plugin/task/marketplace/install:
    $ref: './paths/admin.yaml#/paths/~1api~1plugin~1task~1marketplace~1install'
  /api/plugin/task/{key}:
    $ref: './paths/admin.yaml#/paths/~1api~1plugin~1task~1{key}'
  /api/plugin/task/{key}/versions:
    $ref: './paths/admin.yaml#/paths/~1api~1plugin~1task~1{key}~1versions'
  /api/plugin/task/{key}/source:
    $ref: './paths/admin.yaml#/paths/~1api~1plugin~1task~1{key}~1source'
  /api/plugin/task/{key}/activate:
    $ref: './paths/admin.yaml#/paths/~1api~1plugin~1task~1{key}~1activate'
  /api/plugin/task/{key}/status:
    $ref: './paths/admin.yaml#/paths/~1api~1plugin~1task~1{key}~1status'
  /api/plugin/task/{key}/dryrun:
    $ref: './paths/admin.yaml#/paths/~1api~1plugin~1task~1{key}~1dryrun'
  /api/plugin/task/{key}/versions/{version}:
    $ref: './paths/admin.yaml#/paths/~1api~1plugin~1task~1{key}~1versions~1{version}'
  /api/wallet/summary:
    $ref: './paths/user.yaml#/paths/~1api~1wallet~1summary'

  # 在线充值（M5 Task 3；用户端点 + 公网回调）。
  /api/topup/config:
    $ref: './paths/user.yaml#/paths/~1api~1topup~1config'
  /api/orders:
    $ref: './paths/user.yaml#/paths/~1api~1orders'
  /api/orders/{id}:
    $ref: './paths/user.yaml#/paths/~1api~1orders~1{id}'
  /api/orders/{id}/cancel:
    $ref: './paths/user.yaml#/paths/~1api~1orders~1{id}~1cancel'
  /api/orders/{id}/verify:
    $ref: './paths/user.yaml#/paths/~1api~1orders~1{id}~1verify'
  /api/orders/{id}/complete:
    $ref: './paths/user.yaml#/paths/~1api~1orders~1{id}~1complete'
  /api/webhooks/stripe:
    $ref: './paths/public.yaml#/paths/~1api~1webhooks~1stripe'
  /api/webhooks/alipay:
    $ref: './paths/public.yaml#/paths/~1api~1webhooks~1alipay'

  # 既有占位（渠道在模块 06 实现；中继只登记公共面）。
  /api/channels:
    $ref: './paths/admin.yaml#/paths/~1api~1channels'
  /v1/chat/completions:
    $ref: './paths/relay.yaml#/paths/~1v1~1chat~1completions'
  # Playground 会话中继（relay-01 §1.5）。入口必须显式引用：bundle 只内联
  # openapi.yaml 可达的节点，片段文件里的孤儿 path 不会进入生成物。
  /pg/chat/completions:
    $ref: './paths/relay.yaml#/paths/~1pg~1chat~1completions'
  /pg/models:
    $ref: './paths/relay.yaml#/paths/~1pg~1models'

  # 用量日志 / 统计 / 审计只读端点（M6 Task 2 / modules-05）。
  /api/logs/by-key:
    $ref: './paths/user.yaml#/paths/~1api~1logs~1by-key'
  /api/usage-logs:
    $ref: './paths/user.yaml#/paths/~1api~1usage-logs'
  /api/usage-logs/{id}:
    $ref: './paths/user.yaml#/paths/~1api~1usage-logs~1{id}'
  /api/usage-logs/{id}/prompt:
    $ref: './paths/user.yaml#/paths/~1api~1usage-logs~1{id}~1prompt'
  /api/usage-stats/summary:
    $ref: './paths/user.yaml#/paths/~1api~1usage-stats~1summary'
  /api/usage-stats/by-model:
    $ref: './paths/user.yaml#/paths/~1api~1usage-stats~1by-model'
  /api/usage-stats/timeseries:
    $ref: './paths/user.yaml#/paths/~1api~1usage-stats~1timeseries'
  /api/usage-stats/rates:
    $ref: './paths/user.yaml#/paths/~1api~1usage-stats~1rates'
  /api/audit-logs:
    $ref: './paths/user.yaml#/paths/~1api~1audit-logs'

  # 任务数据面（M6d Task 6a / relay-06 §10.2/§10.4）。
  /v1/tasks/{key}:
    $ref: './paths/relay.yaml#/paths/~1v1~1tasks~1{key}'
  /v1/tasks/{key}/artifacts:
    $ref: './paths/relay.yaml#/paths/~1v1~1tasks~1{key}~1artifacts'
  /v1/tasks/{key}/artifacts/{artifact_key}/content:
    $ref: './paths/relay.yaml#/paths/~1v1~1tasks~1{key}~1artifacts~1{artifact_key}~1content'
  /api/task/self:
    $ref: './paths/user.yaml#/paths/~1api~1task~1self'
  /api/task:
    $ref: './paths/admin.yaml#/paths/~1api~1task'

components:
  securitySchemes:
    sessionCookie:
      $ref: './components/security.yaml#/securitySchemes/sessionCookie'
    bearerToken:
      $ref: './components/security.yaml#/securitySchemes/bearerToken'

  parameters:
    Page:
      $ref: './components/pagination.yaml#/parameters/Page'
    PageSize:
      $ref: './components/pagination.yaml#/parameters/PageSize'
    IdempotencyKey:
      $ref: './components/params.yaml#/parameters/IdempotencyKey'
    CSRFToken:
      $ref: './components/params.yaml#/parameters/CSRFToken'
    PathUserID:
      $ref: './components/params.yaml#/parameters/PathUserID'
    PathTokenID:
      $ref: './components/params.yaml#/parameters/PathTokenID'
    PathSessionID:
      $ref: './components/params.yaml#/parameters/PathSessionID'
    PathGroupName:
      $ref: './components/params.yaml#/parameters/PathGroupName'
    PathPricingModel:
      $ref: './components/params.yaml#/parameters/PathPricingModel'
    PathGroupTag:
      $ref: './components/params.yaml#/parameters/PathGroupTag'
    UpdatedAtQuery:
      $ref: './components/params.yaml#/parameters/UpdatedAtQuery'

  schemas:
    Problem:
      $ref: './components/problem.yaml#/schemas/Problem'
    Problem402:
      $ref: './components/problem.yaml#/schemas/Problem402'
    Page:
      $ref: './components/pagination.yaml#/schemas/Page'
    PublicStatus:
      $ref: './schemas/public.yaml#/schemas/PublicStatus'
    GeoIPResponse:
      $ref: './schemas/public.yaml#/schemas/GeoIPResponse'
    Token:
      $ref: './schemas/user.yaml#/schemas/Token'
    Channel:
      $ref: './schemas/admin.yaml#/schemas/Channel'

  responses:
    Error400:
      $ref: './components/responses.yaml#/responses/Error400'
    Error401:
      $ref: './components/responses.yaml#/responses/Error401'
    Error402:
      $ref: './components/responses.yaml#/responses/Error402'
    Error403:
      $ref: './components/responses.yaml#/responses/Error403'
    Error404:
      $ref: './components/responses.yaml#/responses/Error404'
    Error409:
      $ref: './components/responses.yaml#/responses/Error409'
    Error422:
      $ref: './components/responses.yaml#/responses/Error422'
    Error429:
      $ref: './components/responses.yaml#/responses/Error429'
    Error500:
      $ref: './components/responses.yaml#/responses/Error500'
    Error502:
      $ref: './components/responses.yaml#/responses/Error502'
    Error503:
      $ref: './components/responses.yaml#/responses/Error503'
