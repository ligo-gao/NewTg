  # 写操作要求 X-Confirm-Action: true（缺失 422 confirm_required）。
  /api/performance/stats:
    $ref: './paths/admin.yaml#/paths/~1api~1performance~1stats'
  /api/performance/disk-cache:
    $ref: './paths/admin.yaml#/paths/~1api~1performance~1disk-cache'
