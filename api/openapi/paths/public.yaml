# 公开域路径（无需认证）
paths:
  /api/status:
    get:
      tags: [public]
      operationId: getPublicStatus
      summary: 公共站点状态
      description: |
        登录/注册页的引导数据：注册与口令登录开关、邮箱验证要求、Turnstile
        site key、登录加密开关与 canonical 7 语清单。响应 Cache-Control:
        no-store——开关变更必须立即生效。
      security: []
      responses:
        '200':
          description: OK
          headers:
            Cache-Control:
              description: no-store（站点开关变更必须即时可见）
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '../schemas/public.yaml#/schemas/PublicStatus'
        '429':
          $ref: '../components/responses.yaml#/responses/Error429'
        '500':
          $ref: '../components/responses.yaml#/responses/Error500'
        '503':
          description: |
            初始化状态存储不可用（IsInitialized 查询失败）。实现禁止猜测
            system_initialized（猜 false 会把已初始化站点导回安装向导，猜 true
            会把新站锁死在登录页），因此 fail-closed 返回 503。
          headers:
            Retry-After:
              description: 建议重试等待秒数（实现冻结为 5）
              schema:
                type: integer
                minimum: 0
          content:
            application/problem+json:
              schema:
                $ref: '../components/problem.yaml#/schemas/Problem'

  /api/geoip:
    get:
      tags: [public]
      operationId: getClientGeo
      # 前端需要按地区展示/风控的响应类型（platform-03 §9.5），显式标记纳入 codegen。
      x-codegen: true
      summary: 客户端粗粒度地理区域（只读；不返回坐标与 IP）
      description: |
        客户端 IP 只从连接或经 TRUSTED_PROXIES 校验的代理头取得；响应仅 country/region/source。
        本地 GeoIP 库缺失或损坏时仍返回 200 且 source=unknown（不返回 5xx）。
      security: []
      responses:
        '200':
          description: OK
          headers:
            Cache-Control:
              description: private, max-age=300（按客户端缓存）
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '../schemas/public.yaml#/schemas/GeoIPResponse'
        '429':
          $ref: '../components/responses.yaml#/responses/Error429'

  /api/auth/login/encryption-key:
    get:
      tags: [public]
      operationId: getLoginEncryptionKey
      summary: 登录口令加密公钥（关闭时 {enabled:false}）
      description: |
        前端缓存 5 分钟（DisableCache 语义是响应头禁止中间层缓存，不是禁止
        客户端短缓存）。开启时返回 {kid, public_key}；关闭时固定
        {enabled:false}。取公钥失败返回 503，绝不回落到明文登录。
      security: []
      responses:
        '200':
          description: OK
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '../schemas/public.yaml#/schemas/LoginEncryptionKeyResponse'
        '503':
          $ref: '../components/responses.yaml#/responses/Error503'

  /api/auth/email-code:
    post:
      tags: [public]
      operationId: requestEmailCode
      summary: 发送 6 位一次性邮箱验证码
      description: |
        TTL 10 分钟、一次性。同邮箱 1 次/60 秒、同 IP 10 次/小时；超限 429
        + Retry-After。成功恒 204，响应不回显验证码。purpose=verify|bind
        要求有效会话（本端点不经过 SessionAuth，实现内显式校验），缺失 401。
        SMTP 未配置时返回 503 `email_unavailable`（fail-closed：不生成验证码，
        不会出现「204 但用户永远收不到」）。SMTP 发送失败返回 502
        `email_send_failed`（验证码同时作废，避免留下收不到的有效码）。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/public.yaml#/schemas/EmailCodeRequest'
      responses:
        '204':
          description: 验证码已生成并投递（SMTP 未配置时返回 503 而非本响应）
        '400':
          $ref: '../components/responses.yaml#/responses/Error400'
        '401':
          $ref: '../components/responses.yaml#/responses/Error401'
        '429':
          $ref: '../components/responses.yaml#/responses/Error429'
        '502':
          $ref: '../components/responses.yaml#/responses/Error502'
        '503':
          $ref: '../components/responses.yaml#/responses/Error503'

  /api/auth/register:
    post:
      tags: [public]
      operationId: register
      summary: 注册并自动登录
      description: |
        成功 201 + 会话 Cookie。重复 username/email 统一 409（文案不区分字段
        级差异，防账号枚举）。注册关闭 403；邮箱域名白名单外 422。成功后可
        按配置发放注册赠送流水。
      # 注册入口不挂 CSRF/Origin：此时还没有会话可保护（security-01 §2.2）。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/public.yaml#/schemas/RegisterRequest'
      responses:
        '201':
          description: 注册成功并已建立会话
          content:
            application/json:
              schema:
                $ref: '../schemas/public.yaml#/schemas/AuthSessionResponse'
        '400':
          $ref: '../components/responses.yaml#/responses/Error400'
        '403':
          $ref: '../components/responses.yaml#/responses/Error403'
        '409':
          $ref: '../components/responses.yaml#/responses/Error409'
        '422':
          $ref: '../components/responses.yaml#/responses/Error422'
        '429':
          $ref: '../components/responses.yaml#/responses/Error429'
        '500':
          $ref: '../components/responses.yaml#/responses/Error500'
        '503':
          $ref: '../components/responses.yaml#/responses/Error503'

  /api/auth/login:
    post:
      tags: [public]
      operationId: login
      summary: 口令登录（可选前端加密与 2FA 挑战）
      description: |
        口令通过后：未启用 2FA（且非未绑定管理员）直接建立会话
        （200 AuthSessionResponse）；已启用返回 200 Pending2FAResponse
        （pending_2fa，ticket 5 分钟），需再调用 POST /api/auth/2fa/challenge；
        未绑定 TOTP 的管理员（auth.mfa.admin_required=true）返回
        mfa_enrollment_required（ticket 10 分钟），只能用于
        POST /api/auth/2fa/enroll/*。连续 5 次失败锁定 15 分钟（双桶
        Redis 计数）；封禁账号 401。所有失败（含解密失败）响应一致，防 oracle。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/public.yaml#/schemas/LoginRequest'
      responses:
        '200':
          description: 已建立会话，或返回 pending_2fa ticket
          content:
            application/json:
              schema:
                $ref: '../schemas/public.yaml#/schemas/LoginResponse'
        '400':
          $ref: '../components/responses.yaml#/responses/Error400'
        '401':
          $ref: '../components/responses.yaml#/responses/Error401'
        '403':
          $ref: '../components/responses.yaml#/responses/Error403'
        '429':
          $ref: '../components/responses.yaml#/responses/Error429'
        '500':
          $ref: '../components/responses.yaml#/responses/Error500'
        '503':
          $ref: '../components/responses.yaml#/responses/Error503'

  /api/auth/2fa/challenge:
    post:
      tags: [public]
      operationId: submitTwoFAChallenge
      summary: 用一次性 ticket + TOTP/备用码换取正式会话
      description: |
        只信任 ticket（Redis pending_2fa:{ticket} → user_id），不接受客户端
        声明的用户身份。TOTP 连续 5 次错误作废 ticket；备用码原子核销（同一
        码并发提交只有一次成功）。成功 200 + 会话 Cookie。
      # 该端点的凭据是 ticket 而非会话，因此不要求 SessionAuth。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/public.yaml#/schemas/TwoFAChallengeRequest'
      responses:
        '200':
          description: 挑战通过并已建立会话
          content:
            application/json:
              schema:
                $ref: '../schemas/public.yaml#/schemas/AuthSessionResponse'
        '400':
          description: |
            两种语义由 problem type 区分：
            · type = `https://newtg.dev/problems/two_factor_ticket_invalid`：
              ticket 格式非法、已过期或已被消费——必须重新走登录拿新 ticket，
              重试本端点不会成功。
            · 其它 `bad_request`（不含该 type）：ticket 有效但 TOTP/备用码错误，
              或请求体校验失败；码错误时 ticket 仍可继续使用（TOTP 连续 5 次
              错误才作废，备用码核销即失效）。
          content:
            application/problem+json:
              schema:
                $ref: '../components/problem.yaml#/schemas/Problem'
        '401':
          $ref: '../components/responses.yaml#/responses/Error401'
        '429':
          description: |
            连续第 5 次 TOTP/备用码错误：ticket 已被作废（必须重新登录获取
            新 ticket，不能在本页重试）；账号已处于锁定窗口时也会直接返回
            429。Retry-After 指示建议重试秒数。
          headers:
            Retry-After:
              description: 建议重试等待秒数（第 5 次失败场景实现冻结为 5）
              schema:
                type: integer
                minimum: 0
          content:
            application/problem+json:
              schema:
                $ref: '../components/problem.yaml#/schemas/Problem'
        '503':
          $ref: '../components/responses.yaml#/responses/Error503'

  # R-04 管理员强制 MFA 绑定。三条端点都以 login 返回的 enroll ticket 为唯一
  # 凭据（不要求会话 Cookie、不读 CSRF），ticket 在 confirm 阶段一次性消费。
  /api/auth/2fa/enroll/setup:
    post:
      tags: [public]
      operationId: setupMFAEnrollment
      summary: 生成 TOTP 种子与 otpauth URI（强制绑定引导第一步）
      description: |
        不写任何状态，可反复调用刷新二维码。ticket 缺失/过期/已消费 → 400
        two_factor_ticket_invalid；非管理员票据 403；已绑定 409；无口令账号
        403；按 IP 限流 429。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/public.yaml#/schemas/MFAEnrollTicketRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '../schemas/user.yaml#/schemas/TwoFASetupResponse'
        '400':
          $ref: '../components/responses.yaml#/responses/Error400'
        '403':
          $ref: '../components/responses.yaml#/responses/Error403'
        '409':
          $ref: '../components/responses.yaml#/responses/Error409'
        '429':
          $ref: '../components/responses.yaml#/responses/Error429'
        '503':
          $ref: '../components/responses.yaml#/responses/Error503'

  /api/auth/2fa/enroll/enable:
    post:
      tags: [public]
      operationId: enableMFAEnrollment
      summary: 校验 TOTP 并生成备用码（尚不启用）
      description: |
        验证通过后把密文种子与备用码哈希暂存 10 分钟，返回一次性备用码明文；
        此时 totp_enabled 仍为 false，必须再调用 confirm。验证码错误计入
        IP+用户名失败桶与 ticket 失败次数（第 5 次作废票据）。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/public.yaml#/schemas/MFAEnrollEnableRequest'
      responses:
        '200':
          description: 验证码通过，备用码只在此响应出现
          content:
            application/json:
              schema:
                $ref: '../schemas/public.yaml#/schemas/MFAEnrollBackupCodesResponse'
        '400':
          $ref: '../components/responses.yaml#/responses/Error400'
        '403':
          $ref: '../components/responses.yaml#/responses/Error403'
        '409':
          $ref: '../components/responses.yaml#/responses/Error409'
        '429':
          $ref: '../components/responses.yaml#/responses/Error429'
        '503':
          $ref: '../components/responses.yaml#/responses/Error503'

  /api/auth/2fa/enroll/confirm:
    post:
      tags: [public]
      operationId: confirmMFAEnrollment
      summary: 确认已保存备用码、启用 TOTP 并签发会话
      description: |
        backup_codes_confirmed 必须为 true，否则 400 且 totp_enabled 不变。
        成功后原子写入 totp_enabled=true、消费 ticket、下发会话与 CSRF Cookie；
        并发确认只有一次成功（其余 409/400）。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/public.yaml#/schemas/MFAEnrollConfirmRequest'
      responses:
        '200':
          description: 已启用 2FA 并建立会话
          content:
            application/json:
              schema:
                $ref: '../schemas/public.yaml#/schemas/AuthSessionResponse'
        '400':
          $ref: '../components/responses.yaml#/responses/Error400'
        '403':
          $ref: '../components/responses.yaml#/responses/Error403'
        '409':
          $ref: '../components/responses.yaml#/responses/Error409'
        '429':
          $ref: '../components/responses.yaml#/responses/Error429'
        '503':
          $ref: '../components/responses.yaml#/responses/Error503'

  /api/auth/password-reset/request:
    post:
      tags: [public]
      operationId: requestPasswordReset
      summary: 请求口令重置邮件（统一成功态）
      description: |
        SMTP 已配置时：邮箱存在与否响应完全一致（均 204，防枚举）；存在时投递
        256-bit token（30 分钟）。同邮箱 60 秒冷却、同 IP 5 次/分钟，超限 429。
        SMTP 未配置时：无论邮箱是否存在都返回 503 `email_unavailable`
        （fail-closed，同样不泄露账号存在性，不会出现「204 但邮件永远收不到」）。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/public.yaml#/schemas/PasswordResetRequest'
      responses:
        '204':
          description: 已受理（不透露邮箱是否注册；SMTP 未配置时返回 503 而非本响应）
        '400':
          $ref: '../components/responses.yaml#/responses/Error400'
        '429':
          $ref: '../components/responses.yaml#/responses/Error429'
        '503':
          $ref: '../components/responses.yaml#/responses/Error503'

  /api/auth/password-reset/validate:
    post:
      tags: [public]
      operationId: validatePasswordResetToken
      summary: 校验重置链接（不消费 token）
      description: 有效返回 200 {"valid":true}；无效/过期一律 400 invalid_reset_token。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/public.yaml#/schemas/PasswordResetValidateRequest'
      responses:
        '200':
          description: token 有效
          content:
            application/json:
              schema:
                $ref: '../schemas/public.yaml#/schemas/PasswordResetValidateResponse'
        '400':
          $ref: '../components/responses.yaml#/responses/Error400'
        '503':
          $ref: '../components/responses.yaml#/responses/Error503'

  /api/auth/password-reset/confirm:
    post:
      tags: [public]
      operationId: confirmPasswordReset
      summary: 消费重置 token 并设置新口令
      description: |
        原子消费 token → 改密 → 吊销该用户全部会话，成功 204。token 复用/
        过期 400；并发提交同一 token 只有一个成功。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/public.yaml#/schemas/PasswordResetConfirmRequest'
      responses:
        '204':
          description: 口令已重置，全部旧会话已失效
        '400':
          $ref: '../components/responses.yaml#/responses/Error400'
        '429':
          $ref: '../components/responses.yaml#/responses/Error429'
        '500':
          $ref: '../components/responses.yaml#/responses/Error500'
        '503':
          $ref: '../components/responses.yaml#/responses/Error503'

  /api/logout:
    post:
      tags: [public]
      operationId: logout
      summary: 登出当前会话
      description: |
        public-safe：无会话或重复登出也恒 204。不挂 CSRF 校验（登出不构成
        状态提升，且清 Cookie 必须在会话已失效后仍可用）。Redis 故障时 503。
      security: []
      responses:
        '204':
          description: 已登出（幂等）
        '503':
          $ref: '../components/responses.yaml#/responses/Error503'

  /api/setup:
    post:
      tags: [public]
      operationId: completeSetup
      summary: 首次安装向导（建管理员 + 写初始化锚）
      description: |
        仅未初始化时可调用：三步字段建 admin 并写 system.install.completed_at
        （同事务），成功 201 + 自动登录会话。幂等锚是 system_settings 该键：
        重复/并发提交返回 409 + initialized=true，前端据此导流到登录页。
        已初始化后调用同样 409；用户名/邮箱冲突 409。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/public.yaml#/schemas/SetupRequest'
      responses:
        '201':
          description: 初始化完成并已建立管理员会话
          content:
            application/json:
              schema:
                $ref: '../schemas/public.yaml#/schemas/SetupResponse'
        '400':
          $ref: '../components/responses.yaml#/responses/Error400'
        '409':
          description: 已初始化（initialized=true）或用户名/邮箱冲突
          content:
            application/problem+json:
              schema:
                $ref: '../schemas/public.yaml#/schemas/SetupCompletedProblem'
        '500':
          $ref: '../components/responses.yaml#/responses/Error500'
        '503':
          $ref: '../components/responses.yaml#/responses/Error503'

  # M5 Stripe 回调（modules-04 F-04-04；P-7/P-15）。
  /api/webhooks/stripe:
    post:
      tags: [public]
      operationId: stripeWebhook
      summary: Stripe 异步通知
      description: |
        验签使用**原始请求体**：`Stripe-Signature` 的 `t=...,v1=...` 为
        HMAC-SHA256(`t + "." + body`)，时间戳偏差 > 300s 拒绝。仅处理
        `payment_intent.succeeded`；金额/币种与订单不一致 → 订单 failed +
        告警且不入账。重复投递幂等（provider_txn_id 唯一 + 条件 UPDATE）。
        每端点独立 60 次/分钟限流（429）。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Stripe Event 原文（验签前不反序列化）
      responses:
        '200':
          description: 已处理或按状态机忽略
        '400':
          description: 验签或载荷非法（不改订单、不入账）
          content:
            application/problem+json:
              schema:
                $ref: '../components/problem.yaml#/schemas/Problem'
        '429':
          description: 超过 60 次/分钟
          content:
            application/problem+json:
              schema:
                $ref: '../components/problem.yaml#/schemas/Problem'
        '503':
          description: 限流器不可用（fail closed）
          content:
            application/problem+json:
              schema:
                $ref: '../components/problem.yaml#/schemas/Problem'

  # M5 支付宝异步通知（modules-04 F-04-06；P-7/P-15）。
  /api/webhooks/alipay:
    post:
      tags: [public]
      operationId: alipayNotify
      summary: 支付宝异步通知
      description: |
        表单编码回调；RSA2（SHA256withRSA）验签。仅 `TRADE_SUCCESS` 入账，
        其余状态回 `success` 并忽略。`total_amount`（元）换算为分后与订单
        比对，不一致 → 订单 failed + 告警并回 `failure`。重复通知幂等。
        每端点独立 60 次/分钟限流（429）。
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties:
                type: string
      responses:
        '200':
          description: 处理完成（纯文本 `success`）
          content:
            text/plain:
              schema:
                type: string
                enum: [success, failure]
        '400':
          description: 验签失败或金额不符（纯文本 `failure`，不入账）
          content:
            text/plain:
              schema:
                type: string
                enum: [success, failure]
        '429':
          description: 超过 60 次/分钟
        '500':
          description: 内部错误（纯文本 `failure`，渠道会重投）
        '503':
          description: 限流器不可用（fail closed）

  # 微信易支付（Epay）异步通知（modules-04 F-04-21；C1）。
  /api/webhooks/epay:
    get:
      tags: [public]
      operationId: epayNotifyGet
      summary: 易支付异步通知（query 编码）
      description: |
        与 POST 同一条验签/入账路径；部分易支付网关用 GET query 回调。
        签名 = md5(参数按键名升序 `a=b&...` + key)（key 前无分隔符）（小写，空值不参与，
        `sign`/`sign_type` 不参与），以常量时间比较。仅 `trade_status=TRADE_SUCCESS`
        入账；金额（元字符串）小数位 >2 或与订单不符 → 400 + `fail` 且不入账。
        重复通知幂等。每端点独立 60 次/分钟限流（429）。
      security: []
      parameters:
        - name: pid
          in: query
          required: false
          schema: {type: string}
        - name: out_trade_no
          in: query
          required: false
          schema: {type: string}
        - name: money
          in: query
          required: false
          schema: {type: string}
        - name: trade_status
          in: query
          required: false
          schema: {type: string}
        - name: sign
          in: query
          required: false
          schema: {type: string}
        - name: sign_type
          in: query
          required: false
          schema: {type: string}
      responses:
        '200':
          description: 处理完成（纯文本 `success`）
          content:
            text/plain:
              schema:
                type: string
                enum: [success, fail]
        '400':
          description: 验签/载荷/金额不符或订单不存在（纯文本 `fail`，不入账）
          content:
            text/plain:
              schema:
                type: string
                enum: [success, fail]
        '429':
          description: 超过 60 次/分钟
        '500':
          description: 内部错误（纯文本 `fail`，渠道会重投）
        '503':
          description: 渠道未启用/配置不完整或限流器不可用（纯文本 `fail`）
    post:
      tags: [public]
      operationId: epayNotify
      summary: 易支付异步通知（表单编码）
      description: |
        表单编码回调；验签、状态、金额与幂等语义与 GET 变体完全相同。
        返回纯文本 `success` / `fail`。
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties:
                type: string
      responses:
        '200':
          description: 处理完成（纯文本 `success`）
          content:
            text/plain:
              schema:
                type: string
                enum: [success, fail]
        '400':
          description: 验签/载荷/金额不符或订单不存在（纯文本 `fail`，不入账）
          content:
            text/plain:
              schema:
                type: string
                enum: [success, fail]
        '429':
          description: 超过 60 次/分钟
        '500':
          description: 内部错误（纯文本 `fail`，渠道会重投）
        '503':
          description: 渠道未启用/配置不完整或限流器不可用（纯文本 `fail`）

  /api/home/stats:
    get:
      tags: [public]
      operationId: getHomeStats
      summary: 首页统计数据条（公开，5 分钟服务端缓存）
      description: |
        4 个计数指标：upstreams=COUNT(DISTINCT channels.type) WHERE status=1；
        models=与 `/api/pricing` 同一可见集合的计数；endpoints=冻结协议端点目录
        （openai chat/completions、anthropic messages、gemini generateContent）
        大小 3；routing_dims=冻结调度维度清单（priority/weight/group/
        model-allowlist/affinity/retry）大小 6。0 如实返回（前端在 0 时隐藏区块）。
        数据库故障返回 500 problem，绝不返回 200 空对象。Cache-Control:
        public, max-age=300。B8 公开只读限流（60 次/分钟/IP+path，fail-open）。
      security: []
      responses:
        '200':
          description: OK
          headers:
            Cache-Control:
              description: public, max-age=300（服务端缓存窗口同值）
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '../schemas/public.yaml#/schemas/HomeStats'
        '429':
          $ref: '../components/responses.yaml#/responses/Error429'
        '500':
          $ref: '../components/responses.yaml#/responses/Error500'

  # 公告公开详情（D7b；modules-08 F-08-04 用户侧公开只读视图）。
  # 匿名可读；不可见状态统一 404，不泄露存在性。
  /api/announcements/public/{id}:
    get:
      tags: [public]
      operationId: getPublicAnnouncement
      summary: 生效中公告的公开详情
      description: |
        仅 `status='published'` 且 `publish_at<=now` 且（`expire_at` 为 null
        或 `expire_at>now`）的公告返回 200。draft/offline/未来生效/已过期/
        已删除/畸形 id 一律返回同一个 404 `problem+json`，公开面不得成为
        「某 id 是否存在」的探测信道。匿名只读：不写审计、不写已读。
        B8 限流 60 次/分钟/IP+path；响应 `Cache-Control: public, max-age=60`。
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
          description: 公告 id（UUID）。
      responses:
        '200':
          description: OK
          headers:
            Cache-Control:
              description: public, max-age=60
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: '../schemas/public.yaml#/schemas/PublicAnnouncement'
        '404':
          description: 公告不可见或不存在（响应完全相同）
          content:
            application/problem+json:
              schema:
                $ref: '../components/problem.yaml#/schemas/Problem'
        '429':
          $ref: '../components/responses.yaml#/responses/Error429'
        '500':
          $ref: '../components/responses.yaml#/responses/Error500'

  /api/pricing:
    get:
      tags: [public]
      operationId: getPublicPricing
      summary: 公开定价目录（offset 分页；宽容参数）
      description: |
        只读 `model_pricing` / `group_pricing` / `user_groups`，并挂载
        `model_meta` / `vendors` 的展示元数据（同一快照）。可见集合为
        `model_pricing.status=1 AND billing_expr IS NULL`；命中的
        `model_meta.status=2` 档案使该模型从 items/facets 剔除（详情 404）。
        金额一律 int64 的 JSON 字符串；NULL 价列下发 null（不伪造兜底价）。
        非法参数逐项降级并返回 200（不存在的 facet 值丢弃、非法分页回退默认、
        `p` 越界回退最后一页）；空集是 200 + `items:[]`。facet 计数忽略本组
        自身筛选；capability/context/endpointType 的未知值丢弃。无档案模型的
        元数据字段按空数组/null 降级，`display_name` 回退 `model_id`、`vendor`
        按 `vendors.name` → `model_pricing.vendor` → `model_id` 前缀三级回退。
        `group_price` 仅在登录或显式 `group` 时出现；匿名且
        `billing.expose_group_ratios=false` 时分组 facet 的 ratio 为 null。响应带
        `ETag: "pricing-v<hash>"`，命中 `If-None-Match` 返回 304 无 body；版本
        hash 覆盖 model_pricing/group_pricing/user_groups/model_meta/vendors。
        缓存 `public, max-age=30, stale-while-revalidate=30`（带会话的个性化
        响应降级为 private）。
      security: []
      parameters:
        - name: p
          in: query
          schema: {type: integer, minimum: 1}
          description: 页码（1 基）；非法或越界回退首屏/最后一页。
        - name: page_size
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 24}
          description: 每页条数；默认 24，上限 100（超出按 100 截断）。
        - name: search
          in: query
          schema: {type: string, maxLength: 128}
          description: model_id 大小写不敏感子串；超长截断。
        - name: sort
          in: query
          schema:
            type: string
            enum: [name, price_asc, price_desc]
            default: name
          description: |
            价格按输入价；同模式内 per_token 在 per_request 前，tie-breaker 为
            model_id。非法值回退 name。
        - name: vendor
          in: query
          style: form
          explode: true
          schema:
            type: array
            items: {type: string}
          description: 供应商多选（重复键或逗号分隔；大小写不敏感）；不存在的值丢弃。
        - name: capability
          in: query
          style: form
          explode: true
          schema:
            type: array
            items: {type: string}
          description: |
            能力多选（D1-21；重复键或逗号分隔，也接受 `capability[]`）；取
            `model_meta.capabilities`，无档案的模型不命中；未知值丢弃。
        - name: context
          in: query
          style: form
          explode: true
          schema:
            type: array
            items: {type: string}
          description: |
            上下文分档多选（也接受 `context[]`）：`8k`（≤8,192）、`32k`
            （8,193–32,768）、`128k`（32,769–131,072）、`200k+`（>131,072）；
            大小写不敏感，未知值丢弃。context_length 为 null 的模型不命中。
        - name: endpointType
          in: query
          style: form
          explode: true
          schema:
            type: array
            items: {type: string}
          description: |
            端点类型多选（D1-21；也接受 `endpointType[]` / `endpoint_type`）。
            取值来自档案 endpoints 的映射：chat.completions、messages、
            embeddings、images.generations、audio.speech、audio.transcriptions、
            rerank、generateContent；未知路径不产生取值，未知筛选值丢弃。
        - name: group
          in: query
          schema: {type: string}
          description: 分组预览；不存在则忽略。
        - name: quotaType
          in: query
          schema:
            type: string
            enum: [all, token, request]
            default: all
          description: 计费类型；非法值回退 all。
        - name: include_group_price
          in: query
          schema:
            type: string
            enum: ['0', '1']
            default: '1'
          description: 是否返回分组实付价（仍受会话/expose 规则约束）。
      responses:
        '200':
          description: OK（空集也是 200 + items:[]）
          headers:
            ETag:
              description: '"pricing-v<hash>"；hash 由 model_pricing/group_pricing/user_groups/model_meta/vendors 五张表的 max(updated_at)+count+max(id) 派生'
              schema: {type: string}
            Cache-Control:
              description: public, max-age=30, stale-while-revalidate=30（个性化响应 private）
              schema: {type: string}
            Vary:
              description: Accept-Encoding；个性化响应额外含 Cookie
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: '../schemas/public.yaml#/schemas/PublicPricingList'
        '304':
          description: If-None-Match 命中（无 body）
          headers:
            ETag:
              schema: {type: string}
        '429':
          $ref: '../components/responses.yaml#/responses/Error429'
        '500':
          $ref: '../components/responses.yaml#/responses/Error500'

  /api/pricing/metrics:
    get:
      tags: [public]
      operationId: getPublicMetricsList
      summary: 公开模型批量性能指标（模型库列表页）
      description: |
        一次返回目录内多个模型在窗口内的真实调用汇总（`usage_logs`）。可见
        集合与 `/api/pricing` 相同（含 `model_meta.status=2` 档案剔除）。
        只返回窗口内有真实调用样本（`sample_size > 0`）或存在主动测速记录的
        可见模型：无数据的模型不出现在 `items` 中，空集是 200 + `items:[]`。
        `summary` 恒填；只有测速、没有调用样本的模型 `sample_size: 0`，其余
        统计列为 null（前端显示「—」，不得回退成 0）。
        日志库未装配或读取失败时只降级 `summary`（按零样本下发），端点仍为
        200：`latest_test` 在主库，不能因一次日志库故障连带隐藏全部测速读数。
        `latest_test` 是最近一次管理员主动测速（主库 `model_performance_tests`）
        的 P50/P95、TPS 与成功率；没有记录、测速库未装配或读取失败时为 null
        （fail-open，端点仍为 200，usage 汇总照常返回）。前端**优先**使用
        `latest_test` 的 P50/P95 作为延迟展示来源；仅当没有主动测试记录时
        才回退到真实调用均值（标注「Average」，此时 p95 为 null）。
        响应带 ETag（模型集合 + 窗口 + 分钟桶 + 每条测速身份派生）与
        `Cache-Control: public, max-age=60`；命中 `If-None-Match` 返回 304。
      security: []
      parameters:
        - name: range
          in: query
          required: false
          schema:
            type: string
            enum: [24h, 7d]
            default: 24h
          description: 统计窗口；缺省 24h。
      responses:
        '200':
          description: OK（空集也是 200 + items:[]）
          headers:
            ETag:
              description: 模型集合 + 窗口 + 分钟桶 + 测速身份派生；60 秒陈旧容忍。
              schema: {type: string}
            Cache-Control:
              description: public, max-age=60
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: '../schemas/public.yaml#/schemas/PublicModelMetricsList'
        '304':
          description: If-None-Match 命中（无 body）
        '400':
          $ref: '../components/responses.yaml#/responses/Error400'
        '429':
          $ref: '../components/responses.yaml#/responses/Error429'
        '500':
          $ref: '../components/responses.yaml#/responses/Error500'

  /api/pricing/{model_id}:
    get:
      tags: [public]
      operationId: getPublicPricingDetail
      summary: 公开模型详情（URL 编码的 `/`）
      description: |
        `model_id` 以 URL 编码承载（如 `openai%2Fgpt-5`）。不存在、停用、无定价
        或表达式计价的模型统一返回 404 `model-not-found`。未编码的多段路径
        （`/api/pricing/openai/gpt-5`）、尾斜杠与其它无法匹配的定价子路径由
        公开兜底返回同一个 404（不会落入受保护 `/api/` 子树得到 401）。
        缓存与 ETag 策略同 `/api/pricing`；详情 ETag 由域版本 + 模型名哈希派生。
      security: []
      parameters:
        - name: model_id
          in: path
          required: true
          schema: {type: string, maxLength: 512}
          description: URL 编码的模型名（可含 `/`）。
      responses:
        '200':
          description: OK
          headers:
            ETag:
              description: '"pricing-v<hash>-<modelHash>"'
              schema: {type: string}
            Cache-Control:
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: '../schemas/public.yaml#/schemas/PublicModelDetail'
        '304':
          description: If-None-Match 命中（无 body）
        '404':
          description: 模型不存在或不可公示（type=model-not-found）
          content:
            application/problem+json:
              schema:
                $ref: '../components/problem.yaml#/schemas/Problem'
        '429':
          $ref: '../components/responses.yaml#/responses/Error429'
        '500':
          $ref: '../components/responses.yaml#/responses/Error500'

  /api/pricing/{model_id}/metrics:
    get:
      tags: [public]
      operationId: getPublicPricingMetrics
      summary: 模型性能指标（真实调用平均值）
      description: |
        从日志库 `usage_logs` 聚合该模型在窗口内的真实调用数据（modules-09
        F-09-25）：`avg_latency_ms = AVG(latency_ms)`、`avg_ttft_ms =
        AVG(first_token_ms)`（仅流式调用有值）、`tps =
        SUM(completion_tokens) / (SUM(latency_ms)/1000)`（近似值）。
        无样本时对应字段为 null，前端显示「—」，不得回退成 0。
        样本少于 20 次由前端标注「样本不足」。
        日志库未装配或读取失败时只降级 `summary`（按零样本下发），端点仍为
        200：`latest_test` 在主库，不能因一次日志库故障连带隐藏测速读数。
        `latest_test` 是最近一次管理员主动测速（主库 `model_performance_tests`）
        的 P50/P95、TPS 与成功率；没有记录、测速库未装配或读取失败时为 null
        （fail-open，端点仍为 200）。前端**优先**使用 `latest_test` 的
        P50/P95 作为延迟展示来源；仅当没有主动测试记录时才回退到真实调用
        均值（标注「Average」，此时 p95 为 null）。
      security: []
      parameters:
        - name: model_id
          in: path
          required: true
          schema: {type: string, maxLength: 512}
        - name: range
          in: query
          required: false
          schema:
            type: string
            enum: [24h, 7d]
            default: 24h
          description: 统计窗口；缺省 24h。
      responses:
        '200':
          description: OK
          headers:
            ETag:
              description: 模型 + 窗口 + 分钟桶派生；60 秒陈旧容忍。
              schema: {type: string}
            Cache-Control:
              description: public, max-age=60
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: '../schemas/public.yaml#/schemas/PublicModelMetrics'
        '304':
          description: If-None-Match 命中（无 body）
        '400':
          $ref: '../components/responses.yaml#/responses/Error400'
        '404':
          description: 模型不存在或不可公示（type=model-not-found）
          content:
            application/problem+json:
              schema:
                $ref: '../components/problem.yaml#/schemas/Problem'
        '429':
          $ref: '../components/responses.yaml#/responses/Error429'
        '500':
          $ref: '../components/responses.yaml#/responses/Error500'

  /api/rankings:
    get:
      tags: [public]
      operationId: getPublicRankings
      summary: 公开排行榜快照（周期 today/week/month/year）
      description: |
        只读 worker 预聚合的 `rankings_*` 快照（modules-09 F-09-29～F-09-33 /
        §C1.7），不在请求时聚合 `usage_logs`。口径：仅 `usage_logs.status=success`
        的 `prompt_tokens + completion_tokens`，窗口内 `requests < N` 的模型不
        进入任何榜单（N=`site.rankings_min_samples`，隐私地板 50）。
        响应字段按白名单构造，**不含** user_id/token_id/channel_id/upstream
        名称/cost 等内部维度。`display_name` 缺失回退 `model`，`author` 缺失
        回退 `Unknown`；`delta_pct` 在上一窗口 token 为 0 时为 null，
        `prev_rank` 在上一窗口样本不足时为 null（`delta_tokens` 的 D6a 口径见
        schema 说明）。`providers[].series` 仅作者榜 Top 5 下发，是该周期的
        token 桶数组，与 `trend.buckets` 一一对齐（B5a）。
        Redis 缓存 `rankings:public:<period>`（TTL=刷新间隔）；快照表不可用
        返回 503，快照从未生成返回 200 + `status=empty`（冷启动）。
        B8 公开只读限流 60 次/分钟/IP+path（fail-open）。
      security: []
      parameters:
        - name: period
          in: query
          required: false
          schema:
            $ref: '../schemas/public.yaml#/schemas/RankingsPeriod'
            default: week
          description: 统计周期（缺省 week）；非法值 400。
      responses:
        '200':
          description: OK
          headers:
            ETag:
              description: '有快照时 `"{period}:{computed_at_epoch}"`；冷启动（无快照）不下发 ETag'
              schema: {type: string}
            Cache-Control:
              description: public, max-age=30, stale-while-revalidate=30
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: '../schemas/public.yaml#/schemas/RankingsResponse'
        '304':
          description: If-None-Match 命中（无 body）
        '400':
          $ref: '../components/responses.yaml#/responses/Error400'
        '429':
          $ref: '../components/responses.yaml#/responses/Error429'
        '503':
          description: 快照表不可用（依赖故障）
          headers:
            Retry-After:
              description: 建议重试等待秒数（实现冻结为 5）
              schema: {type: integer, minimum: 0}
          content:
            application/problem+json:
              schema:
                $ref: '../components/problem.yaml#/schemas/Problem'

  /api/home/live-feed:
    get:
      tags: [public]
      operationId: getHomeLiveFeed
      summary: 首页实时调用动态（轮询降级，最近 N 条脱敏事件）
      description: |
        读取 Redis list `newtg:feed:calls` 的最近 limit 条事件（LPUSH，新在上）。
        事件字段是白名单脱敏投影：不含账号、邮箱、IP、令牌、渠道 ID/名称、
        base_url、prompt/response、request_id 原文（id 为 8 位十六进制短哈希）。
        `site.home_blocks.live_feed=false` 时返回 404。响应 `Cache-Control:
        no-store`。B8 公开只读限流 60 次/分钟/IP+path（fail-open）。

        响应顶层 `window` 是聚合条：**近 60 秒**（按当前分钟桶汇总，0–60s
        近似），calls 计所有事件，cost_credits 只计成功事件的整数积分。
        逐行事件按裁决 A-1 不含任何费用字段。Redis 聚合桶读取失败时
        `window` 降级为 `{calls:0,cost_credits:0}` 且事件照常返回；list
        本身不可用时仍按下方 503 口径处理。
      security: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: 返回条数（缺省 20；非整数或 <1 返回 400；>100 截到 100）。
      responses:
        '200':
          description: OK
          headers:
            Cache-Control:
              description: no-store
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: '../schemas/public.yaml#/schemas/LiveFeedList'
        '400':
          $ref: '../components/responses.yaml#/responses/Error400'
        '404':
          description: live_feed 区块已关闭（`site.home_blocks.live_feed=false`）
          content:
            application/problem+json:
              schema:
                $ref: '../components/problem.yaml#/schemas/Problem'
        '429':
          $ref: '../components/responses.yaml#/responses/Error429'
        '503':
          description: Redis 不可用（事件源故障）
          headers:
            Retry-After:
              description: 建议重试等待秒数（实现冻结为 5）
              schema: {type: integer, minimum: 0}
          content:
            application/problem+json:
              schema:
                $ref: '../components/problem.yaml#/schemas/Problem'

  /api/home/live-feed/stream:
    get:
      tags: [public]
      operationId: getHomeLiveFeedStream
      summary: 首页实时调用动态（SSE）
      description: |
        `Content-Type: text/event-stream`；事件类型 `call`，`data:` 为单条
        LiveFeedEvent JSON；每 15s 发送 `: heartbeat` 注释保活。单 IP 并发
        连接上限 5（modules-08 F-08-16 冻结值 / security-07 B9）：超限返回
        429，客户端应降级为 `/api/home/live-feed` 轮询。租约存于 Redis ZSET，
        随心跳续期，进程崩溃后最多 60s 自动回收。`site.home_blocks.live_feed
        =false` 时返回 404。

        实现先完成租约占用与 Redis `SUBSCRIBE` 确认（ack）后才写 `200`
        响应头：任一步失败都返回 `503`（带 `Retry-After`），而不是先建立
        一条永远收不到事件的空流。所有连接共享进程级订阅，连接只做本地
        注册/注销，不单独订阅 Redis。
      security: []
      responses:
        '200':
          description: SSE 流
          headers:
            Cache-Control:
              description: no-store
              schema: {type: string}
            X-Accel-Buffering:
              description: no（禁用代理层缓冲）
              schema: {type: string}
          content:
            text/event-stream:
              schema:
                type: string
                description: '`event: call` + `data: <LiveFeedEvent JSON>`；保活为 `: heartbeat`。'
        '404':
          description: live_feed 区块已关闭
          content:
            application/problem+json:
              schema:
                $ref: '../components/problem.yaml#/schemas/Problem'
        '429':
          description: 单 IP 并发连接超过 5
          headers:
            Retry-After:
              description: 建议重试等待秒数（实现冻结为 5）
              schema: {type: integer, minimum: 0}
          content:
            application/problem+json:
              schema:
                $ref: '../components/problem.yaml#/schemas/Problem'
        '503':
          description: |
            Redis 不可用，或租约占用/`SUBSCRIBE` 确认失败；此时尚未写出
            200 响应头，客户端应按 `Retry-After` 重试或降级为轮询。
          headers:
            Retry-After:
              description: 建议重试等待秒数（实现冻结为 5）
              schema: {type: integer, minimum: 0}
          content:
            application/problem+json:
              schema:
                $ref: '../components/problem.yaml#/schemas/Problem'
