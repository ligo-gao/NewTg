# 公开域路径（无需认证）
paths:
  /api/status:
    get:
      tags: [public]
      operationId: getPublicStatus
      summary: 公共站点状态
      security: []
      responses:
        '200':
          description: OK（字段随 M1+ 细化）
          content:
            application/json:
              schema:
                $ref: '../schemas/public.yaml#/schemas/PublicStatus'
        '429':
          $ref: '../components/responses.yaml#/responses/Error429'
        '500':
          $ref: '../components/responses.yaml#/responses/Error500'

  /api/geoip:
    get:
      tags: [public]
      operationId: getClientGeo
      # 前端需要按地区展示/风控的响应类型（platform-03 §9.5），显式标记纳入 codegen。
      x-codegen: true
      summary: 客户端粗粒度地理区域（只读；不返回坐标与 IP）
      description: |
        客户端 IP 只从连接或经 TRUSTED_PROXIES 校验的代理头取得；响应仅 country/region/source。
        本地 GeoIP 库缺失或损坏时仍返回 200 且 source=unknown（不返回 5xx）。
      security: []
      responses:
        '200':
          description: OK
          headers:
            Cache-Control:
              description: private, max-age=300（按客户端缓存）
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '../schemas/public.yaml#/schemas/GeoIPResponse'
        '429':
          $ref: '../components/responses.yaml#/responses/Error429'
