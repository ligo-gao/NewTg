# 公开域路径（无需认证）
paths:
  /api/status:
    get:
      tags: [public]
      operationId: getPublicStatus
      summary: 公共站点状态
      description: |
        登录/注册页的引导数据：注册与口令登录开关、邮箱验证要求、Turnstile
        site key、登录加密开关与 canonical 7 语清单。响应 Cache-Control:
        no-store——开关变更必须立即生效。
      security: []
      responses:
        '200':
          description: OK
          headers:
            Cache-Control:
              description: no-store（站点开关变更必须即时可见）
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '../schemas/public.yaml#/schemas/PublicStatus'
        '429':
          $ref: '../components/responses.yaml#/responses/Error429'
        '500':
          $ref: '../components/responses.yaml#/responses/Error500'
        '503':
          description: |
            初始化状态存储不可用（IsInitialized 查询失败）。实现禁止猜测
            system_initialized（猜 false 会把已初始化站点导回安装向导，猜 true
            会把新站锁死在登录页），因此 fail-closed 返回 503。
          headers:
            Retry-After:
              description: 建议重试等待秒数（实现冻结为 5）
              schema:
                type: integer
                minimum: 0
          content:
            application/problem+json:
              schema:
                $ref: '../components/problem.yaml#/schemas/Problem'

  /api/geoip:
    get:
      tags: [public]
      operationId: getClientGeo
      # 前端需要按地区展示/风控的响应类型（platform-03 §9.5），显式标记纳入 codegen。
      x-codegen: true
      summary: 客户端粗粒度地理区域（只读；不返回坐标与 IP）
      description: |
        客户端 IP 只从连接或经 TRUSTED_PROXIES 校验的代理头取得；响应仅 country/region/source。
        本地 GeoIP 库缺失或损坏时仍返回 200 且 source=unknown（不返回 5xx）。
      security: []
      responses:
        '200':
          description: OK
          headers:
            Cache-Control:
              description: private, max-age=300（按客户端缓存）
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '../schemas/public.yaml#/schemas/GeoIPResponse'
        '429':
          $ref: '../components/responses.yaml#/responses/Error429'

  /api/auth/login/encryption-key:
    get:
      tags: [public]
      operationId: getLoginEncryptionKey
      summary: 登录口令加密公钥（关闭时 {enabled:false}）
      description: |
        前端缓存 5 分钟（DisableCache 语义是响应头禁止中间层缓存，不是禁止
        客户端短缓存）。开启时返回 {kid, public_key}；关闭时固定
        {enabled:false}。取公钥失败返回 503，绝不回落到明文登录。
      security: []
      responses:
        '200':
          description: OK
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '../schemas/public.yaml#/schemas/LoginEncryptionKeyResponse'
        '503':
          $ref: '../components/responses.yaml#/responses/Error503'

  /api/auth/email-code:
    post:
      tags: [public]
      operationId: requestEmailCode
      summary: 发送 6 位一次性邮箱验证码
      description: |
        TTL 10 分钟、一次性。同邮箱 1 次/60 秒、同 IP 10 次/小时；超限 429
        + Retry-After。成功恒 204，响应不回显验证码。purpose=verify|bind
        要求有效会话（本端点不经过 SessionAuth，实现内显式校验），缺失 401。
        SMTP 发送失败返回 502（验证码同时作废，避免留下收不到的有效码）。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/public.yaml#/schemas/EmailCodeRequest'
      responses:
        '204':
          description: 已受理（验证码已生成；配置 SMTP 时已投递）
        '400':
          $ref: '../components/responses.yaml#/responses/Error400'
        '401':
          $ref: '../components/responses.yaml#/responses/Error401'
        '429':
          $ref: '../components/responses.yaml#/responses/Error429'
        '502':
          $ref: '../components/responses.yaml#/responses/Error502'
        '503':
          $ref: '../components/responses.yaml#/responses/Error503'

  /api/auth/register:
    post:
      tags: [public]
      operationId: register
      summary: 注册并自动登录
      description: |
        成功 201 + 会话 Cookie。重复 username/email 统一 409（文案不区分字段
        级差异，防账号枚举）。注册关闭 403；邮箱域名白名单外 422。成功后可
        按配置发放注册赠送流水。
      # 注册入口不挂 CSRF/Origin：此时还没有会话可保护（security-01 §2.2）。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/public.yaml#/schemas/RegisterRequest'
      responses:
        '201':
          description: 注册成功并已建立会话
          content:
            application/json:
              schema:
                $ref: '../schemas/public.yaml#/schemas/AuthSessionResponse'
        '400':
          $ref: '../components/responses.yaml#/responses/Error400'
        '403':
          $ref: '../components/responses.yaml#/responses/Error403'
        '409':
          $ref: '../components/responses.yaml#/responses/Error409'
        '422':
          $ref: '../components/responses.yaml#/responses/Error422'
        '429':
          $ref: '../components/responses.yaml#/responses/Error429'
        '500':
          $ref: '../components/responses.yaml#/responses/Error500'
        '503':
          $ref: '../components/responses.yaml#/responses/Error503'

  /api/auth/login:
    post:
      tags: [public]
      operationId: login
      summary: 口令登录（可选前端加密与 2FA 挑战）
      description: |
        口令通过后：未启用 2FA 直接建立会话（200 AuthSessionResponse）；
        已启用返回 200 Pending2FAResponse（ticket 5 分钟），需再调用
        POST /api/auth/2fa/challenge。连续 5 次失败锁定 15 分钟（双桶
        Redis 计数）；封禁账号 401。所有失败（含解密失败）响应一致，防 oracle。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/public.yaml#/schemas/LoginRequest'
      responses:
        '200':
          description: 已建立会话，或返回 pending_2fa ticket
          content:
            application/json:
              schema:
                $ref: '../schemas/public.yaml#/schemas/LoginResponse'
        '400':
          $ref: '../components/responses.yaml#/responses/Error400'
        '401':
          $ref: '../components/responses.yaml#/responses/Error401'
        '403':
          $ref: '../components/responses.yaml#/responses/Error403'
        '429':
          $ref: '../components/responses.yaml#/responses/Error429'
        '500':
          $ref: '../components/responses.yaml#/responses/Error500'
        '503':
          $ref: '../components/responses.yaml#/responses/Error503'

  /api/auth/2fa/challenge:
    post:
      tags: [public]
      operationId: submitTwoFAChallenge
      summary: 用一次性 ticket + TOTP/备用码换取正式会话
      description: |
        只信任 ticket（Redis pending_2fa:{ticket} → user_id），不接受客户端
        声明的用户身份。TOTP 连续 5 次错误作废 ticket；备用码原子核销（同一
        码并发提交只有一次成功）。成功 200 + 会话 Cookie。
      # 该端点的凭据是 ticket 而非会话，因此不要求 SessionAuth。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/public.yaml#/schemas/TwoFAChallengeRequest'
      responses:
        '200':
          description: 挑战通过并已建立会话
          content:
            application/json:
              schema:
                $ref: '../schemas/public.yaml#/schemas/AuthSessionResponse'
        '400':
          description: |
            两种语义由 problem type 区分：
            · type = `https://newtg.dev/problems/two_factor_ticket_invalid`：
              ticket 格式非法、已过期或已被消费——必须重新走登录拿新 ticket，
              重试本端点不会成功。
            · 其它 `bad_request`（不含该 type）：ticket 有效但 TOTP/备用码错误，
              或请求体校验失败；码错误时 ticket 仍可继续使用（TOTP 连续 5 次
              错误才作废，备用码核销即失效）。
          content:
            application/problem+json:
              schema:
                $ref: '../components/problem.yaml#/schemas/Problem'
        '401':
          $ref: '../components/responses.yaml#/responses/Error401'
        '429':
          description: |
            连续第 5 次 TOTP/备用码错误：ticket 已被作废（必须重新登录获取
            新 ticket，不能在本页重试）；账号已处于锁定窗口时也会直接返回
            429。Retry-After 指示建议重试秒数。
          headers:
            Retry-After:
              description: 建议重试等待秒数（第 5 次失败场景实现冻结为 5）
              schema:
                type: integer
                minimum: 0
          content:
            application/problem+json:
              schema:
                $ref: '../components/problem.yaml#/schemas/Problem'
        '503':
          $ref: '../components/responses.yaml#/responses/Error503'

  /api/auth/password-reset/request:
    post:
      tags: [public]
      operationId: requestPasswordReset
      summary: 请求口令重置邮件（统一成功态）
      description: |
        邮箱存在与否响应完全一致（恒 204，防枚举）；存在时投递 256-bit
        token（30 分钟）。同邮箱 60 秒冷却、同 IP 5 次/分钟，超限 429。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/public.yaml#/schemas/PasswordResetRequest'
      responses:
        '204':
          description: 已受理（不透露邮箱是否注册）
        '400':
          $ref: '../components/responses.yaml#/responses/Error400'
        '429':
          $ref: '../components/responses.yaml#/responses/Error429'
        '503':
          $ref: '../components/responses.yaml#/responses/Error503'

  /api/auth/password-reset/validate:
    post:
      tags: [public]
      operationId: validatePasswordResetToken
      summary: 校验重置链接（不消费 token）
      description: 有效返回 200 {"valid":true}；无效/过期一律 400 invalid_reset_token。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/public.yaml#/schemas/PasswordResetValidateRequest'
      responses:
        '200':
          description: token 有效
          content:
            application/json:
              schema:
                $ref: '../schemas/public.yaml#/schemas/PasswordResetValidateResponse'
        '400':
          $ref: '../components/responses.yaml#/responses/Error400'
        '503':
          $ref: '../components/responses.yaml#/responses/Error503'

  /api/auth/password-reset/confirm:
    post:
      tags: [public]
      operationId: confirmPasswordReset
      summary: 消费重置 token 并设置新口令
      description: |
        原子消费 token → 改密 → 吊销该用户全部会话，成功 204。token 复用/
        过期 400；并发提交同一 token 只有一个成功。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/public.yaml#/schemas/PasswordResetConfirmRequest'
      responses:
        '204':
          description: 口令已重置，全部旧会话已失效
        '400':
          $ref: '../components/responses.yaml#/responses/Error400'
        '429':
          $ref: '../components/responses.yaml#/responses/Error429'
        '500':
          $ref: '../components/responses.yaml#/responses/Error500'
        '503':
          $ref: '../components/responses.yaml#/responses/Error503'

  /api/logout:
    post:
      tags: [public]
      operationId: logout
      summary: 登出当前会话
      description: |
        public-safe：无会话或重复登出也恒 204。不挂 CSRF 校验（登出不构成
        状态提升，且清 Cookie 必须在会话已失效后仍可用）。Redis 故障时 503。
      security: []
      responses:
        '204':
          description: 已登出（幂等）
        '503':
          $ref: '../components/responses.yaml#/responses/Error503'

  /api/setup:
    post:
      tags: [public]
      operationId: completeSetup
      summary: 首次安装向导（建管理员 + 写初始化锚）
      description: |
        仅未初始化时可调用：三步字段建 admin 并写 system.install.completed_at
        （同事务），成功 201 + 自动登录会话。幂等锚是 system_settings 该键：
        重复/并发提交返回 409 + initialized=true，前端据此导流到登录页。
        已初始化后调用同样 409；用户名/邮箱冲突 409。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/public.yaml#/schemas/SetupRequest'
      responses:
        '201':
          description: 初始化完成并已建立管理员会话
          content:
            application/json:
              schema:
                $ref: '../schemas/public.yaml#/schemas/SetupResponse'
        '400':
          $ref: '../components/responses.yaml#/responses/Error400'
        '409':
          description: 已初始化（initialized=true）或用户名/邮箱冲突
          content:
            application/problem+json:
              schema:
                $ref: '../schemas/public.yaml#/schemas/SetupCompletedProblem'
        '500':
          $ref: '../components/responses.yaml#/responses/Error500'
        '503':
          $ref: '../components/responses.yaml#/responses/Error503'

  # M5 Stripe 回调（modules-04 F-04-04；P-7/P-15）。
  /api/webhooks/stripe:
    post:
      tags: [public]
      operationId: stripeWebhook
      summary: Stripe 异步通知
      description: |
        验签使用**原始请求体**：`Stripe-Signature` 的 `t=...,v1=...` 为
        HMAC-SHA256(`t + "." + body`)，时间戳偏差 > 300s 拒绝。仅处理
        `payment_intent.succeeded`；金额/币种与订单不一致 → 订单 failed +
        告警且不入账。重复投递幂等（provider_txn_id 唯一 + 条件 UPDATE）。
        每端点独立 60 次/分钟限流（429）。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Stripe Event 原文（验签前不反序列化）
      responses:
        '200':
          description: 已处理或按状态机忽略
        '400':
          description: 验签或载荷非法（不改订单、不入账）
          content:
            application/problem+json:
              schema:
                $ref: '../components/problem.yaml#/schemas/Problem'
        '429':
          description: 超过 60 次/分钟
          content:
            application/problem+json:
              schema:
                $ref: '../components/problem.yaml#/schemas/Problem'
        '503':
          description: 限流器不可用（fail closed）
          content:
            application/problem+json:
              schema:
                $ref: '../components/problem.yaml#/schemas/Problem'

  # M5 支付宝异步通知（modules-04 F-04-06；P-7/P-15）。
  /api/webhooks/alipay:
    post:
      tags: [public]
      operationId: alipayNotify
      summary: 支付宝异步通知
      description: |
        表单编码回调；RSA2（SHA256withRSA）验签。仅 `TRADE_SUCCESS` 入账，
        其余状态回 `success` 并忽略。`total_amount`（元）换算为分后与订单
        比对，不一致 → 订单 failed + 告警并回 `failure`。重复通知幂等。
        每端点独立 60 次/分钟限流（429）。
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties:
                type: string
      responses:
        '200':
          description: 处理完成（纯文本 `success`）
          content:
            text/plain:
              schema:
                type: string
                enum: [success, failure]
        '400':
          description: 验签失败或金额不符（纯文本 `failure`，不入账）
          content:
            text/plain:
              schema:
                type: string
                enum: [success, failure]
        '429':
          description: 超过 60 次/分钟
        '500':
          description: 内部错误（纯文本 `failure`，渠道会重投）
        '503':
          description: 限流器不可用（fail closed）

  /api/home/stats:
    get:
      tags: [public]
      operationId: getHomeStats
      summary: 首页统计数据条（公开，5 分钟服务端缓存）
      description: |
        4 个计数指标：upstreams=COUNT(DISTINCT channels.type) WHERE status=1；
        models=与 `/api/pricing` 同一可见集合的计数；endpoints=冻结协议端点目录
        （openai chat/completions、anthropic messages、gemini generateContent）
        大小 3；routing_dims=冻结调度维度清单（priority/weight/group/
        model-allowlist/affinity/retry）大小 6。0 如实返回（前端在 0 时隐藏区块）。
        数据库故障返回 500 problem，绝不返回 200 空对象。Cache-Control:
        public, max-age=300。B8 公开只读限流（60 次/分钟/IP+path，fail-open）。
      security: []
      responses:
        '200':
          description: OK
          headers:
            Cache-Control:
              description: public, max-age=300（服务端缓存窗口同值）
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '../schemas/public.yaml#/schemas/HomeStats'
        '429':
          $ref: '../components/responses.yaml#/responses/Error429'
        '500':
          $ref: '../components/responses.yaml#/responses/Error500'

  /api/pricing:
    get:
      tags: [public]
      operationId: getPublicPricing
      summary: 公开定价目录（offset 分页；宽容参数）
      description: |
        只读 `model_pricing` / `group_pricing` / `user_groups`，可见集合为
        `model_pricing.status=1 AND billing_expr IS NULL`。金额一律 int64 的 JSON
        字符串；NULL 价列下发 null（不伪造兜底价）。非法参数逐项降级并返回 200
        （不存在的 facet 值丢弃、非法分页回退默认、`p` 越界回退最后一页）；空集
        是 200 + `items:[]`。facet 计数忽略本组自身筛选。`group_price` 仅在登录
        或显式 `group` 时出现；匿名且 `billing.expose_group_ratios=false` 时分组
        facet 的 ratio 为 null。响应带 `ETag: "pricing-v<hash>"`，命中
        `If-None-Match` 返回 304 无 body；缓存 `public, max-age=30,
        stale-while-revalidate=30`（带会话的个性化响应降级为 private）。
      security: []
      parameters:
        - name: p
          in: query
          schema: {type: integer, minimum: 1}
          description: 页码（1 基）；非法或越界回退首屏/最后一页。
        - name: page_size
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 24}
          description: 每页条数；默认 24，上限 100（超出按 100 截断）。
        - name: search
          in: query
          schema: {type: string, maxLength: 128}
          description: model_id 大小写不敏感子串；超长截断。
        - name: sort
          in: query
          schema:
            type: string
            enum: [name, price_asc, price_desc]
            default: name
          description: |
            价格按输入价；同模式内 per_token 在 per_request 前，tie-breaker 为
            model_id。非法值回退 name。
        - name: vendor
          in: query
          style: form
          explode: true
          schema:
            type: array
            items: {type: string}
          description: 供应商前缀多选（重复键或逗号分隔）；不存在的值丢弃。
        - name: group
          in: query
          schema: {type: string}
          description: 分组预览；不存在则忽略。
        - name: quotaType
          in: query
          schema:
            type: string
            enum: [all, token, request]
            default: all
          description: 计费类型；非法值回退 all。
        - name: include_group_price
          in: query
          schema:
            type: string
            enum: ['0', '1']
            default: '1'
          description: 是否返回分组实付价（仍受会话/expose 规则约束）。
      responses:
        '200':
          description: OK（空集也是 200 + items:[]）
          headers:
            ETag:
              description: '"pricing-v<hash>"；hash 由三张表的 max(updated_at)+count+max(id) 派生'
              schema: {type: string}
            Cache-Control:
              description: public, max-age=30, stale-while-revalidate=30（个性化响应 private）
              schema: {type: string}
            Vary:
              description: Accept-Encoding；个性化响应额外含 Cookie
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: '../schemas/public.yaml#/schemas/PublicPricingList'
        '304':
          description: If-None-Match 命中（无 body）
          headers:
            ETag:
              schema: {type: string}
        '429':
          $ref: '../components/responses.yaml#/responses/Error429'
        '500':
          $ref: '../components/responses.yaml#/responses/Error500'

  /api/pricing/{model_id}:
    get:
      tags: [public]
      operationId: getPublicPricingDetail
      summary: 公开模型详情（URL 编码的 `/`）
      description: |
        `model_id` 以 URL 编码承载（如 `openai%2Fgpt-5`）。不存在、停用、无定价
        或表达式计价的模型统一返回 404 `model-not-found`。缓存与 ETag 策略同
        `/api/pricing`；详情 ETag 由域版本 + 模型名哈希派生。
      security: []
      parameters:
        - name: model_id
          in: path
          required: true
          schema: {type: string, maxLength: 512}
          description: URL 编码的模型名（可含 `/`）。
      responses:
        '200':
          description: OK
          headers:
            ETag:
              description: '"pricing-v<hash>-<modelHash>"'
              schema: {type: string}
            Cache-Control:
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: '../schemas/public.yaml#/schemas/PublicModelDetail'
        '304':
          description: If-None-Match 命中（无 body）
        '404':
          description: 模型不存在或不可公示（type=model-not-found）
          content:
            application/problem+json:
              schema:
                $ref: '../components/problem.yaml#/schemas/Problem'
        '429':
          $ref: '../components/responses.yaml#/responses/Error429'
        '500':
          $ref: '../components/responses.yaml#/responses/Error500'

  /api/pricing/{model_id}/metrics:
    get:
      tags: [public]
      operationId: getPublicPricingMetrics
      summary: 模型性能指标（P1 占位，未实现）
      description: |
        本波（M6c）只注册 404：不返回伪造数据。type=not-implemented 以区别于
        「模型不存在」。
      security: []
      parameters:
        - name: model_id
          in: path
          required: true
          schema: {type: string, maxLength: 512}
      responses:
        '404':
          description: 未实现（type=not-implemented）
          content:
            application/problem+json:
              schema:
                $ref: '../components/problem.yaml#/schemas/Problem'
