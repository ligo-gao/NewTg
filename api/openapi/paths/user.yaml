      tags: [user]
      operationId: listAuditLogs
      summary: 审计日志列表
      description: |
        user 仅见本人事件且响应隐藏 username 列；admin+logs:read 可见全部
        并可用 username 精确过滤。默认时间范围 30 天。
      security:
        - sessionCookie: []
        - bearerToken: []
