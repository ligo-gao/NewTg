        - $ref: '../components/pagination.yaml#/parameters/PageSize'
        - name: category
          in: query
          schema:
            type: string
            enum: [login, security, operation, access_token]
        - name: result
          in: query
          schema:
            type: string
            enum: [success, failed]
        - name: range
          in: query
          schema:
            type: string
            enum: [24h, 7d, 14d, 30d]
            default: 30d
        - name: start
          in: query
          schema: { type: string, format: date-time }
        - name: end
          in: query
          schema: { type: string, format: date-time }
        - name: username
          in: query
          schema: { type: string }
          description: 仅 admin+logs:read
      responses:
        '200':
          description: 分页信封
          content:
            application/json:
              schema:
                $ref: '../schemas/user.yaml#/schemas/AuditLogPage'
        '401':
          $ref: '../components/responses.yaml#/responses/Error401'
        '403':
          $ref: '../components/responses.yaml#/responses/Error403'
        '422':
          $ref: '../components/responses.yaml#/responses/Error422'
        '500':
          $ref: '../components/responses.yaml#/responses/Error500'

  # ---------------------------------------------------------------------------
  # 任务台账（M6d Task 6a / relay-06 §10.4）。普通用户只能看到本人任务。
  # ---------------------------------------------------------------------------
  /api/task/self:
    get:
      tags: [user]
      operationId: listSelfTasks
      summary: 本人任务台账（分页）
      description: |
        按 created_at 倒序；`state` 可逗号分隔筛选 7 态之一或多值。
        台账不返回 data / private_data（设计 §7.1 Omit）。
      security:
        - sessionCookie: []
        - bearerToken: []
      parameters:
        - name: p
          in: query
          required: false
          schema: {type: integer, minimum: 1}
        - name: page_size
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 100}
        - name: state
          in: query
          required: false
          schema: {type: string}
      responses:
        '200':
          description: 任务分页
          content:
            application/json:
              schema: {$ref: '../schemas/user.yaml#/schemas/TaskListResponse'}
        '400': {$ref: '../components/responses.yaml#/responses/Error400'}
        '401': {$ref: '../components/responses.yaml#/responses/Error401'}
        '500': {$ref: '../components/responses.yaml#/responses/Error500'}

  # ---------------------------------------------------------------------------
  # 订阅套餐用户面（D5b；billing-08 §15.2/§15.4）。数据范围恒为当前会话用户。
  # ---------------------------------------------------------------------------
  /api/subscription/plans:
    get:
      tags: [user]
      operationId: listAvailableSubscriptionPlans
      summary: 可购套餐（仅 enabled，按 sort_order,id）
      description: |
        用户侧投影不含 allow_wallet_overflow（内部回退开关）。无可用套餐时
        items 为空数组。
      security:
        - sessionCookie: []
        - bearerToken: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '../schemas/user.yaml#/schemas/AvailableSubscriptionPlanList'
        '401':
          $ref: '../components/responses.yaml#/responses/Error401'
        '500':
          $ref: '../components/responses.yaml#/responses/Error500'

  /api/subscriptions:
    get:
      tags: [user]
      operationId: listMySubscriptions
      summary: 我的订阅实例（含已终结）
      description: |
        只返回当前用户实例。用户侧不返回 user_id/order_id/价格/内部回退开关；
        amount_total=0 表示无限额度，此时省略 amount_remain。
      security:
        - sessionCookie: []
        - bearerToken: []
      parameters:
        - $ref: '../components/pagination.yaml#/parameters/Page'
        - $ref: '../components/pagination.yaml#/parameters/PageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '../schemas/user.yaml#/schemas/UserSubscriptionList'
        '400':
          $ref: '../components/responses.yaml#/responses/Error400'
        '401':
          $ref: '../components/responses.yaml#/responses/Error401'
        '500':
          $ref: '../components/responses.yaml#/responses/Error500'

  /api/subscriptions/{id}/cancel:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
    post:
      tags: [user]
      operationId: cancelSubscriptionAtPeriodEnd
      summary: 周期末取消本人订阅（幂等）
      description: |
        置 `cancel_at_period_end=true`：实例保持 active 至 `end_at`，不立即作废
        额度、不退款（billing-08 §3.5 P1）。仅本人 active 实例可取消；他人实例
        与不存在统一 404（不泄露存在性）；expired/cancelled 终态 → 409。已置位
        的重复调用仍返回 200（条件 UPDATE 幂等）。

        请求无 body；携带任何字段返回 403 field_not_writable。响应为用户侧订阅
        投影，不含 user_id/order_id/价格。
      security:
        - sessionCookie: []
        - bearerToken: []
      parameters:
        - $ref: '../components/params.yaml#/parameters/CSRFToken'
      responses:
        '200':
          description: 更新后的订阅（cancel_at_period_end=true）
          content:
            application/json:
              schema:
                $ref: '../schemas/user.yaml#/schemas/UserSubscription'
        '401':
          $ref: '../components/responses.yaml#/responses/Error401'
        '403':
          $ref: '../components/responses.yaml#/responses/Error403'
        '404':
          $ref: '../components/responses.yaml#/responses/Error404'
        '409':
          $ref: '../components/responses.yaml#/responses/Error409'
        '429':
          $ref: '../components/responses.yaml#/responses/Error429'
        '500':
          $ref: '../components/responses.yaml#/responses/Error500'

  /api/billing-preference:
    get:
      tags: [user]
      operationId: getBillingPreference
      summary: 当前用户扣费偏好
      security:
        - sessionCookie: []
        - bearerToken: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '../schemas/user.yaml#/schemas/BillingPreference'
        '401':
          $ref: '../components/responses.yaml#/responses/Error401'
        '404':
          $ref: '../components/responses.yaml#/responses/Error404'
        '500':
          $ref: '../components/responses.yaml#/responses/Error500'
    put:
      tags: [user]
      operationId: updateBillingPreference
      summary: 设置扣费偏好（四值；未知/空归一 subscription_first）
      description: |
        preference 为字符串；四个冻结字面量之外的任何值（含空串）都归一为
        subscription_first，不返回 422。未知字段 403 field_not_writable。
      security:
        - sessionCookie: []
        - bearerToken: []
      parameters:
        - $ref: '../components/params.yaml#/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/user.yaml#/schemas/BillingPreferenceUpdateRequest'
      responses:
        '200':
          description: 归一后的偏好
          content:
            application/json:
              schema:
                $ref: '../schemas/user.yaml#/schemas/BillingPreference'
        '400':
          $ref: '../components/responses.yaml#/responses/Error400'
        '401':
          $ref: '../components/responses.yaml#/responses/Error401'
        '403':
          $ref: '../components/responses.yaml#/responses/Error403'
        '404':
          $ref: '../components/responses.yaml#/responses/Error404'
        '500':
          $ref: '../components/responses.yaml#/responses/Error500'

  /api/subscription/purchase:
    post:
      tags: [user]
      operationId: purchaseSubscription
      summary: 购买订阅（创建支付订单）
      description: |
        创建订阅购买订单（`orders.biz_kind='subscribe'`、`biz_ref_id=plan_id`），
        金额/币种/周期/额度一律由服务端按套餐行读取。provider ∈ {stripe, alipay}，
        支付载荷与充值下单同构（stripe 返回 client_secret，alipay 返回 qr_code）。

        `Idempotency-Key` 必带；同 key 重放返回首次订单（200，不回放支付凭据）。
        `price_amount=0` 的套餐在同一事务内直接创建 succeeded 订单与订阅实例，
        不调用渠道，响应无 client_secret/qr_code。

        失败口径：套餐不存在/停用或幂等键复用到另一订单 → 409；币种/金额/
        套餐字段非法（含套餐价低于渠道最低金额）→ 422；渠道未配置 → 503；
        渠道出站失败 → 502。任何失败都不会留下 succeeded 订单或 subscriptions 行。

        限流：按「用户 × 套餐」固定窗口 5 次/分钟（键
        `rl:subpurchase:<userID>:<planID>`），超限 429 + Retry-After；
        限流存储不可用时 fail-closed 503，不创建订单。
      security:
        - sessionCookie: []
        - bearerToken: []
      parameters:
        - $ref: '../components/params.yaml#/parameters/CSRFToken'
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/user.yaml#/schemas/SubscriptionPurchaseRequest'
      responses:
        '201':
          description: 订单已创建（首次购买）
          content:
            application/json:
              schema:
                $ref: '../schemas/user.yaml#/schemas/CreateOrderResponse'
        '200':
          description: 幂等重放（返回首次订单，不含支付凭据）
          content:
            application/json:
              schema:
                $ref: '../schemas/user.yaml#/schemas/CreateOrderResponse'
        '400':
          $ref: '../components/responses.yaml#/responses/Error400'
        '401':
          $ref: '../components/responses.yaml#/responses/Error401'
        '403':
          $ref: '../components/responses.yaml#/responses/Error403'
        '409':
          $ref: '../components/responses.yaml#/responses/Error409'
        '422':
          $ref: '../components/responses.yaml#/responses/Error422'
        '429':
          description: 购买请求超过限流（5 次/分钟/用户×套餐）
          headers:
            Retry-After:
              description: 当前限流窗口剩余秒数
              schema:
                type: integer
                minimum: 1
          content:
            application/problem+json:
              schema:
                $ref: '../components/problem.yaml#/schemas/Problem'
        '500':
          $ref: '../components/responses.yaml#/responses/Error500'
        '502':
          description: 渠道支付单创建失败
          content:
            application/problem+json:
              schema:
                $ref: '../components/problem.yaml#/schemas/Problem'
        '503':
          description: 支付渠道未配置、已停用或限流存储不可用
          content:
            application/problem+json:
              schema:
                $ref: '../components/problem.yaml#/schemas/Problem'

  # 站内通知 · 用户侧（A5；modules-08 §3.9.1 system.announcement）。
  # 数据范围恒为当前登录本人；不接受 user_id 参数。
  /api/notifications:
    get:
      tags: [user]
      operationId: listUserNotifications
      summary: 本人站内通知（含 read_at）
      description: |
        返回 channel=inapp 的投递记录，按 created_at DESC 排序；`read_at`
        为 null 表示未读。A5 之前站内通知不落库，因此旧数据不会出现。
      security:
        - sessionCookie: []
        - bearerToken: []
      parameters:
        - $ref: '../components/pagination.yaml#/parameters/Page'
        - $ref: '../components/pagination.yaml#/parameters/PageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '../schemas/user.yaml#/schemas/UserNotificationList'
        '400':
          $ref: '../components/responses.yaml#/responses/Error400'
        '401':
          $ref: '../components/responses.yaml#/responses/Error401'
        '403':
          $ref: '../components/responses.yaml#/responses/Error403'
        '500':
          $ref: '../components/responses.yaml#/responses/Error500'

  /api/notifications/{id}/read:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
    post:
      tags: [user]
      operationId: markUserNotificationRead
      summary: 标记本人站内通知已读（幂等）
      description: |
        重复调用返回 204，`read_at` 保持首次标记的时刻。他人通知、不存在
        与非法 id 统一 404（不区分，避免枚举）。
      security:
        - sessionCookie: []
        - bearerToken: []
      parameters:
        - $ref: '../components/params.yaml#/parameters/CSRFToken'
      responses:
        '204':
          description: 已标记（幂等）
        '401':
          $ref: '../components/responses.yaml#/responses/Error401'
        '403':
          $ref: '../components/responses.yaml#/responses/Error403'
        '404':
          $ref: '../components/responses.yaml#/responses/Error404'
        '500':
          $ref: '../components/responses.yaml#/responses/Error500'

  # 站点公告 · 用户侧（D7a；modules-08 F-08-04 / R-D7-05）。
  # 仅登录用户本人；数据范围恒为会话/令牌身份，不接受 user_id 参数。
  /api/announcements/active:
    get:
      tags: [user]
      operationId: listActiveAnnouncements
      summary: 生效中公告（含本人 read 标记）
      description: |
        返回 status=published 且 publish_at<=now 且未过期的公告，按
        publish_at DESC 排序。read 是当前用户的已读标记；未登录不可访问。
        正文同时返回 Markdown 原文与**净化后** HTML（`content_html`，
        原始 HTML 不解析、危险链接丢弃 href）。
      security:
        - sessionCookie: []
        - bearerToken: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '../schemas/user.yaml#/schemas/ActiveAnnouncementList'
        '401':
          $ref: '../components/responses.yaml#/responses/Error401'
        '403':
          $ref: '../components/responses.yaml#/responses/Error403'
        '500':
          $ref: '../components/responses.yaml#/responses/Error500'

  /api/announcements/{id}/read:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [user]
      operationId: markAnnouncementRead
      summary: 标记公告已读（幂等）
      description: |
        (user_id, announcement_id) 唯一，重复调用返回 204。只允许标记**生效中**
        的公告：草稿/下线/过期/不存在统一返回 404（不透露「存在但不可读」）。
      security:
        - sessionCookie: []
        - bearerToken: []
      parameters:
        - $ref: '../components/params.yaml#/parameters/CSRFToken'
      responses:
        '204':
          description: 已标记（幂等）
        '400':
          $ref: '../components/responses.yaml#/responses/Error400'
        '401':
          $ref: '../components/responses.yaml#/responses/Error401'
        '403':
          $ref: '../components/responses.yaml#/responses/Error403'
        '404':
          $ref: '../components/responses.yaml#/responses/Error404'
        '500':
          $ref: '../components/responses.yaml#/responses/Error500'
