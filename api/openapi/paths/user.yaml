# 用户自助域路径（会话 Cookie 或 API 令牌）。
# 会话 Cookie 路径上的非安全方法必须携带 X-CSRF-Token（Bearer 路径豁免）；
# 因此所有可能走 Cookie 的写操作都登记了 CSRFToken 参数。
paths:
  /api/me:
    get:
      tags: [user]
      operationId: getMe
      summary: 当前用户身份投影
      security:
        - sessionCookie: []
        - bearerToken: []
      responses:
        '200':
          description: OK（六字段冻结投影，零敏感字段）
          content:
            application/json:
              schema:
                $ref: '../schemas/user.yaml#/schemas/MeView'
        '401':
          $ref: '../components/responses.yaml#/responses/Error401'
        '404':
          $ref: '../components/responses.yaml#/responses/Error404'
        '500':
          $ref: '../components/responses.yaml#/responses/Error500'
    patch:
      tags: [user]
      operationId: patchMe
      summary: 修改显示名（仅 display_name）
      description: |
        仅 display_name 可写；提交未知字段返回 403 field_not_writable。
        null 或空白字符串清除显示名。
      security:
        - sessionCookie: []
        - bearerToken: []
      parameters:
        - $ref: '../components/params.yaml#/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/user.yaml#/schemas/PatchMeRequest'
      responses:
        '200':
          description: 更新后的用户投影
          content:
            application/json:
              schema:
                $ref: '../schemas/user.yaml#/schemas/MeView'
        '400':
          $ref: '../components/responses.yaml#/responses/Error400'
        '401':
          $ref: '../components/responses.yaml#/responses/Error401'
        '403':
          $ref: '../components/responses.yaml#/responses/Error403'
        '404':
          $ref: '../components/responses.yaml#/responses/Error404'
        '500':
          $ref: '../components/responses.yaml#/responses/Error500'

  /api/self:
    get:
      tags: [user]
      operationId: getSelfSettings
      summary: 语言 / 侧栏覆盖 / IP 记录开关
      security:
        - sessionCookie: []
        - bearerToken: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '../schemas/user.yaml#/schemas/SelfSettings'
        '401':
          $ref: '../components/responses.yaml#/responses/Error401'
        '404':
          $ref: '../components/responses.yaml#/responses/Error404'
        '500':
          $ref: '../components/responses.yaml#/responses/Error500'

  /api/self/setting:
    put:
      tags: [user]
      operationId: updateSelfSettings
      summary: 更新个人设置（乐观锁）
      description: |
        部分更新：未出现的键保持原值。必须原样回传 GET /api/self 的
        updated_at，不匹配返回 409。语言必须是 canonical 7 语之一，否则 400。
      security:
        - sessionCookie: []
        - bearerToken: []
      parameters:
        - $ref: '../components/params.yaml#/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/user.yaml#/schemas/UpdateSelfSettingsRequest'
      responses:
        '200':
          description: 更新后的设置（含新的 updated_at）
          content:
            application/json:
              schema:
                $ref: '../schemas/user.yaml#/schemas/SelfSettings'
        '400':
          $ref: '../components/responses.yaml#/responses/Error400'
        '401':
          $ref: '../components/responses.yaml#/responses/Error401'
        '403':
          $ref: '../components/responses.yaml#/responses/Error403'
        '404':
          $ref: '../components/responses.yaml#/responses/Error404'
        '409':
          $ref: '../components/responses.yaml#/responses/Error409'
        '422':
          description: |
            default_model 不属于该用户的可用分组（type=
            https://newtg.dev/problems/default_model_invalid，
            title=user.default_model_invalid）。不静默落空。
          content:
            application/problem+json:
              schema:
                $ref: '../components/problem.yaml#/schemas/Problem'
        '500':
          $ref: '../components/responses.yaml#/responses/Error500'

  /api/sessions:
    get:
      tags: [user]
      operationId: listSessions
      summary: 当前用户的活跃会话（≤50，非分页）
      description: |
        仅接受浏览器会话（API 令牌没有会话列表语义；令牌请求返回 403）。
        过期会话不列出，按 last_seen 倒序。
      security:
        - sessionCookie: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '../schemas/user.yaml#/schemas/SessionList'
        '401':
          $ref: '../components/responses.yaml#/responses/Error401'
        '403':
          $ref: '../components/responses.yaml#/responses/Error403'
        '503':
          $ref: '../components/responses.yaml#/responses/Error503'

  /api/sessions/{sid}:
    delete:
      tags: [user]
      operationId: revokeSession
      summary: 吊销指定会话（不能踢当前会话）
      description: |
        吊销他人/不存在会话统一 404（不泄露存在性）；吊销当前会话 400
        （当前会话必须走 POST /api/logout 以清 Cookie）。成功 204。
      security:
        - sessionCookie: []
      parameters:
        - $ref: '../components/params.yaml#/parameters/PathSessionID'
        - $ref: '../components/params.yaml#/parameters/CSRFToken'
      responses:
        '204':
          description: 已吊销
        '400':
          $ref: '../components/responses.yaml#/responses/Error400'
        '401':
          $ref: '../components/responses.yaml#/responses/Error401'
        '403':
          $ref: '../components/responses.yaml#/responses/Error403'
        '404':
          $ref: '../components/responses.yaml#/responses/Error404'
        '503':
          $ref: '../components/responses.yaml#/responses/Error503'

  /api/sessions/revoke-others:
    post:
      tags: [user]
      operationId: revokeOtherSessions
      summary: 吊销除当前外的全部会话
      description: 成功 204；当前会话及其 CSRF 令牌保持有效。
      security:
        - sessionCookie: []
      parameters:
        - $ref: '../components/params.yaml#/parameters/CSRFToken'
      responses:
        '204':
          description: 已吊销其他会话
        '401':
          $ref: '../components/responses.yaml#/responses/Error401'
        '403':
          $ref: '../components/responses.yaml#/responses/Error403'
        '503':
          $ref: '../components/responses.yaml#/responses/Error503'

  /api/verify-email:
    post:
      tags: [user]
      operationId: verifyEmail
      summary: 用邮箱验证码置 email_verified_at
      description: |
        幂等：已验证账号重复调用直接 200（保留首次验证时间，不再消费验证码）。
        无邮箱的账号 400；验证码错误/过期 400。
      security:
        - sessionCookie: []
        - bearerToken: []
      parameters:
        - $ref: '../components/params.yaml#/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/user.yaml#/schemas/VerifyEmailRequest'
      responses:
        '200':
          description: 邮箱已验证（幂等）
          content:
            application/json:
              schema:
                $ref: '../schemas/user.yaml#/schemas/VerifyEmailResponse'
        '400':
          $ref: '../components/responses.yaml#/responses/Error400'
        '401':
          $ref: '../components/responses.yaml#/responses/Error401'
        '403':
          $ref: '../components/responses.yaml#/responses/Error403'
        '404':
          $ref: '../components/responses.yaml#/responses/Error404'
        '500':
          $ref: '../components/responses.yaml#/responses/Error500'
        '503':
          $ref: '../components/responses.yaml#/responses/Error503'

  /api/password:
    post:
      tags: [user]
      operationId: changePassword
      summary: 修改口令（吊销其他会话）
      description: |
        校验当前口令后更新哈希、吊销除当前外全部会话、轮换当前会话的 CSRF
        令牌（Cookie 路径）。限流 5 次/10 分钟/IP+用户；新口令必须与旧口令
        不同并通过泄露筛查。成功 204。
      security:
        - sessionCookie: []
        - bearerToken: []
      parameters:
        - $ref: '../components/params.yaml#/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/user.yaml#/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: 口令已更新
        '400':
          $ref: '../components/responses.yaml#/responses/Error400'
        '401':
          $ref: '../components/responses.yaml#/responses/Error401'
        '403':
          $ref: '../components/responses.yaml#/responses/Error403'
        '429':
          $ref: '../components/responses.yaml#/responses/Error429'
        '500':
          $ref: '../components/responses.yaml#/responses/Error500'
        '503':
          $ref: '../components/responses.yaml#/responses/Error503'

  /api/account:
    delete:
      tags: [user]
      operationId: deleteAccount
      summary: 硬删除账号并匿名化 PII（无宽限）
      description: |
        全量再认证通过后：吊销全部会话 → PII 匿名化（历史记录改
        deleted_{id}）→ 硬删除 users/api_tokens 行 → 失效令牌缓存。成功 204。
        管理员账号必须先被降权（403）；再认证失败 403 reauth_required。
        账号行已不存在时 404（PRD 的「幂等」指重复删除不产生额外副作用）。
      security:
        - sessionCookie: []
        - bearerToken: []
      parameters:
        - $ref: '../components/params.yaml#/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/user.yaml#/schemas/DeleteAccountRequest'
      responses:
        '204':
          description: 账号已删除并匿名化
        '400':
          $ref: '../components/responses.yaml#/responses/Error400'
        '401':
          $ref: '../components/responses.yaml#/responses/Error401'
        '403':
          $ref: '../components/responses.yaml#/responses/Error403'
        '404':
          $ref: '../components/responses.yaml#/responses/Error404'
        '500':
          $ref: '../components/responses.yaml#/responses/Error500'
        '429':
          $ref: '../components/responses.yaml#/responses/Error429'
        '503':
          $ref: '../components/responses.yaml#/responses/Error503'

  /api/email:
    put:
      tags: [user]
      operationId: changeEmail
      summary: 换绑邮箱（全量再认证）
      description: |
        先再认证（当前口令 + 已启用 MFA 时的 TOTP），再消费新邮箱验证码
        （purpose=bind），最后落库。未过再认证 403 且不消费验证码。新邮箱
        被占用 409；域名白名单外 422。成功 200。
      security:
        - sessionCookie: []
        - bearerToken: []
      parameters:
        - $ref: '../components/params.yaml#/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/user.yaml#/schemas/ChangeEmailRequest'
      responses:
        '200':
          description: 邮箱已换绑并标记已验证
          content:
            application/json:
              schema:
                $ref: '../schemas/user.yaml#/schemas/ChangeEmailResponse'
        '400':
          $ref: '../components/responses.yaml#/responses/Error400'
        '401':
          $ref: '../components/responses.yaml#/responses/Error401'
        '403':
          $ref: '../components/responses.yaml#/responses/Error403'
        '404':
          $ref: '../components/responses.yaml#/responses/Error404'
        '409':
          $ref: '../components/responses.yaml#/responses/Error409'
        '422':
          $ref: '../components/responses.yaml#/responses/Error422'
        '429':
          $ref: '../components/responses.yaml#/responses/Error429'
        '500':
          $ref: '../components/responses.yaml#/responses/Error500'
        '503':
          $ref: '../components/responses.yaml#/responses/Error503'

  /api/notification-preferences:
    get:
      tags: [user]
      operationId: getNotificationPreferences
      summary: 读取通知偏好（稀疏对象）
      description: 存储为 NULL 时归一为 {}；站点默认值由客户端合并。
      security:
        - sessionCookie: []
        - bearerToken: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '../schemas/user.yaml#/schemas/NotificationPreferences'
        '401':
          $ref: '../components/responses.yaml#/responses/Error401'
        '404':
          $ref: '../components/responses.yaml#/responses/Error404'
        '500':
          $ref: '../components/responses.yaml#/responses/Error500'
        '503':
          $ref: '../components/responses.yaml#/responses/Error503'
    put:
      tags: [user]
      operationId: updateNotificationPreferences
      summary: 稀疏合并通知偏好
      description: |
        请求中出现的键覆盖/合并已有值，未出现的保持不动。未知键与非法值
        一律 400（拼写错误必须可见）。null/空串清除 URL/token 类键；
        security_alert.enabled=false 被拒绝（安全通知不可关闭）。成功 200
        返回合并后的完整对象。
      security:
        - sessionCookie: []
        - bearerToken: []
      parameters:
        - $ref: '../components/params.yaml#/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/user.yaml#/schemas/NotificationPreferences'
      responses:
        '200':
          description: 合并后的偏好对象
          content:
            application/json:
              schema:
                $ref: '../schemas/user.yaml#/schemas/NotificationPreferences'
        '400':
          $ref: '../components/responses.yaml#/responses/Error400'
        '401':
          $ref: '../components/responses.yaml#/responses/Error401'
        '403':
          $ref: '../components/responses.yaml#/responses/Error403'
        '404':
          $ref: '../components/responses.yaml#/responses/Error404'
        '500':
          $ref: '../components/responses.yaml#/responses/Error500'
        '503':
          $ref: '../components/responses.yaml#/responses/Error503'

  /api/notification-preferences/test:
    post:
      tags: [user]
      operationId: testNotification
      summary: 发送一条测试通知
      description: |
        渠道实现由模块 08 注入；M1 未配置通道时返回 503，偏好读写不受影响。
        成功 200 {channel,sent:true}。
      security:
        - sessionCookie: []
        - bearerToken: []
      parameters:
        - $ref: '../components/params.yaml#/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/user.yaml#/schemas/NotificationTestRequest'
      responses:
        '200':
          description: 已投递测试消息
          content:
            application/json:
              schema:
                $ref: '../schemas/user.yaml#/schemas/NotificationTestResponse'
        '400':
          $ref: '../components/responses.yaml#/responses/Error400'
        '401':
          $ref: '../components/responses.yaml#/responses/Error401'
        '403':
          $ref: '../components/responses.yaml#/responses/Error403'
        '404':
          $ref: '../components/responses.yaml#/responses/Error404'
        '429':
          $ref: '../components/responses.yaml#/responses/Error429'
        '502':
          $ref: '../components/responses.yaml#/responses/Error502'
        '503':
          $ref: '../components/responses.yaml#/responses/Error503'

  /api/2fa/setup:
    post:
      tags: [user]
      operationId: setupTwoFA
      summary: 生成 TOTP secret 与 otpauth URI（不落库）
      description: |
        已启用时返回 409（避免展示一个永远无法保存的二维码）。secret 只在
        本次响应出现。成功 200。
      security:
        - sessionCookie: []
        - bearerToken: []
      parameters:
        - $ref: '../components/params.yaml#/parameters/CSRFToken'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '../schemas/user.yaml#/schemas/TwoFASetupResponse'
        '401':
          $ref: '../components/responses.yaml#/responses/Error401'
        '403':
          $ref: '../components/responses.yaml#/responses/Error403'
        '409':
          $ref: '../components/responses.yaml#/responses/Error409'
        '503':
          $ref: '../components/responses.yaml#/responses/Error503'

  /api/2fa/enable:
    post:
      tags: [user]
      operationId: enableTwoFA
      summary: 验证 TOTP 后启用 2FA 并返回备用码
      description: |
        验证 {secret,code} 通过后一次性写入密文种子、8 组备用码哈希与
        totp_enabled=true，并把明文备用码返回给客户端（唯一一次）。验证
        失败不产生任何写入。已启用 409；无口令的 OAuth 用户 403。
      security:
        - sessionCookie: []
        - bearerToken: []
      parameters:
        - $ref: '../components/params.yaml#/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/user.yaml#/schemas/TwoFAEnableRequest'
      responses:
        '200':
          description: 已启用，返回一次性备用码
          content:
            application/json:
              schema:
                $ref: '../schemas/user.yaml#/schemas/TwoFABackupCodesResponse'
        '400':
          $ref: '../components/responses.yaml#/responses/Error400'
        '401':
          $ref: '../components/responses.yaml#/responses/Error401'
        '403':
          $ref: '../components/responses.yaml#/responses/Error403'
        '409':
          $ref: '../components/responses.yaml#/responses/Error409'
        '503':
          $ref: '../components/responses.yaml#/responses/Error503'

  /api/2fa/disable:
    post:
      tags: [user]
      operationId: disableTwoFA
      summary: 用当前口令关闭 2FA
      description: |
        需要当前口令确认；错误口令与登录共用失败锁定桶（429）。未启用时
        409。成功 200 {totp_enabled:false}。
      security:
        - sessionCookie: []
        - bearerToken: []
      parameters:
        - $ref: '../components/params.yaml#/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/user.yaml#/schemas/TwoFAPasswordRequest'
      responses:
        '200':
          description: 已关闭
          content:
            application/json:
              schema:
                $ref: '../schemas/user.yaml#/schemas/TwoFADisableResponse'
        '400':
          $ref: '../components/responses.yaml#/responses/Error400'
        '401':
          $ref: '../components/responses.yaml#/responses/Error401'
        '403':
          $ref: '../components/responses.yaml#/responses/Error403'
        '409':
          $ref: '../components/responses.yaml#/responses/Error409'
        '429':
          $ref: '../components/responses.yaml#/responses/Error429'
        '503':
          $ref: '../components/responses.yaml#/responses/Error503'

  /api/2fa/backup-codes/regenerate:
    post:
      tags: [user]
      operationId: regenerateTwoFABackupCodes
      summary: 重生成备用码（旧码立即失效）
      description: |
        需要当前口令确认；整体替换哈希数组，旧码在 UPDATE 提交瞬间全部失效。
        未启用 409。成功 200 返回 8 组新明文备用码（唯一一次）。
      security:
        - sessionCookie: []
        - bearerToken: []
      parameters:
        - $ref: '../components/params.yaml#/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/user.yaml#/schemas/TwoFAPasswordRequest'
      responses:
        '200':
          description: 新备用码
          content:
            application/json:
              schema:
                $ref: '../schemas/user.yaml#/schemas/TwoFABackupCodesResponse'
        '400':
          $ref: '../components/responses.yaml#/responses/Error400'
        '401':
          $ref: '../components/responses.yaml#/responses/Error401'
        '403':
          $ref: '../components/responses.yaml#/responses/Error403'
        '409':
          $ref: '../components/responses.yaml#/responses/Error409'
        '429':
          $ref: '../components/responses.yaml#/responses/Error429'
        '503':
          $ref: '../components/responses.yaml#/responses/Error503'

  # ---------------------------------------------------------------------------
  # API 令牌（modules-02）
  # ---------------------------------------------------------------------------

  /api/tokens:
    get:
      tags: [user]
      operationId: listTokens
      summary: 列出当前用户的 API 令牌（分页）
      description: |
        仅按 name 关键字搜索（R-08：key 后缀搜索不命中）。status 为读时
        派生值；quota 过滤 normal|low|exhausted|unlimited。
      security:
        - sessionCookie: []
        - bearerToken: []
      parameters:
        - $ref: '../components/pagination.yaml#/parameters/Page'
        - $ref: '../components/pagination.yaml#/parameters/PageSize'
        - name: keyword
          in: query
          required: false
          description: 按令牌名称模糊搜索（不搜索 key/key_hash）。
          schema:
            type: string
            maxLength: 64
        - name: status
          in: query
          required: false
          schema:
            $ref: '../schemas/user.yaml#/schemas/TokenStatus'
        - name: group
          in: query
          required: false
          schema:
            type: string
        - name: quota
          in: query
          required: false
          schema:
            type: string
            enum: [normal, low, exhausted, unlimited]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '../schemas/user.yaml#/schemas/TokenList'
        '400':
          $ref: '../components/responses.yaml#/responses/Error400'
        '401':
          $ref: '../components/responses.yaml#/responses/Error401'
        '500':
          $ref: '../components/responses.yaml#/responses/Error500'
    post:
      tags: [user]
      operationId: createTokens
      summary: 创建 API 令牌（可批量，key 仅此一次）
      description: |
        应携带 Idempotency-Key（UUID）：同键重放返回首次结果；同键不同
        请求体返回 422。缺省时服务端直接执行，不提供重放保护。quantity 一次最多 100 枚。group=auto 时 auto_groups
        必须非空且不超过站点上限（默认 20）。响应 200 + {created:[...]}，
        每项的 key 是完整明文、仅此一次出现（服务端只存 SHA-256）。
      security:
        - sessionCookie: []
        - bearerToken: []
      parameters:
        - $ref: '../components/params.yaml#/parameters/IdempotencyKey'
        - $ref: '../components/params.yaml#/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/user.yaml#/schemas/CreateTokenRequest'
      responses:
        '200':
          description: 已创建（含一次性明文 key）
          content:
            application/json:
              schema:
                $ref: '../schemas/user.yaml#/schemas/CreateTokenResponse'
        '400':
          $ref: '../components/responses.yaml#/responses/Error400'
        '401':
          $ref: '../components/responses.yaml#/responses/Error401'
        '403':
          $ref: '../components/responses.yaml#/responses/Error403'
        '409':
          description: 相同 Idempotency-Key 的并发请求仍在处理中（含等待期间请求被取消）
          content:
            application/problem+json:
              schema:
                $ref: '../components/problem.yaml#/schemas/Problem'
        '422':
          $ref: '../components/responses.yaml#/responses/Error422'
        '500':
          $ref: '../components/responses.yaml#/responses/Error500'

  /api/tokens/{id}:
    get:
      tags: [user]
      operationId: getToken
      summary: 读取单个令牌
      description: 他人令牌与不存在令牌统一 404（不泄露存在性）。
      security:
        - sessionCookie: []
        - bearerToken: []
      parameters:
        - $ref: '../components/params.yaml#/parameters/PathTokenID'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '../schemas/user.yaml#/schemas/Token'
        '401':
          $ref: '../components/responses.yaml#/responses/Error401'
        '404':
          $ref: '../components/responses.yaml#/responses/Error404'
        '500':
          $ref: '../components/responses.yaml#/responses/Error500'
    patch:
      tags: [user]
      operationId: updateToken
      summary: 部分更新令牌（乐观锁）
      description: |
        必须原样回传 updated_at，否则 400（缺失）或 409（版本不匹配）。
        expires_at 显式 null 表示改为永不过期。
      security:
        - sessionCookie: []
        - bearerToken: []
      parameters:
        - $ref: '../components/params.yaml#/parameters/PathTokenID'
        - $ref: '../components/params.yaml#/parameters/IdempotencyKey'
        - $ref: '../components/params.yaml#/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/user.yaml#/schemas/UpdateTokenRequest'
      responses:
        '200':
          description: 更新后的令牌
          content:
            application/json:
              schema:
                $ref: '../schemas/user.yaml#/schemas/Token'
        '400':
          $ref: '../components/responses.yaml#/responses/Error400'
        '401':
          $ref: '../components/responses.yaml#/responses/Error401'
        '403':
          $ref: '../components/responses.yaml#/responses/Error403'
        '404':
          $ref: '../components/responses.yaml#/responses/Error404'
        '409':
          $ref: '../components/responses.yaml#/responses/Error409'
        '422':
          $ref: '../components/responses.yaml#/responses/Error422'
        '500':
          $ref: '../components/responses.yaml#/responses/Error500'
    delete:
      tags: [user]
      operationId: deleteToken
      summary: 删除令牌（可选乐观锁）
      description: |
        可选 query updated_at（RFC 3339）：提供时必须匹配当前版本，否则 409。
        未提供时直接删除。成功 204。
      security:
        - sessionCookie: []
        - bearerToken: []
      parameters:
        - $ref: '../components/params.yaml#/parameters/PathTokenID'
        - name: updated_at
          in: query
          required: false
          description: 乐观锁版本（RFC 3339）；缺省跳过版本校验。
          schema:
            type: string
            format: date-time
        - $ref: '../components/params.yaml#/parameters/CSRFToken'
      responses:
        '204':
          description: 已删除
        '400':
          $ref: '../components/responses.yaml#/responses/Error400'
        '401':
          $ref: '../components/responses.yaml#/responses/Error401'
        '403':
          $ref: '../components/responses.yaml#/responses/Error403'
        '404':
          $ref: '../components/responses.yaml#/responses/Error404'
        '409':
          $ref: '../components/responses.yaml#/responses/Error409'
        '500':
          $ref: '../components/responses.yaml#/responses/Error500'

  /api/tokens:batch-enable:
    post:
      tags: [user]
      operationId: batchEnableTokens
      summary: 批量启用令牌（≤100）
      description: |
        应携带 Idempotency-Key；缺失时直接执行（无重放保护）。部分失败仍返回 200：succeeded 计数 +
        failed 明细（他人/不存在令牌的 name 留空，不泄露存在性）。
      security:
        - sessionCookie: []
        - bearerToken: []
      parameters:
        - $ref: '../components/params.yaml#/parameters/IdempotencyKey'
        - $ref: '../components/params.yaml#/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/user.yaml#/schemas/BatchTokenRequest'
      responses:
        '200':
          description: 逐条结果
          content:
            application/json:
              schema:
                $ref: '../schemas/user.yaml#/schemas/TokenBatchResponse'
        '400':
          $ref: '../components/responses.yaml#/responses/Error400'
        '401':
          $ref: '../components/responses.yaml#/responses/Error401'
        '403':
          $ref: '../components/responses.yaml#/responses/Error403'
        '409':
          $ref: '../components/responses.yaml#/responses/Error409'
        '422':
          $ref: '../components/responses.yaml#/responses/Error422'
        '500':
          $ref: '../components/responses.yaml#/responses/Error500'

  /api/tokens:batch-disable:
    post:
      tags: [user]
      operationId: batchDisableTokens
      summary: 批量禁用令牌（≤100）
      description: 语义与 batch-enable 相同；禁用后 token:changed 广播使缓存立即失效。
      security:
        - sessionCookie: []
        - bearerToken: []
      parameters:
        - $ref: '../components/params.yaml#/parameters/IdempotencyKey'
        - $ref: '../components/params.yaml#/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/user.yaml#/schemas/BatchTokenRequest'
      responses:
        '200':
          description: 逐条结果
          content:
            application/json:
              schema:
                $ref: '../schemas/user.yaml#/schemas/TokenBatchResponse'
        '400':
          $ref: '../components/responses.yaml#/responses/Error400'
        '401':
          $ref: '../components/responses.yaml#/responses/Error401'
        '403':
          $ref: '../components/responses.yaml#/responses/Error403'
        '409':
          $ref: '../components/responses.yaml#/responses/Error409'
        '422':
          $ref: '../components/responses.yaml#/responses/Error422'
        '500':
          $ref: '../components/responses.yaml#/responses/Error500'

  /api/tokens:batch-delete:
    post:
      tags: [user]
      operationId: batchDeleteTokens
      summary: 批量删除令牌（≤100）
      description: 语义与 batch-enable 相同；部分失败仍 200。
      security:
        - sessionCookie: []
        - bearerToken: []
      parameters:
        - $ref: '../components/params.yaml#/parameters/IdempotencyKey'
        - $ref: '../components/params.yaml#/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/user.yaml#/schemas/BatchTokenRequest'
      responses:
        '200':
          description: 逐条结果
          content:
            application/json:
              schema:
                $ref: '../schemas/user.yaml#/schemas/TokenBatchResponse'
        '400':
          $ref: '../components/responses.yaml#/responses/Error400'
        '401':
          $ref: '../components/responses.yaml#/responses/Error401'
        '403':
          $ref: '../components/responses.yaml#/responses/Error403'
        '409':
          $ref: '../components/responses.yaml#/responses/Error409'
        '422':
          $ref: '../components/responses.yaml#/responses/Error422'
        '500':
          $ref: '../components/responses.yaml#/responses/Error500'

  /api/tokens/{id}:enable:
    post:
      tags: [user]
      operationId: enableToken
      summary: 启用单个令牌
      description: 幂等（已启用仍 200）。他人/不存在令牌 404。
      security:
        - sessionCookie: []
        - bearerToken: []
      parameters:
        - $ref: '../components/params.yaml#/parameters/PathTokenID'
        - $ref: '../components/params.yaml#/parameters/CSRFToken'
      responses:
        '200':
          description: 更新后的令牌
          content:
            application/json:
              schema:
                $ref: '../schemas/user.yaml#/schemas/Token'
        '401':
          $ref: '../components/responses.yaml#/responses/Error401'
        '403':
          $ref: '../components/responses.yaml#/responses/Error403'
        '404':
          $ref: '../components/responses.yaml#/responses/Error404'
        '500':
          $ref: '../components/responses.yaml#/responses/Error500'

  /api/tokens/{id}:disable:
    post:
      tags: [user]
      operationId: disableToken
      summary: 禁用单个令牌
      description: 幂等（已禁用仍 200）。禁用后 Redis 缓存经 token:changed 失效。
      security:
        - sessionCookie: []
        - bearerToken: []
      parameters:
        - $ref: '../components/params.yaml#/parameters/PathTokenID'
        - $ref: '../components/params.yaml#/parameters/CSRFToken'
      responses:
        '200':
          description: 更新后的令牌
          content:
            application/json:
              schema:
                $ref: '../schemas/user.yaml#/schemas/Token'
        '401':
          $ref: '../components/responses.yaml#/responses/Error401'
        '403':
          $ref: '../components/responses.yaml#/responses/Error403'
        '404':
          $ref: '../components/responses.yaml#/responses/Error404'
        '500':
          $ref: '../components/responses.yaml#/responses/Error500'

  /api/tokens/{id}:reset-key:
    post:
      tags: [user]
      operationId: resetTokenKey
      summary: 重置令牌密钥（新 key 仅此一次）
      description: |
        每次调用都会生成新 key（非幂等语义），但端点用 Idempotency-Key 包裹：
        同键重放返回首次的新 key，避免网络重试导致"key 已换但客户端没拿到"。
        旧 key 立即失效。成功 200 + {key,key_masked}，响应 Cache-Control:
        no-store。
      security:
        - sessionCookie: []
        - bearerToken: []
      parameters:
        - $ref: '../components/params.yaml#/parameters/PathTokenID'
        - $ref: '../components/params.yaml#/parameters/IdempotencyKey'
        - $ref: '../components/params.yaml#/parameters/CSRFToken'
      responses:
        '200':
          description: 新 key（一次性）
          content:
            application/json:
              schema:
                $ref: '../schemas/user.yaml#/schemas/ResetTokenKeyResponse'
        '401':
          $ref: '../components/responses.yaml#/responses/Error401'
        '403':
          $ref: '../components/responses.yaml#/responses/Error403'
        '404':
          $ref: '../components/responses.yaml#/responses/Error404'
        '409':
          $ref: '../components/responses.yaml#/responses/Error409'
        '422':
          $ref: '../components/responses.yaml#/responses/Error422'
        '500':
          $ref: '../components/responses.yaml#/responses/Error500'

  /api/token/auto-groups:
    get:
      tags: [user]
      operationId: listTokenAutoGroups
      summary: 自动分组候选与单令牌上限
      description: 供令牌创建表单展示有序候选；max_count 默认 20。
      security:
        - sessionCookie: []
        - bearerToken: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '../schemas/user.yaml#/schemas/TokenAutoGroupsResponse'
        '401':
          $ref: '../components/responses.yaml#/responses/Error401'
        '500':
          $ref: '../components/responses.yaml#/responses/Error500'

  /api/usage/token:
    get:
      tags: [user]
      operationId: getTokenUsage
      summary: 令牌自读用量（Bearer 自身 key）
      description: |
        只接受 Bearer（不接受 Cookie）：凭据就是被查询的令牌本身。额度耗尽的
        令牌仍返回 200 且 total_available=0（前端要能显示耗尽状态，
        modules-02 §2.13）；已过期令牌 401 + problem type token_expired；
        禁用令牌 401 token_disabled；非法 key 401 invalid_token。
      security:
        - bearerToken: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '../schemas/user.yaml#/schemas/TokenUsage'
        '401':
          description: |
            令牌不可用。problem type 区分原因：`token_expired`（已过期）、
            `token_disabled`（已禁用）、`invalid_token`（key 非法/不存在）；
            detail 不泄露令牌存在性与归属。
          content:
            application/problem+json:
              schema:
                $ref: '../components/problem.yaml#/schemas/Problem'
        '503':
          $ref: '../components/responses.yaml#/responses/Error503'

  # 按 key 只读查询（modules-05 F-05-11 / G-API-009）。
  /api/logs/by-key:
    get:
      tags: [user]
      operationId: listUsageLogsByKey
      summary: 按 API 令牌只读查询自身最近用量明细
      description: |
        认证只接受 `Authorization: Bearer nkt-…`（只读令牌认证），不接受 Cookie、
        `?key=` 或 `x-api-key`。**过期/额度耗尽的令牌仍可读，仅显式禁用返回 401**
        （过期/耗尽/非法/禁用统一 `invalid_token`，不区分原因）。
        数据范围是本令牌自身（`user_id` + `token_id`）：同用户的其它令牌与账户级
        记录都不可见。无分页、无筛选；查询参数被忽略；固定返回最近 1000 条。
        `other` 与 `retry_chain` 一律按 user 视图投影，`error_message` 固定打码，
        不提供 reveal_sensitive。限流 60 次/分钟/令牌（Redis 故障 fail-open）。
        不写审计、不打埋点、不发事件。
      security:
        - bearerToken: []
      responses:
        '200':
          description: 固定上限的最近明细；无记录时为 `{"items":[]}`
          content:
            application/json:
              schema:
                $ref: '../schemas/user.yaml#/schemas/LogsByKeyPage'
        '401':
          description: |
            凭据缺失/形态非法/令牌不存在/令牌已禁用。problem type 恒为
            `invalid_token`，detail 不泄露禁用状态或令牌存在性。
          content:
            application/problem+json:
              schema:
                $ref: '../components/problem.yaml#/schemas/Problem'
        '405':
          description: 仅支持 GET
          content:
            application/problem+json:
              schema:
                $ref: '../components/problem.yaml#/schemas/Problem'
        '429':
          $ref: '../components/responses.yaml#/responses/Error429'
        '503':
          description: 令牌解析或日志查询故障（固定文案，不泄露内部错误）
          content:
            application/problem+json:
              schema:
                $ref: '../components/problem.yaml#/schemas/Problem'

  # M5 兑换码核销（modules-04 F-04-14；任意已认证用户）。
  /api/redemption-codes/redeem:
    post:
      tags: [user]
      operationId: redeemCode
      summary: 核销兑换码并入账
      description: |
        服务端先归一化（trim → 大写 → I/L→1、O→0）再按 SHA-256 查码；
        条件 UPDATE 与入账在同一事务内完成，并发兑换同一码仅一次成功。
        独立限流桶 10 次/分钟/用户。
      security:
        - sessionCookie: []
        - bearerToken: []
      parameters:
        - $ref: '../components/params.yaml#/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/user.yaml#/schemas/RedeemCodeRequest'
      responses:
        '200':
          description: 核销成功（credits 为本次到账积分）
          content:
            application/json:
              schema:
                $ref: '../schemas/user.yaml#/schemas/RedeemCodeResponse'
        '400':
          $ref: '../components/responses.yaml#/responses/Error400'
        '401':
          $ref: '../components/responses.yaml#/responses/Error401'
        '409':
          $ref: '../components/responses.yaml#/responses/Error409'
        '410':
          $ref: '../components/responses.yaml#/responses/Error410'
        '429':
          $ref: '../components/responses.yaml#/responses/Error429'
        '500':
          $ref: '../components/responses.yaml#/responses/Error500'

  # 钱包摘要（modules-03 §F-03-01；M5 Task 6 余额卡读取）。
  /api/wallet/summary:
    get:
      tags: [user]
      operationId: getWalletSummary
      summary: 当前用户钱包摘要
      description: |
        仅返回当前会话用户自己的余额数据（无用户 ID 参数，不接受跨用户
        读取）。`balance` 来自 `users.balance`；`held_credits` 为进行中
        预扣（status='hold'）的绝对值之和；`total_consumed` 为
        `type='consume'` 流水之和；`total_requests` 为 `usage_logs` 行数；
        `health` 由服务端按余额与阈值计算（0=depleted，低于阈值=low）。
      security:
        - sessionCookie: []
        - bearerToken: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '../schemas/user.yaml#/schemas/WalletSummary'
        '401':
          $ref: '../components/responses.yaml#/responses/Error401'
        '500':
          $ref: '../components/responses.yaml#/responses/Error500'

  # M5 在线充值配置（modules-04 §4.A F-04-01；P-9/P-17）。
  /api/topup/config:
    get:
      tags: [user]
      operationId: getTopupConfig
      summary: 获取充值页配置
      description: |
        档位（`pay.amount_presets_cny`，已换算为最小货币单位）、全局最低
        `pay.min_topup_cny`、硬上限 10,000,000 分、`billing.quota_per_unit`、
        当前用户分组的有效倍率 `credits_ratio`，以及「已启用且配置完整」的
        渠道集合。每个渠道条目带自己的 `min_topup`（有效下限由调用方取
        max(全局, 渠道)）。`pay.stripe.publishable_key` 是公开值，随
        `providers.stripe` 下发；任何 secret 都不进入响应。
      security:
        - sessionCookie: []
        - bearerToken: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '../schemas/user.yaml#/schemas/TopupConfig'
        '401':
          $ref: '../components/responses.yaml#/responses/Error401'
        '500':
          $ref: '../components/responses.yaml#/responses/Error500'

  # M5 幂等下单（modules-04 §4.B/§4.C/§4.E F-04-03/05/10；P-9/P-10）。
  /api/orders:
    post:
      tags: [user]
      operationId: createOrder
      summary: 幂等创建充值订单并初始化渠道支付
      description: |
        `Idempotency-Key` 必填（UUID v4）。同一 key 重复提交返回首次订单
        （HTTP 200，不新建、不重新创建渠道支付单；即使渠道被关闭或下限
        被调整也照样返回首次订单）；key 属于其他用户时 409
        `order_state_conflict`。首次创建返回 201。
        **M5 无汇率：`currency` 只接受 CNY**（大小写不敏感），其它币种
        400。`provider=stripe` 返回 `client_secret`；`provider=alipay`
        返回 `qr_code`。渠道未启用/配置不完整（含支付宝沙箱模式）返回
        403；渠道 5xx 返回 502 且订单置 failed。
      security:
        - sessionCookie: []
        - bearerToken: []
      parameters:
        - $ref: '../components/params.yaml#/parameters/CSRFToken'
        - name: Idempotency-Key
          in: header
          required: true
          description: 客户端生成的 UUID v4；全表唯一（P-2）
          schema:
            type: string
            minLength: 1
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/user.yaml#/schemas/CreateOrderRequest'
      responses:
        '201':
          description: 首次创建成功
          content:
            application/json:
              schema:
                $ref: '../schemas/user.yaml#/schemas/CreateOrderResponse'
        '200':
          description: 幂等重放（返回首次订单，不含渠道支付载荷）
          content:
            application/json:
              schema:
                $ref: '../schemas/user.yaml#/schemas/CreateOrderResponse'
        '400':
          $ref: '../components/responses.yaml#/responses/Error400'
        '401':
          $ref: '../components/responses.yaml#/responses/Error401'
        '403':
          description: 在线支付关闭或该渠道未启用/配置不完整
          content:
            application/problem+json:
              schema:
                $ref: '../components/problem.yaml#/schemas/Problem'
        '409':
          description: Idempotency-Key 已被其他用户占用（order_state_conflict）
          content:
            application/problem+json:
              schema:
                $ref: '../components/problem.yaml#/schemas/Problem'
        '500':
          $ref: '../components/responses.yaml#/responses/Error500'
        '502':
          description: 渠道初始化失败（订单已置 failed，provider_unavailable）
          content:
            application/problem+json:
              schema:
                $ref: '../components/problem.yaml#/schemas/Problem'
    get:
      tags: [user]
      operationId: listOrders
      summary: 订单列表与订单号搜索
      description: |
        本人订单（管理员 `orders:read` 可跨用户）。offset 分页（`p` 从 1
        开始，`page_size` 默认 20 / 最大 100），按 `created_at DESC, id DESC`
        倒序。`q` 是订单号子串；`user_id` 仅管理员可指定，普通用户指定他人
        返回 403。列表永不返回 `raw_callback`。
      security:
        - sessionCookie: []
        - bearerToken: []
      parameters:
        - name: p
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000000
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, succeeded, failed, expired, cancelled]
        - name: q
          in: query
          description: 订单号子串（最长 128 字符）
          schema:
            type: string
            maxLength: 128
        - name: user_id
          in: query
          description: 仅 `orders:read` 管理员可用
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '../schemas/user.yaml#/schemas/OrderList'
        '400':
          $ref: '../components/responses.yaml#/responses/Error400'
        '401':
          $ref: '../components/responses.yaml#/responses/Error401'
        '403':
          $ref: '../components/responses.yaml#/responses/Error403'
        '500':
          $ref: '../components/responses.yaml#/responses/Error500'

  # M5 订单中心（modules-04 §4.D F-04-08/09；P-9/P-18）。
  /api/orders/{id}:
    get:
      tags: [user]
      operationId: getOrder
      summary: 订单详情（本人；管理员 orders:read 可查看任意订单）
      description: |
        本人订单返回完整视图（不含 `raw_callback`）；管理员（`orders:read`）
        可查看任意订单并看到 `raw_callback`。他人订单对无权限者一律 404
        （security-02：不得用 403 确认资源存在）。`expires_at` 是
        `created_at + 30min` 的派生值，不是数据库列。
      security:
        - sessionCookie: []
        - bearerToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '../schemas/user.yaml#/schemas/OrderView'
        '401':
          $ref: '../components/responses.yaml#/responses/Error401'
        '404':
          description: 订单不存在或不属于调用者
          content:
            application/problem+json:
              schema:
                $ref: '../components/problem.yaml#/schemas/Problem'
        '500':
          $ref: '../components/responses.yaml#/responses/Error500'

  /api/orders/{id}/cancel:
    post:
      tags: [user]
      operationId: cancelOrder
      summary: 取消 pending 订单（本人；管理员 orders:manage）
      description: |
        仅 `pending → cancelled`；条件 UPDATE 抢不到（订单已终态/并发迁移）
        返回 409 `order_state_conflict`。数据库迁移成功后尽力关闭渠道支付单
        （支付宝 `alipay.trade.close` / Stripe PaymentIntent cancel），渠道
        失败只记日志，不阻断取消。
      security:
        - sessionCookie: []
        - bearerToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
        - $ref: '../components/params.yaml#/parameters/CSRFToken'
      responses:
        '200':
          description: 已取消
          content:
            application/json:
              schema:
                $ref: '../schemas/user.yaml#/schemas/OrderView'
        '401':
          $ref: '../components/responses.yaml#/responses/Error401'
        '404':
          description: 订单不存在或不属于调用者
          content:
            application/problem+json:
              schema:
                $ref: '../components/problem.yaml#/schemas/Problem'
        '409':
          description: 订单已不是 pending（order_state_conflict）
          content:
            application/problem+json:
              schema:
                $ref: '../components/problem.yaml#/schemas/Problem'
        '500':
          $ref: '../components/responses.yaml#/responses/Error500'

  /api/orders/{id}/verify:
    post:
      tags: [user]
      operationId: verifyOrder
      summary: 主动核实渠道支付结果（回调丢失兜底；本人或 orders:manage）
      description: |
        仅 `pending` 订单。本人或持有 `orders:manage` 的管理员；只有
        `orders:read` 的管理员无法替他人核实（数据级 404）。服务端调用
        Stripe retrieve / `alipay.trade.query`：
        已支付 → 复用 webhook 同一条幂等入账路径（条件 UPDATE + 入账同事务，
        重复核实不会重复入账）；未支付 → 200 `{paid:false}` 且不改变状态；
        渠道查询失败 → 502。限流每订单 5 次/分钟（Redis，故障时 fail closed）。
      security:
        - sessionCookie: []
        - bearerToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
        - $ref: '../components/params.yaml#/parameters/CSRFToken'
      responses:
        '200':
          description: 查询完成（paid 表示渠道是否已收款）
          content:
            application/json:
              schema:
                $ref: '../schemas/user.yaml#/schemas/OrderVerifyResponse'
        '401':
          $ref: '../components/responses.yaml#/responses/Error401'
        '404':
          description: 订单不存在或不属于调用者
          content:
            application/problem+json:
              schema:
                $ref: '../components/problem.yaml#/schemas/Problem'
        '409':
          description: 订单已不是 pending（order_state_conflict）
          content:
            application/problem+json:
              schema:
                $ref: '../components/problem.yaml#/schemas/Problem'
        '429':
          $ref: '../components/responses.yaml#/responses/Error429'
        '502':
          description: 渠道查询失败（provider_unavailable）
          content:
            application/problem+json:
              schema:
                $ref: '../components/problem.yaml#/schemas/Problem'
        '503':
          description: 限流器不可用（fail closed）
          content:
            application/problem+json:
              schema:
                $ref: '../components/problem.yaml#/schemas/Problem'

  /api/orders/{id}/complete:
    post:
      tags: [admin]
      operationId: completeOrderManually
      x-required-permission: orders:manage
      summary: 管理员人工完成订单（须渠道确认已收款）
      description: |
        需要 `orders:manage`。订单必须为 `pending` 且渠道主动查询确认已支付；
        查询失败或未支付 → 400 且不写状态。`manual_reason` 10–200 字符，
        成功后写 `manual_completed/manual_reason/manual_operator_id` 并复用
        同一条幂等入账路径。阈值/二次认证属于 P-19 的后续适配器族，本端点
        为基本旁路、不写 audit_logs（P-16）。
      security:
        - sessionCookie: []
        - bearerToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
        - $ref: '../components/params.yaml#/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/user.yaml#/schemas/CompleteOrderRequest'
      responses:
        '200':
          description: 人工完成并入账
          content:
            application/json:
              schema:
                $ref: '../schemas/user.yaml#/schemas/OrderView'
        '400':
          description: 原因非法，或渠道未确认收款/查询失败
          content:
            application/problem+json:
              schema:
                $ref: '../components/problem.yaml#/schemas/Problem'
        '401':
          $ref: '../components/responses.yaml#/responses/Error401'
        '403':
          $ref: '../components/responses.yaml#/responses/Error403'
        '404':
          description: 订单不存在
          content:
            application/problem+json:
              schema:
                $ref: '../components/problem.yaml#/schemas/Problem'
        '409':
          description: 订单已不是 pending（order_state_conflict）
          content:
            application/problem+json:
              schema:
                $ref: '../components/problem.yaml#/schemas/Problem'
        '500':
          $ref: '../components/responses.yaml#/responses/Error500'

  # 用量日志 / 统计 / 审计只读端点（M6 Task 2 / modules-05）。
  # 普通用户硬过滤 user_id=本人；admin+logs:read 可见全部并使用管理参数。
  /api/usage-logs:
    get:
      tags: [user]
      operationId: listUsageLogs
      summary: 用量日志列表（offset 分页 + 筛选）
      description: |
        user 仅见本人记录；admin 且持有 `logs:read` 可见全部并可用 `username`。
        非管理员传 `username` 返回 403。时间范围最长 90 天。
      security:
        - sessionCookie: []
        - bearerToken: []
      parameters:
        - $ref: '../components/pagination.yaml#/parameters/Page'
        - $ref: '../components/pagination.yaml#/parameters/PageSize'
        - name: range
          in: query
          schema:
            type: string
            enum: [24h, 7d, 14d, 30d]
            default: 24h
          description: 预设时间范围；与 start/end 互斥（显式区间优先）
        - name: start
          in: query
          schema: { type: string, format: date-time }
        - name: end
          in: query
          schema: { type: string, format: date-time }
        - name: model
          in: query
          schema: { type: string, maxLength: 128 }
          description: 模型前缀匹配（通配符按字面量转义）
        - name: group
          in: query
          schema: { type: string, maxLength: 32 }
        - name: token_id
          in: query
          schema: { type: integer, format: int64 }
        - name: request_id
          in: query
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema:
            type: string
            enum: [success, error, refunded, refused]
        - name: username
          in: query
          schema: { type: string }
          description: 仅 admin+logs:read；精确匹配
      responses:
        '200':
          description: 分页信封（total 为精确整数）
          content:
            application/json:
              schema:
                $ref: '../schemas/user.yaml#/schemas/UsageLogPage'
        '401':
          $ref: '../components/responses.yaml#/responses/Error401'
        '403':
          $ref: '../components/responses.yaml#/responses/Error403'
        '422':
          $ref: '../components/responses.yaml#/responses/Error422'
        '500':
          $ref: '../components/responses.yaml#/responses/Error500'

  /api/usage-logs/{id}:
    get:
      tags: [user]
      operationId: getUsageLog
      summary: 用量日志详情（含 other 投影）
      security:
        - sessionCookie: []
        - bearerToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
      responses:
        '200':
          description: 详情；他人行与不存在同为 404（不泄露存在性）
          content:
            application/json:
              schema:
                $ref: '../schemas/user.yaml#/schemas/UsageLogDetail'
        '401':
          $ref: '../components/responses.yaml#/responses/Error401'
        '404':
          $ref: '../components/responses.yaml#/responses/Error404'
        '500':
          $ref: '../components/responses.yaml#/responses/Error500'

  /api/usage-logs/{id}/prompt:
    get:
      tags: [user]
      operationId: getUsageLogPrompt
      summary: Prompt 原文（当前无落库载体）
      description: |
        Prompt 无任何落库载体（platform-01 §21 U-12 / G7-R30）：无
        `log.prompt.view` 返回 403；有权限且行可见仍返回 404
        （`Cache-Control: no-store`）。前端据此隐藏/打码查看入口。
      security:
        - sessionCookie: []
        - bearerToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
      responses:
        '401':
          $ref: '../components/responses.yaml#/responses/Error401'
        '403':
          $ref: '../components/responses.yaml#/responses/Error403'
        '404':
          description: 无 Prompt 载体，或行不可见/不存在
          headers:
            Cache-Control:
              schema: { type: string, enum: ['no-store'] }
          content:
            application/problem+json:
              schema:
                $ref: '../components/problem.yaml#/schemas/Problem'
        '500':
          $ref: '../components/responses.yaml#/responses/Error500'

  /api/usage-stats/summary:
    get:
      tags: [user]
      operationId: getUsageStatsSummary
      summary: 用量概览聚合
      security:
        - sessionCookie: []
        - bearerToken: []
      parameters:
        - name: range
          in: query
          schema:
            type: string
            enum: [24h, 7d, 14d, 30d]
            default: 24h
        - name: start
          in: query
          schema: { type: string, format: date-time }
        - name: end
          in: query
          schema: { type: string, format: date-time }
        - name: model
          in: query
          schema: { type: string, maxLength: 128 }
        - name: group
          in: query
          schema: { type: string, maxLength: 32 }
        - name: token_id
          in: query
          schema: { type: integer, format: int64 }
        - name: status
          in: query
          schema:
            type: string
            enum: [success, error, refunded, refused]
        - name: username
          in: query
          schema: { type: string }
          description: 仅 admin+logs:read；精确匹配
      responses:
        '200':
          description: 概览卡片；success_rate=success/total（0 行时为 0）
          content:
            application/json:
              schema:
                $ref: '../schemas/user.yaml#/schemas/UsageStatsSummary'
        '401':
          $ref: '../components/responses.yaml#/responses/Error401'
        '403':
          $ref: '../components/responses.yaml#/responses/Error403'
        '422':
          $ref: '../components/responses.yaml#/responses/Error422'
        '500':
          $ref: '../components/responses.yaml#/responses/Error500'

  /api/usage-stats/by-model:
    get:
      tags: [user]
      operationId: getUsageStatsByModel
      summary: 模型消费分布（top 8 + other）
      description: percent 以十进制基点分配，合计恰为 100；0 行返回空数组。
      security:
        - sessionCookie: []
        - bearerToken: []
      parameters:
        - name: range
          in: query
          schema:
            type: string
            enum: [24h, 7d, 14d, 30d]
            default: 24h
        - name: start
          in: query
          schema: { type: string, format: date-time }
        - name: end
          in: query
          schema: { type: string, format: date-time }
        - name: model
          in: query
          schema: { type: string, maxLength: 128 }
        - name: group
          in: query
          schema: { type: string, maxLength: 32 }
        - name: token_id
          in: query
          schema: { type: integer, format: int64 }
        - name: status
          in: query
          schema:
            type: string
            enum: [success, error, refunded, refused]
        - name: username
          in: query
          schema: { type: string }
          description: 仅 admin+logs:read；精确匹配
      responses:
        '200':
          description: 模型分布数组
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '../schemas/user.yaml#/schemas/UsageStatsByModelItem'
        '401':
          $ref: '../components/responses.yaml#/responses/Error401'
        '403':
          $ref: '../components/responses.yaml#/responses/Error403'
        '422':
          $ref: '../components/responses.yaml#/responses/Error422'
        '500':
          $ref: '../components/responses.yaml#/responses/Error500'

  /api/usage-stats/timeseries:
    get:
      tags: [user]
      operationId: getUsageStatsTimeseries
      summary: 消费时间序列（UTC 桶）
      description: 只返回存在的桶；缺桶由前端零填充。bucket 为 UTC ISO 时间。
      security:
        - sessionCookie: []
        - bearerToken: []
      parameters:
        - name: range
          in: query
          schema:
            type: string
            enum: [24h, 7d, 14d, 30d]
            default: 24h
        - name: start
          in: query
          schema: { type: string, format: date-time }
        - name: end
          in: query
          schema: { type: string, format: date-time }
        - name: model
          in: query
          schema: { type: string, maxLength: 128 }
        - name: group
          in: query
          schema: { type: string, maxLength: 32 }
        - name: token_id
          in: query
          schema: { type: integer, format: int64 }
        - name: status
          in: query
          schema:
            type: string
            enum: [success, error, refunded, refused]
        - name: username
          in: query
          schema: { type: string }
          description: 仅 admin+logs:read；精确匹配
        - name: granularity
          in: query
          schema:
            type: string
            enum: [hour, day]
            default: hour
      responses:
        '200':
          description: 时间桶数组（按 bucket 升序）
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '../schemas/user.yaml#/schemas/UsageStatsTimeseriesItem'
        '401':
          $ref: '../components/responses.yaml#/responses/Error401'
        '403':
          $ref: '../components/responses.yaml#/responses/Error403'
        '422':
          $ref: '../components/responses.yaml#/responses/Error422'
        '500':
          $ref: '../components/responses.yaml#/responses/Error500'

  /api/usage-stats/rates:
    get:
      tags: [user]
      operationId: getUsageStatsRates
      summary: RPM/TPM/消费统计条
      description: |
        rpm_avg = 请求数/窗口分钟数；rpm_peak = 任一分钟最大请求数；
        tpm_avg = (输入+输出) tokens/窗口分钟数。admin 可用 scope=all。
      security:
        - sessionCookie: []
        - bearerToken: []
      parameters:
        - name: range
          in: query
          schema:
            type: string
            enum: [24h, 7d, 14d, 30d]
            default: 24h
        - name: start
          in: query
          schema: { type: string, format: date-time }
        - name: end
          in: query
          schema: { type: string, format: date-time }
        - name: username
          in: query
          schema: { type: string }
          description: 仅 admin+logs:read；精确匹配
        - name: scope
          in: query
          schema:
            type: string
            enum: [all]
          description: 仅 admin+logs:read；非管理员传参返回 403
      responses:
        '200':
          description: 统计条
          content:
            application/json:
              schema:
                $ref: '../schemas/user.yaml#/schemas/UsageStatsRates'
        '401':
          $ref: '../components/responses.yaml#/responses/Error401'
        '403':
          $ref: '../components/responses.yaml#/responses/Error403'
        '422':
          $ref: '../components/responses.yaml#/responses/Error422'
        '500':
          $ref: '../components/responses.yaml#/responses/Error500'

  /api/audit-logs:
