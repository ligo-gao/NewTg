  # ---------------------------------------------------------------------------
  # 绘图任务族查询（W8/MJ-b，relay-05 §1.2）。
  #
  # 归属键是 (user_id, MjId)：他人任务与不存在任务返回同一个 404 与同一条
  # description，不制造存在性 oracle。查询族不受 `mj.enabled` 追溯（开关
  # 关闭不隐藏历史任务），因此没有 403 门控响应。
  # ---------------------------------------------------------------------------
  /mj/task/{id}/fetch:
    get:
      tags: [relay]
      operationId: mjFetchTask
      summary: Midjourney 单任务查询
      description: |
        按 `(user_id, MjId)` 读取本网关已回填的任务，不访问上游（两级轮询：
        客户端只轮询网关）。返回 MJ 任务 DTO（status/progress/imageUrl/
        videoUrl/videoUrls/buttons/properties 等）；上游原始 status 逐字保留。
      security:
        - bearerToken: []
      parameters:
        - $ref: '../components/params.yaml#/parameters/MJTaskID'
      responses:
        '200':
          description: 任务 DTO 信封（`{code:1,description,result}`）
        '400':
          description: 路径 id 形状非法（`{code:4,description:invalid_id}`）
        '401':
          description: 令牌无效（`{code:5,description}`）
        '404':
          description: 任务不存在或不属于本人（`{code:4,description:task_not_found}`）
        '500':
          description: 内部错误（`{code:5,description}`）

  /mj/task/list-by-condition:
