# 中继协议面（platform-03 §9.3）：只登记路径/方法/tag/security/公共错误，
# 不重定义上游 schema（本文件不出现 `schema:`，请求/响应体真源在
# contract/adapter；`scripts/check_openapi_layout.sh` 断言这一点）。
# path 条目会进入 bundle 与前端 path 类型（openapi-typescript 不认
# x-codegen），因此登记的路径必须与后端实际注册面一致：
#   - /v1 对话族 + 多模态族由 Register 注册；
#   - /pg 只有对话族（POST /pg/chat/completions、GET /pg/models）。
# 不登记（路由不注册，返回标准 404）：/v1/files*、/v1/fine-tunes*、
# /v1/images/variations、/v1/edits、DELETE /v1/models/{model}（决议 H）。
paths:
  /v1/chat/completions:
    post:
      tags: [relay]
      operationId: createChatCompletion
      x-openai-compatible: true
      summary: OpenAI-compatible chat completions
      description: |
        请求/响应体遵循 OpenAI Chat Completions 公开规范（含 SSE 流式）。
        额度不足返回 402 + Problem402 扩展。
      security:
        - bearerToken: []
      externalDocs:
        description: OpenAI Chat Completions API reference
        url: https://platform.openai.com/docs/api-reference/chat
      responses:
        '200':
          description: ChatCompletion 对象或 SSE 流（schema 见上游公开规范）
        '400':
          $ref: '../components/responses.yaml#/responses/Error400'
        '401':
          $ref: '../components/responses.yaml#/responses/Error401'
        '402':
          $ref: '../components/responses.yaml#/responses/Error402'
        '429':
          $ref: '../components/responses.yaml#/responses/RelayError429'
        '500':
          $ref: '../components/responses.yaml#/responses/Error500'
          description: |
            服务端内部错误。限流器故障时按 fail-closed 返回
            `code=rate_limit_check_failed`（500，不设 `Retry-After`）：无法判断
            是否超限就不放行，客户端不应把它当作可重试的限流。
        '503':
          $ref: '../components/responses.yaml#/responses/Error503'

  # Anthropic Messages 原生入口（W7/M1）。产品定位是「一个 key 接
  # OpenAI/Claude/Gemini」：Claude 原生客户端（含 Claude Code）直接调本端点。
  # 只服务 Anthropic 协议族渠道（anthropic / moonshot）；其它上游方向
  # fail-closed 501（R-59），零计费、零上游调用。
  /v1/messages:
    post:
      tags: [relay]
      operationId: createMessage
      x-relay-format: claude
      summary: Anthropic Messages（原生 Claude 入口）
      description: |
        请求/响应体遵循 Anthropic Messages API 公开规范（含 SSE 流式：
        `message_start` / `content_block_*` / `message_delta` / `message_stop`）。

        鉴权与 `/v1/chat/completions` 共用同一条令牌链：`Authorization` 恒生效；
        `x-api-key` 在本路径作为 Claude 客户端的兼容载体生效（relay-01 §3.1）。
        计费与 chat 走同一条 `BillingSession` 接缝（同一份预扣/结算语义）。

        方向矩阵（R-59）：只有 Anthropic 协议族渠道（`anthropic`、兼容
        Anthropic 协议的 `moonshot`）能承接；命中其它协议族渠道时返回 `501`
        `application/problem+json`
        （`type=https://newtg.dev/problems/endpoint-not-supported`），
        因为中继缺少 IR → Anthropic 的响应编码器，放行会向 Claude 客户端
        返回语义错误的形状。该分支零计费、零上游调用。
      security:
        - bearerToken: []
      externalDocs:
        description: Anthropic Messages API reference
        url: https://docs.anthropic.com/en/api/messages
      responses:
        '200':
          description: Anthropic message 对象或原生 SSE 事件流（schema 见上游公开规范）
        '400':
          $ref: '../components/responses.yaml#/responses/Error400'
        '401':
          $ref: '../components/responses.yaml#/responses/Error401'
        '402':
          $ref: '../components/responses.yaml#/responses/Error402'
        '403':
          description: 令牌模型白名单不允许该模型，或用户已被封禁
        '404':
          description: 模型已停用（`model_pricing.status=2`）
        '413':
          description: 请求体超过 32 MiB 上限
        '429':
          $ref: '../components/responses.yaml#/responses/RelayError429'
        '500':
          $ref: '../components/responses.yaml#/responses/Error500'
          description: |
            服务端内部错误。限流器故障时按 fail-closed 返回
            `code=rate_limit_check_failed`（500，不设 `Retry-After`）：无法判断
            是否超限就不放行，客户端不应把它当作可重试的限流。
        '501':
          $ref: '../components/responses.yaml#/responses/Error501'
        '502':
          description: 上游协议与端点不匹配、上游流不可用或适配器不支持流式
        '503':
          description: 该模型没有可用渠道

  # Responses 创建端点（T2 / P-01 / R-13）：只有插件任务渠道能执行；未命中
  # 插件原生路由时 fail-closed（501 problem+json），不回落通用中继。
  /v1/responses:
    post:
      tags: [relay]
      operationId: createResponse
      x-openai-compatible: true
      x-relay-format: openai_responses
      summary: OpenAI Responses 创建（仅插件任务渠道）
      description: |
        分发顺序（冻结）：先查插件 manifest 的 `routes[]`（方法 + 路径精确匹配），
        命中即转任务插件提交（`202` + `public_task_id`，计费由任务提交路径扣除）。

        未命中插件路由一律 `501` + `application/problem+json`
        （`type=https://newtg.dev/problems/endpoint-not-supported`）：通用中继是
        Chat 管线，无法表达 Responses 的 input/instructions 与响应形态，放行会
        返回与输入无关的 200 并按错误 usage 结算。该分支零计费、零上游调用。
      security:
        - bearerToken: []
      externalDocs:
        description: OpenAI Responses API reference
        url: https://platform.openai.com/docs/api-reference/responses
      responses:
        '202':
          description: 任务插件已接受；任务已持久化（`{public_task_id, state, upstream_task_id?}`）
        '400':
          $ref: '../components/responses.yaml#/responses/Error400'
        '401':
          $ref: '../components/responses.yaml#/responses/Error401'
        '402':
          $ref: '../components/responses.yaml#/responses/Error402'
        '404':
          description: 无匹配的插件任务渠道（插件未注册 / 无可用渠道）
        '409':
          description: 插件不可用（disabled / compile_failed）
        '413':
          description: 请求体超过任务提交上限 4 MiB（`maxTaskSubmitBytes`）
        '429':
          $ref: '../components/responses.yaml#/responses/RelayError429'
        '500':
          $ref: '../components/responses.yaml#/responses/Error500'
          description: |
            服务端内部错误。限流器故障时按 fail-closed 返回
            `code=rate_limit_check_failed`（500，不设 `Retry-After`）：无法判断
            是否超限就不放行，客户端不应把它当作可重试的限流。
        '501':
          $ref: '../components/responses.yaml#/responses/Error501'
        '502':
          description: 上游提交失败（任务插件路径）

  # Responses 产物回放（T3 / P-02 / 基线-09 §1.5）：只服务插件任务产物。
  # 网关不保存 Responses 对话历史——可回放的只有任务行派生出的产物。
  /v1/responses/{response_id}:
    get:
      tags: [relay]
      operationId: getResponse
      x-openai-compatible: true
      x-relay-format: openai_responses
      summary: 取回 Responses 对象（仅插件任务产物）
      description: |
        `resp_<x>` 映射为 `task_<x>` 后按任务检索面回放**产物**：
        `{id, object, created_at, status, model, output[]}`；`output[]` 每项为
        `{type, id, status, mime_type?, url}`，`url` 是宿主签发的产物能力 URL
        （与 `/v1/tasks/{key}/artifacts` 的 `content_url` 同一签名）。

        只服务同时满足以下条件的任务：产物可检索、归属当前令牌用户、插件在装
        且声明 `openai_responses` 协议。其余来源（非 `resp_` 前缀、任务不存在、
        属于他人、插件未声明协议或已卸载、无产物、已过保留期）**一律 404**
        且不区分原因——区分会把 `resp_` 空间变成存在性 oracle。

        插件若声明了 `GET /v1/responses/{id}` 原生路由，请求由插件接管
        （内建回放只在路由索引未命中时生效）。
      security:
        - bearerToken: []
      parameters:
        - $ref: '../components/params.yaml#/parameters/ResponseID'
      externalDocs:
        description: OpenAI Responses API reference
        url: https://platform.openai.com/docs/api-reference/responses
      responses:
        '200':
          description: |
            `{id, object:"response", created_at, status, model?, output[]}`。
            `status` 取任务状态：queued / in_progress / completed / failed /
            incomplete（任务状态 unknown）。
        '401':
          $ref: '../components/responses.yaml#/responses/Error401'
        '404':
          description: 该 Responses 对象不可检索（原因不区分，见上方说明）
        '500':
          $ref: '../components/responses.yaml#/responses/Error500'

  # Responses 压缩端点（T3 / P-03）：独立计费口径、不产生任务行。中继当前
  # 无法表达压缩语义，因此 fail-closed 501（不返回 chat 形态）。
  /v1/responses/compact:
    post:
      tags: [relay]
      operationId: compactResponse
      x-relay-format: openai_responses
      summary: OpenAI Responses 压缩（当前 fail-closed）
      description: |
        压缩端点按 G7-R51 有**独立计费口径**、**不产生任务行**，输出是压缩后的
        Responses 对象。通用中继没有该语义：转成 chat 形态会返回与压缩结果无关
        的对象并按真实 usage 结算（P-03 明文禁止）；原样转发上游则绕过定价。

        因此当前实现 fail-closed：`501` + `application/problem+json`
        （`type=https://newtg.dev/problems/endpoint-not-supported`），
        **不读请求体、不产生计费、不调用上游**。真实实现（独立计费表达式 +
        上游压缩转发）登记为后续项。
      security:
        - bearerToken: []
      responses:
        '401':
          $ref: '../components/responses.yaml#/responses/Error401'
        '501':
          $ref: '../components/responses.yaml#/responses/Error501'

  /pg/chat/completions:
    post:
      tags: [relay]
      operationId: playgroundChatCompletion
      x-openai-compatible: true
      summary: Playground 会话中继（OpenAI Chat Completions）
      description: |
        Playground 的会话身份中继（relay-01 §1.5 / modules-02 §2.15）。只接受
        浏览器会话 Cookie + CSRF；**任何 Authorization 头（含 Bearer）一律 403**，
        即使同时携带有效会话。内部把 /pg 重写为 /v1 后走同一条中继管线：
        跳过令牌额度与令牌模型白名单，但照常扣钱包/订阅、照常写 usage_logs
        （token_id = NULL），违规费不豁免。

        错误形状按来源分两类：
        - 会话鉴权（`PlaygroundSessionAuth`：缺会话 401、携带 Authorization
          的 403 session_required）用 OpenAI 错误信封；
        - CSRF/Origin 校验失败（写路径与其它 /api/* 同口径）用 RFC 7807
          problem+json（403 csrf_failed）；
        - 402 余额不足、429 限流、上游 5xx 用 OpenAI 错误信封，均附
          X-Request-ID。
      security:
        - sessionCookie: []
      parameters:
        - $ref: '../components/params.yaml#/parameters/CSRFToken'
      externalDocs:
        description: OpenAI Chat Completions API reference
        url: https://platform.openai.com/docs/api-reference/chat
      responses:
        '200':
          description: ChatCompletion 对象或 SSE 流（schema 见上游公开规范）
        '400':
          $ref: '../components/responses.yaml#/responses/Error400'
        '401':
          description: 缺少/失效的会话 Cookie（OpenAI 错误信封）
        '402':
          $ref: '../components/responses.yaml#/responses/Error402'
        '403':
          description: |
            - 携带 Authorization（API 令牌不可用于 Playground）：OpenAI 错误信封
              （code=session_required）；
            - 模型不在用户当前分组的可用清单：OpenAI 错误信封
              （code=model_not_available）；
            - CSRF/同源校验失败：RFC 7807 problem+json（csrf_failed）。
        '404':
          description: 不支持的 /pg/* 子路径
        '429':
          $ref: '../components/responses.yaml#/responses/RelayError429'
        '500':
          $ref: '../components/responses.yaml#/responses/Error500'
          description: |
            服务端内部错误。限流器故障时按 fail-closed 返回
            `code=rate_limit_check_failed`（500，不设 `Retry-After`）：无法判断
            是否超限就不放行，客户端不应把它当作可重试的限流。
        '503':
          $ref: '../components/responses.yaml#/responses/Error503'

  /pg/models:
    get:
      tags: [relay]
      operationId: playgroundListModels
      summary: Playground 模型清单（会话身份）
      description: |
        启用渠道支持模型的去重并集（与 GET /v1/models 同源）。按模型/分组
        展示可用性以 GET /api/status 的 usable_groups 为准。
      security:
        - sessionCookie: []
      responses:
        '200':
          description: OpenAI ListModels 对象
        '401':
          description: 缺少/失效的会话 Cookie

  # ---------------------------------------------------------------------------
  # 任务数据面（M6d Task 6a / relay-06 §10.2）。与 chat 共用 Bearer 令牌链；
  # 响应体真源在 handlers_tasks.go（本文件不内联协议 schema）。
  # ---------------------------------------------------------------------------
  /v1/tasks/{key}:
    post:
      tags: [relay]
      operationId: submitTask
      summary: 提交任务插件任务
      description: |
        `{key}` 是插件 key（即平台名）。提交成功后 202：
        `{public_task_id, state, upstream_task_id?}`。
        插件未注册 404；已禁用/编译失败 409；无可用渠道 404 model_not_found；
        预扣失败 402（不落任务行、不调用上游）。
      security:
        - bearerToken: []
      parameters:
        - $ref: '../components/params.yaml#/parameters/TaskPluginKey'
      responses:
        '202':
          description: 已接受；任务已持久化（终态或待轮询）
        '400':
          $ref: '../components/responses.yaml#/responses/Error400'
        '401':
          $ref: '../components/responses.yaml#/responses/Error401'
        '402':
          $ref: '../components/responses.yaml#/responses/Error402'
        '404':
          $ref: '../components/responses.yaml#/responses/Error404'
        '409':
          description: 插件不可用（disabled / compile_failed）
        '413':
          description: 请求体超过 4 MiB
        '429':
          $ref: '../components/responses.yaml#/responses/RelayError429'
        '500':
          $ref: '../components/responses.yaml#/responses/Error500'
          description: |
            服务端内部错误。限流器故障时按 fail-closed 返回
            `code=rate_limit_check_failed`（500，不设 `Retry-After`）：无法判断
            是否超限就不放行，客户端不应把它当作可重试的限流。
        '502':
          description: 上游提交失败（含白名单拒绝、重定向、超时、非 2xx、解析失败）
    get:
      tags: [relay]
      operationId: getTask
      summary: 查询任务状态
      description: |
        归属过滤：不存在或不属于当前用户一律 404（不区分原因）。
        `usage` 只包含插件声明字段的数量，绝不返回额度/价格。
      security:
        - bearerToken: []
      parameters:
        - $ref: '../components/params.yaml#/parameters/TaskPluginKey'
        - $ref: '../components/params.yaml#/parameters/TaskIDQuery'
      responses:
        '200':
          description: '{task_id,state,raw_state,progress_percent,usage?,artifacts?,fail_reason?}'
        '400':
          $ref: '../components/responses.yaml#/responses/Error400'
        '401':
          $ref: '../components/responses.yaml#/responses/Error401'
        '404':
          $ref: '../components/responses.yaml#/responses/Error404'
        '500':
          $ref: '../components/responses.yaml#/responses/Error500'

  /v1/tasks/{key}/artifacts:
    get:
      tags: [relay]
      operationId: listTaskArtifacts
      summary: 列出任务产物
      description: |
        产物从持久化 task.data 投影，不建第二份真相。每项包含宿主签发的
        `content_url`（能力 URL，长期有效；`access` 参数在日志中脱敏）。
      security:
        - bearerToken: []
      parameters:
        - $ref: '../components/params.yaml#/parameters/TaskPluginKey'
        - $ref: '../components/params.yaml#/parameters/TaskIDQuery'
      responses:
        '200':
          description: '{items:[{key,type,mime_type?,content_url}]}'
        '400':
          $ref: '../components/responses.yaml#/responses/Error400'
        '401':
          $ref: '../components/responses.yaml#/responses/Error401'
        '404':
          $ref: '../components/responses.yaml#/responses/Error404'
        '500':
          $ref: '../components/responses.yaml#/responses/Error500'

  # 产物内容（M6d T6b / relay-06 §10.5）：能力式鉴权，不挂 Bearer。
  /v1/tasks/{key}/artifacts/{artifact_key}/content:
    get:
      tags: [relay]
      operationId: getTaskArtifactContent
      summary: 取任务产物内容（能力 URL）
      description: |
        `access` 是宿主签发的 HMAC 票据，绑定插件 key、task_id 与
        artifact_key；设计上长期有效（无过期），轮换服务端密钥即可整体撤销。
        签名无效/过期 403；任务或产物不存在 404；上游失败 502。
        响应为流式（上限 64 MiB），HEAD 只返回头部。
      security: []
      parameters:
        - $ref: '../components/params.yaml#/parameters/TaskPluginKey'
        - $ref: '../components/params.yaml#/parameters/TaskArtifactKey'
        - $ref: '../components/params.yaml#/parameters/TaskIDQuery'
        - $ref: '../components/params.yaml#/parameters/TaskArtifactAccess'
      responses:
        '200':
          description: 产物二进制流（Content-Type 取上游或产物声明；响应体真源不在本文件内联）
        '400':
          $ref: '../components/responses.yaml#/responses/Error400'
        '403':
          description: access 票据无效或已过期
        '404':
          $ref: '../components/responses.yaml#/responses/Error404'
        '502':
          description: 上游拒绝或取产物失败
        '503':
          description: 插件当前不可用
    head:
      tags: [relay]
      operationId: headTaskArtifactContent
      summary: 取任务产物内容（HEAD）
      description: |
        与 GET 使用同一能力票据与校验，只返回状态码与头部，不写响应体。
        签名无效/过期 403；任务或产物不存在 404；上游失败 502。
      security: []
      parameters:
        - $ref: '../components/params.yaml#/parameters/TaskPluginKey'
        - $ref: '../components/params.yaml#/parameters/TaskArtifactKey'
        - $ref: '../components/params.yaml#/parameters/TaskIDQuery'
        - $ref: '../components/params.yaml#/parameters/TaskArtifactAccess'
      responses:
        '200':
          description: 头部可用（响应体为空）
        '400':
          $ref: '../components/responses.yaml#/responses/Error400'
        '403':
          description: access 票据无效或已过期
        '404':
          $ref: '../components/responses.yaml#/responses/Error404'
        '502':
          description: 上游拒绝或取产物失败
        '503':
          description: 插件当前不可用

  # OpenAI Videos（T4 / P-04 / R-10）：tasks 数据面的纯内建薄封装。
  # 插件 key 由 `model` 解析（请求体没有路径段），响应是 OpenAI video 对象。
  /v1/videos:
    post:
      tags: [relay]
      operationId: createVideo
      x-openai-compatible: true
      summary: 创建视频生成任务（任务插件）
      description: |
        请求体为 JSON（**不支持 multipart**，返回 400）。`model` 决定任务插件：
        宿主在当前插件快照中解析**同时声明 `meta.protocols.openai_video` 且
        `meta.models` 命中该模型**的唯一插件（R-15）；0 命中 404
        `model_not_found`，多命中 400（歧义不做静默择优）。

        提交与 `/v1/tasks/{key}` 完全同一条管线（渠道选择 → 预扣 → 上游提交 →
        tasks 落库），计费只发生一次。成功返回 OpenAI video 对象（`status=queued`
        或即时终态 `completed`），随后用 `GET /v1/videos/{id}` 轮询。
      security:
        - bearerToken: []
      externalDocs:
        description: OpenAI Videos API reference
        url: https://platform.openai.com/docs/api-reference/videos
      responses:
        '200':
          description: OpenAI video 对象（`{id, object:"video", created_at, status, model, progress, seconds?, size?, error?}`）
        '400':
          $ref: '../components/responses.yaml#/responses/Error400'
        '401':
          $ref: '../components/responses.yaml#/responses/Error401'
        '402':
          $ref: '../components/responses.yaml#/responses/Error402'
        '403':
          description: 令牌模型白名单不允许该模型
        '404':
          description: 没有任务插件声明该模型
        '413':
          description: 请求体超过任务提交上限 4 MiB
        '429':
          $ref: '../components/responses.yaml#/responses/RelayError429'
        '500':
          $ref: '../components/responses.yaml#/responses/Error500'
          description: |
            服务端内部错误。限流器故障时按 fail-closed 返回
            `code=rate_limit_check_failed`（500，不设 `Retry-After`）：无法判断
            是否超限就不放行，客户端不应把它当作可重试的限流。
        '502':
          description: 上游提交失败（提交管线已退款）

  # 视频检索与内容（T4 / P-04）：归属校验，他人任务与不存在同为 404。
  /v1/videos/{video_id}:
    get:
      tags: [relay]
      operationId: getVideo
      x-openai-compatible: true
      summary: 取回视频任务
      description: |
        `video_<x>` 映射为 `task_<x>` 后按 (user_id, public_task_id) 读取。
        任务所属插件必须仍在装且声明 `openai_video`，否则 404（R-15，与
        Responses 的 P-02 同口径，不泄露存在性）。
        状态映射：success→completed、failure→failed、in_progress→in_progress、
        其余（含 unknown）→queued（非终态，与轮询器口径一致）。
      security:
        - bearerToken: []
      parameters:
        - $ref: '../components/params.yaml#/parameters/VideoID'
      externalDocs:
        description: OpenAI Videos API reference
        url: https://platform.openai.com/docs/api-reference/videos
      responses:
        '200':
          description: OpenAI video 对象（failed 时带 error 子对象）
        '401':
          $ref: '../components/responses.yaml#/responses/Error401'
        '404':
          description: 视频不存在、不属于本人或 id 形状非法（不区分原因）
        '500':
          $ref: '../components/responses.yaml#/responses/Error500'

  /v1/videos/{video_id}/content:
    get:
      tags: [relay]
      operationId: getVideoContent
      summary: 取视频内容（Bearer 归属校验）
      description: |
        代理任务中 `type=video` 的产物；**不回落**到其它类型（封面图/字幕
        不得被当视频返回）。任务所属插件必须声明 `openai_video`（R-15）。
        与 `/v1/tasks/{key}/artifacts/{artifact_key}/content` 不同，这里用
        Bearer 归属校验而不是能力票据（OpenAI SDK 的约定）。没有视频产物时
        404。HEAD 只返回头部。
      security:
        - bearerToken: []
      parameters:
        - $ref: '../components/params.yaml#/parameters/VideoID'
      responses:
        '200':
          description: 视频二进制流（Content-Type 取上游或产物声明）
        '400':
          $ref: '../components/responses.yaml#/responses/Error400'
        '401':
          $ref: '../components/responses.yaml#/responses/Error401'
        '404':
          description: 视频不存在、不属于本人或没有可检索产物
        '502':
          description: 上游拒绝或取产物失败
        '503':
          description: 插件当前不可用

  # OpenAI Batches（T4 / P-04）：父批次只做聚合，子请求逐行建 tasks 行。
  /v1/batches:
    post:
      tags: [relay]
      operationId: createBatch
      x-openai-compatible: true
      summary: 创建批次（内联 requests[]）
      description: |
        本网关没有 `/v1/files` 数据面，因此只接受**内联** `requests[]`（JSONL 行
        同形：`custom_id/method/url/body`）；只给 `input_file_id` 时返回 501
        `problem+json`，绝不伪造空批次。每行 `url` 目前只支持 `/v1/videos`。

        顺序冻结为 R-16：全部行校验 → **先落父批次行**（失败即 500 且零计费）
        → 逐行提交（复用 `/v1/videos` 的提交管线）→ 逐行关联。提交失败或关联
        失败的行计入 `request_counts.failed`，不把整批 500 掉；父行先落库保证
        客户端始终拿得到 batch id。

        **非幂等**：本端点没有幂等键，重试会重新提交每一行——已成功的行会重复
        建任务并重复计费。`custom_id` 只在请求内做唯一性校验，不落库、服务端
        不做去重；幂等键与批次列表端点不在本批（已登记）。
      security:
        - bearerToken: []
      externalDocs:
        description: OpenAI Batch API reference
        url: https://platform.openai.com/docs/api-reference/batch
      responses:
        '200':
          description: OpenAI batch 对象 + 宿主扩展 `items[]`
        '400':
          $ref: '../components/responses.yaml#/responses/Error400'
        '401':
          $ref: '../components/responses.yaml#/responses/Error401'
        '403':
          description: 令牌模型白名单不允许某行的模型
        '404':
          description: 某行的模型没有任务插件
        '413':
          description: 请求体超过批次上限 8 MiB
        '500':
          $ref: '../components/responses.yaml#/responses/Error500'
        '501':
          $ref: '../components/responses.yaml#/responses/Error501'

  /v1/batches/{batch_id}:
    get:
      tags: [relay]
      operationId: getBatch
      x-openai-compatible: true
      summary: 取回批次聚合视图
      description: |
        `request_counts` 由子任务状态**现算**：total 是提交行数，completed 是
        `state=success` 的子任务数，failed 是 `state=failure` 的子任务数加上
        「提交失败、没有任务行」的行数。任一子任务非终态 → `in_progress`；
        全部终态 → `completed`（有成功）或 `failed`（全失败）。
      security:
        - bearerToken: []
      parameters:
        - $ref: '../components/params.yaml#/parameters/BatchID'
      externalDocs:
        description: OpenAI Batch API reference
        url: https://platform.openai.com/docs/api-reference/batch
      responses:
        '200':
          description: OpenAI batch 对象 + 宿主扩展 `items[]`
        '401':
          $ref: '../components/responses.yaml#/responses/Error401'
        '404':
          description: 批次不存在或不属于本人（不区分原因）
        '500':
          $ref: '../components/responses.yaml#/responses/Error500'

  /v1/batches/{batch_id}/cancel:
    post:
      tags: [relay]
      operationId: cancelBatch
      summary: 取消批次（当前 fail-closed）
      description: |
        子任务在批次创建时已经提交到上游，任务插件没有取消钩子；只改本地状态
        会造成「上游仍在计费、本地已退款」的账实不符，并会被轮询器推进回 success。
        因此本端点返回 501 `problem+json`（`type=.../endpoint-not-supported`），
        **零计费、零状态变更**；归属校验先于 501（他人批次 404）。
      security:
        - bearerToken: []
      parameters:
        - $ref: '../components/params.yaml#/parameters/BatchID'
      responses:
        '401':
          $ref: '../components/responses.yaml#/responses/Error401'
        '404':
          description: 批次不存在或不属于本人
        '501':
          $ref: '../components/responses.yaml#/responses/Error501'

  # ---------------------------------------------------------------------------
  # 绘图任务族（W8/MJ-a2）：12 条提交端点（relay-05 §1.1）。
  #
  # 错误体不是 OpenAI 信封，也不是 RFC 7807：MJ 客户端只解析
  # `{code,description[,result]}`（R-MJ-17）。成功 200 + `{code:1,...}`；
  # 失败 4xx/5xx + `{code≠0,description}`。上游 URL/凭据永不进入响应体。
  #
  # 路径别名 `/<seg>/mj/*`（seg ∉ {api,v1,pg,healthz,readyz}）在 mux 之前
  # 重写到本族（R-MJ-07）；别名不单独登记，语义与 /mj 完全等价。
  # ---------------------------------------------------------------------------
  /mj/submit/imagine:
    post:
      tags: [relay]
      operationId: mjSubmitImagine
      summary: Midjourney 文生图提交
      description: |
        `prompt` 必填；`botType`/`notifyHook`/`accountFilter`/`state` 可选
        （`notifyHook`/`accountFilter` 默认由网关剥离）。受理成功返回
        `{code:1,description,result:<MjId>}`；上游 21/22/23 重新编码为 code 1。
        提交不重试、提交时预扣（R-MJ-01）；失败不落任务行并全额退款。
      security:
        - bearerToken: []
      responses:
        '200':
          description: MJ 受理信封（`result` 为 MjId）
        '400':
          description: 参数/上界校验失败或未知端点（`{code:4,description}`）
        '401':
          description: 令牌无效（`{code:5,description}`）
        '402':
          description: 余额不足（`{code:4,description:quota_not_enough}`）
        '403':
          description: 功能未开启或令牌模型白名单拒绝
        '429':
          description: 准入限流或上游分组饱和（`{code,description}`）
        '500':
          description: 内部错误（`{code:5,description}`）
        '502':
          description: 上游不可达/坏响应/受理失败
        '503':
          description: 没有可用的 MJ 渠道（`{code:5,description:no_available_channel}`）

