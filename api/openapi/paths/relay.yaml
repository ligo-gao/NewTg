# 中继协议面（platform-03 §9.3）：只登记路径/方法/tag/security/公共错误，
# 不重定义上游 schema；x-codegen:false 排除类型生成。
# 不登记（路由不注册，返回标准 404）：/v1/files*、/v1/fine-tunes*、
# /v1/images/variations、/v1/edits、DELETE /v1/models/{model}（决议 H）。
paths:
  /v1/chat/completions:
    post:
      tags: [relay]
      operationId: createChatCompletion
      x-codegen: false
      x-openai-compatible: true
      summary: OpenAI-compatible chat completions
      description: |
        请求/响应体遵循 OpenAI Chat Completions 公开规范（含 SSE 流式）。
        额度不足返回 402 + Problem402 扩展。
      security:
        - bearerToken: []
      externalDocs:
        description: OpenAI Chat Completions API reference
        url: https://platform.openai.com/docs/api-reference/chat
      responses:
        '200':
          description: ChatCompletion 对象或 SSE 流（schema 见上游公开规范）
        '400':
          $ref: '../components/responses.yaml#/responses/Error400'
        '401':
          $ref: '../components/responses.yaml#/responses/Error401'
        '402':
          $ref: '../components/responses.yaml#/responses/Error402'
        '429':
          $ref: '../components/responses.yaml#/responses/Error429'
        '500':
          $ref: '../components/responses.yaml#/responses/Error500'
        '503':
          $ref: '../components/responses.yaml#/responses/Error503'

  /pg/chat/completions:
    post:
      tags: [relay]
      operationId: playgroundChatCompletion
      x-codegen: false
      x-openai-compatible: true
      summary: Playground 会话中继（OpenAI Chat Completions）
      description: |
        Playground 的会话身份中继（relay-01 §1.5 / modules-02 §2.15）。只接受
        浏览器会话 Cookie + CSRF；**任何 Authorization 头（含 Bearer）一律 403**，
        即使同时携带有效会话。内部把 /pg 重写为 /v1 后走同一条中继管线：
        跳过令牌额度与令牌模型白名单，但照常扣钱包/订阅、照常写 usage_logs
        （token_id = NULL），违规费不豁免。

        错误形状按来源分两类：
        - 会话鉴权（`PlaygroundSessionAuth`：缺会话 401、携带 Authorization
          的 403 session_required）用 OpenAI 错误信封；
        - CSRF/Origin 校验失败（写路径与其它 /api/* 同口径）用 RFC 7807
          problem+json（403 csrf_failed）；
        - 402 余额不足、429 限流、上游 5xx 用 OpenAI 错误信封，均附
          X-Request-ID。
      security:
        - sessionCookie: []
      parameters:
        - $ref: '../components/params.yaml#/parameters/CSRFToken'
      externalDocs:
        description: OpenAI Chat Completions API reference
        url: https://platform.openai.com/docs/api-reference/chat
      responses:
        '200':
          description: ChatCompletion 对象或 SSE 流（schema 见上游公开规范）
        '400':
          $ref: '../components/responses.yaml#/responses/Error400'
        '401':
          description: 缺少/失效的会话 Cookie（OpenAI 错误信封）
        '402':
          $ref: '../components/responses.yaml#/responses/Error402'
        '403':
          description: |
            - 携带 Authorization（API 令牌不可用于 Playground）：OpenAI 错误信封
              （code=session_required）；
            - 模型不在用户当前分组的可用清单：OpenAI 错误信封
              （code=model_not_available）；
            - CSRF/同源校验失败：RFC 7807 problem+json（csrf_failed）。
        '404':
          description: 不支持的 /pg/* 子路径
        '429':
          $ref: '../components/responses.yaml#/responses/Error429'
        '500':
          $ref: '../components/responses.yaml#/responses/Error500'
        '503':
          $ref: '../components/responses.yaml#/responses/Error503'

  /pg/models:
    get:
      tags: [relay]
      operationId: playgroundListModels
      x-codegen: false
      summary: Playground 模型清单（会话身份）
      description: |
        启用渠道支持模型的去重并集（与 GET /v1/models 同源）。按模型/分组
        展示可用性以 GET /api/status 的 usable_groups 为准。
      security:
        - sessionCookie: []
      responses:
        '200':
          description: OpenAI ListModels 对象
        '401':
          description: 缺少/失效的会话 Cookie
