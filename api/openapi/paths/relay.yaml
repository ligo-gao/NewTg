# 中继协议面（platform-03 §9.3）：只登记路径/方法/tag/security/公共错误，
# 不重定义上游 schema（本文件不出现 `schema:`，请求/响应体真源在
# contract/adapter；`scripts/check_openapi_layout.sh` 断言这一点）。
# path 条目会进入 bundle 与前端 path 类型（openapi-typescript 不认
# x-codegen），因此登记的路径必须与后端实际注册面一致：
#   - /v1 对话族 + 多模态族由 Register 注册；
#   - /pg 只有对话族（POST /pg/chat/completions、GET /pg/models）。
# 不登记（路由不注册，返回标准 404）：/v1/files*、/v1/fine-tunes*、
# /v1/images/variations、/v1/edits、DELETE /v1/models/{model}（决议 H）。
paths:
  /v1/chat/completions:
    post:
      tags: [relay]
      operationId: createChatCompletion
      x-openai-compatible: true
      summary: OpenAI-compatible chat completions
      description: |
        请求/响应体遵循 OpenAI Chat Completions 公开规范（含 SSE 流式）。
        额度不足返回 402 + Problem402 扩展。
      security:
        - bearerToken: []
      externalDocs:
        description: OpenAI Chat Completions API reference
        url: https://platform.openai.com/docs/api-reference/chat
      responses:
        '200':
          description: ChatCompletion 对象或 SSE 流（schema 见上游公开规范）
        '400':
          $ref: '../components/responses.yaml#/responses/Error400'
        '401':
          $ref: '../components/responses.yaml#/responses/Error401'
        '402':
          $ref: '../components/responses.yaml#/responses/Error402'
        '429':
          $ref: '../components/responses.yaml#/responses/Error429'
        '500':
          $ref: '../components/responses.yaml#/responses/Error500'
        '503':
          $ref: '../components/responses.yaml#/responses/Error503'

  # Responses 创建端点（T2 / P-01 / R-13）：只有插件任务渠道能执行；未命中
  # 插件原生路由时 fail-closed（501 problem+json），不回落通用中继。
  /v1/responses:
    post:
      tags: [relay]
      operationId: createResponse
      x-openai-compatible: true
      x-relay-format: openai_responses
      summary: OpenAI Responses 创建（仅插件任务渠道）
      description: |
        分发顺序（冻结）：先查插件 manifest 的 `routes[]`（方法 + 路径精确匹配），
        命中即转任务插件提交（`202` + `public_task_id`，计费由任务提交路径扣除）。

        未命中插件路由一律 `501` + `application/problem+json`
        （`type=https://newtg.dev/problems/endpoint-not-supported`）：通用中继是
        Chat 管线，无法表达 Responses 的 input/instructions 与响应形态，放行会
        返回与输入无关的 200 并按错误 usage 结算。该分支零计费、零上游调用。
      security:
        - bearerToken: []
      externalDocs:
        description: OpenAI Responses API reference
        url: https://platform.openai.com/docs/api-reference/responses
      responses:
        '202':
          description: 任务插件已接受；任务已持久化（`{public_task_id, state, upstream_task_id?}`）
        '400':
          $ref: '../components/responses.yaml#/responses/Error400'
        '401':
          $ref: '../components/responses.yaml#/responses/Error401'
        '402':
          $ref: '../components/responses.yaml#/responses/Error402'
        '404':
          description: 无匹配的插件任务渠道（插件未注册 / 无可用渠道）
        '409':
          description: 插件不可用（disabled / compile_failed）
        '413':
          description: 请求体超过任务提交上限 4 MiB（`maxTaskSubmitBytes`）
        '500':
          $ref: '../components/responses.yaml#/responses/Error500'
        '501':
          $ref: '../components/responses.yaml#/responses/Error501'
        '502':
          description: 上游提交失败（任务插件路径）

  # Responses 产物回放（T3 / P-02 / 基线-09 §1.5）：只服务插件任务产物。
  # 网关不保存 Responses 对话历史——可回放的只有任务行派生出的产物。
  /v1/responses/{response_id}:
    get:
      tags: [relay]
      operationId: getResponse
      x-openai-compatible: true
      x-relay-format: openai_responses
      summary: 取回 Responses 对象（仅插件任务产物）
      description: |
        `resp_<x>` 映射为 `task_<x>` 后按任务检索面回放**产物**：
        `{id, object, created_at, status, model, output[]}`；`output[]` 每项为
        `{type, id, status, mime_type?, url}`，`url` 是宿主签发的产物能力 URL
        （与 `/v1/tasks/{key}/artifacts` 的 `content_url` 同一签名）。

        只服务同时满足以下条件的任务：产物可检索、归属当前令牌用户、插件在装
        且声明 `openai_responses` 协议。其余来源（非 `resp_` 前缀、任务不存在、
        属于他人、插件未声明协议或已卸载、无产物、已过保留期）**一律 404**
        且不区分原因——区分会把 `resp_` 空间变成存在性 oracle。

        插件若声明了 `GET /v1/responses/{id}` 原生路由，请求由插件接管
        （内建回放只在路由索引未命中时生效）。
      security:
        - bearerToken: []
      parameters:
        - $ref: '../components/params.yaml#/parameters/ResponseID'
      externalDocs:
        description: OpenAI Responses API reference
        url: https://platform.openai.com/docs/api-reference/responses
      responses:
        '200':
          description: |
            `{id, object:"response", created_at, status, model?, output[]}`。
            `status` 取任务状态：queued / in_progress / completed / failed /
            incomplete（任务状态 unknown）。
        '401':
          $ref: '../components/responses.yaml#/responses/Error401'
        '404':
          description: 该 Responses 对象不可检索（原因不区分，见上方说明）
        '500':
          $ref: '../components/responses.yaml#/responses/Error500'

  # Responses 压缩端点（T3 / P-03）：独立计费口径、不产生任务行。中继当前
  # 无法表达压缩语义，因此 fail-closed 501（不返回 chat 形态）。
  /v1/responses/compact:
    post:
      tags: [relay]
      operationId: compactResponse
      x-relay-format: openai_responses
      summary: OpenAI Responses 压缩（当前 fail-closed）
      description: |
        压缩端点按 G7-R51 有**独立计费口径**、**不产生任务行**，输出是压缩后的
        Responses 对象。通用中继没有该语义：转成 chat 形态会返回与压缩结果无关
        的对象并按真实 usage 结算（P-03 明文禁止）；原样转发上游则绕过定价。

        因此当前实现 fail-closed：`501` + `application/problem+json`
        （`type=https://newtg.dev/problems/endpoint-not-supported`），
        **不读请求体、不产生计费、不调用上游**。真实实现（独立计费表达式 +
        上游压缩转发）登记为后续项。
      security:
        - bearerToken: []
      responses:
        '401':
          $ref: '../components/responses.yaml#/responses/Error401'
        '501':
          $ref: '../components/responses.yaml#/responses/Error501'

  /pg/chat/completions:
    post:
      tags: [relay]
      operationId: playgroundChatCompletion
      x-openai-compatible: true
      summary: Playground 会话中继（OpenAI Chat Completions）
      description: |
        Playground 的会话身份中继（relay-01 §1.5 / modules-02 §2.15）。只接受
        浏览器会话 Cookie + CSRF；**任何 Authorization 头（含 Bearer）一律 403**，
        即使同时携带有效会话。内部把 /pg 重写为 /v1 后走同一条中继管线：
        跳过令牌额度与令牌模型白名单，但照常扣钱包/订阅、照常写 usage_logs
        （token_id = NULL），违规费不豁免。

        错误形状按来源分两类：
        - 会话鉴权（`PlaygroundSessionAuth`：缺会话 401、携带 Authorization
          的 403 session_required）用 OpenAI 错误信封；
        - CSRF/Origin 校验失败（写路径与其它 /api/* 同口径）用 RFC 7807
          problem+json（403 csrf_failed）；
        - 402 余额不足、429 限流、上游 5xx 用 OpenAI 错误信封，均附
          X-Request-ID。
      security:
        - sessionCookie: []
      parameters:
        - $ref: '../components/params.yaml#/parameters/CSRFToken'
      externalDocs:
        description: OpenAI Chat Completions API reference
        url: https://platform.openai.com/docs/api-reference/chat
      responses:
        '200':
          description: ChatCompletion 对象或 SSE 流（schema 见上游公开规范）
        '400':
          $ref: '../components/responses.yaml#/responses/Error400'
        '401':
          description: 缺少/失效的会话 Cookie（OpenAI 错误信封）
        '402':
          $ref: '../components/responses.yaml#/responses/Error402'
        '403':
          description: |
            - 携带 Authorization（API 令牌不可用于 Playground）：OpenAI 错误信封
              （code=session_required）；
            - 模型不在用户当前分组的可用清单：OpenAI 错误信封
              （code=model_not_available）；
            - CSRF/同源校验失败：RFC 7807 problem+json（csrf_failed）。
        '404':
          description: 不支持的 /pg/* 子路径
        '429':
          $ref: '../components/responses.yaml#/responses/Error429'
        '500':
          $ref: '../components/responses.yaml#/responses/Error500'
        '503':
          $ref: '../components/responses.yaml#/responses/Error503'

  /pg/models:
    get:
      tags: [relay]
      operationId: playgroundListModels
      summary: Playground 模型清单（会话身份）
      description: |
        启用渠道支持模型的去重并集（与 GET /v1/models 同源）。按模型/分组
        展示可用性以 GET /api/status 的 usable_groups 为准。
      security:
        - sessionCookie: []
      responses:
        '200':
          description: OpenAI ListModels 对象
        '401':
          description: 缺少/失效的会话 Cookie

  # ---------------------------------------------------------------------------
  # 任务数据面（M6d Task 6a / relay-06 §10.2）。与 chat 共用 Bearer 令牌链；
  # 响应体真源在 handlers_tasks.go（本文件不内联协议 schema）。
  # ---------------------------------------------------------------------------
  /v1/tasks/{key}:
    post:
      tags: [relay]
      operationId: submitTask
      summary: 提交任务插件任务
      description: |
        `{key}` 是插件 key（即平台名）。提交成功后 202：
        `{public_task_id, state, upstream_task_id?}`。
        插件未注册 404；已禁用/编译失败 409；无可用渠道 404 model_not_found；
        预扣失败 402（不落任务行、不调用上游）。
      security:
        - bearerToken: []
      parameters:
        - $ref: '../components/params.yaml#/parameters/TaskPluginKey'
      responses:
        '202':
          description: 已接受；任务已持久化（终态或待轮询）
        '400':
          $ref: '../components/responses.yaml#/responses/Error400'
        '401':
          $ref: '../components/responses.yaml#/responses/Error401'
        '402':
          $ref: '../components/responses.yaml#/responses/Error402'
        '404':
          $ref: '../components/responses.yaml#/responses/Error404'
        '409':
          description: 插件不可用（disabled / compile_failed）
        '413':
          description: 请求体超过 4 MiB
        '500':
          $ref: '../components/responses.yaml#/responses/Error500'
        '502':
          description: 上游提交失败（含白名单拒绝、重定向、超时、非 2xx、解析失败）
    get:
      tags: [relay]
      operationId: getTask
      summary: 查询任务状态
      description: |
        归属过滤：不存在或不属于当前用户一律 404（不区分原因）。
        `usage` 只包含插件声明字段的数量，绝不返回额度/价格。
      security:
        - bearerToken: []
      parameters:
        - $ref: '../components/params.yaml#/parameters/TaskPluginKey'
        - $ref: '../components/params.yaml#/parameters/TaskIDQuery'
      responses:
        '200':
          description: '{task_id,state,raw_state,progress_percent,usage?,artifacts?,fail_reason?}'
        '400':
          $ref: '../components/responses.yaml#/responses/Error400'
        '401':
          $ref: '../components/responses.yaml#/responses/Error401'
        '404':
          $ref: '../components/responses.yaml#/responses/Error404'
        '500':
          $ref: '../components/responses.yaml#/responses/Error500'

  /v1/tasks/{key}/artifacts:
    get:
      tags: [relay]
      operationId: listTaskArtifacts
      summary: 列出任务产物
      description: |
        产物从持久化 task.data 投影，不建第二份真相。每项包含宿主签发的
        `content_url`（能力 URL，长期有效；`access` 参数在日志中脱敏）。
      security:
        - bearerToken: []
      parameters:
        - $ref: '../components/params.yaml#/parameters/TaskPluginKey'
        - $ref: '../components/params.yaml#/parameters/TaskIDQuery'
      responses:
        '200':
          description: '{items:[{key,type,mime_type?,content_url}]}'
        '400':
          $ref: '../components/responses.yaml#/responses/Error400'
        '401':
          $ref: '../components/responses.yaml#/responses/Error401'
        '404':
          $ref: '../components/responses.yaml#/responses/Error404'
        '500':
          $ref: '../components/responses.yaml#/responses/Error500'

  # 产物内容（M6d T6b / relay-06 §10.5）：能力式鉴权，不挂 Bearer。
  /v1/tasks/{key}/artifacts/{artifact_key}/content:
    get:
      tags: [relay]
      operationId: getTaskArtifactContent
      summary: 取任务产物内容（能力 URL）
      description: |
        `access` 是宿主签发的 HMAC 票据，绑定插件 key、task_id 与
        artifact_key；设计上长期有效（无过期），轮换服务端密钥即可整体撤销。
        签名无效/过期 403；任务或产物不存在 404；上游失败 502。
        响应为流式（上限 64 MiB），HEAD 只返回头部。
      security: []
      parameters:
        - $ref: '../components/params.yaml#/parameters/TaskPluginKey'
        - $ref: '../components/params.yaml#/parameters/TaskArtifactKey'
        - $ref: '../components/params.yaml#/parameters/TaskIDQuery'
        - $ref: '../components/params.yaml#/parameters/TaskArtifactAccess'
      responses:
        '200':
          description: 产物二进制流（Content-Type 取上游或产物声明；响应体真源不在本文件内联）
        '400':
          $ref: '../components/responses.yaml#/responses/Error400'
        '403':
          description: access 票据无效或已过期
        '404':
          $ref: '../components/responses.yaml#/responses/Error404'
        '502':
          description: 上游拒绝或取产物失败
        '503':
          description: 插件当前不可用
    head:
      tags: [relay]
      operationId: headTaskArtifactContent
      summary: 取任务产物内容（HEAD）
      description: |
        与 GET 使用同一能力票据与校验，只返回状态码与头部，不写响应体。
        签名无效/过期 403；任务或产物不存在 404；上游失败 502。
      security: []
      parameters:
        - $ref: '../components/params.yaml#/parameters/TaskPluginKey'
        - $ref: '../components/params.yaml#/parameters/TaskArtifactKey'
        - $ref: '../components/params.yaml#/parameters/TaskIDQuery'
        - $ref: '../components/params.yaml#/parameters/TaskArtifactAccess'
      responses:
        '200':
          description: 头部可用（响应体为空）
        '400':
          $ref: '../components/responses.yaml#/responses/Error400'
        '403':
          description: access 票据无效或已过期
        '404':
          $ref: '../components/responses.yaml#/responses/Error404'
        '502':
          description: 上游拒绝或取产物失败
        '503':
          description: 插件当前不可用
