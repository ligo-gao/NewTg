      tags: [relay]
      operationId: mjListTasks
      summary: Midjourney 批量任务查询
      description: |
        `ids` 为 MjId 数组（≤100；空数组直接返回 `[]`）。只返回本人且存在
        的 MJ 行，按输入顺序排列并保留重复项；他人/不存在的 id 被跳过（批量
        语义没有单条错误通道，逐 id 报错会泄露存在性）。
      security:
        - bearerToken: []
      requestBody:
        $ref: '../components/params.yaml#/requestBodies/MJTaskList'
      responses:
        '200':
          description: 任务 DTO 数组信封（空数组亦为 200）
        '400':
          description: ids 超过上限/元素非法/请求体畸形（`{code:4,description}`）
        '401':
          description: 令牌无效
        '500':
          description: 内部错误

  /mj/task/{id}/image-seed:
    post:
      tags: [relay]
      operationId: mjTaskImageSeed
      summary: Midjourney 图片 seed 查询
      description: |
        按 `(user_id, MjId)` 取任务后，锁定原任务渠道把请求转发到
        `{baseURL}/mj/task/{id}/image-seed`（30s 超时），上游 body 原样透传。
        原渠道被禁用/删除时拒绝（与动作类渠道锁定同口径）。
      security:
        - bearerToken: []
      parameters:
        - $ref: '../components/params.yaml#/parameters/MJTaskID'
      responses:
        '200':
          description: 上游 seed 查询体（透传）
        '400':
          description: id 非法或原渠道不可用（`{code:4,description}`）
        '401':
          description: 令牌无效
        '404':
          description: 任务不存在或不属于本人（`{code:4,description:task_not_found}`）
        '500':
          description: 内部错误（渠道凭据不可用等）
        '502':
          description: 上游不可达/坏响应

  # ---------------------------------------------------------------------------
  # 图片代理（W8/MJ-c，relay-05 §1.3；R-MJ-05/09/10/11）。
  #
  # 签名 URL：`?sig=&exp=`。签名绑定 `mj_id ‖ owner_user_id ‖ exp`，TTL 300s。
  # id 畸形、签名缺失/篡改/过期、任务不存在、他人任务**一律 404**（同一固定
  # description），不制造存在性 oracle。出站地址规则始终执行：
  # `sec.ssrf.mode=off` 与 `allow_private_ip` 不豁免，策略拒绝→403。
  # 存储 URL 非法/上游非 2xx/非图片类型/超限→502（不透传上游状态码）。
  # ---------------------------------------------------------------------------
  /mj/image/{id}:
    get:
      tags: [relay]
      operationId: mjImageProxy
      summary: Midjourney 图片代理（签名 URL）
      description: |
        按 MjId 取候选任务行并对候选 owner 逐个复算 HMAC，任一匹配即通过；
        随后用统一出站执行器校验目标地址（私网/环回/link-local/元数据/
        CGNAT/保留段、反 rebinding、禁跟随重定向）并流式回写图片字节。
        `sig`/`exp` 之外不接受任何参数。
      security:
        - bearerToken: []
      parameters:
        - $ref: '../components/params.yaml#/parameters/MJTaskID'
        - $ref: '../components/params.yaml#/parameters/MJImageSig'
        - $ref: '../components/params.yaml#/parameters/MJImageExp'
      responses:
        '200':
          description: 图片字节流（Content-Type 透传，限 image/*；缺失按 image/jpeg）
        '401':
          description: 令牌无效（`{code:5,description:invalid_token}`）
        '403':
          description: 目标地址被 SSRF 策略拒绝（`{code:4,description:forbidden}`）
        '404':
          description: id/签名/归属任一不通过（`{code:4,description:task_not_found}`）
        '500':
          description: 内部错误（`{code:5,description:internal_error}`）
        '502':
          description: 存储 URL 不可用或上游失败（`{code:5,description:upstream_error}`）
