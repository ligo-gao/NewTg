      summary: 从 https URL 导入插件源（默认不激活）
      description: |
        body `{url, sha256?}`。仅接受绝对 https URL；出站走 `sec.ssrf.*`
        统一守卫（S2），**不跟随重定向**，包体上限沿用
        `plugin.upload.max_bytes`（默认 2 MiB）。提供 `sha256` 时先比对再
        入库，不符返回 422 `plugin_hash_mismatch` 且零写入（S3）。

        入库与上传共用同一编译/校验关口（S1）：失败 422
        `plugin_compile_failed`；成功 201（同 (key,version) 同 hash 幂等
        200），`source=upload`、`active=false`。必须携带 Idempotency-Key。
      security:
        - sessionCookie: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '../schemas/admin.yaml#/schemas/ImportTaskPluginRequest'}
      responses:
        '200':
          description: 幂等命中已有版本（不激活）
          content:
            application/json:
              schema: {$ref: '../schemas/admin.yaml#/schemas/UploadTaskPluginResponse'}
        '201':
          description: 新版本已入库（不自动激活）
          content:
            application/json:
              schema: {$ref: '../schemas/admin.yaml#/schemas/UploadTaskPluginResponse'}
        '400': {$ref: '../components/responses.yaml#/responses/Error400'}
        '401': {$ref: '../components/responses.yaml#/responses/Error401'}
        '403': {$ref: '../components/responses.yaml#/responses/Error403'}
        '409': {$ref: '../components/responses.yaml#/responses/Error409'}
        '422': {$ref: '../components/responses.yaml#/responses/Error422'}
