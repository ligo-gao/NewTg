        - name: keyword
          in: query
          required: false
          schema: {type: string, maxLength: 128}
        - name: limit
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 100, default: 100}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
