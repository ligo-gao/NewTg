  # ---------------------------------------------------------------------------
  # 系统任务（W17-2 / billing-06 §13.5；modules-08 F-08-21 系统任务卡）。
  # 数据源：静态任务注册表 + worker_tasks / worker_task_runs（主库）。
  # 只读 + 受限触发；**没有 cancel 端点**（契约冻结，§13.5）。
  # ---------------------------------------------------------------------------
  /api/system/tasks:
    get:
      tags: [admin]
      operationId: listSystemTasks
      x-required-permission: settings:manage
      summary: 系统任务列表（注册表全集）
      description: |
        返回静态任务注册表中的全部任务，并合并 worker_tasks 的调度行；
        无调度行的任务给出注册表默认值（`last_status=null`、`last_run_at=null`）。
        `running` 以未过期租约为准；`holder_id` 只在运行中返回且已截断。
        `last_duration_ms` 是最新一次已结束运行的耗时。响应 `Cache-Control: no-store`。
      security:
        - sessionCookie: []
      parameters:
        - $ref: '../components/pagination.yaml#/parameters/Page'
        - $ref: '../components/pagination.yaml#/parameters/PageSize'
      responses:
        '200':
          description: 任务列表
          content:
            application/json:
              schema:
                $ref: '../schemas/admin.yaml#/schemas/SystemTaskPage'
        '400':
          $ref: '../components/responses.yaml#/responses/Error400'
        '401':
          $ref: '../components/responses.yaml#/responses/Error401'
        '403':
          $ref: '../components/responses.yaml#/responses/Error403'
        '500':
          $ref: '../components/responses.yaml#/responses/Error500'

  /api/system/tasks/{name}:
    get:
      tags: [admin]
      operationId: getSystemTask
      x-required-permission: settings:manage
      summary: 系统任务详情 + 最近运行历史
      description: |
        `name` 必须精确命中静态注册表；未知名称返回 404 `task_not_found`，
        不做模糊匹配。运行历史按 `COALESCE(started_at, created_at)` 倒序分页
        （默认每页 20，上限 100）。
      security:
        - sessionCookie: []
      parameters:
        - name: name
          in: path
          required: true
          schema: {type: string}
        - $ref: '../components/pagination.yaml#/parameters/Page'
        - $ref: '../components/pagination.yaml#/parameters/PageSize'
      responses:
        '200':
          description: 任务详情
          content:
            application/json:
              schema:
                $ref: '../schemas/admin.yaml#/schemas/SystemTaskDetail'
        '400':
          $ref: '../components/responses.yaml#/responses/Error400'
        '401':
          $ref: '../components/responses.yaml#/responses/Error401'
        '403':
          $ref: '../components/responses.yaml#/responses/Error403'
        '404':
          $ref: '../components/responses.yaml#/responses/Error404'
        '500':
          $ref: '../components/responses.yaml#/responses/Error500'

  /api/system/tasks/{name}:trigger:
    post:
      tags: [admin]
      operationId: triggerSystemTask
      x-required-permission: settings:manage
      summary: 手动触发白名单任务（只入队）
      description: |
        仅允许静态注册表标记 `manual_trigger_allowed=true` 的 5 个维护任务：
        `log_cleanup`、`log_partition_precreate`、`redemption_expiry`、
        `rankings_snapshot`、`worker_history_cleanup`。

        服务端只写一条 `pending` 运行行并唤醒调度器，由调度 pass 按正常租约
        认领执行——**不旁路执行**。非白名单 403 `task_not_manual`；未知任务
        404 `task_not_found`；已在运行/已入队 409 `task_already_running`；
        任务停用 409 `task_disabled`；运行时开关关闭（当前仅
        `log_cleanup` 的 `log.partition_drop_enabled`）409
        `log_partition_drop_disabled`，零 DROP、零入队，审计 outcome=blocked。`Idempotency-Key` 必带，24h 内同键重放
        返回首次 202，不产生第二条运行。每次触发（含失败）写
        `system.task.trigger` 审计。
      security:
        - sessionCookie: []
      parameters:
        - name: name
          in: path
          required: true
          schema: {type: string}
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, maxLength: 128}
      responses:
        '202':
          description: 已入队
          content:
            application/json:
              schema:
                $ref: '../schemas/admin.yaml#/schemas/SystemTaskTriggerAccepted'
        '400':
          $ref: '../components/responses.yaml#/responses/Error400'
        '401':
          $ref: '../components/responses.yaml#/responses/Error401'
        '403':
          $ref: '../components/responses.yaml#/responses/Error403'
        '404':
          $ref: '../components/responses.yaml#/responses/Error404'
        '409':
          $ref: '../components/responses.yaml#/responses/Error409'
        '500':
          $ref: '../components/responses.yaml#/responses/Error500'

  # 失败排障（admin console 后端；logs:read）。只读，仅 admin 会话 +
  # logs:read；非 admin（含缺 logs:read 的 admin）一律 403。同一 requestId
  # 多行时详情取终态行（refunded > error > refused > success）。响应只含
  # owner / sub / rule / signal.code + params 等代码，不含任何自然语言。
  /api/usage-logs/triage/{request_id}:
    get:
      tags: [admin]
      operationId: getRequestTriage
      x-required-permission: logs:read
      summary: 按 requestId 判定失败责任方（用户请求 / 上游渠道 / 网关自身）
      description: |
        管理员粘贴客户端错误报告里的 requestId，得到责任方判定与判定依据。
        `request_id` 只接受 UUID 的 32 位十六进制或带连字符拼写（其它形式
        422）。格式正确但查无此 ID——包括已超过 90 天保留期——返回
        200 + `found: false`，以便「从未存在」与「已过期删除」不可区分。

        证据全部来自已落库事实：`usage_logs.retry_chain` 与
        `other.admin_info.triage`。`verdict.signals` 是判定依据的原子事实
        列表；`params` 缺省表示该信号没有可插值的小值。
      security:
        - sessionCookie: []
      parameters:
        - name: request_id
          in: path
          required: true
          description: 请求 ID（UUID；32 位十六进制或 36 位带连字符均可）。
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 判定结果；格式正确但查无此 ID 时为 found=false（不是 404）。
          content:
            application/json:
              schema:
                $ref: '../schemas/admin.yaml#/schemas/RequestTriage'
        '401':
          $ref: '../components/responses.yaml#/responses/Error401'
        '403':
          $ref: '../components/responses.yaml#/responses/Error403'
        '404':
          $ref: '../components/responses.yaml#/responses/Error404'
        '422':
          $ref: '../components/responses.yaml#/responses/Error422'
        '500':
          $ref: '../components/responses.yaml#/responses/Error500'
        '503':
          $ref: '../components/responses.yaml#/responses/Error503'

  /api/usage-logs/triage/recent:
    get:
      tags: [admin]
      operationId: listRecentFailures
      x-required-permission: logs:read
      summary: 最近失败列表（可按责任方过滤）
      description: |
        返回窗口内最近的失败条目（status 非 success）。同一 requestId 只列
        一次。`counts` 只统计本次返回的 `items`——UI 文案为「最近 N 条」，
        不是整个窗口的全量总数。`owner` 缺省返回全部责任方。
      security:
        - sessionCookie: []
      parameters:
        - name: range
          in: query
          description: 预设时间窗口；缺省 24h。
          schema:
            type: string
            enum: [24h, 7d, 14d, 30d]
            default: 24h
        - name: limit
          in: query
          description: 返回条目上限（1–50）；缺省 20。
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - name: owner
          in: query
          description: 只保留该责任方的条目；缺省不过滤。
          schema:
            $ref: '../schemas/admin.yaml#/schemas/TriageOwner'
      responses:
        '200':
          description: 最近失败条目 + 本次返回条目的责任方计数。
          content:
            application/json:
              schema:
                $ref: '../schemas/admin.yaml#/schemas/RecentFailures'
        '401':
          $ref: '../components/responses.yaml#/responses/Error401'
        '403':
          $ref: '../components/responses.yaml#/responses/Error403'
        '404':
          $ref: '../components/responses.yaml#/responses/Error404'
        '422':
          $ref: '../components/responses.yaml#/responses/Error422'
        '500':
          $ref: '../components/responses.yaml#/responses/Error500'
        '503':
          $ref: '../components/responses.yaml#/responses/Error503'
