      operationId: previewVendorOperations
      x-required-permission: channels:manage_sensitive
      summary: 供应商批量操作预览（只读）
      description: |
        action=assign 用 model_ids；merge/delete 用 vendor_ids；assign/merge
        可带 target_vendor_id（assign 的 0 = 清空归属）。
        expected_version 是**操作指纹**（涉及供应商的 id=version 升序拼接后
        sha256），首次预览不必传；传了且不一致时 conflict=true 并返回当前
        版本集合。空选择/超过 1000 条/参数组合非法 ⇒ 422。
      security:
        - sessionCookie: []
      parameters:
        - $ref: '../components/params.yaml#/parameters/CSRFToken'
