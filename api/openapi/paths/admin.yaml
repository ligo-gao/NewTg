  # ---------------------------------------------------------------------------
  # 任务台账（M6d Task 6a / relay-06 §10.4）。管理员可见性沿用 logs:read
  # （或 FULL 权限）口径；普通用户访问返回 403。
  # ---------------------------------------------------------------------------
  /api/task:
    get:
      tags: [admin]
      operationId: listTasks
      x-required-permission: logs:read
      summary: 全站任务台账（分页 + 用户/状态筛选）
      description: |
        `user_id` 可选（正整数）；`state` 可逗号分隔筛选。台账不返回
        data / private_data（设计 §7.1 Omit）。
      security:
        - sessionCookie: []
      parameters:
        - name: user_id
          in: query
          required: false
          schema: {type: integer, minimum: 1}
        - name: state
          in: query
          required: false
          schema: {type: string}
        - name: p
          in: query
          required: false
          schema: {type: integer, minimum: 1}
        - name: page_size
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 100}
      responses:
        '200':
          description: 任务分页（含 user_id）
          content:
            application/json:
              schema: {$ref: '../schemas/user.yaml#/schemas/TaskListResponse'}
        '400': {$ref: '../components/responses.yaml#/responses/Error400'}
        '401': {$ref: '../components/responses.yaml#/responses/Error401'}
        '403': {$ref: '../components/responses.yaml#/responses/Error403'}
        '500': {$ref: '../components/responses.yaml#/responses/Error500'}

  # 通知渠道 · 测试 Webhook 事件（modules-08 F-08-20 / D2-14）。
  # ---------------------------------------------------------------------------
  # 通用设置面（modules-08 §3.2 / F-08-08；C2 补齐契约）。
  #
  # 一个 section = 注册表里的一组键；响应逐键给出 value/type/default 与危险标记。
  # GET 只要求管理员角色；PUT 要求 settings:manage（受限管理员不得改设置）。
  # 密钥只写不读：GET 对 secret 键回传掩码或 null，绝不回传明文。
  # ---------------------------------------------------------------------------
  /api/settings:
    get:
      tags: [admin]
      operationId: getSettingsSection
      x-required-permission: settings:manage
      summary: 读取一个设置 section
      description: |
        必须提供 `section`（如 site / auth / billing / pay / pay.stripe /
        pay.alipay / pay.epay / rl / sec / notify.smtp / notify.webhook /
        rl.health / policy）。缺参数与未知 section 均返回 400。
        `value=null` 表示该键尚未落库（使用 `default`）；secret 键的 value
        恒为掩码或 null。
      security:
        - sessionCookie: []
      parameters:
        - name: section
          in: query
          required: true
          schema: {type: string, minLength: 1}
      responses:
        '200':
          description: section 投影
          content:
            application/json:
              schema:
                $ref: '../schemas/admin.yaml#/schemas/SettingsSection'
        '400':
          $ref: '../components/responses.yaml#/responses/Error400'
        '401':
          $ref: '../components/responses.yaml#/responses/Error401'
        '403':
          $ref: '../components/responses.yaml#/responses/Error403'
        '500':
          $ref: '../components/responses.yaml#/responses/Error500'
    put:
      tags: [admin]
      operationId: updateSettingsSection
      x-required-permission: settings:manage
      summary: 保存一个设置 section（部分更新 + 乐观锁）
      description: |
        必须提供 `section`（query）；未知 section 与缺参数均返回 400。
        请求体只携带变更键（`values` 必填，`{}` 表示本次不改任何键）：
        - 秘密键缺省 = 不修改，`null` = 显式清除，字符串 = 替换；
        - `expect_updated_at` 与当前版本不一致返回 409（Problem 体，客户端
          应重新读取 section 后重试）；
        - 命中危险方向且未带 `dangerous_confirmed=true` 时返回 400（服务端
          判定，响应 detail 指明原因）。
        类型/范围/URL 形状由注册表校验，失败返回 400，Problem 体带 `fields`
        （出错的键名，客户端据此把错误落到具体字段）；只有锁定键（服务端只读）
        被修改才返回 422。
      security:
        - sessionCookie: []
      parameters:
        - name: section
          in: query
          required: true
          schema: {type: string, minLength: 1}
        - $ref: '../components/params.yaml#/parameters/CSRFToken'
        - $ref: '../components/params.yaml#/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/admin.yaml#/schemas/SettingsUpdateRequest'
      responses:
        '200':
          description: 保存结果（实际写入的键）
          content:
            application/json:
              schema:
                $ref: '../schemas/admin.yaml#/schemas/SettingsUpdateResponse'
        '400':
          $ref: '../components/responses.yaml#/responses/Error400'
        '401':
          $ref: '../components/responses.yaml#/responses/Error401'
        '403':
          $ref: '../components/responses.yaml#/responses/Error403'
        '409':
          $ref: '../components/responses.yaml#/responses/Error409'
        '422':
          description: 锁定键（服务端只读，如 nav.console.require_auth）被修改
          content:
            application/problem+json:
              schema:
                $ref: '../components/problem.yaml#/schemas/Problem'
        '500':
          $ref: '../components/responses.yaml#/responses/Error500'

  # ---------------------------------------------------------------------------
  # 支付设置 Tab 的合规确认（modules-08 §3.4 / F-08-13 / F-08-14）。
  #
  # 首次进入支付设置 Tab 必须输入冻结文本「我已了解支付合规责任」。确认状态
  # 按管理员持久化（users.payment_compliance_confirmed_at）；审计动作
  # settings.payment_compliance_confirmed 记录 who（actor/username）与 when
  # （审计行 created_at + detail.confirmed_at）。POST 幂等：重复确认返回首次
  # 时刻，不重复写审计，也不改变已确认时间。
  # ---------------------------------------------------------------------------
  /api/settings/payment-compliance:
    get:
      tags: [admin]
      operationId: getPaymentCompliance
      x-required-permission: settings:manage
      summary: 读取当前管理员的支付设置合规确认状态
      description: |
        `confirmed=false` 时管理端必须展示合规确认遮罩并禁止渲染支付设置；
        `confirmed=true` 时返回首次确认时刻 `confirmed_at`，后续进入不再提示。
        该端点只读，不写审计。
      security:
        - sessionCookie: []
      responses:
        '200':
          description: 当前管理员的确认状态
          content:
            application/json:
              schema:
                $ref: '../schemas/admin.yaml#/schemas/PaymentComplianceStatus'
        '401':
          $ref: '../components/responses.yaml#/responses/Error401'
        '403':
          $ref: '../components/responses.yaml#/responses/Error403'
        '404':
          description: 当前会话对应的用户已不存在（并发删除/脏会话）
          content:
            application/problem+json:
              schema:
                $ref: '../components/problem.yaml#/schemas/Problem'
        '500':
          $ref: '../components/responses.yaml#/responses/Error500'
    post:
      tags: [admin]
      operationId: confirmPaymentCompliance
      x-required-permission: settings:manage
      summary: 确认支付设置合规责任
      description: |
        必须提交**逐字符精确**的 `confirmation` 文本
        「我已了解支付合规责任」；前后空白、标点或其它语言均返回 400，
        且零写入、零审计。文本校验在服务端完成，前端禁用态不是授权证据。
        首次成功确认写入 `users.payment_compliance_confirmed_at=now()` 并写
        一条 `settings.payment_compliance_confirmed` 审计（who/when）；
        重复调用是幂等重放：返回首次时刻、不再写审计、不改写时间。
        响应与审计均不包含任何支付密钥或输入原文之外的敏感信息。
      security:
        - sessionCookie: []
      parameters:
        - $ref: '../components/params.yaml#/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/admin.yaml#/schemas/PaymentComplianceConfirmRequest'
      responses:
        '200':
          description: 已确认（首次或幂等重放）
          content:
            application/json:
              schema:
                $ref: '../schemas/admin.yaml#/schemas/PaymentComplianceStatus'
        '400':
          description: 文本不匹配或请求体非法；响应 Problem 带 `fields=["confirmation"]`
          content:
            application/problem+json:
              schema:
                $ref: '../components/problem.yaml#/schemas/Problem'
        '401':
          $ref: '../components/responses.yaml#/responses/Error401'
        '403':
          $ref: '../components/responses.yaml#/responses/Error403'
        '404':
          description: 当前会话对应的用户已不存在（并发删除/脏会话）
          content:
            application/problem+json:
              schema:
                $ref: '../components/problem.yaml#/schemas/Problem'
        '500':
          $ref: '../components/responses.yaml#/responses/Error500'

  /api/settings/test/webhook:
    post:
      tags: [admin]
      operationId: testWebhookSettings
      x-required-permission: settings:manage
      summary: 向已保存的 Webhook 端点发送一条固定样例事件
      description: |
        配置取自**已保存**的 `notify.webhook.*` 快照；请求体为空。
        URL/secret 未配置 → 422 `type=https://newtg.dev/problems/webhook_not_configured`；
        目标被最小 SSRF 守卫拒绝 → 422 `type=https://newtg.dev/problems/webhook_target_blocked`
        （两者都是 422，但 type 不同：前者补齐配置后可重试，后者必须更换目标或调整白名单）；
        连接失败/超时 → 504 固定文案；**已收到 HTTP 响应即返回 200**，
        `ok` 表示目标是否 2xx，`status_code` 原样回传（含 3xx/4xx/5xx，3xx 不跟随）。
        不受 `enabled=false` 与事件订阅影响（测试目的就是验证未启用的配置）。
        限流 3 次/分钟/管理员。**不写 `notification_deliveries`**；审计动作
        `settings.test_webhook`，detail 仅 event/status_code/ok/host。
        样例 payload 不是事件契约（业务 payload 归模块 01/03/04）。
      security:
        - sessionCookie: []
      parameters:
        - $ref: '../components/params.yaml#/parameters/CSRFToken'
      responses:
        '200':
          description: 已收到目标 HTTP 响应（2xx 或非 2xx）
          content:
            application/json:
              schema:
                $ref: '../schemas/admin.yaml#/schemas/WebhookTestResult'
        '401':
          $ref: '../components/responses.yaml#/responses/Error401'
        '403':
          $ref: '../components/responses.yaml#/responses/Error403'
        '422':
          description: |
            保存的 Webhook 配置不可用于测试，响应的 `type` 区分两种可操作原因：
            - `https://newtg.dev/problems/webhook_not_configured`：URL 或签名密钥未配置；
            - `https://newtg.dev/problems/webhook_target_blocked`：URL 被出站守卫拒绝
              （非 https、含 userinfo/fragment、私网/loopback/link-local 或主机不可解析）。
            两者 `detail` 均为固定文案，不包含目标地址或上游错误原文。
          content:
            application/problem+json:
              schema:
                $ref: '../components/problem.yaml#/schemas/Problem'
              examples:
                not_configured:
                  value:
                    type: https://newtg.dev/problems/webhook_not_configured
                    title: Webhook is not configured
                    status: 422
                    detail: configure notify.webhook.url and notify.webhook.secret before testing
                target_blocked:
                  value:
                    type: https://newtg.dev/problems/webhook_target_blocked
                    title: Webhook target is not allowed
                    status: 422
                    detail: the configured URL is not an allowed outbound target
        '429':
          $ref: '../components/responses.yaml#/responses/Error429'
        '500':
          description: 服务端内部错误（如密钥解封失败）；响应为固定文案，不泄露内部细节
          content:
            application/problem+json:
              schema:
                $ref: '../components/problem.yaml#/schemas/Problem'
        '503':
          description: 测试发送器未装配；响应为固定文案
          content:
            application/problem+json:
              schema:
                $ref: '../components/problem.yaml#/schemas/Problem'
        '504':
          description: 连接失败或超时（未收到 HTTP 响应，固定文案）
          content:
            application/problem+json:
              schema:
                $ref: '../components/problem.yaml#/schemas/Problem'

  # 通知渠道 · 恢复自动暂停的 Webhook 推送（modules-08 F-08-20）。
  #
  # 暂停是运行时状态（Redis notify:webhook:paused / fail_streak），不是设置键：
  # 本端点只清这两个键，不写 system_settings、不改队列行。连续失败 > 50 次
  # 由 N8 worker 自动置暂停；恢复后 worker 下一轮重新领取 queued 投递。
  /api/settings/notify-webhook:resume:
    post:
      tags: [admin]
      operationId: resumeWebhookNotifications
      x-required-permission: settings:manage
      summary: 恢复因连续失败而自动暂停的 Webhook 推送
      description: |
        清除 `notify:webhook:paused` 与 `notify:webhook:fail_streak`。
        队列中的 queued 投递保持原 attempt/next_retry_at，由 N8 worker 在下一轮
        （≤1 分钟）继续发送；测试端点从不经过暂停状态，因此不受影响。
        该操作幂等：未暂停时调用同样返回 `paused=false`。
        Redis 不可用 → 503（恢复未生效，不得谎报成功）。
        审计动作 `settings.webhook_resume`，detail 仅 `paused`。
      security:
        - sessionCookie: []
      parameters:
        - $ref: '../components/params.yaml#/parameters/CSRFToken'
      responses:
        '200':
          description: 暂停状态已清除（或原本未暂停）
          content:
            application/json:
              schema:
                $ref: '../schemas/admin.yaml#/schemas/WebhookResumeResult'
        '401':
          $ref: '../components/responses.yaml#/responses/Error401'
        '403':
          $ref: '../components/responses.yaml#/responses/Error403'
        '503':
          description: Redis 不可用，暂停状态未能清除；响应为固定文案
          content:
            application/problem+json:
              schema:
                $ref: '../components/problem.yaml#/schemas/Problem'

  # ---------------------------------------------------------------------------
  # 模型目录 / 供应商目录（modules-06 F-06-22～26；D1b）
  #
  # 目录（model_meta / vendors）与定价（model-pricing）是两个域：不设 FK、
  # 不强制一一对应（有价无档 / 有档无价都合法）。
  # 静态子路径（/search、/missing、/sync/preview、/batch-delete、/operations/*）
  # 先于 {id} 声明，与 ServeMux 的字面量优先一致。
  # ---------------------------------------------------------------------------
  /api/models:
    get:
      tags: [admin]
      operationId: listModelCatalog
      x-required-permission: channels:read
      summary: 模型目录列表（分页 + 筛选 + 排序 + 派生字段）
      description: |
        每行是 model_meta 的 20 列 + 派生字段 vendor_name / square_state /
        configured_channel_count / enable_groups[]。
        square_state：status=2 ⇒ hidden；否则按 name_rule 与实际启用渠道的
        supported_models 匹配——覆盖全部启用用户分组 ⇒ visible，部分 ⇒
        partial，无启用渠道 ⇒ unavailable。该筛选项在服务端对完整结果集
        求值后再分页，total 与 items 口径一致。
        非法枚举/排序/分页参数一律 400（管理面不宽容降级）。
      security:
        - sessionCookie: []
      parameters:
        - $ref: '../components/pagination.yaml#/parameters/Page'
        - $ref: '../components/pagination.yaml#/parameters/PageSize'
        - name: keyword
          in: query
          required: false
          schema: {type: string, maxLength: 128}
          description: 匹配 model_name / display_name（ILIKE）。
        - name: vendor_id
          in: query
          required: false
          schema: {type: integer, format: int64, minimum: 1}
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: ['1', '2', enabled, disabled]
        - name: square_state
          in: query
          required: false
          schema:
            $ref: '../schemas/admin.yaml#/schemas/SquareState'
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [model_name, '-model_name', status, '-status', updated_at, '-updated_at', created_at, '-created_at']
            default: model_name
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '../schemas/admin.yaml#/schemas/ModelMetaList'
        '400':
          $ref: '../components/responses.yaml#/responses/Error400'
        '401':
          $ref: '../components/responses.yaml#/responses/Error401'
        '403':
          $ref: '../components/responses.yaml#/responses/Error403'
        '500':
          $ref: '../components/responses.yaml#/responses/Error500'
    post:
      tags: [admin]
      operationId: createModelMeta
      x-required-permission: channels:manage
      summary: 新建模型档案
      description: |
        应携带 Idempotency-Key：同键重放返回首次响应；同键不同请求体 422。
        model_name 必须匹配 ^[A-Za-z0-9._:/-]{1,128}$（放行 `/`，公开模型名
        可含厂商前缀）。vendor_id 不存在 ⇒ 422。model_name 重复 ⇒ 409。
      security:
        - sessionCookie: []
      parameters:
        - $ref: '../components/params.yaml#/parameters/IdempotencyKey'
        - $ref: '../components/params.yaml#/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/admin.yaml#/schemas/ModelMetaCreateRequest'
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema:
                $ref: '../schemas/admin.yaml#/schemas/ModelMeta'
        '400':
          $ref: '../components/responses.yaml#/responses/Error400'
        '401':
          $ref: '../components/responses.yaml#/responses/Error401'
        '403':
          $ref: '../components/responses.yaml#/responses/Error403'
        '409':
          $ref: '../components/responses.yaml#/responses/Error409'
        '422':
          $ref: '../components/responses.yaml#/responses/Error422'
        '500':
          $ref: '../components/responses.yaml#/responses/Error500'

  /api/models/search:
    get:
      tags: [admin]
      operationId: searchModelCatalog
      x-required-permission: channels:read
      summary: 模型选择器（关键字搜索，limit 上限 100）
      security:
        - sessionCookie: []
      parameters:
        - name: keyword
          in: query
          required: false
          schema: {type: string, maxLength: 128}
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: ['1', '2', enabled, disabled]
          description: 按 status 精确筛选（1=启用，2=停用）；省略或空串则不过滤。非法枚举 400。
        - name: limit
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 100, default: 100}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '../schemas/admin.yaml#/schemas/ModelMetaSearchList'
        '400':
          $ref: '../components/responses.yaml#/responses/Error400'
        '401':
          $ref: '../components/responses.yaml#/responses/Error401'
        '403':
          $ref: '../components/responses.yaml#/responses/Error403'
        '500':
          $ref: '../components/responses.yaml#/responses/Error500'

  /api/models/missing:
    get:
      tags: [admin]
      operationId: listMissingModels
      x-required-permission: channels:read
      summary: 缺失模型检测（只读）
      description: |
        启用渠道 supported_models 的并集减去 model_meta.model_name。
        supported_models 含非法元素（非字符串/空白）的渠道**整渠道跳过**，其
        模型不计入 channel_count，跳过数在 skipped_channels 上报。
        已建档模型不出现；has_pricing 表示 model_pricing 中已有同名行。
      security:
        - sessionCookie: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '../schemas/admin.yaml#/schemas/ModelMissingList'
        '401':
          $ref: '../components/responses.yaml#/responses/Error401'
        '403':
          $ref: '../components/responses.yaml#/responses/Error403'
        '500':
          $ref: '../components/responses.yaml#/responses/Error500'

  /api/models/sync/preview:
    get:
      tags: [admin]
      operationId: previewModelSync
      x-required-permission: channels:manage_sensitive
      summary: 上游元数据同步预览（只读）
      description: |
        拉取 model_sync.source_url 的清单，与本地目录对账并返回六类候选：
        create / update / unchanged / blocked（本地 sync_official=false）/
        missing_upstream（本地有、上游无）/ missing_vendor（本地 vendor_id
        指向不存在的供应商）。source_version 是清单原文的 sha256，apply 必须
        原样回传；服务端把清单缓存 1h（不落同步历史表）。
        源未配置 ⇒ 503；清单不可达/非法 ⇒ 502（固定文案，不含上游细节）。
      security:
        - sessionCookie: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '../schemas/admin.yaml#/schemas/ModelSyncPreview'
        '401':
          $ref: '../components/responses.yaml#/responses/Error401'
        '403':
          $ref: '../components/responses.yaml#/responses/Error403'
        '502':
          $ref: '../components/responses.yaml#/responses/Error502'
        '503':
          $ref: '../components/responses.yaml#/responses/Error503'
        '500':
          $ref: '../components/responses.yaml#/responses/Error500'

  /api/models/sync:
    post:
      tags: [admin]
      operationId: applyModelSync
      x-required-permission: channels:manage_sensitive
      summary: 应用上游同步（只写勾选项）
      description: |
        source_version 必须是 preview 的返回值；缺失/过期/条目在清单中消失
        ⇒ 409（整体拒绝，不产生任何写入）。勾选 sync_official=false 的模型
        ⇒ 400（前端不应允许勾选，后端仍校验）。写入值取自服务端缓存的清单，
        请求条目只用于选择。选择集按匹配键去重：内容一致的重复项幂等合并，
        同名但内容不一致 ⇒ 422。
        写入在**单个数据库事务**内完成（供应商 + 模型），事务开始即获取
        advisory lock 串行化并发同步，并在锁内重新判断 create/update 与
        sync_official；任一条失败（唯一约束/乐观锁 → 409，字段校验 → 422）
        整体回滚，不会部分生效。
      security:
        - sessionCookie: []
      parameters:
        - $ref: '../components/params.yaml#/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/admin.yaml#/schemas/ModelSyncApplyRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '../schemas/admin.yaml#/schemas/ModelSyncApplyResponse'
        '400':
          $ref: '../components/responses.yaml#/responses/Error400'
        '401':
          $ref: '../components/responses.yaml#/responses/Error401'
        '403':
          $ref: '../components/responses.yaml#/responses/Error403'
        '409':
          $ref: '../components/responses.yaml#/responses/Error409'
        '422':
          $ref: '../components/responses.yaml#/responses/Error422'
        '500':
          $ref: '../components/responses.yaml#/responses/Error500'

  /api/models/batch-delete:
    post:
      tags: [admin]
      operationId: batchDeleteModelMeta
      x-required-permission: channels:manage_sensitive
      summary: 批量删除模型档案（1–1000）
      description: |
        去重后空选择 / 超过 1000 条 ⇒ 422。
        remove_from_channels 只对 name_rule=0 的档案生效；若移除会让某渠道
        supported_models 变空 ⇒ 422 channel_models_empty + channel_ids
        （整体回滚）。
        clear_pricing=true 会删除 model_pricing / group_pricing 同名行，
        **额外要求 pricing:manage**（否则 403）；目标行按 model_name 精确匹配。
        部分 id 不存在不算错误：requested 与 deleted 如实相减即未命中数。
      security:
        - sessionCookie: []
      parameters:
        - $ref: '../components/params.yaml#/parameters/IdempotencyKey'
        - $ref: '../components/params.yaml#/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/admin.yaml#/schemas/ModelMetaBatchDeleteRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '../schemas/admin.yaml#/schemas/ModelMetaBatchDeleteResponse'
        '400':
          $ref: '../components/responses.yaml#/responses/Error400'
        '401':
          $ref: '../components/responses.yaml#/responses/Error401'
        '403':
          $ref: '../components/responses.yaml#/responses/Error403'
        '404':
          $ref: '../components/responses.yaml#/responses/Error404'
        '422':
          $ref: '../components/responses.yaml#/responses/Error422'
        '500':
          $ref: '../components/responses.yaml#/responses/Error500'

  /api/models/{id}:
    get:
      tags: [admin]
      operationId: getModelMeta
      x-required-permission: channels:read
      summary: 模型档案详情（含派生字段）
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: integer, format: int64, minimum: 1}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '../schemas/admin.yaml#/schemas/ModelMeta'
        '401':
          $ref: '../components/responses.yaml#/responses/Error401'
        '403':
          $ref: '../components/responses.yaml#/responses/Error403'
        '404':
          $ref: '../components/responses.yaml#/responses/Error404'
        '500':
          $ref: '../components/responses.yaml#/responses/Error500'
    put:
      tags: [admin]
      operationId: updateModelMeta
      x-required-permission: channels:manage
      summary: 更新模型档案（updated_at 乐观锁）
      description: |
        请求体是部分更新：未提交的字段保持不变；显式 null 清除可空列。
