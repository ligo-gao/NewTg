  # ---------------------------------------------------------------------------
  # 模型部署控制面 · 部署管理（M6d Task 4 / modules-08 §3.20 / F-08-52～F-08-58）。
  #
  # provider 是唯一真源：本组端点只做实时代理，不落库、不镜像容器/日志。
  # 全部能力（含只读）要求 settings:manage；deploy.ionet.enabled=false 时
  # 返回 409 deploy_disabled（设置与连接测试除外）。
  # 写操作（创建/更新/改名/续期/终止）必须携带 Idempotency-Key；写超时返回
  # 504「结果未知」，网关不自动重试。
  # ---------------------------------------------------------------------------
  /api/deployments:
    get:
      tags: [admin]
      operationId: listDeployments
      x-required-permission: settings:manage
      summary: 部署列表与全量检索
      description: |
        keyword 在**全结果集**上过滤（provider 无 keyword 参数时按页扫描，
        上限 10 页 / 1000 条；达到上限时 search_truncated=true）。
        status_counts 按扫描到的全量口径统计，不受当前页影响；扫描被截断或
        provider 未返回 total 时，status_counts 与 total 只代表已扫描窗口。
        p 默认 1；page_size 默认 20、上限 100（超出截断并回显实际值）。
      security:
        - sessionCookie: []
      parameters:
        - {name: status, in: query, required: false, schema: {type: string}}
        - {name: keyword, in: query, required: false, schema: {type: string}}
        - {name: p, in: query, required: false, schema: {type: integer, minimum: 1, default: 1}}
        - {name: page_size, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      responses:
        '200':
          description: 部署列表
          content:
            application/json:
              schema:
                $ref: '../schemas/admin.yaml#/schemas/DeployDeploymentList'
        '400':
          $ref: '../components/responses.yaml#/responses/Error400'
        '401':
          $ref: '../components/responses.yaml#/responses/Error401'
        '403':
          $ref: '../components/responses.yaml#/responses/Error403'
        '409':
          $ref: '../components/responses.yaml#/responses/Error409'
        '422':
          $ref: '../components/responses.yaml#/responses/Error422'
        '502':
          $ref: '../components/responses.yaml#/responses/Error502'
        '504':
          description: provider 超时
          content:
            application/problem+json:
              schema:
                $ref: '../components/problem.yaml#/schemas/Problem'
    post:
      tags: [admin]
      operationId: createDeployment
      x-required-permission: settings:manage
      summary: 创建部署（产生 provider 侧费用）
      description: |
        创建前与提交前各查重一次名称；创建前必须先取得 provider 报价，
        报价失败返回 422 deploy_price_unavailable 且不发起写。
        registry_secret 与 secret_env_variables 只写不读：不落库、不回显、
        不进审计（键名也不记）。成功返回 202 受理结果。
      security:
        - sessionCookie: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: 必填；同键重放返回首次结果。
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/admin.yaml#/schemas/CreateDeploymentRequest'
      responses:
        '202':
          description: 创建请求已受理
          content:
            application/json:
              schema:
                $ref: '../schemas/admin.yaml#/schemas/DeployAction'
        '400':
          $ref: '../components/responses.yaml#/responses/Error400'
        '401':
          $ref: '../components/responses.yaml#/responses/Error401'
        '403':
          $ref: '../components/responses.yaml#/responses/Error403'
        '409':
          $ref: '../components/responses.yaml#/responses/Error409'
        '422':
          $ref: '../components/responses.yaml#/responses/Error422'
        '429':
          $ref: '../components/responses.yaml#/responses/Error429'
        '502':
          $ref: '../components/responses.yaml#/responses/Error502'
        '504':
          description: provider 超时（写结果未知；先刷新再决定是否用新键重试）
          content:
            application/problem+json:
              schema:
                $ref: '../components/problem.yaml#/schemas/Problem'

