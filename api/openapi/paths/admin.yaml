  /api/vendors:
    get:
      tags: [admin]
      operationId: listVendors
      x-required-permission: channels:read
      summary: 供应商列表（分页 + 筛选 + 排序）
      description: |
        version 是 7 列规范化后的 sha256 **派生值**（不落库）；model_count
        统计全部档案（含停用）。attached=true/false 按「是否已挂模型」分区。
      security:
        - sessionCookie: []
      parameters:
        - $ref: '../components/pagination.yaml#/parameters/Page'
        - $ref: '../components/pagination.yaml#/parameters/PageSize'
        - name: keyword
          in: query
          required: false
          schema: {type: string, maxLength: 128}
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: ['1', '2', enabled, disabled]
        - name: attached
          in: query
          required: false
          schema: {type: boolean}
        - name: sort
          in: query
          required: false
