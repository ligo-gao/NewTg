  /api/users/{id}/subscriptions/{subscription_id}/cancel:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
      - name: subscription_id
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
    post:
      tags: [admin]
      operationId: adminCancelUserSubscription
      x-required-permission: users:update
      summary: 管理侧取消用户订阅（immediate=true 为立即取消）
      description: |
        路径用户与订阅归属必须一致；用户不存在、订阅不存在、订阅属于他人一律
        返回 **404**（不泄露订阅/用户 ID 的存在性与归属）。终态（expired，或
        周期末取消时的 cancelled）→ 409 subscription_not_active。

        `immediate=false`（缺省）与用户侧周期末取消同语义：只置
        `cancel_at_period_end=true`，实例保持 active 至 `end_at`，不退款。

        `immediate=true` 是**立即取消，与期末取消不同**：服务端把 `end_at`
        提前到「现在」并清掉 `cancel_at_period_end`，实例**进入快照宽限期**
        （`grace_days`）——宽限期内仍可继续使用已购额度，宽限结束才到期失效；
        已购额度不因取消而退还。注意这不是「立刻停用」。同一订阅重复调用
        幂等返回 200（不重复写事件）。

        请求体可选；未知字段 403 field_not_writable。
      security:
        - sessionCookie: []
      parameters:
        - $ref: '../components/params.yaml#/parameters/CSRFToken'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '../schemas/admin.yaml#/schemas/AdminSubscriptionCancelRequest'
      responses:
        '200':
          description: 取消后的订阅（管理投影）
          content:
            application/json:
              schema:
                $ref: '../schemas/admin.yaml#/schemas/AdminSubscription'
        '400':
          $ref: '../components/responses.yaml#/responses/Error400'
        '401':
          $ref: '../components/responses.yaml#/responses/Error401'
        '403':
          $ref: '../components/responses.yaml#/responses/Error403'
        '404':
          $ref: '../components/responses.yaml#/responses/Error404'
        '409':
          $ref: '../components/responses.yaml#/responses/Error409'
        '429':
          $ref: '../components/responses.yaml#/responses/Error429'
        '500':
          $ref: '../components/responses.yaml#/responses/Error500'

  # 站点公告（D7a；modules-08 F-08-04 / R-D7-06～R-D7-08）。
  # 管理面全部要求 settings:manage（不新增权限键，R-D7-11）。
  /api/announcements:
    get:
      tags: [admin]
      operationId: listAnnouncements
      x-required-permission: settings:manage
      summary: 公告列表（offset 分页 + status/category 筛选）
      description: |
        排序固定 publish_at DESC, id DESC。status 只接受 draft|published|
        offline|expired：expired 是**虚拟态**（status=published 且
        expire_at<=now，R-D7-10），与 published 互斥——已过期公告只出现在
        expired 筛选项里。列表不含正文（正文只在详情/编辑读取）。
      security:
        - sessionCookie: []
      parameters:
        - $ref: '../components/pagination.yaml#/parameters/Page'
        - $ref: '../components/pagination.yaml#/parameters/PageSize'
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [draft, published, offline, expired]
        - name: category
          in: query
          required: false
          schema:
            $ref: '../schemas/admin.yaml#/schemas/AnnouncementCategory'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '../schemas/admin.yaml#/schemas/AnnouncementList'
        '400':
          $ref: '../components/responses.yaml#/responses/Error400'
        '401':
          $ref: '../components/responses.yaml#/responses/Error401'
        '403':
          $ref: '../components/responses.yaml#/responses/Error403'
        '500':
          $ref: '../components/responses.yaml#/responses/Error500'
    post:
      tags: [admin]
      operationId: createAnnouncement
      x-required-permission: settings:manage
      summary: 新建公告（publish_now 单事务写+发布）
      description: |
        缺省落 draft。publish_now=true 时在**同一事务**内写入并发布：校验或
        发布失败整体回滚（不留草稿行）并返回 422。正文 ≤16KB（应用层），
        expire_at 必须晚于生效时间。未知字段由 RBAC 字段层直接 403。
      security:
        - sessionCookie: []
      parameters:
        - $ref: '../components/params.yaml#/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/admin.yaml#/schemas/AnnouncementWriteInput'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '../schemas/admin.yaml#/schemas/AnnouncementDetail'
        '400':
          $ref: '../components/responses.yaml#/responses/Error400'
        '401':
          $ref: '../components/responses.yaml#/responses/Error401'
        '403':
          $ref: '../components/responses.yaml#/responses/Error403'
        '422':
          $ref: '../components/responses.yaml#/responses/Error422'
        '429':
          $ref: '../components/responses.yaml#/responses/Error429'
        '500':
          $ref: '../components/responses.yaml#/responses/Error500'

