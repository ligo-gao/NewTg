# 管理域路径（仅管理员会话）。
# 这些 operation 只声明 sessionCookie：Bearer 令牌没有角色/权限语义，
# RBAC 判定必然 fail-closed（auth.SessionAuth 对令牌只注入 UserID+TokenID）。
paths:
  /api/users:
    get:
      tags: [admin]
      operationId: listUsers
      x-required-permission: users:read
      summary: 用户列表（分页 + 筛选 + 排序）
      description: |
        keyword 匹配用户名/显示名/邮箱（最多 64 字符）；status/role/group
        为精确筛选；sort 白名单 id|username|balance|created_at|updated_at，
        前缀 - 表示降序，默认 -created_at。非法枚举/排序列 400（不静默忽略）。
      security:
        - sessionCookie: []
      parameters:
        - $ref: '../components/pagination.yaml#/parameters/Page'
        - $ref: '../components/pagination.yaml#/parameters/PageSize'
        - name: keyword
          in: query
          required: false
          schema:
            type: string
            maxLength: 64
        - name: status
          in: query
          required: false
          schema:
            $ref: '../schemas/public.yaml#/schemas/UserStatus'
        - name: role
          in: query
          required: false
          schema:
            $ref: '../schemas/public.yaml#/schemas/UserRole'
        - name: group
          in: query
          required: false
          schema:
            type: string
            maxLength: 32
        - name: sort
          in: query
          required: false
          schema:
            type: string
            pattern: '^-?(id|username|balance|created_at|updated_at)$'
            default: '-created_at'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '../schemas/admin.yaml#/schemas/AdminUserList'
        '400':
          $ref: '../components/responses.yaml#/responses/Error400'
        '401':
          $ref: '../components/responses.yaml#/responses/Error401'
        '403':
          $ref: '../components/responses.yaml#/responses/Error403'
        '500':
          $ref: '../components/responses.yaml#/responses/Error500'
    post:
      tags: [admin]
      operationId: createUser
      x-required-permission: users:create
      summary: 创建用户（管理员创建无邮箱）
      description: |
        应携带 Idempotency-Key：同键重放只创建一条；同键不同请求体 422；
        缺失时直接执行（无重放保护）。
        请求体没有 email 字段——管理员创建的用户 email 为 NULL。role 缺省
        user；创建 admin 需要 users:manage-roles 且默认权限集是执行者权限的
        子集（防提权）。用户名冲突 409。成功 201。
      security:
        - sessionCookie: []
      parameters:
        - $ref: '../components/params.yaml#/parameters/IdempotencyKey'
        - $ref: '../components/params.yaml#/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/admin.yaml#/schemas/AdminCreateUserRequest'
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema:
                $ref: '../schemas/admin.yaml#/schemas/AdminUser'
        '400':
          $ref: '../components/responses.yaml#/responses/Error400'
        '401':
          $ref: '../components/responses.yaml#/responses/Error401'
        '403':
          $ref: '../components/responses.yaml#/responses/Error403'
        '409':
          $ref: '../components/responses.yaml#/responses/Error409'
        '422':
          $ref: '../components/responses.yaml#/responses/Error422'
        '500':
          $ref: '../components/responses.yaml#/responses/Error500'

  /api/users/{id}:
    get:
      tags: [admin]
      operationId: getUser
      x-required-permission: users:read
      summary: 读取用户详情
      security:
        - sessionCookie: []
      parameters:
        - $ref: '../components/params.yaml#/parameters/PathUserID'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '../schemas/admin.yaml#/schemas/AdminUser'
        '401':
          $ref: '../components/responses.yaml#/responses/Error401'
        '403':
          $ref: '../components/responses.yaml#/responses/Error403'
        '404':
          $ref: '../components/responses.yaml#/responses/Error404'
        '500':
          $ref: '../components/responses.yaml#/responses/Error500'
    patch:
      tags: [admin]
      operationId: updateUser
      x-required-permission: users:update
      summary: 部分更新用户（乐观锁）
      description: |
        必须原样回传 updated_at（缺失 400、不匹配 409）。不含口令字段：
        提交 password 返回 400（改用 reset-password）。未知字段 403
        field_not_writable。不能修改自己的角色（400，防自降权/自提权）；
        role 变更会吊销该用户全部会话。
      security:
        - sessionCookie: []
      parameters:
        - $ref: '../components/params.yaml#/parameters/PathUserID'
        - $ref: '../components/params.yaml#/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/admin.yaml#/schemas/AdminUpdateUserRequest'
      responses:
        '200':
          description: 更新后的用户
          content:
            application/json:
              schema:
                $ref: '../schemas/admin.yaml#/schemas/AdminUser'
        '400':
          $ref: '../components/responses.yaml#/responses/Error400'
        '401':
          $ref: '../components/responses.yaml#/responses/Error401'
        '403':
          $ref: '../components/responses.yaml#/responses/Error403'
        '404':
          $ref: '../components/responses.yaml#/responses/Error404'
        '409':
          $ref: '../components/responses.yaml#/responses/Error409'
        '500':
          $ref: '../components/responses.yaml#/responses/Error500'
        '503':
          $ref: '../components/responses.yaml#/responses/Error503'
    delete:
      tags: [admin]
      operationId: deleteUser
      x-required-permission: users:delete
      summary: 删除用户（前置条件：已封禁）
      description: |
        目标必须已是 disabled，否则 409。硬删 + PII 匿名化（历史记录改
        deleted_{id}）。不能删除自己（400）。成功 204。
      security:
        - sessionCookie: []
      parameters:
        - $ref: '../components/params.yaml#/parameters/PathUserID'
        - $ref: '../components/params.yaml#/parameters/CSRFToken'
      responses:
        '204':
          description: 已删除并匿名化
        '400':
          $ref: '../components/responses.yaml#/responses/Error400'
        '401':
          $ref: '../components/responses.yaml#/responses/Error401'
        '403':
          $ref: '../components/responses.yaml#/responses/Error403'
        '404':
          $ref: '../components/responses.yaml#/responses/Error404'
        '409':
          $ref: '../components/responses.yaml#/responses/Error409'
        '500':
          $ref: '../components/responses.yaml#/responses/Error500'
        '503':
          $ref: '../components/responses.yaml#/responses/Error503'

  /api/users/{id}/status:
    post:
      tags: [admin]
      operationId: setUserStatus
      x-required-permission: users:disable
      summary: 封禁 / 解禁用户
      description: |
        封禁在同一事务内吊销全部会话并把该用户令牌置 disabled；解禁不自动
        恢复令牌。不能封禁自己（400）。成功 200 {id,status}。
      security:
        - sessionCookie: []
      parameters:
        - $ref: '../components/params.yaml#/parameters/PathUserID'
        - $ref: '../components/params.yaml#/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/admin.yaml#/schemas/AdminUserStatusRequest'
      responses:
        '200':
          description: 新状态
          content:
            application/json:
              schema:
                $ref: '../schemas/admin.yaml#/schemas/AdminUserStatusResponse'
        '400':
          $ref: '../components/responses.yaml#/responses/Error400'
        '401':
          $ref: '../components/responses.yaml#/responses/Error401'
        '403':
          $ref: '../components/responses.yaml#/responses/Error403'
        '404':
          $ref: '../components/responses.yaml#/responses/Error404'
        '500':
          $ref: '../components/responses.yaml#/responses/Error500'
        '503':
          $ref: '../components/responses.yaml#/responses/Error503'

  /api/users/{id}/quota-adjustment:
    post:
      tags: [admin]
      operationId: adjustUserQuota
      x-required-permission: users:adjust-quota
      summary: 管理员额度调整（原子写流水）
      description: |
        原子 UPDATE（GC-5）：subtract 超过余额 400，绝不产生负余额；override
        与当前余额相同 400。idempotency_key 是业务幂等键（写入交易流水）。
        成功 200 {user_id,new_balance,transaction_id}。
      security:
        - sessionCookie: []
      parameters:
        - $ref: '../components/params.yaml#/parameters/PathUserID'
        - $ref: '../components/params.yaml#/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/admin.yaml#/schemas/QuotaAdjustmentRequest'
      responses:
        '200':
          description: 调整后的余额与流水 ID
          content:
            application/json:
              schema:
                $ref: '../schemas/admin.yaml#/schemas/QuotaAdjustmentResponse'
        '400':
          $ref: '../components/responses.yaml#/responses/Error400'
        '401':
          $ref: '../components/responses.yaml#/responses/Error401'
        '403':
          $ref: '../components/responses.yaml#/responses/Error403'
        '404':
          $ref: '../components/responses.yaml#/responses/Error404'
        '409':
          $ref: '../components/responses.yaml#/responses/Error409'
        '500':
          $ref: '../components/responses.yaml#/responses/Error500'

  /api/users/{id}/reset-2fa:
    post:
      tags: [admin]
      operationId: resetUserTwoFA
      x-required-permission: users:reset-security
      summary: 重置用户 2FA（清除种子与备用码）
      description: 目标未启用 2FA 时 400。成功 204。
      security:
        - sessionCookie: []
      parameters:
        - $ref: '../components/params.yaml#/parameters/PathUserID'
        - $ref: '../components/params.yaml#/parameters/CSRFToken'
      responses:
        '204':
          description: 已重置
        '400':
          $ref: '../components/responses.yaml#/responses/Error400'
        '401':
          $ref: '../components/responses.yaml#/responses/Error401'
        '403':
          $ref: '../components/responses.yaml#/responses/Error403'
        '404':
          $ref: '../components/responses.yaml#/responses/Error404'
        '500':
          $ref: '../components/responses.yaml#/responses/Error500'
        '503':
          $ref: '../components/responses.yaml#/responses/Error503'

  /api/users/{id}/reset-password:
    post:
      tags: [admin]
      operationId: resetUserPassword
      x-required-permission: users:reset-security
      summary: 重置用户口令（返回一次性临时口令）
      description: |
        生成 16 位临时口令（TEMP_PWD_TTL=24h，must_change_password=true），
        只在本次响应出现；响应 Cache-Control: no-store。审计只记录"发生了
        重置"，绝不含口令材料。成功 200。
      security:
        - sessionCookie: []
      parameters:
        - $ref: '../components/params.yaml#/parameters/PathUserID'
        - $ref: '../components/params.yaml#/parameters/CSRFToken'
      responses:
        '200':
          description: 临时口令（一次性）
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '../schemas/admin.yaml#/schemas/ResetPasswordResponse'
        '400':
          $ref: '../components/responses.yaml#/responses/Error400'
        '401':
          $ref: '../components/responses.yaml#/responses/Error401'
        '403':
          $ref: '../components/responses.yaml#/responses/Error403'
        '404':
          $ref: '../components/responses.yaml#/responses/Error404'
        '500':
          $ref: '../components/responses.yaml#/responses/Error500'
        '503':
          $ref: '../components/responses.yaml#/responses/Error503'

  /api/users/{id}/permissions:
    patch:
      tags: [admin]
      operationId: setUserPermissions
      x-required-permission: users:manage-roles
      summary: 设置管理员权限矩阵（超集校验）
      description: |
        授予集合必须是调用者自身权限的子集，否则 403 且不写库；未知键与
        非 FULL 调用者授予 "*" 同样 403。显式 null 被拒绝（NULL=FULL 会绕过
        超集校验，授予全权必须显式 ["*"]）。只对 admin 目标有效（400）；
        不能修改自己（400）。成功 200 返回更新后的用户。
      security:
        - sessionCookie: []
      parameters:
        - $ref: '../components/params.yaml#/parameters/PathUserID'
        - $ref: '../components/params.yaml#/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/admin.yaml#/schemas/SetPermissionsRequest'
      responses:
        '200':
          description: 更新后的用户（含新 admin_permissions）
          content:
            application/json:
              schema:
                $ref: '../schemas/admin.yaml#/schemas/AdminUser'
        '400':
          $ref: '../components/responses.yaml#/responses/Error400'
        '401':
          $ref: '../components/responses.yaml#/responses/Error401'
        '403':
          $ref: '../components/responses.yaml#/responses/Error403'
        '404':
          $ref: '../components/responses.yaml#/responses/Error404'
        '500':
          $ref: '../components/responses.yaml#/responses/Error500'

  /api/groups:
    get:
      tags: [admin]
      operationId: listGroups
      x-required-permission: groups:manage
      summary: 分组列表（分页）
      security:
        - sessionCookie: []
      parameters:
        - $ref: '../components/pagination.yaml#/parameters/Page'
        - $ref: '../components/pagination.yaml#/parameters/PageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '../schemas/admin.yaml#/schemas/AdminGroupList'
        '400':
          $ref: '../components/responses.yaml#/responses/Error400'
        '401':
          $ref: '../components/responses.yaml#/responses/Error401'
        '403':
          $ref: '../components/responses.yaml#/responses/Error403'
        '500':
          $ref: '../components/responses.yaml#/responses/Error500'
    post:
      tags: [admin]
      operationId: createGroup
      x-required-permission: groups:manage
      summary: 创建分组
      description: 名称必须匹配 ^[a-z0-9_-]{2,32}$ 且唯一；冲突 409。成功 201。
      security:
        - sessionCookie: []
      parameters:
        - $ref: '../components/params.yaml#/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/admin.yaml#/schemas/AdminCreateGroupRequest'
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema:
                $ref: '../schemas/admin.yaml#/schemas/AdminGroup'
        '400':
          $ref: '../components/responses.yaml#/responses/Error400'
        '401':
          $ref: '../components/responses.yaml#/responses/Error401'
        '403':
          $ref: '../components/responses.yaml#/responses/Error403'
        '409':
          $ref: '../components/responses.yaml#/responses/Error409'
        '500':
          $ref: '../components/responses.yaml#/responses/Error500'

  /api/groups/{name}:
    patch:
      tags: [admin]
      operationId: updateGroup
      x-required-permission: groups:manage
      summary: 更新分组（改名 / 描述）
      description: |
        至少提供一个字段，否则 400。系统组不可改名（400，描述仍可编辑）；
        新名称冲突 409；目标不存在 404。成功 200。
      security:
        - sessionCookie: []
      parameters:
        - $ref: '../components/params.yaml#/parameters/PathGroupName'
        - $ref: '../components/params.yaml#/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/admin.yaml#/schemas/AdminUpdateGroupRequest'
      responses:
        '200':
          description: 更新后的分组
          content:
            application/json:
              schema:
                $ref: '../schemas/admin.yaml#/schemas/AdminGroup'
        '400':
          $ref: '../components/responses.yaml#/responses/Error400'
        '401':
          $ref: '../components/responses.yaml#/responses/Error401'
        '403':
          $ref: '../components/responses.yaml#/responses/Error403'
        '404':
          $ref: '../components/responses.yaml#/responses/Error404'
        '409':
          $ref: '../components/responses.yaml#/responses/Error409'
        '500':
          $ref: '../components/responses.yaml#/responses/Error500'
    delete:
      tags: [admin]
      operationId: deleteGroup
      x-required-permission: groups:manage
      summary: 删除分组
      description: |
        系统组（default/auto 等）不可删除（400）；仍被用户/令牌/定价/渠道
        引用时 409；不存在 404。成功 204。
      security:
        - sessionCookie: []
      parameters:
        - $ref: '../components/params.yaml#/parameters/PathGroupName'
        - $ref: '../components/params.yaml#/parameters/CSRFToken'
      responses:
        '204':
          description: 已删除
        '400':
          $ref: '../components/responses.yaml#/responses/Error400'
        '401':
          $ref: '../components/responses.yaml#/responses/Error401'
        '403':
          $ref: '../components/responses.yaml#/responses/Error403'
        '404':
          $ref: '../components/responses.yaml#/responses/Error404'
        '409':
          $ref: '../components/responses.yaml#/responses/Error409'
        '500':
          $ref: '../components/responses.yaml#/responses/Error500'

  # M0 占位：渠道管理在模块 06 实现；此处保留既有路径，避免已生成的前端
  # 类型回退（M6 会以具体 schema 替换 Channel 占位）。
  /api/channels:
    get:
      tags: [admin]
      operationId: listChannels
      x-required-permission: channels:read
      summary: 列出上游渠道（分页）
      security:
        - sessionCookie: []
      parameters:
        - $ref: '../components/pagination.yaml#/parameters/Page'
        - $ref: '../components/pagination.yaml#/parameters/PageSize'
      responses:
        '200':
          description: OK（offset 分页信封；items 为渠道管理投影，密钥永不回显）
          content:
            application/json:
              schema:
                $ref: '../schemas/admin.yaml#/schemas/ChannelList'
        '401':
          $ref: '../components/responses.yaml#/responses/Error401'
        '403':
          $ref: '../components/responses.yaml#/responses/Error403'
        '429':
          $ref: '../components/responses.yaml#/responses/Error429'

  # 凭据受控揭示（W11；security-03 §2.10 / modules-06 F-06-03）。这是「常规
  # 接口永不返回明文」的唯一例外：RBAC 敏感位 + 步进认证 + 管理员维限流，
  # 响应 no-store，审计只记元数据。
  /api/channels/{id}/credentials/reveal:
    post:
      tags: [admin]
      operationId: revealChannelCredentials
      x-required-permission: channels:manage_sensitive
      summary: 一次性揭示渠道完整凭据（受控例外）
      description: |
        请求体 {reason, password?, totp_code?}：reason 1–200 字符（纯空白 422）；
        因子**恰好一个**且必须匹配账号当前 MFA 状态（已启用 TOTP → totp_code，
        未启用 → password），同时提供/均缺失/形态不符 → 422（不执行解密）。
        权限不足在步进认证之前判定（403，错误体不含凭据信息）；步进认证失败
        403 reauth_required 并计入既有失败锁定（锁定 429 + Retry-After）；
        按管理员 10 次/小时限流，超限 429。成功响应仅返回该渠道凭据对象一次，
        带 Cache-Control: no-store 与 Pragma: no-cache、不产生 ETag。
        审计（channel.credentials_reveal）只记 channel_id/reason/revealed_fields
        与结果，**永不记录凭据内容（含片段、掩码、长度或哈希）**。
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          description: 渠道 id（正整数）；非法/不存在同形 404。
          schema:
            type: integer
            format: int64
            minimum: 1
        - $ref: '../components/params.yaml#/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/admin.yaml#/schemas/ChannelCredentialsRevealRequest'
      responses:
        '200':
          description: 完整凭据对象（仅此一次，不得缓存）
          headers:
            Cache-Control:
              description: 固定 no-store。
              schema:
                type: string
                enum: [no-store]
            Pragma:
              description: 固定 no-cache（兼容 HTTP/1.0 缓存）。
              schema:
                type: string
                enum: [no-cache]
          content:
            application/json:
              schema:
                $ref: '../schemas/admin.yaml#/schemas/ChannelCredentialsRevealed'
        '400':
          $ref: '../components/responses.yaml#/responses/Error400'
        '401':
          $ref: '../components/responses.yaml#/responses/Error401'
        '403':
          $ref: '../components/responses.yaml#/responses/Error403'
        '404':
          $ref: '../components/responses.yaml#/responses/Error404'
        '422':
          $ref: '../components/responses.yaml#/responses/Error422'
        '429':
          $ref: '../components/responses.yaml#/responses/Error429'
        '503':
          $ref: '../components/responses.yaml#/responses/Error503'

  # 渠道指标（W16-1 / modules-06 F-06-11）。只读；数据源是日志库 usage_logs，
  # 当前实现为「直查 + 60s Redis 缓存」（worker 预聚合登记为后续收敛）。
  /api/channels/{id}/metrics:
    get:
      tags: [admin]
      operationId: getChannelMetrics
      x-required-permission: channels:read
      summary: 渠道健康与用量指标（24h/7d 整点桶）
      description: |
        返回 24（window=24h，默认）或 168（window=7d）个整点桶及窗口汇总。
        成功率口径 = success / (success + error + refused)（modules-05 §10.2）；
        refunded 计入 request_count 但不入成功率分母。空桶计数为 0、比率与
        均值为 null（UI 显示 —，不是 0）。日志库不可用 → 503（渠道列表仍可用）；
        渠道不存在 → 404；window 非法 → 422。
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          description: 渠道 id（正整数）；非法/不存在同形 404。
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: window
          in: query
          required: false
          description: 时间窗口；缺省 24h。
          schema:
            type: string
            enum: [24h, 7d]
            default: 24h
      responses:
        '200':
          description: 指标序列与汇总
          content:
            application/json:
              schema:
                $ref: '../schemas/admin.yaml#/schemas/ChannelMetrics'
        '401':
          $ref: '../components/responses.yaml#/responses/Error401'
        '403':
          $ref: '../components/responses.yaml#/responses/Error403'
        '404':
          $ref: '../components/responses.yaml#/responses/Error404'
        '422':
          $ref: '../components/responses.yaml#/responses/Error422'
        '503':
          $ref: '../components/responses.yaml#/responses/Error503'

  # 渠道连通性测试（modules-06 F-06-06）。W16-1 起增加独立桶
  # 「10 次/分钟/管理员」（modules-08 F-08-16 冻结值），超限 429 + Retry-After；
  # Redis 不可用时 fail-open（测试是只读探针，不阻断管理动作）。
  /api/channels/{id}/test:
    post:
      tags: [admin]
      operationId: testChannel
      x-required-permission: channels:manage
      summary: 对渠道发起一次连通性测试
      description: |
        请求体可选（model 必须属于该渠道 supported_models；缺省用 test_model
        或首个模型）。连通性失败是业务结果：仍为 200，body.success=false 并带
        error_class。失败不返回上游 URL/密钥等内部细节（GC-6）。
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
        - $ref: '../components/params.yaml#/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/admin.yaml#/schemas/ChannelTestRequest'
      responses:
        '200':
          description: 测试结果（success=false 也是 200）
          content:
            application/json:
              schema:
                $ref: '../schemas/admin.yaml#/schemas/ChannelTestResult'
        '401':
          $ref: '../components/responses.yaml#/responses/Error401'
        '403':
          $ref: '../components/responses.yaml#/responses/Error403'
        '404':
          $ref: '../components/responses.yaml#/responses/Error404'
        '422':
          $ref: '../components/responses.yaml#/responses/Error422'
        '429':
          $ref: '../components/responses.yaml#/responses/Error429'
        '503':
          $ref: '../components/responses.yaml#/responses/Error503'

  # 渠道模型性能测速（管理员显式发起的流式探测批次）。上游失败是样本事实
  # （success_rate 反映观测），仍为 200；结果必须持久化成功才返回。与 /test
  # 共用「10 次/分钟/管理员」限流桶，Redis 故障 fail-open。
  /api/channels/{id}/performance-tests:
    post:
      tags: [admin]
      operationId: createChannelPerformanceTest
      x-required-permission: channels:manage
      summary: 对渠道模型发起一批流式性能探测
      description: |
        以固定短 prompt 顺序执行 runs 次流式请求，采集 TTFT、总延迟、输出 token
        与 TPS，并在同一事务内保存汇总与逐次明细。model 必须属于该渠道
        supported_models；runs 缺省 3（1..5）。与连通性测试共用
        「10 次/分钟/管理员」限流桶（超限 429 + Retry-After；Redis 故障 fail-open）。
        Performer/存储未装配 → 503；聚合值绝不返回未持久化的结果。错误体不含
        上游 URL、凭据或原始错误文本（GC-6）。
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
        - $ref: '../components/params.yaml#/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/admin.yaml#/schemas/ModelPerformanceTestRequest'
      responses:
        '200':
          description: 已持久化的性能测试结果
          content:
            application/json:
              schema:
                $ref: '../schemas/admin.yaml#/schemas/ModelPerformanceTest'
        '400':
          $ref: '../components/responses.yaml#/responses/Error400'
        '401':
          $ref: '../components/responses.yaml#/responses/Error401'
        '403':
          $ref: '../components/responses.yaml#/responses/Error403'
        '404':
          $ref: '../components/responses.yaml#/responses/Error404'
        '422':
          $ref: '../components/responses.yaml#/responses/Error422'
        '429':
          $ref: '../components/responses.yaml#/responses/Error429'
        '503':
          $ref: '../components/responses.yaml#/responses/Error503'
    get:
      tags: [admin]
      operationId: listChannelPerformanceTests
      x-required-permission: channels:read
      summary: 渠道模型性能测速历史
      description: |
        返回该渠道最近的测速记录（新→旧）。model 可选，按模型精确过滤；
        limit 缺省 20，范围 1..100（越界 422）。渠道不存在 → 404。
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: model
          in: query
          required: false
          description: 可选；按模型精确过滤。
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: 返回条数；缺省 20，上限 100。
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: 测速历史（新→旧）
          content:
            application/json:
              schema:
                $ref: '../schemas/admin.yaml#/schemas/ModelPerformanceTestList'
        '401':
          $ref: '../components/responses.yaml#/responses/Error401'
        '403':
          $ref: '../components/responses.yaml#/responses/Error403'
        '404':
          $ref: '../components/responses.yaml#/responses/Error404'
        '422':
          $ref: '../components/responses.yaml#/responses/Error422'
        '503':
          $ref: '../components/responses.yaml#/responses/Error503'

  # 渠道模型目录拉取（只读探针；创建/编辑渠道表单共用）。编辑模式以
  # channel_id 指定渠道，base_url 与机密凭据按其已保存值兜底（请求显式值优先）。
  # 权限与凭据揭示同级（channels:manage_sensitive）：请求可能携带明文密钥并
  # 发往上游。独立桶「10 次/分钟/管理员」，Redis 故障 fail-open（与测试桶同族）。
  /api/channels/fetch-models:
    post:
      tags: [admin]
      operationId: fetchChannelModels
      x-required-permission: channels:manage_sensitive
      summary: 拉取上游渠道支持的模型列表
      description: |
        只读探针：不落库、不改渠道，失败不触发自动禁用。请求体必填（`{}`
        也必须是合法 JSON，否则 400）。未知渠道类型、缺失 api_key、非法
        base_url → 422；渠道类型已定义但上游模型目录不支持 → 400；
        channel_id 不存在 → 404；上游模型目录请求失败 → 502；按管理员
        10 次/分钟限流，超限 429 + Retry-After。响应只含模型 ID，永不回显
        凭据或上游地址（GC-6）。
      security:
        - sessionCookie: []
      parameters:
        - $ref: '../components/params.yaml#/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/admin.yaml#/schemas/ChannelFetchModelsRequest'
      responses:
        '200':
          description: 上游模型目录
          content:
            application/json:
              schema:
                $ref: '../schemas/admin.yaml#/schemas/ChannelFetchModelsResponse'
        '400':
          $ref: '../components/responses.yaml#/responses/Error400'
        '401':
          $ref: '../components/responses.yaml#/responses/Error401'
        '403':
          $ref: '../components/responses.yaml#/responses/Error403'
        '404':
          $ref: '../components/responses.yaml#/responses/Error404'
        '422':
          $ref: '../components/responses.yaml#/responses/Error422'
        '429':
          $ref: '../components/responses.yaml#/responses/Error429'
        '502':
          $ref: '../components/responses.yaml#/responses/Error502'

  # ---------------------------------------------------------------------------
  # 定价管理（M3 Task 7 / modules-06 F-06-13/14/16）
  #
  # 命名空间：管理面是 /api/model-pricing 与 /api/group-pricing；公开目录
  # /api/pricing 归模块 09，二者不得混用（modules-06 G-5 裁决）。
  # ---------------------------------------------------------------------------
  /api/model-pricing:
    get:
      tags: [admin]
      operationId: listModelPricing
      x-required-permission: pricing:read
      summary: 模型定价列表（offset 分页 + 筛选）
      description: |
        keyword 为模型名前缀匹配；mode/status 精确筛选；sort 白名单
        model/-model/prompt_price/-prompt_price/updated_at/-updated_at，
        默认模型名升序。非法枚举/排序 400（不静默忽略）。
      security:
        - sessionCookie: []
      parameters:
        - $ref: '../components/pagination.yaml#/parameters/Page'
        - $ref: '../components/pagination.yaml#/parameters/PageSize'
        - name: keyword
          in: query
          required: false
          schema:
            type: string
            maxLength: 128
        - name: mode
          in: query
          required: false
          schema:
            $ref: '../schemas/admin.yaml#/schemas/PricingMode'
        - name: status
          in: query
          required: false
          description: 接受 1/2 与 enabled/disabled。
          schema:
            type: string
            enum: ['1', '2', enabled, disabled]
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [model, -model, prompt_price, -prompt_price, updated_at, -updated_at]
            default: model
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '../schemas/admin.yaml#/schemas/ModelPricingList'
        '400':
          $ref: '../components/responses.yaml#/responses/Error400'
        '401':
          $ref: '../components/responses.yaml#/responses/Error401'
        '403':
          $ref: '../components/responses.yaml#/responses/Error403'
        '500':
          $ref: '../components/responses.yaml#/responses/Error500'
    post:
      tags: [admin]
      operationId: createModelPricing
      x-required-permission: pricing:manage
      summary: 创建模型定价（Idempotency-Key）
      description: |
        价格是整数积分（积分/1M tokens；per_request 时 prompt_price=积分/次）。
        billing_expr 非空即表达式模式：保存期用 pricing.ParsePricing 编译并
        校验变量白名单，非法/空白 400（problem.fields=[billing_expr]）；
        表达式与数值价列混用 400。模型重复 409。
      security:
        - sessionCookie: []
      parameters:
        - $ref: '../components/params.yaml#/parameters/IdempotencyKey'
        - $ref: '../components/params.yaml#/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/admin.yaml#/schemas/ModelPricingCreateRequest'
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema:
                $ref: '../schemas/admin.yaml#/schemas/ModelPricing'
        '400':
          $ref: '../components/responses.yaml#/responses/Error400'
        '401':
          $ref: '../components/responses.yaml#/responses/Error401'
        '403':
          $ref: '../components/responses.yaml#/responses/Error403'
        '409':
          $ref: '../components/responses.yaml#/responses/Error409'
        '422':
          $ref: '../components/responses.yaml#/responses/Error422'
        '500':
          $ref: '../components/responses.yaml#/responses/Error500'

  /api/model-pricing/models:
    get:
      tags: [admin]
      operationId: listPricingModels
      x-required-permission: pricing:read
      summary: 模型选择器（已定价模型清单）
      description: 默认只返回启用模型；status=all 含停用。用于定价/覆盖价抽屉的下拉。
      security:
        - sessionCookie: []
      parameters:
        - name: keyword
          in: query
          required: false
          schema:
            type: string
            maxLength: 128
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: ['1', '2', enabled, disabled, all]
            default: '1'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 200
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '../schemas/admin.yaml#/schemas/PricingModelList'
        '400':
          $ref: '../components/responses.yaml#/responses/Error400'
        '401':
          $ref: '../components/responses.yaml#/responses/Error401'
        '403':
          $ref: '../components/responses.yaml#/responses/Error403'
        '500':
          $ref: '../components/responses.yaml#/responses/Error500'

  /api/model-pricing/candidates:
    get:
      tags: [admin]
      operationId: listPricingCandidates
      x-required-permission: pricing:read
      summary: 已添加模型的候选并集（选择已有模型来定价）
      description: |
        合并 model_meta.model_name、channels.supported_models、
        channels.model_mapping 的键与 model_pricing.model，按模型名去重。
        `priced` 表示已存在定价行（含停用行）；未定价行 `mode` 为 per_token
        （新建草稿的默认计费方式）。keyword 为大小写不敏感子串。
        **不返回**渠道 id、凭据或上游地址：候选只服务定价选择器。
      security:
        - sessionCookie: []
      parameters:
        - name: keyword
          in: query
          required: false
          schema:
            type: string
            maxLength: 128
          description: 模型名子串（大小写不敏感）。
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 200
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '../schemas/admin.yaml#/schemas/PricingCandidateList'
        '400':
          $ref: '../components/responses.yaml#/responses/Error400'
        '401':
          $ref: '../components/responses.yaml#/responses/Error401'
        '403':
          $ref: '../components/responses.yaml#/responses/Error403'
        '500':
          $ref: '../components/responses.yaml#/responses/Error500'

  /api/model-pricing:preview:
    post:
      tags: [admin]
      operationId: previewModelPricing
      x-required-permission: pricing:read
      summary: 实时求值预览（spec + 样例变量）
      description: |
        复用 pricing.ParsePricingSpec + pricing.ComputeQuota：不写库、不做
        第二套计价。返回整数积分与按 quota_per_unit 换算的元金额
        （HALF_UP 到分）。spec 非法 400；params 非法 400。
      security:
        - sessionCookie: []
      parameters:
        - $ref: '../components/params.yaml#/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/admin.yaml#/schemas/ModelPricingPreviewRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '../schemas/admin.yaml#/schemas/ModelPricingPreviewResponse'
        '400':
          $ref: '../components/responses.yaml#/responses/Error400'
        '401':
          $ref: '../components/responses.yaml#/responses/Error401'
        '403':
          $ref: '../components/responses.yaml#/responses/Error403'
        '500':
          $ref: '../components/responses.yaml#/responses/Error500'

  /api/model-pricing:preview-strategy:
    post:
      tags: [admin]
      operationId: previewPricingStrategy
      x-required-permission: pricing:read
      summary: 时段策略试算（完整草稿 + 样例用量）
      description: |
        接受完整草稿（mode + prices + strategy）与试算时间 `at`，纯计算、
        不写库。返回命中的时段/节假日事实、规范化策略、应用倍率后的各分项
        单价与总价。价格换算复用 pricing.ParsePricingSpec/ComputeQuota，
        时段乘法复用 pricing.ApplyTimeMultiplier——与结算同一实现。
        `strategy` 与 `billing_expr` 互斥，因此只接受 per_token / per_request。
        节假日查询失败时按星期规则试算，并在 match.holiday_lookup_failed
        标记（不失败、不免费）。
      security:
        - sessionCookie: []
      parameters:
        - $ref: '../components/params.yaml#/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/admin.yaml#/schemas/ModelPricingStrategyPreviewRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '../schemas/admin.yaml#/schemas/ModelPricingStrategyPreviewResponse'
        '400':
          $ref: '../components/responses.yaml#/responses/Error400'
        '401':
          $ref: '../components/responses.yaml#/responses/Error401'
        '403':
          $ref: '../components/responses.yaml#/responses/Error403'
        '422':
          $ref: '../components/responses.yaml#/responses/Error422'
        '500':
          $ref: '../components/responses.yaml#/responses/Error500'

  /api/model-pricing/{model}:
    get:
      tags: [admin]
      operationId: getModelPricing
      x-required-permission: pricing:read
      summary: 读取单条模型定价（含完整 strategy）
      description: |
        列表只返回 has_strategy/strategy_kind 摘要；编辑工作台需要完整窗口
        才能回填，因此单条读取返回规范化后的 `strategy`（无策略时为 null）。
      security:
        - sessionCookie: []
      parameters:
        - $ref: '../components/params.yaml#/parameters/PathPricingModel'
      responses:
        '200':
          description: 定价行
          content:
            application/json:
              schema:
                $ref: '../schemas/admin.yaml#/schemas/ModelPricing'
        '400':
          $ref: '../components/responses.yaml#/responses/Error400'
        '401':
          $ref: '../components/responses.yaml#/responses/Error401'
        '403':
          $ref: '../components/responses.yaml#/responses/Error403'
        '404':
          $ref: '../components/responses.yaml#/responses/Error404'
        '500':
          $ref: '../components/responses.yaml#/responses/Error500'
    patch:
      tags: [admin]
      operationId: updateModelPricing
      x-required-permission: pricing:manage
      summary: 部分更新模型定价（updated_at 乐观锁）
      description: |
        必须原样回传 updated_at（缺失 400、不匹配 409）。model 不可改
        （提交 model 由字段策略 403）。离开 tiered_expr 必须显式
        billing_expr:null；在表达式行上写数值价列 422。
      security:
        - sessionCookie: []
      parameters:
        - $ref: '../components/params.yaml#/parameters/PathPricingModel'
        - $ref: '../components/params.yaml#/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/admin.yaml#/schemas/ModelPricingUpdateRequest'
      responses:
        '200':
          description: 更新后的定价
          content:
            application/json:
              schema:
                $ref: '../schemas/admin.yaml#/schemas/ModelPricing'
        '400':
          $ref: '../components/responses.yaml#/responses/Error400'
        '401':
          $ref: '../components/responses.yaml#/responses/Error401'
        '403':
          $ref: '../components/responses.yaml#/responses/Error403'
        '404':
          $ref: '../components/responses.yaml#/responses/Error404'
        '409':
          $ref: '../components/responses.yaml#/responses/Error409'
        '422':
          $ref: '../components/responses.yaml#/responses/Error422'
        '500':
          $ref: '../components/responses.yaml#/responses/Error500'
    delete:
      tags: [admin]
      operationId: deleteModelPricing
      x-required-permission: pricing:manage
      summary: 删除模型定价（updated_at 乐观锁）
      description: |
        删除模型时同一事务清理其 group_pricing 覆盖价（覆盖价脱离源定价
        没有意义，留下孤儿会在重建同名模型时「复活」旧价）。
      security:
        - sessionCookie: []
      parameters:
        - $ref: '../components/params.yaml#/parameters/PathPricingModel'
        - $ref: '../components/params.yaml#/parameters/UpdatedAtQuery'
        - $ref: '../components/params.yaml#/parameters/CSRFToken'
      responses:
        '204':
          description: 已删除
        '400':
          $ref: '../components/responses.yaml#/responses/Error400'
        '401':
          $ref: '../components/responses.yaml#/responses/Error401'
        '403':
          $ref: '../components/responses.yaml#/responses/Error403'
        '404':
          $ref: '../components/responses.yaml#/responses/Error404'
        '409':
          $ref: '../components/responses.yaml#/responses/Error409'
        '500':
          $ref: '../components/responses.yaml#/responses/Error500'

  /api/model-pricing/{model}:enable:
    post:
      tags: [admin]
      operationId: enableModelPricing
      x-required-permission: pricing:manage
      summary: 启用模型定价
      security:
        - sessionCookie: []
      parameters:
        - $ref: '../components/params.yaml#/parameters/PathPricingModel'
        - $ref: '../components/params.yaml#/parameters/CSRFToken'
      requestBody:
        required: true
        content:
