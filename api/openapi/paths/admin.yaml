  /api/vendors/operations:
    post:
      tags: [admin]
      operationId: applyVendorOperations
      x-required-permission: channels:manage_sensitive
      summary: 供应商批量操作（assign / merge / delete）
      description: |
        必须回传 preview 的 expected_version；缺失或过期 ⇒ 409
        vendor_conflict（conflicts[] 给出涉及供应商的当前版本）。
        merge 先把源供应商的模型改挂目标再删源；delete 仅允许零引用
        （有引用 ⇒ 409 vendor_referenced + reference_count）。
        事务内任一失败整体回滚。
      security:
        - sessionCookie: []
      parameters:
        - $ref: '../components/params.yaml#/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/admin.yaml#/schemas/VendorOperationRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '../schemas/admin.yaml#/schemas/VendorOperationResult'
        '400':
          $ref: '../components/responses.yaml#/responses/Error400'
        '401':
          $ref: '../components/responses.yaml#/responses/Error401'
        '403':
          $ref: '../components/responses.yaml#/responses/Error403'
        '404':
          $ref: '../components/responses.yaml#/responses/Error404'
        '409':
          $ref: '../components/responses.yaml#/responses/Error409'
        '422':
          $ref: '../components/responses.yaml#/responses/Error422'
        '500':
          $ref: '../components/responses.yaml#/responses/Error500'

  /api/vendors/{id}:
    get:
      tags: [admin]
      operationId: getVendor
      x-required-permission: channels:read
      summary: 供应商详情
      security:
        - sessionCookie: []
