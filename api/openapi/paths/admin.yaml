  # ---------------------------------------------------------------------------
  # 任务插件管理（M6d Task 5 / modules-08 §3.10 / relay-06 §2.4–§2.6）
  #
  # 权限（裁决 R-M6D-16，取代 R-M6D-02 的「读 admin」）：读写端点统一
  # 要求 settings:manage——受限 admin 不得读取插件源码/运行时诊断。
  # 所有响应不含上游凭据；列表/审计永不包含插件源文本（S5）。
  # ---------------------------------------------------------------------------
  # ---------------------------------------------------------------------------
  # 渠道 → 任务插件绑定选项（M6d Task 7a / relay-06 §1.3、§2.6）
  #
  # 权限是 channels:read（R-M6D-02），不是 settings:manage：这是渠道表单的
  # 数据源，不是插件管理面。只返回注册表中当前可执行的插件。
  # ---------------------------------------------------------------------------
  /api/task_plugin_options:
    get:
      tags: [admin]
      operationId: listTaskPluginOptions
      x-required-permission: channels:read
      summary: 任务插件绑定选项
      description: |
        渠道创建/编辑表单的插件候选。只列注册表中有可执行层的插件
        （registered 或回退到上传层的 disabled_fallback）；编译失败/未注册
        的 key 不出现。channel_count 只统计 status=1 的渠道，口径与
        /api/plugin/task 的 bound_channels 一致。按 key 升序。
      security:
        - sessionCookie: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '../schemas/admin.yaml#/schemas/TaskPluginOptions'
        '401':
          $ref: '../components/responses.yaml#/responses/Error401'
        '403':
          $ref: '../components/responses.yaml#/responses/Error403'
        '429':
          $ref: '../components/responses.yaml#/responses/Error429'

  /api/plugin/task:
    get:
      tags: [admin]
      operationId: listTaskPlugins
      x-required-permission: settings:manage
      summary: 插件列表（运行状态徽章 + 筛选 + 分页）
      description: |
        默认排序「运行状态异常优先，其次名称」。search 匹配 key/名称；
        source=builtin|upload；enabled=true|false；runtime_status 取五态之一。
        响应不含源文本与密钥（S5）。
      security:
        - sessionCookie: []
      parameters:
        - name: search
          in: query
          required: false
          schema: {type: string}
        - name: source
          in: query
          required: false
          schema: {type: string, enum: [builtin, upload]}
        - name: enabled
          in: query
          required: false
          schema: {type: boolean}
        - name: runtime_status
          in: query
          required: false
          schema: {$ref: '../schemas/admin.yaml#/schemas/TaskPluginRuntimeStatus'}
        - $ref: '../components/pagination.yaml#/parameters/Page'
        - $ref: '../components/pagination.yaml#/parameters/PageSize'
      responses:
        '200':
          description: 插件分页
          content:
            application/json:
              schema: {$ref: '../schemas/admin.yaml#/schemas/TaskPluginPage'}
        '400': {$ref: '../components/responses.yaml#/responses/Error400'}
        '401': {$ref: '../components/responses.yaml#/responses/Error401'}
        '403': {$ref: '../components/responses.yaml#/responses/Error403'}
        '500': {$ref: '../components/responses.yaml#/responses/Error500'}
    post:
      tags: [admin]
      operationId: uploadTaskPlugin
      x-required-permission: settings:manage
      summary: 上传插件源（JSON 或 multipart，默认不激活）
      description: |
        服务端计算 sha256 并编译/校验（S1）：失败 422 plugin_compile_failed
        且零写入。同 (key, version) 同 hash 幂等返回 200；异 hash 422/409
        plugin_version_conflict。入库 enabled=true、active=false（R-M6D-07）。
        必须携带 Idempotency-Key。multipart 文件必须为 .js，正文 ≤
        plugin.upload.max_bytes（默认 2 MiB）。
      security:
        - sessionCookie: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '../schemas/admin.yaml#/schemas/UploadTaskPluginRequest'}
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: 幂等命中已有版本
          content:
            application/json:
              schema: {$ref: '../schemas/admin.yaml#/schemas/UploadTaskPluginResponse'}
        '201':
          description: 新版本已入库（不自动激活）
          content:
            application/json:
              schema: {$ref: '../schemas/admin.yaml#/schemas/UploadTaskPluginResponse'}
        '400': {$ref: '../components/responses.yaml#/responses/Error400'}
        '401': {$ref: '../components/responses.yaml#/responses/Error401'}
        '403': {$ref: '../components/responses.yaml#/responses/Error403'}
        '409': {$ref: '../components/responses.yaml#/responses/Error409'}
        '422': {$ref: '../components/responses.yaml#/responses/Error422'}
        '500': {$ref: '../components/responses.yaml#/responses/Error500'}

  /api/plugin/task/runtime/status:
    get:
      tags: [admin]
      operationId: getTaskPluginRuntimeStatus
      x-required-permission: settings:manage
      summary: 本副本插件运行时状态
      description: |
        generation 是节点本地号，跨节点比较必须用 revision（relay-06 §2.5）。
        逐副本聚合（失联判定）需要实例心跳表，当前返回单节点对象。
      security:
        - sessionCookie: []
      responses:
        '200':
          description: 运行时快照
          content:
            application/json:
              schema: {$ref: '../schemas/admin.yaml#/schemas/PluginRuntimeStatus'}
        '401': {$ref: '../components/responses.yaml#/responses/Error401'}
        '403': {$ref: '../components/responses.yaml#/responses/Error403'}
        '500': {$ref: '../components/responses.yaml#/responses/Error500'}

  /api/plugin/task/marketplace:
    get:
      tags: [admin]
      operationId: getPluginMarketplace
      x-required-permission: settings:manage
      summary: 聚合市场索引（含安装/升级标记）
      description: |
        plugin.marketplace.enabled=false 时 409 plugin_marketplace_disabled。
        仅聚合已启用源；refresh=1 绕过 5 分钟缓存。多源同 key+version 不同
        hash 标记 conflict，不猜测权威源。
      security:
        - sessionCookie: []
      parameters:
        - name: refresh
          in: query
          required: false
          schema: {type: string, enum: ['0', '1']}
      responses:
        '200':
          description: 聚合索引
          content:
            application/json:
              schema: {$ref: '../schemas/admin.yaml#/schemas/MarketplaceHome'}
        '401': {$ref: '../components/responses.yaml#/responses/Error401'}
        '403': {$ref: '../components/responses.yaml#/responses/Error403'}
        '409': {$ref: '../components/responses.yaml#/responses/Error409'}
        '500': {$ref: '../components/responses.yaml#/responses/Error500'}

  /api/plugin/task/marketplace/sources:
    get:
      tags: [admin]
      operationId: listPluginMarketplaceSources
      x-required-permission: settings:manage
      summary: 市场源列表（含最近校验状态）
      security:
        - sessionCookie: []
      responses:
        '200':
          description: 市场源列表
          content:
            application/json:
              schema: {$ref: '../schemas/admin.yaml#/schemas/MarketplaceSourceList'}
        '401': {$ref: '../components/responses.yaml#/responses/Error401'}
        '403': {$ref: '../components/responses.yaml#/responses/Error403'}
        '500': {$ref: '../components/responses.yaml#/responses/Error500'}
    put:
      tags: [admin]
      operationId: replacePluginMarketplaceSources
      x-required-permission: settings:manage
      summary: 整份替换市场源并立即试拉
      description: |
        仅接受 https（R-M6D-03）并套用最小 SSRF 守卫（拒绝私网/环回字面量、
        userinfo 与重定向）。保存前校验名称/URL 唯一性；保存后立即试拉每个
        启用源并写回 ok/failed（失败仍保存）。
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '../schemas/admin.yaml#/schemas/UpdateMarketplaceSourcesRequest'}
      responses:
        '200':
          description: 保存后的市场源列表
          content:
            application/json:
              schema: {$ref: '../schemas/admin.yaml#/schemas/MarketplaceSourceList'}
        '400': {$ref: '../components/responses.yaml#/responses/Error400'}
        '401': {$ref: '../components/responses.yaml#/responses/Error401'}
        '403': {$ref: '../components/responses.yaml#/responses/Error403'}
        '409': {$ref: '../components/responses.yaml#/responses/Error409'}
        '422': {$ref: '../components/responses.yaml#/responses/Error422'}
        '500': {$ref: '../components/responses.yaml#/responses/Error500'}

  /api/plugin/task/marketplace/sources/{id}/check:
    post:
      tags: [admin]
      operationId: checkPluginMarketplaceSource
      x-required-permission: settings:manage
      summary: 重新试拉一个市场源
      description: 远端失败不返回 5xx：写回 last_check_status=failed 与分类摘要后返回 200。
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: 更新后的市场源
          content:
            application/json:
              schema: {$ref: '../schemas/admin.yaml#/schemas/MarketplaceSource'}
        '401': {$ref: '../components/responses.yaml#/responses/Error401'}
        '403': {$ref: '../components/responses.yaml#/responses/Error403'}
        '404': {$ref: '../components/responses.yaml#/responses/Error404'}
        '500': {$ref: '../components/responses.yaml#/responses/Error500'}

  /api/plugin/task/marketplace/install:
    post:
      tags: [admin]
      operationId: installPluginFromMarketplace
      x-required-permission: settings:manage
      summary: 从市场安装一个版本（默认不激活）
      description: |
        下载包体 → 校验 source_hash（不符 422 plugin_hash_mismatch 且零写入）
        → 与上传同一编译/校验关口 → 入库非激活版本。包体 key/version 必须
        与索引声明一致（否则 422 plugin_package_mismatch）。activate=true 才激活。
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '../schemas/admin.yaml#/schemas/MarketplaceInstallRequest'}
      responses:
        '200':
          description: 已安装（幂等命中已有版本）
          content:
            application/json:
              schema: {$ref: '../schemas/admin.yaml#/schemas/MarketplaceInstallResponse'}
        '201':
          description: 新版本已安装
          content:
            application/json:
              schema: {$ref: '../schemas/admin.yaml#/schemas/MarketplaceInstallResponse'}
        '400': {$ref: '../components/responses.yaml#/responses/Error400'}
        '401': {$ref: '../components/responses.yaml#/responses/Error401'}
        '403': {$ref: '../components/responses.yaml#/responses/Error403'}
        '404': {$ref: '../components/responses.yaml#/responses/Error404'}
        '409': {$ref: '../components/responses.yaml#/responses/Error409'}
        '422': {$ref: '../components/responses.yaml#/responses/Error422'}
        '500': {$ref: '../components/responses.yaml#/responses/Error500'}
        '502': {$ref: '../components/responses.yaml#/responses/Error502'}

  /api/plugin/task/{key}:
    get:
      tags: [admin]
      operationId: getTaskPlugin
      x-required-permission: settings:manage
      summary: 插件详情（可选源文本）
      description: include_source=1 时附带 active（否则最新）版本的只读源文本。
      security:
        - sessionCookie: []
      parameters:
        - name: key
          in: path
          required: true
          schema: {type: string}
        - name: include_source
          in: query
          required: false
          schema: {type: string, enum: ['0', '1']}
      responses:
        '200':
          description: 插件详情
          content:
            application/json:
              schema: {$ref: '../schemas/admin.yaml#/schemas/TaskPluginDetail'}
        '401': {$ref: '../components/responses.yaml#/responses/Error401'}
        '403': {$ref: '../components/responses.yaml#/responses/Error403'}
        '404': {$ref: '../components/responses.yaml#/responses/Error404'}
        '500': {$ref: '../components/responses.yaml#/responses/Error500'}

  /api/plugin/task/{key}/versions:
    get:
      tags: [admin]
      operationId: listTaskPluginVersions
      x-required-permission: settings:manage
      summary: 插件版本列表（按创建时间倒序）
      security:
        - sessionCookie: []
      parameters:
        - name: key
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: 版本列表
          content:
            application/json:
              schema: {$ref: '../schemas/admin.yaml#/schemas/TaskPluginVersionList'}
        '401': {$ref: '../components/responses.yaml#/responses/Error401'}
        '403': {$ref: '../components/responses.yaml#/responses/Error403'}
        '404': {$ref: '../components/responses.yaml#/responses/Error404'}
        '500': {$ref: '../components/responses.yaml#/responses/Error500'}

  /api/plugin/task/{key}/source:
    get:
      tags: [admin]
      operationId: getTaskPluginSourceText
      x-required-permission: settings:manage
      summary: 只读源查看器
      description: version 缺省时取 active 版本（无 active 取最新）。
      security:
        - sessionCookie: []
      parameters:
        - name: key
          in: path
          required: true
          schema: {type: string}
        - name: version
          in: query
          required: false
          schema: {type: string}
      responses:
        '200':
          description: 源文本
          content:
            application/json:
              schema: {$ref: '../schemas/admin.yaml#/schemas/TaskPluginSourceText'}
        '401': {$ref: '../components/responses.yaml#/responses/Error401'}
        '403': {$ref: '../components/responses.yaml#/responses/Error403'}
        '404': {$ref: '../components/responses.yaml#/responses/Error404'}
        '500': {$ref: '../components/responses.yaml#/responses/Error500'}

  /api/plugin/task/{key}/activate:
    post:
      tags: [admin]
      operationId: activateTaskPluginVersion
      x-required-permission: settings:manage
      summary: 激活版本（同 key 至多一个 active）
      description: |
        事务 + SELECT ... FOR UPDATE；同 key 其它行 active=false，目标行
        active=true、enabled=true，并同步 B-11 active_version 镜像。
        expect_updated_at 陈旧 → 409 plugin_updated_at_conflict。
      security:
        - sessionCookie: []
      parameters:
        - name: key
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '../schemas/admin.yaml#/schemas/PluginActivateRequest'}
      responses:
        '200':
          description: 激活结果
          content:
            application/json:
              schema: {$ref: '../schemas/admin.yaml#/schemas/PluginActivateResponse'}
        '400': {$ref: '../components/responses.yaml#/responses/Error400'}
        '401': {$ref: '../components/responses.yaml#/responses/Error401'}
        '403': {$ref: '../components/responses.yaml#/responses/Error403'}
        '404': {$ref: '../components/responses.yaml#/responses/Error404'}
        '409': {$ref: '../components/responses.yaml#/responses/Error409'}
        '500': {$ref: '../components/responses.yaml#/responses/Error500'}

  /api/plugin/task/{key}/status:
    post:
      tags: [admin]
      operationId: setTaskPluginStatus
      x-required-permission: settings:manage
      summary: 启用/禁用插件
      description: |
        enabled 必填；expect_updated_at 是乐观锁版本。禁用被渠道绑定的插件时
        响应返回真实的 bound_channels（status=1 且单绑/多绑该 key 的渠道数），
        供前端预检列出受影响渠道。已提交任务不受影响。
      security:
        - sessionCookie: []
      parameters:
        - name: key
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '../schemas/admin.yaml#/schemas/PluginStatusRequest'}
      responses:
        '200':
          description: 更新结果
          content:
            application/json:
              schema: {$ref: '../schemas/admin.yaml#/schemas/PluginStatusResponse'}
        '400': {$ref: '../components/responses.yaml#/responses/Error400'}
        '401': {$ref: '../components/responses.yaml#/responses/Error401'}
        '403': {$ref: '../components/responses.yaml#/responses/Error403'}
        '404': {$ref: '../components/responses.yaml#/responses/Error404'}
        '409': {$ref: '../components/responses.yaml#/responses/Error409'}
        '500': {$ref: '../components/responses.yaml#/responses/Error500'}

  /api/plugin/task/{key}/versions/{version}:
    delete:
      tags: [admin]
      operationId: deleteTaskPluginVersion
      x-required-permission: settings:manage
      summary: 删除版本（active 版本按创建时间提升上一版本）
      description: |
        唯一版本禁删；删除 active 且没有 enabled 的旧版本可提升 → 409
        plugin_version_required。expect_updated_at 陈旧 → 409。
      security:
        - sessionCookie: []
      parameters:
        - name: key
          in: path
          required: true
          schema: {type: string}
        - name: version
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '../schemas/admin.yaml#/schemas/PluginVersionDeleteRequest'}
      responses:
        '200':
          description: 删除结果
          content:
            application/json:
              schema: {$ref: '../schemas/admin.yaml#/schemas/PluginVersionDeleteResponse'}
        '400': {$ref: '../components/responses.yaml#/responses/Error400'}
        '401': {$ref: '../components/responses.yaml#/responses/Error401'}
        '403': {$ref: '../components/responses.yaml#/responses/Error403'}
        '404': {$ref: '../components/responses.yaml#/responses/Error404'}
        '409': {$ref: '../components/responses.yaml#/responses/Error409'}
        '500': {$ref: '../components/responses.yaml#/responses/Error500'}

  /api/plugin/task/{key}/dryrun:
    post:
      tags: [admin]
      operationId: dryRunTaskPlugin
      x-required-permission: settings:manage
      summary: 沙箱试运行（默认零副作用）
      description: |
        不写任务表、不扣费、不出站。allow_outbound=true 在出站执行器落地前
        显式 422 dryrun_outbound_unavailable（不静默忽略）。
      security:
        - sessionCookie: []
      parameters:
        - name: key
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '../schemas/admin.yaml#/schemas/PluginDryRunRequest'}
      responses:
        '200':
          description: 试运行结果
          content:
            application/json:
              schema: {$ref: '../schemas/admin.yaml#/schemas/PluginDryRunResult'}
        '400': {$ref: '../components/responses.yaml#/responses/Error400'}
        '401': {$ref: '../components/responses.yaml#/responses/Error401'}
        '403': {$ref: '../components/responses.yaml#/responses/Error403'}
        '422': {$ref: '../components/responses.yaml#/responses/Error422'}
        '500': {$ref: '../components/responses.yaml#/responses/Error500'}
