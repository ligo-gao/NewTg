  # M5 兑换码管理（modules-04 §4.F F-04-15/16；redemption:manage）。
  /api/redemption-codes:
    get:
      tags: [admin]
      operationId: listRedemptionCodes
      x-required-permission: redemption:manage
      summary: 兑换码列表（offset 分页 + 状态/批次/面额筛选）
      description: |
        status 支持 unused|disabled|used|expired；expired 是虚拟态
        （status='unused' AND expires_at <= now()），不落库。
        列表永不返回码值，只返回固定掩码 `••••••`。
      security:
        - sessionCookie: []
      parameters:
        - $ref: '../components/pagination.yaml#/parameters/Page'
        - $ref: '../components/pagination.yaml#/parameters/PageSize'
        - name: status
          in: query
          required: false
          schema:
            $ref: '../schemas/admin.yaml#/schemas/RedemptionCodeStatusFilter'
        - name: batch_name
          in: query
          required: false
          schema:
            type: string
            maxLength: 20
        - name: min_credits
          in: query
          required: false
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: max_credits
          in: query
          required: false
          schema:
            type: integer
            format: int64
            minimum: 0
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '../schemas/admin.yaml#/schemas/RedemptionCodeList'
        '400':
          $ref: '../components/responses.yaml#/responses/Error400'
        '401':
          $ref: '../components/responses.yaml#/responses/Error401'
        '403':
          $ref: '../components/responses.yaml#/responses/Error403'
        '500':
          $ref: '../components/responses.yaml#/responses/Error500'
    post:
      tags: [admin]
      operationId: createRedemptionCodes
      x-required-permission: redemption:manage
      summary: 批量生成兑换码（明文仅本响应返回一次）
      description: |
        count 1–100；credits > 0；expires_at 必须晚于 now 或为 null。
        生成 26 位 Crockford Base32，库中只存 SHA-256 哈希；碰撞自动重试
        至多 3 次。成功 201。
      security:
        - sessionCookie: []
      parameters:
        - $ref: '../components/params.yaml#/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/admin.yaml#/schemas/RedemptionCodeCreateRequest'
      responses:
        '201':
          description: 创建成功（codes 仅此一次返回）
          content:
            application/json:
              schema:
                $ref: '../schemas/admin.yaml#/schemas/RedemptionCodeCreateResponse'
        '400':
          $ref: '../components/responses.yaml#/responses/Error400'
        '401':
          $ref: '../components/responses.yaml#/responses/Error401'
        '403':
          $ref: '../components/responses.yaml#/responses/Error403'
        '500':
          $ref: '../components/responses.yaml#/responses/Error500'

