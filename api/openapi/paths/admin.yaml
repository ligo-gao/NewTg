  # ---------------------------------------------------------------------------
  # 模型部署控制面 · 设置（M6d Task 2 / modules-08 §3.20 / F-08-51）。
  #
  # 作用域化端点：写路径是 PUT /api/settings?section=deploy 的别名（同一注册表、
  # 同一 Sealer、同一 updated_at 乐观锁）。响应永不包含密钥，只有 has_secret。
  # ---------------------------------------------------------------------------
  /api/deployments/settings:
    get:
      tags: [admin]
      operationId: getDeploySettings
      x-required-permission: settings:manage
      summary: 读取部署设置状态（不含密钥）
      description: |
        只返回 enabled/has_secret/can_connect/updated_at；api_key 永不回显。
        can_connect = enabled && has_secret。
      security:
        - sessionCookie: []
      responses:
        '200':
          description: 设置投影
          content:
            application/json:
              schema:
                $ref: '../schemas/admin.yaml#/schemas/DeploySettings'
        '401':
          $ref: '../components/responses.yaml#/responses/Error401'
        '403':
          $ref: '../components/responses.yaml#/responses/Error403'
        '500':
          $ref: '../components/responses.yaml#/responses/Error500'
    put:
      tags: [admin]
      operationId: updateDeploySettings
      x-required-permission: settings:manage
      summary: 保存部署设置（section=deploy 的作用域化别名）
      description: |
        enabled 必填（显式提交整段快照）；api_key 留空或 "******" = 不更新；
        clear_api_key=true 删除已存密钥（与 api_key 同时出现时 400）。
        updated_at 是乐观锁版本，陈旧值返回 409。
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/admin.yaml#/schemas/UpdateDeploySettingsRequest'
      responses:
        '200':
          description: 保存后的设置投影
          content:
            application/json:
              schema:
                $ref: '../schemas/admin.yaml#/schemas/DeploySettings'
        '400':
          $ref: '../components/responses.yaml#/responses/Error400'
        '401':
          $ref: '../components/responses.yaml#/responses/Error401'
        '403':
          $ref: '../components/responses.yaml#/responses/Error403'
        '409':
          $ref: '../components/responses.yaml#/responses/Error409'
        '500':
          $ref: '../components/responses.yaml#/responses/Error500'

  /api/deployments/settings/test-connection:
    post:
      tags: [admin]
      operationId: testDeployConnection
      x-required-permission: settings:manage
      summary: 只读探测 io.net 连接（候选密钥可用）
      description: |
        只读探测，不创建、不修改、不落库。body 可带候选 api_key（只在本次
        请求内存中使用，不写日志/审计/响应）；缺省使用已存密钥。限流 5 次/
        分钟/管理员。provider 401/403 → 422 deploy_secret_invalid；超时 → 504
        deploy_provider_timeout；provider 429 → 429 deploy_rate_limited。
      security:
        - sessionCookie: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '../schemas/admin.yaml#/schemas/DeployConnectionTestRequest'
      responses:
        '200':
          description: 探测结果
          content:
            application/json:
              schema:
                $ref: '../schemas/admin.yaml#/schemas/DeployConnectionTestResult'
        '400':
          $ref: '../components/responses.yaml#/responses/Error400'
        '401':
          $ref: '../components/responses.yaml#/responses/Error401'
        '403':
          $ref: '../components/responses.yaml#/responses/Error403'
        '422':
          $ref: '../components/responses.yaml#/responses/Error422'
        '429':
          $ref: '../components/responses.yaml#/responses/Error429'
        '500':
          $ref: '../components/responses.yaml#/responses/Error500'
        '502':
          $ref: '../components/responses.yaml#/responses/Error502'
        '504':
          description: provider 超时（只读探测，无副作用）
          content:
            application/problem+json:
              schema:
                $ref: '../components/problem.yaml#/schemas/Problem'

  # ---------------------------------------------------------------------------
  # 模型部署控制面 · 部署管理（M6d Task 4 / modules-08 §3.20 / F-08-52～F-08-58）。
  #
  # provider 是唯一真源：本组端点只做实时代理，不落库、不镜像容器/日志。
  # 全部能力（含只读）要求 settings:manage；deploy.ionet.enabled=false 时
  # 返回 409 deploy_disabled（设置与连接测试除外）。
  # 写操作（创建/更新/改名/续期/终止）必须携带 Idempotency-Key；写超时返回
  # 504「结果未知」，网关不自动重试。
  # ---------------------------------------------------------------------------
  /api/deployments:
    get:
      tags: [admin]
      operationId: listDeployments
      x-required-permission: settings:manage
      summary: 部署列表与全量检索
      description: |
        keyword 在**全结果集**上过滤（provider 无 keyword 参数时按页扫描，
        上限 10 页 / 1000 条；达到上限时 search_truncated=true）。
        status_counts 按扫描到的全量口径统计，不受当前页影响；扫描被截断或
        provider 未返回 total 时，status_counts 与 total 只代表已扫描窗口。
        p 默认 1；page_size 默认 20、上限 100（超出截断并回显实际值）。
      security:
        - sessionCookie: []
      parameters:
        - {name: status, in: query, required: false, schema: {type: string}}
        - {name: keyword, in: query, required: false, schema: {type: string}}
        - {name: p, in: query, required: false, schema: {type: integer, minimum: 1, default: 1}}
        - {name: page_size, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      responses:
        '200':
          description: 部署列表
          content:
            application/json:
              schema:
                $ref: '../schemas/admin.yaml#/schemas/DeployDeploymentList'
        '400':
          $ref: '../components/responses.yaml#/responses/Error400'
        '401':
          $ref: '../components/responses.yaml#/responses/Error401'
        '403':
          $ref: '../components/responses.yaml#/responses/Error403'
        '409':
          $ref: '../components/responses.yaml#/responses/Error409'
        '422':
          $ref: '../components/responses.yaml#/responses/Error422'
        '502':
          $ref: '../components/responses.yaml#/responses/Error502'
        '504':
          description: provider 超时
          content:
            application/problem+json:
              schema:
                $ref: '../components/problem.yaml#/schemas/Problem'
    post:
      tags: [admin]
      operationId: createDeployment
      x-required-permission: settings:manage
      summary: 创建部署（产生 provider 侧费用）
      description: |
        创建前与提交前各查重一次名称；创建前必须先取得 provider 报价，
        报价失败返回 422 deploy_price_unavailable 且不发起写。
        provider 返回 200 但没有可用 USD 报价（缺报价字段 / 负金额 /
        estimation_valid=false / 币种非 USD）时返回 422
        `https://newtg.dev/problems/deploy_quote_unavailable`，不按 0 计。
        创建受理后在站点成本账预扣（`deployment_billing_segments`，幂等键
        `deploy:create:<user_id>:<Idempotency-Key>`）；预扣失败返回 502
        `deploy_billing_failed` 并回滚本次部署创建。同一幂等键的账本重入
        （例如换了请求体而绕开 HTTP 幂等缓存）返回**既有段**的状态与
        deployment_id：段仍活跃 → 202；段已终态 → 409（换新
        Idempotency-Key 或查询部署）。只有当 provider 返回的是**另一个**
        部署 ID 时才会回滚这次重复创建的部署——provider 对重复创建去重返回
        同一 ID 时，那是既有段对应的活部署，绝不回滚。
        部署计费只记站点成本，**不扣用户钱包 / 订阅 / 令牌额度**。
        registry_secret 与 secret_env_variables 只写不读：不落库、不回显、
        不进审计（键名也不记）。成功返回 202 受理结果。
      security:
        - sessionCookie: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: 必填；同键重放返回首次结果。
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/admin.yaml#/schemas/CreateDeploymentRequest'
      responses:
        '202':
          description: 创建请求已受理
          content:
            application/json:
              schema:
                $ref: '../schemas/admin.yaml#/schemas/DeployAction'
        '400':
          $ref: '../components/responses.yaml#/responses/Error400'
        '401':
          $ref: '../components/responses.yaml#/responses/Error401'
        '403':
          $ref: '../components/responses.yaml#/responses/Error403'
        '409':
          $ref: '../components/responses.yaml#/responses/Error409'
        '422':
          $ref: '../components/responses.yaml#/responses/Error422'
        '429':
          $ref: '../components/responses.yaml#/responses/Error429'
        '502':
          $ref: '../components/responses.yaml#/responses/Error502'
        '504':
          description: provider 超时（写结果未知；先刷新再决定是否用新键重试）
          content:
            application/problem+json:
              schema:
                $ref: '../components/problem.yaml#/schemas/Problem'

