  # ---------------------------------------------------------------------------
  # 模型部署控制面 · 设置（M6d Task 2 / modules-08 §3.20 / F-08-51）。
  #
  # 作用域化端点：写路径是 PUT /api/settings?section=deploy 的别名（同一注册表、
  # 同一 Sealer、同一 updated_at 乐观锁）。响应永不包含密钥，只有 has_secret。
  # ---------------------------------------------------------------------------
  /api/deployments/settings:
    get:
      tags: [admin]
      operationId: getDeploySettings
      x-required-permission: settings:manage
      summary: 读取部署设置状态（不含密钥）
      description: |
        只返回 enabled/has_secret/can_connect/updated_at；api_key 永不回显。
        can_connect = enabled && has_secret。
      security:
        - sessionCookie: []
      responses:
        '200':
          description: 设置投影
          content:
            application/json:
              schema:
                $ref: '../schemas/admin.yaml#/schemas/DeploySettings'
        '401':
          $ref: '../components/responses.yaml#/responses/Error401'
        '403':
          $ref: '../components/responses.yaml#/responses/Error403'
        '500':
          $ref: '../components/responses.yaml#/responses/Error500'
    put:
      tags: [admin]
      operationId: updateDeploySettings
      x-required-permission: settings:manage
      summary: 保存部署设置（section=deploy 的作用域化别名）
      description: |
        enabled 必填（显式提交整段快照）；api_key 留空或 "******" = 不更新；
        clear_api_key=true 删除已存密钥（与 api_key 同时出现时 400）。
        updated_at 是乐观锁版本，陈旧值返回 409。
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/admin.yaml#/schemas/UpdateDeploySettingsRequest'
      responses:
        '200':
          description: 保存后的设置投影
          content:
            application/json:
              schema:
                $ref: '../schemas/admin.yaml#/schemas/DeploySettings'
