# 用户自助域 DTO（modules-01 账户/认证、modules-02 API 令牌）。
# 敏感字段红线（GC-6/GC-9）：任何响应都不得出现口令、口令哈希、TOTP 种子、
# 备用码哈希、令牌 key_hash 或完整 key——完整 key 只在创建/重置响应出现一次。
schemas:
  # ---------------------------------------------------------------------------
  # 账户 / 会话
  # ---------------------------------------------------------------------------

  MeView:
    type: object
    additionalProperties: false
    required: [username, role, status, permissions]
    description: |
      GET /api/me 的冻结投影：用户名/邮箱/角色/状态/头像/显示名/生效权限。
      email/avatar_url/display_name 未设置时字段缺席（响应中为 null 或省略由
      Go omitempty 决定，客户端按可空处理）。permissions 是调用者的生效权限键：
      管理员 SQL NULL 或 ["*"] 归一为 ["*"]，role=user 恒为空数组（绝不泄露
      无权限的 admin_permissions 原始列）。该字段按 M6 R-17 扩展，用于前端
      能力闸门（服务端仍是最终权威）。
    properties:
      username:
        type: string
      email:
        type: string
        format: email
        nullable: true
      role:
        $ref: './public.yaml#/schemas/UserRole'
      status:
        $ref: './public.yaml#/schemas/UserStatus'
      avatar_url:
        type: string
        format: uri
        nullable: true
      display_name:
        type: string
        maxLength: 32
        nullable: true
      permissions:
        type: array
        description: |
          生效权限键。FULL/NULL 管理员为 ["*"]；role=user 或显式空集合为 []。
        items:
          type: string

  PatchMeRequest:
    type: object
    additionalProperties: false
    # display_name 必须出现（可为 null）：handler 对缺失字段返回 400，契约不能
    # 把它写成"可选"——否则前端会以为空请求体等价于"不改"。
    required: [display_name]
    description: |
      仅 display_name 可写。提交任何未知字段（含 role/email/password）返回
      403 field_not_writable，绝不静默丢弃（BOPLA，security-02 §2.6.1）。
    properties:
      display_name:
        # 3.1 标准写法是 type [string, "null"]，但 kin-openapi v0.131.0（仓内
        # validate 门禁）不接受 "null" 类型；nullable 是仓内既有可空写法。
        # 注意 null 与空串在本接口语义相同（都清除显示名），故 DTO 的 string
        # 表示不会丢失行为差异。
        type: string
        maxLength: 32
        nullable: true
        description: null 或空白字符串清除显示名。

  SelfSettings:
    type: object
    additionalProperties: false
    required: [language, sidebar_modules, record_ip_log, default_model, updated_at]
    description: |
      GET /api/self 与 PUT /api/self/setting 的响应。updated_at 是下一次写入
      必须携带的乐观锁令牌——同一行的资料变更也会推进它。
    properties:
      language:
        $ref: './public.yaml#/schemas/Language'
      sidebar_modules:
        type: object
        additionalProperties: true
        nullable: true
        description: 侧栏模块的稀疏覆盖；null 表示无覆盖（使用站点默认）。
      record_ip_log:
        type: boolean
        description: 是否记录登录/操作 IP。
      default_model:
        type: string
        nullable: true
        maxLength: 128
        description: |
          用户默认模型（modules-02 F-02-18）。null = 未设置（Playground 回落到
          首个可用模型）。写入值必须属于用户可用分组的模型清单（见
          GET /api/status 的 usable_groups），否则 422 user.default_model_invalid。
      updated_at:
        type: string
        format: date-time

  UpdateSelfSettingsRequest:
    type: object
    additionalProperties: false
    required: [updated_at]
    description: |
      PUT /api/self/setting 的部分更新：未出现的键保持原值。updated_at 必须
      等于 GET /api/self 返回的值，否则 409（乐观锁）。语言不在 canonical
      7 语内返回 400。
    properties:
      language:
        $ref: './public.yaml#/schemas/Language'
      sidebar_modules:
        type: object
        additionalProperties: true
        nullable: true
      record_ip_log:
        type: boolean
      default_model:
        type: string
        maxLength: 128
        description: |
          设置默认模型。空串表示清除（落库 NULL）；非空值必须属于该用户可用
          分组的模型清单，否则 422 user.default_model_invalid。
      updated_at:
        type: string
        format: date-time

  SessionList:
    type: object
    additionalProperties: false
    required: [sessions]
    description: |
      不是 Page 信封：列表固定 ≤50 条、无翻页语义（按 last_seen 倒序）。
      过期会话不列出；current=true 的条目是当前请求所用会话。
    properties:
      sessions:
        type: array
        maxItems: 50
        items:
          $ref: '#/schemas/SessionView'

  SessionView:
    type: object
    additionalProperties: false
    required: [id, user_agent, ip, created_at, last_seen_at, current]
    properties:
      id:
        type: string
        description: 会话 id（不透明）；DELETE /api/sessions/{sid} 的原值。
      user_agent:
        type: string
      ip:
        type: string
        description: 建立会话时的客户端 IP。
      created_at:
        type: string
        format: date-time
      last_seen_at:
        type: string
        format: date-time
      current:
        type: boolean

  VerifyEmailRequest:
    type: object
    additionalProperties: false
    required: [email_code]
    properties:
      email_code:
        type: string
        pattern: '^[0-9]{6}$'
        description: 由 POST /api/auth/email-code（purpose=verify）下发的一次性验证码。

  VerifyEmailResponse:
    type: object
    additionalProperties: false
    required: [email_verified]
    properties:
      email_verified:
        type: boolean
        enum: [true]
      email_verified_at:
        type: string
        format: date-time
        description: 首次验证时间；重复验证保留首次时间。

  ChangePasswordRequest:
    type: object
    additionalProperties: false
    required: [current_password, new_password]
    properties:
      current_password:
        type: string
      new_password:
        type: string
        minLength: 8
        maxLength: 128
    description: |
      成功 204：更新哈希、吊销除当前外全部会话并轮换当前会话 CSRF 令牌。
      限流 5 次/10 分钟/IP+用户；失败返回 400/409/429/503。

  DeleteAccountRequest:
    type: object
    additionalProperties: false
    required: [confirm_username, password]
    properties:
      confirm_username:
        type: string
        description: 必须与当前用户名逐字一致。
      password:
        type: string
        description: 当前口令；即使再认证窗口仍有效也必须现场提供。
      totp_code:
        type: string
        description: 已启用 2FA 时必填。
    description: |
      DELETE /api/account 是硬删除 + PII 匿名化（R-04 无宽限），成功 204。
      再认证失败 403 reauth_required；账号行已不存在时 404（重复删除不产生
      额外副作用，但不是 204 成功态）。

  ChangeEmailRequest:
    type: object
    additionalProperties: false
    required: [new_email, code, current_password]
    properties:
      new_email:
        type: string
        format: email
      code:
        type: string
        pattern: '^[0-9]{6}$'
        description: 发往 new_email、purpose=bind 的一次性验证码。
      current_password:
        type: string
      totp_code:
        type: string
    description: |
      全量再认证门：未过再认证返回 403 reauth_required，且不消费验证码、
      不写库。新邮箱被占用 409；域名白名单外 422。

  ChangeEmailResponse:
    type: object
    additionalProperties: false
    required: [email, email_verified, email_verified_at]
    properties:
      email:
        type: string
        format: email
      email_verified:
        type: boolean
        enum: [true]
      email_verified_at:
        type: string
        format: date-time

  # ---------------------------------------------------------------------------
  # 通知偏好（modules-01 F-01-21..24）
  # ---------------------------------------------------------------------------

  NotificationChannel:
    type: string
    enum: [email, webhook, bark, gotify]

  NotificationPreferences:
    type: object
    additionalProperties: false
    description: |
      稀疏偏好对象：只持久化用户显式设置过的键；GET 对 NULL 归一为 {}。
      站点级默认值由客户端合并。security_alert.enabled 不允许为 false
      （安全通知不可关闭，400）。
    properties:
      balance_warning:
        type: object
        additionalProperties: false
        properties:
          enabled:
            type: boolean
          threshold:
            type: integer
            minimum: 0
            description: 余额告警阈值（credits，非负整数）。
          channels:
            type: array
            minItems: 1
            items:
              $ref: '#/schemas/NotificationChannel'
          custom_email:
            type: string
            nullable: true
            description: 自定义收件邮箱；null 或空串清除（空串是服务端兼容的清除写法）。
      usage_digest:
        type: object
        additionalProperties: false
        properties:
          enabled:
            type: boolean
          channels:
            type: array
            minItems: 1
            items:
              $ref: '#/schemas/NotificationChannel'
      security_alert:
        type: object
        additionalProperties: false
        properties:
          enabled:
            type: boolean
            enum: [true]
      webhook_url:
        type: string
        format: uri
        nullable: true
        description: 清除时传 null 或空串（稀疏合并下唯一的删除方式）。
      bark_url:
        type: string
        format: uri
        nullable: true
      gotify_url:
        type: string
        format: uri
        nullable: true
      gotify_token:
        type: string
        nullable: true
        description: 清除时传 null 或空串。
      gotify_priority:
        type: integer
        nullable: true
        description: 清除时传 null。

  NotificationTestRequest:
    type: object
    additionalProperties: false
    required: [channel]
    properties:
      channel:
        $ref: '#/schemas/NotificationChannel'
      target:
        type: string
        description: 测试目标地址；与 target_address 同义，target 优先。
      target_address:
        type: string
        description: 兼容字段；两者都缺时按渠道默认目标。
    description: |
      M1 未配置真实通知通道时返回 503；偏好读写端点不受影响。
      发送成功 200 {channel,sent:true}。

  NotificationTestResponse:
    type: object
    additionalProperties: false
    required: [channel, sent]
    properties:
      channel:
        $ref: '#/schemas/NotificationChannel'
      sent:
        type: boolean
        enum: [true]

  # ---------------------------------------------------------------------------
  # 2FA（modules-01 F-01-08..12）
  # ---------------------------------------------------------------------------

  TwoFASetupResponse:
    type: object
    additionalProperties: false
    required: [secret, otpauth_url]
    properties:
      secret:
        type: string
        description: base32 TOTP 种子，仅本次响应出现；已启用时再调用返回 409。
      otpauth_url:
        type: string
        format: uri
        description: otpauth:// URI，供前端渲染二维码。

  TwoFAEnableRequest:
    type: object
    additionalProperties: false
    required: [secret, code]
    properties:
      secret:
        type: string
        description: 上一步 setup 返回的 secret（服务端校验 32 位 base32 / 20 字节）。
      code:
        type: string
        pattern: '^[0-9]{6}$'

  TwoFABackupCodesResponse:
    type: object
    additionalProperties: false
    required: [totp_enabled, backup_codes]
    properties:
      totp_enabled:
        type: boolean
        enum: [true]
      backup_codes:
        type: array
        minItems: 8
        maxItems: 8
        items:
          type: string
          pattern: '^[A-Z0-9]{4}-[A-Z0-9]{4}$'
        description: 明文备用码，仅本次响应出现；重生成后旧码立即失效。

  TwoFAPasswordRequest:
    type: object
    additionalProperties: false
    required: [password]
    properties:
      password:
        type: string
        description: 当前口令确认；与登录共用失败锁定桶。

  TwoFADisableResponse:
    type: object
    additionalProperties: false
    required: [totp_enabled]
    properties:
      totp_enabled:
        type: boolean
        enum: [false]

  # ---------------------------------------------------------------------------
  # API 令牌（modules-02）
  # ---------------------------------------------------------------------------

  Token:
    type: object
    additionalProperties: false
    required:
      - id
      - name
      - status
      - key_masked
      - unlimited_quota
      - group
      - cross_group_retry
      - created_at
      - updated_at
    description: |
      管理面令牌响应。永不包含 key 明文或 key_hash；完整 key 只在创建
      （POST /api/tokens）与重置（POST /api/tokens/{id}:reset-key）响应中出现一次。
    properties:
      id:
        type: integer
        format: int64
      name:
        type: string
        maxLength: 64
      status:
        $ref: '#/schemas/TokenStatus'
      key_masked:
        type: string
        description: 形如 nkt-••••••••••••••••••••••••，用于列表展示。
      remain_quota:
        type: integer
        format: int64
        nullable: true
        description: null 表示不限额度（等价 unlimited_quota=true）。
      unlimited_quota:
        type: boolean
      quota_percent:
        type: integer
        nullable: true
        description: M1 由 remain_quota 派生（0 或 100）；后续接入用量日志后细化。
      group:
        type: string
        description: 令牌绑定分组；auto 表示按 auto_groups 顺序自动选择。
      model_limits:
        type: array
        items:
          type: string
        nullable: true
        description: null/空表示不限制模型。
      allow_ips:
        type: array
        items:
          type: string
        nullable: true
        description: null/空表示不限制来源 IP。
      auto_groups:
        type: array
        items:
          type: string
        description: 有序自动分组候选；仅 group=auto 时非空，最多 20 项（可配置）。
      cross_group_retry:
        type: boolean
      created_at:
        type: string
        format: date-time
      updated_at:
        type: string
        format: date-time
        description: 乐观锁版本；PATCH 必须原样回传，否则 409。
      last_used_at:
        type: string
        format: date-time
        nullable: true
      expires_at:
        type: string
        format: date-time
        nullable: true
        description: null 表示永不过期。

  TokenStatus:
    type: string
    enum: [enabled, disabled, expired, exhausted]
    description: |
      读时派生，优先级 disabled > expired > exhausted > enabled。
      disabled 是唯一可写的人工位；其余为时间/额度派生态。

  CreatedToken:
    allOf:
      - $ref: '#/schemas/Token'
      - type: object
        required: [key]
        properties:
          key:
            type: string
            description: 完整明文 key（nkt- 前缀），仅此响应出现一次；服务端只存 SHA-256 哈希。
    description: 创建响应中的条目 = Token + 一次性明文 key。

  CreateTokenRequest:
    type: object
    additionalProperties: false
    required: [name]
    properties:
      name:
        type: string
        minLength: 1
        maxLength: 64
      group:
        type: string
        description: 缺省使用用户当前分组；auto 时 auto_groups 必须非空（I-20）。
      expires_at:
        oneOf:
          - type: integer
            format: int64
            description: epoch 秒（modules-02 线格式）。
          - type: string
            format: date-time
        nullable: true
        description: null 表示永不过期。
      quantity:
        type: integer
        minimum: 1
        maximum: 100
        description: 一次创建的令牌数量（缺省 1）；上限 100（与批量操作同额）。
      unlimited_quota:
        type: boolean
        description: 缺省 true（不限额度）。
      remain_quota:
        type: integer
        format: int64
        minimum: 0
        maximum: 1000000000000000
        description: |
          可选。缺省时取 DB 默认档 100000（modules-02:369，创建 handler 的
          remain := 100000 与之一致）；0 表示立即耗尽；unlimited_quota=true
          时忽略本字段。
      model_limits:
        type: array
        items:
          type: string
      allow_ips:
        type: array
        items:
          type: string
      auto_groups:
        type: array
        maxItems: 20
        items:
          type: string
        description: group=auto 时必填且非空；21 项拒绝（TC-F-02-13-08）。
      cross_group_retry:
        type: boolean
        description: 缺省 false。
    description: |
      POST /api/tokens 应携带 Idempotency-Key：同键重放返回首次结果，
      不同请求体复用同键返回 422。创建成功返回 200 + {created:[...]}。

  CreateTokenResponse:
    type: object
    additionalProperties: false
    required: [created]
    properties:
      created:
        type: array
        minItems: 1
        maxItems: 100
        items:
          $ref: '#/schemas/CreatedToken'

  UpdateTokenRequest:
    type: object
    additionalProperties: false
    required: [updated_at]
    description: |
      部分更新：未出现的字段不变。updated_at 必须等于当前行的版本，
      否则 409（乐观锁）。expires_at 显式 null 表示改为永不过期。
    properties:
      name:
        type: string
        minLength: 1
        maxLength: 64
      group:
        type: string
      expires_at:
        oneOf:
          - type: integer
            format: int64
          - type: string
            format: date-time
        nullable: true
      unlimited_quota:
        type: boolean
      remain_quota:
        type: integer
        format: int64
        minimum: 0
        maximum: 1000000000000000
      model_limits:
        type: array
        items:
          type: string
      allow_ips:
        type: array
        items:
          type: string
      auto_groups:
        type: array
        maxItems: 20
        items:
          type: string
      cross_group_retry:
        type: boolean
      updated_at:
        type: string
        format: date-time

  TokenList:
    allOf:
      - $ref: '../components/pagination.yaml#/schemas/Page'
      - type: object
        properties:
          items:
            type: array
            items:
              $ref: '#/schemas/Token'
    description: GET /api/tokens 的 offset 分页信封；items 为 Token 投影。

  BatchTokenRequest:
    type: object
    additionalProperties: false
    required: [ids]
    properties:
      ids:
        type: array
        minItems: 1
        maxItems: 100
        uniqueItems: true
        items:
          type: integer
          format: int64

  TokenBatchFailure:
    type: object
    additionalProperties: false
    required: [id, name, detail]
    properties:
      id:
        type: integer
        format: int64
      name:
        type: string
        description: 仅当令牌属于当前用户且仍存在时填写；他人/不存在留空（不泄露存在性）。
      detail:
        type: string

  TokenBatchResponse:
    type: object
    additionalProperties: false
    required: [succeeded, failed]
    description: |
      逐条结果：succeeded 为成功条数，failed 为明细。批量端点上限 100，
      部分失败仍返回 200（不是整体回滚）。
    properties:
      succeeded:
        type: integer
        minimum: 0
      failed:
        type: array
        items:
          $ref: '#/schemas/TokenBatchFailure'

  ResetTokenKeyResponse:
    type: object
    additionalProperties: false
    required: [key, key_masked]
    description: |
      新 key 只在本响应出现一次；旧 key 立即失效。响应带
      Cache-Control: no-store。
    properties:
      key:
        type: string
      key_masked:
        type: string

  TokenAutoGroupsResponse:
    type: object
    additionalProperties: false
    required: [groups, max_count]
    properties:
      groups:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [name]
          properties:
            name:
              type: string
            ratio:
              type: number
              description: 分组倍率（DB 150 → 1.5）；缺省字段表示无显式倍率。
      max_count:
        type: integer
        minimum: 1
        description: 单令牌 auto_groups 条目上限（站点配置，默认 20）。

  TokenUsage:
    type: object
    additionalProperties: false
    required:
      - object
      - name
      - total_used
      - unlimited_quota
      - model_limits_enabled
    description: |
      GET /api/usage/token 的 Bearer 自读投影。额度耗尽（remain_quota=0 且
      unlimited_quota=false）时仍返回 200 且 total_available=0——前端要能显示
      耗尽状态而不是被 401 吞掉（modules-02 §2.13）。与耗尽相反，过期令牌在
      鉴权层就被拒绝：401 + problem type `token_expired`（禁用令牌
      `token_disabled`，非法 key `invalid_token`）。
    properties:
      object:
        type: string
        enum: [token_usage]
      name:
        type: string
      total_granted:
        type: integer
        format: int64
        nullable: true
        description: M3 接入 usage_logs 前无法可靠计算，固定 null（不伪造"授予=剩余"）。
      total_used:
        type: integer
        format: int64
        description: |
          M1 尚未计量（usage_logs 未接入，令牌行也没有 used 列），恒为 0；
          与 total_granted 的 null 同属 M3 前的占位口径，不得据此刻画真实用量。
      total_available:
        type: integer
        format: int64
        nullable: true
        description: 剩余额度；不限额度时为 null。
      unlimited_quota:
        type: boolean
      model_limits:
        type: array
        items:
          type: string
        nullable: true
      model_limits_enabled:
        type: boolean
      expires_at:
        type: string
        format: date-time
        nullable: true

  RedeemCodeRequest:
    type: object
    additionalProperties: false
    required: [code]
    properties:
      code:
        type: string
        minLength: 1
        maxLength: 64
        description: 用户输入原样提交；服务端归一化后再哈希

  RedeemCodeResponse:
    type: object
    additionalProperties: false
    required: [credits, balance_after]
    properties:
      credits:
        type: integer
        format: int64
        minimum: 1
        description: 本次到账积分（已含 quota_per_unit 与分组倍率）
      balance_after:
        type: integer
        format: int64
        description: 入账后的钱包余额快照

  # ---------------------------------------------------------------------------
  # 充值（M5 Task 3 / modules-04 §4.A–C；P-9/P-17）
  # ---------------------------------------------------------------------------

  TopupProviderConfig:
    type: object
    additionalProperties: false
    required: [min_topup]
    description: 公开的渠道配置；secret 永不出现。
    properties:
      publishable_key:
        type: string
        description: Stripe 公开密钥（P-17 冻结键名 `pay.stripe.publishable_key`）
      min_topup:
        type: integer
        format: int64
        minimum: 0
        description: |
          该渠道自己的最低充值（分，`pay.<provider>.min_topup_cny`）；
          有效下限 = max(全局 `min_topup`, 渠道 `min_topup`)（F-04-01）

  TopupConfig:
    type: object
    additionalProperties: false
    required: [amount_options, min_topup, max_topup, quota_per_unit, credits_ratio, enabled_providers, providers]
    properties:
      amount_options:
        type: array
        minItems: 1
        maxItems: 20
        items:
          type: integer
          format: int64
          minimum: 1
        description: 档位，最小货币单位（分）；来源 `pay.amount_presets_cny`
      min_topup:
        type: integer
        format: int64
        minimum: 0
        description: 全局最低充值（分），来源 `pay.min_topup_cny`
      max_topup:
        type: integer
        format: int64
        minimum: 1
        description: 单笔硬上限（分），冻结 10000000
      quota_per_unit:
        type: integer
        format: int64
        minimum: 1
        description: 1 元 = N 积分（`billing.quota_per_unit`，默认 100）
      credits_ratio:
        type: number
        format: double
        exclusiveMinimum: 0
        description: |
          当前用户分组的有效兑换倍率（`pay.topup_group_ratio[users.group]`，
          未配置回退 1.0）。仅用于前端预览；实际到账以服务端入账为准。
      enabled_providers:
        type: array
        items:
          type: string
          enum: [stripe, alipay, epay]
        description: 已启用且配置完整的渠道（P-13）
      providers:
        type: object
        additionalProperties:
          $ref: '#/schemas/TopupProviderConfig'
        description: 只包含 enabled_providers 中的渠道

  # 钱包摘要（modules-03 §F-03-01；Task 6 余额卡消费 balance）。
  WalletSummary:
    type: object
    additionalProperties: false
    required: [balance, held_credits, total_consumed, total_requests, threshold, health, group]
    properties:
      balance:
        type: integer
        format: int64
        minimum: 0
        description: 可用余额（积分），`users.balance` 原子读
      held_credits:
        type: integer
        format: int64
        minimum: 0
        description: 冻结中积分（`wallet_transactions` 中 status='hold' 的 |amount| 之和）
      total_consumed:
        type: integer
        format: int64
        minimum: 0
        description: 历史累计消费（`type='consume'` 流水绝对值之和）
      total_requests:
        type: integer
        format: int64
        minimum: 0
        description: API 请求总数（`usage_logs` count）
      threshold:
        type: integer
        format: int64
        minimum: 0
        description: 低余额提醒阈值，来源 `billing.balance_alert_threshold_credits`（默认 1000）
      health:
        type: string
        enum: [healthy, low, depleted]
        description: 服务端计算的余额健康度
      group:
        type: string
        description: 当前定价分组（`users.group`）

  CreateOrderRequest:
    type: object
    additionalProperties: false
    required: [amount, provider]
    properties:
      amount:
        type: integer
        format: int64
        minimum: 1
        maximum: 10000000
        description: 最小货币单位（分）；下限由全局/渠道最低值取 max 后校验
      currency:
        type: string
        enum: [CNY]
        default: CNY
        description: |
          站点计价币种。M5 **无汇率**，只接受 CNY（大小写不敏感，服务端
          统一大写）；USD/JPY/TRY 等一律 400，避免「分」口径被非人民币
          金额放大到账积分。
      provider:
        type: string
        enum: [stripe, alipay, epay]
        description: |
          支付渠道。`epay`（微信易支付）不调用渠道 API，服务端返回
          `pay_url` + `form_fields` 供前端以表单 POST 打开收银台。

  TopupOrderView:
    type: object
    additionalProperties: false
    required: [id, provider, amount, currency, status, credited_credits, created_at]
    properties:
      id:
        type: integer
        format: int64
      provider:
        type: string
        enum: [stripe, alipay, epay, wallet]
        description: |
          响应侧取值域。`wallet` 只出现在余额购买的订阅订单上
          （P2b：下单即在同一事务内扣款并履约，没有渠道回调与支付凭据）；
          充值请求（CreateOrderRequest）与续费请求接受 stripe/alipay/epay。
      amount:
        type: integer
        format: int64
        description: 订单金额（分），服务端定价的唯一真源
      currency:
        type: string
        minLength: 3
        maxLength: 3
      status:
        type: string
        enum: [pending, succeeded, failed, expired, cancelled]
      credited_credits:
        type: integer
        format: int64
        description: 成功时到账积分快照；pending/failed 为 0
      failure_code:
        type: string
        nullable: true
        enum: [provider_unavailable, provider_rejected, signature_invalid, amount_mismatch,
               currency_mismatch, order_not_found, order_state_conflict, manual_required, null]
      paid_at:
        type: string
        format: date-time
        nullable: true
      created_at:
        type: string
        format: date-time

  CreateOrderResponse:
    type: object
    additionalProperties: false
    required: [order]
    properties:
      order:
        $ref: '#/schemas/TopupOrderView'
      client_secret:
        type: string
        description: 仅 stripe 首次创建返回（等同支付凭据，不落库、不回放）
      qr_code:
        type: string
        description: 仅 alipay 首次创建返回
      pay_url:
        type: string
        description: 仅 epay 首次创建返回；表单 POST 的目标收银台地址
      form_fields:
        type: object
        additionalProperties:
          type: string
        description: |
          仅 epay 首次创建返回；submit.php 表单字段（含 `sign`，小写 MD5）。
          客户端以 application/x-www-form-urlencoded POST 到 `pay_url`。

  # ---------------------------------------------------------------------------
  # 订单中心（M5 Task 4 / modules-04 §4.D–E；P-1/P-9/P-18/P-19）
  # ---------------------------------------------------------------------------

  OrderView:
    type: object
    additionalProperties: false
    required: [id, user_id, provider, amount, currency, status, credited_credits,
               manual_completed, created_at, updated_at, expires_at]
    properties:
      id:
        type: integer
        format: int64
      user_id:
        type: integer
        format: int64
      provider:
        type: string
        enum: [stripe, alipay, epay, wallet]
        description: |
          响应侧取值域。`wallet` 仅用于订阅余额购买订单；订单列表/详情的
          消费方不能假设非 stripe 即 alipay（epay 也已存在）。请求侧枚举
          （充值/续费）为 stripe/alipay/epay。
      amount:
        type: integer
        format: int64
        description: 订单金额（分），服务端定价唯一真源
      currency:
        type: string
        minLength: 3
        maxLength: 3
      status:
        type: string
        enum: [pending, succeeded, failed, expired, cancelled]
        description: |
          五态状态机（P-1）：只有 pending 可以迁移到 succeeded/failed/
          expired/cancelled；终态不可再迁移。
      credited_credits:
        type: integer
        format: int64
      failure_code:
        type: string
        nullable: true
        enum: [provider_unavailable, provider_rejected, signature_invalid, amount_mismatch,
               currency_mismatch, order_not_found, order_state_conflict, manual_required, null]
      paid_at:
        type: string
        format: date-time
        nullable: true
      manual_completed:
        type: boolean
      manual_reason:
        type: string
        nullable: true
        minLength: 10
        maxLength: 200
      created_at:
        type: string
        format: date-time
      updated_at:
        type: string
        format: date-time
      expires_at:
        type: string
        format: date-time
        description: 派生值 `created_at + 30min`（P-1；不是数据库列）
      raw_callback:
        type: object
        nullable: true
        description: 仅管理员（role=admin）详情可见；用户响应不包含该字段

  OrderList:
    type: object
    additionalProperties: false
    required: [items, total, page, page_size]
    properties:
      items:
        type: array
        items:
          $ref: '#/schemas/OrderView'
      total:
        type: integer
        format: int64
      page:
        type: integer
        minimum: 1
      page_size:
        type: integer
        minimum: 1
        maximum: 100

  OrderVerifyResponse:
    type: object
    additionalProperties: false
    required: [paid, order]
    properties:
      paid:
        type: boolean
        description: 渠道是否已确认收款；false 时订单状态不变
      order:
        $ref: '#/schemas/OrderView'

  CompleteOrderRequest:
    type: object
    additionalProperties: false
    required: [manual_reason]
    properties:
      manual_reason:
        type: string
        minLength: 10
        maxLength: 200
        description: 人工完成原因（按 Unicode 字符计数）

  # --- M6 用量日志 / 统计 / 审计只读契约 ---------------------------------

  UsageLogItem:
    type: object
    additionalProperties: false
    required:
      - id
      - request_id
      - model
      - prompt_tokens
      - completion_tokens
      - cache_read_tokens
      - cache_write_tokens
      - cost
      - refunded
      - stream
      - status
      - created_at
    properties:
      id: { type: integer, format: int64 }
      request_id: { type: string, format: uuid }
      token_id: { type: integer, format: int64, nullable: true }
      token_name: { type: string, nullable: true }
      channel_id: { type: integer, format: int64, nullable: true }
      upstream: { type: string, nullable: true }
      model: { type: string }
      group: { type: string, nullable: true }
      prompt_tokens: { type: integer }
      completion_tokens: { type: integer }
      cache_read_tokens: { type: integer }
      cache_write_tokens: { type: integer }
      pre_deducted: { type: integer, format: int64, nullable: true }
      cost: { type: integer, format: int64 }
      refunded: { type: integer, format: int64 }
      latency_ms: { type: integer, nullable: true }
      ttft:
        type: integer
        nullable: true
        description: 首 token 耗时（TTFT）；非流式为 null。内部列名 first_token_ms，对外字段名冻结为 ttft（G7-R51）。
      stream: { type: boolean }
      status:
        type: string
        enum: [success, error, refunded, refused]
      error_class: { type: string, nullable: true }
      error_message: { type: string, nullable: true }
      retry_chain:
        type: array
        nullable: true
        description: user 视图仅 8 个可见键；admin 视图保留完整选路细节
        items:
          type: object
          additionalProperties: true
      created_at: { type: string, format: date-time }
      username:
        type: string
        description: 仅 admin+logs:read 视图返回
    description: 用量日志列表项（user 视图不含 username）。

  UsageLogDetail:
    allOf:
      - $ref: '#/schemas/UsageLogItem'
      - type: object
        required: [other]
        properties:
          other:
            type: object
            additionalProperties: true
            description: 按角色投影后的 other（user 仅 public 键；admin 含 admin_info/root_info）

  UsageLogPage:
    allOf:
      - $ref: '../components/pagination.yaml#/schemas/Page'
      - type: object
        properties:
          items:
            type: array
            items:
              $ref: '#/schemas/UsageLogItem'

  LogsByKeyItem:
    # 刻意独立定义完整字段，而不是 allOf 引用 additionalProperties:false 的
    # UsageLogItem 再追加 other：后者在 JSON Schema 里是自相矛盾的（追加属性
    # 会被父 schema 拒绝），且无法表达「永不含 username」。
    type: object
    additionalProperties: false
    required:
      - id
      - request_id
      - model
      - prompt_tokens
      - completion_tokens
      - cache_read_tokens
      - cache_write_tokens
      - cost
      - refunded
      - stream
      - status
      - created_at
      - other
    properties:
      id: { type: integer, format: int64 }
      request_id: { type: string, format: uuid }
      token_id: { type: integer, format: int64, nullable: true }
      token_name: { type: string, nullable: true }
      channel_id: { type: integer, format: int64, nullable: true }
      upstream: { type: string, nullable: true }
      model: { type: string }
      group: { type: string, nullable: true }
      prompt_tokens: { type: integer }
      completion_tokens: { type: integer }
      cache_read_tokens: { type: integer }
      cache_write_tokens: { type: integer }
      pre_deducted: { type: integer, format: int64, nullable: true }
      cost: { type: integer, format: int64 }
      refunded: { type: integer, format: int64 }
      latency_ms: { type: integer, nullable: true }
      ttft:
        type: integer
        nullable: true
        description: 首 token 耗时（TTFT）；非流式为 null。内部列名 first_token_ms，对外字段名冻结为 ttft（G7-R51）。
      stream: { type: boolean }
      status:
        type: string
        enum: [success, error, refunded, refused]
      error_class: { type: string, nullable: true }
      error_message: { type: string, nullable: true }
      retry_chain:
        type: array
        nullable: true
        description: user 视图仅 8 个可见键；admin 视图保留完整选路细节
        items:
          type: object
          additionalProperties: true
      created_at: { type: string, format: date-time }
      other:
        type: object
        additionalProperties: true
        description: |
          按 user 视图投影后的 other（admin_info/root_info/audit_info 与渠道/
          拒绝原因键一律剥离；error_message 打码为 ••••••）。
    description: |
      GET /api/logs/by-key 的行投影：字段与 UsageLogItem 相同（全部显式列出），
      但**永不含 username**（该字段仅 admin+logs:read 的列表/详情出现），也不
      存在 key/key_masked/明文令牌字段。error_message 恒为 ••••••，retry_chain
      恒为 user 视图。

  LogsByKeyPage:
    type: object
    additionalProperties: false
    required: [items]
    properties:
      items:
        type: array
        maxItems: 1000
        items:
          $ref: '#/schemas/LogsByKeyItem'
    description: 无分页/总数/筛选的信封；固定最近 1000 条，按 created_at DESC, id DESC。

  UsageStatsSummary:
    type: object
    additionalProperties: false
    required:
      - cost_total
      - request_count
      - success_rate
      - prompt_tokens_total
      - completion_tokens_total
      - pre_deducted_total
      - refunded_total
    properties:
      cost_total: { type: integer, format: int64 }
      request_count: { type: integer, format: int64 }
      success_rate:
        type: number
        minimum: 0
        maximum: 1
        description: success / total；0 行时为 0（绝不 NaN）
      prompt_tokens_total: { type: integer, format: int64 }
      completion_tokens_total: { type: integer, format: int64 }
      pre_deducted_total: { type: integer, format: int64 }
      refunded_total: { type: integer, format: int64 }

  UsageStatsByModelItem:
    type: object
    additionalProperties: false
    required: [model, cost, tokens, percent]
    properties:
      model: { type: string, description: 第 9 名起聚合为 other }
      cost: { type: integer, format: int64 }
      tokens: { type: integer, format: int64 }
      percent:
        type: number
        description: 十进制基点分配，各扇区合计恰为 100

  UsageStatsTimeseriesItem:
    type: object
    additionalProperties: false
    required: [bucket, cost, requests]
    properties:
      bucket:
        type: string
        description: UTC ISO 时间桶（YYYY-MM-DDTHH:MM:SSZ）
      cost: { type: integer, format: int64 }
      requests: { type: integer, format: int64 }

  UsageStatsRates:
    type: object
    additionalProperties: false
    required: [rpm_avg, rpm_peak, tpm_avg, cost_total, pre_deducted_total, refunded_total]
    properties:
      rpm_avg: { type: number, description: 请求数 / 窗口分钟数 }
      rpm_peak: { type: integer, format: int64, description: 任一分钟最大请求数 }
      tpm_avg: { type: number, description: (输入+输出) tokens / 窗口分钟数 }
      cost_total: { type: integer, format: int64 }
      pre_deducted_total: { type: integer, format: int64 }
      refunded_total: { type: integer, format: int64 }

  AuditLogItem:
    type: object
    additionalProperties: false
    required: [id, user_id, category, result, created_at]
    properties:
      id: { type: integer, format: int64 }
      user_id: { type: integer, format: int64 }
      username:
        type: string
        description: 仅 admin+logs:read 视图返回（user 视图隐藏）
      category:
        type: string
        enum: [login, security, operation, access_token]
      ip: { type: string, nullable: true }
      user_agent: { type: string, nullable: true }
      method: { type: string, nullable: true }
      route: { type: string, nullable: true }
      status_code: { type: integer, nullable: true }
      result:
        type: string
        enum: [success, failed]
      detail: { nullable: true, description: 事件描述（已脱敏） }
      before: { nullable: true, description: 变更前快照（已脱敏） }
      after: { nullable: true, description: 变更后快照（已脱敏） }
      created_at: { type: string, format: date-time }

  AuditLogPage:
    allOf:
      - $ref: '../components/pagination.yaml#/schemas/Page'
      - type: object
        properties:
          items:
            type: array
            items:
              $ref: '#/schemas/AuditLogItem'

  # ---------------------------------------------------------------------------
  # 任务台账（M6d Task 6a）。private_data / data 永不出现在台账投影中。
  # ---------------------------------------------------------------------------
  TaskArtifact:
    type: object
    additionalProperties: false
    required: [key, type]
    properties:
      key:
        type: string
        description: 任务内稳定标识（content 端点定位用，本任务不签发 URL）
      type:
        type: string
        description: video | audio | image | file
      mime_type:
        type: string

  TaskListItem:
    type: object
    additionalProperties: false
    required: [task_id, family, action, plugin_key, state, raw_state, progress_percent]
    properties:
      id: {type: integer, format: int64}
      task_id:
        type: string
        description: 对外任务 ID（task_<32 hex>）
      upstream_task_id: {type: string}
      family: {type: string, enum: [plugin]}
      action: {type: string}
      plugin_key: {type: string, maxLength: 30}
      plugin_generation: {type: integer, format: int64}
      fetch_mode: {type: string, enum: [poll, callback, inline]}
      locked_channel_id: {type: integer, format: int64}
      origin_task_ids:
        type: array
        items: {type: string}
      state:
        type: string
        enum: [not_start, submitted, queued, in_progress, success, failure, unknown]
      raw_state: {type: string}
      progress_percent: {type: integer, minimum: 0, maximum: 100}
      retention_deadline: {type: string, format: date-time, nullable: true}
      user_id:
        type: integer
        format: int64
        description: 仅管理员台账返回；self 台账省略
      group: {type: string}
      channel_id: {type: integer, format: int64}
      quota: {type: integer, format: int64}
      fail_reason: {type: string}
      submit_time: {type: string, format: date-time, nullable: true}
      start_time: {type: string, format: date-time, nullable: true}
      finish_time: {type: string, format: date-time, nullable: true}
      properties: {type: object, additionalProperties: true}
      created_at: {type: string, format: date-time}
      updated_at: {type: string, format: date-time}

  TaskListResponse:
    type: object
    additionalProperties: false
    required: [items, total, page, page_size]
    properties:
      items:
        type: array
        items: {$ref: '#/schemas/TaskListItem'}
      total: {type: integer}
      page: {type: integer}
      page_size: {type: integer}

  # ---------------------------------------------------------------------------
  # 订阅套餐用户面（D5b；billing-08 §15.2/§15.4）
  # ---------------------------------------------------------------------------

  AvailableSubscriptionPlan:
    type: object
    additionalProperties: false
    required:
      - id
      - plan_key
      - title
      - period_days
      - price_amount
      - currency
      - grant_credits
      - reset_on_renew
      - grace_days
      - sort_order
    description: |
      用户侧套餐卡片投影。刻意不含 allow_wallet_overflow（内部回退开关）与
      审计时间戳；model_scope 为 null 表示全部模型。
    properties:
      id: {type: integer, format: int64}
      plan_key: {type: string}
      title: {type: string}
      description: {type: string, nullable: true}
      period_days: {type: integer, minimum: 1}
      price_amount: {type: integer, format: int64, minimum: 0}
      currency: {type: string, enum: [CNY]}
      grant_credits: {type: integer, format: int64, minimum: 0}
      reset_on_renew: {type: boolean}
      model_scope:
        type: array
        nullable: true
        items: {type: string}
      concurrency_limit: {type: integer, minimum: 1, nullable: true}
      grace_days: {type: integer, minimum: 0}
      sort_order: {type: integer}

  AvailableSubscriptionPlanList:
    type: object
    additionalProperties: false
    required: [items]
    properties:
      items:
        type: array
        items: {$ref: '#/schemas/AvailableSubscriptionPlan'}

  UserSubscription:
    type: object
    additionalProperties: false
    required:
      - id
      - plan_title_snapshot
      - status
      - start_at
      - end_at
      - amount_total
      - amount_used
      - auto_renew
      - cancel_at_period_end
      - period_days
      - grace_days
      - created_at
      - updated_at
    description: |
      我的订阅投影；不含 user_id/order_id/价格/allow_wallet_overflow。
      amount_total=0 表示无限额度，此时省略 amount_remain。
    properties:
      id: {type: integer, format: int64}
      plan_title_snapshot: {type: string}
      status: {type: string, enum: [active, expired, cancelled]}
      start_at: {type: string, format: date-time}
      end_at: {type: string, format: date-time}
      next_reset_at: {type: string, format: date-time, nullable: true}
      amount_total: {type: integer, format: int64, minimum: 0}
      amount_used: {type: integer, format: int64, minimum: 0}
      amount_remain: {type: integer, format: int64, minimum: 0}
      auto_renew: {type: boolean}
      cancel_at_period_end: {type: boolean}
      period_days: {type: integer, minimum: 1}
      grace_days: {type: integer, minimum: 0}
      model_scope:
        type: array
        nullable: true
        items: {type: string}
      concurrency_limit: {type: integer, minimum: 1, nullable: true}
      created_at: {type: string, format: date-time}
      updated_at: {type: string, format: date-time}

  UserSubscriptionList:
    type: object
    additionalProperties: false
    required: [items, total, page, page_size]
    properties:
      items:
        type: array
        items: {$ref: '#/schemas/UserSubscription'}
      total: {type: integer, minimum: 0}
      page: {type: integer, minimum: 1}
      page_size: {type: integer, minimum: 1, maximum: 100}

  BillingPreference:
    type: object
    additionalProperties: false
    required: [preference]
    properties:
      preference:
        type: string
        enum: [subscription_first, wallet_first, subscription_only, wallet_only]

  BillingPreferenceUpdateRequest:
    type: object
    additionalProperties: false
    required: [preference]
    properties:
      preference:
        type: string
        description: 未知/空值归一为 subscription_first（不返回 422）

  SubscriptionPurchaseRequest:
    type: object
    additionalProperties: false
    required: [plan_id, provider]
    properties:
      plan_id:
        type: integer
        format: int64
        minimum: 1
      provider:
        type: string
        enum: [stripe, alipay, epay, wallet]
        description: |
          支付渠道；金额/币种由服务端按套餐行读取，不接受客户端传入。
          `wallet` 为余额购买：服务端在同一事务内扣减钱包、写
          `subscription_purchase` 流水、将订单置 succeeded 并创建订阅实例；
          余额不足返回 402，且不留下订单/实例/流水。`epay` 返回
          `pay_url` + `form_fields`（与充值同构）。

  SubscriptionRenewRequest:
    type: object
    additionalProperties: false
    required: [provider]
    properties:
      provider:
        type: string
        enum: [stripe, alipay, epay]
        description: |
          支付渠道；目标实例来自路径，金额/周期由服务端按套餐行读取。
          `epay` 返回 `pay_url` + `form_fields`（与充值同构）。

  # 站点公告 · 用户侧投影（D7a；modules-08 F-08-04 / R-D7-05）。
  # 刻意不含 created_by/updated_by/offline_at 等管理面事实。
  ActiveAnnouncement:
    type: object
    additionalProperties: false
    required: [id, title, category, publish_at, content_markdown, content_html, read]
    properties:
      id: {type: string, format: uuid}
      title: {type: string, maxLength: 80}
      category:
        type: string
        enum: [notice, maintenance, release]
      publish_at: {type: string, format: date-time}
      expire_at:
        type: string
        format: date-time
        nullable: true
        description: null = 永久有效。
      content_markdown: {type: string}
      content_html:
        type: string
        description: 净化后的 HTML（原始 HTML 不解析，危险链接丢弃 href）。
      read:
        type: boolean
        description: 当前用户是否已读；未登录不可访问本端点。

  # 站内通知 · 用户侧投影（A5；modules-08 §3.9.1 system.announcement）。
  # 不暴露 dedupe_key/recipient_user_id 等内部幂等锚。
  UserNotification:
    type: object
    additionalProperties: false
    required: [id, category, created_at]
    properties:
      id: {type: integer, format: int64}
      template_key:
        type: string
        description: 产生该通知的模板 key（当前恒为 system.announcement）。
      category: {type: string}
      title: {type: string}
      summary: {type: string}
      body:
        type: string
        description: 按用户语言渲染后的 Markdown 正文；模板渲染失败时为空。
      link_url: {type: string}
      announcement_id:
        type: string
        format: uuid
        description: |
          公告投递的归因键（payload.announcement_id）；前端据此拼
          `/announcements/{id}` 详情深链。普通站内通知没有该字段。
      locale:
        type: string
        enum: [en, zh-CN, zh-TW, fr, ru, ja, vi]
      read_at:
        type: string
        format: date-time
        nullable: true
        description: null = 未读。
      created_at: {type: string, format: date-time}

  UserNotificationList:
    type: object
    additionalProperties: false
    required: [items, total, page, page_size]
    properties:
      items:
        type: array
        items: {$ref: '#/schemas/UserNotification'}
      total:
        type: integer
        format: int64
      page:
        type: integer
        minimum: 1
      page_size:
        type: integer
        minimum: 1
        maximum: 100

  ActiveAnnouncementList:
    type: object
    additionalProperties: false
    required: [items]
    properties:
      items:
        type: array
        items: {$ref: '#/schemas/ActiveAnnouncement'}
