# 管理域 DTO（modules-07 用户与权限管理、分组）。
# 管理端点仅接受会话 Cookie：Bearer 令牌没有角色/权限语义（auth.SessionAuth
# 只注入 UserID+TokenID），RBAC 会对令牌请求 fail-closed。因此 paths 中这些
# operation 只声明 sessionCookie。
schemas:
  # M0 占位：渠道在模块 06 实现，schema 随 M6 细化（密钥字段永不回显）。
  Channel:
    type: object
    additionalProperties: true
    description: 上游渠道 DTO 占位（密钥字段永不回显；schema 待 M6 细化）
    x-newtg-pending: true

  AdminUser:
    type: object
    additionalProperties: false
    required:
      - id
      - username
      - role
      - status
      - balance
      - group
      - admin_permissions
      - totp_enabled
      - must_change_password
      - token_count
      - created_at
      - updated_at
    description: |
      管理面用户投影。永不含口令哈希、TOTP 种子或备用码。admin_permissions
      为 null 表示 FULL（数据库 NULL）；空数组表示明确无任何权限——两者语义
      不同，客户端不得把 [] 当 null。
    properties:
      id:
        type: integer
        format: int64
      username:
        type: string
      display_name:
        type: string
        maxLength: 32
        nullable: true
      email:
        type: string
        format: email
        nullable: true
        description: 管理员创建的用户可为 null（不绑定邮箱）。
      role:
        $ref: './public.yaml#/schemas/UserRole'
      status:
        $ref: './public.yaml#/schemas/UserStatus'
      balance:
        type: integer
        format: int64
        description: 当前余额（credits 最小单位）。
      group:
        type: string
      admin_permissions:
        type: array
        items:
          $ref: '#/schemas/PermissionGrant'
        nullable: true
        description: |
          权限矩阵。null = FULL（数据库 NULL）；["*"] 是 FULL 的显式形态；
          空数组 = 明确无任何权限。两者语义不同，客户端不得混用。
      totp_enabled:
        type: boolean
      must_change_password:
        type: boolean
      remark:
        type: string
        maxLength: 255
        nullable: true
      token_count:
        type: integer
        format: int64
      created_at:
        type: string
        format: date-time
      updated_at:
        type: string
        format: date-time
        description: 乐观锁版本；PATCH 必须原样回传。

  PermissionKey:
    type: string
    enum:
      - users:read
      - users:create
      - users:update
      - users:disable
      - users:delete
      - users:adjust-quota
      - users:manage-roles
      - users:reset-security
      - groups:manage
      - channels:read
      - channels:manage
      - channels:manage_sensitive
      - pricing:read
      - pricing:manage
      - redemption:manage
      - orders:read
      - orders:manage
      - logs:read
      - log.prompt.view
      - settings:manage
    description: |
      modules-07 F-07-08 的 20 键冻结目录（order 与文档表格一致）。
      通配符 "*" 单独建模为 PermissionGrant，不放宽本枚举。

  PermissionGrant:
    oneOf:
      - $ref: '#/schemas/PermissionKey'
      - type: string
        enum: ['*']
    description: 权限矩阵成员：20 键之一或全权通配符 "*"。

  AdminUserList:
    allOf:
      - $ref: '../components/pagination.yaml#/schemas/Page'
      - type: object
        properties:
          items:
            type: array
            items:
              $ref: '#/schemas/AdminUser'
    description: GET /api/users 的 offset 分页信封。

  AdminCreateUserRequest:
    type: object
    additionalProperties: false
    required: [username, password]
    properties:
      username:
        type: string
        pattern: '^[a-zA-Z0-9_-]{3,32}$'
      display_name:
        type: string
        maxLength: 32
        nullable: true
      role:
        $ref: './public.yaml#/schemas/UserRole'
        description: 缺省 user。创建 admin 需要执行者同时持有 users:manage-roles 与默认权限集的超集。
      group:
        type: string
        description: 缺省 default。
      password:
        type: string
        minLength: 8
        maxLength: 128
      remark:
        type: string
        maxLength: 255
        nullable: true
    description: |
      必须携带 Idempotency-Key；同键重放只创建一条。请求体没有 email 字段：
      管理员创建的用户 email 为 NULL。用户名冲突 409。
    # 注意：role 缺省时不能写成 required，但 description 说明默认值。

  AdminUpdateUserRequest:
    type: object
    additionalProperties: false
    required: [updated_at]
    description: |
      部分更新。不含口令字段：提交 password 返回 400（用
      POST /api/users/{id}/reset-password）。未知字段 403 field_not_writable。
      role 变更会吊销该用户全部会话；不能修改自己的角色/状态/权限（400）。
    properties:
      display_name:
        type: string
        maxLength: 32
        nullable: true
      group:
        type: string
      remark:
        type: string
        maxLength: 255
        nullable: true
      role:
        $ref: './public.yaml#/schemas/UserRole'
      updated_at:
        type: string
        format: date-time

  AdminUserStatusRequest:
    type: object
    additionalProperties: false
    required: [status]
    properties:
      status:
        $ref: './public.yaml#/schemas/UserStatus'
    description: |
      封禁在同一事务内吊销全部会话并把令牌置 disabled；解禁不自动恢复令牌。
      不能封禁自己（400）。

  AdminUserStatusResponse:
    type: object
    additionalProperties: false
    required: [id, status]
    properties:
      id:
        type: integer
        format: int64
      status:
        $ref: './public.yaml#/schemas/UserStatus'

  QuotaAdjustmentRequest:
    type: object
    additionalProperties: false
    required: [mode, amount, idempotency_key]
    properties:
      mode:
        type: string
        enum: [add, subtract, override]
      amount:
        type: integer
        format: int64
        description: |
          add/subtract 为增量，必须 ≥1（handler 对 0 返回 400：零增量没有业务
          意义，且会污染流水）；override 为目标余额，允许 0。三种 mode 共用本
          schema，条件下限写在 schema 级 not/anyOf 中，而不是给 amount 加
          无条件 minimum（否则合法的 override=0 会被误判非法）。
      idempotency_key:
        type: string
        minLength: 1
        description: 必填业务幂等键；与 HTTP Idempotency-Key 不同，写入交易流水。
    # 条件下限：add/subtract 禁止 amount≤0，override 禁止 amount<0。
    # 用 not+anyOf 表达 if/then 的等价约束——kin-openapi v0.131.0（仓内
    # validate 门禁）不接受 if/then/else 作为 schema 兄弟字段；这种写法不改变
    # 生成的对象类型（oapi-codegen/openapi-typescript 均忽略 not）。
    not:
      anyOf:
        - properties:
            mode:
              enum: [add, subtract]
            amount:
              maximum: 0
          required: [mode, amount]
        - properties:
            mode:
              enum: [override]
            amount:
              maximum: -1
          required: [mode, amount]
    description: |
      原子 UPDATE（GC-5）：subtract 超过余额返回 400，绝不产生负余额；
      override 与当前余额相同返回 400（无变化）。成功后写
      type=admin_adjustment 流水。

  QuotaAdjustmentResponse:
    type: object
    additionalProperties: false
    required: [user_id, new_balance, transaction_id]
    properties:
      user_id:
        type: integer
        format: int64
      new_balance:
        type: integer
        format: int64
      transaction_id:
        type: integer
        format: int64

  ResetPasswordResponse:
    type: object
    additionalProperties: false
    required: [temp_password]
    properties:
      temp_password:
        type: string
        description: |
          16 位一次性临时口令，仅本次响应出现（Cache-Control: no-store）。
          TEMP_PWD_TTL=24h 且 must_change_password=true；24 小时内不改密
          则临时口令失效。
    description: 管理员重置口令的响应；审计只记录"发生了重置"，绝不含口令材料。

  SetPermissionsRequest:
    type: object
    additionalProperties: false
    required: [admin_permissions]
    properties:
      admin_permissions:
        type: array
        uniqueItems: true
        items:
          $ref: '#/schemas/PermissionGrant'
        description: |
          授予集合必须是调用者自身权限的子集，否则 403 且不写库。
          显式 null 被拒绝——NULL 在 RBAC 语义里是 FULL，匿名 null→FULL
          会绕过超集校验；授予全权必须显式提交 ["*"]。
    description: |
      PATCH /api/users/{id}/permissions 只对 admin 目标有效；不能修改自己
      （400）。成功 200 返回更新后的 AdminUser。

  AdminGroup:
    type: object
    additionalProperties: false
    required:
      - id
      - name
      - ratio
      - user_selectable
      - is_system
      - status
      - users_count
      - pricing_overrides_count
      - channels_count
      - created_at
      - updated_at
    properties:
      id:
        type: integer
        format: int64
      name:
        type: string
        pattern: '^[a-z0-9_-]{2,32}$'
      description:
        type: string
        maxLength: 128
        nullable: true
      ratio:
        type: integer
        format: int32
        description: 分组倍率（DB 150 表示 1.5）。
      user_selectable:
        type: boolean
      is_system:
        type: boolean
        description: 系统分组（如 default）不可删除。
      status:
        type: integer
        format: int16
      users_count:
        type: integer
        format: int64
      pricing_overrides_count:
        type: integer
        format: int64
      channels_count:
        type: integer
        format: int64
      created_at:
        type: string
        format: date-time
      updated_at:
        type: string
        format: date-time

  AdminGroupList:
    allOf:
      - $ref: '../components/pagination.yaml#/schemas/Page'
      - type: object
        properties:
          items:
            type: array
            items:
              $ref: '#/schemas/AdminGroup'
    description: GET /api/groups 的 offset 分页信封。

  AdminCreateGroupRequest:
    type: object
    additionalProperties: false
    required: [name]
    properties:
      name:
        type: string
        pattern: '^[a-z0-9_-]{2,32}$'
      description:
        type: string
        maxLength: 128
        nullable: true
    description: 名称唯一；冲突 409（不区分大小写归一后比较）。

  AdminUpdateGroupRequest:
    type: object
    additionalProperties: false
    properties:
      name:
        type: string
        pattern: '^[a-z0-9_-]{2,32}$'
      description:
        type: string
        maxLength: 128
        nullable: true
    description: |
      至少提供一个字段，否则 400。改名会同步更新引用该分组的用户/令牌
      （仓储事务）；系统组（default/auto 等）删除返回 400（handlers_groups.go:
      ErrGroupSystem → 400），被引用的分组删除返回 409。

  # ---------------------------------------------------------------------------
  # 定价管理（M3 Task 7 / modules-06 F-06-13/14/16）
  #
  # 价格列是整数积分（R9）：nullable=true 表示 NULL=未设置（按 billing-02
  # §3.2 兜底），0=显式免费。客户端不得把 null 当 0——两者计费语义不同。
  # ---------------------------------------------------------------------------
  PricingMode:
    type: string
    enum: [per_token, per_request, tiered_expr]
    description: |
      per_token=积分/1M tokens；per_request=积分/次（只使用 prompt_price）；
      tiered_expr=表达式模式（billing_expr 是唯一价格配置）。

  PricingStatus:
    type: integer
    enum: [1, 2]
    description: 1=启用，2=停用（软状态，不删行）。

  ModelPricing:
    type: object
    additionalProperties: false
    required:
      - id
      - model
      - mode
      - author
      - status
      - free
      - created_at
      - updated_at
    properties:
      id:
        type: integer
        format: int64
      model:
        type: string
        pattern: '^[A-Za-z0-9._:/-]{1,128}$'
      mode:
        $ref: '#/schemas/PricingMode'
      billing_expr:
        type: string
        nullable: true
        description: 非 null 即表达式模式；与四个价列互斥。
      prompt_price:
        type: integer
        nullable: true
        format: int64
        minimum: 0
        maximum: 9007199254740991
        description: 输入价（积分/1M tokens）；per_request 模式下是每次请求价。
      completion_price:
        type: integer
        nullable: true
        format: int64
        minimum: 0
        maximum: 9007199254740991
      cache_read_price:
        type: integer
        nullable: true
        format: int64
        minimum: 0
        maximum: 9007199254740991
      cache_write_price:
        type: integer
        nullable: true
        format: int64
        minimum: 0
        maximum: 9007199254740991
      author:
        type: string
        minLength: 1
        maxLength: 64
      vendor:
        type: string
        nullable: true
        maxLength: 64
      status:
        $ref: '#/schemas/PricingStatus'
      free:
        type: boolean
        description: 四项有效价全为 0 才为 true；单项 0 不得显示「免费」。
      created_at:
        type: string
        format: date-time
      updated_at:
        type: string
        format: date-time
        description: 乐观锁版本；PATCH/启停必须原样回传。

  ModelPricingList:
    allOf:
      - $ref: '../components/pagination.yaml#/schemas/Page'
      - type: object
        properties:
          items:
            type: array
            items:
              $ref: '#/schemas/ModelPricing'
          quota_per_unit:
            type: integer
            format: int64
            description: 展示换算的每货币单位积分（默认 100）。
    description: GET /api/model-pricing 的 offset 分页信封。

  ModelPricingCreateRequest:
    type: object
    additionalProperties: false
    required: [model]
    properties:
      model:
        type: string
        pattern: '^[A-Za-z0-9._:/-]{1,128}$'
      mode:
        $ref: '#/schemas/PricingMode'
      billing_expr:
        type: string
        nullable: true
        description: 非空即表达式模式；与数值价列互斥（混用 400）。
      prompt_price:
        type: integer
        nullable: true
        format: int64
        minimum: 0
        maximum: 9007199254740991
      completion_price:
        type: integer
        nullable: true
        format: int64
        minimum: 0
        maximum: 9007199254740991
      cache_read_price:
        type: integer
        nullable: true
        format: int64
        minimum: 0
        maximum: 9007199254740991
      cache_write_price:
        type: integer
        nullable: true
        format: int64
        minimum: 0
        maximum: 9007199254740991
      author:
        type: string
        minLength: 1
        maxLength: 64
        description: 缺省 Unknown；null 与空串 422。
      vendor:
        type: string
        nullable: true
        maxLength: 64
      status:
        $ref: '#/schemas/PricingStatus'
    description: |
      价格单位是整数积分；展示层按 quota_per_unit 换算为元。
      表达式非法/空白 400（problem.fields=[billing_expr]）；负数或超 2^53−1
      422；模型重复 409。

  ModelPricingUpdateRequest:
    type: object
    additionalProperties: false
    required: [updated_at]
    properties:
      updated_at:
        type: string
        format: date-time
      mode:
        $ref: '#/schemas/PricingMode'
      billing_expr:
        type: string
        nullable: true
        description: |
          null 表示显式清除表达式（离开 tiered_expr 必须同时给出 mode）。
      prompt_price:
        type: integer
        nullable: true
        format: int64
        minimum: 0
        maximum: 9007199254740991
      completion_price:
        type: integer
        nullable: true
        format: int64
        minimum: 0
        maximum: 9007199254740991
      cache_read_price:
        type: integer
        nullable: true
        format: int64
        minimum: 0
        maximum: 9007199254740991
      cache_write_price:
        type: integer
        nullable: true
        format: int64
        minimum: 0
        maximum: 9007199254740991
      author:
        type: string
        minLength: 1
        maxLength: 64
        description: 提交 null 或空串 422（NOT NULL 列）；复位请提交 "Unknown"。
      vendor:
        type: string
        nullable: true
        maxLength: 64
      status:
        $ref: '#/schemas/PricingStatus'
    description: |
      部分更新；model 不可改（提交 model 由字段策略 403）。
      updated_at 缺失 400、不匹配 409。空对象/无字段 400。

  ModelPricingStatusRequest:
    type: object
    additionalProperties: false
    required: [updated_at]
    properties:
      updated_at:
        type: string
        format: date-time

  PricingModelOption:
    type: object
    additionalProperties: false
    required: [model, mode, status]
    properties:
      model:
        type: string
      mode:
        $ref: '#/schemas/PricingMode'
      status:
        $ref: '#/schemas/PricingStatus'

  PricingModelList:
    type: object
    additionalProperties: false
    required: [items]
    properties:
      items:
        type: array
        items:
          $ref: '#/schemas/PricingModelOption'

  PricingPreviewParams:
    type: object
    additionalProperties: false
    properties:
      p:
        type: integer
        format: int64
        minimum: 0
        description: 输入 token（未单独定价的部分）。
      c:
        type: integer
        format: int64
        minimum: 0
      len:
        type: integer
        format: int64
        minimum: 0
      cr:
        type: integer
        format: int64
        minimum: 0
      cc5m:
        type: integer
        format: int64
        minimum: 0
      cc1h:
        type: integer
        format: int64
        minimum: 0
      img:
        type: integer
        format: int64
        minimum: 0
      img_cr:
        type: integer
        format: int64
        minimum: 0
      img_o:
        type: integer
        format: int64
        minimum: 0
      ai:
        type: integer
        format: int64
        minimum: 0
      ao:
        type: integer
        format: int64
        minimum: 0
      image_count:
        type: integer
        minimum: -1
        description: '-1=未设置（按请求域缺省 1）；>=0=精确张数（0 合法且计 0）。缺省 -1。'

  ModelPricingPreviewRequest:
    type: object
    additionalProperties: false
    required: [spec]
    properties:
      spec:
        oneOf:
          - type: object
            additionalProperties: true
          - type: string
        description: |
          pricing.ParsePricing 接受的 spec：JSON 对象（mode/expr 或
          prompt_price/completion_price/cache_read_price/cache_write_price，
          也接受旧倍率风格 model_ratio 等）或等价的 JSON 字符串。
          求值与保存使用同一解析器。按次预览可只给 model_price（自动按
          per_request 解释），或显式 mode=per_request 且必须提供 model_price；
          后者缺失返回 400。
      model:
        type: string
        pattern: '^[A-Za-z0-9._:/-]{1,128}$'
        description: 用于模型族默认值（补全倍率/Claude 缓存 1h）；可省略。
      group_ratio:
        type: number
        format: double
        not:
          maximum: 0
        description: 预览用的分组倍率，必须 > 0；缺省 1（服务端默认）。
      params:
        $ref: '#/schemas/PricingPreviewParams'

  ModelPricingPreviewResponse:
    type: object
    additionalProperties: false
    required: [quota, quota_per_unit, amount_yuan, mode, free_model, clamped, clamp]
    properties:
      quota:
        type: integer
        format: int64
        description: 整数积分。
      quota_per_unit:
        type: integer
        format: int64
      amount_yuan:
        type: string
        pattern: '^-?[0-9]+\.[0-9]{2}$'
        description: 元，HALF_UP 到分。
      mode:
        $ref: '#/schemas/PricingMode'
      free_model:
        type: boolean
      clamped:
        type: boolean
        description: 命中配额饱和（quota 已是钳制后的值，同时返回 clamp 审计）。
      clamp:
        type: object
        additionalProperties: true
        nullable: true
        description: 饱和审计标记（op/kind/original/clamped）；未饱和时为 null。

  GroupPricingMode:
    oneOf:
      - $ref: '#/schemas/PricingMode'
      - type: string
        enum: ['']
    description: 随源模型只读展示；源 model_pricing 行缺失时为空串。

  GroupPricing:
    type: object
    additionalProperties: false
    required:
      - id
      - group
      - model
      - mode
      - prompt_price
      - completion_price
      - cache_read_price
      - cache_write_price
      - status
      - source_status
      - created_at
      - updated_at
    properties:
      id:
        type: integer
        format: int64
      group:
        type: string
        pattern: '^[a-z0-9_-]{2,32}$'
      model:
        type: string
      mode:
        $ref: '#/schemas/GroupPricingMode'
      prompt_price:
        type: integer
        format: int64
        minimum: 0
        maximum: 9007199254740991
      completion_price:
        type: integer
        format: int64
        minimum: 0
        maximum: 9007199254740991
      cache_read_price:
        type: integer
        format: int64
        minimum: 0
        maximum: 9007199254740991
      cache_write_price:
        type: integer
        format: int64
        minimum: 0
        maximum: 9007199254740991
      status:
        $ref: '#/schemas/PricingStatus'
      source_status:
        type: integer
        enum: [0, 1, 2]
        description: 源 model_pricing 状态；0=源行缺失。
      created_at:
        type: string
        format: date-time
      updated_at:
        type: string
        format: date-time

  GroupPricingList:
    allOf:
      - $ref: '../components/pagination.yaml#/schemas/Page'
      - type: object
        properties:
          items:
            type: array
            items:
              $ref: '#/schemas/GroupPricing'
          quota_per_unit:
            type: integer
            format: int64
    description: GET /api/group-pricing 的 offset 分页信封。

  GroupPricingCreateRequest:
    type: object
    additionalProperties: false
    required: [group, model]
    properties:
      group:
        type: string
        pattern: '^[a-z0-9_-]{2,32}$'
        description: 必须存在且启用（否则 422）。
      model:
        type: string
        pattern: '^[A-Za-z0-9._:/-]{1,128}$'
        description: 必须已在 model_pricing 定价（否则 422）。
      prompt_price:
        type: integer
        format: int64
        minimum: 0
        maximum: 9007199254740991
        description: 覆盖价（整数绝对价）；缺省 0。
      completion_price:
        type: integer
        format: int64
        minimum: 0
        maximum: 9007199254740991
        description: 覆盖价（整数绝对价）；缺省 0。
      cache_read_price:
        type: integer
        format: int64
        minimum: 0
        maximum: 9007199254740991
        description: 覆盖价（整数绝对价）；缺省 0。
      cache_write_price:
        type: integer
        format: int64
        minimum: 0
        maximum: 9007199254740991
        description: 覆盖价（整数绝对价）；缺省 0。
      status:
        $ref: '#/schemas/PricingStatus'
    description: 覆盖价是整数绝对价，优先于「基准价 × 分组倍率」；重复 (group, model) 409。

  GroupPricingUpdateRequest:
    type: object
    additionalProperties: false
    required: [updated_at]
    properties:
      updated_at:
        type: string
        format: date-time
      prompt_price:
        type: integer
        format: int64
        minimum: 0
        maximum: 9007199254740991
      completion_price:
        type: integer
        format: int64
        minimum: 0
        maximum: 9007199254740991
      cache_read_price:
        type: integer
        format: int64
        minimum: 0
        maximum: 9007199254740991
      cache_write_price:
        type: integer
        format: int64
        minimum: 0
        maximum: 9007199254740991
      status:
        $ref: '#/schemas/PricingStatus'
    description: 部分更新；group/model 不可改（字段策略 403）。

  GroupPricingStatusRequest:
    type: object
    additionalProperties: false
    required: [updated_at]
    properties:
      updated_at:
        type: string
        format: date-time

  # ---- M5 兑换码（modules-04 §4.F F-04-15/16）----
  RedemptionCodeStatus:
    type: string
    enum: [unused, disabled, used, expired]

  RedemptionCodeStatusFilter:
    type: string
    enum: [unused, disabled, used, expired]
    description: expired 是虚拟态（不落库）

  RedemptionCode:
    type: object
    additionalProperties: false
    required:
      - id
      - credits
      - status
      - code_mask
      - created_by
      - created_at
      - updated_at
    description: |
      兑换码列表投影。永不包含码值：code_mask 固定为 `••••••`。
      expired 是 SQL 按 expires_at 计算的虚拟状态。
    properties:
      id:
        type: integer
        format: int64
      batch_name:
        type: string
        maxLength: 20
        nullable: true
      credits:
        type: integer
        format: int64
        minimum: 1
      status:
        $ref: '#/schemas/RedemptionCodeStatus'
      code_mask:
        type: string
        enum: ['••••••']
      created_by:
        type: integer
        format: int64
      used_by:
        type: integer
        format: int64
        nullable: true
      used_at:
        type: string
        format: date-time
        nullable: true
      expires_at:
        type: string
        format: date-time
        nullable: true
      created_at:
        type: string
        format: date-time
      updated_at:
        type: string
        format: date-time

  RedemptionCodeList:
    type: object
    additionalProperties: false
    required: [items, total, page, page_size]
    properties:
      items:
        type: array
        items:
          $ref: '#/schemas/RedemptionCode'
      total:
        type: integer
        minimum: 0
      page:
        type: integer
        minimum: 1
      page_size:
        type: integer
        minimum: 1
        maximum: 100

  RedemptionCodeCreateRequest:
    type: object
    additionalProperties: false
    required: [batch_name, credits, count]
    properties:
      batch_name:
        type: string
        minLength: 1
        maxLength: 20
      credits:
        type: integer
        format: int64
        minimum: 1
      count:
        type: integer
        minimum: 1
        maximum: 100
      expires_at:
        type: string
        format: date-time
        nullable: true
        description: 必须晚于当前时间；null = 永不过期

  RedemptionCodeCreateResponse:
    type: object
    additionalProperties: false
    required: [batch_name, credits, count, codes]
    properties:
      batch_name:
        type: string
        maxLength: 20
      credits:
        type: integer
        format: int64
      count:
        type: integer
      expires_at:
        type: string
        format: date-time
        nullable: true
      codes:
        type: array
        description: 明文码，仅本响应返回一次；库中只存 SHA-256 哈希
        items:
          type: string
          minLength: 26
          maxLength: 26
          pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
        minItems: 1
        maxItems: 100

  RedemptionCodeStatusRequest:
    type: object
    additionalProperties: false
    required: [status]
    properties:
      status:
        type: string
        enum: [unused, disabled]

  RedemptionCodeStatusResult:
    type: object
    additionalProperties: false
    required: [id, status]
    properties:
      id:
        type: integer
        format: int64
      status:
        type: string
        enum: [unused, disabled]

  RedemptionCodeBatchDeleteRequest:
    type: object
    additionalProperties: false
    required: [ids]
    properties:
      ids:
        type: array
        items:
          type: integer
          format: int64
        minItems: 1
        maxItems: 100

  RedemptionCodeBatchDeleteResponse:
    type: object
    additionalProperties: false
    required: [succeeded, failed]
    properties:
      succeeded:
        type: integer
        minimum: 0
      failed:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [id, detail]
          properties:
            id:
              type: integer
              format: int64
            detail:
              type: string
              enum: [used, not_found, invalid_id]

  # ---------------------------------------------------------------------------
  # 模型部署控制面 · 设置（M6d Task 2 / modules-08 §3.20）。
  # ---------------------------------------------------------------------------
  DeploySettings:
    type: object
    additionalProperties: false
    required: [enabled, has_secret, can_connect, updated_at]
    description: |
      作用域化设置投影。永不含 api_key；has_secret 是密钥是否已配置的唯一
      外部可见事实。updated_at 为 null 表示该 section 尚无任何落库行。
    properties:
      enabled:
        type: boolean
      has_secret:
        type: boolean
      can_connect:
        type: boolean
        description: enabled && has_secret
      updated_at:
        type: string
        format: date-time
        nullable: true

  UpdateDeploySettingsRequest:
    type: object
    additionalProperties: false
    required: [enabled]
    properties:
      enabled:
        type: boolean
      api_key:
        type: string
        description: 留空或 "******" = 不更新已存密钥。
      clear_api_key:
        type: boolean
        description: true 时删除已存密钥；与 api_key 同时出现返回 400。
      updated_at:
        type: string
        format: date-time
        nullable: true
        description: 读取时的乐观锁版本；陈旧值返回 409。

  DeployConnectionTestRequest:
    type: object
    additionalProperties: false
    properties:
      api_key:
        type: string
        description: 可选的候选密钥；只在本次请求内存中使用。

  DeployConnectionTestResult:
    type: object
    additionalProperties: false
    required: [ok, hardware_count, total_available, latency_ms]
    properties:
      ok:
        type: boolean
      hardware_count:
        type: integer
      total_available:
        type: integer
      latency_ms:
        type: integer
        format: int64

  # ---------------------------------------------------------------------------
  # 模型部署控制面 · 部署管理（M6d Task 4 / modules-08 §3.20）。
  # 所有详情/列表 schema 都不含秘密字段：仓库密钥与秘密环境变量只写不读。
  # ---------------------------------------------------------------------------
  DeployDeployment:
    type: object
    additionalProperties: false
    required: [id, name, status, completed_percent, gpu_count, replica_count, compute_minutes_served, compute_minutes_remaining]
    properties:
      id: {type: string}
      name: {type: string}
      status: {type: string}
      completed_percent: {type: number}
      gpu_count: {type: integer}
      replica_count: {type: integer}
      hardware_name: {type: string}
      brand_name: {type: string}
      compute_minutes_served: {type: integer}
      compute_minutes_remaining: {type: integer}
      created_at: {type: string, format: date-time, nullable: true}

  DeployDeploymentList:
    type: object
    additionalProperties: false
    required: [items, total, page, page_size, status_counts]
    properties:
      items:
        type: array
        items:
          $ref: '#/schemas/DeployDeployment'
      total: {type: integer}
      page: {type: integer}
      page_size: {type: integer}
      status_counts:
        type: object
        additionalProperties: {type: integer, format: int64}
        description: |
          按已扫描窗口统计（keyword 过滤后、status 过滤前）。搜索被截断或
          provider 未返回 total 时只代表窗口内计数，不是 provider 全量。
      search_truncated:
        type: boolean
        description: |
          provider 全量结果无法确认已取全时为 true：超过扫描上限（10 页 /
          1000 条），或 provider 未返回 total 且扫描触达上限。

  DeployHardwareType:
    type: object
    additionalProperties: true
    properties:
      id: {type: integer, format: int64}
      name: {type: string}
      available_replicas: {type: integer}

  DeployHardwareTypes:
    type: object
    additionalProperties: false
    required: [hardware_types, total, total_available]
    properties:
      hardware_types:
        type: array
        items:
          $ref: '#/schemas/DeployHardwareType'
      total: {type: integer}
      total_available: {type: integer}

  DeployLocation:
    type: object
    additionalProperties: true
    properties:
      id: {type: integer, format: int64}
      name: {type: string}

  DeployLocations:
    type: object
    additionalProperties: false
    required: [locations, total]
    properties:
      locations:
        type: array
        items:
          $ref: '#/schemas/DeployLocation'
      total: {type: integer}

  DeployAvailableReplica:
    type: object
    additionalProperties: false
    required: [location_id, location_name, hardware_id, available_count, max_gpus]
    properties:
      location_id: {type: integer}
      location_name: {type: string}
      hardware_id: {type: integer}
      available_count: {type: integer}
      max_gpus: {type: integer}

  DeployAvailableReplicas:
    type: object
    additionalProperties: false
    required: [replicas]
    properties:
      replicas:
        type: array
        items:
          $ref: '#/schemas/DeployAvailableReplica'

  DeployPriceEstimationRequest:
    type: object
    additionalProperties: false
    required: [hardware_id, location_ids, gpus_per_container, replica_count, duration_hours]
    properties:
      hardware_id: {type: integer, minimum: 1}
      location_ids:
        type: array
        minItems: 1
        items: {type: integer, minimum: 1}
      gpus_per_container: {type: integer, minimum: 1}
      replica_count: {type: integer, minimum: 1}
      duration_hours: {type: integer, minimum: 1}
      currency: {type: string}
      duration_type: {type: string}
      duration_qty: {type: integer, minimum: 1}
      hardware_qty: {type: integer, minimum: 1}

  DeployPriceBreakdown:
    type: object
    additionalProperties: false
    description: 只包含 provider 实际提供的费用项；缺失项不出现（不用 0 伪造）。
    properties:
      compute_cost: {type: number}
      network_cost: {type: number}
      storage_cost: {type: number}
      total_cost: {type: number}
      hourly_rate: {type: number}
      ionet_fee: {type: number}
      ionet_fee_percent: {type: number}
      currency_conversion_fee: {type: number}
      currency_conversion_fee_percent: {type: number}
      discount: {type: number}

  DeployPriceEstimation:
    type: object
    additionalProperties: false
    required: [estimated_cost, currency, price_breakdown, estimation_valid]
    properties:
      estimated_cost: {type: number}
      currency: {type: string}
      price_breakdown:
        $ref: '#/schemas/DeployPriceBreakdown'
      estimation_valid: {type: boolean}

  DeployNameAvailability:
    type: object
    additionalProperties: false
    required: [name, available]
    properties:
      name: {type: string}
      available: {type: boolean}

  DeployAction:
    type: object
    additionalProperties: false
    required: [deployment_id, status]
    properties:
      deployment_id: {type: string}
      status: {type: string}

  RenameDeploymentResponse:
    type: object
    additionalProperties: false
    required: [deployment_id, status, name]
    properties:
      deployment_id: {type: string}
      status: {type: string}
      name: {type: string}

  DeployDeploymentDetail:
    type: object
    additionalProperties: false
    required: [id, status]
    properties:
      id: {type: string}
      status: {type: string}
      created_at: {type: string, format: date-time, nullable: true}
      started_at: {type: string, format: date-time, nullable: true}
      finished_at: {type: string, format: date-time, nullable: true}
      amount_paid: {type: number}
      completed_percent: {type: number}
      total_gpus: {type: integer}
      gpus_per_container: {type: integer}
      total_containers: {type: integer}
      hardware_id: {type: integer}
      hardware_name: {type: string}
      brand_name: {type: string}
      locations:
        type: array
        items:
          $ref: '#/schemas/DeployLocation'
      compute_minutes_served: {type: integer}
      compute_minutes_remaining: {type: integer}
      container_config:
        $ref: '#/schemas/DeployContainerConfig'

  DeployContainerConfig:
    type: object
    additionalProperties: false
    description: 非秘密容器配置；秘密环境变量永不返回。
    properties:
      entrypoint:
        type: array
        items: {type: string}
      env_variables:
        type: object
        additionalProperties: true
      traffic_port: {type: integer}
      image_url: {type: string}

  CreateDeploymentRequest:
    type: object
    additionalProperties: false
    required: [name, hardware_id, location_ids, gpus_per_container, replica_count, duration_hours, image_url]
    properties:
      name: {type: string, minLength: 1}
      hardware_id: {type: integer, minimum: 1}
      location_ids:
        type: array
        minItems: 1
        items: {type: integer, minimum: 1}
      gpus_per_container: {type: integer, minimum: 1}
      replica_count: {type: integer, minimum: 1}
      duration_hours: {type: integer, minimum: 1}
      image_url:
        type: string
        format: uri
        description: 审计前会剥离 userinfo 与查询串。
      registry_username: {type: string}
      registry_secret:
        type: string
        writeOnly: true
        description: 只写不读；不落库、不回显、不进审计。
      entrypoint:
        type: array
        items: {type: string}
      args:
        type: array
        items: {type: string}
      traffic_port: {type: integer, minimum: 1, maximum: 65535}
      env_variables:
        type: object
        additionalProperties: {type: string}
      secret_env_variables:
        type: object
        writeOnly: true
        additionalProperties: {type: string}
        description: 只写不读；键名与值都不进审计。

  UpdateDeploymentRequest:
    type: object
    additionalProperties: false
    properties:
      image_url: {type: string, format: uri}
      registry_username: {type: string}
      registry_secret:
        type: string
        writeOnly: true
        description: 留空 = 不更新。
      clear_registry_secret:
        type: boolean
        description: 显式清除；与 registry_secret 同时出现返回 400。
      entrypoint:
        type: array
        items: {type: string}
      args:
        type: array
        items: {type: string}
      command: {type: string}
      traffic_port: {type: integer, minimum: 1, maximum: 65535}
      env_variables:
        type: object
        additionalProperties: {type: string}
      secret_env_variables:
        type: object
        writeOnly: true
        additionalProperties: {type: string}
        description: 留空 = 不更新；空对象同样视为不更新。
      clear_secret_env:
        type: boolean
        description: 显式清除；与 secret_env_variables 同时出现返回 400。

  RenameDeploymentRequest:
    type: object
    additionalProperties: false
    required: [name]
    properties:
      name: {type: string, minLength: 1}

  ExtendDeploymentRequest:
    type: object
    additionalProperties: false
    required: [duration_hours]
    properties:
      duration_hours: {type: integer, minimum: 1}

  DeployContainerEvent:
    type: object
    additionalProperties: false
    properties:
      time: {type: string, format: date-time}
      message: {type: string}

  DeployContainer:
    type: object
    additionalProperties: false
    required: [container_id, status, gpus_per_container]
    properties:
      device_id: {type: string}
      container_id: {type: string}
      hardware: {type: string}
      brand_name: {type: string}
      status: {type: string}
      gpus_per_container: {type: integer}
      uptime_percent: {type: integer}
      runtime_seconds:
        type: integer
        format: int64
        description: 由 created_at 推导的展示值，不参与计费。
      public_url: {type: string}
      created_at: {type: string, format: date-time, nullable: true}
      events:
        type: array
        items:
          $ref: '#/schemas/DeployContainerEvent'

  DeployContainerList:
    type: object
    additionalProperties: false
    required: [containers, total]
    properties:
      containers:
        type: array
        items:
          $ref: '#/schemas/DeployContainer'
      total: {type: integer}

  DeployLogs:
    type: object
    additionalProperties: false
    required: [logs, next_page_token, has_more]
    properties:
      logs:
        type: array
        items: {type: string}
      next_page_token: {type: string}
      has_more: {type: boolean}

  # ---------------------------------------------------------------------------
  # 任务插件管理（M6d Task 5 / modules-08 §3.10 / relay-06 §2.4–§2.6）
  # 所有响应都不含上游凭据；列表永不包含源文本（S5）。
  # ---------------------------------------------------------------------------
  PluginIssue:
    type: object
    additionalProperties: false
    required: [key, fieldPath, locale, rule, message]
    properties:
      key: {type: string}
      fieldPath: {type: string}
      locale: {type: string}
      rule: {type: string}
      message: {type: string}

  TaskPluginRuntimeStatus:
    type: string
    enum: [registered, disabled, disabled_fallback, not_registered, compile_failed]
    description: |
      运行状态五态（relay-06 §2.5 / modules-08 F-08-28 同集）。
      registered=正常；disabled=已禁用；disabled_fallback=内置禁用但回退到上传层；
      not_registered=未注册；compile_failed=编译失败且无可用层。

  TaskPluginOption:
    type: object
    additionalProperties: false
    required: [key, name, channel_count]
    description: |
      渠道表单的插件候选（M6d Task 7a）。不含源码、图标或密钥。
    properties:
      key: {type: string, maxLength: 30}
      name: {type: string, maxLength: 128}
      channel_count:
        type: integer
        minimum: 0
        description: 绑定该插件的启用（status=1）渠道数；单绑与多绑命中都计一次。

  TaskPluginOptions:
    type: object
    additionalProperties: false
    required: [items, total]
    properties:
      items:
        type: array
        items: {$ref: '#/schemas/TaskPluginOption'}
      total: {type: integer, minimum: 0}

  TaskPlugin:
    type: object
    additionalProperties: false
    required:
      - key
      - name
      - source
      - builtin
      - enabled
      - runtime_status
      - bound_channels
      - updated_at
    properties:
      key: {type: string, maxLength: 30}
      name: {type: string, maxLength: 128}
      icon: {type: string, nullable: true}
      source: {type: string, enum: [builtin, upload]}
      builtin: {type: boolean}
      enabled: {type: boolean}
      active_version: {type: string, nullable: true, maxLength: 32}
      description: {type: string, nullable: true, maxLength: 1024}
      runtime_status: {$ref: '#/schemas/TaskPluginRuntimeStatus'}
      version:
        type: string
        description: 运行时生效版本；内置 factory 插件无 B-12 active 行时由快照补充。
      layer: {type: string, enum: [factory, override]}
      compile_error: {type: string}
      runtime_errors:
        type: array
        items: {$ref: '#/schemas/PluginIssue'}
      bound_channels:
        type: integer
        minimum: 0
        description: |
          绑定该插件的启用渠道数（实时计算，不落库）：channels.status=1 且
          task_plugin_key 命中或多绑 task_extend_plugin_keys 包含该 key。
          同一渠道同时命中两种形态时只计一次。
      updated_at: {type: string, format: date-time}

  TaskPluginPage:
    type: object
    additionalProperties: false
    required: [items, total, page, page_size]
    properties:
      items:
        type: array
        items: {$ref: '#/schemas/TaskPlugin'}
      total: {type: integer, minimum: 0}
      page: {type: integer, minimum: 1}
      page_size: {type: integer, minimum: 1, maximum: 100}

  TaskPluginVersion:
    type: object
    additionalProperties: false
    required: [id, key, version, api_version, source_hash, enabled, active, uploaded_by, created_at]
    properties:
      id: {type: string, format: uuid}
      key: {type: string}
      version: {type: string, maxLength: 32}
      api_version: {type: string, enum: [v1]}
      source_hash: {type: string, pattern: '^[0-9a-f]{64}$'}
      icon: {type: string, nullable: true}
      enabled: {type: boolean}
      active: {type: boolean}
      uploaded_by: {type: integer, format: int64}
      created_at: {type: string, format: date-time}

  TaskPluginVersionList:
    type: object
    additionalProperties: false
    required: [items, total]
    properties:
      items:
        type: array
        items: {$ref: '#/schemas/TaskPluginVersion'}
      total: {type: integer, minimum: 0}

  TaskPluginDetail:
    type: object
    additionalProperties: false
    required: [plugin, versions]
    properties:
      plugin: {$ref: '#/schemas/TaskPlugin'}
      versions:
        type: array
        items: {$ref: '#/schemas/TaskPluginVersion'}
      source_text:
        type: string
        description: 仅在 include_source=1 时返回；只读源查看器使用。
      source_version: {type: string}

  TaskPluginSourceText:
    type: object
    additionalProperties: false
    required: [key, version, source_hash, source_text]
    properties:
      key: {type: string}
      version: {type: string}
      source_hash: {type: string}
      source_text: {type: string}

  UploadTaskPluginRequest:
    type: object
    additionalProperties: false
    required: [source_text]
    properties:
      source_text:
        type: string
        description: 插件单文件源码；服务端计算 sha256 并编译校验。

  UploadTaskPluginResponse:
    type: object
    additionalProperties: false
    required: [created, plugin, version]
    properties:
      created: {type: boolean}
      plugin: {$ref: '#/schemas/TaskPlugin'}
      version: {$ref: '#/schemas/TaskPluginVersion'}

  PluginActivateRequest:
    type: object
    additionalProperties: false
    required: [version]
    properties:
      version: {type: string, maxLength: 32}
      expect_updated_at: {type: string, format: date-time, nullable: true}

  PluginActivateResponse:
    type: object
    additionalProperties: false
    required: [plugin, version]
    properties:
      plugin: {$ref: '#/schemas/TaskPlugin'}
      version: {$ref: '#/schemas/TaskPluginVersion'}

  PluginStatusRequest:
    type: object
    additionalProperties: false
    required: [enabled]
    properties:
      enabled: {type: boolean}
      expect_updated_at: {type: string, format: date-time, nullable: true}

  PluginStatusResponse:
    type: object
    additionalProperties: false
    required: [key, enabled, bound_channels, updated_at]
    properties:
      key: {type: string}
      enabled: {type: boolean}
      bound_channels: {type: integer}
      updated_at: {type: string, format: date-time}

  PluginVersionDeleteRequest:
    type: object
    additionalProperties: false
    properties:
      expect_updated_at: {type: string, format: date-time, nullable: true}

  PluginVersionDeleteResponse:
    type: object
    additionalProperties: false
    required: [key, deleted_version, promoted_version]
    properties:
      key: {type: string}
      deleted_version: {type: string}
      promoted_version: {type: string, description: 空串表示删除的不是 active 版本。}
      active_version: {type: string, nullable: true}
      updated_at: {type: string, format: date-time}

  PluginDryRunRequest:
    type: object
    additionalProperties: false
    required: [endpoint]
    properties:
      version: {type: string, description: 缺省使用当前生效层。}
      endpoint: {type: string, description: submit | query | result | submit_response }
      payload: {}
      allow_outbound:
        type: boolean
        default: false
        description: 出站执行器落地前，true 显式返回 422 dryrun_outbound_unavailable。

  PluginDryRunResult:
    type: object
    additionalProperties: false
    required: [key, version, endpoint, result, duration_ms]
    properties:
      key: {type: string}
      version: {type: string}
      endpoint: {type: string}
      result: {}
      duration_ms: {type: integer, format: int64}

  PluginRuntimePlugin:
    type: object
    additionalProperties: false
    required: [key, status]
    properties:
      key: {type: string}
      status: {$ref: '#/schemas/TaskPluginRuntimeStatus'}
      version: {type: string}
      layer: {type: string, enum: [factory, override]}
      errors:
        type: array
        items: {$ref: '#/schemas/PluginIssue'}

  PluginRuntimeStatus:
    type: object
    additionalProperties: false
    required: [node, generation, revision, reloaded_at, plugins]
    properties:
      node: {type: string}
      generation:
        type: integer
        format: int64
        description: 节点本地单调代际；跨节点比较必须用 revision。
      revision: {type: string}
      reloaded_at: {type: string, format: date-time}
      reload_error: {type: string}
      plugins:
        type: array
        items: {$ref: '#/schemas/PluginRuntimePlugin'}

  MarketplaceSource:
    type: object
    additionalProperties: false
    required: [id, name, url, enabled, last_check_status]
    properties:
      id: {type: string, format: uuid}
      name: {type: string, maxLength: 64}
      url: {type: string, format: uri, maxLength: 1024}
      enabled: {type: boolean}
      last_check_status: {type: string, enum: [pending, ok, failed]}
      last_check_at: {type: string, format: date-time, nullable: true}
      last_error: {type: string, nullable: true, maxLength: 512}
      error: {type: string, description: 本次聚合的分类摘要（不落库）。}

  MarketplaceSourceList:
    type: object
    additionalProperties: false
    required: [items, total]
    properties:
      items:
        type: array
        items: {$ref: '#/schemas/MarketplaceSource'}
      total: {type: integer}

  UpdateMarketplaceSourcesRequest:
    type: object
    additionalProperties: false
    required: [sources]
    properties:
      sources:
        type: array
        maxItems: 100
        items:
          type: object
          additionalProperties: false
          required: [name, url]
          properties:
            id: {type: string, description: 留空表示新源（按 URL 复用已有行）。}
            name: {type: string, maxLength: 64}
            url: {type: string, format: uri, maxLength: 1024}
            enabled: {type: boolean, default: true}

  MarketplaceVersion:
    type: object
    additionalProperties: false
    required: [version, api_version, source_url, source_hash, source_id, installed]
    properties:
      version: {type: string}
      api_version: {type: string, enum: [v1]}
      source_url: {type: string, format: uri}
      source_hash: {type: string, pattern: '^[0-9a-f]{64}$'}
      source_id: {type: string, format: uuid}
      installed: {type: boolean}
      conflict:
        type: boolean
        description: 多源同 key+version 但 hash 不同。

  MarketplacePlugin:
    type: object
    additionalProperties: false
    required: [key, name, description, latest_version, versions, installed, upgrade_available]
    properties:
      key: {type: string}
      name: {type: string}
      description: {type: string}
      icon_url: {type: string}
      latest_version: {type: string}
      versions:
        type: array
        items: {$ref: '#/schemas/MarketplaceVersion'}
      installed: {type: boolean}
      installed_version: {type: string}
      upgrade_available: {type: boolean}
      conflicts:
        type: array
        items: {type: string}

  MarketplaceHome:
    type: object
    additionalProperties: false
    required: [schema_version, plugins, sources, cached_at]
    properties:
      schema_version: {type: integer, enum: [1]}
      plugins:
        type: array
        items: {$ref: '#/schemas/MarketplacePlugin'}
      sources:
        type: array
        items: {$ref: '#/schemas/MarketplaceSource'}
      cached_at: {type: string, format: date-time}

  MarketplaceInstallRequest:
    type: object
    additionalProperties: false
    required: [source_id, key, version]
    properties:
      source_id: {type: string, format: uuid}
      key: {type: string, maxLength: 30}
      version: {type: string, maxLength: 32}
      activate:
        type: boolean
        default: false
        description: 默认不激活（R-M6D-07）。

  MarketplaceInstallResponse:
    type: object
    additionalProperties: false
    required: [installed, created, activated, source_id, key, version, plugin, version_row]
    properties:
      installed: {type: boolean}
      created: {type: boolean}
      activated: {type: boolean}
      source_id: {type: string}
      key: {type: string}
      version: {type: string}
      plugin: {$ref: '#/schemas/TaskPlugin'}
      version_row: {$ref: '#/schemas/TaskPluginVersion'}

  WebhookTestResult:
    type: object
    additionalProperties: false
    required: [ok, status_code]
    properties:
      ok:
        type: boolean
        description: 目标是否返回 2xx；3xx/4xx/5xx 均为 false。
      status_code:
        type: integer
        minimum: 0
        description: 目标 HTTP 状态码原样回传（3xx 不跟随）。
    description: POST /api/settings/test/webhook 的响应；测试样例非事件契约。

  WebhookResumeResult:
    type: object
    additionalProperties: false
    required: [paused]
    properties:
      paused:
        type: boolean
        description: 恢复后恒为 false（字段保留以便前端直接消费）。
    description: |
      POST /api/settings/notify-webhook:resume 的响应。恢复只清除运行时状态
      （`notify:webhook:paused` 与 `notify:webhook:fail_streak`），不修改任何
      settings 键，也不重排队列中的 queued 投递。

  # ---------------------------------------------------------------------------
  # 模型目录 / 供应商目录（modules-06 F-06-22～26；D1b）
  # ---------------------------------------------------------------------------
  SquareState:
    type: string
    enum: [hidden, visible, partial, unavailable]
    description: |
      广场态（派生字段，不落库）：status=2 ⇒ hidden；否则按 name_rule 与
      启用渠道 supported_models 匹配——覆盖全部启用用户分组 ⇒ visible，
      部分 ⇒ partial，无启用渠道 ⇒ unavailable。

  ModelMetaNameRule:
    type: integer
    enum: [0, 1, 2, 3]
    description: 0=精确 / 1=前缀 / 2=包含 / 3=后缀（与实际被路由的模型名匹配）。

  ModelMeta:
    type: object
    additionalProperties: false
    required:
      - id
      - model_name
      - tags
      - endpoints
      - capabilities
      - modalities
      - parameters
      - status
      - sync_official
      - name_rule
      - created_at
      - updated_at
      - square_state
      - configured_channel_count
      - enable_groups
    properties:
      id: {type: integer, format: int64}
      model_name:
        type: string
        pattern: '^[A-Za-z0-9._:/-]{1,128}$'
      display_name: {type: string, nullable: true, maxLength: 64}
      description: {type: string, nullable: true, maxLength: 512}
      icon:
        type: string
        nullable: true
        maxLength: 128
        description: 前端资源键（不是 URL）。
      tags:
        type: array
        maxItems: 10
        items: {type: string, maxLength: 32}
      vendor_id: {type: integer, format: int64, nullable: true, minimum: 1}
      endpoints:
        type: object
        additionalProperties:
          type: array
          minItems: 1
          items: {type: string, enum: [GET, POST, PUT, PATCH, DELETE]}
        description: 键必须以 / 开头。
      capabilities:
        type: array
        items:
          type: string
          enum: [text, vision, audio, video, function_calling, tool_use, reasoning, embedding, rerank, image_generation, speech, transcription]
      modalities:
        type: array
        items: {type: string, enum: [text, image, audio, video]}
      parameters:
        type: array
        items:
          type: object
          additionalProperties: true
          required: [name, type]
          properties:
            name: {type: string}
            type: {type: string, enum: [string, number, integer, boolean, array, object]}
      context_length: {type: integer, format: int64, nullable: true, minimum: 0}
      max_output: {type: integer, format: int64, nullable: true, minimum: 0}
      knowledge_cutoff:
        type: string
        nullable: true
        pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$'
        description: YYYY-MM。
      released_at: {type: string, format: date, nullable: true}
      status: {type: integer, enum: [1, 2]}
      sync_official:
        type: boolean
        description: false = 本地锁定，上游同步 preview 判 blocked 且永不覆盖。
      name_rule: {$ref: '#/schemas/ModelMetaNameRule'}
      created_at: {type: string, format: date-time}
      updated_at:
        type: string
        format: date-time
        description: 乐观锁版本；PUT / DELETE 必须原样回传。
      vendor_name:
        type: string
        nullable: true
        description: 派生字段（vendors.name）。
      square_state: {$ref: '#/schemas/SquareState'}
      configured_channel_count:
        type: integer
        format: int64
        description: 启用渠道中 supported_models 按 name_rule 命中该档案的 DISTINCT 渠道数。
      enable_groups:
        type: array
        items: {type: string}
        description: 派生字段：命中启用渠道的 group_tags 与启用用户分组的交集；NULL group_tags = 全部分组。

  ModelMetaList:
    allOf:
      - $ref: '../components/pagination.yaml#/schemas/Page'
      - type: object
        properties:
          items:
            type: array
            items: {$ref: '#/schemas/ModelMeta'}
    description: GET /api/models 的 offset 分页信封。

  ModelMetaSearchList:
    type: object
    additionalProperties: false
    required: [items]
    properties:
      items:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [id, model_name, status]
          properties:
            id: {type: integer, format: int64}
            model_name: {type: string}
            display_name: {type: string, nullable: true}
            status: {type: integer, enum: [1, 2]}

  ModelMetaCommonFields:
    type: object
    additionalProperties: false
    properties:
      display_name: {type: string, nullable: true, maxLength: 64}
      description: {type: string, nullable: true, maxLength: 512}
      icon: {type: string, nullable: true, maxLength: 128}
      tags:
        type: array
        maxItems: 10
        items: {type: string, maxLength: 32}
      vendor_id:
        type: integer
        format: int64
        nullable: true
        minimum: 1
        description: null = 未归属；不存在的 id ⇒ 422。
      endpoints:
        type: object
        additionalProperties:
          type: array
          minItems: 1
          items: {type: string, enum: [GET, POST, PUT, PATCH, DELETE]}
      capabilities:
        type: array
        items:
          type: string
          enum: [text, vision, audio, video, function_calling, tool_use, reasoning, embedding, rerank, image_generation, speech, transcription]
      modalities:
        type: array
        items: {type: string, enum: [text, image, audio, video]}
      parameters:
        type: array
        items:
          type: object
          additionalProperties: true
          required: [name, type]
          properties:
            name: {type: string}
            type: {type: string, enum: [string, number, integer, boolean, array, object]}
      context_length: {type: integer, format: int64, nullable: true, minimum: 0}
      max_output: {type: integer, format: int64, nullable: true, minimum: 0}
      knowledge_cutoff:
        type: string
        nullable: true
        pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$'
      released_at: {type: string, format: date, nullable: true}
      status: {type: integer, enum: [1, 2]}
      sync_official: {type: boolean}

  ModelMetaCreateRequest:
    allOf:
      - $ref: '#/schemas/ModelMetaCommonFields'
      - type: object
        required: [model_name]
        properties:
          model_name:
            type: string
            pattern: '^[A-Za-z0-9._:/-]{1,128}$'
          name_rule: {$ref: '#/schemas/ModelMetaNameRule'}

  ModelMetaUpdateRequest:
    allOf:
      - $ref: '#/schemas/ModelMetaCommonFields'
      - type: object
        required: [updated_at]
        properties:
          model_name:
            type: string
            pattern: '^[A-Za-z0-9._:/-]{1,128}$'
          name_rule: {$ref: '#/schemas/ModelMetaNameRule'}
          updated_at: {type: string, format: date-time}

  ModelMetaBatchDeleteRequest:
    type: object
    additionalProperties: false
    required: [ids]
    properties:
      ids:
        type: array
        minItems: 1
        maxItems: 1000
        items: {type: integer, format: int64, minimum: 1}
      remove_from_channels:
        type: boolean
        default: false
        description: 只对 name_rule=0 的档案生效；会让渠道变空时整体 422。
      clear_pricing:
        type: boolean
        default: false
        description: 额外要求 pricing:manage，否则 403。

  ModelMetaBatchDeleteResponse:
    type: object
    additionalProperties: false
    required: [requested, deleted, channels_updated, pricing_deleted, group_pricing_deleted]
    properties:
      requested: {type: integer, format: int64, description: 去重后的选择集大小。}
      deleted: {type: integer, format: int64, description: 实际命中的档案数。}
      channels_updated: {type: integer, format: int64}
      pricing_deleted: {type: integer, format: int64}
      group_pricing_deleted: {type: integer, format: int64}

  ModelMissing:
    type: object
    additionalProperties: false
    required: [model_name, channel_count, has_pricing]
    properties:
      model_name: {type: string}
      channel_count:
        type: integer
        format: int64
        description: 支持该模型的启用渠道数（跳过含非法 supported_models 元素的渠道）。
      has_pricing:
        type: boolean
        description: model_pricing 中已有同名行（不区分启停）。

  ModelMissingList:
    type: object
    additionalProperties: false
    required: [items, skipped_channels, total]
    properties:
      items:
        type: array
        items: {$ref: '#/schemas/ModelMissing'}
      skipped_channels:
        type: integer
        format: int64
        description: 因 supported_models 含非法元素而整渠道跳过的启用渠道数。
      total: {type: integer, format: int64}

  ModelSyncFieldChange:
    type: object
    additionalProperties: false
    required: [local, upstream]
    properties:
      local: {description: 本地值（可能为 null）。}
      upstream: {description: 上游值（可能为 null）。}

  ModelSyncModelCandidate:
    type: object
    additionalProperties: false
    required: [model_name]
    properties:
      model_name: {type: string}
      changes:
        type: object
        additionalProperties: {$ref: '#/schemas/ModelSyncFieldChange'}
        description: 仅 update 组提供；只为上游清单提供的字段计算差异。

  ModelSyncVendorCandidate:
    type: object
    additionalProperties: false
    required: [name]
    properties:
      name: {type: string}
      changes:
        type: object
        additionalProperties: {$ref: '#/schemas/ModelSyncFieldChange'}

  ModelSyncVendorGroups:
    type: object
    additionalProperties: false
    required: [create, update, unchanged]
    properties:
      create: {type: array, items: {type: string}}
      update: {type: array, items: {$ref: '#/schemas/ModelSyncVendorCandidate'}}
      unchanged: {type: array, items: {type: string}}

  ModelSyncPreview:
    type: object
    additionalProperties: false
    required: [source_version, groups]
    properties:
      source_version:
        type: string
        description: 上游清单原文的 sha256（hex）；apply 必须原样回传。
      groups:
        type: object
        additionalProperties: false
        required: [create, update, unchanged, blocked, missing_upstream, missing_vendor, vendors]
        properties:
          create: {type: array, items: {$ref: '#/schemas/ModelSyncModelCandidate'}}
          update: {type: array, items: {$ref: '#/schemas/ModelSyncModelCandidate'}}
          unchanged: {type: array, items: {type: string}}
          blocked:
            type: array
            items: {type: string}
            description: 本地 sync_official=false，apply 永不覆盖。
          missing_upstream:
            type: array
            items: {type: string}
            description: 本地有、上游清单无。
          missing_vendor:
            type: array
            items: {type: string}
            description: 本地 vendor_id 指向不存在的供应商（逻辑引用无 FK）。
          vendors: {$ref: '#/schemas/ModelSyncVendorGroups'}

  ModelSyncManifestModel:
    type: object
    additionalProperties: false
    required: [model_name]
    properties:
      model_name: {type: string}
      display_name: {type: string, nullable: true}
      description: {type: string, nullable: true}
      icon: {type: string, nullable: true}
      tags: {type: array, items: {type: string}}
      capabilities: {type: array, items: {type: string}}
      context_length: {type: integer, format: int64, nullable: true}
      max_output: {type: integer, format: int64, nullable: true}

  ModelSyncManifestVendor:
    type: object
    additionalProperties: false
    required: [name]
    properties:
      name: {type: string}
      description: {type: string, nullable: true}
      icon: {type: string, nullable: true}

  ModelSyncApplyRequest:
    type: object
    additionalProperties: false
    required: [source_version]
    properties:
      source_version: {type: string}
      models:
        type: array
        items: {$ref: '#/schemas/ModelSyncManifestModel'}
        description: 只用于选择；写入值取自服务端缓存的清单。
      vendors:
        type: array
        items: {$ref: '#/schemas/ModelSyncManifestVendor'}

  ModelSyncApplyResponse:
    type: object
    additionalProperties: false
    required: [source_version, created_models, updated_models, created_vendors, updated_vendors]
    properties:
      source_version: {type: string}
      created_models: {type: array, items: {type: string}}
      updated_models: {type: array, items: {type: string}}
      created_vendors: {type: array, items: {type: string}}
      updated_vendors: {type: array, items: {type: string}}

  Vendor:
    type: object
    additionalProperties: false
    required: [id, name, status, created_at, updated_at, model_count, version]
    properties:
      id: {type: integer, format: int64}
      name: {type: string, maxLength: 128}
      description: {type: string, nullable: true, maxLength: 512}
      icon: {type: string, nullable: true, maxLength: 128}
      status: {type: integer, enum: [1, 2]}
      created_at: {type: string, format: date-time}
      updated_at: {type: string, format: date-time}
      model_count:
        type: integer
        format: int64
        description: 引用该供应商的档案数（含停用模型）。
      version:
        type: string
        description: 7 列规范化后的 sha256 派生值（不落库）；PUT 必须原样回传。

  VendorList:
    allOf:
      - $ref: '../components/pagination.yaml#/schemas/Page'
      - type: object
        properties:
          items:
            type: array
            items: {$ref: '#/schemas/Vendor'}
    description: GET /api/vendors 的 offset 分页信封。

  VendorSearchList:
    type: object
    additionalProperties: false
    required: [items]
    properties:
      items:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [id, name, status]
          properties:
            id: {type: integer, format: int64}
            name: {type: string}
            status: {type: integer, enum: [1, 2]}

  VendorCreateRequest:
    type: object
    additionalProperties: false
    required: [name]
    properties:
      name: {type: string, minLength: 1, maxLength: 128}
      description: {type: string, nullable: true, maxLength: 512}
      icon: {type: string, nullable: true, maxLength: 128}
      status: {type: integer, enum: [1, 2], default: 1}

  VendorUpdateRequest:
    type: object
    additionalProperties: false
    required: [version]
    properties:
      name: {type: string, minLength: 1, maxLength: 128}
      description: {type: string, nullable: true, maxLength: 512}
      icon: {type: string, nullable: true, maxLength: 128}
      status: {type: integer, enum: [1, 2]}
      version: {type: string}

  VendorOperationRequest:
    type: object
    additionalProperties: false
    required: [action]
    properties:
      action:
        type: string
        enum: [assign, merge, delete]
      model_ids:
        type: array
        maxItems: 1000
        items: {type: integer, format: int64, minimum: 1}
        description: assign 使用。
      vendor_ids:
        type: array
        maxItems: 1000
        items: {type: integer, format: int64, minimum: 1}
        description: merge / delete 使用。
      target_vendor_id:
        type: integer
        format: int64
        minimum: 0
        description: assign 的 0 = 清空归属。
      expected_version:
        type: string
        description: preview 返回的操作指纹；apply 必填，缺失亦视为冲突。

  VendorOperationConflict:
    type: object
    additionalProperties: false
    required: [vendor_id, current_version]
    properties:
      vendor_id: {type: integer, format: int64}
      current_version: {type: string}

  VendorOperationPreview:
    type: object
    additionalProperties: false
    required: [action, affected, conflict, conflicts, expected_version, vendors]
    properties:
      action: {type: string, enum: [assign, merge, delete]}
      affected: {type: integer, format: int64}
      conflict: {type: boolean}
      conflicts:
        type: array
        items: {$ref: '#/schemas/VendorOperationConflict'}
      expected_version: {type: string}
      vendors:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [vendor_id, version]
          properties:
            vendor_id: {type: integer, format: int64}
            version: {type: string}

  VendorOperationResult:
    type: object
    additionalProperties: false
    required: [affected]
    properties:
      affected: {type: integer, format: int64}

  # ---------------------------------------------------------------------------
  # 性能管理（modules-08 §3.19 / F-08-48～F-08-50；D3a）。
  # 只含计数/字节/耗时/时间戳与部署配置回显；不含文件内容。
  # ---------------------------------------------------------------------------
  PerformanceCacheStats:
    type: object
    additionalProperties: false
    required: [enabled, file_count, total_bytes, last_cleared_at]
    properties:
      enabled:
        type: boolean
        description: 生效态（DISK_CACHE_ENABLED 且目录可读）；目录缺失/不可读为 false。
      file_count: {type: integer, minimum: 0}
      total_bytes: {type: integer, format: int64, minimum: 0}
      last_cleared_at:
        type: string
        format: date-time
        nullable: true
        description: 本进程最近一次清理完成时间；从未清理或进程重启后为 null。

  PerformanceMemoryStats:
    type: object
    additionalProperties: false
    required: [alloc_bytes, sys_bytes, num_gc, num_goroutine]
    properties:
      alloc_bytes: {type: integer, format: int64, minimum: 0}
      sys_bytes: {type: integer, format: int64, minimum: 0}
      num_gc: {type: integer, format: int64, minimum: 0}
      num_goroutine: {type: integer, minimum: 0}

  PerformanceDiskCacheInfo:
    type: object
    additionalProperties: false
    required: [path, file_count, total_bytes, last_modified]
    properties:
      path:
        type: string
        description: 目录缺失/不可读时为空串（零值）。
      file_count: {type: integer, minimum: 0}
      total_bytes: {type: integer, format: int64, minimum: 0}
      last_modified:
        type: string
        format: date-time
        nullable: true
        description: 目录内最新 mtime；无文件时为 null。

  PerformanceDiskSpaceInfo:
    type: object
    additionalProperties: false
    required: [total_bytes, free_bytes, used_bytes]
    properties:
      total_bytes: {type: integer, format: int64, minimum: 0}
      free_bytes:
        type: integer
        format: int64
        minimum: 0
        description: 非特权进程可用空间（statfs Bavail）。
      used_bytes: {type: integer, format: int64, minimum: 0}

  PerformanceConfig:
    type: object
    additionalProperties: false
    required: [enabled, path, max_mb, threshold_mb]
    properties:
      enabled:
        type: boolean
        description: 回显 DISK_CACHE_ENABLED 原值（不因目录缺失而改变）。
      path: {type: string}
      max_mb: {type: integer, format: int64, minimum: 0}
      threshold_mb: {type: integer, format: int64, minimum: 0}

  PerformanceStats:
    type: object
    additionalProperties: false
    required: [instance_id, cache_stats, memory_stats, disk_cache_info, disk_space_info, config]
    properties:
      instance_id: {type: string}
      cache_stats: {$ref: '#/schemas/PerformanceCacheStats'}
      memory_stats: {$ref: '#/schemas/PerformanceMemoryStats'}
      disk_cache_info: {$ref: '#/schemas/PerformanceDiskCacheInfo'}
      disk_space_info: {$ref: '#/schemas/PerformanceDiskSpaceInfo'}
      config: {$ref: '#/schemas/PerformanceConfig'}

  PerformanceDiskCacheClearResult:
    type: object
    additionalProperties: false
    required: [instance_id, deleted_count, freed_bytes, failed_files]
    properties:
      instance_id: {type: string}
      deleted_count: {type: integer, minimum: 0}
      freed_bytes: {type: integer, format: int64, minimum: 0}
      failed_files:
        type: array
        description: 删除失败的普通文件名（不含路径）。
        items: {type: string}

  PerformanceGCRequest:
    type: object
    additionalProperties: false
    properties:
      instance_id:
        type: string
        description: 目标实例标识；与当前实例不一致 → 409 instance_mismatch。

  PerformanceGCResult:
    type: object
    additionalProperties: false
    required:
      - instance_id
      - duration_ms
      - heap_alloc_before
      - heap_alloc_after
      - num_gc_before
      - num_gc_after
    properties:
      instance_id: {type: string}
      duration_ms: {type: integer, format: int64, minimum: 0}
      heap_alloc_before: {type: integer, format: int64, minimum: 0}
      heap_alloc_after: {type: integer, format: int64, minimum: 0}
      num_gc_before: {type: integer, format: int64, minimum: 0}
      num_gc_after: {type: integer, format: int64, minimum: 0}

  PerformanceLogFile:
    type: object
    additionalProperties: false
    required: [name, size, mod_time]
    properties:
      name: {type: string}
      size: {type: integer, format: int64, minimum: 0}
      mod_time: {type: string, format: date-time}

  PerformanceLogs:
    type: object
    additionalProperties: false
    required: [enabled, log_dir, file_count, total_size, oldest_time, newest_time, files]
    properties:
      enabled:
        type: boolean
        description: false 表示 LOG_DIR 未配置（生产默认 stdout）。
      log_dir: {type: string}
      file_count: {type: integer, minimum: 0}
      total_size: {type: integer, format: int64, minimum: 0}
      oldest_time:
        type: string
        format: date-time
        nullable: true
      newest_time:
        type: string
        format: date-time
        nullable: true
      files:
        type: array
        items: {$ref: '#/schemas/PerformanceLogFile'}

  PerformanceLogCleanupResult:
    type: object
    additionalProperties: false
    required: [instance_id, mode, value, deleted_count, freed_bytes, skipped_active, failed_files]
    properties:
      instance_id: {type: string}
      mode: {type: string, enum: [by_count, by_days]}
      value: {type: integer, minimum: 1, maximum: 36500}
      deleted_count: {type: integer, minimum: 0}
      freed_bytes: {type: integer, format: int64, minimum: 0}
      skipped_active:
        type: boolean
        description: 活动日志文件（最新 mtime）命中删除集并被跳过时为 true。
      failed_files:
        type: array
        items: {type: string}

  PerformanceRecentOperation:
    type: object
    additionalProperties: false
    required:
      - time
      - actor
      - action
      - route
      - result
      - instance_id
      - deleted_count
      - freed_bytes
      - failed_count
      - duration_ms
      - skipped_active
    properties:
      time: {type: string, format: date-time}
      actor:
        type: string
        description: 审计既有 username 快照（未解析时为 user#<id>）。
      action:
        type: string
        enum: [system.disk_cache.clear, system.gc.run, system.log_cleanup.run]
      route: {type: string}
      result: {type: string, enum: [success, failed]}
      instance_id: {type: string}
      mode:
        type: string
        enum: [by_count, by_days]
        description: 仅 system.log_cleanup.run 行返回；其余操作省略该字段。
      value:
        type: integer
        minimum: 1
        maximum: 36500
        description: 仅 system.log_cleanup.run 行返回清理参数；其余操作省略该字段。
      deleted_count: {type: integer, format: int64, minimum: 0}
      freed_bytes: {type: integer, format: int64, minimum: 0}
      failed_count: {type: integer, format: int64, minimum: 0}
      duration_ms: {type: integer, format: int64, minimum: 0}
      skipped_active: {type: boolean}

  PerformanceRecentOperations:
    type: object
    additionalProperties: false
    required: [items]
    properties:
      items:
        type: array
        items: {$ref: '#/schemas/PerformanceRecentOperation'}

  # ---------------------------------------------------------------------------
  # 订阅套餐（D5b；billing-08 §2.1 / §15.1）
  # ---------------------------------------------------------------------------

  SubscriptionPlan:
    type: object
    additionalProperties: false
    required:
      - id
      - plan_key
      - title
      - period_days
      - price_amount
      - currency
      - grant_credits
      - reset_on_renew
      - allow_wallet_overflow
      - grace_days
      - status
      - sort_order
      - created_at
      - updated_at
    properties:
      id: {type: integer, format: int64}
      plan_key:
        type: string
        pattern: '^[a-z0-9][a-z0-9-]{0,63}$'
        description: 稳定外部标识；改名不改键
      title: {type: string, minLength: 1, maxLength: 64}
      description: {type: string, maxLength: 255, nullable: true}
      period_days: {type: integer, minimum: 1}
      price_amount:
        type: integer
        format: int64
        minimum: 0
        description: 最小货币单位整数（与 orders.amount 同口径）
      currency: {type: string, enum: [CNY]}
      grant_credits:
        type: integer
        format: int64
        minimum: 0
        description: 每周期内含额度；0 表示无限
      reset_on_renew: {type: boolean}
      allow_wallet_overflow:
        type: boolean
        description: 订阅额度用尽后是否允许回落钱包（内部开关，用户侧不返回）
      model_scope:
        type: array
        nullable: true
        description: 模型白名单；null = 全部模型；[] = 无任何模型可用
        items: {type: string, minLength: 1, maxLength: 128}
        uniqueItems: true
      concurrency_limit: {type: integer, minimum: 1, nullable: true}
      grace_days: {type: integer, minimum: 0}
      status: {type: string, enum: [enabled, disabled]}
      sort_order: {type: integer}
      created_at: {type: string, format: date-time}
      updated_at: {type: string, format: date-time}

  SubscriptionPlanList:
    type: object
    additionalProperties: false
    required: [items, total, page, page_size]
    properties:
      items:
        type: array
        items: {$ref: '#/schemas/SubscriptionPlan'}
      total: {type: integer, minimum: 0}
      page: {type: integer, minimum: 1}
      page_size: {type: integer, minimum: 1, maximum: 100}

  SubscriptionPlanInput:
    type: object
    additionalProperties: false
    required: [plan_key, title, period_days, price_amount, currency, grant_credits]
    properties:
      plan_key:
        type: string
        pattern: '^[a-z0-9][a-z0-9-]{0,63}$'
      title: {type: string, minLength: 1, maxLength: 64}
      description: {type: string, maxLength: 255, nullable: true}
      period_days: {type: integer, minimum: 1}
      price_amount: {type: integer, format: int64, minimum: 0}
      currency: {type: string, enum: [CNY]}
      grant_credits: {type: integer, format: int64, minimum: 0}
      reset_on_renew: {type: boolean, default: true}
      allow_wallet_overflow: {type: boolean, default: true}
      model_scope:
        type: array
        nullable: true
        items: {type: string, minLength: 1, maxLength: 128}
        uniqueItems: true
      concurrency_limit: {type: integer, minimum: 1, nullable: true}
      grace_days: {type: integer, minimum: 0, default: 0}
      status: {type: string, enum: [enabled, disabled], default: enabled}
      sort_order: {type: integer, default: 0}

  SubscriptionPlanResetQuotaRequest:
    type: object
    additionalProperties: false
    properties:
      advance_next_reset:
        type: boolean
        default: false
        description: true 时同步推进 next_reset_at 一个周期，避免与 B12 双倍重置

  SubscriptionPlanResetQuotaResult:
    type: object
    additionalProperties: false
    required: [affected]
    properties:
      affected: {type: integer, format: int64, minimum: 0}

  AdminSubscription:
    type: object
    additionalProperties: false
    required:
      - id
      - user_id
      - plan_id
      - plan_title_snapshot
      - status
      - start_at
      - end_at
      - amount_total
      - amount_used
      - auto_renew
      - cancel_at_period_end
      - period_days
      - grace_days
      - allow_wallet_overflow
      - currency
      - price_paid_amount
      - created_at
      - updated_at
    properties:
      id: {type: integer, format: int64}
      user_id: {type: integer, format: int64}
      plan_id: {type: integer, format: int64}
      plan_title_snapshot: {type: string}
      status: {type: string, enum: [active, expired, cancelled]}
      start_at: {type: string, format: date-time}
      end_at: {type: string, format: date-time}
      next_reset_at: {type: string, format: date-time, nullable: true}
      amount_total:
        type: integer
        format: int64
        minimum: 0
        description: 0 表示无限额度
      amount_used: {type: integer, format: int64, minimum: 0}
      amount_remain:
        type: integer
        format: int64
        minimum: 0
        description: amount_total>0 时返回；无限额度时省略
      auto_renew: {type: boolean}
      cancel_at_period_end: {type: boolean}
      period_days: {type: integer, minimum: 1}
      grace_days: {type: integer, minimum: 0}
      model_scope:
        type: array
        nullable: true
        items: {type: string}
      concurrency_limit: {type: integer, minimum: 1, nullable: true}
      allow_wallet_overflow: {type: boolean}
      order_id: {type: integer, format: int64, nullable: true}
      currency: {type: string}
      price_paid_amount: {type: integer, format: int64, minimum: 0}
      created_at: {type: string, format: date-time}
      updated_at: {type: string, format: date-time}

  AdminSubscriptionList:
    type: object
    additionalProperties: false
    required: [items, total, page, page_size]
    properties:
      items:
        type: array
        items: {$ref: '#/schemas/AdminSubscription'}
      total: {type: integer, minimum: 0}
      page: {type: integer, minimum: 1}
      page_size: {type: integer, minimum: 1, maximum: 100}

  # 站点公告（D7a；modules-08 F-08-04 / R-D7-01）。
  AnnouncementCategory:
    type: string
    enum: [notice, maintenance, release]

  AnnouncementStatus:
    type: string
    description: DB 状态只有三值；expired 是虚拟态，不落库（R-D7-10）。
    enum: [draft, published, offline]

  AnnouncementDisplayStatus:
    type: string
    description: UI 徽章状态；expired = status=published 且 expire_at<=now。
    enum: [draft, published, expired, offline]

  AnnouncementSummary:
    type: object
    additionalProperties: false
    required: [id, title, category, status, display_status, publish_at,
               created_by, updated_by, created_at, updated_at]
    properties:
      id: {type: string, format: uuid}
      title: {type: string, minLength: 1, maxLength: 80}
      category: {$ref: '#/schemas/AnnouncementCategory'}
      status: {$ref: '#/schemas/AnnouncementStatus'}
      display_status: {$ref: '#/schemas/AnnouncementDisplayStatus'}
      publish_at:
        type: string
        format: date-time
        description: 生效时间（可预排未来）。
      expire_at:
        type: string
        format: date-time
        nullable: true
        description: null = 永久有效；必须晚于 publish_at。
      published_at:
        type: string
        format: date-time
        nullable: true
        description: 实际点击发布的时刻；编辑已发布公告不重写（N-35）。
      offline_at:
        type: string
        format: date-time
        nullable: true
      created_by: {type: integer, format: int64}
      updated_by: {type: integer, format: int64}
      created_at: {type: string, format: date-time}
      updated_at: {type: string, format: date-time}

  AnnouncementDetail:
    type: object
    additionalProperties: false
    required: [id, title, category, status, display_status, publish_at,
               created_by, updated_by, created_at, updated_at,
               content_markdown, content_html]
    properties:
      id: {type: string, format: uuid}
      title: {type: string, minLength: 1, maxLength: 80}
      category: {$ref: '#/schemas/AnnouncementCategory'}
      status: {$ref: '#/schemas/AnnouncementStatus'}
      display_status: {$ref: '#/schemas/AnnouncementDisplayStatus'}
      publish_at: {type: string, format: date-time}
      expire_at:
        type: string
        format: date-time
        nullable: true
      published_at:
        type: string
        format: date-time
        nullable: true
      offline_at:
        type: string
        format: date-time
        nullable: true
      created_by: {type: integer, format: int64}
      updated_by: {type: integer, format: int64}
      created_at: {type: string, format: date-time}
      updated_at: {type: string, format: date-time}
      content_markdown:
        type: string
        maxLength: 16384
        description: Markdown 原文（≤16384，按 UTF-8 字节计，不是字符数）。
      content_html:
        type: string
        description: |
          服务端净化后的 HTML 片段：原始 HTML 不解析（`<script>`/`<img
          onerror>` 只会以文本出现），链接仅 http(s) 且强制
          rel="noopener noreferrer"（R-D7-04）。

  AnnouncementList:
    type: object
    additionalProperties: false
    required: [items, total, page, page_size]
    properties:
      items:
        type: array
        items: {$ref: '#/schemas/AnnouncementSummary'}
      total: {type: integer, minimum: 0}
      page: {type: integer, minimum: 1}
      page_size: {type: integer, minimum: 1, maximum: 100}

  AnnouncementWriteInput:
    type: object
    additionalProperties: false
    required: [title, content]
    properties:
      title: {type: string, minLength: 1, maxLength: 80}
      category:
        allOf:
          - $ref: '#/schemas/AnnouncementCategory'
        description: 省略时默认 notice。
      content:
        type: string
        minLength: 1
        maxLength: 16384
        description: Markdown 原文（≤16384，按 UTF-8 字节计）；渲染期净化（R-D7-04）。
      publish_at:
        type: string
        format: date-time
        description: 省略时创建取 now()、编辑保留原值；编辑已发布公告时忽略。
      expire_at:
        type: string
        format: date-time
        nullable: true
        description: null/省略 = 永久有效；必须晚于生效时间。
      publish_now:
        type: boolean
        default: false
        description: |
          true = 在同一事务内写入并发布（draft/offline → published）；
          校验或发布失败整体回滚并返回 422（R-D7-06 组合路径）。

  # 逐副本实例心跳（modules-08 §3.7 F-08-21）。字段冻结为六个；地址、端口、
  # 密钥等连接信息永不返回。
  InstanceSummary:
    type: object
    additionalProperties: false
    required: [instance_id, status, role, version, started_at, last_seen]
    properties:
      instance_id:
        type: string
        description: INSTANCE_ID，缺省为进程主机名。
      status:
        type: string
        description: 心跳写入时的状态（当前恒为 active）；过期条目由 TTL 移除。
      role:
        type: string
        enum: [gateway, worker]
      version: {type: string}
      started_at: {type: string, format: date-time}
      last_seen: {type: string, format: date-time}

  InstanceList:
    type: object
    additionalProperties: false
    required: [items, current_instance_id]
    properties:
      items:
        type: array
        items:
          $ref: '#/schemas/InstanceSummary'
      current_instance_id:
        type: string
        description: 处理本次请求的实例标识；即使它没有心跳也会出现在 items 中。

  # ---------------------------------------------------------------------------
  # 通用设置面（GET/PUT /api/settings?section=）—— 设置注册表的 HTTP 投影。
  # 键的集合、类型、默认值与危险标记以服务端注册表为唯一真源；本 schema
  # 只描述线格式，不重复枚举具体键。
  # ---------------------------------------------------------------------------
  SettingsItem:
    type: object
    additionalProperties: false
    required: [key, value, type, default, public, secret, dangerous]
    description: |
      注册表中的一项。`value` 为 null 表示该键尚未落库（使用 `default`）。
      秘密项（`secret=true`）的 `value` 恒为掩码（配置后）或 null，明文永不回传。
    properties:
      key: {type: string}
      value:
        description: 当前生效值；secret 项为掩码；未落库时为 null。
      type:
        type: string
        enum: [bool, string, int, number, enum, list, object]
      default:
        description: 注册表默认值（不因用户修改而变化）。
      public:
        type: boolean
        description: 是否可经公开接口下发。
      secret:
        type: boolean
      dangerous:
        type: boolean
      danger_direction:
        type: string
        enum: ['', 'on', 'off', 'any']
        description: |
          危险项的风险方向；非危险项为空串。`any` 表示任意变更（含密钥替换）
          都需要二次确认。
      locked:
        type: boolean
        description: 服务端只读项（管理面不可修改）。

  SettingsSection:
    type: object
    additionalProperties: false
    required: [section, updated_at, items]
    properties:
      section: {type: string}
      updated_at:
        type: string
        format: date-time
        nullable: true
        description: section 内各键 `updated_at` 的最大值；从未写入时为 null。
      items:
        type: array
        items:
          $ref: '#/schemas/SettingsItem'

  SettingsUpdateRequest:
    type: object
    additionalProperties: false
    required: [values]
    description: |
      只提交**变更**的键（部分更新）。秘密项：缺省 = 不修改；null = 显式清除；
      字符串 = 替换为新值。`values` 必填（`{}` 表示空更新）。
      `expect_updated_at` 是乐观锁：与当前值不一致返回 409。
      命中危险方向时需要 `dangerous_confirmed=true`，否则返回 400。
    properties:
      section:
        type: string
        description: 可选；若提供必须与 query 的 section 一致，否则 400。
      values:
        type: object
        additionalProperties: true
      expect_updated_at:
        type: string
        format: date-time
        nullable: true
      dangerous_confirmed:
        type: boolean

  SettingsUpdateResponse:
    type: object
    additionalProperties: false
    required: [section, updated_at, values]
    properties:
      section: {type: string}
      updated_at:
        type: string
        format: date-time
        nullable: true
      values:
        type: object
        additionalProperties: true
        description: 本次实际写入的键与归一化后的值。
