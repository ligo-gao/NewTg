# 管理域 DTO（modules-07 用户与权限管理、分组）。
# 管理端点仅接受会话 Cookie：Bearer 令牌没有角色/权限语义（auth.SessionAuth
# 只注入 UserID+TokenID），RBAC 会对令牌请求 fail-closed。因此 paths 中这些
# operation 只声明 sessionCookie。
schemas:
  # M0 占位：渠道在模块 06 实现，schema 随 M6 细化（密钥字段永不回显）。
  Channel:
    type: object
    additionalProperties: true
    description: 上游渠道 DTO 占位（密钥字段永不回显；schema 待 M6 细化）
    x-newtg-pending: true

  AdminUser:
    type: object
    additionalProperties: false
    required:
      - id
      - username
      - role
      - status
      - balance
      - group
      - admin_permissions
      - totp_enabled
      - must_change_password
      - token_count
      - created_at
      - updated_at
    description: |
      管理面用户投影。永不含口令哈希、TOTP 种子或备用码。admin_permissions
      为 null 表示 FULL（数据库 NULL）；空数组表示明确无任何权限——两者语义
      不同，客户端不得把 [] 当 null。
    properties:
      id:
        type: integer
        format: int64
      username:
        type: string
      display_name:
        type: string
        maxLength: 32
        nullable: true
      email:
        type: string
        format: email
        nullable: true
        description: 管理员创建的用户可为 null（不绑定邮箱）。
      role:
        $ref: './public.yaml#/schemas/UserRole'
      status:
        $ref: './public.yaml#/schemas/UserStatus'
      balance:
        type: integer
        format: int64
        description: 当前余额（credits 最小单位）。
      group:
        type: string
      admin_permissions:
        type: array
        items:
          $ref: '#/schemas/PermissionGrant'
        nullable: true
        description: |
          权限矩阵。null = FULL（数据库 NULL）；["*"] 是 FULL 的显式形态；
          空数组 = 明确无任何权限。两者语义不同，客户端不得混用。
      totp_enabled:
        type: boolean
      must_change_password:
        type: boolean
      remark:
        type: string
        maxLength: 255
        nullable: true
      token_count:
        type: integer
        format: int64
      created_at:
        type: string
        format: date-time
      updated_at:
        type: string
        format: date-time
        description: 乐观锁版本；PATCH 必须原样回传。

  PermissionKey:
    type: string
    enum:
      - users:read
      - users:create
      - users:update
      - users:disable
      - users:delete
      - users:adjust-quota
      - users:manage-roles
      - users:reset-security
      - groups:manage
      - channels:read
      - channels:manage
      - channels:manage_sensitive
      - pricing:read
      - pricing:manage
      - redemption:manage
      - orders:read
      - orders:manage
      - logs:read
      - log.prompt.view
      - settings:manage
    description: |
      modules-07 F-07-08 的 20 键冻结目录（order 与文档表格一致）。
      通配符 "*" 单独建模为 PermissionGrant，不放宽本枚举。

  PermissionGrant:
    oneOf:
      - $ref: '#/schemas/PermissionKey'
      - type: string
        enum: ['*']
    description: 权限矩阵成员：20 键之一或全权通配符 "*"。

  AdminUserList:
    allOf:
      - $ref: '../components/pagination.yaml#/schemas/Page'
      - type: object
        properties:
          items:
            type: array
            items:
              $ref: '#/schemas/AdminUser'
    description: GET /api/users 的 offset 分页信封。

  AdminCreateUserRequest:
    type: object
    additionalProperties: false
    required: [username, password]
    properties:
      username:
        type: string
        pattern: '^[a-zA-Z0-9_-]{3,32}$'
      display_name:
        type: string
        maxLength: 32
        nullable: true
      role:
        $ref: './public.yaml#/schemas/UserRole'
        description: 缺省 user。创建 admin 需要执行者同时持有 users:manage-roles 与默认权限集的超集。
      group:
        type: string
        description: 缺省 default。
      password:
        type: string
        minLength: 8
        maxLength: 128
      remark:
        type: string
        maxLength: 255
        nullable: true
    description: |
      必须携带 Idempotency-Key；同键重放只创建一条。请求体没有 email 字段：
      管理员创建的用户 email 为 NULL。用户名冲突 409。
    # 注意：role 缺省时不能写成 required，但 description 说明默认值。

  AdminUpdateUserRequest:
    type: object
    additionalProperties: false
    required: [updated_at]
    description: |
      部分更新。不含口令字段：提交 password 返回 400（用
      POST /api/users/{id}/reset-password）。未知字段 403 field_not_writable。
      role 变更会吊销该用户全部会话；不能修改自己的角色/状态/权限（400）。
    properties:
      display_name:
        type: string
        maxLength: 32
        nullable: true
      group:
        type: string
      remark:
        type: string
        maxLength: 255
        nullable: true
      role:
        $ref: './public.yaml#/schemas/UserRole'
      updated_at:
        type: string
        format: date-time

  AdminUserStatusRequest:
    type: object
    additionalProperties: false
    required: [status]
    properties:
      status:
        $ref: './public.yaml#/schemas/UserStatus'
    description: |
      封禁在同一事务内吊销全部会话并把令牌置 disabled；解禁不自动恢复令牌。
      不能封禁自己（400）。

  AdminUserStatusResponse:
    type: object
    additionalProperties: false
    required: [id, status]
    properties:
      id:
        type: integer
        format: int64
      status:
        $ref: './public.yaml#/schemas/UserStatus'

  QuotaAdjustmentRequest:
    type: object
    additionalProperties: false
    required: [mode, amount, idempotency_key]
    properties:
      mode:
        type: string
        enum: [add, subtract, override]
      amount:
        type: integer
        format: int64
        description: |
          add/subtract 为增量，必须 ≥1（handler 对 0 返回 400：零增量没有业务
          意义，且会污染流水）；override 为目标余额，允许 0。三种 mode 共用本
          schema，条件下限写在 schema 级 not/anyOf 中，而不是给 amount 加
          无条件 minimum（否则合法的 override=0 会被误判非法）。
      idempotency_key:
        type: string
        minLength: 1
        description: 必填业务幂等键；与 HTTP Idempotency-Key 不同，写入交易流水。
    # 条件下限：add/subtract 禁止 amount≤0，override 禁止 amount<0。
    # 用 not+anyOf 表达 if/then 的等价约束——kin-openapi v0.131.0（仓内
    # validate 门禁）不接受 if/then/else 作为 schema 兄弟字段；这种写法不改变
    # 生成的对象类型（oapi-codegen/openapi-typescript 均忽略 not）。
    not:
      anyOf:
        - properties:
            mode:
              enum: [add, subtract]
            amount:
              maximum: 0
          required: [mode, amount]
        - properties:
            mode:
              enum: [override]
            amount:
              maximum: -1
          required: [mode, amount]
    description: |
      原子 UPDATE（GC-5）：subtract 超过余额返回 400，绝不产生负余额；
      override 与当前余额相同返回 400（无变化）。成功后写
      type=admin_adjustment 流水。

  QuotaAdjustmentResponse:
    type: object
    additionalProperties: false
    required: [user_id, new_balance, transaction_id]
    properties:
      user_id:
        type: integer
        format: int64
      new_balance:
        type: integer
        format: int64
      transaction_id:
        type: integer
        format: int64

  ResetPasswordResponse:
    type: object
    additionalProperties: false
    required: [temp_password]
    properties:
      temp_password:
        type: string
        description: |
          16 位一次性临时口令，仅本次响应出现（Cache-Control: no-store）。
          TEMP_PWD_TTL=24h 且 must_change_password=true；24 小时内不改密
          则临时口令失效。
    description: 管理员重置口令的响应；审计只记录"发生了重置"，绝不含口令材料。

  SetPermissionsRequest:
    type: object
    additionalProperties: false
    required: [admin_permissions]
    properties:
      admin_permissions:
        type: array
        uniqueItems: true
        items:
          $ref: '#/schemas/PermissionGrant'
        description: |
          授予集合必须是调用者自身权限的子集，否则 403 且不写库。
          显式 null 被拒绝——NULL 在 RBAC 语义里是 FULL，匿名 null→FULL
          会绕过超集校验；授予全权必须显式提交 ["*"]。
    description: |
      PATCH /api/users/{id}/permissions 只对 admin 目标有效；不能修改自己
      （400）。成功 200 返回更新后的 AdminUser。

  AdminGroup:
    type: object
    additionalProperties: false
    required:
      - id
      - name
      - ratio
      - user_selectable
      - is_system
      - status
      - users_count
      - pricing_overrides_count
      - channels_count
      - created_at
      - updated_at
    properties:
      id:
        type: integer
        format: int64
      name:
        type: string
        pattern: '^[a-z0-9_-]{2,32}$'
      description:
        type: string
        maxLength: 128
        nullable: true
      ratio:
        type: integer
        format: int32
        description: 分组倍率（DB 150 表示 1.5）。
      user_selectable:
        type: boolean
      is_system:
        type: boolean
        description: 系统分组（如 default）不可删除。
      status:
        type: integer
        format: int16
      users_count:
        type: integer
        format: int64
      pricing_overrides_count:
        type: integer
        format: int64
      channels_count:
        type: integer
        format: int64
      created_at:
        type: string
        format: date-time
      updated_at:
        type: string
        format: date-time

  AdminGroupList:
    allOf:
      - $ref: '../components/pagination.yaml#/schemas/Page'
      - type: object
        properties:
          items:
            type: array
            items:
              $ref: '#/schemas/AdminGroup'
    description: GET /api/groups 的 offset 分页信封。

  AdminCreateGroupRequest:
    type: object
    additionalProperties: false
    required: [name]
    properties:
      name:
        type: string
        pattern: '^[a-z0-9_-]{2,32}$'
      description:
        type: string
        maxLength: 128
        nullable: true
    description: 名称唯一；冲突 409（不区分大小写归一后比较）。

  AdminUpdateGroupRequest:
    type: object
    additionalProperties: false
    properties:
      name:
        type: string
        pattern: '^[a-z0-9_-]{2,32}$'
      description:
        type: string
        maxLength: 128
        nullable: true
    description: |
      至少提供一个字段，否则 400。改名会同步更新引用该分组的用户/令牌
      （仓储事务）；系统组（default/auto 等）删除返回 400（handlers_groups.go:
      ErrGroupSystem → 400），被引用的分组删除返回 409。

  # ---------------------------------------------------------------------------
  # 定价管理（M3 Task 7 / modules-06 F-06-13/14/16）
  #
  # 价格列是整数积分（R9）：nullable=true 表示 NULL=未设置（按 billing-02
  # §3.2 兜底），0=显式免费。客户端不得把 null 当 0——两者计费语义不同。
  # ---------------------------------------------------------------------------
  PricingMode:
    type: string
    enum: [per_token, per_request, tiered_expr]
    description: |
      per_token=积分/1M tokens；per_request=积分/次（只使用 prompt_price）；
      tiered_expr=表达式模式（billing_expr 是唯一价格配置）。

  PricingStatus:
    type: integer
    enum: [1, 2]
    description: 1=启用，2=停用（软状态，不删行）。

  ModelPricing:
    type: object
    additionalProperties: false
    required:
      - id
      - model
      - mode
      - author
      - status
      - free
      - created_at
      - updated_at
    properties:
      id:
        type: integer
        format: int64
      model:
        type: string
        pattern: '^[A-Za-z0-9._:-]{1,128}$'
      mode:
        $ref: '#/schemas/PricingMode'
      billing_expr:
        type: string
        nullable: true
        description: 非 null 即表达式模式；与四个价列互斥。
      prompt_price:
        type: integer
        nullable: true
        format: int64
        minimum: 0
        maximum: 9007199254740991
        description: 输入价（积分/1M tokens）；per_request 模式下是每次请求价。
      completion_price:
        type: integer
        nullable: true
        format: int64
        minimum: 0
        maximum: 9007199254740991
      cache_read_price:
        type: integer
        nullable: true
        format: int64
        minimum: 0
        maximum: 9007199254740991
      cache_write_price:
        type: integer
        nullable: true
        format: int64
        minimum: 0
        maximum: 9007199254740991
      author:
        type: string
        minLength: 1
        maxLength: 64
      vendor:
        type: string
        nullable: true
        maxLength: 64
      status:
        $ref: '#/schemas/PricingStatus'
      free:
        type: boolean
        description: 四项有效价全为 0 才为 true；单项 0 不得显示「免费」。
      created_at:
        type: string
        format: date-time
      updated_at:
        type: string
        format: date-time
        description: 乐观锁版本；PATCH/启停必须原样回传。

  ModelPricingList:
    allOf:
      - $ref: '../components/pagination.yaml#/schemas/Page'
      - type: object
        properties:
          items:
            type: array
            items:
              $ref: '#/schemas/ModelPricing'
          quota_per_unit:
            type: integer
            format: int64
            description: 展示换算的每货币单位积分（默认 100）。
    description: GET /api/model-pricing 的 offset 分页信封。

  ModelPricingCreateRequest:
    type: object
    additionalProperties: false
    required: [model]
    properties:
      model:
        type: string
        pattern: '^[A-Za-z0-9._:-]{1,128}$'
      mode:
        $ref: '#/schemas/PricingMode'
      billing_expr:
        type: string
        nullable: true
        description: 非空即表达式模式；与数值价列互斥（混用 400）。
      prompt_price:
        type: integer
        nullable: true
        format: int64
        minimum: 0
        maximum: 9007199254740991
      completion_price:
        type: integer
        nullable: true
        format: int64
        minimum: 0
        maximum: 9007199254740991
      cache_read_price:
        type: integer
        nullable: true
        format: int64
        minimum: 0
        maximum: 9007199254740991
      cache_write_price:
        type: integer
        nullable: true
        format: int64
        minimum: 0
        maximum: 9007199254740991
      author:
        type: string
        minLength: 1
        maxLength: 64
        description: 缺省 Unknown；null 与空串 422。
      vendor:
        type: string
        nullable: true
        maxLength: 64
      status:
        $ref: '#/schemas/PricingStatus'
    description: |
      价格单位是整数积分；展示层按 quota_per_unit 换算为元。
      表达式非法/空白 400（problem.fields=[billing_expr]）；负数或超 2^53−1
      422；模型重复 409。

  ModelPricingUpdateRequest:
    type: object
    additionalProperties: false
    required: [updated_at]
    properties:
      updated_at:
        type: string
        format: date-time
      mode:
        $ref: '#/schemas/PricingMode'
      billing_expr:
        type: string
        nullable: true
        description: |
          null 表示显式清除表达式（离开 tiered_expr 必须同时给出 mode）。
      prompt_price:
        type: integer
        nullable: true
        format: int64
        minimum: 0
        maximum: 9007199254740991
      completion_price:
        type: integer
        nullable: true
        format: int64
        minimum: 0
        maximum: 9007199254740991
      cache_read_price:
        type: integer
        nullable: true
        format: int64
        minimum: 0
        maximum: 9007199254740991
      cache_write_price:
        type: integer
        nullable: true
        format: int64
        minimum: 0
        maximum: 9007199254740991
      author:
        type: string
        minLength: 1
        maxLength: 64
        description: 提交 null 或空串 422（NOT NULL 列）；复位请提交 "Unknown"。
      vendor:
        type: string
        nullable: true
        maxLength: 64
      status:
        $ref: '#/schemas/PricingStatus'
    description: |
      部分更新；model 不可改（提交 model 由字段策略 403）。
      updated_at 缺失 400、不匹配 409。空对象/无字段 400。

  ModelPricingStatusRequest:
    type: object
    additionalProperties: false
    required: [updated_at]
    properties:
      updated_at:
        type: string
        format: date-time

  PricingModelOption:
    type: object
    additionalProperties: false
    required: [model, mode, status]
    properties:
      model:
        type: string
      mode:
        $ref: '#/schemas/PricingMode'
      status:
        $ref: '#/schemas/PricingStatus'

  PricingModelList:
    type: object
    additionalProperties: false
    required: [items]
    properties:
      items:
        type: array
        items:
          $ref: '#/schemas/PricingModelOption'

  PricingPreviewParams:
    type: object
    additionalProperties: false
    properties:
      p:
        type: integer
        format: int64
        minimum: 0
        description: 输入 token（未单独定价的部分）。
      c:
        type: integer
        format: int64
        minimum: 0
      len:
        type: integer
        format: int64
        minimum: 0
      cr:
        type: integer
        format: int64
        minimum: 0
      cc5m:
        type: integer
        format: int64
        minimum: 0
      cc1h:
        type: integer
        format: int64
        minimum: 0
      img:
        type: integer
        format: int64
        minimum: 0
      img_cr:
        type: integer
        format: int64
        minimum: 0
      img_o:
        type: integer
        format: int64
        minimum: 0
      ai:
        type: integer
        format: int64
        minimum: 0
      ao:
        type: integer
        format: int64
        minimum: 0
      image_count:
        type: integer
        minimum: -1
        description: '-1=未设置（按请求域缺省 1）；>=0=精确张数（0 合法且计 0）。缺省 -1。'

  ModelPricingPreviewRequest:
    type: object
    additionalProperties: false
    required: [spec]
    properties:
      spec:
        oneOf:
          - type: object
            additionalProperties: true
          - type: string
        description: |
          pricing.ParsePricing 接受的 spec：JSON 对象（mode/expr 或
          prompt_price/completion_price/cache_read_price/cache_write_price，
          也接受旧倍率风格 model_ratio 等）或等价的 JSON 字符串。
          求值与保存使用同一解析器。按次预览可只给 model_price（自动按
          per_request 解释），或显式 mode=per_request 且必须提供 model_price；
          后者缺失返回 400。
      model:
        type: string
        pattern: '^[A-Za-z0-9._:-]{1,128}$'
        description: 用于模型族默认值（补全倍率/Claude 缓存 1h）；可省略。
      group_ratio:
        type: number
        format: double
        not:
          maximum: 0
        description: 预览用的分组倍率，必须 > 0；缺省 1（服务端默认）。
      params:
        $ref: '#/schemas/PricingPreviewParams'

  ModelPricingPreviewResponse:
    type: object
    additionalProperties: false
    required: [quota, quota_per_unit, amount_yuan, mode, free_model, clamped, clamp]
    properties:
      quota:
        type: integer
        format: int64
        description: 整数积分。
      quota_per_unit:
        type: integer
        format: int64
      amount_yuan:
        type: string
        pattern: '^-?[0-9]+\.[0-9]{2}$'
        description: 元，HALF_UP 到分。
      mode:
        $ref: '#/schemas/PricingMode'
      free_model:
        type: boolean
      clamped:
        type: boolean
        description: 命中配额饱和（quota 已是钳制后的值，同时返回 clamp 审计）。
      clamp:
        type: object
        additionalProperties: true
        nullable: true
        description: 饱和审计标记（op/kind/original/clamped）；未饱和时为 null。

  GroupPricingMode:
    oneOf:
      - $ref: '#/schemas/PricingMode'
      - type: string
        enum: ['']
    description: 随源模型只读展示；源 model_pricing 行缺失时为空串。

  GroupPricing:
    type: object
    additionalProperties: false
    required:
      - id
      - group
      - model
      - mode
      - prompt_price
      - completion_price
      - cache_read_price
      - cache_write_price
      - status
      - source_status
      - created_at
      - updated_at
    properties:
      id:
        type: integer
        format: int64
      group:
        type: string
        pattern: '^[a-z0-9_-]{2,32}$'
      model:
        type: string
      mode:
        $ref: '#/schemas/GroupPricingMode'
      prompt_price:
        type: integer
        format: int64
        minimum: 0
        maximum: 9007199254740991
      completion_price:
        type: integer
        format: int64
        minimum: 0
        maximum: 9007199254740991
      cache_read_price:
        type: integer
        format: int64
        minimum: 0
        maximum: 9007199254740991
      cache_write_price:
        type: integer
        format: int64
        minimum: 0
        maximum: 9007199254740991
      status:
        $ref: '#/schemas/PricingStatus'
      source_status:
        type: integer
        enum: [0, 1, 2]
        description: 源 model_pricing 状态；0=源行缺失。
      created_at:
        type: string
        format: date-time
      updated_at:
        type: string
        format: date-time

  GroupPricingList:
    allOf:
      - $ref: '../components/pagination.yaml#/schemas/Page'
      - type: object
        properties:
          items:
            type: array
            items:
              $ref: '#/schemas/GroupPricing'
          quota_per_unit:
            type: integer
            format: int64
