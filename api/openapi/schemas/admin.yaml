      prompt_price:
        type: integer
        format: int64
        minimum: 0
        maximum: 9007199254740991
        description: 覆盖价（整数绝对价）；缺省 0。
      completion_price:
        type: integer
        format: int64
        minimum: 0
        maximum: 9007199254740991
        description: 覆盖价（整数绝对价）；缺省 0。
      cache_read_price:
        type: integer
        format: int64
        minimum: 0
        maximum: 9007199254740991
        description: 覆盖价（整数绝对价）；缺省 0。
      cache_write_price:
        type: integer
        format: int64
        minimum: 0
        maximum: 9007199254740991
        description: 覆盖价（整数绝对价）；缺省 0。
      status:
