# 管理域 DTO（modules-07 用户与权限管理、分组）。
# 管理端点仅接受会话 Cookie：Bearer 令牌没有角色/权限语义（auth.SessionAuth
# 只注入 UserID+TokenID），RBAC 会对令牌请求 fail-closed。因此 paths 中这些
# operation 只声明 sessionCookie。
schemas:
  # M0 占位：渠道在模块 06 实现，schema 随 M6 细化（密钥字段永不回显）。
  Channel:
    type: object
    additionalProperties: true
    description: 上游渠道 DTO 占位（密钥字段永不回显；schema 待 M6 细化）
    x-newtg-pending: true

  AdminUser:
    type: object
    additionalProperties: false
    required:
      - id
      - username
      - role
      - status
      - balance
      - group
      - admin_permissions
      - totp_enabled
      - must_change_password
      - token_count
      - created_at
      - updated_at
    description: |
      管理面用户投影。永不含口令哈希、TOTP 种子或备用码。admin_permissions
      为 null 表示 FULL（数据库 NULL）；空数组表示明确无任何权限——两者语义
      不同，客户端不得把 [] 当 null。
    properties:
      id:
        type: integer
        format: int64
      username:
        type: string
      display_name:
        type: string
        maxLength: 32
        nullable: true
      email:
        type: string
        format: email
        nullable: true
        description: 管理员创建的用户可为 null（不绑定邮箱）。
      role:
        $ref: './public.yaml#/schemas/UserRole'
      status:
        $ref: './public.yaml#/schemas/UserStatus'
      balance:
        type: integer
        format: int64
        description: 当前余额（credits 最小单位）。
      group:
        type: string
      admin_permissions:
        type: array
        items:
          $ref: '#/schemas/PermissionKey'
        nullable: true
      totp_enabled:
        type: boolean
      must_change_password:
        type: boolean
      remark:
        type: string
        maxLength: 255
        nullable: true
      token_count:
        type: integer
        format: int64
      created_at:
        type: string
        format: date-time
      updated_at:
        type: string
        format: date-time
        description: 乐观锁版本；PATCH 必须原样回传。

  PermissionKey:
    type: string
    enum:
      - users:read
      - users:create
      - users:update
      - users:disable
      - users:delete
      - users:adjust-quota
      - users:manage-roles
      - users:reset-security
      - groups:manage
      - channels:read
      - channels:manage
      - channels:manage_sensitive
      - pricing:read
      - pricing:manage
      - redemption:manage
      - orders:read
      - orders:manage
      - logs:read
      - log.prompt.view
      - settings:manage
    description: |
      modules-07 F-07-08 的 20 键冻结目录（order 与文档表格一致）。
      通配符 "*" 单独建模为 PermissionGrant，不放宽本枚举。

  PermissionGrant:
    oneOf:
      - $ref: '#/schemas/PermissionKey'
      - type: string
        enum: ['*']
    description: 权限矩阵成员：20 键之一或全权通配符 "*"。

  AdminUserList:
    allOf:
      - $ref: '../components/pagination.yaml#/schemas/Page'
      - type: object
        properties:
          items:
            type: array
            items:
              $ref: '#/schemas/AdminUser'
    description: GET /api/users 的 offset 分页信封。

  AdminCreateUserRequest:
    type: object
    additionalProperties: false
    required: [username, password]
    properties:
      username:
        type: string
        pattern: '^[a-zA-Z0-9_-]{3,32}$'
      display_name:
        type: string
        maxLength: 32
        nullable: true
      role:
        $ref: './public.yaml#/schemas/UserRole'
        description: 缺省 user。创建 admin 需要执行者同时持有 users:manage-roles 与默认权限集的超集。
      group:
        type: string
        description: 缺省 default。
      password:
        type: string
        minLength: 8
        maxLength: 128
      remark:
        type: string
        maxLength: 255
        nullable: true
    description: |
      必须携带 Idempotency-Key；同键重放只创建一条。请求体没有 email 字段：
      管理员创建的用户 email 为 NULL。用户名冲突 409。
    # 注意：role 缺省时不能写成 required，但 description 说明默认值。

  AdminUpdateUserRequest:
    type: object
    additionalProperties: false
    required: [updated_at]
    description: |
      部分更新。不含口令字段：提交 password 返回 400（用
      POST /api/users/{id}/reset-password）。未知字段 403 field_not_writable。
      role 变更会吊销该用户全部会话；不能修改自己的角色/状态/权限（400）。
    properties:
      display_name:
        type: string
        maxLength: 32
        nullable: true
      group:
        type: string
      remark:
        type: string
        maxLength: 255
        nullable: true
      role:
        $ref: './public.yaml#/schemas/UserRole'
      updated_at:
        type: string
        format: date-time

  AdminUserStatusRequest:
    type: object
    additionalProperties: false
    required: [status]
    properties:
      status:
        $ref: './public.yaml#/schemas/UserStatus'
    description: |
      封禁在同一事务内吊销全部会话并把令牌置 disabled；解禁不自动恢复令牌。
      不能封禁自己（400）。

  AdminUserStatusResponse:
    type: object
    additionalProperties: false
    required: [id, status]
    properties:
      id:
        type: integer
        format: int64
      status:
        $ref: './public.yaml#/schemas/UserStatus'

  QuotaAdjustmentRequest:
    type: object
    additionalProperties: false
    required: [mode, amount, idempotency_key]
    properties:
      mode:
        type: string
        enum: [add, subtract, override]
      amount:
        type: integer
        format: int64
        description: add/subtract 为增量（≥0），override 为目标余额（≥0）。
      idempotency_key:
        type: string
        minLength: 1
        description: 必填业务幂等键；与 HTTP Idempotency-Key 不同，写入交易流水。
    description: |
      原子 UPDATE（GC-5）：subtract 超过余额返回 400，绝不产生负余额；
      override 与当前余额相同返回 400（无变化）。成功后写
      type=admin_adjustment 流水。

  QuotaAdjustmentResponse:
    type: object
    additionalProperties: false
    required: [user_id, new_balance, transaction_id]
    properties:
      user_id:
        type: integer
        format: int64
      new_balance:
        type: integer
        format: int64
      transaction_id:
        type: integer
        format: int64

  ResetPasswordResponse:
    type: object
    additionalProperties: false
    required: [temp_password]
    properties:
      temp_password:
        type: string
        description: |
          16 位一次性临时口令，仅本次响应出现（Cache-Control: no-store）。
          TEMP_PWD_TTL=24h 且 must_change_password=true；24 小时内不改密
          则临时口令失效。
    description: 管理员重置口令的响应；审计只记录"发生了重置"，绝不含口令材料。

  SetPermissionsRequest:
    type: object
    additionalProperties: false
    required: [admin_permissions]
    properties:
      admin_permissions:
        type: array
        uniqueItems: true
        items:
          $ref: '#/schemas/PermissionGrant'
        description: |
          授予集合必须是调用者自身权限的子集，否则 403 且不写库。
          显式 null 被拒绝——NULL 在 RBAC 语义里是 FULL，匿名 null→FULL
          会绕过超集校验；授予全权必须显式提交 ["*"]。
    description: |
      PATCH /api/users/{id}/permissions 只对 admin 目标有效；不能修改自己
      （400）。成功 200 返回更新后的 AdminUser。

  AdminGroup:
    type: object
    additionalProperties: false
    required:
      - id
      - name
      - ratio
      - user_selectable
      - is_system
      - status
      - users_count
      - pricing_overrides_count
      - channels_count
      - created_at
      - updated_at
    properties:
      id:
        type: integer
        format: int64
      name:
        type: string
        pattern: '^[a-z0-9_-]{2,32}$'
      description:
        type: string
        maxLength: 128
        nullable: true
      ratio:
        type: integer
        format: int32
        description: 分组倍率（DB 150 表示 1.5）。
      user_selectable:
        type: boolean
      is_system:
        type: boolean
        description: 系统分组（如 default）不可删除。
      status:
        type: integer
        format: int16
      users_count:
        type: integer
        format: int64
      pricing_overrides_count:
        type: integer
        format: int64
      channels_count:
        type: integer
        format: int64
      created_at:
        type: string
        format: date-time
      updated_at:
        type: string
        format: date-time

  AdminGroupList:
    allOf:
      - $ref: '../components/pagination.yaml#/schemas/Page'
      - type: object
        properties:
          items:
            type: array
            items:
              $ref: '#/schemas/AdminGroup'
    description: GET /api/groups 的 offset 分页信封。

  AdminCreateGroupRequest:
    type: object
    additionalProperties: false
    required: [name]
    properties:
      name:
        type: string
        pattern: '^[a-z0-9_-]{2,32}$'
      description:
        type: string
        maxLength: 128
        nullable: true
    description: 名称唯一；冲突 409（不区分大小写归一后比较）。

  AdminUpdateGroupRequest:
    type: object
    additionalProperties: false
    properties:
      name:
        type: string
        pattern: '^[a-z0-9_-]{2,32}$'
      description:
        type: string
        maxLength: 128
        nullable: true
    description: |
      至少提供一个字段，否则 400。改名会同步更新引用该分组的用户/令牌
      （仓储事务）；default 不可删除（409），被引用的分组删除返回 409。
