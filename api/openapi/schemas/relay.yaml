# 中继协议 schema 不在此重定义（platform-03 §9.3）：
# 真源为 backend/internal/contract/*.go（IR）与各 adapter；对外以 externalDocs 指向
# OpenAI/Anthropic/Gemini 公开规范。本文件保留域槽位，供 M1+ 需要时登记非协议面的
# 网关自有枚举（如错误 code 表）使用。
schemas:
  # /v1（以及 /pg）唯一的错误信封（relay-01 §3.6）。
  #
  # 与 /api/* 的 RFC 7807 problem+json 刻意不同：中继协议面要能被 OpenAI/Anthropic
  # SDK 原样解析，所以形状必须是 `{error:{...}}`。这里的真源不是本文档，而是
  # backend/internal/httpapi/relay_auth.go 的 relayErrorEnvelope——W7/M5-c 只把
  # 既成事实补进契约（R-M5-15），不改运行时形状。
  RelayError:
    type: object
    description: |
      中继错误信封（OpenAI 兼容）。`message` 末尾会追加
      ` (requestId: <id>)`，同一个 id 同时出现在 `X-Request-ID` 头中。
    required: [error]
    properties:
      error:
        type: object
        required: [message, type, code]
        properties:
          message:
            type: string
            description: 固定文案（不包含上游 URL/凭据/SQL 等内部信息）；限流为 `rate limit exceeded; retry in {n}s`
          type:
            type: string
            enum: [new_api_error]
            description: 固定为 `new_api_error`（relay-01 §3.6 冻结字面量）
          code:
            type: string
            description: |
              机器可读 code。限流为 `rate_limit_exceeded`，限流器故障为
              `rate_limit_check_failed`；令牌/会话类错误为空串（不提供存在性信息）。

  # Claude 形错误信封（R-W18-04，真源 writeClaudeError）。
  #
  # /v1/messages 族（含 count_tokens）的全部普通错误都用这个形状：Anthropic
  # SDK 按 `type=error` 解析，收到 OpenAI 的 `{error:{message,type,code}}` 会当成
  # 未知结构。刻意没有 `code` 槽位；机器语义由 HTTP 状态码 + error.type 表达。
  # `type=error` 是顶层判别字段，因此顶层 type 与 error.type 是两个不同的枚举。
  ClaudeError:
    type: object
    description: |
      Anthropic Claude 形错误信封。`message` 末尾会追加
      ` (requestId: <id>)`，同一个 id 同时出现在 `X-Request-ID` 头中。
    required: [type, error]
    properties:
      type:
        type: string
        enum: [error]
        description: 顶层判别字段，固定为 `error`
      error:
        type: object
        required: [type, message]
        properties:
          type:
            type: string
            enum:
              - invalid_request_error
              - authentication_error
              - permission_error
              - not_found_error
              - request_too_large
              - rate_limit_error
              - api_error
            description: |
              错误类型映射（R-W18-04）：400/422/402 → `invalid_request_error`；
              401 → `authentication_error`；403 → `permission_error`；
              404 → `not_found_error`；413 → `request_too_large`；
              429 → `rate_limit_error`；5xx → `api_error`。
          message:
            type: string
            description: 固定文案（不包含上游 URL/凭据/SQL 等内部信息）
  # OpenAI Responses 对象（W18-C）。真源是 tasks/responses.go 的
  # BuildResponsesObject：id/object/created_at/status/model 由宿主写死，
  # output 由插件 renderFinal 或产物投影提供；usage 只在终态出现。
  ResponsesObject:
    type: object
    description: |
      Responses 对象。`output` 元素本波不做 IR 建模（插件渲染项或产物投影项），
      因此按开放对象声明；`usage` 仅在终态（completed/failed/incomplete）出现。
    required: [id, object, created_at, status, output]
    properties:
      id:
        type: string
        description: "`resp_` 前缀；与任务 `task_` id 共享同一段随机量"
      object:
        type: string
        enum: [response]
      created_at:
        type: integer
        format: int64
      status:
        type: string
        enum: [queued, in_progress, completed, failed, incomplete]
      model:
        type: string
      output:
        type: array
        items:
          type: object
          additionalProperties: true
      usage:
        type: object
        description: 只在终态出现；input_tokens ← prompt_tokens、output_tokens ← completion_tokens
        properties:
          input_tokens: {type: integer}
          output_tokens: {type: integer}
          total_tokens: {type: integer}

  # list-by-condition 的请求体（W8/MJ-b）。网关自有形状（非上游协议），
  # 因此登记在本域 schemas；上限与 R-MJ-16 冻结值一致。
  MJTaskListRequest:
    type: object
    additionalProperties: false
    required: [ids]
    properties:
      ids:
        type: array
        maxItems: 100
        description: MjId 列表（≤100；空数组直接返回 []）
        items: {type: string, minLength: 1, maxLength: 128}
