# 公开域 DTO（platform-03 §9.5 / §10.1；M1 账户与认证契约）。
# 所有 DTO 均 additionalProperties:false：这是契约层的收紧方向，避免前端误以为
# "多传字段会被忽略"。M1 运行期只有 token handler 用 DisallowUnknownFields 强制；
# 其余入口的严格未知字段拒绝由后续校验中间件落地（登记为待实现项），
# 因此本文件的 additionalProperties:false 描述的是契约而非当前全部实现。
schemas:
  PublicStatus:
    type: object
    additionalProperties: false
    required: [system_initialized, auth, password_login_encryption_enabled, checkin_enabled, languages, default_language, site, nav, billing, pay, usd_exchange_rate, credit_display_symbol, usable_groups]
    description: |
      公开站点状态（GET /api/status）。响应 Cache-Control: no-store——站点开关
      变更必须立即反映到登录/注册页，禁止任何中间层缓存。
    properties:
      system_initialized:
        type: boolean
        description: |
          站点是否已完成首次初始化（system.install.completed_at 已写入）。前端据此
          实现 /setup 闸门：false 时控制台路由一律重定向到安装向导；已初始化后
          向导页反向导流到登录页（重复 POST /api/setup 返回 409 + initialized=true）。
      auth:
        type: object
        additionalProperties: false
        required: [signup_enabled, password_login_enabled, email_verification_required, turnstile]
        properties:
          signup_enabled:
            type: boolean
            description: false 时 POST /api/auth/register 返回 403（关闭注册）。
          password_login_enabled:
            type: boolean
            description: false 时 POST /api/auth/login 返回 403（仅保留 OAuth 等其它入口）。
          email_verification_required:
            type: boolean
            description: 注册后是否必须先验证邮箱才能使用完整功能。
          turnstile:
            type: object
            additionalProperties: false
            required: [enabled, site_key]
            properties:
              enabled:
                type: boolean
              site_key:
                type: string
                description: Turnstile 公开 site key；未启用时为空串。站点 secret 永不下发。
      password_login_encryption_enabled:
        type: boolean
        description: |
          与 GET /api/auth/login/encryption-key 的 enabled 字段同一开关。
          true 时登录只接受 password_encrypted，出现明文 password 一律拒绝
          （reason=encryption_required，对外响应与口令错误不可区分）。
      checkin_enabled:
        type: boolean
        description: |
          每日签到总开关的**派生**布尔（来源设置键 `checkin.enabled`，但
          `checkin.*` 本身不进公开下发全集）。false 时控制台不渲染签到卡，
          POST /api/checkin 与 GET /api/checkin/calendar 返回 403
          `checkin_disabled`。奖励区间永不下发。
      languages:
        type: array
        minItems: 7
        maxItems: 7
        uniqueItems: true
        description: canonical 7 语（modules-01 F-01-19）；顺序即下拉框顺序。
        items:
          $ref: '#/schemas/Language'
      default_language:
        $ref: '#/schemas/Language'
      site:
        $ref: '#/schemas/PublicSite'
      nav:
        $ref: '#/schemas/PublicNav'
      billing:
        $ref: '#/schemas/PublicBilling'
      pay:
        $ref: '#/schemas/PublicPay'
      usd_exchange_rate:
        type: number
        format: double
        description: |
          USD→CNY 展示汇率常量（billing-02 §4.1 唯一真源，7.1 = 71/10）。
          只用于展示层换算，不是设置键。
      credit_display_symbol:
        type: string
        description: 等于 billing.currency_symbol（展示用积分符号）。
      usable_groups:
        type: array
        description: |
          当前会话用户的可用分组与分组模型清单（modules-02 §2.14 / F-02-18）。
          仅当请求携带有效会话时非空；匿名、会话失效或 Redis/DB 查询失败时
          一律为空数组（公开面不返回 401/5xx）。可用分组 =
          user_groups.status=1 且（user_selectable=true 或 name = 用户当前分组）；
          models = 该分组下启用渠道的 supported_models 之并集，且仅保留
          model_pricing.status=1 的模型，去重排序。
        items:
          $ref: '#/schemas/UsableGroup'

  UsableGroup:
    type: object
    additionalProperties: false
    required: [name, description, ratio, models]
    properties:
      name:
        type: string
        description: user_groups.name
      description:
        type: string
        description: 分组描述；未设置时为空串。
      ratio:
        type: integer
        description: 分组倍率（整数百分比，100 = 1.00x）。
      models:
        type: array
        description: 该分组可调用的模型（去重、字典序）；无可用模型时为 []。
        items:
          type: string

  # ---------------------------------------------------------------------------
  # 公开设置投影（modules-08 §1.4.1；由注册表 public:true 键自动聚合）
  # ---------------------------------------------------------------------------

  PublicSite:
    type: object
    description: |
      `site` 域公开键投影。`home_custom_html` 仅在 `home_custom_enabled=true`
      时下发（R-PUB-07）；关闭时字段整体缺席。
    properties:
      title: {type: string}
      logo_url: {type: string}
      server_address: {type: string}
      timezone: {type: string}
      footer_html: {type: string}
      about_html: {type: string}
      filing_no: {type: string}
      docs_url: {type: string}
      status_page_url: {type: string}
      rankings_min_samples: {type: integer, format: int64}
      seo:
        type: object
        properties:
          description: {type: string}
          og_image_url: {type: string}
      home_custom_enabled: {type: boolean}
      home_custom_html:
        type: string
        description: 仅当 home_custom_enabled=true 时存在。
      home_blocks:
        type: object
        properties:
          hero: {type: boolean}
          live_feed: {type: boolean}
          features: {type: boolean}
          stats: {type: boolean}
          onboarding: {type: boolean}
      demo:
        type: object
        properties:
          enabled: {type: boolean}

  PublicNav:
    type: object
    description: |
      七个导航项（home/console/models/pricing/rankings/docs/about）的 enabled 与
      require_auth，以及控制台模块显隐。`docs.require_auth` 与
      `about.require_auth` 默认 false（R-PUB-09）。
    properties:
      home:
        $ref: '#/schemas/PublicNavItem'
      console:
        $ref: '#/schemas/PublicNavItem'
      pricing:
        $ref: '#/schemas/PublicNavItem'
      models:
        $ref: '#/schemas/PublicNavItem'
      rankings:
        $ref: '#/schemas/PublicNavItem'
      docs:
        $ref: '#/schemas/PublicNavItem'
      about:
        $ref: '#/schemas/PublicNavItem'
      modules:
        type: object
        properties:
          console:
            type: object
            properties:
              dashboard: {type: boolean}
              tokens: {type: boolean}
              usage_logs: {type: boolean}
              wallet: {type: boolean}
              profile: {type: boolean}
              security: {type: boolean}
          chat:
            type: object
            properties:
              playground: {type: boolean}

  PublicNavItem:
    type: object
    required: [enabled, require_auth]
    properties:
      enabled:
        type: boolean
      require_auth:
        type: boolean

  PublicBilling:
    type: object
    description: billing 域的公开键（§1.4.1）。
    properties:
      quota_per_unit: {type: integer, format: int64}
      display_unit:
        type: string
        description: credits（积分为主单位）或 cny（人民币为主单位）。
      currency_symbol: {type: string}
      signup_grant_credits: {type: integer, format: int64}
      signup_grant_requires_verified_email: {type: boolean}
      display_token_stat_enabled: {type: boolean}

  PublicPay:
    type: object
    description: pay 域的公开键（§1.4.1）；绝不含任何支付密钥。
    properties:
      online_enabled: {type: boolean}
      amount_presets_cny:
        type: array
        items: {type: integer, format: int64}
      stripe:
        type: object
        properties:
          enabled: {type: boolean}
          publishable_key:
            type: string
            description: 公开可发布 key（P-17）；secret/webhook secret 永不下发。
      alipay:
        type: object
        properties:
          enabled: {type: boolean}
          sandbox: {type: boolean}
      epay:
        type: object
        properties:
          enabled: {type: boolean}
      creem:
        type: object
        properties:
          enabled: {type: boolean}
      waffo:
        type: object
        properties:
          enabled: {type: boolean}
      waffo_pancake:
        type: object
        properties:
          enabled: {type: boolean}

  # ---------------------------------------------------------------------------
  # 首页统计（F-09-04 / R-PUB-08）
  # ---------------------------------------------------------------------------

  HomeStats:
    type: object
    additionalProperties: false
    required: [upstreams, models, endpoints, routing_dims]
    properties:
      upstreams:
        type: integer
        format: int64
        minimum: 0
        description: 已启用渠道去重到上游服务商类型后的数量。
      models:
        type: integer
        format: int64
        minimum: 0
        description: 与 /api/pricing 同一可见集合的计数。
      endpoints:
        type: integer
        format: int64
        description: 冻结协议端点目录大小（3）。
      routing_dims:
        type: integer
        format: int64
        description: 冻结调度控制维度大小（6）。

  # ---------------------------------------------------------------------------
  # 公开定价目录（F-09-14~F-09-22 / B3 契约）
  # ---------------------------------------------------------------------------

  PublicPricingList:
    type: object
    additionalProperties: false
    required: [items, total, page, page_size, facets, meta]
    properties:
      items:
        type: array
        items:
          $ref: '#/schemas/PublicModelCard'
      total:
        type: string
        pattern: '^[0-9]+$'
        description: 命中总数（int64 的 JSON 字符串，防前端精度丢失）。
      page:
        type: integer
        minimum: 1
      page_size:
        type: integer
        minimum: 1
        maximum: 100
      facets:
        $ref: '#/schemas/PublicFacets'
      meta:
        $ref: '#/schemas/PublicPricingMeta'

  PublicModelCard:
    type: object
    additionalProperties: false
    required: [model_id, display_name, vendor, capabilities, context_length, max_output,
               mode, prompt_price, completion_price, cache_read_price, cache_write_price,
               is_free, group_price, pricing_schedule, endpoints, tags, description]
    properties:
      model_id: {type: string, maxLength: 128}
      display_name:
        type: string
        description: 有档案时取档案 display_name；无档案（或空串）回退 model_id（D1-15/D1-16）。
      vendor:
        type: string
        description: |
          三级回退（D1-16）：档案关联的 vendors.name → model_pricing.vendor →
          model_id 首个 `/` 前缀；都不可得时为空串。
      capabilities:
        type: array
        items: {type: string}
        description: 档案 capabilities 枚举；无档案时为空数组。
      context_length:
        anyOf:
          - type: integer
            format: int64
            minimum: 0
          - enum: [null]
        description: 档案 context_length；无档案或未设置时为 null。
      max_output:
        anyOf:
          - type: integer
            format: int64
            minimum: 0
          - enum: [null]
        description: 档案 max_output；无档案或未设置时为 null。
      mode:
        type: string
        description: per_token 或 per_request（MVP 仅两种）。
      prompt_price:
        anyOf:
          - type: string
            pattern: '^[0-9]+$'
          - enum: [null]
        description: int64 的 JSON 字符串；DB NULL 时为 null（R-PUB-03）。
      completion_price:
        anyOf:
          - type: string
            pattern: '^[0-9]+$'
          - enum: [null]
      cache_read_price:
        anyOf:
          - type: string
            pattern: '^[0-9]+$'
          - enum: [null]
      cache_write_price:
        anyOf:
          - type: string
            pattern: '^[0-9]+$'
          - enum: [null]
      is_free:
        type: boolean
        description: 四项有效价全部显式 0；NULL 不算 0（R-PUB-03）。
      group_price:
        anyOf:
          - $ref: '#/schemas/PublicGroupPrice'
          - enum: [null]
        description: 仅登录或显式 group（且 expose=true）时出现（R-PUB-05）。
      pricing_schedule:
        anyOf:
          - $ref: '#/schemas/PublicPricingSchedule'
          - enum: [null]
        description: |
          时段计价表：strategy.time.enabled=true 时非 null，否则为 null
          （未启用时段时响应与旧版逐字段一致）。非法策略同样降级为 null
          并记录告警，不阻断公开目录。
      endpoints:
        type: array
        items: {type: string}
        description: |
          档案 endpoints 派生的协议端点枚举（D1-19）；未知路径忽略，无档案时
          为空数组。
      tags:
        type: array
        items: {type: string}
        description: 档案 tags；无档案时为空数组。
      description:
        type: string
        description: 档案 description；无档案时为空串。

  PublicPricingSchedule:
    type: object
    additionalProperties: false
    required: [kind, timezone, default_multiplier, holiday_policy, windows]
    properties:
      kind:
        type: string
        enum: [flat, peak_offpeak]
        description: 结构化枚举，前端按七种语言本地化。
      timezone:
        type: string
        description: 策略自己的 IANA 时区（不随站点时区变更）。
      default_multiplier:
        type: number
        format: double
        description: 未命中窗口（以及 cn_offpeak 的法定假日）使用的倍率。
      holiday_policy:
        type: string
        enum: [none, cn_offpeak]
      windows:
        type: array
        items:
          $ref: '#/schemas/PublicPricingWindow'
        description: 同一时刻命中多个窗口时数组顺序最后一条生效。

  PublicPricingWindow:
    type: object
    additionalProperties: false
    required: [name, days, start, end, multiplier]
    properties:
      name: {type: string, maxLength: 64}
      days:
        type: array
        minItems: 1
        items:
          type: integer
          minimum: 1
          maximum: 7
        description: 1=周一 … 7=周日；跨夜窗口指窗口开始的那一天。
      start:
        type: string
        pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
      end:
        type: string
        pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
        description: end <= start 表示跨夜。
      multiplier:
        type: number
        format: double

  PublicGroupPrice:
    type: object
    additionalProperties: false
    required: [group, ratio, prompt, completion, cache_read, cache_write, source]
    properties:
      group: {type: string}
      ratio:
        anyOf:
          - type: integer
          - enum: [null]
        description: 分组倍率（整数百分比，120 = 1.20x）。
      prompt:
        anyOf: [{type: string, pattern: '^[0-9]+$'}, {enum: [null]}]
      completion:
        anyOf: [{type: string, pattern: '^[0-9]+$'}, {enum: [null]}]
      cache_read:
        anyOf: [{type: string, pattern: '^[0-9]+$'}, {enum: [null]}]
      cache_write:
        anyOf: [{type: string, pattern: '^[0-9]+$'}, {enum: [null]}]
      source:
        type: string
        description: override=覆盖价；ratio=基准价 × 倍率 ÷ 100（服务端整数运算）。

  PublicFacets:
    type: object
    additionalProperties: false
    required: [vendors, capabilities, context, groups, endpoints, pricing_types]
    properties:
      vendors:
        type: array
        items:
          $ref: '#/schemas/PublicFacetOption'
      capabilities:
        type: array
        description: |
          档案 capabilities 计数（D1-18）；忽略本组自身筛选，未知值丢弃，
          无档案模型不计入。无任何档案能力时为空数组。
        items:
          $ref: '#/schemas/PublicFacetOption'
      context:
        type: array
        description: |
          档案 context_length 分档计数（D1-20）：8K（≤8,192）、32K
          （8,193–32,768）、128K（32,769–131,072）、200K+（>131,072），
          null 不计数。无档案时为空数组。
        items:
          $ref: '#/schemas/PublicFacetOption'
      groups:
        type: array
        items:
          $ref: '#/schemas/PublicGroupFacet'
      endpoints:
        type: array
        description: |
          档案 endpoints 派生枚举计数（D1-19）；未知路径忽略，无档案模型
          不计入。无任何档案端点时为空数组。
        items:
          $ref: '#/schemas/PublicFacetOption'
      pricing_types:
        type: array
        items:
          $ref: '#/schemas/PublicPricingTypeFacet'

  PublicFacetOption:
    type: object
    additionalProperties: false
    required: [value, label, count]
    properties:
      value: {type: string}
      label: {type: string}
      count: {type: integer, format: int64, minimum: 0}

  PublicGroupFacet:
    type: object
    additionalProperties: false
    required: [value, label, ratio, count]
    properties:
      value: {type: string}
      label: {type: string}
      ratio:
        anyOf: [{type: integer}, {enum: [null]}]
        description: 匿名且 expose_group_ratios=false 时为 null（R-PUB-05）。
      count: {type: integer, format: int64, minimum: 0}

  PublicPricingTypeFacet:
    type: object
    additionalProperties: false
    required: [value, count]
    properties:
      value:
        type: string
        enum: [token, request]
      count: {type: integer, format: int64, minimum: 0}

  PublicPricingMeta:
    type: object
    additionalProperties: false
    required: [credit_symbol, quota_per_unit, usd_exchange_rate, version, generated_at]
    properties:
      credit_symbol: {type: string}
      quota_per_unit: {type: integer, format: int64}
      usd_exchange_rate: {type: number, format: double}
      version: {type: string}
      generated_at:
        type: string
        format: date-time

  PublicModelDetail:
    allOf:
      - $ref: '#/schemas/PublicModelCard'
      - type: object
        additionalProperties: false
        required: [modalities, knowledge_cutoff, released_at, group_prices, parameters,
                   rate_limits, auth_style]
        properties:
          modalities:
            type: array
            items: {type: string}
            description: 档案 modalities；无档案时为空数组。
          knowledge_cutoff:
            anyOf: [{type: string}, {enum: [null]}]
            description: 档案 knowledge_cutoff（YYYY-MM）；无档案或未设置时为 null。
          released_at:
            anyOf: [{type: string}, {enum: [null]}]
            description: 档案 released_at（YYYY-MM-DD）；无档案或未设置时为 null。
          group_prices:
            type: array
            items:
              $ref: '#/schemas/PublicGroupPrice'
          parameters:
            type: array
            items:
              $ref: '#/schemas/PublicModelParameter'
            description: 档案 parameters；无档案时为空数组。
          rate_limits:
            type: array
            items:
              $ref: '#/schemas/PublicRateLimit'
          auth_style:
            type: string
            description: 认证头风格；当前实现恒为 bearer。

  PublicModelParameter:
    type: object
    additionalProperties: false
    required: [name, required, type, default, description]
    properties:
      name: {type: string}
      required: {type: boolean}
      type: {type: string}
      default: {}
      description: {type: string}

  PublicRateLimit:
    type: object
    additionalProperties: false
    required: [group, user_model_rpm]
    properties:
      group: {type: string}
      user_model_rpm:
        type: integer
        format: int64
        minimum: 0
        description: 每用户每模型 RPM；0=不限。

  Language:
    type: string
    enum: [en, zh-CN, zh-TW, fr, ru, ja, vi]
    description: 冻结的 canonical 语言清单；非法值在 PUT /api/self/setting 返回 400。

  GeoIPResponse:
    type: object
    additionalProperties: false
    required: [country, region, source]
    description: |
      客户端粗粒度地理区域。不返回坐标、城市级精度、IP 原文、ASN 或代理链。
      响应缓存策略：Cache-Control: private, max-age=300。
    properties:
      country:
        anyOf:
          - type: string
            pattern: '^[A-Z]{2}$'
          - enum: [null]
        description: ISO 3166-1 alpha-2（大写）；无法判定为 null
      region:
        anyOf:
          - type: string
            maxLength: 64
          - enum: [null]
        description: ISO 3166-2 子分区码；无法判定为 null
      source:
        type: string
        enum: [local_db, unknown]
        description: local_db=命中本地 GeoIP 库；unknown=库缺失或无匹配

  LoginEncryptionKeyResponse:
    type: object
    additionalProperties: false
    description: |
      关闭态固定 {enabled:false}；开启态 {kid, public_key}，enabled 字段缺席。
      前端必须以 enabled === false 判定明文路径——字段缺失不得当作"关闭"
      （模块-01 §3.14 DisableCache；该端点是加密登录的唯一引导）。
    properties:
      enabled:
        type: boolean
      kid:
        type: string
        description: sha256(SPKI DER) 的前 16 个 hex 字符；用于选择解密私钥槽（active/previous）。
      public_key:
        type: string
        description: RSA ≥ 2048 公钥（PKCS#8 SPKI PEM）。仅公开材料；私钥永不出库外。

  EmailCodeRequest:
    type: object
    additionalProperties: false
    required: [email, purpose]
    properties:
      email:
        type: string
        format: email
        maxLength: 254
      purpose:
        type: string
        enum: [register, reset, verify, bind]
        description: |
          register/reset 面向匿名请求；verify/bind 要求有效会话——本端点虽挂在
          公开路由（不经过 SessionAuth），实现会显式校验会话，缺失即 401。
      turnstile_token:
        type: string
        description: |
          Cloudflare Turnstile 一次性令牌。Turnstile 开启时必填（缺失或校验失败
          403），关闭时忽略；也接受 ?turnstile_token= 查询形态（两者同时出现时
          请求体优先）。
    description: |
      发送 6 位一次性邮箱验证码（TTL 10 分钟）。同邮箱 60 秒冷却、同 IP 每小时
      10 次；超限返回 429 + Retry-After。成功恒 204 且不回显验证码。

  RegisterRequest:
    type: object
    additionalProperties: false
    # email_code 仅当 GET /api/status 的 auth.email_verification_required=true
    # 时必填（服务端在该开关开启时校验并消费；默认关闭时忽略该字段）。
    required: [username, email, password, confirmPassword, agree_terms]
    properties:
      username:
        type: string
        pattern: '^[a-zA-Z0-9_-]{3,32}$'
      email:
        type: string
        format: email
      password:
        type: string
        minLength: 8
        maxLength: 128
        description: 长度合格后仍会做泄露口令筛查；命中返回 400（不区分"弱"与"已泄露"）。
      confirmPassword:
        type: string
        description: 必须与 password 逐字一致，否则 400。
      email_code:
        type: string
        pattern: '^[0-9]{6}$'
        description: 条件字段：仅当 auth.email_verification_required=true 时必填并校验。
      agree_terms:
        type: boolean
        description: 必须为 true；false 返回 400。
      aff:
        type: string
        maxLength: 64
        description: 可选推广码（非必填）；超长 400。
      turnstile_token:
        type: string
        description: |
          Cloudflare Turnstile 一次性令牌。Turnstile 开启时必填（缺失或校验失败
          403），关闭时忽略；也接受 ?turnstile_token= 查询形态（两者同时出现时
          请求体优先）。
    description: |
      注册成功 201 + 会话 Cookie（自动登录）。重复 username/email 统一 409，
      文案不区分字段级差异以防账号枚举。邮箱域名白名单开启时域外地址 422。

  AuthUser:
    type: object
    additionalProperties: false
    required: [id, username, role, email_verified, must_change_password]
    description: 会话建立响应中的用户投影；绝不含口令/TOTP/备用码/权限列。
    properties:
      id:
        type: integer
        format: int64
      username:
        type: string
      email:
        type: string
        description: 未绑定邮箱时字段缺席（omitempty）。
      role:
        $ref: '#/schemas/UserRole'
      email_verified:
        type: boolean
      must_change_password:
        type: boolean
        description: 管理员重置口令后为 true；前端应强制跳转改密页。

  UserRole:
    type: string
    enum: [user, admin]

  UserStatus:
    type: string
    enum: [enabled, disabled]
    description: 账号状态；disabled 时除登录/找回流程外的认证端点一律拒绝。

  AuthSessionResponse:
    type: object
    additionalProperties: false
    required: [user]
    properties:
      user:
        $ref: '#/schemas/AuthUser'
    description: 口令（+ 可选 2FA）通过后建立会话的响应；同时下发会话 Cookie 与 CSRF Cookie。

  Pending2FAResponse:
    type: object
    additionalProperties: false
    required: [status, ticket]
    properties:
      status:
        type: string
        enum: [pending_2fa]
        description: 判别字段；客户端据此跳转 2FA challenge 页。
      ticket:
        type: string
        description: 一次性 ticket（5 分钟），只能兑换一次正式会话；不包含用户身份。

  LoginResponse:
    oneOf:
      - $ref: '#/schemas/AuthSessionResponse'
      - $ref: '#/schemas/Pending2FAResponse'
    description: |
      口令通过后二选一：未启用 2FA 直接建会话（AuthSessionResponse）；已启用
      返回 pending_2fa + ticket，客户端再调用 POST /api/auth/2fa/challenge。
      用 oneOf 而非可空分支，是为了让生成的类型系统强制前端处理两条路径。

  LoginRequest:
    type: object
    additionalProperties: false
    required: [identifier]
    description: |
      identifier 可为用户名或邮箱。开启登录加密时请求体只接受密文：
      password_encrypted（v2 信封 `v2.<wrappedKey>.<nonce>.<ct>` 或旧版裸
      RSA-OAEP）+ encryption_key_id；出现明文 password 会被拒绝且响应与
      口令错误完全一致（反 oracle）。
    properties:
      identifier:
        type: string
        maxLength: 254
      password:
        type: string
        description: 明文口令；仅在登录加密关闭时接受。
      password_encrypted:
        type: string
        description: 前端加密载荷；开启加密时必填。
      encryption_key_id:
        type: string
        description: GET /api/auth/login/encryption-key 返回的 kid；与服务端槽位不匹配时按口令错误处理。
      turnstile_token:
        type: string
        description: |
          Cloudflare Turnstile 一次性令牌。Turnstile 开启时必填（缺失或校验失败
          403），关闭时忽略。支持两种提交形态：请求体字段，或
          `?turnstile_token=` 查询参数；两者同时出现时请求体优先（查询形态是
          中间件/handler 分支兼容，不是独立契约面）。

  TwoFAChallengeRequest:
    type: object
    additionalProperties: false
    required: [ticket, code]
    properties:
      ticket:
        type: string
        description: 登录响应中的一次性 ticket。
      code:
        type: string
        description: type=totp 时为 6 位 TOTP；type=backup 时为 XXXX-XXXX 备用码。
      type:
        type: string
        enum: [totp, backup]
        description: 缺省按 totp（兼容早期 {ticket,code} 契约）。
    description: |
      用 ticket 换正式会话。TOTP 连续 5 次错误作废 ticket；备用码原子核销，
      同一码并发提交只有一次成功。

  PasswordResetRequest:
    type: object
    additionalProperties: false
    required: [email]
    properties:
      email:
        type: string
        format: email
        maxLength: 254
      turnstile_token:
        type: string
        description: |
          Cloudflare Turnstile 一次性令牌。Turnstile 开启时必填（缺失或校验失败
          403），关闭时忽略；也接受 ?turnstile_token= 查询形态（两者同时出现时
          请求体优先）。
    description: |
      恒返回 204——邮箱存在与否响应完全一致（防枚举）；存在时投递一次性
      token（30 分钟）。限流与格式错误是仅有的差异化响应。

  PasswordResetValidateRequest:
    type: object
    additionalProperties: false
    required: [token]
    properties:
      token:
        type: string
        description: 重置链接中的一次性 token；本端点只校验不消费。

  PasswordResetValidateResponse:
    type: object
    additionalProperties: false
    required: [valid]
    properties:
      valid:
        type: boolean
        enum: [true]
        description: 有效时为 true；无效/过期不以 200 返回，而是 400 invalid_reset_token。

  PasswordResetConfirmRequest:
    type: object
    additionalProperties: false
    required: [token, new_password, confirm]
    properties:
      token:
        type: string
      new_password:
        type: string
        minLength: 8
        maxLength: 128
      confirm:
        type: string
        description: 必须与 new_password 一致。
    description: |
      原子消费 token → 改密 → 吊销该用户全部会话。成功 204；token 复用/过期
      400（并发提交只有一个能成功）。

  SetupRequest:
    type: object
    additionalProperties: false
    # confirmPassword / confirm_password 二选一（服务端优先前者，缺省回落到后者），
    # 因此不放进 required；两者都缺时 400。
    required: [site_title, server_address, username, email, password]
    properties:
      site_title:
        type: string
        minLength: 1
        maxLength: 64
      server_address:
        type: string
        format: uri
        description: 站点公开地址（用于生成邮件链接等）；必须是 http(s) URL。
      username:
        type: string
        pattern: '^[a-zA-Z0-9_-]{3,32}$'
      email:
        type: string
        format: email
      password:
        type: string
        minLength: 8
        maxLength: 128
      confirmPassword:
        type: string
        x-accepted-alias: confirm_password
        description: |
          必须与 password 一致。服务端为兼容历史客户端也接受下划线别名
          confirm_password（前者优先）；契约只登记 camelCase。
    description: |
      仅未初始化时可调用；三步字段建 admin 并写 system.install.completed_at
      （同事务）。幂等锚是 system_settings 该键，重复调用 409 + initialized=true。

  SetupResponse:
    type: object
    additionalProperties: false
    required: [user]
    properties:
      user:
        type: object
        additionalProperties: false
        required: [id, username, email, role, status, email_verified]
        properties:
          id:
            type: integer
            format: int64
          username:
            type: string
          email:
            type: string
          role:
            $ref: '#/schemas/UserRole'
          status:
            type: string
            enum: [enabled, disabled]
          email_verified:
            type: boolean
    description: 201 公开投影；绝不包含口令、哈希或任何密钥材料。

  SetupCompletedProblem:
    allOf:
      - $ref: '../components/problem.yaml#/schemas/Problem'
      - type: object
        properties:
          initialized:
            type: boolean
    description: |
      409 的 Problem 扩展：已初始化时带 initialized=true，让前端把重复提交
      直接导流到登录页（modules-01 F-01-20「已初始化标记」）；用户名/邮箱
      冲突的 409 不带该字段。该字段是 RFC 7807 允许的扩展成员。

  # ---------------------------------------------------------------------------
  # 公开排行榜（D6b；modules-09 F-09-29～F-09-33 / §C1.7）
  # ---------------------------------------------------------------------------

  RankingsPeriod:
    type: string
    enum: [today, week, month, year]
    x-enum-varnames: [RankingsPeriodToday, RankingsPeriodWeek, RankingsPeriodMonth, RankingsPeriodYear]
    description: 排行榜统计周期（缺省 week）。

  RankingsStatus:
    type: string
    enum: [ok, partial, empty]
    x-enum-varnames: [RankingsStatusOk, RankingsStatusPartial, RankingsStatusEmpty]
    description: empty=全窗口无模型达阈值（冷启动）；partial 当前不会产生。

  RankingsGranularity:
    type: string
    enum: [hour, day, week]
    x-enum-varnames: [RankingsGranularityHour, RankingsGranularityDay, RankingsGranularityWeek]
    description: 趋势桶粒度（today→hour、week/month→day、year→week）。

  LiveFeedUpstream:
    type: string
    enum: [openai, anthropic, gemini, unknown]
    x-enum-varnames: [LiveFeedUpstreamOpenai, LiveFeedUpstreamAnthropic, LiveFeedUpstreamGemini, LiveFeedUpstreamUnknown]
    description: 渠道类型映射的协议族；无来源为 unknown。

  LiveFeedStatus:
    type: string
    enum: [ok, error]
    x-enum-varnames: [LiveFeedStatusOk, LiveFeedStatusError]
    description: 调用结果（不暴露错误码细节）。

  RankingsResponse:
    type: object
    additionalProperties: false
    required:
      [period, timezone, window, computed_at, freshness_seconds,
       sample_threshold, status, models, movers, providers, trend]
    description: |
      GET /api/rankings 的完整快照投影。字段白名单：不含任何用户、令牌、
      渠道或上游名称维度。冷启动（从未生成过快照）时 status=empty 且
      computed_at/freshness_seconds 为 null；有快照时两者必有值。
    properties:
      period:
        $ref: '#/schemas/RankingsPeriod'
      timezone:
        type: string
        description: 统计窗口使用的站点时区（`site.timezone`，IANA 名）。
      window:
        $ref: '#/schemas/RankingsWindow'
      computed_at:
        anyOf:
          - type: string
            format: date-time
          - enum: [null]
        description: 快照聚合完成时刻（站点时区 RFC3339）；冷启动为 null。
      freshness_seconds:
        anyOf:
          - type: integer
            format: int64
            minimum: 0
          - enum: [null]
        description: 请求时刻与 computed_at 的差值；冷启动为 null。
      sample_threshold:
        type: integer
        minimum: 50
        maximum: 100000
        description: 本次快照采用的模型最小样本阈值 N（`site.rankings_min_samples`）。
      status:
        $ref: '#/schemas/RankingsStatus'
      models:
        type: array
        maxItems: 50
        items:
          $ref: '#/schemas/RankingsModel'
      movers:
        $ref: '#/schemas/RankingsMovers'
      providers:
        type: array
        items:
          $ref: '#/schemas/RankingsProvider'
      trend:
        $ref: '#/schemas/RankingsTrend'

  RankingsWindow:
    type: object
    additionalProperties: false
    required: [start, end]
    properties:
      start:
        type: string
        format: date-time
        description: 窗口起点（站点时区 RFC3339，含偏移）。
      end:
        type: string
        format: date-time
        description: 窗口终点（≥ start）。

  RankingsModel:
    type: object
    additionalProperties: false
    required: [rank, model, display_name, author, total_tokens, requests,
               delta_tokens, delta_pct, prev_rank]
    description: |
      模型榜一行。delta_tokens/delta_pct/prev_rank 可为 null：
      `prev_rank=null` 表示上一窗口样本不足或模型新增；`delta_pct=null`
      表示上一窗口该模型 token 为 0（前端显示「新增」）。D6a 聚合在
      「无上一窗口」时把 prev 视为 0，因此 `delta_tokens` 此时等于当前
      total_tokens；只有数据库确为 NULL 时才下发 null。
    properties:
      rank:
        type: integer
        minimum: 1
        description: 竞赛排名（并列同名次、下一名跳号）。
      model:
        type: string
        maxLength: 128
      display_name:
        type: string
        maxLength: 128
        description: 展示名快照；缺失时等于 model。
      author:
        type: string
        maxLength: 64
        description: 模型作者/供应商；缺失时为 Unknown。
      total_tokens:
        type: integer
        format: int64
        minimum: 0
      requests:
        type: integer
        format: int64
        minimum: 0
      delta_tokens:
        anyOf:
          - type: integer
            format: int64
          - enum: [null]
      delta_pct:
        anyOf:
          - type: number
            format: double
          - enum: [null]
        description: 环比百分比（保留 2 位）；上一窗口 token 为 0 时为 null。
      prev_rank:
        anyOf:
          - type: integer
            minimum: 1
          - enum: [null]

  RankingsMover:
    type: object
    additionalProperties: false
    required: [model, author, delta_pct, cur_tokens, prev_tokens]
    properties:
      model: {type: string, maxLength: 128}
      author: {type: string, maxLength: 64}
      delta_pct:
        type: number
        format: double
        description: 上升项 >0（降序）、下降项 <0（升序）。
      cur_tokens: {type: integer, format: int64, minimum: 0}
      prev_tokens: {type: integer, format: int64, minimum: 0}

  RankingsMovers:
    type: object
    additionalProperties: false
    required: [up, down]
    properties:
      up:
        type: array
        maxItems: 5
        items:
          $ref: '#/schemas/RankingsMover'
      down:
        type: array
        maxItems: 5
        items:
          $ref: '#/schemas/RankingsMover'

  RankingsProvider:
    type: object
    additionalProperties: false
    required: [rank, author, total_tokens, share_pct, slot]
    description: |
      作者/供应商排名一行。`series` 是可选字段：作者榜 Top 5 下发该周期的
      token 时间桶（与 `trend.buckets` 一一对齐），其余作者省略；Other 由
      前端按 100% 份额余量表达。
    properties:
      rank: {type: integer, minimum: 1}
      author: {type: string, maxLength: 64}
      total_tokens: {type: integer, format: int64, minimum: 0}
      share_pct:
        type: number
        format: double
        minimum: 0
        maximum: 100
        description: 占本窗口全部入榜 token 的比例；全表合计 100.00。
      slot:
        anyOf:
          - type: integer
            minimum: 1
            maximum: 8
          - enum: [null]
        description: 实体稳定色板槽位；色板耗尽时为 null（不回绕/不重排）。
      series:
        type: array
        items:
          type: integer
          format: int64
          minimum: 0
        description: |
          该作者当前周期的 token 桶，长度与 `trend.buckets` 相同、按下标对齐
          （缺失桶补 0）。只有作者榜 Top 5 返回；其余作者无此字段。

  RankingsTrendSeries:
    type: object
    additionalProperties: false
    required: [model, slot, tokens]
    properties:
      model:
        type: string
        maxLength: 128
        description: 模型名；归并系列固定为 Other。
      slot:
        anyOf:
          - type: integer
            minimum: 1
            maximum: 8
          - enum: [null]
        description: 实体稳定槽位；Other 无槽位（null）。
      tokens:
        type: array
        items: {type: integer, format: int64, minimum: 0}
        description: 长度等于 trend.buckets；缺失点为 0。

  RankingsTrend:
    type: object
    additionalProperties: false
    required: [granularity, buckets, series]
    description: |
      历史趋势：today→hour、week/month→day、year→week（R-D6-04）。
      series 最多 6 个实体 + Other（§C1.9）。
    properties:
      granularity:
        $ref: '#/schemas/RankingsGranularity'
      buckets:
        type: array
        items: {type: string, format: date-time}
        description: 时间桶起点（站点时区 RFC3339），升序。
      series:
        type: array
        maxItems: 7
        items:
          $ref: '#/schemas/RankingsTrendSeries'

  # ---------------------------------------------------------------------------
  # 首页实时调用动态（D6b；modules-09 F-09-02）
  # ---------------------------------------------------------------------------

  LiveFeedEvent:
    type: object
    additionalProperties: false
    required: [id, ts, model, upstream, tokens_in, tokens_out, latency_ms, status]
    description: |
      单条脱敏调用事件。绝不包含 user_id/username/email/IP/UA/令牌/
      channel_id/channel 名/base_url/prompt/response/request_id 原文，
      也不含费用（裁决 A-1：费用只在聚合条，且逐行受部署粒度影响）。
    properties:
      id:
        type: string
        pattern: '^[0-9a-f]{8}$'
        description: request_id 的不可逆 8 位十六进制短哈希，仅作列表 key。
      ts:
        type: string
        format: date-time
      model:
        type: string
        maxLength: 128
      upstream:
        $ref: '#/schemas/LiveFeedUpstream'
      tokens_in: {type: integer, minimum: 0}
      tokens_out: {type: integer, minimum: 0}
      latency_ms: {type: integer, format: int64, minimum: 0}
      status:
        $ref: '#/schemas/LiveFeedStatus'

  LiveFeedWindow:
    type: object
    additionalProperties: false
    required: [calls, cost_credits]
    description: |
      聚合条读数。窗口冻结为**近 60 秒**（F-09-02）：服务端按分钟桶累加
      当前分钟桶，属于 0–60s 近似（跨分钟时读数从整分钟重置到新桶）。
      calls 计所有已发布事件；cost_credits 只计成功事件的整数积分
      （失败/退款不计费用）。这是平台级聚合，不含任何单条调用费用，也不含
      用户/渠道维度。
    properties:
      calls:
        type: integer
        format: int64
        minimum: 0
        description: 近 60 秒调用次数（成功与失败都计入）。
      cost_credits:
        type: integer
        format: int64
        minimum: 0
        description: 近 60 秒成功调用的消耗积分（整数，取结算事实）。

  LiveFeedList:
    type: object
    additionalProperties: false
    required: [events, window]
    description: |
      轮询降级响应。事件按时间倒序（最新在前）。window 为 F-09-02 聚合条；
      逐行事件不含费用（裁决 A-1）。
    properties:
      events:
        type: array
        items:
          $ref: '#/schemas/LiveFeedEvent'
      window:
        $ref: '#/schemas/LiveFeedWindow'

  # 公告公开详情（D7b；modules-08 F-08-04 用户侧公开只读视图）。
  # 只暴露展示所需字段：不回传 Markdown 原文/管理面状态/操作者。
  PublicAnnouncement:
    type: object
    additionalProperties: false
    required: [id, title, category, content_html, published_at, expire_at]
    properties:
      id:
        type: string
        format: uuid
      title: {type: string}
      category:
        type: string
        enum: [notice, maintenance, release]
      content_html:
        type: string
        description: 服务端由 Markdown 渲染并净化的 HTML（原始 HTML 不解析、危险链接丢弃 href）。
      published_at:
        type: string
        format: date-time
        description: 公告对用户可见的发布时间（发布时刻；历史数据缺失时回退 publish_at）。
      expire_at:
        type: string
        format: date-time
        nullable: true
        description: null = 永久有效。

  # 公开模型性能（modules-09 F-09-25；数据源 usage_logs 的真实调用聚合）。
  # 无样本的字段为 null（前端显示「—」），sample_size 恒有值。
  PublicModelMetrics:
    type: object
    additionalProperties: false
    required: [range, window, summary, per_group]
    properties:
      range:
        type: string
        enum: [24h, 7d]
      window:
        type: object
        additionalProperties: false
        required: [start, end]
        properties:
          start: {type: string, format: date-time}
          end: {type: string, format: date-time}
      summary:
        type: object
        additionalProperties: false
        required: [sample_size]
        properties:
          avg_latency_ms:
            type: number
            nullable: true
            minimum: 0
          avg_ttft_ms:
            type: number
            nullable: true
            minimum: 0
          success_rate:
            type: number
            nullable: true
            minimum: 0
            maximum: 1
          tps:
            type: number
            nullable: true
            minimum: 0
          failed_24h:
            type: integer
            nullable: true
            minimum: 0
          sample_size:
            type: integer
            minimum: 0
      per_group:
        type: array
        items:
          $ref: '#/schemas/PublicGroupMetric'
      latest_test:
        anyOf:
          - $ref: '#/schemas/PublicModelLatestTest'
          - enum: [null]
        description: |
          最近一次管理员主动测速（`model_performance_tests` 汇总行）的公开
          投影。没有主动测试记录、测速库未装配或读取失败时为 null；这是一条
          独立于 `usage_logs` 的兜底来源，前端在真实调用样本缺失/不足时回退
          到它，并用「主动测试」标注来源。

  # 主动测速汇总（主库 model_performance_tests）。可空统计列保持 null：
  # 样本不足缺失的分位数不能用 0 冒充（0 会被读成「极快」）。
  PublicModelLatestTest:
    type: object
    additionalProperties: false
    required: [ttft_ms_p50, ttft_ms_p95, latency_ms_p50, latency_ms_p95, tps,
               success_rate, sample_size, tested_at]
    properties:
      ttft_ms_p50:
        type: integer
        nullable: true
        minimum: 0
        description: 首字延迟 P50（毫秒）；无有效样本时为 null。
      ttft_ms_p95:
        type: integer
        nullable: true
        minimum: 0
      latency_ms_p50:
        type: integer
        nullable: true
        minimum: 0
        description: 端到端延迟 P50（毫秒）；无有效样本时为 null。
      latency_ms_p95:
        type: integer
        nullable: true
        minimum: 0
      tps:
        type: number
        nullable: true
        minimum: 0
        description: 主动测试的平均输出速度（tokens/s）；无有效样本时为 null。
      success_rate:
        type: number
        minimum: 0
        maximum: 1
        description: 成功次数 / 总运行次数。
      sample_size:
        type: integer
        minimum: 0
        description: 本次测试的运行次数（runs）。
      tested_at:
        type: string
        format: date-time
        description: 测试完成时刻（RFC3339，UTC）。

  PublicGroupMetric:
    type: object
    additionalProperties: false
    required: [group]
    properties:
      group: {type: string}
      avg_ttft_ms:
        type: number
        nullable: true
        minimum: 0
      avg_latency_ms:
        type: number
        nullable: true
        minimum: 0
      success_rate:
        type: number
        nullable: true
        minimum: 0
        maximum: 1
