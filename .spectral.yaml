# Spectral 自定义规则集（platform-03 §10.1 / 本计划冻结最小 3 条规则）
# 注：$ref 越界（http(s)/绝对路径/../ 逃出 api/openapi/）由 scripts/check_openapi_layout.sh
# 强制校验——Spectral 在求值 given 前已解析 $ref，规则层无法观察原始引用值，故不在此重复实现。
extends: []
formats:
  - oas3_1
rules:
  newtg-problem-json-errors:
    description: 4xx/5xx 响应必须使用 application/problem+json（RFC 7807）；唯一例外是 /readyz 的 503——其就绪信封 {status,checks,version,node} 已冻结（platform-03 §4）
    message: "{{path}}: 4xx/5xx 响应缺少 application/problem+json"
    severity: error
    given: "$.paths[?(@property != '/readyz')][*].responses[?(@property.match(/^[45][0-9][0-9]$/))]"
    then:
      field: content.application/problem+json
      function: truthy

  newtg-valid-tags:
    description: operation 的 tag 必须在冻结的五个域内（ops/public/user/admin/relay）
    message: "{{path}}: tag 不在冻结集合内（实际：{{value}}）"
    severity: error
    given: "$.paths[*][*].tags[*]"
    then:
      function: pattern
      functionOptions:
        match: "^(ops|public|user|admin|relay)$"

  newtg-operation-id:
    description: 每个 operation 必须声明 operationId（唯一性与命名由 codegen/评审保证）
    message: "{{path}}: 缺少 operationId"
    severity: error
    given: "$.paths[*][get,put,post,delete,options,head,patch,trace]"
    then:
      field: operationId
      function: truthy
